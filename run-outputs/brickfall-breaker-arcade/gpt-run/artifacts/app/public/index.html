<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brickfall</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel auth"><h1>Brickfall</h1><div id="auth"></div></section>
    <section class="panel hud"><div id="hud"></div></section>
    <section class="panel game"><canvas id="game" width="800" height="600" tabindex="0" aria-label="Brickfall game canvas"></canvas></section>
    <section class="panel controls"><div id="controls"></div></section>
    <section class="panel lab"><h2>Mechanics lab</h2><div id="lab"></div></section>
    <section class="panel leaderboard"><h2>Leaderboard</h2><div id="leaderboard"></div></section>
    <section class="panel events"><h2>Events</h2><div id="events"></div></section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
