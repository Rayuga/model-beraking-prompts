<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brickfall - Arcade Brick Breaker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #0f3460;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #e94560 0%, #f39c12 100%);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .header-right {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .user-info {
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .user-info strong {
      display: block;
      font-size: 12px;
      opacity: 0.9;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: #2ecc71;
      color: #000;
    }

    .btn-primary:hover {
      background: #27ae60;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #3498db;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }

    .btn-danger:hover {
      background: #c0392b;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    .game-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .canvas-wrapper {
      background: #000;
      border: 3px solid #f39c12;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 900 / 600;
      max-width: 100%;
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #f39c12;
    }

    .hud-item {
      text-align: center;
    }

    .hud-label {
      font-size: 12px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 24px;
      font-weight: 700;
      color: #f39c12;
      margin-top: 5px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .keyboard-hint {
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
      margin-top: 10px;
    }

    .events-log {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #f39c12;
      border-radius: 8px;
      padding: 12px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 13px;
    }

    .event-item {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .event-item:last-child {
      border-bottom: none;
    }

    .event-item.score {
      color: #2ecc71;
    }

    .event-item.power {
      color: #f39c12;
    }

    .event-item.life {
      color: #e74c3c;
    }

    .event-item.level {
      color: #3498db;
    }

    .sign-in-form {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #f39c12;
      border-radius: 8px;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #f39c12;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2ecc71;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
    }

    .level-select {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #f39c12;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .level-select h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .level-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
    }

    .level-btn {
      padding: 10px;
      border: 2px solid #f39c12;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 13px;
    }

    .level-btn:hover {
      background: #f39c12;
      color: #000;
    }

    .level-btn.locked {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .level-btn.active {
      background: #2ecc71;
      border-color: #2ecc71;
      color: #000;
    }

    .leaderboard {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #f39c12;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .leaderboard h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .leaderboard-table {
      width: 100%;
      font-size: 13px;
      border-collapse: collapse;
    }

    .leaderboard-table th {
      text-align: left;
      padding: 8px;
      border-bottom: 2px solid #f39c12;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .leaderboard-table td {
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .leaderboard-table tr:hover {
      background: rgba(243, 156, 18, 0.1);
    }

    .status-message {
      background: rgba(46, 204, 113, 0.2);
      border: 1px solid #2ecc71;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .status-message.error {
      background: rgba(231, 76, 60, 0.2);
      border-color: #e74c3c;
    }

    .status-message.warning {
      background: rgba(241, 196, 15, 0.2);
      border-color: #f39c12;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #0f3460;
      border: 2px solid #f39c12;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .modal-content p {
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        text-align: center;
      }

      .header h1 {
        font-size: 20px;
      }

      .header-right {
        justify-content: center;
        width: 100%;
      }

      .hud {
        grid-template-columns: repeat(2, 1fr);
      }

      .level-buttons {
        grid-template-columns: repeat(3, 1fr);
      }

      .main-content {
        padding: 15px;
      }
    }

    .hidden {
      display: none !important;
    }

    .assist-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #f39c12;
      cursor: pointer;
      font-size: 13px;
    }

    .assist-toggle input {
      cursor: pointer;
    }

    .assist-toggle.active {
      background: rgba(46, 204, 113, 0.2);
      border-color: #2ecc71;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧱 BRICKFALL</h1>
      <div class="header-right">
        <div class="user-info" id="userInfo" style="display: none;">
          <strong id="userEmail"></strong>
          <span id="userName"></span>
        </div>
        <button class="btn btn-secondary" id="signInBtn" onclick="showSignIn()">Sign In</button>
        <button class="btn btn-danger" id="signOutBtn" onclick="signOut()" style="display: none;">Sign Out</button>
      </div>
    </div>

    <div class="main-content">
      <!-- Sign In Section -->
      <div id="signInSection" class="sign-in-form">
        <h2 style="margin-bottom: 20px; text-align: center;">Sign In</h2>
        <div class="form-group">
          <label for="emailInput">Email</label>
          <input type="email" id="emailInput" placeholder="mira@brickfall.test">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="password123">
        </div>
        <button class="btn btn-primary" onclick="handleSignIn()" style="width: 100%; margin-top: 10px;">Sign In</button>
        <div style="text-align: center; margin-top: 15px; font-size: 12px; opacity: 0.7;">
          Demo accounts: mira@brickfall.test, dev@brickfall.test, polly@brickfall.test<br>
          Password: password123
        </div>
      </div>

      <!-- Game Section -->
      <div id="gameSection" class="game-section" style="display: none;">
        <div id="statusMessage" class="status-message" style="display: none;"></div>

        <!-- Level Select -->
        <div id="levelSelect" class="level-select" style="display: none;">
          <h3>Select Level</h3>
          <div class="level-buttons" id="levelButtons"></div>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper">
          <canvas id="gameCanvas" width="900" height="600" role="img" aria-label="Game canvas"></canvas>
        </div>

        <!-- HUD -->
        <div class="hud">
          <div class="hud-item">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="scoreDisplay">0</div>
          </div>
          <div class="hud-item">
            <div class="hud-label">Lives</div>
            <div class="hud-value" id="livesDisplay">3</div>
          </div>
          <div class="hud-item">
            <div class="hud-label">Level</div>
            <div class="hud-value" id="levelDisplay">1</div>
          </div>
          <div class="hud-item">
            <div class="hud-label">Combo</div>
            <div class="hud-value" id="comboDisplay">x1</div>
          </div>
          <div class="hud-item">
            <div class="hud-label">Power-Up</div>
            <div class="hud-value" id="powerDisplay">—</div>
          </div>
          <div class="hud-item">
            <div class="hud-label">Revision</div>
            <div class="hud-value" id="revisionDisplay">—</div>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls">
          <div class="control-group">
            <button class="btn btn-primary" id="launchBtn" onclick="launchBall()" style="display: none;">Launch (Space)</button>
            <button class="btn btn-secondary" id="pauseBtn" onclick="togglePause()">Pause (P)</button>
            <button class="btn btn-danger" id="restartBtn" onclick="restartGame()" style="display: none;">Restart (R)</button>
          </div>
          <div class="assist-toggle" id="assistToggle">
            <input type="checkbox" id="assistCheckbox" onchange="toggleAssist()">
            <label for="assistCheckbox" style="margin: 0; cursor: pointer;">Assist Paddle</label>
          </div>
        </div>

        <!-- Events Log -->
        <div class="events-log" id="eventsLog"></div>

        <!-- Leaderboard -->
        <div class="leaderboard">
          <h3>Top 10 Leaderboard</h3>
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Player</th>
                <th>Score</th>
                <th>Level</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
