<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brickfall - Arcade Brick Breaker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Sign-in Screen -->
    <div id="signin-screen" class="screen active">
      <div class="signin-container">
        <h1>Brickfall</h1>
        <p class="subtitle">Brick Breaker Arcade</p>
        
        <form id="signin-form" class="signin-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="player@brickfall.test"
              value="mira@brickfall.test"
              autocomplete="email"
            >
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="password123"
              value="password123"
              autocomplete="current-password"
            >
          </div>
          
          <button type="submit" class="btn btn-primary">Sign In</button>
          
          <div class="demo-accounts">
            <p>Demo Accounts:</p>
            <button type="button" class="demo-btn" data-email="mira@brickfall.test">Mira Chen</button>
            <button type="button" class="demo-btn" data-email="dev@brickfall.test">Dev Patel</button>
            <button type="button" class="demo-btn" data-email="polly@brickfall.test">Polly Green</button>
          </div>
        </form>
        
        <div id="signin-error" class="error-message" style="display: none;"></div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
      <div class="game-wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
          <!-- User Info -->
          <div class="user-info">
            <div class="user-header">
              <button id="signout-btn" class="signout-btn" title="Sign out">⌂</button>
            </div>
            <div id="player-info" class="player-info">
              <div class="player-name"></div>
              <div class="player-initials"></div>
            </div>
          </div>

          <!-- Score & Stats -->
          <div class="stats-section">
            <div class="stat-row">
              <span class="stat-label">Score</span>
              <span id="score-display" class="stat-value">0</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Level</span>
              <span id="level-display" class="stat-value">1</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Lives</span>
              <span id="lives-display" class="stat-value">3</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Combo</span>
              <span id="combo-display" class="stat-value">×1</span>
            </div>
          </div>

          <!-- Power-Up Display -->
          <div id="power-display" class="power-display" style="display: none;">
            <div class="power-name" id="power-name"></div>
            <div class="power-timer" id="power-timer"></div>
          </div>

          <!-- Status Messages -->
          <div id="status-message" class="status-message"></div>

          <!-- Events Log -->
          <div id="events-log" class="events-log">
            <div class="events-header">Recent Events</div>
            <div id="events-list" class="events-list"></div>
          </div>

          <!-- Tabs -->
          <div class="tab-buttons">
            <button id="tab-menu" class="tab-btn active" data-tab="menu">Menu</button>
            <button id="tab-leaderboard" class="tab-btn" data-tab="leaderboard">Board</button>
            <button id="tab-history" class="tab-btn" data-tab="history">History</button>
            <button id="tab-lab" class="tab-btn" data-tab="lab">Lab</button>
          </div>

          <!-- Menu Tab -->
          <div id="tab-content-menu" class="tab-content active">
            <div class="menu-section">
              <h3>Start New Run</h3>
              <div id="levels-list" class="levels-list"></div>
              <button id="resume-run-btn" class="btn btn-secondary" style="display: none;">Resume Run</button>
            </div>

            <div class="menu-section">
              <h3>Keyboard Shortcuts</h3>
              <div class="shortcuts-list">
                <div class="shortcut"><span class="key">←/→</span> <span class="desc">Move paddle</span></div>
                <div class="shortcut"><span class="key">Space</span> <span class="desc">Launch ball</span></div>
                <div class="shortcut"><span class="key">P/Esc</span> <span class="desc">Pause</span></div>
                <div class="shortcut"><span class="key">R</span> <span class="desc">Restart</span></div>
              </div>
            </div>

            <div class="menu-section">
              <label class="checkbox-label">
                <input type="checkbox" id="assist-paddle-toggle">
                Assist Paddle
              </label>
            </div>
          </div>

          <!-- Leaderboard Tab -->
          <div id="tab-content-leaderboard" class="tab-content">
            <h3>Top 10 Players</h3>
            <div id="leaderboard-list" class="leaderboard-list"></div>
          </div>

          <!-- History Tab -->
          <div id="tab-content-history" class="tab-content">
            <h3>Your Run History</h3>
            <div id="history-list" class="history-list"></div>
          </div>

          <!-- Mechanics Lab Tab -->
          <div id="tab-content-lab" class="tab-content">
            <h3>Mechanics Lab</h3>
            <div id="drills-list" class="drills-list"></div>
            <div id="lab-telemetry" class="lab-telemetry" style="display: none;">
              <h4>Telemetry</h4>
              <div class="telemetry-row">
                <span class="telemetry-label">Phase</span>
                <span id="lab-phase" class="telemetry-value">-</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-label">Score</span>
                <span id="lab-score" class="telemetry-value">-</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-label">Lives</span>
                <span id="lab-lives" class="telemetry-value">-</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-label">Combo</span>
                <span id="lab-combo" class="telemetry-value">-</span>
              </div>
              <div class="telemetry-row">
                <span class="telemetry-label">Steps</span>
                <span id="lab-steps" class="telemetry-value">0</span>
              </div>
              <button id="lab-advance-btn" class="btn btn-secondary">Advance 1 Second</button>
              <button id="lab-reload-btn" class="btn btn-secondary">Reload Drill</button>
              <div id="lab-events" class="lab-events"></div>
            </div>
          </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-container">
          <canvas 
            id="game-canvas" 
            class="game-canvas"
            width="800"
            height="800"
            role="application"
            aria-label="Brickfall game canvas"
          ></canvas>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <button id="pause-btn" class="control-btn" title="Pause (P / Esc)">⏸ Pause</button>
        <button id="launch-btn" class="control-btn" title="Launch ball (Space)">▶ Launch</button>
        <button id="restart-btn" class="control-btn" title="Restart (R)">↻ Restart</button>
      </div>
    </div>
  </div>

  <script src="js/client.js"></script>
</body>
</html>
