<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brickfall</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sign-in Screen -->
    <div id="sign-in-screen" class="screen active">
      <div class="sign-in-form">
        <h1>Brickfall</h1>
        <form id="sign-in-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="mira@brickfall.test"
              aria-label="Email address"
            >
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="password123"
              aria-label="Password"
            >
          </div>
          <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <div id="sign-in-message" class="message"></div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
      <div class="game-container">
        <div class="header">
          <div class="player-info">
            <span id="player-name" class="player-name"></span>
            <button id="sign-out-btn" class="btn btn-small">Sign Out</button>
          </div>
          <div id="event-message" class="event-message"></div>
          <div class="revision-status">
            Revision: <span id="revision-display">-</span>
            <span id="sync-status" class="sync-status"></span>
          </div>
        </div>

        <div class="game-main">
          <div class="canvas-wrapper">
            <canvas 
              id="game-canvas" 
              width="378" 
              height="600"
              aria-label="Brick breaker game canvas"
            ></canvas>
          </div>

          <div class="hud">
            <div class="hud-section">
              <div class="hud-stat">
                <span class="label">Score</span>
                <span id="hud-score" class="value">0</span>
              </div>
              <div class="hud-stat">
                <span class="label">Lives</span>
                <span id="hud-lives" class="value">3</span>
              </div>
              <div class="hud-stat">
                <span class="label">Level</span>
                <span id="hud-level" class="value">1</span>
              </div>
            </div>

            <div class="hud-section">
              <div class="hud-stat">
                <span class="label">Combo</span>
                <span id="hud-combo" class="value">x1</span>
              </div>
              <div id="power-up-display" class="power-up-display" style="display: none;">
                <span id="power-up-name" class="label"></span>
                <div class="power-timer">
                  <div id="power-timer-bar" class="timer-bar"></div>
                </div>
              </div>
            </div>

            <div class="controls">
              <label class="checkbox-control">
                <input 
                  type="checkbox" 
                  id="assist-paddle" 
                  aria-label="Toggle assist paddle"
                >
                <span>Assist Paddle</span>
              </label>

              <div class="button-controls">
                <button id="launch-btn" class="btn btn-control" style="display: none;">Launch</button>
                <button id="pause-btn" class="btn btn-control">Pause (P)</button>
                <button id="continue-btn" class="btn btn-control" style="display: none;">Continue</button>
                <button id="restart-btn" class="btn btn-control" style="display: none;">Restart (R)</button>
              </div>
            </div>
          </div>
        </div>

        <div class="game-footer">
          <div class="tabs">
            <button class="tab-btn active" data-tab="menu-tab">Menu</button>
            <button class="tab-btn" data-tab="lab-tab">Mechanics Lab</button>
            <button class="tab-btn" data-tab="history-tab">Run History</button>
          </div>

          <div class="tab-content">
            <!-- Menu Tab -->
            <div id="menu-tab" class="tab-pane active">
              <div class="level-select">
                <h3>Select Level</h3>
                <div id="level-buttons" class="level-buttons"></div>
              </div>
              <div class="leaderboard-section">
                <h3>Top 10</h3>
                <div id="leaderboard" class="leaderboard"></div>
              </div>
              <div class="best-score">
                <span>Best Score:</span>
                <span id="best-score">0</span>
              </div>
            </div>

            <!-- Mechanics Lab Tab -->
            <div id="lab-tab" class="tab-pane">
              <div class="lab-controls">
                <h3>Mechanics Lab</h3>
                <div id="drill-list" class="drill-list"></div>
                <div class="lab-buttons">
                  <button id="advance-btn" class="btn btn-control" style="display: none;">
                    Advance 1 Second
                  </button>
                  <button id="reload-drill-btn" class="btn btn-control" style="display: none;">
                    Reload Drill
                  </button>
                </div>
              </div>
              <div id="lab-telemetry" class="lab-telemetry" style="display: none;">
                <h4>Telemetry</h4>
                <pre id="telemetry-output"></pre>
              </div>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-pane">
              <h3>Run History</h3>
              <div id="run-history" class="run-history"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
