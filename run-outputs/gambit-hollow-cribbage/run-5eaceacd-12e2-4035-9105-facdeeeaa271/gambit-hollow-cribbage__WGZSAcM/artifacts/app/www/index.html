<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambit Hollow - Cribbage Board</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-content">
        <h1 class="logo">Gambit Hollow</h1>
        <div class="nav-buttons">
          <button id="nav-board" class="nav-btn active">Board</button>
          <button id="nav-bench" class="nav-btn">Bench</button>
          <button id="nav-ladder" class="nav-btn">Ladder</button>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <!-- Board view -->
      <div id="board-view" class="view active">
        <div class="game-area">
          <!-- Game info -->
          <div class="game-info">
            <div class="info-row">
              <span id="info-hand">Hand 0</span>
              <span id="info-dealer">Dealer: -</span>
              <span id="info-turn">Turn: -</span>
            </div>
            <div class="info-row">
              <div class="player-info">
                <span id="info-player-a">Player A</span>
                <span id="info-score-a" class="score">0</span>
              </div>
              <div class="player-info">
                <span id="info-player-b">Player B</span>
                <span id="info-score-b" class="score">0</span>
              </div>
            </div>
          </div>

          <!-- Game buttons -->
          <div class="game-buttons">
            <button id="btn-new-game" class="btn btn-primary">New Game</button>
            <button id="btn-open-game" class="btn btn-secondary">Open Game</button>
            <button id="btn-practice" class="btn btn-secondary">Practice Deal</button>
          </div>

          <!-- Game state display -->
          <div id="game-state" style="display: none;">
            <!-- Peg board -->
            <div class="peg-board">
              <div id="pegs" class="pegs-container">
                <svg width="200" height="100" viewBox="0 0 200 100">
                  <!-- Peg positions will be drawn here -->
                </svg>
              </div>
              <div id="peg-scores" class="peg-scores">
                <div>Player A: <span id="peg-score-a">0</span></div>
                <div>Player B: <span id="peg-score-b">0</span></div>
              </div>
            </div>

            <!-- Cut card -->
            <div class="cut-area" id="cut-area" style="display: none;">
              <span>Cut:</span>
              <svg id="cut-card" width="60" height="90" viewBox="0 0 60 90"></svg>
            </div>

            <!-- Hand display -->
            <div class="hand-area">
              <div id="seat-a" class="seat">
                <div class="seat-label">Player A (You)</div>
                <div id="hand-a" class="hand"></div>
                <div id="crib-label-a" style="display: none;" class="crib-label">Your Crib</div>
              </div>
              <div id="seat-b" class="seat">
                <div class="seat-label">Player B</div>
                <div id="hand-b" class="hand"></div>
                <div id="crib-label-b" style="display: none;" class="crib-label">Opponent's Crib</div>
              </div>
            </div>

            <!-- Play area -->
            <div id="play-area" class="play-area" style="display: none;">
              <div class="pile-label">Pile: <span id="pile-count">0</span></div>
              <div id="pile" class="pile"></div>
              <div id="play-controls" class="play-controls"></div>
            </div>

            <!-- Discard area -->
            <div id="discard-area" class="discard-area" style="display: none;">
              <div class="discard-label">Select 2 cards to discard:</div>
              <div id="discard-hand" class="hand"></div>
              <button id="btn-discard" class="btn btn-primary">Confirm Discard</button>
            </div>

            <!-- Show area -->
            <div id="show-area" class="show-area" style="display: none;">
              <div id="show-content">
                <!-- Show scores will be displayed here -->
              </div>
              <button id="btn-next-hand" class="btn btn-primary" style="display: none;">Next Hand</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Scoring bench view -->
      <div id="bench-view" class="view">
        <div class="bench-area">
          <h2>Scoring Bench</h2>
          
          <div class="bench-input">
            <div class="bench-section">
              <label>Hand (4 cards):</label>
              <input type="text" id="bench-hand" placeholder="e.g., 5S 5H 5D JC" maxlength="20">
            </div>
            
            <div class="bench-section">
              <label>Cut:</label>
              <input type="text" id="bench-cut" placeholder="e.g., 5C" maxlength="3">
            </div>
            
            <div class="bench-section">
              <label>
                <input type="checkbox" id="bench-is-crib">
                Is Crib
              </label>
            </div>
            
            <button id="btn-bench-score" class="btn btn-primary">Score</button>
            <button id="btn-bench-clear" class="btn btn-secondary">Clear</button>
          </div>

          <div class="bench-examples">
            <label>Or select an example:</label>
            <select id="bench-examples" class="bench-select">
              <option value="">-- Choose a hand --</option>
            </select>
          </div>

          <div id="bench-result" class="bench-result" style="display: none;">
            <h3>Result</h3>
            <div class="score-breakdown">
              <div id="bench-breakdown"></div>
              <div class="score-total">
                <strong>Total: <span id="bench-total">0</span></strong>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Ladder view -->
      <div id="ladder-view" class="view">
        <div class="ladder-area">
          <h2>Ladder</h2>
          <table class="ladder-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Played</th>
                <th>Won</th>
                <th>%</th>
              </tr>
            </thead>
            <tbody id="ladder-body">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
