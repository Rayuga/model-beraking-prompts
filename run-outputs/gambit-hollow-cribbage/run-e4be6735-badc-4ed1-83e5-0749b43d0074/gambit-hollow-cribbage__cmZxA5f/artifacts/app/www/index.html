<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gambit Hollow Club Table</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Gambit Hollow</p>
      <h1>Cribbage club table</h1>
      <p class="subtle">Two-seat shared table, saved games, practice deals, and a scoring bench.</p>
    </div>
    <div class="seat-switcher" aria-label="Seat view">
      <button id="seat-a" class="chip active" type="button">Seat A view</button>
      <button id="seat-b" class="chip" type="button">Seat B view</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel wide" id="game-shell">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Saved tables</p>
          <h2>Open games and new deals</h2>
        </div>
        <div id="pending-box" class="pending" hidden></div>
      </div>
      <div class="grid-two">
        <div>
          <h3>Open games</h3>
          <div id="open-games" class="stack"></div>
        </div>
        <div>
          <h3>Start a game</h3>
          <div id="new-game-form"></div>
        </div>
      </div>
    </section>

    <section class="panel wide">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Board</p>
          <h2>Game state and pegs</h2>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
      <div id="board"></div>
      <div id="game-view"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Bench</p>
          <h2>Scoring bench</h2>
        </div>
      </div>
      <div id="bench"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Ladder</p>
          <h2>Members and history</h2>
        </div>
      </div>
      <div id="ladder"></div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
