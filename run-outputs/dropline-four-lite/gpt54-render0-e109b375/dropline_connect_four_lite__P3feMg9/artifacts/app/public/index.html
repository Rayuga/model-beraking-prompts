<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DropLine</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">DropLine</p>
          <h1>Connect Four for two people sharing one browser</h1>
        </div>
      </header>

      <main id="app-main">
        <section id="auth-view" class="panel auth-panel">
          <div class="panel-copy">
            <p class="eyebrow">Sign in</p>
            <h2>Resume your saved board state</h2>
            <p>
              Use one of the seeded demo accounts to pick up exactly where that account left off.
            </p>
          </div>

          <form id="login-form" class="stacked-form" novalidate>
            <label>
              <span>Email</span>
              <input id="login-email" name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              <span>Password</span>
              <input id="login-password" name="password" type="password" autocomplete="current-password" required />
            </label>
            <button type="submit" class="primary-button">Sign in</button>
            <p id="login-feedback" class="form-feedback" aria-live="polite"></p>
          </form>
        </section>

        <section id="game-view" class="game-shell" hidden>
          <div class="game-header panel">
            <div class="account-block">
              <p class="eyebrow">Signed in</p>
              <h2 id="signed-in-name"></h2>
              <p id="signed-in-email" class="muted"></p>
            </div>
            <button id="sign-out-button" type="button" class="secondary-button">Sign out</button>
          </div>

          <div class="game-layout">
            <section class="panel board-panel">
              <div class="board-status">
                <p id="game-status" class="status-text" role="status" aria-live="polite"></p>
                <p id="game-feedback" class="feedback-text" aria-live="polite"></p>
              </div>

              <div id="column-controls" class="column-controls" aria-label="Drop a piece in a column"></div>

              <div
                id="board-grid"
                class="board-grid"
                role="grid"
                aria-label="Connect Four board"
                aria-rowcount="6"
                aria-colcount="7"
              ></div>
            </section>

            <aside class="sidebar">
              <section class="panel totals-panel">
                <div class="section-heading">
                  <p class="eyebrow">Match totals</p>
                </div>
                <div class="totals-grid">
                  <div class="total-card red">
                    <span>Red wins</span>
                    <strong id="red-wins">0</strong>
                  </div>
                  <div class="total-card yellow">
                    <span>Yellow wins</span>
                    <strong id="yellow-wins">0</strong>
                  </div>
                  <div class="total-card neutral">
                    <span>Draws</span>
                    <strong id="draws">0</strong>
                  </div>
                </div>
              </section>

              <section class="panel actions-panel">
                <div class="section-heading">
                  <p class="eyebrow">Round actions</p>
                </div>
                <div class="actions-grid">
                  <button id="new-game-button" type="button" class="primary-button">New game</button>
                  <button id="undo-button" type="button" class="secondary-button">Undo</button>
                  <button id="redo-button" type="button" class="secondary-button">Redo</button>
                </div>
              </section>

              <section class="panel history-panel">
                <div class="section-heading">
                  <p class="eyebrow">Move history</p>
                </div>
                <ol id="move-history" class="history-list"></ol>
              </section>
            </aside>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
