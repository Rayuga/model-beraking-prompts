<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropLine - Connect Four</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Sign-in view -->
    <div id="signin-view" class="view active">
      <div class="signin-container">
        <h1>DropLine</h1>
        <p class="subtitle">Connect Four for Two</p>
        
        <form id="signin-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          
          <div id="signin-error" class="error-message" aria-live="polite"></div>
          
          <button type="submit" class="btn btn-primary">Sign In</button>
          
          <div class="demo-credentials">
            <p>Demo accounts:</p>
            <ul>
              <li>avery@dropline.test / password123</li>
              <li>jordan@dropline.test / password123</li>
            </ul>
          </div>
        </form>
      </div>
    </div>

    <!-- Game view -->
    <div id="game-view" class="view">
      <header class="game-header">
        <div class="account-info">
          <span id="account-name" aria-label="Current account"></span>
          <button id="signout-btn" class="btn btn-secondary btn-small">Sign Out</button>
        </div>
      </header>

      <main class="game-container">
        <section class="game-board-section">
          <h2 class="sr-only">Connect Four Board</h2>
          <div id="status" class="status-message" aria-live="polite" aria-atomic="true"></div>
          
          <div class="board-controls">
            <div class="drop-buttons">
              <button class="drop-btn" data-column="1" aria-label="Drop in column 1">1</button>
              <button class="drop-btn" data-column="2" aria-label="Drop in column 2">2</button>
              <button class="drop-btn" data-column="3" aria-label="Drop in column 3">3</button>
              <button class="drop-btn" data-column="4" aria-label="Drop in column 4">4</button>
              <button class="drop-btn" data-column="5" aria-label="Drop in column 5">5</button>
              <button class="drop-btn" data-column="6" aria-label="Drop in column 6">6</button>
              <button class="drop-btn" data-column="7" aria-label="Drop in column 7">7</button>
            </div>
          </div>

          <div class="board" role="grid" aria-label="Connect Four game board with 6 rows and 7 columns">
            <!-- Grid cells generated by JavaScript -->
          </div>
        </section>

        <aside class="game-sidebar">
          <section class="scores">
            <h3>Match Totals</h3>
            <div class="score-item">
              <span class="score-label red-text">Red wins</span>
              <span id="red-wins" class="score-value">0</span>
            </div>
            <div class="score-item">
              <span class="score-label yellow-text">Yellow wins</span>
              <span id="yellow-wins" class="score-value">0</span>
            </div>
            <div class="score-item">
              <span class="score-label">Draws</span>
              <span id="draws" class="score-value">0</span>
            </div>
          </section>

          <section class="history">
            <h3>Move History</h3>
            <button id="new-game-btn" class="btn btn-secondary" aria-label="Start a new game">New Game</button>
            
            <div class="history-controls">
              <button id="undo-btn" class="btn btn-secondary btn-small" aria-label="Undo last move">Undo</button>
              <button id="redo-btn" class="btn btn-secondary btn-small" aria-label="Redo undone move">Redo</button>
            </div>

            <ol id="move-list" class="move-list" aria-label="List of moves in current game">
              <!-- Moves added here -->
            </ol>
          </section>
        </aside>
      </main>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
