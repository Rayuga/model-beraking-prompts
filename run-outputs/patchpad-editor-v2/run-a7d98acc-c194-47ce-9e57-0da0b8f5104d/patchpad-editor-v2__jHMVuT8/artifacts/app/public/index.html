<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PatchPad</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand">PatchPad</div>
          <div id="documentMeta" class="document-meta">Loading report…</div>
        </div>
        <div class="report-list-block">
          <div class="section-label">Available reports</div>
          <div id="documentList" class="document-list"></div>
        </div>
      </header>

      <section class="toolbar" aria-label="Editor actions">
        <button id="saveButton" class="primary">Save</button>
        <button id="undoButton">Undo</button>
        <button id="redoButton">Redo</button>
        <div class="toolbar-group" role="group" aria-label="Find and replace">
          <label>
            <span>Find</span>
            <input id="findInput" type="text" placeholder="Search within the report" />
          </label>
          <label>
            <span>Replace</span>
            <input id="replaceInput" type="text" placeholder="Replacement text" />
          </label>
          <button id="findPrevButton">Find Previous</button>
          <button id="findNextButton">Find Next</button>
          <button id="replaceCurrentButton">Replace Current</button>
          <button id="replaceAllButton">Replace All</button>
        </div>
      </section>

      <main class="workspace">
        <section class="editor-panel">
          <div class="panel-header">
            <div class="section-label">Editor</div>
            <div id="statusLine" class="status-line">Loading…</div>
          </div>
          <div id="editorViewport" class="editor-viewport" tabindex="0" aria-label="Report editor"></div>
          <div class="status-bar">
            <div id="cursorInfo">Line 1, Column 1</div>
            <div id="saveInfo">Not loaded</div>
          </div>
        </section>

        <aside class="side-panel">
          <section class="history-panel">
            <div class="panel-header">
              <div class="section-label">Revision history</div>
              <div id="historySummary" class="status-line"></div>
            </div>
            <div id="revisionHistory" class="revision-history"></div>
          </section>

          <section class="preview-panel">
            <div class="panel-header">
              <div class="section-label">Revision preview</div>
              <div id="previewLabel" class="status-line">Nothing selected</div>
            </div>
            <pre id="revisionPreview" class="revision-preview">Select a revision to preview it.</pre>
            <div class="preview-actions">
              <button id="restoreRevisionButton">Restore revision into editor</button>
            </div>
          </section>
        </aside>
      </main>

      <footer class="footer">
        <div id="messageBanner" class="message-banner">Loading PatchPad…</div>
      </footer>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
