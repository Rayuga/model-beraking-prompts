<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatchPad - Incident Report Editor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 id="report-title" class="report-title">Northwind API Incident Report</h1>
      <div class="header-controls">
        <span id="save-status" class="save-status saved">Saved</span>
        <span id="revision-display" class="revision-display">Revision 1</span>
      </div>
    </header>

    <!-- Main content area -->
    <div class="main-content">
      <!-- Editor area -->
      <div class="editor-wrapper">
        <!-- Editor toolbar -->
        <div class="editor-toolbar">
          <div class="toolbar-group">
            <button id="btn-save" class="btn btn-primary" title="Save (Ctrl+S)">Save</button>
            <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)">↶ Undo</button>
            <button id="btn-redo" class="btn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
          </div>
          <div class="toolbar-group">
            <input id="find-input" class="find-input" type="text" placeholder="Find..." title="Find (Ctrl+F)">
            <span id="find-count" class="find-count"></span>
            <button id="btn-find-prev" class="btn" title="Find Previous (Shift+Enter)">↑ Prev</button>
            <button id="btn-find-next" class="btn" title="Find Next (Enter)">↓ Next</button>
          </div>
          <div class="toolbar-group">
            <button id="btn-replace-toggle" class="btn" title="Toggle Replace">Replace</button>
            <div id="replace-controls" class="replace-controls" style="display: none;">
              <input id="replace-input" class="replace-input" type="text" placeholder="Replace with...">
              <button id="btn-replace-one" class="btn" title="Replace This">Replace</button>
              <button id="btn-replace-all" class="btn" title="Replace All">Replace All</button>
            </div>
          </div>
        </div>

        <!-- Editor container -->
        <div class="editor-container">
          <div class="line-numbers" id="line-numbers"></div>
          <div class="editor-pane" id="editor-pane">
            <div class="cursor-layer" id="cursor-layer"></div>
            <div class="text-content" id="text-content"></div>
            <textarea
              id="editor-input"
              class="editor-input"
              spellcheck="false"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
            ></textarea>
          </div>
        </div>

        <!-- Status bar -->
        <div class="status-bar">
          <span id="cursor-position">Line 1, Column 1</span>
        </div>
      </div>

      <!-- Sidebar: Revision history -->
      <aside class="revision-sidebar">
        <h2>Revision History</h2>
        <div id="revision-list" class="revision-list"></div>
      </aside>
    </div>
  </div>

  <!-- Conflict notification -->
  <div id="conflict-notification" class="notification conflict-notification" style="display: none;">
    <div class="notification-content">
      <h3>Conflict Detected</h3>
      <p id="conflict-message">Another tab has saved changes. Your edits are preserved below.</p>
      <div class="notification-actions">
        <button id="btn-reload" class="btn btn-danger">Reload from Server</button>
        <button id="btn-keep-draft" class="btn">Keep My Edits</button>
      </div>
    </div>
  </div>

  <!-- Preview modal -->
  <div id="preview-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="preview-title">Preview Revision</h2>
        <button id="btn-close-preview" class="btn-close">×</button>
      </div>
      <div id="preview-body" class="preview-body"></div>
      <div class="modal-footer">
        <button id="btn-restore-preview" class="btn btn-primary">Restore This Version</button>
        <button id="btn-cancel-preview" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/editor.js"></script>
</body>
</html>
