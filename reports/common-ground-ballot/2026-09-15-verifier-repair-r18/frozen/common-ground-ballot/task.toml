schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/common-ground-ballot"
version = "1.0.0"
description = "Private membership ballot workspace with fixed eligibility, anonymous results, revision-safe lifecycle controls, durable audit history, and recovery of interrupted staff work."
keywords = ["webdev", "codearena", "full-stack", "nodejs", "express", "sqlite", "ballot", "voting", "privacy", "forms", "authentication", "browser-judge", "rewardkit"]

[metadata]
difficulty = "medium"
difficulty_explanation = "A compact six-workspace product combines two ballot methods, fixed eligibility, anonymous choice storage, identified turnout, exact result math, durable sessions, role boundaries, optimistic revisions, idempotent write receipts, and account-isolated recovery of interrupted staff actions across reloads and tabs."
category = "Software"
tags = ["full-stack", "forms", "authentication", "sqlite", "private-ballots", "optimistic-concurrency", "idempotency", "accessibility"]
provenance = "Common Ground brief and golden implementation aligned to the current five-dimension standard; historical scores belong to earlier packages."
arena_slice = "full-stack-node-express-sqlite-common-ground-ballot"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
