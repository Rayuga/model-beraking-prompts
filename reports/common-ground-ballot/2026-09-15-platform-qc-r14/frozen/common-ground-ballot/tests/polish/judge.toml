[judge]
mode = "batched"
timeout = 900
isolated = false
temperature = 0
weight = 0.2
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "responsive_workspace_navigation"
name = "responsive_workspace_navigation"
type = "binary"
weight = 3.0
description = """
At approximately 390 by 844 after sign-in, require no horizontal page overflow, clipped primary actions, or unusable overlays. Ballots, Vote, Turnout, Results, Members, and Audit must remain reachable and show distinct meaningful content across the appropriate roles: use staff for identified turnout, Members and Audit, and a Member for Vote. Do not require every role to access restricted staff content or to have voting rights. The signed-in name and role must be readable, and both sign-out controls must remain reachable, directly or through a usable account menu. Repeat a representative check on desktop.
"""

[[criterion]]
id = "accessible_keyboard_forms"
name = "accessible_keyboard_forms"
type = "binary"
weight = 3.0
description = """
Use keyboard navigation through sign-in and a representative ballot or voting form. Require visible focus, logical focus order, associated labels or accessible names, keyboard-operable choices and buttons, a closeable dialog with contained focus and return to its invoking control when the app uses a dialog; a normal inline form is also valid, and navigation/main landmarks with meaningful headings.
"""

[[criterion]]
id = "persistent_action_feedback"
name = "persistent_action_feedback"
type = "binary"
weight = 3.0
description = """
Trigger one validation refusal and one successful action through visible controls. Each must provide specific in-context feedback; the refusal must remain readable until dismissed or replaced by another completed action. Current status, unavailable actions, and one-final-vote consequences must be understandable without relying on color alone.
"""

[[criterion]]
id = "theme_switch_preserves_workspace"
name = "theme_switch_preserves_workspace"
type = "binary"
weight = 1.0
description = """
Use the visible theme control in both directions. Require a usable light/dark presentation without losing content or the active workspace. Grade the control's state preservation and usable operation here; the Visual criteria own colour, contrast and visual consistency.
"""

[[criterion]]
id = "comfortable_touch_targets"
name = "comfortable_touch_targets"
type = "binary"
weight = 1.0
description = """
At approximately 390 by 844, inspect representative controls for comfortable touch targets and spacing, then activate them with touch input. Require the intended action without overlap, clipping or accidental activation of adjacent controls. Do not invent a mandatory 44px minimum: a 36px control alone is not a failure when the brief states no pixel threshold. Grade touch activation here; responsive_workspace_navigation owns page overflow and workspace reachability.
"""

[[criterion]]
id = "reduced_motion_preference"
name = "reduced_motion_preference"
type = "binary"
weight = 1.0
description = """
Emulate prefers-reduced-motion: reduce before interacting with a representative view change, form and feedback transition. Require nonessential movement to be removed or substantially reduced compared with ordinary motion, with all controls and essential information still usable. A UI with no nonessential animation in either mode satisfies this requirement. Record the observed motion or computed transition/animation behavior; a working static screenshot alone does not prove the preference is respected. Grade this independently of theme switching and touch targets.
"""
