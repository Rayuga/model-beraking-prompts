[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "public_control_responds"
name = "public_control_responds"
type = "binary"
weight = 1.0
description = """
Before signing in for the shared browser gate, use one obvious public control, such as opening Demo access and choosing a demo account. Require it to respond visibly while the page remains usable. The dimension's shared authentication and backend gate still applies.
"""
