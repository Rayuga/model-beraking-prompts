[judge]
mode = "batched"
timeout = 1800
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"


[[criterion]]
id = "workspace_navigation"
name = "workspace_navigation"
type = "binary"
weight = 1.0
description = """
After the shared gate, at desktop size use the visible navigation to reach Ballots, Turnout, Results, Members and Audit as Ruth, and Vote as Leila in a separate signed-in context. Require distinct substantive surfaces for all six requested workspaces and a usable return path. This grades navigation and workspace presence, not initial page load, demo-account buttons or the mobile layout. Do not require restricted content to be available to an unauthorized role; navigation alone does not require a mutation. The separate working_ballot_journey prerequisite owns the fresh write workflow.
"""

[[criterion]]
id = "working_ballot_journey"
name = "working_ballot_journey"
type = "binary"
weight = 1.0
description = """
Complete one genuine new ballot journey through visible controls, using a dedicated uniquely named single-choice ballot with two distinct choices. As Ruth create its Draft and Open it; as an eligible Member in a separate authenticated browser context submit one choice; as Ruth Close and Publish that same ballot. Observe the actual business mutations and subsequent protected reads. After ordinary reload in both contexts, the new ballot must still be Published and its participation/result must reflect that Member's accepted vote. Match the fresh record by its observed identity or unique content, not a seeded ballot or success message. Missing controls, refused or ineffective transitions, a cosmetic success with unchanged server records, or an unrecorded vote fail this criterion. The core journey uses one fixture and five normal business writes; conditional roster setup is described in the prompt. No edit, negative-probe matrix, receipt replay or extra process restart is needed. Do not judge exact revision increments, tie/percentage math, role/privacy boundaries, input validation, audit fidelity, recovery or appearance here; existing criteria own those details. This is a minimum working-product prerequisite in Render's all_pass gate, with no independent final reward contribution. A read-only product fails even if it has real sign-in, SQLite-backed seeded reads and excellent presentation.
"""
