<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Common Ground Ballot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="sign-in" class="login-shell">
      <section class="card" aria-labelledby="login-title">
        <p class="eyebrow">Riverside Residents Association</p>
        <h1 id="login-title">Common Ground</h1>
        <p>Sign in to coordinate, observe, or take part in a ballot.</p>
        <form id="login-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Sign in</button>
        </form>
        <details>
          <summary>Use a demo account</summary>
          <div class="demo-list">
            <button type="button" data-email="ruth.adebayo@commonground.example">Ruth · Coordinator</button>
            <button type="button" data-email="arun.das@commonground.example">Arun · Observer</button>
            <button type="button" data-email="leila.ward@commonground.example">Leila · Member</button>
            <button type="button" data-email="owen.park@commonground.example">Owen · Member</button>
          </div>
        </details>
      </section>
    </main>

    <div id="workspace" class="hidden">
      <header><strong>Common Ground</strong><button id="theme" type="button">Change theme</button></header>
      <nav aria-label="Primary navigation">
        <button type="button" data-view="ballots">Ballots</button>
        <button type="button" data-view="vote">Vote</button>
        <button type="button" data-view="turnout">Turnout</button>
        <button type="button" data-view="results">Results</button>
        <button type="button" data-view="members">Members</button>
        <button type="button" data-view="audit">Audit</button>
      </nav>
      <main class="content">
        <p class="eyebrow">Private member decisions</p>
        <h1 id="view-title">Ballots</h1>
        <p id="view-copy">Connect this shell to the seeded ballot records and server rules.</p>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
