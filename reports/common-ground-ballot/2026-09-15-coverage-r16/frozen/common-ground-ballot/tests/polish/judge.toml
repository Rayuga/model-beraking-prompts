[judge]
mode = "batched"
timeout = 900
isolated = false
temperature = 0
weight = 0.2
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"


[[criterion]]
id = "responsive_workspace_navigation"
name = "responsive_workspace_navigation"
type = "binary"
weight = 3.0
description = """
At approximately 390 by 844 after sign-in, inspect all six requested workspaces across appropriate staff and Member roles. Require no horizontal page overflow, clipped primary actions, unusable overlays or unreadable signed-in identity. Both sign-out controls remain reachable directly or through an account menu. Compare a representative desktop view. Render owns the existence/navigation of the six workspaces; this criterion owns their usability at the narrow viewport.
"""

[[criterion]]
id = "keyboard_control_operation"
name = "keyboard_control_operation"
type = "binary"
weight = 1.0
description = """
Use keyboard navigation through sign-in, workspace navigation and a representative ballot or voting form. Require logical order and keyboard-operable choices and buttons, without a keyboard trap. This grades operation; accessible names and focus visibility have separate criteria.
"""

[[criterion]]
id = "semantic_labels_and_landmarks"
name = "semantic_labels_and_landmarks"
type = "binary"
weight = 1.0
description = """
Inspect sign-in and a representative ballot/voting form. Require associated labels or meaningful accessible names, navigation/main landmarks and real headings. Grade semantic identification independently of keyboard operation or focus styling.
"""

[[criterion]]
id = "visible_and_managed_focus"
name = "visible_and_managed_focus"
type = "binary"
weight = 1.0
description = """
Tab through sign-in and a representative form. Require visible focus. If a modal is used, focus stays inside while open, closing is possible, and focus returns to its invoking control. A normal inline form is valid. Grade focus behavior independently of semantic labels and general keyboard activation.
"""

[[criterion]]
id = "persistent_action_feedback"
name = "persistent_action_feedback"
type = "binary"
weight = 3.0
description = """
Trigger one validation refusal and one successful action through visible controls; the wrong-password then valid sign-in sequence may be used. Each provides specific feedback in context. The refusal remains readable until dismissed or replaced by another completed action, and the interface remains recoverable. Grade message usefulness and persistence here; business correctness, final-vote privacy and lifecycle state are Functional observations.
"""

[[criterion]]
id = "status_text_without_color"
name = "status_text_without_color"
type = "binary"
weight = 1.0
description = """
Inspect actual Ballots, Members and Turnout records as Ruth. Require visible text that identifies each ballot's lifecycle state, each member's active/paused state and each turnout row's participated/pending state without needing its color. Check all four lifecycle states, both membership states and both participation states using current records or the shared UI-created presentation controls. Associate the text with the individual record; an unrelated aggregate count, colored dot alone, color-only legend or screen-reader-only name does not provide the requested visible status text. Inspect representative desktop and approximately 390 by 844 views in light and dark themes. Grade the presence and usability of non-color status text here; Visual owns palette and contrast, and Functional owns whether the underlying status is correct. Do not change DOM/CSS to create evidence.
"""

[[criterion]]
id = "unavailable_action_guidance"
name = "unavailable_action_guidance"
type = "binary"
weight = 1.0
description = """
Review the lifecycle actions on Draft, Open, Closed and Published ballots as Ruth before attempting an invalid action. Require unavailable actions to be disabled or explained in the surrounding UI: drafts cannot Close/Publish yet; Open definitions cannot be edited and results cannot be published before Close; Closed ballots cannot accept votes or reopen; Published ballots allow no further edit/lifecycle action. Omitted controls are valid when their unavailability is explained in context; do not require every action to be rendered. An apparently available invalid action with no explanation that merely yields a generic server error fails, even if the backend correctly refuses it. Confirm applicable actions remain discoverable as positive controls without executing invalid writes. Also inspect the ordinary Observer read-only view and the Member's recorded-participation view for disabled or explained unavailable changes/submission. Score the user guidance only: server enforcement, transition success and feedback from another action have separate criteria. Use equivalent language; no exact copy or layout is required.
"""

[[criterion]]
id = "theme_switch_preserves_workspace"
name = "theme_switch_preserves_workspace"
type = "binary"
weight = 1.0
description = """
Use the visible theme control in both directions. Require a usable light/dark presentation without losing content or the active workspace. Grade the control's state preservation and usable operation here; the Visual criteria own colour, contrast and visual consistency.
"""

[[criterion]]
id = "comfortable_touch_targets"
name = "comfortable_touch_targets"
type = "binary"
weight = 1.0
description = """
At approximately 390 by 844, inspect representative controls for comfortable touch targets and spacing, then activate them with touch input. Require the intended action without overlap, clipping or accidental activation of adjacent controls. Do not invent a mandatory 44px minimum: a 36px control alone is not a failure when the brief states no pixel threshold. Grade touch activation here; responsive_workspace_navigation owns page overflow and workspace reachability.
"""

[[criterion]]
id = "reduced_motion_preference"
name = "reduced_motion_preference"
type = "binary"
weight = 1.0
description = """
Emulate prefers-reduced-motion: reduce before interacting with a representative view change, form and feedback transition. Require nonessential movement to be removed or substantially reduced compared with ordinary motion, with all controls and essential information still usable. A UI with no nonessential animation in either mode satisfies this requirement. Record the observed motion or computed transition/animation behavior; a working static screenshot alone does not prove the preference is respected. Grade this independently of theme switching and touch targets.
"""
