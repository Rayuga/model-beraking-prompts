[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"


[[criterion]]
id = "health_endpoint"
name = "health_endpoint"
type = "binary"
weight = 1.0
description = """
Use the browser's same-origin request context to request GET /api/health. Require a successful HTTP response from the running app. Grade only the documented health endpoint here; root-page loading, authentication and refresh are covered by the shared browser gate.
"""

[[criterion]]
id = "sqlite_persistence"
name = "sqlite_persistence"
type = "binary"
weight = 1.0
description = """
Use the trusted terminal only for a read-only inspection of the verifier-launched database identified in /logs/verifier/app-lifecycle.json. Confirm it is a real SQLite database, not an empty placeholder, with the current ballots, membership, sessions, participation, votes, replay receipts and audit represented in its schema. Compare a current ballot identity/status/revision and its published tally with observed protected responses. Accept any table/column names or normalized/JSON storage structure. Never modify the database or expose unpublished choices.
"""
