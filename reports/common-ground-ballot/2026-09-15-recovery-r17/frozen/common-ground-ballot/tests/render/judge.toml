[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"


[[criterion]]
id = "workspace_navigation"
name = "workspace_navigation"
type = "binary"
weight = 1.0
description = """
After the shared gate, at desktop size use the visible navigation to reach Ballots, Turnout, Results, Members and Audit as Ruth, and Vote as Leila in a separate signed-in context. Require distinct substantive surfaces for all six requested workspaces and a usable return path. This grades navigation and workspace presence, not initial page load, demo-account buttons or the mobile layout. Do not require restricted content to be available to an unauthorized role; no ballot mutation is needed.
"""
