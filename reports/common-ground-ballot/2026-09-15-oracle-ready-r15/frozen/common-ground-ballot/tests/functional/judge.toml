[judge]
mode = "batched"
timeout = 9000
isolated = false
temperature = 0
weight = 0.6
prompt_template = "prompt.md"
[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]
[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "authenticated_role_identity"
name = "authenticated_role_identity"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Sign in separately with all four documented accounts. Each protected workspace must identify that person's name and stated role, under Riverside Residents Association. The shared gate already grades wrong-password rejection; do not score that same observation again here.
"""

[[criterion]]
id = "seeded_ballot_and_roster_records"
name = "seeded_ballot_and_roster_records"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Before the functional mutations, inspect the staff records. Require exactly the supplied Annual picnic date draft, Courtyard closing time open, Shared-space improvements closed and Garden location published ballots, with their specified methods, choices and revisions. The roster starts with active Leila and paused Owen. Inspect actual protected records, not login hints. These are one seed-integrity check.
"""

[[criterion]]
id = "ordinary_session_revocation"
name = "ordinary_session_revocation"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Use the shared Session Check Sequence with independent Ruth A and B contexts. Normal Sign out in A must revoke its server session: the original protected read and its privately retained ended credential are refused with no protected records. B remains authenticated after refresh. Follow with a fresh visible sign-in for A. Retain credentials privately; clearing a browser cookie alone proves nothing. This criterion grades ordinary sign-out only.
"""

[[criterion]]
id = "all_sessions_revocation"
name = "all_sessions_revocation"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
After normal sign-in establishes two independent Ruth sessions, use End all sessions in A following the shared separate-call native-dialog protocol. Both A and B must lose protected access before and after refresh; privately replay each ended credential against its observed protected read and require refusal with no records. A fresh visible sign-in afterward must succeed. This criterion grades revocation of all sessions, independently of normal sign-out.
"""

[[criterion]]
id = "draft_input_validation"
name = "draft_input_validation"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Run every independent invalid-draft case in Exact Draft Controls, resetting its stated valid base before each: blank title, blank choice, fewer than two choices, repeated labels, approval maximum zero, and maximum four for three choices. Require prevention or a visible refusal with no new ballot or audit event. Native validation or controls preventing an invalid value are accepted; do not submit a now-valid form and call it invalid. Retain actual values and evidence for each. The later valid creation is its positive control, whose resulting record is graded separately.
"""

[[criterion]]
id = "draft_creation"
name = "draft_creation"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Through the UI create the distinctive valid approval draft Verifier room use, optional context Reserve the shared room, choices Morning/Afternoon/Evening, maximum two. Require exactly one revision-1 draft with that content after a protected reread and reload. Audit-event content has its own criterion. Invalid-input refusal belongs to draft_input_validation.
"""

[[criterion]]
id = "draft_edit"
name = "draft_edit"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Visibly edit Verifier room use to Verifier room schedule while retaining approval up to two and the three choices. Require its content to persist and revision to advance once (1 to 2) after reload, before opening. Grade this accepted edit independently of Open or the subsequent edit lock.
"""

[[criterion]]
id = "ballot_open_transition"
name = "ballot_open_transition"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Open the valid Verifier room schedule draft through Ruth's UI. Require Open status and exactly one revision advance (2 to 3) while its definition remains intact after reload. fixed_eligibility_snapshot owns which members were captured; open_definition_lock owns refusal of later edits.
"""

[[criterion]]
id = "open_definition_lock"
name = "open_definition_lock"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
After opening Verifier room schedule, use its previously successful edit shape as Ruth, a fresh operation ID and the current Open revision. Require refusal and unchanged wording, method, choices, status and revision after reread. This otherwise authorized edit isolates the Open-state definition lock; a stale revision or malformed form does not prove it.
"""

[[criterion]]
id = "fixed_eligibility_snapshot"
name = "fixed_eligibility_snapshot"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Confirm seeded Courtyard closing time still has Leila and paused Owen in its two-person eligibility snapshot.
2. Confirm the newly opened Verifier room schedule captures only currently active Leila, remains one eligible after reload, is visible to Leila, and is absent for Owen.
3. Then activate Owen through Ruth's Members screen, create and open a separate single-choice draft titled Future roster probe with choices Yes and No, and require that new snapshot to contain both Members while Verifier room schedule remains Leila-only.
4. Pause Owen again and require both already-open snapshots to stay unchanged after refresh.
5. Do not infer eligibility only from the present roster.
After the first valid vote request reveals its actual shape, attempt Verifier room schedule as ineligible Owen using a fresh operation id, current revision and an in-ballot choice. Confirm the protected current-user response still identifies Owen immediately before the request. Require non-2xx and unchanged participation, turnout, revision and audit. Grade this eligibility refusal and the fixed snapshots on their own evidence; an independent invalid approval accepted from eligible Leila belongs to approval_selection_limits, not this criterion.
"""

[[criterion]]
id = "staff_write_role_boundaries"
name = "staff_write_role_boundaries"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Using actual successful UI request shapes, require Observer Arun and BOTH Members Leila/Owen to be unable to create, edit, open, close, publish or change membership. Probe each action family in an otherwise appropriate current state, with valid payloads and fresh operation IDs. Each refusal must leave target content, revision, membership, turnout and audit unchanged. Capture an authorized Ruth success for each request family as a positive control. Missing controls alone are insufficient; malformed, stale or wrong-state requests do not isolate a role gate.
"""

[[criterion]]
id = "session_identity_authority"
name = "session_identity_authority"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
From each real Member session, repeat an observed valid privileged request claiming Ruth in an observed actor/user/account field, or add one such claim if identity is exclusively session-derived. Require refusal and unchanged records, with no impersonation. Confirm the current-user response identifies the Member immediately before the request. Extra fields on an otherwise authorized request need not be rejected. Grade identity forgery independently of ordinary role refusals.
"""

[[criterion]]
id = "ballot_target_and_revision_validation"
name = "ballot_target_and_revision_validation"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
As Ruth repeat a genuine lifecycle request with an unknown ballot ID and a fresh operation ID. Independently apply the real Open shape to untouched Annual picnic date at revision 1, using another fresh operation ID and revision numeric 1.5. Require both refusals and unchanged records/audit. Then the normal Open action at integer revision 1 must succeed. An already-open ballot or reused operation ID cannot be the fractional-input control. These probe well-formed target/version validation, not stale optimistic concurrency.
"""

[[criterion]]
id = "membership_input_validation"
name = "membership_input_validation"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Exercise the malformed-membership checkpoint in the shared workflow. Capture a successful real membership request, restore Owen paused, and use Ruth's authorized transport with a fresh operation id and the currently applicable revision for each probe. Independently omit the actual active/paused value, replace it with an object, then replace it with an array; preserve all other valid fields. Require each non-2xx refusal to leave status, revision and audit unchanged. Immediately create/open a separate Membership validation snapshot through the UI: it must include Leila only, remain absent for Owen, and stay fixed after a subsequent valid Owen activation and pause. This is the downstream consequence of malformed-input refusal; ordinary stale-roster checks belong to roster_conflict_snapshot_chain. For action-based routes with no status field, test malformed values in the actual action discriminator or documented mutation payload; do not invent an ignored status field or demand a particular JSON schema. If the route itself completely encodes the status with no status/action payload, record the observed transport and apply the malformed-value probes to its required revision instead. No-op success that silently ignores malformed required input is not a refusal.
"""

[[criterion]]
id = "cross_ballot_choice_rejection"
name = "cross_ballot_choice_rejection"
type = "binary"
weight = 1.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Before Leila submits Verifier room schedule, attempt its vote through the genuine voting request but with a choice id from another ballot.
2. Require a non-2xx refusal, no participation, and unchanged turnout after reload.
3. A later legitimate in-ballot submission must still be possible.
4. Confirm the later published totals of this tested ballot against its captured accepted submissions; never request hidden pre-publication selections as evidence. Do not attribute an independently accepted repeated-option probe to cross-ballot validation. Use the prompt's isolation procedure if another probe has consumed Leila's participation before the required positive control.
"""

[[criterion]]
id = "single_choice_submission_limits"
name = "single_choice_submission_limits"
type = "binary"
weight = 1.0
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
On open Courtyard as eligible Leila before she participates, use the genuine vote shape and current revision to separately send an empty choice list and both Courtyard choices, each with a fresh operation ID. Require refusal with no Leila participation, turnout, revision or audit change. Her subsequent visible Extend to 9 pm vote must remain possible and succeed as the positive control. Owen's earlier Keep 8 pm vote supplies the real request shape. Grade this method's valid selection range only.
"""

[[criterion]]
id = "private_final_vote_confirmation"
name = "private_final_vote_confirmation"
type = "binary"
weight = 1.0
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
For Owen's visible Keep 8 pm vote, Leila's visible Extend to 9 pm vote and Leila's visible Morning/Evening approval on Verifier, require a clear one-final-submission/privacy explanation before submission and a private participation confirmation afterward. Neither the successful response nor its post-submit confirmation may return the submitted choices. No receipt widget or response-key spelling is required. This grades the submission privacy contract for both methods, independently of input validation and result math.
"""

[[criterion]]
id = "exact_vote_success_receipt"
name = "exact_vote_success_receipt"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Retain Owen's original successful Courtyard request and status/body. Replay that exact operation as Owen while Open, after publication and after each trusted restart. Require the identical successful status/body and no added participation, turnout, revision or audit. The receipt must survive later state changes. Changed-input mismatch belongs to operation_id_mismatch_safety. Judge unchanged accepted submissions, not a separate tally-formatting defect.
"""

[[criterion]]
id = "approval_order_independent_receipt"
name = "approval_order_independent_receipt"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Retain Leila's successful two-choice Partial turnout approval request. At Open, Published and each restart, replay with the same operation ID, original revision and same two distinct choices reversed. Both original and reordered payloads must return the original successful status/body and leave all business state unchanged, including after the separately tested changed-set mismatch. Preserve its actual array/map encoding and vary only order; do not invent a field. This grades order equivalence only. A changed-set refusal is scored by operation_id_mismatch_safety.
"""

[[criterion]]
id = "operation_id_mismatch_safety"
name = "operation_id_mismatch_safety"
type = "binary"
weight = 1.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Use the captured successful Owen Courtyard vote, Leila Partial turnout approval vote and Ruth Receipt rehearsal create. For each, reuse its original operation ID with different otherwise valid input and the same person. Require an explicit operation-mismatch refusal, unchanged accepted records and the original request still returning its original successful status/body. Repeat approval mismatch at Open, Published and after each restart as specified. A mismatch must not overwrite the original receipt. Grade wrong-input rejection here, independently of unchanged-input replay and result presentation.
"""

[[criterion]]
id = "approval_selection_limits"
name = "approval_selection_limits"
type = "binary"
weight = 1.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
On open Verifier room schedule as eligible Leila, independently test empty choices, a repeated option, and all three distinct options where the maximum is two. Require each refusal with unchanged participation, turnout, revision and audit. Then the visible Morning/Evening submission must succeed as a positive control. The shared isolation procedure applies if a failing probe consumes her participation. Grade the selection limits only; private confirmation and published tally have separate criteria.
"""

[[criterion]]
id = "duplicate_participation_rejection"
name = "duplicate_participation_rejection"
type = "binary"
weight = 1.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. After a Member has successfully participated, while that ballot is still Open, use a fresh operation id to attempt another submission for that same ballot.
2. Require non-2xx refusal and verify after reload that participation, turnout, and ballot revision did not change.
3. Confirm this duplicate-tested ballot's exact anonymous totals after publication; for Courtyard require Keep 8 pm 1, Extend to 9 pm 1, and two participants. Do not require a receipt-history screen or use an unrelated approval tally to fail this criterion.
4. Do not count an exact retry covered by the idempotency criterion as this check.
"""

[[criterion]]
id = "staff_identified_turnout"
name = "staff_identified_turnout"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
After the specified accepted submissions, Ruth and Arun must see Leila and Owen identified as participated on Courtyard (2 of 2) and Leila on Verifier (1 of 1), from their real protected reads and UI. Also retain the staff positive control at the one-participant checkpoint. This grades authorized staff turnout only; privacy boundaries have their own observations.
"""

[[criterion]]
id = "anonymous_choice_separation"
name = "anonymous_choice_separation"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Inspect every observed ballot, turnout and results screen/response across staff and Member roles at Open, Closed and Published. None may link a Member identity to a selected choice. Staff identified participation without a choice association is allowed. Anonymous published totals are allowed. Audit payloads are owned by audit_choice_privacy; post-submit confirmation is owned by private_final_vote_confirmation. This criterion grades choice anonymity in the other read surfaces.
"""

[[criterion]]
id = "member_participation_isolation"
name = "member_participation_isolation"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Verify the Member boundary from actual successful protected reads as well as the rendered UI. Immediately after Owen's legitimate Courtyard vote and before Leila votes there, refresh Leila's context and inspect every returned ballot, turnout and activity structure used by her UI, including nested fields. Leila must see her own not-participated state without receiving Owen's identified participation status or submission time. Repeat from Owen after Leila participates, and from both after publication and each existing restart. An identified participant ID list, a name/email plus participation flag or timestamp, or an identified eligible row indicating nonparticipation leaks another person's turnout even if CSS or client-side filtering hides it. Anonymous aggregate counts and public demo names/roles without participation associations are allowed; do not fail simply because another person's name appears. Staff must still receive the correct identified turnout in their own authenticated reads. Keep pre-publication choice-count privacy in unpublished_results_hidden independent of this participation-identity boundary.
"""

[[criterion]]
id = "ballot_close_transition"
name = "ballot_close_transition"
type = "binary"
weight = 0.375
description = """
As Ruth, close Courtyard through the visible control. Require Closed status, exactly one revision advance, and the same definition and participation after a protected reread and reload. This grades the accepted Close transition only. Closed-state vote refusal and release timing have separate criteria.
"""

[[criterion]]
id = "closed_vote_refusal"
name = "closed_vote_refusal"
type = "binary"
weight = 0.375
description = """
Use Future roster probe and eligible, unparticipated Owen for the shared Closed-state checkpoint. Open his valid Yes voting form while Open, then close the ballot as Ruth. With Owen's actual request shape, a fresh operation ID and current Closed revision, attempt that otherwise valid vote. Require refusal and unchanged participation, turnout, content, revision and audit. An already-participated user, stale version or malformed input does not prove this boundary. The earlier successful Open vote on Courtyard supplies its request-shape positive control. The shared workflow provides a clean fallback if another failure consumed Future.
"""

[[criterion]]
id = "unpublished_results_hidden"
name = "unpublished_results_hidden"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Keep Courtyard Open and then Closed while inspecting the actual visible UI and protected read bodies for Ruth, Arun, Leila and Owen. No role may receive option totals or a leader before Published; staff identified turnout remains allowed. Inspect both lifecycle stages before publication. Grade release timing independently of vote refusal or Member participation identities.
"""

[[criterion]]
id = "published_single_choice_tie"
name = "published_single_choice_tie"
type = "binary"
weight = 1.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. On the untouched seeded Garden location result, require 2 participating ballots, North lawn 1, East beds 1, and an explicit tie naming both leaders.
2. Require the result to survive refresh. Choice anonymity is graded separately by anonymous_choice_separation.
3. Percentages are optional for this single-choice result; when shown, each must be 50% or an equivalent representation.
4. Save this initial result and revisit Garden after each of the two existing trusted restarts at the end of the shared workflow. Require the same 2 participants, exact 1-1 counts and both named tie leaders in the refreshed Results UI. If percentages are shown they must still be 50% each. This grades the visible persisted single-choice result, not session or receipt-replay behavior.
"""

[[criterion]]
id = "publish_transition"
name = "publish_transition"
type = "binary"
weight = 0.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
As Ruth publish the seeded Closed Shared-space improvements ballot through the UI. Require Published status and exactly one revision advance, retained after reload. Publication is the accepted lifecycle transition here; published_approval_tally owns counts/percentages and published_terminal_lock owns future write refusal.
"""

[[criterion]]
id = "published_approval_tally"
name = "published_approval_tally"
type = "binary"
weight = 1.0
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
Setup action: publish seeded closed Shared-space improvements as Ruth if not yet completed.
Require 2 participating ballots, Street trees 2 and 100%, Bike racks 1 and 50%, and Community noticeboard 1 and 50%. Do not require a separate explanatory sentence about the percentage total.
Do not re-grade choice anonymity here; anonymous_choice_separation owns that boundary.
4. Revisit this result after each of the two existing trusted restarts at the end of the shared workflow. Require the same Published status, 2 participating ballots, exact 2/1/1 approvals and 100%/50%/50% percentages in the refreshed Results UI. Do not award a pass only because its first publication was correct; storage must preserve this accepted outcome.
5. Also use the UI-created Partial turnout approval ballot from the shared workflow. Confirm its opening snapshot contains Leila and Owen, but only Leila submits Morning and Evening. After closing and publishing, require one participating ballot and Morning 1/100%, Afternoon 0/0%, Evening 1/100% in the Results UI and protected result response. Owen must remain not participated; two eligible Members are not the percentage denominator. Repeat these exact observations after each of the same two restarts. Do not infer this case from the full-turnout seeded result. This is another input for this criterion's participant-denominator requirement, not another scored criterion or a new requirement for explanatory UI copy.
"""

[[criterion]]
id = "stale_ballot_revision_refusal"
name = "stale_ballot_revision_refusal"
type = "binary"
weight = 1.0
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
After one successful UI edit, while the ballot is still Draft, repeat its actual edit shape with a fresh operation ID, older revision and otherwise valid content as Ruth. Require an explicit stale conflict with useful refresh guidance and unchanged accepted content, state, revision and audit. A fractional version, unauthorized person or locked lifecycle state is not a stale-only control. Follow the shared early Draft checkpoint before Open.
"""

[[criterion]]
id = "published_terminal_lock"
name = "published_terminal_lock"
type = "binary"
weight = 1.0
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Once a ballot is Published, attempt an edit and each genuine progress-action family using the captured valid shapes, fresh operation IDs and its current revision as Ruth. Require explicit terminal-state refusals and unchanged definition, status, revision, snapshot, turnout/results and audit. Use the successful earlier lifecycle/edit actions as positive controls. This grades Published immutability independently of stale writes and the Open edit lock.
"""

[[criterion]]
id = "business_audit_records"
name = "business_audit_records"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
For each accepted create, edit, open, close, publish and membership action in the core workflow, require exactly one audit event with the action, actual actor, affected record and readable event time. Rejected or replayed operations add no event. Compare actual history before/after. Grade audit fidelity separately from privacy and the resulting business state.
"""

[[criterion]]
id = "audit_choice_privacy"
name = "audit_choice_privacy"
type = "binary"
weight = 0.75
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Inspect the full visible Audit and all observed audit/activity payloads after voting and publication. No event may contain a Member-to-choice association or an actual submitted choice ID or label. Anonymous receipt activity is allowed, as are ordinary lifecycle action names. Grade disclosure through audit independently of whether all required lifecycle entries exist.
"""

[[criterion]]
id = "durable_reauthentication_and_seed_safety"
name = "durable_reauthentication_and_seed_safety"
type = "binary"
weight = 1.5
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. After the completed workflow, record the full visible ballot collection, statuses, revisions, participation, roster and audit count. Save published tally evidence separately for the two published-result criteria.
2. Run the trusted command python3 /tests/app-lifecycle.py restart, which restarts only the app without resetting its database.
3. Refresh existing staff and Member sessions and require them to remain authenticated with the same accepted data.
4. Perform the shared captured-receipt checks at this restart; their verdicts belong only to the receipt criteria, not this criterion.
5. Restart once more, then refresh, sign out and sign in again.
6. Require the same ballot identities, statuses, revisions, participation, roster and audit records, with no duplicate seed records or return of rejected writes. Exact option totals, percentages and tie presentation after restart are owned by published_single_choice_tie and published_approval_tally. A tally-only defect must not also fail this criterion; a failed session, changed record or duplicate participation does.
7. Do not inspect or edit SQLite to satisfy this criterion.
"""

[[criterion]]
id = "staff_mutation_success_receipts"
name = "staff_mutation_success_receipts"
type = "binary"
weight = 2.0
description = """
Setup: Use the ordered shared workflow and its named records. Record this observation independently of other outcomes from the same scenario.
Setup: After the core workflow, use Ruth and an ordinary roster with Leila active and Owen paused. Use a separate single-choice Receipt rehearsal ballot with Yes and No. Capture every staff mutation before its UI action and save the complete exchange immediately.
Graded observations:
1. Create Receipt rehearsal through the UI. Retain its successful create exchange, replay that exact request, and require the same status/body and exactly one draft and one create audit event. Edit the title to Receipt rehearsal approved through the UI and retain that success. Open it through the UI, retaining the Open success; its fixed snapshot must contain Leila only.
2. Activate Owen, close Receipt rehearsal approved, pause Owen again, and publish that ballot, using visible controls and retaining each of these successful exchanges separately. Current ballot status must be Published with its original Leila-only snapshot and Owen currently paused. Each normal accepted action advances its applicable record revision once and contributes one relevant audit event.
3. Replay all seven original successes: create, edit, Open, activation, Close, pause, Publish. Keep the original paths, bodies, operation identifiers and revisions as Ruth. Each must return its own original status/body rather than current-state output or a stale/terminal refusal. After each replay require unchanged current record identities, title, choices, Published status, revisions, Leila-only eligibility, paused roster, turnout/results and audit. In particular, the original activation response may say active, but it must not activate Owen again; Open must neither reopen the ballot nor capture a new snapshot; create must not duplicate it.
4. The shared Receipt collision changed-input probe belongs to operation_id_mismatch_safety. Here score only unchanged-input success receipts across all seven action families.
5. After each of the two existing trusted restarts, repeat all seven exact-success replays and the current-state comparisons, using the retained originals. Do not inspect SQLite or manufacture an operation field absent from the app. A missing required staff operation mechanism is not a pass.
"""

[[criterion]]
id = "roster_conflict_snapshot_chain"
name = "roster_conflict_snapshot_chain"
type = "binary"
weight = 2.0
description = """
Setup: Use two ordinary Ruth tabs in the same browser context and distinct UI-created single-choice ballots named Roster includes Owen and Roster excludes Owen, each with Yes and No. Keep Leila active. Establish Owen active through a normal UI action if needed, then have both tabs read the same actual membership revision R and active state.
Graded observations:
1. In tab A pause Owen and then activate him again, waiting for each accepted action and capturing each genuine request shape. Require two accepted revision advances and one audit event per action. His value is active again, but its revision is now newer than R.
2. Attempt tab B's stale Pause with revision R and a fresh operation identifier. Prefer its ordinary stale UI control. If the app automatically refreshed tab B, adapt only the actual captured membership request to R and active=false; do not mutate browser state or count a newly current request as stale. Require non-2xx stale refusal with useful refresh guidance. Reread the roster and audit: Owen remains active at the newer revision and no refusal audit event was added.
3. Through the UI create/open Roster includes Owen. Its snapshot must include exactly Leila and Owen, and it must be visible to Owen after refresh. A stale refusal alone is insufficient: the accepted roster must reach this downstream eligibility result.
4. Refresh tab B, make its now-current Pause succeed, and create/open Roster excludes Owen. Require a Leila-only snapshot, absent for Owen but visible to Leila. Roster includes Owen must still contain both Members and remain visible to Owen. Do not require a particular revision field name or per-member versus whole-roster implementation; compare the applicable version actually used by the app.
5. After each of the same two existing restarts, require Owen still paused, the two ballots still Open, their exact respective snapshots and role-appropriate visibility unchanged, and no return of the stale write or extra membership audit. Own these conflict-driven snapshots here, not under the earlier ordinary fixed-snapshot criterion.
"""

[[criterion]]
id = "refusal_receipt_after_state_change"
name = "refusal_receipt_after_state_change"
type = "binary"
weight = 2.0
description = """
Setup: Use Ruth and a separate UI-created single-choice Refusal rehearsal ballot with Yes and No. Discover the real edit and Publish shapes from successful UI interactions. Use well-formed authorized requests; malformed fields, unknown records or wrong roles cannot substitute for the required recorded domain refusals.
Graded observations:
1. Create the draft, then visibly edit its context to Board review A. Using the observed edit shape, submit Board review B with the earlier draft revision and a fresh operation identifier. Require a stale refusal and unchanged accepted context, revision and audit; retain its exact request/status/body. Now visibly save Board review C using current data. Replay the original stale request unchanged: it must return its original refusal details and status, not a newly computed refusal based on the later revision, and must not restore Board review A or B. A fresh legitimate edit is the positive control.
2. Open Refusal rehearsal through the UI. Adapt the genuine Publish shape to this ballot at its current Open revision with a fresh operation identifier. Require a non-2xx wrong-state refusal and unchanged Open ballot/audit; retain that exchange independently. Close the ballot normally. Replay the same refused Publish with its original operation identifier and revision: require the identical stored refusal and unchanged Closed state, not an automatic publication or a different newly calculated stale response.
3. A fresh current-revision Publish operation through the UI must now succeed. Replay both original refused operations again while Published. Require their original statuses and bodies, unchanged final Board review C context, Published status, revisions, eligibility, turnout/results and audit. Reuse of a failed operation is not a new attempt.
4. After each of the two existing trusted restarts, repeat both refused-operation replays and the exact current-state comparisons. Receipt storage may change privately at the original refusal; it must never create a public audit event or change an accepted record. Do not require preservation of unauthorized or malformed requests.
"""
