[judge]
mode = "batched"
timeout = 9000
isolated = false
temperature = 0
weight = 0.6
prompt_template = "prompt.md"
[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]
[scoring]
aggregation = "weighted_mean"
[[criterion]]
id = "seeded_roles_and_ballot_states"
name = "seeded_roles_and_ballot_states"
type = "binary"
weight = 1.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. From the clean state, confirm all four documented accounts authenticate into their stated roles and the appropriate staff view contains exactly the seeded draft Annual picnic date, open Courtyard closing time, closed Shared-space improvements, and published Garden location ballots with their specified methods, choices, statuses, and revisions.
2. Confirm the roster has active Leila and paused Owen.
Before any valid login in a fresh context, submit Ruth's email with CommonGround!wrong. Require visible refusal, no signed-in protected workspace, and a non-2xx from the observed protected ballot endpoint. Then verify successful login displays each person's name and role. Confirm the group is Riverside Residents Association.
"""

[[criterion]]
id = "distinct_sessions_and_global_revocation"
name = "distinct_sessions_and_global_revocation"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Open two independent signed-in browser contexts for Ruth.
2. Sign out normally in the first context: its protected requests must now be refused while the second still loads Ruth's workspace after refresh.
3. Sign Ruth in again in the first context, then use End all sessions there.
4. Both contexts must now lose protected access, including on refresh, while a fresh sign-in still succeeds.
5. A local-only logout, ordinary logout revoking the other session, or either session surviving End all sessions fails.
Before each sign-out, retain the actual session credential used by a successful protected read. After ordinary sign-out, replay that read with the ended credential; after End all sessions, replay it with each ended credential. Every replay must return non-2xx. Use the browser request context with captured authentication headers for HttpOnly cookies, or a same-origin request with the actual bearer header; do not mutate browser cookies/storage or print credential values. An unauthenticated request after merely clearing a local cookie is not proof of server revocation.
"""

[[criterion]]
id = "draft_validation_and_creation"
name = "draft_validation_and_creation"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. As Ruth, run the exact independent invalid-draft cases in the shared prompt: blank title, one blank choice, fewer than two choices, repeated choice labels, approval limit zero, and approval limit four for three choices. Restore the specified valid base form before each case, and confirm the displayed voting method and actual field values before submitting.
2. Require each invalid draft to be prevented or visibly refused without adding a ballot or audit event; native form validation or a control preventing an invalid value is acceptable. Record the invalid field and values, validation feedback or actual request/response, and before/after ballot and audit counts. A form that now contains valid values is not a negative control, regardless of its title.
3. Then create one distinctive valid approval draft titled Verifier room use with optional context Reserve the shared room, choices Morning, Afternoon, Evening and maximum two.
4. Require exactly one revision-1 draft containing that context and one matching audit event.
"""

[[criterion]]
id = "draft_edit_and_open_lock"
name = "draft_edit_and_open_lock"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Edit the distinctive draft through the UI to title Verifier room schedule while keeping approval up to two, then open it.
2. Require revision to advance once for the edit and once for opening, status Open, and the final title and three choices to persist.
3. After opening, repeat the observed edit shape with a fresh operation id and the current revision; it must be rejected, and a reread must show the open ballot, revision, choices, and audit unchanged.
"""

[[criterion]]
id = "fixed_eligibility_snapshot"
name = "fixed_eligibility_snapshot"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Confirm seeded Courtyard closing time still has Leila and paused Owen in its two-person eligibility snapshot.
2. Confirm the newly opened Verifier room schedule captures only currently active Leila, remains one eligible after reload, is visible to Leila, and is absent for Owen.
3. Then activate Owen through Ruth's Members screen, create and open a separate single-choice draft titled Future roster probe with choices Yes and No, and require that new snapshot to contain both Members while Verifier room schedule remains Leila-only.
4. Pause Owen again and require both already-open snapshots to stay unchanged after refresh.
5. Do not infer eligibility only from the present roster.
After the first valid vote request reveals its actual shape, attempt Verifier room schedule as ineligible Owen using a fresh operation id, current revision and an in-ballot choice. Confirm the protected current-user response still identifies Owen immediately before the request. Require non-2xx and unchanged participation, turnout, revision and audit. Grade this eligibility refusal and the fixed snapshots on their own evidence; an independent invalid approval accepted from eligible Leila belongs to approval_selection_limits, not this criterion.
"""

[[criterion]]
id = "role_and_identity_enforcement"
name = "role_and_identity_enforcement"
type = "binary"
weight = 2.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Using real sessions and observed same-origin requests, require Arun to remain read-only and a Member to be unable to create or progress a ballot or change membership.
2. From that Member session, repeat a privileged request while claiming Ruth's identity in an observed user/account/actor field, or adding one such claim field if identity is exclusively session-derived; require non-2xx refusal and no impersonation.
3. Do not require rejection merely for an extra field on an otherwise authorized request.
4. As Ruth, repeat an observed lifecycle request with an unknown ballot id and a fresh operation id if the app uses one. Separately adapt its real Open-action shape to the untouched seeded Annual picnic date draft at revision 1, with another fresh operation id and revision value numeric 1.5; require non-2xx refusals. Keep the fractional test otherwise authorized and valid; an already-open or published ballot or a reused operation id is not a valid control. After its refusal, use the normal Open control at revision 1 as a successful positive control. If invalid input unexpectedly succeeds, record that failure and do not count a later already-open refusal as validation.
5. After each rejection, reread the targeted ballot or member (or full ballot collection for an unknown id) and require its value, revision, audit, and derived counts to be unchanged; then make one legitimate Ruth action succeed as a positive control.
6. Also exercise the malformed-membership checkpoint in the shared workflow. Capture a successful real membership request, restore Owen paused, and use Ruth's authorized transport with a fresh operation id and the currently applicable revision for each probe. Independently omit the actual active/paused value, replace it with an object, then replace it with an array; preserve all other valid fields. Require each non-2xx refusal to leave status, revision and audit unchanged. Immediately create/open a separate Membership validation snapshot through the UI: it must include Leila only, remain absent for Owen, and stay fixed after a subsequent valid Owen activation and pause. This is the downstream consequence of malformed-input refusal; ordinary stale-roster checks belong to roster_conflict_snapshot_chain. For action-based routes with no status field, test malformed values in the actual action discriminator or documented mutation payload; do not invent an ignored status field or demand a particular JSON schema. If the route itself completely encodes the status with no status/action payload, record the observed transport and apply the malformed-value probes to its required revision instead. No-op success that silently ignores malformed required input is not a refusal.
"""

[[criterion]]
id = "cross_ballot_choice_rejection"
name = "cross_ballot_choice_rejection"
type = "binary"
weight = 1.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Before Leila submits Verifier room schedule, attempt its vote through the genuine voting request but with a choice id from another ballot.
2. Require a non-2xx refusal, no participation, and unchanged turnout after reload.
3. A later legitimate in-ballot submission must still be possible.
4. Confirm the later published totals of this tested ballot against its captured accepted submissions; never request hidden pre-publication selections as evidence. Do not attribute an independently accepted repeated-option probe to cross-ballot validation. Use the prompt's isolation procedure if another probe has consumed Leila's participation before the required positive control.
"""

[[criterion]]
id = "single_choice_private_vote"
name = "single_choice_private_vote"
type = "binary"
weight = 2.0
description = """
Setup: Confirm Courtyard closing time is Open and Owen and Leila are eligible and have not participated. Use their real signed-in contexts and the shared workflow.
Graded observations:
1. As Owen, submit Keep 8 pm through the visible one-final-ballot flow. Capture its genuine request and successful response. Require a private participation confirmation without returning or displaying his submitted choice in the post-submit confirmation.
2. Before Leila votes, use the discovered request shape with Leila's session and the current Courtyard revision to try an empty choice list and then both Courtyard choices, with a fresh operation id for each. Require non-2xx, no Leila participation, and unchanged turnout, revision and audit after each rejection.
3. As Leila, visibly submit Extend to 9 pm. Require her own participation and a private confirmation without her selected choice in the success response or post-submit confirmation. Capture this response too.
4. Other Member-only ballots must remain isolated. Do not require a receipt-number widget or a particular response key. Retain the captured successful request for the separate replay checks.
"""

[[criterion]]
id = "vote_retry_idempotency"
name = "vote_retry_idempotency"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Capture one legitimate successful vote request and exact success body.
2. Replay that same request from the app origin with the same signed-in user and require the same successful receipt/body rather than a duplicate error.
3. Turnout, participation, ballot revision, and visible state must remain exactly as after the first success.
4. After publication, require this replayed ballot's exact totals to contain only its original accepted submissions. For Courtyard require Keep 8 pm 1, Extend to 9 pm 1, and two participants. Do not fail this criterion because the separate Verifier approval ballot has an incorrect tally.
5. Independently capture Leila's legitimate two-choice vote on Partial turnout approval. Replay it with the same operation id, original revision and same two distinct choice IDs in reversed order, preserving the actual request shape and authentication. Require its original successful status and response body, unchanged participation, turnout, revision and audit. Approval order is not a different vote. Then use that same operation id with a different valid choice set: require an explicit mismatch refusal, followed by both the original and reordered requests still returning the original success. Repeat these comparisons after publication and after each of the two existing trusted restarts. The published partial-turnout tally must remain the one accepted Morning/Evening submission. If the app encodes selections as an unordered map, preserve that encoding and vary only its serialization order; do not force it to accept an invented array field. A separate failure of approval_selection_limits cannot replace these independent valid-retry observations.
"""

[[criterion]]
id = "operation_id_mismatch_safety"
name = "operation_id_mismatch_safety"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Reuse the captured successful vote's operation id with different choice input.
2. Require HTTP 409 or an equally explicit non-2xx operation-mismatch refusal.
3. Reread the ballot and require the original receipt, turnout, revision, and participation to remain unchanged.
4. After publication, confirm this mismatch-tested ballot's exact totals still reflect only its original accepted submissions. For Courtyard require Keep 8 pm 1, Extend to 9 pm 1, and two participants. An incorrect tally on a different ballot is not evidence of operation mismatch failure.
"""

[[criterion]]
id = "approval_selection_limits"
name = "approval_selection_limits"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. On open Verifier room schedule as Leila, require empty input, a repeated option, and all three options to be refused because its approval limit is two, without recording participation.
2. Then visibly choose Morning and Evening, verify the visible final-submission/privacy explanation and complete any confirmation the app provides, submit once, and require one participation and a private success response.
3. After publication, require Morning 1, Afternoon 0, Evening 1, and one participating ballot; before publication the choices must remain private.
"""

[[criterion]]
id = "duplicate_participation_rejection"
name = "duplicate_participation_rejection"
type = "binary"
weight = 1.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. After a Member has successfully participated, while that ballot is still Open, use a fresh operation id to attempt another submission for that same ballot.
2. Require non-2xx refusal and verify after reload that participation, turnout, and ballot revision did not change.
3. Confirm this duplicate-tested ballot's exact anonymous totals after publication; for Courtyard require Keep 8 pm 1, Extend to 9 pm 1, and two participants. Do not require a receipt-history screen or use an unrelated approval tally to fail this criterion.
4. Do not count an exact retry covered by the idempotency criterion as this check.
"""

[[criterion]]
id = "identified_turnout_without_choice_link"
name = "identified_turnout_without_choice_link"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. As Ruth and Arun, verify Courtyard closing time now shows Leila and Owen as participated with 2 of 2 turnout, and Verifier room schedule shows Leila participated with 1 of 1.
2. Staff may see those identities, but no turnout record, page text, response, or audit entry may reveal which option either person selected; Members see only their own participation.
3. Verify the Member boundary from actual successful protected reads as well as the rendered UI. Immediately after Owen's legitimate Courtyard vote and before Leila votes there, refresh Leila's context and inspect every returned ballot, turnout and activity structure used by her UI, including nested fields. Leila must see her own not-participated state without receiving Owen's identified participation status or submission time. Repeat from Owen after Leila participates, and from both after publication and each existing restart. An identified participant ID list, a name/email plus participation flag or timestamp, or an identified eligible row indicating nonparticipation leaks another person's turnout even if CSS or client-side filtering hides it. Anonymous aggregate counts and public demo names/roles without participation associations are allowed; do not fail simply because another person's name appears. Staff must still receive the correct identified turnout in their own authenticated reads. Keep pre-publication choice-count privacy in close_boundary_and_hidden_results independent of this participation-identity boundary.
"""

[[criterion]]
id = "close_boundary_and_hidden_results"
name = "close_boundary_and_hidden_results"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. As Ruth, close Courtyard closing time and require exactly one revision advance and Closed status.
2. Before publication, no role may see its option counts or leader.
3. Prove the server's Closed-state refusal on Future roster probe using eligible Owen before he has participated there, following the shared workflow. Ruth closes that otherwise valid Open ballot; Owen then sends a genuine-shaped vote with a fresh operation id, its current Closed revision when used, and its Yes choice. Require non-2xx and unchanged ballot, participation, turnout, revision and audit. An already-participated Member's duplicate-vote refusal is not evidence of this boundary. Keep the Courtyard all-role privacy and staff-turnout observations separate.
"""

[[criterion]]
id = "published_single_choice_tie"
name = "published_single_choice_tie"
type = "binary"
weight = 1.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. On the untouched seeded Garden location result, require 2 participating ballots, North lawn 1, East beds 1, and an explicit tie naming both leaders.
2. Confirm no participant identity is shown beside either result and the result survives refresh.
3. Percentages are optional for this single-choice result; when shown, each must be 50% or an equivalent representation.
4. Save this initial result and revisit Garden after each of the two existing trusted restarts at the end of the shared workflow. Require the same 2 participants, exact 1-1 counts and both named tie leaders in the refreshed Results UI. If percentages are shown they must still be 50% each. This grades the visible persisted single-choice result, not session or receipt-replay behavior.
"""

[[criterion]]
id = "published_approval_tally"
name = "published_approval_tally"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Publish seeded closed Shared-space improvements as Ruth.
2. Require one revision advance, 2 participating ballots, Street trees 2 and 100%, Bike racks 1 and 50%, and Community noticeboard 1 and 50%. Do not require a separate explanatory sentence about the percentage total.
3. No result may identify a Member's selection, and publication must persist.
4. Revisit this result after each of the two existing trusted restarts at the end of the shared workflow. Require the same Published status, 2 participating ballots, exact 2/1/1 approvals and 100%/50%/50% percentages in the refreshed Results UI. Do not award a pass only because its first publication was correct; storage must preserve this accepted outcome.
5. Also use the UI-created Partial turnout approval ballot from the shared workflow. Confirm its opening snapshot contains Leila and Owen, but only Leila submits Morning and Evening. After closing and publishing, require one participating ballot and Morning 1/100%, Afternoon 0/0%, Evening 1/100% in the Results UI and protected result response. Owen must remain not participated; two eligible Members are not the percentage denominator. Repeat these exact observations after each of the same two restarts. Do not infer this case from the full-turnout seeded result. This is another input for this criterion's participant-denominator requirement, not another scored criterion or a new requirement for explanatory UI copy.
"""

[[criterion]]
id = "stale_revision_and_terminal_safety"
name = "stale_revision_and_terminal_safety"
type = "binary"
weight = 2.0
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. Use a real ballot request to make one legitimate revision-changing mutation, then repeat a conflicting write with a fresh operation id but the older revision and require a non-2xx conflict refusal with useful stale-data guidance; do not require a particular HTTP status or revision-response field.
2. Also attempt to change or progress an already Published ballot.
3. After each refusal, prove exact ballot content, status, revision, eligibility, turnout/results, and audit history are unchanged.
"""

[[criterion]]
id = "audit_privacy_and_lifecycle_scope"
name = "audit_privacy_and_lifecycle"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. As staff, confirm successful create, edit, open, close, publish, and membership actions add exactly one durable audit event naming the action, actor, affected record and readable event time.
2. Rejected and idempotent-replay requests add none.
3. Search the full visible audit and observed payloads: no event may contain a Member-to-choice association, submitted choice id, or submitted choice label.
"""

[[criterion]]
id = "durable_reauthentication_and_seed_safety"
name = "durable_reauthentication_and_seed_safety"
type = "binary"
weight = 1.5
description = """
Setup: Use the documented shared workflow stage for this criterion; confirm the named user, ballot and current state before acting.
Graded observations:
1. After the completed workflow, record the full visible ballot collection, statuses, revisions, participation, roster and audit count. Save published tally evidence separately for the two published-result criteria.
2. Run the trusted command python3 /tests/app-lifecycle.py restart, which restarts only the app without resetting its database.
3. Refresh existing staff and Member sessions and require them to remain authenticated with the same accepted data.
4. Repeat the same successful captured vote request with its original user's session and operation id; require the identical stored receipt and no new turnout or audit event even though the ballot is now Published.
5. Restart once more, then refresh, sign out and sign in again.
6. Require the same ballot identities, statuses, revisions, participation, roster, operation receipts and audit records, with no duplicate seed records or return of rejected writes. Exact option totals, percentages and tie presentation after restart are owned by published_single_choice_tie and published_approval_tally. A tally-only defect must not also fail this criterion; a failed session, changed record, lost receipt or duplicate participation does.
7. Do not inspect or edit SQLite to satisfy this criterion.
"""

[[criterion]]
id = "staff_mutation_success_receipts"
name = "staff_mutation_success_receipts"
type = "binary"
weight = 2.0
description = """
Setup: After the core workflow, use Ruth and an ordinary roster with Leila active and Owen paused. Use a separate single-choice Receipt rehearsal ballot with Yes and No. Capture every staff mutation before its UI action and save the complete exchange immediately.
Graded observations:
1. Create Receipt rehearsal through the UI. Retain its successful create exchange, replay that exact request, and require the same status/body and exactly one draft and one create audit event. Edit the title to Receipt rehearsal approved through the UI and retain that success. Open it through the UI, retaining the Open success; its fixed snapshot must contain Leila only.
2. Activate Owen, close Receipt rehearsal approved, pause Owen again, and publish that ballot, using visible controls and retaining each of these successful exchanges separately. Current ballot status must be Published with its original Leila-only snapshot and Owen currently paused. Each normal accepted action advances its applicable record revision once and contributes one relevant audit event.
3. Replay all seven original successes: create, edit, Open, activation, Close, pause, Publish. Keep the original paths, bodies, operation identifiers and revisions as Ruth. Each must return its own original status/body rather than current-state output or a stale/terminal refusal. After each replay require unchanged current record identities, title, choices, Published status, revisions, Leila-only eligibility, paused roster, turnout/results and audit. In particular, the original activation response may say active, but it must not activate Owen again; Open must neither reopen the ballot nor capture a new snapshot; create must not duplicate it.
4. Reuse the original create operation with the otherwise valid title Receipt collision. Require an explicit non-2xx mismatch refusal, no extra draft or audit, and the original create receipt still replaying identically. This group tests staff successes once, not seven separately weighted siblings.
5. After each of the two existing trusted restarts, repeat all seven exact-success replays and the current-state comparisons, using the retained originals. Do not inspect SQLite or manufacture an operation field absent from the app. A missing required staff operation mechanism is not a pass.
"""

[[criterion]]
id = "roster_conflict_snapshot_chain"
name = "roster_conflict_snapshot_chain"
type = "binary"
weight = 2.0
description = """
Setup: Use two ordinary Ruth tabs in the same browser context and distinct UI-created single-choice ballots named Roster includes Owen and Roster excludes Owen, each with Yes and No. Keep Leila active. Establish Owen active through a normal UI action if needed, then have both tabs read the same actual membership revision R and active state.
Graded observations:
1. In tab A pause Owen and then activate him again, waiting for each accepted action and capturing each genuine request shape. Require two accepted revision advances and one audit event per action. His value is active again, but its revision is now newer than R.
2. Attempt tab B's stale Pause with revision R and a fresh operation identifier. Prefer its ordinary stale UI control. If the app automatically refreshed tab B, adapt only the actual captured membership request to R and active=false; do not mutate browser state or count a newly current request as stale. Require non-2xx stale refusal with useful refresh guidance. Reread the roster and audit: Owen remains active at the newer revision and no refusal audit event was added.
3. Through the UI create/open Roster includes Owen. Its snapshot must include exactly Leila and Owen, and it must be visible to Owen after refresh. A stale refusal alone is insufficient: the accepted roster must reach this downstream eligibility result.
4. Refresh tab B, make its now-current Pause succeed, and create/open Roster excludes Owen. Require a Leila-only snapshot, absent for Owen but visible to Leila. Roster includes Owen must still contain both Members and remain visible to Owen. Do not require a particular revision field name or per-member versus whole-roster implementation; compare the applicable version actually used by the app.
5. After each of the same two existing restarts, require Owen still paused, the two ballots still Open, their exact respective snapshots and role-appropriate visibility unchanged, and no return of the stale write or extra membership audit. Own these conflict-driven snapshots here, not under the earlier ordinary fixed-snapshot criterion.
"""

[[criterion]]
id = "refusal_receipt_after_state_change"
name = "refusal_receipt_after_state_change"
type = "binary"
weight = 2.0
description = """
Setup: Use Ruth and a separate UI-created single-choice Refusal rehearsal ballot with Yes and No. Discover the real edit and Publish shapes from successful UI interactions. Use well-formed authorized requests; malformed fields, unknown records or wrong roles cannot substitute for the required recorded domain refusals.
Graded observations:
1. Create the draft, then visibly edit its context to Board review A. Using the observed edit shape, submit Board review B with the earlier draft revision and a fresh operation identifier. Require a stale refusal and unchanged accepted context, revision and audit; retain its exact request/status/body. Now visibly save Board review C using current data. Replay the original stale request unchanged: it must return its original refusal details and status, not a newly computed refusal based on the later revision, and must not restore Board review A or B. A fresh legitimate edit is the positive control.
2. Open Refusal rehearsal through the UI. Adapt the genuine Publish shape to this ballot at its current Open revision with a fresh operation identifier. Require a non-2xx wrong-state refusal and unchanged Open ballot/audit; retain that exchange independently. Close the ballot normally. Replay the same refused Publish with its original operation identifier and revision: require the identical stored refusal and unchanged Closed state, not an automatic publication or a different newly calculated stale response.
3. A fresh current-revision Publish operation through the UI must now succeed. Replay both original refused operations again while Published. Require their original statuses and bodies, unchanged final Board review C context, Published status, revisions, eligibility, turnout/results and audit. Reuse of a failed operation is not a new attempt.
4. After each of the two existing trusted restarts, repeat both refused-operation replays and the exact current-state comparisons. Receipt storage may change privately at the original refusal; it must never create a public audit event or change an accepted record. Do not require preservation of unauthorized or malformed requests.
"""
