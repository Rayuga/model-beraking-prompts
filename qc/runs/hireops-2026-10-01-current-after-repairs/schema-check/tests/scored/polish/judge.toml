[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "hro_pol_theme"
name = "hro_pol_theme"
type = "binary"
weight = 1.0
description = """
Switch light/dark via the visible control; a clear rendered theme change occurs. Do not require a particular icon or palette. Palette contrast and readability belong to Visual.
"""

[[criterion]]
id = "hro_pol_theme_saved"
name = "hro_pol_theme_saved"
type = "binary"
weight = 1.0
description = """
Select a nondefault theme, reload fully and sign in if needed; the chosen theme remains selected and rendered. Requires successful initial switching, but do not demand session persistence.
"""

[[criterion]]
id = "hro_pol_mobile"
name = "hro_pol_mobile"
type = "binary"
weight = 1.0
description = """
At approximately390x844, every navigation destination and needed form/action remains reachable; page has no unintended horizontal overflow. Intentional horizontally scrollable data tables are allowed if usable. Judge operability only, not aesthetic composition.
"""

[[criterion]]
id = "hro_pol_semantics"
name = "hro_pol_semantics"
type = "binary"
weight = 0.25
description = """
Inspect rendered accessibility tree on main screens: meaningful navigation and main landmarks. Do not inspect application source. Native semantic HTML or equivalent correct accessible roles both satisfy. Headings and form labels have separate credit.
"""

[[criterion]]
id = "hro_pol_headings"
name = "hro_pol_headings"
type = "binary"
weight = 0.25
description = """
Inspect rendered accessibility tree on main screens: section headings identify their content. Do not inspect application source. Native semantic HTML or equivalent correct accessible roles both satisfy. Navigation landmarks and form labels have separate credit.
"""

[[criterion]]
id = "hro_pol_labels"
name = "hro_pol_labels"
type = "binary"
weight = 0.5
description = """
Inspect a rendered requisition and offer form: every visible input has an accessible label that identifies its purpose. Do not inspect application source. Native labels or equivalent correct accessible naming both satisfy. Navigation landmarks and headings have separate credit.
"""

[[criterion]]
id = "hro_pol_keyboard"
name = "hro_pol_keyboard"
type = "binary"
weight = 1.0
description = """
From signed-in workspace use ordinary keys only, with visible focus: reach all navigation destinations, open a new requisition/offer form, enter/edit fields and leave any detail/dialog. Discover labels/hints normally; no programmatic focus/click during the route. Standard native keys suffice; no undocumented exact key sequence required. A nonmodal/page design is allowed.
"""

[[criterion]]
id = "hro_pol_outcomes"
name = "hro_pol_outcomes"
type = "binary"
weight = 1.0
description = """
Observe successful sign-in/save and a rejected sign-in/invalid save; the outcome is apparent to the acting person. Showing the saved record counts as success feedback. Error text identifies the problem legibly; no mandated toast/banner wording or color. This is feedback clarity, not server authorization or formula correctness.
"""

[[criterion]]
id = "hro_pol_preserve_req"
name = "hro_pol_preserve_req"
type = "binary"
weight = 0.25
description = """
In a requisition-create form enter a distinctive valid title and department, an ordinary valid budget, and one invalid value such as an already-used requisition ID. Submit normally. A clear validation/refusal state appears and the other valid entered fields remain editable. Correct only the invalid field to a new valid value and save successfully. Compare semantic values, allowing normal formatting; do not require a particular notification or form layout. The row owns retention and correction of requisition-create input, not duplicate-ID enforcement or error styling.
"""

[[criterion]]
id = "hro_pol_preserve_offer"
name = "hro_pol_preserve_offer"
type = "binary"
weight = 0.25
description = """
On a suitable dedicated requisition enter a distinctive candidate, ordinary valid compensation and required dates. Make one other field invalid, for example an already-used offer ID. Submit normally, observe clear refusal/validation, and verify the valid candidate, compensation and date entries remain editable. Correct only the invalid value and successfully create the pending offer. Accept browser-native validation when it actually prevents submission and preserves the other entered fields. This row owns offer-create recovery, not numeric/date/identity enforcement or formula correctness.
"""

[[criterion]]
id = "hro_pol_preserve_revision"
name = "hro_pol_preserve_revision"
type = "binary"
weight = 0.25
description = """
On a dedicated current committed offer, open its revision editor. Change at least one valid editable compensation field to a distinctive value, then make a different field invalid. Prefer a clearly over-budget base with a small valid changed signing bonus so the UI can naturally submit a refusal; ordinary native numeric validation is also permitted. Submit normally and verify the valid changed input remains editable together with the other unchanged fields. Correct only the invalid input to an ordinary affordable value and save the revision successfully. Compare entered values rather than requiring a particular input representation. Owns retained revision-editor state and successful recovery only; do not regrade available-budget/shortfall wording, revision lineage or financial formulas. Use a new ordinary target if an unrelated prior scenario fails.
"""

[[criterion]]
id = "hro_pol_preserve_rescission"
name = "hro_pol_preserve_rescission"
type = "binary"
weight = 0.25
description = """
Open Finance's rescission form on an eligible dedicated committed target and enter a real effective date, e.g.2025-02-01 (or its equivalent UTC instant). First establish a successful normal UI rescission on another dedicated target and observe its actual request family. On the retained-input target, interrupt exactly one outgoing request belonging to that already-observed rescission operation before forwarding it to the server; leave its entered form data and request payload unmodified. A visible failure appears and the valid effective date remains in an editable form, allowing an unchanged retry. Remove the interruption and retry normally; the rescission succeeds with the same entered date. Do not fabricate an HTTP status, error body or server response; do not guess a route, mutate application code, delete browser validation, or claim an operation failed after it actually settled. This row owns retained rescission input and retry, not the settlement formulas or transport implementation. If the available browser tool cannot safely perform and release this single-operation interruption, report missing tool evidence honestly rather than assuming app failure or granting credit. If the form has several editable fields, an ordinary genuinely invalid field plus another valid distinctive field may instead establish the same retention/correction observation. Never require extra fields or free-text dates, or force impossible text into a native date input. Compare equivalent date representations semantically.
"""

[[criterion]]
id = "hro_pol_empty"
name = "hro_pol_empty"
type = "binary"
weight = 1.0
description = """
Open an honestly empty operational surface, e.g. a newly created requisition's related offers, or a filter with no matches if offered. It communicates no records and preserves a clear usable way back. No particular illustration, exact wording or new filter feature required. If no naturally empty subview exists, a new requisition with zero movements can establish this.
"""

[[criterion]]
id = "hro_pol_loading"
name = "hro_pol_loading"
type = "binary"
weight = 1.0
description = """
Observe an actual outstanding operational load/save: pending state is readable and interface does not falsely present completion. If naturally too fast, use supported browser network throttling or delay only an ordinary already-observed app response, then release it and verify successful completion. Do not fake payloads, alter app code, impose a minimum duration, or fail for a missing spinner when another pending indication works. If browser tools cannot expose this state, report missing observation honestly.
"""

