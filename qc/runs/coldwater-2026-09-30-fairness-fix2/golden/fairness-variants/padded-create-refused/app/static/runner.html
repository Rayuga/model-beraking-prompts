<!doctype html><html><head><meta charset="utf-8"><title>Isolated preview</title></head><body><script>
(() => {
  const token = location.hash.slice(1);
  function receive(event) {
    if (event.source !== parent || event.data?.token !== token || typeof event.data.html !== 'string') return;
    removeEventListener('message', receive);
    document.open(); document.write(event.data.html); document.close();
  }
  addEventListener('message', receive);
  parent.postMessage({ token, kind: 'ready' }, '*');
})();
</script></body></html>
