[judge]
judge = "claude-code"
mode = "batched"
timeout = 9000
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "hro_accounts"
name = "hro_accounts"
type = "binary"
weight = 0.5
description = """
Sign in with every listed account and the shared password; each reaches the protected workspace visibly identifying the signed-in person by name and seeded role, plus the seeded authority tier for an approver. Invalid password refusal is owned by the gate. Do not demand specific labels or an exposed user ID.
"""

[[criterion]]
id = "hro_seed_requisitions"
name = "hro_seed_requisitions"
type = "binary"
weight = 0.125
description = """
P0: each of the seven expected requisitions is present exactly once under its supplied ID, with its title, department and original annualized budget. Compare raw starting values, not derived headroom or the obsolete planning scalar. Other judge-owned requisitions are allowed.
"""

[[criterion]]
id = "hro_seed_offers"
name = "hro_seed_offers"
type = "binary"
weight = 0.25
description = """
P0: each of the thirteen expected offers is present exactly once under its supplied ID, associated with its expected requisition and candidate. Compare its seeded status, all six raw compensation inputs, offer start, separate referral start/referring employee when present, creator and approving person when present. Names or other clear product identity may establish actors; do not require exposed user IDs. Do not grade composition arithmetic, later lifecycle behavior, incidental note/raised_at metadata or exact field labels here. Additional judge-owned offers are allowed.
"""

[[criterion]]
id = "hro_seed_employees"
name = "hro_seed_employees"
type = "binary"
weight = 0.125
description = """
P0: all three supplied referring employees are available with their correct names and distinct identities in normal product content, such as the create-offer referrer selector; ordinary observed product data may clarify association. Do not require a separate employee screen or exact selector/label. This row checks the initial referrer roster, not creation or vesting of an accrual.
"""

[[criterion]]
id = "hro_seed_commitment_movements"
name = "hro_seed_commitment_movements"
type = "binary"
weight = 0.125
description = """
P0: for the original seeded offers/requisitions, the starting commitment records match the eight expected offer-to-requisition and signed-amount tuples as a multiset. Each seeded committed offer has its expected commitment once; seeded PENDING/DRAFT offers have none. Do not require generated movement IDs, exact row-kind labels, table order or a particular response schema. New judge-owned records are outside this initial comparison. Derived headroom remains independently scored.
"""

[[criterion]]
id = "hro_seed_equity_grants"
name = "hro_seed_equity_grants"
type = "binary"
weight = 0.125
description = """
P0: the seeded equity grant associated with OFF-201 has7200 units,fair25.00,strike10.00 and grant instant2026-01-01T00:00:00Z, with no duplicate starting grant or other unexpected grant on the original seeded offers. Ordinary money/date equivalents are accepted. Do not require the generated grant ID or implementation state label; approval-time minting, future replacement and cancellation retain their own rows.
"""

[[criterion]]
id = "hro_seed_signing_payments"
name = "hro_seed_signing_payments"
type = "binary"
weight = 0.125
description = """
P0: the original seeded signing payments are one40000.00 payment for OFF-201 and one30000.00 payment for OFF-205, with no duplicate or other unexpected initial payment on the seeded offers. Identify payment purpose semantically, without exact generated IDs, row-kind labels, response schema or ordering. New judge-owned records are excluded. Later remittances/adjustments/clawbacks remain independently scored.
"""

[[criterion]]
id = "hro_seed_referral_accruals"
name = "hro_seed_referral_accruals"
type = "binary"
weight = 0.125
description = """
P0: the two starting referral records link OFF-110/Ana Ruiz to Sofia Marchetti with referred-hire start2026-02-10T00:00:00Z, and OFF-111/Leo Park to Omar Haddad with start2026-02-01T00:00:00Z. Each appears once, with the flat10000.00 total and5000.00 at-hire/5000.00 contingent components; no extra initial accrual on seeded offers. Generated accrual IDs, schema and ordering are unrestricted. Clock-derived vested amounts and newly created referral behavior remain separate.
"""

[[criterion]]
id = "hro_req_identity"
name = "hro_req_identity"
type = "binary"
weight = 1.0
description = """
P1: using any successfully authorized signed-in role, create and freshly retrieve requisition ID with leading/trailing spaces and /?# intact, preserving title, department and budget. Ordinary UI rendering may collapse whitespace visually: an observed product response or editable detail can establish the exact value. Every-role creation permission, including Auditor, belongs to hro_req_roles.
"""

[[criterion]]
id = "hro_offer_identity"
name = "hro_offer_identity"
type = "binary"
weight = 0.375
description = """
P1: using any successfully authorized creator, raise a valid offer directly PENDING and freshly retrieve it. Preserve the explicitly entered nonblank ID including spaces /?#, requisition, candidate, six economic inputs and both distinct dates/referrer when supplied. No draft-submit dance is required. Judge creation and saved identity here; later approval, rescission and revision routing of unusual IDs have separate owners. Creator-role coverage belongs to hro_raise_roles.
"""

[[criterion]]
id = "hro_offer_id_lifecycle"
name = "hro_offer_id_lifecycle"
type = "binary"
weight = 0.375
description = """
P1: after a saved unusual-ID offer is available, approve that exact offer as a distinct sufficient-tier approver and rescind it directly as Finance without a revision; both actions must target the intended hire. P4 separately carries another unusual offer ID on an unusual requisition ID through approval and revisions using the UI. Judge identifier routing, not numerical settlement results. Use ordinary-ID positive controls and an independently prepared unusual-ID offer if the earlier P1 creation observation failed for an unrelated reason. The saved unusual-ID creation/readback has separate credit in hro_offer_identity.
"""

[[criterion]]
id = "hro_compensation_breakdown"
name = "hro_compensation_breakdown"
type = "binary"
weight = 0.25
description = """
P1/P3: a saved offer has a complete readable compensation view containing base salary, signing bonus, relocation, equity units/fair/strike, intrinsic and annualized equity, committed run-rate, approval-band basis and required tier together. A vertically stacked or scrollable view is valid; opening a detail view is permitted if it contains the whole breakdown. Do not require one viewport, fixed columns, exact labels or a particular layout. Mutually exclusive views that hide one compensation figure when another opens do not establish the together-view. Judge populated information coverage and association with the selected offer here; arithmetic accuracy and exact saved values retain their own independent criteria. Ordinary network responses alone do not establish visible completeness.
"""

[[criterion]]
id = "hro_duplicate_identity"
name = "hro_duplicate_identity"
type = "binary"
weight = 1.0
description = """
P1: after a successful saved requisition and offer, attempt same-kind duplicate IDs and whitespace-only IDs through UI or an observed write replay. Reject without replacing the originals or adding rows. Matching an existing ID of the other record kind is allowed; do not impose global uniqueness, prefixes or trimmed identity.
"""

[[criterion]]
id = "hro_numeric_validation"
name = "hro_numeric_validation"
type = "binary"
weight = 0.1875
description = """
P2 requisition input: after a valid requisition creation control, reject negative, fractional-cent, nonnumeric and unsafe-integer budget values in the app's observed input representation. The invalid attempt adds no requisition or economic record and does not change an existing one. Browser money fields legitimately accept two decimal dollar amounts. Offer inputs and computed overflow have separate owners.
"""

[[criterion]]
id = "hro_offer_create_validation"
name = "hro_offer_create_validation"
type = "binary"
weight = 0.1875
description = """
P2 offer creation input: after a valid offer creation control, reject negative money, fractional shares, fractional cents in an observed cents-valued request, nonnumeric and unsafe-integer economic inputs without creating or replacing an offer or economic record. Reuse the UI-observed request shape; interpret units as whole shares and normal browser money as two-decimal dollars. Requisition budget and revision validation have separate owners.
"""

[[criterion]]
id = "hro_offer_revision_validation"
name = "hro_offer_revision_validation"
type = "binary"
weight = 0.1875
description = """
P2 offer revision input: after a valid revision control, reject negative money, fractional shares, fractional cents in an observed cents-valued request, nonnumeric and unsafe-integer economic inputs. The invalid revision preserves the current offer, lineage and all economic records. Reuse the UI-observed request shape; valid create and invalid create receive separate credit.
"""

[[criterion]]
id = "hro_computed_overflow"
name = "hro_computed_overflow"
type = "binary"
weight = 0.1875
description = """
P2 computed overflow: units9007199254740991 at fair.02/strike0 exceed safe intrinsic despite individually safe inputs and must be refused without creating or changing an offer or economic record. Accept and preserve a neighboring valid control with the same safe units and zero fair/strike spread. Use the actual UI or observed request representation. Input-type validation has separate credit.
"""

[[criterion]]
id = "hro_money_precision"
name = "hro_money_precision"
type = "binary"
weight = 0.25
description = """
P2 exact-money control: on an affordable ordinary requisition, raise through the UI a base100.00, bonus0, one-unit offer with relocation90071992547409.91 and fair/strike both70368744177664.01 dollars. These are valid safe-integer cent values; equal fair and strike keep intrinsic zero and run-rate small while the nonzero unit makes the equity fields applicable. Save and freshly read the exact values. Approve as a distinct sufficient-tier approver, then open revision through the UI, change only base to101.00 and submit without retyping the three large money fields. The saved revision and retained predecessor must preserve all three large amounts exactly. A normal small-money creation/revision establishes working controls; reuse prior controls. Observe rendered values or ordinary product responses, interpreting their public representation rather than demanding cents-valued keys. This row owns exact UI money round-tripping, not rejection of invalid inputs, general revision lineage or arithmetic formulas.
"""

[[criterion]]
id = "hro_date_validation"
name = "hro_date_validation"
type = "binary"
weight = 1.0
description = """
P2: valid full UTC instant control first; impossible calendar date 2025-02-30T00:00:00Z and invalid date text cannot create an offer, revise a record or rescind it; no economic side effects. Do not require revision to edit dates if it offers only economic fields: an injected invalid date may be ignored with the valid revision applied, provided stored dates stay valid and unchanged. Zero-padding and equivalent valid UTC instant formatting are permitted. Also reject missing required offer start, referred-hire date when a referrer is selected, and rescission effective date; accept a real YYYY-MM-DD date as UTC midnight.
"""

[[criterion]]
id = "hro_intrinsic"
name = "hro_intrinsic"
type = "binary"
weight = 1.0
description = """
P3: visible intrinsic equals units times positive fair-minus-strike: two units at .03/.02 -> $.02. Also inspect pending offers with fair equal to and below strike: intrinsic is zero. No credit for gross-fair or strike notional as intrinsic. Owns only intrinsic.
"""

[[criterion]]
id = "hro_annual"
name = "hro_annual"
type = "binary"
weight = 1.0
description = """
P3: $.02 intrinsic annualizes to $.01; $.01 intrinsic annualizes to $0.00. Require exact visible annualized values; no rounding the unit spread or using gross grant value. Can establish these independently with valid pending offers if another composition leg is broken.
"""

[[criterion]]
id = "hro_runrate"
name = "hro_runrate"
type = "binary"
weight = 1.0
description = """
P3 and P4 initial: run-rate excludes signing and relocation and includes annualized intrinsic; P3 baseline $199999.98, P4 $100001.77. Check visible figure, independently of band or commitment correctness.
"""

[[criterion]]
id = "hro_basis"
name = "hro_basis"
type = "binary"
weight = 1.0
description = """
P3 baseline basis $199999.99 (base199999.97 plus half-up .01 bonus plus annual .01); P4 initial basis $105001.78. Relocation excluded. Distinguish rounding half the odd-cent bonus before addition.
"""

[[criterion]]
id = "hro_bands"
name = "hro_bands"
type = "binary"
weight = 1.0
description = """
P3: bases199999.97/199999.98 and349999.97/349999.98, each with bonus.01 and equity intrinsic.02, yield bases199999.99/200000.00/349999.99/350000.00 and required tiers1/2/2/3. Judge the stated bands against known raw inputs, not a possibly wrong sibling display.
"""

[[criterion]]
id = "hro_approval_role"
name = "hro_approval_role"
type = "binary"
weight = 1.0
description = """
P5: a distinct seeded approver successfully approves a valid affordable pending control. Replay a different valid pending approval as Recruiter, Comp partner, Finance and Auditor; each is forbidden (403) and remains pending with no settlement rows. Derive request from UI; hiding the control alone does not prove server refusal.
"""

[[criterion]]
id = "hro_raise_roles"
name = "hro_raise_roles"
type = "binary"
weight = 0.5
description = """
P5: Recruiter, Comp partner, each seeded approver and Finance can raise distinct PENDING controls; reuse P1/P5 successful observed creations. Auditor is refused403 on a replay of an observed offer creation with a new ID, which never appears. Judge only offer-creation rights; hro_req_roles separately owns requisition-creation rights. If one role cannot create a requisition, use an existing suitable requisition for its offer control.
"""

[[criterion]]
id = "hro_req_roles"
name = "hro_req_roles"
type = "binary"
weight = 0.5
description = """
P1/P5: every seeded signed-in account, including Auditor and all three approver tiers, can open and freshly retrieve an ordinary valid requisition with its entered title, department and budget. Reuse already observed successful requisition creations rather than repeat them. This row owns requisition-creation permission only; do not withhold it for offer-creation, compensation or settlement failures. Basic caller-chosen ID handling is separately hro_req_identity.
"""

[[criterion]]
id = "hro_revision_roles"
name = "hro_revision_roles"
type = "binary"
weight = 1.0
description = """
P5: successful separate committed revisions by Recruiter, each of tiers1/2/3 and Finance; Comp partner and Auditor are forbidden (403) on other committed controls with no mutation. A successful revision need only alter base minimally; economic correctness is scored separately. Use P4/P5 observations where relevant. At least one Recruiter revision crosses into BandIII on an ample-budget requisition without a new approval or tier check.
"""

[[criterion]]
id = "hro_rescission_role"
name = "hro_rescission_role"
type = "binary"
weight = 1.0
description = """
P5: Finance successfully rescinds a valid committed control at a valid instant. Recruiter, Comp partner, all three Approvers and Auditor receive403 for a separate committed control, which retains its pre-attempt state and economics. Role coverage can use observed request replay.
"""

[[criterion]]
id = "hro_tier"
name = "hro_tier"
type = "binary"
weight = 0.75
description = """
P5: exercise the complete three-tier/three-band authority matrix on affordable offers raised by someone else: tier1 succeeds on I and refuses II/III; tier2 succeeds on I/II and refuses III; tier3 succeeds on I/II/III. Every refusal is403 and leaves the target pending with its economic state unchanged. For each refusing actor, its own successful in-range approval is the matching control; a different actor's success cannot establish this. Reuse successful observations across protocols where actor, raw band economics and eligibility match. Use different records from the self-approval witness. This row owns the held-tier >= required-tier decision, not refusal-message contents or unrelated settlement arithmetic. Informative refusal contents belong to hro_tier_feedback.
"""

[[criterion]]
id = "hro_tier_feedback"
name = "hro_tier_feedback"
type = "binary"
weight = 0.25
description = """
Reuse P5's insufficient-authority attempts: tier1 against BandII and BandIII, and tier2 against BandIII. The refusal information available to the acting person names both that actor's held tier and the offer's required tier. Roman numerals, Arabic numbers and equivalent clear wording are allowed; no exact message or display location is required. First establish the same actor's successful in-range approval control. Judge the two informative authority values here, independently of unchanged-state enforcement, unrelated arithmetic and the complete success matrix. If an unrelated setup fails, use a new affordable pending offer raised by another person and derive its required tier from known raw compensation. Preserve the other row's valid enforcement observations even when these informative values are missing. A generic 'not authorized' message does not satisfy this row. If an attempt succeeds rather than refuses, do not invent refusal feedback or inherit a sibling verdict: report the absence of the owned observation.
"""

[[criterion]]
id = "hro_dual"
name = "hro_dual"
type = "binary"
weight = 1.0
description = """
P5: inspect OFF-DC raised by Bill, the seeded tier2 approver; refuse Bill's self-approval, unchanged, while Bill successfully approves another affordable pending offer raised by someone else. A distinct authorized approver MUST then successfully approve that same OFF-DC, proving the target was approvable. Verify creator and tier from product data first. If seed handling is separately broken, a fresh affordable Bill-created pending offer with the same refusal and distinct-approver success is an equivalent control.
"""

[[criterion]]
id = "hro_approval_budget"
name = "hro_approval_budget"
type = "binary"
weight = 0.75
description = """
P6: on an independent budget100000.00 requisition, approve base99999.99, bonus100000.00, no equity despite basis149999.99; remaining $.01 permits base$.01, then another base$.01 is refused without settlement effects or changes to saved economic state. This distinguishes run-rate from band basis, equality from strict-less-than and live headroom from initial budget. This row owns financial enforcement; the informative shortfall is independently hro_approval_budget_feedback.
"""

[[criterion]]
id = "hro_approval_budget_feedback"
name = "hro_approval_budget_feedback"
type = "binary"
weight = 0.25
description = """
Reuse P6's approval-overrun refusal after a successful affordable approval control. The refusal identifies the shortfall: in the prescribed final attempt, available headroom is zero and a $.01 run-rate is $.01 short. Equivalent money formatting and clear wording are allowed. If unrelated setup behavior required another dedicated valid requisition/offer, calculate the expected shortfall from its actual recorded headroom and requested run-rate. Grade informative shortfall feedback independently of financial enforcement and unchanged state. A generic 'over budget' message is insufficient. Do not require displaying the available amount for this approval row: the public approval rule requires the shortfall, while the revision rule separately requires available amount and shortfall.
"""

[[criterion]]
id = "hro_commitment"
name = "hro_commitment"
type = "binary"
weight = 1.0
description = """
P4 approval: a visible movement consumes exactly100001.77 and headroom drops by that amount from observed initial budget. Before mutations, seeded REQ-ENG-2 budget450000.00 and movements-200000.00/-197000.00 yield53000.00 headroom, not its stale60000.00 planning scalar. This row owns live movement netting and the approval effect. Later preservation of old monetary rows belongs to hro_history.
"""

[[criterion]]
id = "hro_grant"
name = "hro_grant"
type = "binary"
weight = 1.0
description = """
P4 approval: new grant contains7 units with original start instant and equity schedule20% at12 months,+4% thereafter,capped at32 months. Also approve a zero-unit control and verify no nonzero/current equity grant. Score the recorded approval-time grant only; preservation after later revisions belongs to hro_revision_equity.
"""

[[criterion]]
id = "hro_signing"
name = "hro_signing"
type = "binary"
weight = 0.75
description = """
P4 approval: exactly10000.01 paid as initial signing remittance linked to the approved offer. Inspect an otherwise equivalent zero-bonus approved control: no nonzero signing payment. Allow omitted zero rows.
"""

[[criterion]]
id = "hro_relocation_approval"
name = "hro_relocation_approval"
type = "binary"
weight = 0.25
description = """
P4 approval: successfully approve an otherwise valid affordable offer with a nonzero relocation amount, such as P4's123.45, and a nonzero signing bonus. Capture its payment/remittance records immediately before and after. Approval must not post a relocation payment or any other financial posting attributable to paying or reimbursing relocation. The offer may retain and display the agreed relocation input, including in its audit receipt. A successful approval is required; a missing or refused operation cannot earn absence credit. Judge only relocation's exclusion from settlement here, independently of the signing amount, approval budget arithmetic or another criterion's verdict. Use an independent ordinary successful approval with nonzero relocation if P4 cannot advance. Identify the financial purpose from ordinary product records and observed responses, not an exact row-kind label, field name or endpoint. A hidden UI alone does not establish absence when the normal product response exposes additional payment records.
"""

[[criterion]]
id = "hro_referral_creation"
name = "hro_referral_creation"
type = "binary"
weight = 1.0
description = """
P4 approval: exactly one10000.00 accrual to employee Dara Whitfield, not candidate, with5000.00 at-hire and5000.00 contingent components and the separate referred-hire date. An approved no-referrer control has no referral accrual. Owns creation/split, not retention timing or later immutability.
"""

[[criterion]]
id = "hro_revision_lineage"
name = "hro_revision_lineage"
type = "binary"
weight = 1.0
description = """
P4: both revisions mint new already-COMMITTED offers, retain prior economic/date/creator fields and link each superseded predecessor to its successor. Latest values exactly match all six supplied economics. Do not require a specific generated-ID format. If second revision fails, demonstrate a separate second-generation chain before concluding; initial approval correctness is not this row's bar.
"""

[[criterion]]
id = "hro_revision_budget"
name = "hro_revision_budget"
type = "binary"
weight = 0.75
description = """
P6 revision branch: budget100000.00, committed base80000.00 no equity, headroom20000.00. Revision to100000.00 succeeds because old commitment is released; next revision100000.01 refuses and preserves active lineage/movements/headroom. A later revision to90000.00 yields10000.00 headroom, with original reversal and replacement rows visible. Distinct from the approval budget branch.
"""

[[criterion]]
id = "hro_revision_budget_feedback"
name = "hro_revision_budget_feedback"
type = "binary"
weight = 0.25
description = """
P6 revision refusal: after a successful affordable revision control, the over-budget revision explains both the available replacement budget and its shortfall in the user-visible refusal. In the prescribed branch those figures are100000.00 available and.01 short. Equivalent wording, money formatting and inline/dialog/notification locations are allowed. If a prior unrelated outcome required an equivalent setup, derive the two expected figures from that setup's actual stored headroom plus immediate predecessor run-rate and the requested replacement run-rate. Judge the two informative refusal figures independently from financial enforcement, unchanged state and recovery in hro_revision_budget; a generic 'over budget' message is insufficient here.
"""

[[criterion]]
id = "hro_revision_signing"
name = "hro_revision_signing"
type = "binary"
weight = 0.75
description = """
P4: first signing adjustment-1999.98, second+4000.02; net signing paid12000.05. Zero-delta revision may omit a zero adjustment. Judge the new adjustment amounts and current paid total here, relative to successful observed predecessor values if unrelated inputs had to use equivalent fallback. Preservation of the original payment's historical fields belongs to hro_history.
"""

[[criterion]]
id = "hro_relocation_revision"
name = "hro_relocation_revision"
type = "binary"
weight = 0.25
description = """
P4 revisions: after recording the predecessor's nonzero relocation amount and payment/remittance records, successfully revise relocation from123.45 to222.22 and then to333.00 with the other P4 inputs. Compare fresh payment/remittance records after each revision: neither revision posts a relocation payment, repayment, reversal or adjustment for the new amount, prior amount or their difference. Retaining relocation in offer versions and snapshots is allowed. Successful revisions that actually save the changed relocation inputs are required; unchanged or refused actions cannot earn absence credit. Judge only relocation's exclusion from settlement here; signing adjustment accuracy, lineage correctness and preserved historical fields have their own criteria. If an unrelated P4 outcome fails, use independent ordinary successful revisions with different nonzero before/after relocation amounts; do not require second-generation lineage merely to establish this exclusion. Identify financial purpose through ordinary product records and observed responses, without an exact type label, field name or endpoint. UI omission alone does not establish absence when ordinary product responses expose additional payment records.
"""

[[criterion]]
id = "hro_revision_equity"
name = "hro_revision_equity"
type = "binary"
weight = 1.0
description = """
P4: first and second prior grants become SUPERSEDED historical grants preserving7 then11 units and their original grant instant. Active grant has13 revised units and original instant, not revision time; previous cancellation totals remain unchanged. No two grants simultaneously count as current. A separate successful revision to zero units leaves no active grant while preserving superseded history.
"""

[[criterion]]
id = "hro_referral_immutable"
name = "hro_referral_immutable"
type = "binary"
weight = 1.0
description = """
P4: record initial referral identity/employee/dates/components/vested amount; both revisions and final rescission leave that original accrual unchanged and create no extra referral. Compare against its initial observation, not sibling arithmetic expectations. If P4 cannot advance, independent valid offers can establish each transition; need all three operation kinds.
"""

[[criterion]]
id = "hro_release"
name = "hro_release"
type = "binary"
weight = 1.0
description = """
P4 final: release90009.78, restoring original P4 requisition headroom; new row points at latest offer, which becomes RESCINDED with entered effective instant. If unrelated revisions fail, rescind an independently committed ordinary offer and grade release equal to its recorded run-rate. Old monetary-row preservation belongs to hro_history.
"""

[[criterion]]
id = "hro_claw"
name = "hro_claw"
type = "binary"
weight = 0.75
description = """
P4 final12-month case: current12000.05 paid, half-up40% vested4800.02, claw7200.03. P7 13-month case bonus100.01 ->45.00 vested55.01 claw; schedule differs from equity. Show retained and clawed figures, effective instant and the new contra against lineage payments, with final net paid equal to retained signing. Old payment-field preservation belongs to hro_history.
"""

[[criterion]]
id = "hro_relocation_rescission"
name = "hro_relocation_rescission"
type = "binary"
weight = 0.25
description = """
P4 final rescission: on the current committed offer carrying nonzero relocation333.00, record payment/remittance records, then successfully rescind as Finance with a valid effective date and freshly read the records. Rescission must not post any relocation clawback, repayment, reversal or other financial settlement of relocation. The stored relocation input may remain in the historical offer and receipt. Successful rescission is required; a dead handler cannot earn absence credit. Judge relocation's exclusion independently of signing-clawback arithmetic, equity cancellation, budget release or sibling verdicts. If P4 cannot advance, directly approve and then rescind an independent ordinary offer with nonzero relocation and a nonzero partially unvested signing bonus; no revision is required for this fallback. Inspect ordinary product records and observed responses, without requiring an exact financial-row label, schema or endpoint. A UI that hides payment records does not establish absence when ordinary product responses expose them.
"""

[[criterion]]
id = "hro_cancel"
name = "hro_cancel"
type = "binary"
weight = 1.0
description = """
P4 final: latest13-unit grant retains3 and cancels10 at20%; historical7/11 grants gain no cancellation. P7 13-month case7 units at24% retains2 cancels5. A direct independent13-unit approval at the same original date can establish12-month rounding if unrelated revision setup fails; historical-grant protection still needs a completed revision witness.
"""

[[criterion]]
id = "hro_months"
name = "hro_months"
type = "binary"
weight = 1.0
description = """
P7: leap-day start2024-02-29T12:34:56.789Z, rescind one millisecond before2025-02-28T12:34:56.789Z ->11 months, at instant ->12. A separate effective instant before its start gives zero completed months and zero vested rate. Separate Jan31 start2024-01-31T12:00:00Z, rescind2025-03-30T12:00:00Z ->13 months, not14 from repeatedly clamping February. Derive expected signing rates0/40/45% and equity0/20/24%. Only grade the month selection here; use visibly reported month/rate or distinguish with simple100.00 bonus and100 units. Do not charge this row for correct months plus a separate amount-rounding defect.
"""

[[criterion]]
id = "hro_signing_cap"
name = "hro_signing_cap"
type = "binary"
weight = 0.5
description = """
P7: at24 completed months a100.01 signing bonus is fully vested with zero clawback; at32 months it remains fully vested with zero clawback. Allow an omitted zero contra. First establish an actual partial signing rescission, e.g. P7's13-month case, so a handler that never settles cannot pass. Grade this signing cap independently of equity amounts/cancellation or a sibling's numerical-rounding failure: visibly reported signing rate100% and matching full retained amount establish the cap.
"""

[[criterion]]
id = "hro_equity_cap"
name = "hro_equity_cap"
type = "binary"
weight = 0.5
description = """
P7: at24 completed months the7-unit equity grant is only68% vested, retaining5 and cancelling2; at32 months the same-size independent grant is fully vested, retaining7 and cancelling0. Allow an omitted zero cancellation. Establish a successful partial equity rescission before crediting the absence of a32-month cancellation. Judge the equity schedule and cap independently of signing: if unrelated unit rounding obscures the rate, an otherwise equivalent100-unit control must retain68/cancel32 at24 months and retain100/cancel0 at32. Amount rounding for the odd-unit12/13-month witnesses belongs to hro_cancel.
"""

[[criterion]]
id = "hro_referral_clock"
name = "hro_referral_clock"
type = "binary"
weight = 0.75
description = """
P8: offer start2026-07-01 for all, referral starts2026-02-01T00:00:00Z and2026-02-01T00:00:00.001Z -> reference2026-08-01 yields10000.00 vs5000.00 vested. Add start2026-01-31T12:00:00Z -> cliff2026-07-31T12:00:00Z, fully vested. Approval and later rescission effective dates must not substitute for fixed reference or referral start.
"""

[[criterion]]
id = "hro_referral_immediate"
name = "hro_referral_immediate"
type = "binary"
weight = 0.25
description = """
P8 future-start control: approve an otherwise ordinary affordable offer whose offer start is2026-09-01T00:00:00Z and separate referred-hire start is2026-09-15T00:00:00Z, both later than the stored2026-08-01 reference moment. Immediately after approval, the referral shows5000.00 vested at hire and5000.00 still contingent; it must not withhold the first half until either scheduled start. Reuse a prior ordinary successful referred approval as control. This row owns immediate vesting at the approval event; referral ownership/split is hro_referral_creation and the separate six-month cliff is hro_referral_clock.
"""

[[criterion]]
id = "hro_competing"
name = "hro_competing"
type = "binary"
weight = 1.0
description = """
P6 race: own requisition budget100.00, two separate pending base60.00 offers, each bonus10.00, one unit at fair1.00/strike0, referrer Dara with referral start2026-02-01; both created by Recruiter with valid offer start2026-01-01. After a separate successful ordinary approval establishes the real request shape, as distinct tier3 send these two approval requests concurrently using Promise.all through browser_run_code_unsafe and the observed app interface. Exactly one commits and consumes60.25; the other remains pending, headroom39.75, only one settlement movement/receipt and one winner grant/payment/referral, with none for the loser. Do not require which offer wins or any response latency. Re-read fresh persisted state. This is a finite concurrent witness, not a proof of every interleaving.
"""

[[criterion]]
id = "hro_stale_approval"
name = "hro_stale_approval"
type = "binary"
weight = 0.125
description = """
P4/P5/P9 sequential approval: after an actual successful ordinary approval, replay its approval request and require refusal. Also refuse approval of seeded DRAFT OFF-301; inspect that DRAFT contributes no commitment. The successful pending approval is the positive control for the same approval mechanism. This row owns sequential approval eligibility only, not revision or rescission protections. Compare fresh persisted state before/after: no new offer, movement, grant, payment, referral, successful settlement audit entry or after-image, and no changed active lineage/economic values. Generic access/security logs may grow. Reuse successful observed action controls, not sibling verdicts.
"""

[[criterion]]
id = "hro_stale_revision"
name = "hro_stale_revision"
type = "binary"
weight = 0.1875
description = """
P4/P5/P9 sequential revision: first perform a successful committed-offer revision. Attempt revision of its superseded ancestor, an ordinary PENDING offer and an already rescinded offer; all refuse. Use an independent ordinary successful rescission to prepare the last target if P4 failed. This row owns sequential revision eligibility only, not approval or rescission refusal. Compare fresh persisted state before/after: no new offer, movement, grant, payment, referral, successful settlement audit entry or after-image, and no changed active lineage/economic values. Generic access/security logs may grow. Reuse successful observed action controls, not sibling verdicts.
"""

[[criterion]]
id = "hro_stale_rescission"
name = "hro_stale_rescission"
type = "binary"
weight = 0.1875
description = """
P4/P5/P9 sequential rescission: first perform a successful Finance rescission of an ordinary committed target. Replay that rescission, then attempt Finance rescission of a superseded ancestor and an ordinary PENDING offer; all refuse. Independently prepare the superseded target with an ordinary successful revision if needed. This row owns sequential rescission eligibility only, not approval or revision refusal. Compare fresh persisted state before/after: no new offer, movement, grant, payment, referral, successful settlement audit entry or after-image, and no changed active lineage/economic values. Generic access/security logs may grow. Reuse successful observed action controls, not sibling verdicts.
"""

[[criterion]]
id = "hro_concurrent_approval"
name = "hro_concurrent_approval"
type = "binary"
weight = 0.125
description = """
P9 same-target approval pair: target one affordable PENDING hire, raised by a person distinct from the authorized approver. Use Promise.all with two copies of the actual UI-observed successful request shape under an authorized session and an ample budget. Exactly one succeeds and the other is refused. Inspect fresh persisted results: only one transition's complete effects and one current lineage; no duplicate economic rows or settlement receipts. Do not require which request wins or its latency. The winner is the matching positive control; an independently successful ordinary action first establishes the request shape. Evaluate exclusivity relative to the observed successful action, not a sibling formula verdict. If the shared chain cannot reach this stage, prepare an independent eligible target; do not require the earlier concurrent stage to pass. One offer becomes committed with one approval's movements/grant/payment/referral where applicable and one receipt. P6/hro_competing separately owns two different hires competing for insufficient combined budget.
"""

[[criterion]]
id = "hro_concurrent_revision"
name = "hro_concurrent_revision"
type = "binary"
weight = 0.1875
description = """
P9 same-target revision pair: target one current COMMITTED hire and submit the same valid compensation change twice concurrently. Use Promise.all with two copies of the actual UI-observed successful request shape under an authorized session and an ample budget. Exactly one succeeds and the other is refused. Inspect fresh persisted results: only one transition's complete effects and one current lineage; no duplicate economic rows or settlement receipts. Do not require which request wins or its latency. The winner is the matching positive control; an independently successful ordinary action first establishes the request shape. Evaluate exclusivity relative to the observed successful action, not a sibling formula verdict. If the shared chain cannot reach this stage, prepare an independent eligible target; do not require the earlier concurrent stage to pass. Exactly one successor is minted, its predecessor is superseded once, and only one reversal/replacement, signing adjustment and replacement grant where applicable is posted. Same-target approval success is not this row's prerequisite.
"""

[[criterion]]
id = "hro_concurrent_rescission"
name = "hro_concurrent_rescission"
type = "binary"
weight = 0.1875
description = """
P9 same-target rescission pair: target one current COMMITTED hire as Finance with the same valid effective date in both requests. Use Promise.all with two copies of the actual UI-observed successful request shape under an authorized session and an ample budget. Exactly one succeeds and the other is refused. Inspect fresh persisted results: only one transition's complete effects and one current lineage; no duplicate economic rows or settlement receipts. Do not require which request wins or its latency. The winner is the matching positive control; an independently successful ordinary action first establishes the request shape. Evaluate exclusivity relative to the observed successful action, not a sibling formula verdict. If the shared chain cannot reach this stage, prepare an independent eligible target; do not require the earlier concurrent stage to pass. The target becomes rescinded once, with only one release, contra/cancellation where applicable and receipt. Same-target revision success is not this row's prerequisite.
"""

[[criterion]]
id = "hro_claim_identity"
name = "hro_claim_identity"
type = "binary"
weight = 1.0
description = """
P9: replay an observed valid approval for a different valid pending offer, adding the publicly documented optional claims claimedActorId, claimedRole and claimedTier to the observed request body. Stored actor must be the signed-in actor; an unauthorized actor cannot gain approval by claiming tier3. An otherwise valid request ignores these claims and has the same result as their omission; an unauthorized actor still receives403. Normal approval succeeds as control. Do not guess the app's route or ordinary field names.
"""

[[criterion]]
id = "hro_claim_approval_economics"
name = "hro_claim_approval_economics"
type = "binary"
weight = 0.5
description = """
P9 approval claim: after observing a normal successful approval request, add the publicly documented optional claims claimedBand, claimedTier and claimedCommittedCents to its body on a separate otherwise valid pending offer. Compare the resulting approval, band, tier, commitment and headroom with stored inputs and an omitted-claim control. The claims must be ignored; rejecting solely because they were added also fails. Do not guess routes or ordinary field names. Rescission claims and unrelated formula accuracy have separate credit.
"""

[[criterion]]
id = "hro_claim_rescission_economics"
name = "hro_claim_rescission_economics"
type = "binary"
weight = 0.5
description = """
P9 rescission claim: after observing a normal successful rescission request, add the publicly documented optional claims claimedClawbackCents and claimedCancelledUnits to its body on a separate otherwise valid committed offer. Compare actual clawback, equity cancellation and resulting financial rows with stored inputs, the effective date and an omitted-claim control. The claims must be ignored; rejecting solely because they were added also fails. Do not guess routes or ordinary field names. Approval claims and unrelated formula accuracy have separate credit.
"""

[[criterion]]
id = "hro_anon_read"
name = "hro_anon_read"
type = "binary"
weight = 1.0
description = """
P9: inventory every distinct operational read family actually used by the UI while opening Dashboard, Requisitions, Offers, Equity Table, Referrals and Audit Trail, including available detail/receipt reads. Deduplicate a genuinely shared bootstrap/read rather than require an endpoint per screen. First capture a populated successful authenticated response for each observed family. Replay each without every observed cookie/token/auth credential in a fresh empty context: each must401 and return no operational records. Public health and a login/static app shell may remain public. Do not guess routes or inspect implementation; report the observed inventory and bounded coverage. An empty response without its populated authenticated control proves nothing. If a listed screen lacks a separate request, inspect the shared observed read that supplied its data.
"""

[[criterion]]
id = "hro_anon_req_create"
name = "hro_anon_req_create"
type = "binary"
weight = 0.2
description = """
P9 anonymous requisition creation: capture a successful authenticated UI creation request, then replay its actual shape with a fresh unused ID and without every observed auth credential in a fresh empty context. Require401; fresh authenticated readback shows no new requisition and the valid control remains. Do not guess a route or count login/logout as operational writes. Other write families have separate credit.
"""

[[criterion]]
id = "hro_anon_offer_create"
name = "hro_anon_offer_create"
type = "binary"
weight = 0.2
description = """
P9 anonymous offer creation: capture a successful authenticated UI creation request, then replay its actual shape against a separate valid requisition with a fresh offer ID and without every observed auth credential in a fresh empty context. Require401; fresh authenticated readback shows no new offer or economic record and the valid control remains. Do not guess a route. Other write families have separate credit.
"""

[[criterion]]
id = "hro_anon_approve"
name = "hro_anon_approve"
type = "binary"
weight = 0.2
description = """
P9 anonymous approval: capture a successful authenticated UI approval request, then replay its actual shape against a separate otherwise eligible pending offer without every observed auth credential in a fresh empty context. Require401; fresh authenticated readback shows the offer still pending with no commitment, grant, payment, referral or successful receipt. The valid control remains. Do not use a stale or over-budget target as the only refusal witness. Other write families have separate credit.
"""

[[criterion]]
id = "hro_anon_revise"
name = "hro_anon_revise"
type = "binary"
weight = 0.2
description = """
P9 anonymous revision: capture a successful authenticated UI revision request, then replay its actual shape against a separate current committed offer without every observed auth credential in a fresh empty context. Require401; fresh authenticated readback shows no new lineage, financial row or successful receipt, and the current offer remains unchanged. The valid control remains. Do not use a stale target as the only refusal witness. Other write families have separate credit.
"""

[[criterion]]
id = "hro_anon_rescind"
name = "hro_anon_rescind"
type = "binary"
weight = 0.2
description = """
P9 anonymous rescission: capture a successful authenticated UI rescission request, then replay its actual shape against a separate current committed offer without every observed auth credential in a fresh empty context. Require401; fresh authenticated readback shows no status change, release, clawback, equity cancellation or successful receipt. The valid control remains. Do not use an already rescinded target as the only refusal witness. Other write families have separate credit.
"""

[[criterion]]
id = "hro_audit_text"
name = "hro_audit_text"
type = "binary"
weight = 1.0
description = """
P4: approval, each successful revision and rescission produce immutable human-readable entries naming actor and target with before/after summary. No particular wording, timestamp or exact total log-count increase required. If chain fails, use separate valid controls for each action so independent logging can still earn credit.
"""

[[criterion]]
id = "hro_afterimage"
name = "hro_afterimage"
type = "binary"
weight = 1.0
description = """
P4: each approval/revision/rescission exposes a structured product snapshot containing actual computed figures from that action. Record snapshots when created and read again after later actions: older snapshots must retain then-current values, not recompute from current latest state. Snapshot presentation may be columns, expansion or equivalent; raw implementation inspection prohibited. Each receipt preserves actual actor, before/after headroom and relevant compensation/settlement values. Incorrect arithmetic is separately scored; receipt values must faithfully match the action's observed state.
"""

[[criterion]]
id = "hro_history"
name = "hro_history"
type = "binary"
weight = 1.0
description = """
P4: record the economic fields of original commitment movements and signing payment records immediately after approval, and of each reversal, replacement and signed payment adjustment after its revision. After later revision and rescission, those same monetary ledger records retain their original amounts, identities and links; corrections are new monetary entries. Read them again after fresh Auditor sign-in. Compare recorded actual values, not sibling arithmetic expectations. This row owns only append-only monetary movement/payment history. Offer fields belong to revision lineage, grant history to replacement/cancellation, audit prose to action history, snapshots to after-images, and rejection side effects to refusal rows."""

[[criterion]]
id = "hro_dashboard"
name = "hro_dashboard"
type = "binary"
weight = 1.0
description = """
P10: record open requisition count,total net headroom,committed offers,pending approvals. Create one req budget1000 and pending offer base10: deltas+1,+1000,0,+1. Approve: headroom-10,committed+1,pending-1; revise base20:headroom-10,committed unchanged; rescind:headroom+20,committed-1. Compare deltas, allowing gate/other-protocol records already present. Reuse this small chain for missing audit controls.
"""

[[criterion]]
id = "hro_readback"
name = "hro_readback"
type = "binary"
weight = 1.0
description = """
P10: independently create ordinary requisition/offer, record exact saved details and visible economics, then read in a fresh context signed in as Auditor. Values match actual before-values; do not regrade arithmetic. If approval unavailable, persisted pending offer plus requisition suffices. Independent context, not only same-page reload.
"""

[[criterion]]
id = "hro_restart"
name = "hro_restart"
type = "binary"
weight = 0.5
description = """
P10 LAST: save fresh ordinary req and pending offer independently of revisions, grants or audit. Record all seeded IDs/counts plus these saved details and any available P4 lineage/ledger/snapshot values. Call restart_app exactly once, reopen/sign in and reread: all recorded records/data survive identically, seed IDs remain exactly once, no newly written data replaced with seed. No seeded-only substitute for successful fresh write. Do not rejudge pre-restart arithmetic; tool error is missing restart evidence, not proof of storage loss.
"""

