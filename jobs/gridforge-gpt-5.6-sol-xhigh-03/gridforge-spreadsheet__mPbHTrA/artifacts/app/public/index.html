<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridForge</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><strong class="brand">GridForge</strong><span id="title">Loading workbook…</span></div><div class="login"><label>Signed in as <select id="user"></select></label><span id="presence-count"></span></div></header>
<div id="presence" aria-label="Active collaborators"></div>
<nav class="toolbar" aria-label="Spreadsheet controls"><button id="save">Save now</button><span id="status" class="saved">Loading…</span><span id="revision"></span><button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button><button id="fill-down">Fill ↓</button><button id="fill-right">Fill →</button><button id="history">Cell history</button><button id="revisions">Revisions</button></nav>
<div class="formula-row"><form id="goto-form"><label for="namebox" class="sr-only">Name box</label><input id="namebox" value="A1" aria-label="Jump to cell or range"><button>Go</button></form><span class="fx">fx</span><div class="formula-wrap"><input id="formula" aria-label="Formula or selected cell value" autocomplete="off"><div id="suggestions"></div></div><span id="formula-error"></span></div>
<div class="findbar"><label>Find <input id="find"></label><button id="find-next">Find next</button><label>Replace <input id="replace"></label><button id="replace-one">Replace current</button><button id="replace-all">Replace all</button><span id="find-result"></span></div>
<main><div id="grid-scroll"><div id="grid" tabindex="0" role="grid" aria-label="Plan spreadsheet"></div><input id="cell-editor" aria-label="Edit cell" autocomplete="off"><div id="formula-hints"></div></div></main>
<footer><span id="sheet-tab">Plan</span><span>Tip: type to edit · Shift+Arrow selects a range · Ctrl/Cmd+C, X, V supported</span></footer>
<div id="toast" role="alert"></div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close">Close</button></div><div id="dialog-body"></div></dialog>
<script src="/app.js"></script></body></html>
