<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridForge</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><strong class="brand">GridForge</strong><span id="title">Loading workbook…</span></div><div class="account"><label>Editing as <select id="user"></select></label><span id="presenceSummary"></span></div></header>
<div class="statusbar"><span id="saveState" class="saved">Saved</span><span id="revision">Revision —</span><span id="message" role="alert"></span></div>
<nav class="toolbar" aria-label="Spreadsheet tools">
<button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button><button id="save">Save now</button><span class="sep"></span>
<label>Name <input id="nameBox" size="10" value="A1" aria-label="Cell or range address"></label><button id="go">Go</button>
<button id="fillDown">Fill down</button><button id="fillRight">Fill right</button><button id="clear">Clear</button><button id="historyBtn">Cell history</button><button id="revisionsBtn">Revisions</button>
</nav>
<section class="findbar"><label>Find <input id="find"></label><button id="findNext">Find next</button><label>Replace <input id="replace"></label><button id="replaceOne">Replace current</button><button id="replaceAll">Replace all</button></section>
<section class="formula"><span id="selectedReadout">A1</span><span class="fx">fx</span><input id="formulaBar" autocomplete="off" spellcheck="false" aria-label="Formula or cell value"><button id="commitFormula">Apply</button><div id="functions" class="suggestions" hidden></div></section>
<div id="presenceLegend" class="legend"></div>
<main><div id="grid" tabindex="0" role="grid" aria-label="Plan spreadsheet"><div id="gridCanvas"></div><input id="cellEditor" autocomplete="off" spellcheck="false" aria-label="Edit selected cell"><div id="refOverlay"></div></div><aside id="panel" hidden><button id="closePanel" aria-label="Close panel">×</button><h2 id="panelTitle"></h2><div id="panelBody"></div></aside></main>
<script type="module" src="/app.js"></script></body></html>
