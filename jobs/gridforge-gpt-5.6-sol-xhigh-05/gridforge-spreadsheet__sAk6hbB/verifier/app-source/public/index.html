<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridForge</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div><strong class="brand">GridForge</strong><span id="title">Loading workbook…</span><span id="sheetName" class="pill"></span></div><div class="account"><label>Signed in as <select id="user"></select></label><span id="saveState" class="state">Loading</span></div></header>
<nav class="toolbar" aria-label="Spreadsheet tools"><button id="save">Save now</button><button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button><span class="sep"></span><button id="fillDown">Fill down</button><button id="fillRight">Fill right</button><span class="sep"></span><label>Find <input id="find" size="11"></label><button id="findNext">Next</button><label>Replace <input id="replace" size="11"></label><button id="replaceOne">Replace</button><button id="replaceAll">Replace all</button><button id="revisions">Revisions</button><button id="history">Cell history</button></nav>
<div class="formula-row"><label class="sr-only" for="nameBox">Name box</label><input id="nameBox" value="A1" aria-label="Cell or range address"><span class="fx">fx</span><label class="sr-only" for="formula">Formula or cell value</label><input id="formula" autocomplete="off" aria-label="Formula or cell value"><div id="functions" class="function-menu" hidden></div></div>
<div id="message" role="alert"></div><div id="presence" aria-label="People viewing workbook"></div>
<main><div id="gridWrap"><div id="grid" tabindex="0" role="grid" aria-label="Plan spreadsheet"></div></div><aside id="side" hidden><div class="side-head"><strong id="sideTitle">Revision history</strong><button id="closeSide">×</button></div><div id="sideBody"></div></aside></main>
<script src="/app.js"></script></body></html>
