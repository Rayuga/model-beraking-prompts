<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatchPad</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div><strong class="brand">PatchPad</strong><span class="tagline">Incident report editor</span></div><div class="document-heading"><h1 id="title">Loading document…</h1><span id="author"></span></div></header>
<main><section class="toolbar" aria-label="Editor controls"><button id="save" class="primary">Save</button><button id="undo">Undo</button><button id="redo">Redo</button><span class="divider"></span><label>Find <input id="find" type="search" autocomplete="off"></label><button id="findNext">Find next</button><label>Replace <input id="replace" type="text" autocomplete="off"></label><button id="replaceCurrent">Replace current</button><button id="replaceAll">Replace all</button></section><div id="message" role="alert" aria-live="assertive"></div>
<div class="workspace"><section class="editor-panel"><div id="editorShell" aria-label="Incident report editor" title="Click to edit. Alt-click or Ctrl/Command-click adds a caret."><canvas id="editor" tabindex="0" role="textbox" aria-multiline="true" aria-label="Incident report content"></canvas><div id="spacer"></div></div><footer class="statusbar"><span id="cursor">Line 1, Column 1</span><span id="carets">1 caret</span><span id="revision">Revision —</span><strong id="saveState">Loading</strong></footer></section><aside><h2>Revision history</h2><p class="hint">Preview or restore a saved version.</p><div id="history"></div></aside></div></main>
<dialog id="previewDialog"><div class="dialog-head"><div><h2 id="previewTitle">Revision preview</h2><p id="previewDate"></p></div><button id="closePreview">Close</button></div><pre id="previewContent"></pre><div class="dialog-actions"><button id="restoreRevision" class="primary">Restore this revision</button></div></dialog><script src="/app.js"></script></body></html>
