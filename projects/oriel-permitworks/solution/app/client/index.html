<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oriel Permitworks</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main id="app"></main>
    <style type="text/tailwindcss">
      @layer components {
        .action-button { @apply inline-flex items-center justify-center rounded-lg px-3 py-2 text-sm font-bold transition disabled:cursor-not-allowed disabled:opacity-50; }
        .action-button.primary { @apply bg-amber-300 text-slate-950 hover:bg-amber-200; }
        .action-button.secondary { @apply border border-slate-700 bg-slate-900 text-slate-200 hover:bg-slate-800; }
        .action-button.danger { @apply border border-rose-400/40 bg-rose-400/10 text-rose-100 hover:bg-rose-400/20; }
        .field { @apply mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none ring-amber-300 focus:ring-2; }
        .metric { @apply rounded-2xl border border-slate-800 bg-slate-900 p-5; }
        .metric p { @apply text-sm text-slate-400; }
        .metric strong { @apply mt-2 block text-3xl font-bold; }
        .metric span { @apply mt-2 block text-xs text-amber-200; }
      }
    </style>
    <script src="/app.js"></script>
  </body>
</html>
