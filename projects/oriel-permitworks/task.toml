schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "turing/oriel-permitworks"
version = "2.0.4"
description = "Build Oriel Permitworks, a browser-operated municipal permit desk for intake, review, zoning, fees, inspections, certificates, and audit evidence."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["webdev", "municipal", "permits", "zoning", "inspections", "sqlite", "authorization", "audit", "tailwind"]

[metadata]
category = "Operations"
difficulty = "medium"
difficulty_explanation = "Thirty-four equally weighted browser criteria in seventeen isolated sessions award independent credit for role workspaces and visible records before testing a compact, persisted permit lifecycle with district scope, exact fee controls, two-person waivers, sequenced inspections, audit evidence, and restart durability."
solution_explanation = "A Node.js, Express, and SQLite reference application implements the documented permit intake, review, zoning, fee, inspection, certificate, audit, and restart-persistence workflows."
persona = "Municipal permit operations manager"
task_id = "WEBDEV-ORIEL-PERMITWORKS-001"
capabilities = ["backend-api", "frontend-ui", "persistence", "authorization", "workflow-integrity"]
industry_category = "Operations"
subcategory = "Municipal government"

[agent]
timeout_sec = 10800.0
network_mode = "public"

[verifier]
timeout_sec = 9000.0
network_mode = "public"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""
CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY = "1"
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
ORIEL_SEGMENT_TIMEOUT_SEC = "1200"
ORIEL_BROWSER_BUDGET_SEC = "8400"

[solution]
env = {}

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "public"

[environment.env]
PORT = "3000"
BASE_URL = "http://localhost:3000"
APP_PUBLIC_URL = "http://localhost:3000"
npm_config_bin_links = "false"
