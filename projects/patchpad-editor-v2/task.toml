schema_version = "1.4"

artifacts = ["/app", "/logs/verifier"]

[task]
name = "turing/patchpad-editor-v2"
version = "2.0.3"
description = "Full-stack custom incident-report editor with precise cursor semantics, multi-caret editing, revision history, SQLite persistence, and conflict-safe saves"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "custom-editor", "text-editor", "revision-history", "concurrency", "rewardkit"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Text Editors"
tags = ["full-stack", "custom-input", "unicode", "multi-caret", "sqlite", "revision-history", "optimistic-concurrency", "browser-judge"]
provenance = "Authored from the existing PatchPad incident-report editor task, with a custom editor reference implementation and four-dimension RewardKit evaluation. Earlier submissions are retained as historical evidence; this is the maintained incident-editor package."
arena_slice = "full-stack-node-express-sqlite-custom-text-editor"
difficulty_explanation = "The task combines a from-scratch long-document editor, exact cursor and selection semantics, Unicode graphemes, atomic undo and clipboard operations, multi-caret edits, durable revisions and server-enforced stale-save protection."
solution_explanation = "The reference solution uses a custom DOM text surface backed by an explicit document model and a Node SQLite service for idempotent seed creation, revisions and compare-before-write persistence."
verification_explanation = "Small Render and Constraints gates verify a healthy local editor shell. Twenty-five Functional checks cover editing, persistence, manifest route documentation and real server restarts through a verifier-owned lifecycle helper. Four Polish checks cover visible usability. All application behavior is checked through live browser/API observations; manifest text is inspected only as documentation."
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 7200.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 1800.0

[verifier]
timeout_sec = 12600.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "high"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.openai.com"]
