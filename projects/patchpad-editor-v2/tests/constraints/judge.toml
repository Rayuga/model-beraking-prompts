# Prompt version: patchpad-editor-v2-constraints-v2.0.3
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 600
isolated = false
reasoning_effort = "high"
temperature = 0
weight = 0.000001
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "same_origin_application_shell"
name = "same_origin_application_shell"
type = "binary"
weight = 1.0
description = """
Require the root document and every script, style, font, image, and application
request needed for the visible editor shell to come from localhost on the
application origin. Incidental browser-internal URLs are irrelevant. Fail for
a required public-internet runtime asset or cross-origin application API.
"""

[[criterion]]
id = "self_contained_entry_and_reload"
name = "self_contained_entry_and_reload"
type = "binary"
weight = 1.0
description = """
Open the root entry and require rendered HTML with a usable editor
surface. Fully reload and require that surface to return through the app's
ordinary entry point without a build, install, or external navigation.
"""
