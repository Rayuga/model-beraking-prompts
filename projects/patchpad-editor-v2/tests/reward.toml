# Render and Constraints are hard gates in test.sh. Passing submissions receive
# an exact 90% Functional / 10% Polish score. The custom-document-surface
# requirement is a zero-reward Constraints prerequisite, not a tiny bonus.
[[reward]]
name = "reward"
aggregation = "weighted_mean"
weights = { render = 0.000001, constraints = 0.000001, functional = 0.9, polish = 0.1 }
