[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "page_load_and_refresh"
name = "page_load_and_refresh"
type = "binary"
weight = 1.0
description = """
Open the root page and require a substantive PatchPad interface with readable
document content. Reload once and require it to return without a fatal
browser error, blank document, raw JSON response, or server error page.
"""

[[criterion]]
id = "basic_control_interaction"
name = "basic_control_interaction"
type = "binary"
weight = 1.0
description = """
Focus one visible text control such as Find and enter a short search string.
Require the entered text to remain editable and the page to remain responsive.
Do not require search results, an edit, or a saved mutation for this smoke test.
Clear the search and close any panel opened for this check.
"""
