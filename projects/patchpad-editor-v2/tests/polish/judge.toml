# Prompt version: patchpad-editor-v2-polish-v2.0.2
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 3000
isolated = false
reasoning_effort = "high"
temperature = 0
weight = 0.4
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "labelled_primary_controls"
name = "labelled_primary_controls"
type = "binary"
weight = 1.0
description = """
Require visible, understandable controls for Save, Undo, Redo, Find Next,
Replace Current, Replace All and revision history. Find and replacement inputs
must have visible labels, placeholders, or accessible names.
"""

[[criterion]]
id = "keyboard_focus_and_editor_entry"
name = "keyboard_focus_and_editor_entry"
type = "binary"
weight = 1.0
description = """
Starting at the page, use Tab and Shift+Tab to reach representative toolbar
controls, both search inputs, the custom editor, and revision history. Each
focused control must have a visible focus indicator, and focus must not become
trapped.
"""

[[criterion]]
id = "editor_visual_hierarchy"
name = "editor_visual_hierarchy"
type = "likert"
points = 5
weight = 1.0
description = """
Require the report title, toolbar, line-number gutter, document text, current
line or selection, saved state, cursor position, and history panel to be
visually distinct and readable without overlapping text or controls at a 1280
by 800 viewport.

Rate 1 for unreadable or heavily overlapping content, 3 for readable content
with inconsistent grouping or minor crowding, and 5 for clear grouping with
all listed areas readable and free of overlap. Use 2 or 4 for intermediate
quality. Missing or broken application content receives 1.
"""

[[criterion]]
id = "history_and_feedback_readability"
name = "history_and_feedback_readability"
type = "binary"
weight = 1.0
description = """
Require revision numbers and timestamps to be readable in the history area and
visible status/error regions whose wording or role distinguishes normal save
feedback from a failure. Information must not depend on color alone.
"""
