<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatchPad Editor</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #526477;
      --line: #d7dde6;
      --paper: #fff;
      --panel: #f5f7fb;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
      --select: #c9e8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #e9edf3;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
    }
    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: #17202a;
      color: white;
    }
    .brand { font-weight: 800; font-size: 1.15rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 12px; color: #dbeafe; font-size: .9rem; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: 0;
    }
    .workspace { min-width: 0; padding: 20px; }
    .report-heading { margin-bottom: 18px; }
    .report-heading p { margin: 0 0 6px; color: var(--accent-dark); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .report-heading h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 750; letter-spacing: -.025em; }
    #focus-state { margin: 12px 0; color: var(--muted); font-size: 13px; }
    #message { margin: 10px 0 0; line-height: 1.4; }
    #message:empty { display: none; }
    .toolbar, aside {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px 10px 0 0;
    }
    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 7px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    input {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 9px;
      font: inherit;
      min-width: 120px;
      width: 138px;
    }
    .status { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 550; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .error { color: var(--danger); font-weight: 700; }
    .editor-shell {
      height: calc(100vh - 151px);
      border: 1px solid var(--line);
      border-top: 0;
      background: var(--paper);
      overflow: auto;
      font-family: "Liberation Mono", Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 22px;
      outline: none;
      cursor: text;
      tab-size: 2;
      border-radius: 0 0 10px 10px;
      scrollbar-gutter: stable;
    }
    .editor-shell:focus { box-shadow: inset 0 0 0 2px #99f6e4; }
    .editor-shell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .line {
      display: grid;
      grid-template-columns: 64px minmax(max-content, 1fr);
      min-height: 22px;
      white-space: pre;
    }
    .gutter {
      user-select: none;
      text-align: right;
      padding-right: 12px;
      color: #63758a;
      border-right: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .text {
      position: relative;
      padding: 0 10px;
      min-width: 900px;
    }
    .selection { background: var(--select); }
    .section-heading .text { font-weight: 700; color: #174d49; background: #f0f7f6; }
    .section-heading .gutter { color: #174d49; background: #e8f1ef; }
    .editor-shell::selection { background: transparent; }
    .find-hit { background: #fde68a; }
    .active-hit { outline: 2px solid #f97316; }
    .caret {
      display: inline-block;
      width: 2px;
      height: 18px;
      margin: 2px -1px -4px -1px;
      background: #111827;
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }
    .multi-caret { background: #7c3aed; }
    @keyframes blink { 50% { opacity: 0; } }
    aside {
      border-left: 1px solid var(--line);
      padding: 20px 16px;
      overflow: auto;
      min-width: 0;
      min-height: 0;
    }
    aside h2, aside h3 { margin: 0 0 12px; font-size: 15px; font-weight: 750; }
    #document-list { margin-bottom: 24px; }
    .revision {
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .revision > span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .revision > button { margin-top: 8px; }
    .revision pre {
      max-height: 340px;
      overflow: auto;
      background: #f8fafc;
      padding: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: "Liberation Mono", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.65;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin: 14px 0 0;
    }
    .history-node button {
      width: 100%;
      margin: 0 0 6px;
      text-align: left;
      font-size: .86rem;
      overflow-wrap: anywhere;
    }
    .history-node button[aria-current="true"] {
      border-color: var(--accent);
      background: #ccfbf1;
    }
    @media (min-width: 901px) {
      body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
      header { flex: 0 0 auto; }
      main { flex: 1; overflow: hidden; }
      .workspace { display: flex; flex-direction: column; min-height: 0; }
      .workspace > :not(.editor-shell) { flex-shrink: 0; }
      .editor-shell { flex: 1; height: auto; min-height: 0; }
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
      .editor-shell { height: 60vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">PatchPad Editor</div>
    <div class="meta">
      <span id="revision-label">Revision -</span>
      <span id="cursor-label">Ln 1, Col 1</span>
    </div>
  </header>
  <main>
    <section class="workspace">
      <div class="report-heading">
        <p>Incident report</p>
        <h1 id="doc-title">Loading document...</h1>
      </div>
      <div class="toolbar" aria-label="Editor controls">
        <button type="button" class="primary" id="save-btn">Save</button>
        <button type="button" id="undo-btn">Undo</button>
        <button type="button" id="redo-btn">Redo</button>
        <input id="find-box" aria-label="Find text" placeholder="Find">
        <input id="replace-box" aria-label="Replacement text" placeholder="Replace">
        <button type="button" id="find-next-btn">Find Next</button>
        <button type="button" id="replace-current-btn">Replace Current</button>
        <button type="button" id="replace-all-btn">Replace All</button>
        <span class="status" id="save-state" role="status" aria-live="polite">Loading</span>
      </div>
      <p id="focus-state">Click the report to edit, or use Find to select text.</p>
      <div id="editor" class="editor-shell" tabindex="0" role="textbox" aria-multiline="true" aria-label="PatchPad custom editor"></div>
      <p id="message" class="error" role="alert"></p>
    </section>
    <aside>
      <h2>Documents</h2>
      <div id="document-list"></div>
      <h3>Revision History</h3>
      <div id="revision-list"></div>
    </aside>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
