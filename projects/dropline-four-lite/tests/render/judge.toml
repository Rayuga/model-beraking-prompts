# Prompt version: dropline-render-v5.1.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
# Local application: http://localhost:3000
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "medium"
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "page_load_and_refresh"
name = "page_load_and_refresh"
type = "binary"
weight = 1.0
description = """
Open the same-origin page and require a substantive DropLine sign-in screen
with a visible heading, email and password fields, and a usable sign-in
control. Fully refresh once and require the same usable page to render again
without a blank screen, fatal error, or broken layout that blocks the form.
"""

[[criterion]]
id = "basic_control_and_game_surface"
name = "basic_control_and_game_surface"
type = "binary"
weight = 1.0
description = """
Click the visible `Use Avery` helper and require it to populate the email field.
Enter `password123`, sign in, and require a substantive game workspace to
render with Avery's identity, a visible Connect Four board, game status, match
totals, move history, and visible game controls. Do not require a particular
saved board, history, score, or enabled state.
"""
