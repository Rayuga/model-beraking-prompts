# Prompt version: dropline-polish-v6.0.3
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
# Local application: http://localhost:3000
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 900
isolated = false
reasoning_effort = "high"
temperature = 0
weight = 3.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "accessible_grid_and_winning_names"
name = "accessible_grid_and_winning_names"
type = "binary"
weight = 1.0
description = """
Sign in as Avery and start New game. Confirm the active board exposes one grid
with exactly 42 grid cells and every cell name identifies its row, column, and
empty state. Play 1,7,2,7,3,6,4.
Require exactly four winning Red cells; each accessible name must include its
row, column, Red, and `winning`, while no other cell name includes `winning`.
"""

[[criterion]]
id = "archive_replay_usability"
name = "archive_replay_usability"
type = "binary"
weight = 1.0
description = """
Sign in as Jordan and open the newest seeded `Yellow wins` match with eight
moves. Require the archive and replay to be visually and semantically separate
from the active board. The replay result, step count, 42 replay-cell names,
range control, Previous, Next, and Close must be understandable and keyboard
usable. Move Replay step to 8 and require Yellow across row 6 columns 1-4; move
it to step 0 and require an empty replay. Moving between steps must provide clear feedback without replacing
or mutating the active game.
"""

[[criterion]]
id = "responsive_layout_and_feedback"
name = "responsive_layout_and_feedback"
type = "binary"
weight = 1.0
description = """
At exactly 375 by 760 pixels, confirm the sign-in form fits without horizontal
page overflow. Sign in as Jordan and require identity, complete board, seven controls,
status, revision, totals, move history, Undo, Redo, New game, Completed matches,
and Sign out to remain reachable and usable without clipping or overlapping
text. Open the seeded replay and require its complete board and
controls to remain usable at the same width. Close replay, start New game,
fill column 1, and click it again;
require noticeable `Column 1 is full` feedback without introducing overflow.
Emulate `prefers-reduced-motion: reduce`; require animations and transitions to
be removed or materially reduced while status and feedback remain understandable.
"""

[[criterion]]
id = "visual_hierarchy_and_craft"
name = "visual_hierarchy_and_craft"
type = "binary"
weight = 1.0
description = """
At desktop size and 375 by 760, require an intentional hierarchy, consistent
spacing, legible typography, purposeful color, polished sign-in and identity
treatment, distinct Red and Yellow pieces, readable scores and history, strong
focus states, and an obvious winning treatment. Fail for clipping, overlap,
low-contrast controls, or visually ambiguous game state.
"""

[[criterion]]
id = "game_identity_and_production_readiness"
name = "game_identity_and_production_readiness"
type = "binary"
weight = 1.0
description = """
Confirm sign-in, saved account state, board, status, revision, scores, move
history, Undo/Redo, New game, completed-match archive, replay, feedback, and
sign-out form one coherent finished board-game product rather than disconnected
demo surfaces. Exercise moves, Undo, Redo, a win, and its replay; require
understandable feedback and controls that remain usable throughout.
"""
