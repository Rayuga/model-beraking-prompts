schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "turing/dropline-four-lite"
version = "6.0.2"
description = "Concurrent full-stack Connect Four game with authenticated state, durable branching history, idempotent mutations, completed-match replay, and SQLite persistence"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "connect-four", "authentication", "undo-redo", "optimistic-concurrency", "replay", "accessibility", "rewardkit"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Classic & Board Games"
tags = ["full-stack", "browser-game", "state-machine", "authentication", "persistence", "concurrency", "idempotency", "accessibility"]
provenance = "Derived from the repository Deliverables Tracker assignment for Classic & Board Games / Tic-tac-toe or Connect-4 and the task owner's live request to add undo and redo; the natural request is retained in instruction.md"
arena_slice = "full-stack-node-express-sqlite-board-game"
expert_time_estimate_hours = 9
difficulty_explanation = "Beyond exact Connect Four and branching undo/redo, the submission must import distinct workbook states, coordinate stale writes across tabs with visible revisions, deduplicate mutation identifiers, revoke every account session, and maintain an idempotent terminal archive with accessible move-by-move replay."
solution_explanation = "The reference uses SQLite transactions and monotonic revisions for optimistic concurrency, persisted mutation receipts for idempotency, account-wide token revocation, and round-keyed completed-match snapshots. A vanilla client reconciles stale responses, prevents duplicate activation, preserves keyboard focus, and renders a separate accessible replay board."
verification_explanation = "Render and Constraints remain small hard gates. Functional browser scenarios cover seeded-state import, exact gameplay, branching history, keyboard focus, two-tab conflicts, duplicate activation, all-session sign-out, and archive/replay lifecycle; Polish covers responsive and accessible active and replay surfaces."
persona = "Full-stack JavaScript game developer"
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 4096

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "high"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
