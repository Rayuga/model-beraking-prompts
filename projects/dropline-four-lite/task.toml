schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "turing/dropline-four-lite"
version = "5.1.1"
description = "Full-stack Connect Four game with authenticated per-account state, durable move history, undo and redo, deterministic gameplay, and SQLite persistence"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "connect-four", "authentication", "undo-redo", "accessibility", "rewardkit"]

[metadata]
difficulty = "medium"
category = "Software"
subcategory = "Classic & Board Games"
tags = ["full-stack", "browser-game", "state-machine", "authentication", "persistence", "accessibility"]
provenance = "Derived from the repository Deliverables Tracker assignment for Classic & Board Games / Tic-tac-toe or Connect-4 and the task owner's live request to add undo and redo; the natural request is retained in instruction.md"
arena_slice = "full-stack-node-express-sqlite-board-game"
expert_time_estimate_hours = 5
difficulty_explanation = "The core game is familiar, but the submission must combine exact gravity and terminal-state behavior with protected bearer-token APIs, account-isolated SQLite state, persistent branching undo and redo, deterministic reload persistence, keyboard access, and responsive presentation."
solution_explanation = "The reference keeps users, active bearer sessions, and one game-state row per account in SQLite. Server-side transactions validate moves, undo, redo, gravity, terminal locks, and score reversal or restoration, then return complete renderable state and history to a vanilla browser client."
verification_explanation = "Four pinned Codex browser dimensions evaluate render, constraints, functional behavior, and polish. Render and constraints are hard gates; deterministic move sequences cover gameplay, history, undo and redo, authentication, account isolation, accessibility, and durable reload behavior."
persona = "Full-stack JavaScript game developer"
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "high"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
