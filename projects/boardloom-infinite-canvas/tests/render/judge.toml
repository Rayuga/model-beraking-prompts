# Prompt version: boardloom-render-v1.1.0
# Submitted UI, source, network payloads and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "gpt-5.6-luna"
mode = "batched"
timeout = 600
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/boardloom-infinite-canvas-chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "app_serves"
name = "app_serves"
type = "binary"
weight = 1.0
description = """
Open the application at http://127.0.0.1:5173 and confirm a real interface renders: the sign-in screen (or, when already signed in, the board workspace) is drawn, with its fields or canvas visible rather than a blank page or an error.

This is liveness only. Do not judge canvas rules, persistence, sharing or interface quality here.
"""
