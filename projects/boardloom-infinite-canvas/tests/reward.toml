# Reward rule for Boardloom.
#
#   render and constraints are hard GATES. If either is not a clean pass the
#   reward is 0, however good the rest is. Each gate holds one trivial liveness
#   check, so any bootable submission clears them and they carry no reward mass.
#
#   Otherwise:   reward = 0.6 * functional + 0.4 * polish
#
#   functional  29 criteria - accounts, isolation, geometry, objects, guards, sharing, durability, tools
#   polish      18 criteria - drawing, theme, the editing controls and how it reads
#
# The two scored dimensions declare that split as their own weight in
# tests/<dimension>/judge.toml - functional 0.6, polish 0.4. render and
# constraints stay at 1.0 there because a gate is pass-or-fail rather than a
# share of the reward; neither contributes mass to the number below.
#
# rewardkit scores each dimension on its own; the published number is computed by
# tests/test.sh from the rule above. The aggregation named below applies WITHIN a
# dimension, not across them - the across-dimension rule is the one at the top of
# this file and it is the only one that reaches Harbor.
[[reward]]
name = "reward"
aggregation = "weighted_mean"
