# Prompt version: coursemark-polish-v1.0.12
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 900
isolated = false
reasoning_effort = "high"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "sign_in_focus_and_error_quality"
name = "sign_in_focus_and_error_quality"
type = "binary"
weight = 1.0
description = """
Require a coherent branded sign-in surface with labelled email/password fields,
logical keyboard order, visible focus, a clear submit action, useful demo
account help, and an announced understandable wrong-password error that does
not shift controls into an unusable layout.
"""

[[criterion]]
id = "responsive_shell_and_touch_targets"
name = "responsive_shell_and_touch_targets"
type = "binary"
weight = 1.5
description = """
At about 375 by 812, sign-in and the authenticated shell have no horizontal
page overflow, clipped primary actions, overlapping text, or unreachable
workspace. All five views, revision/sync state, and sign-out remain reachable;
important buttons and fields have practical touch targets.
"""

[[criterion]]
id = "navigation_landmarks_and_current_state"
name = "navigation_landmarks_and_current_state"
type = "binary"
weight = 1.0
description = """
Require semantic main and navigation regions, meaningful headings, a clear
current tab, and keyboard-reachable Courses, Assessments, Attempts, Gradebook,
and Audit views. Each destination has distinct relevant content or an
understandable empty state, and focus remains visible after navigation.
"""

[[criterion]]
id = "record_density_and_visual_hierarchy"
name = "record_density_and_visual_hierarchy"
type = "binary"
weight = 1.5
description = """
Course, assessment, attempt, gradebook, and audit records remain scannable
through headings, grouping, spacing, status treatment, readable dates and
scores, and non-color cues. The interface must not present raw JSON, dense
undifferentiated text, or ambiguous status-only color.
"""

[[criterion]]
id = "forms_dialogs_and_feedback"
name = "forms_dialogs_and_feedback"
type = "binary"
weight = 1.5
description = """
Open representative assessment, question, attempt, and grading dialogs when
available. Require labelled controls, sensible grouping, keyboard closing,
contained scrolling, visible validation, disabled pending actions, announced
save/sync outcomes, and no trapped or obscured workspace.
"""

[[criterion]]
id = "role_workflow_clarity_and_privacy_cues"
name = "role_workflow_clarity_and_privacy_cues"
type = "binary"
weight = 1.0
description = """
Identity, email, role, fixed reference time, revision and sync state are easy
to find. Student timing/accommodation and hidden-feedback cues, staff grading
progress, publish readiness, release state, and audit descriptions explain the
current workflow without requiring technical knowledge.
"""

[[criterion]]
id = "product_coherence_and_reduced_motion"
name = "product_coherence_and_reduced_motion"
type = "binary"
weight = 1.0
description = """
Require consistent typography, controls, surfaces, spacing, focus, success and
error treatment across public and protected screens. The result should feel
like one finished education product, and reduced-motion emulation must
materially suppress nonessential transitions while state remains clear.
"""
