# Prompt version: coursemark-render-v1.0.12
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "high"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "page_load_and_refresh"
name = "page_load_and_refresh"
type = "binary"
weight = 1.0
description = """
Open the root page and require a substantive Coursemark sign-in experience
with a product name, an account-identifier field, and a primary sign-in
control. Fully reload once and require the same usable page without a fatal
browser error, blank document, raw JSON response, or server error page.
"""

[[criterion]]
id = "basic_public_control_interaction"
name = "basic_public_control_interaction"
type = "binary"
weight = 1.0
description = """
Without signing in, enter a seed-account address in the visible identifier
field and require the exact text to remain editable. If public help or a
disclosure is present, it may also be opened, but do not submit the form or
require authentication.
"""
