# Prompt version: functional-batch004-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 1200
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 4.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[criterion]]
id = "seeded_roles_and_privacy"
name = "seeded_roles_and_privacy"
type = "binary"
weight = 1.0
description = """
Sign in as Instructor, Teaching assistant, and both Students. Confirm role-specific controls, student isolation, assigned-submission scope, and hidden answer keys.
"""

[[criterion]]
id = "eligibility_and_accommodations"
name = "eligibility_and_accommodations"
type = "binary"
weight = 2.0
description = """
As Nora, confirm A-01 is available and the in-progress attempt reflects 60 minutes because of extra time. As Ben, confirm the effective deadline includes his 60-minute extension. Draft A-02 must remain hidden from students.
"""

[[criterion]]
id = "attempt_state_and_scoring"
name = "attempt_state_and_scoring"
type = "binary"
weight = 2.0
description = """
Save an answer on the signed-in student's active attempt, submit it, and confirm the state is terminal and objective points come from the stored key. Attempts at or after expiry must reject answer changes.
"""

[[criterion]]
id = "rubric_grading_scope"
name = "rubric_grading_scope"
type = "binary"
weight = 2.0
description = """
As the assigned Teaching assistant, grade an allowed rubric criterion within its maximum; reject over-maximum values and inaccessible submissions. Confirm a student cannot call grading behavior.
"""

[[criterion]]
id = "publish_and_release"
name = "publish_and_release"
type = "binary"
weight = 2.0
description = """
As Instructor, publish a valid draft assessment and release a graded result. Confirm publishing/releasing is unavailable to the Teaching assistant and released feedback becomes visible only to its student and is immutable.
"""

[[criterion]]
id = "persistent_reauthentication"
name = "persistent_reauthentication"
type = "binary"
weight = 2.0
description = """
Perform one distinctive allowed save or grading mutation, reload, sign in again, and confirm exactly one matching durable result remains.
"""
