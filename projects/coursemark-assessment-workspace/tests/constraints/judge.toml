# Prompt version: coursemark-constraints-v1.0.12
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "high"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "same_origin_application_shell"
name = "same_origin_application_shell"
type = "binary"
weight = 1.0
description = """
Require the root document plus the scripts, styles, fonts, images, and browser
requests needed for the visible sign-in shell to come only from localhost on
the application origin. Incidental browser-internal URLs are irrelevant. Fail
for a required public-internet runtime asset or cross-origin application API.
"""

[[criterion]]
id = "self_contained_entry_and_reload"
name = "self_contained_entry_and_reload"
type = "binary"
weight = 1.0
description = """
Open the root entry path, confirm it is rendered HTML rather than a directory
listing or raw response, interact with an email field, and fully reload.
Require the local application entry to remain available and usable after that
reload without a build, install, or external navigation.
"""
