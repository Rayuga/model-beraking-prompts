# Render and constraints are gates. Passing submissions receive a
# 60% functional / 40% polish browser score, applied by test.sh.
# Reward policy:
#   if render == 0 or constraints == 0 -> reward = 0
#   else reward = 0.6 * functional + 0.4 * polish
# Render and constraints are gates rather than scoring inputs. test.sh applies
# the gate after RewardKit returns the four dimension scores.
[[reward]]
name = "reward"
aggregation = "weighted_mean"
weights = { render = 0.0, constraints = 0.0, functional = 0.6, polish = 0.4 }
