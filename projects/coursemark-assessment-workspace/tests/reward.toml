# Render and constraints are gates. Passing submissions receive a
# 60% functional / 40% polish browser score, applied by test.sh.
# Reward policy:
#   if render < 1 or constraints < 1 -> reward = 0
#   else reward = 0.6 * functional + 0.4 * polish
# RewardKit's schema requires every dimension to have a positive weight. Render
# and Constraints therefore carry a negligible schema weight, while test.sh
# requires both gates to pass fully and then applies the exact 60/40 formula.
[[reward]]
name = "reward"
aggregation = "weighted_mean"
weights = { render = 0.000001, constraints = 0.000001, functional = 0.6, polish = 0.4 }
