schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/coursemark-assessment-workspace"
version = "1.0.0"
description = "Concurrent full-stack course assessment workspace with timed accommodations, grading, release, audit, idempotent writes, and durable role isolation"
keywords = ["webdev","turing","full-stack","nodejs","express","sqlite","education","assessment","grading","authentication","concurrency","idempotency","accessibility"]

[metadata]
difficulty = "hard"
difficulty_explanation = "The submission must combine fixed-time availability and accommodation math, exact expiry, objective and rubric scoring, private release, role-filtered audit, SQLite bearer sessions, transactional optimistic concurrency, replay-safe operation receipts, and responsive browser workflows."
category = "Software"
tags = ["full-stack","assessment-lifecycle","role-based-access","timed-attempts","sqlite","optimistic-concurrency","idempotency","accessibility"]
provenance = "Derived from the repository Deliverables Tracker taxonomy for Education & Quiz Platforms / Course-LMS layout and the assigned Coursemark assessment-workspace brief; instruction.md retains the natural product request"
arena_slice = "full-stack-node-express-sqlite-assessment-workspace"

[agent]
timeout_sec = 7200

[environment]
build_timeout_sec = 600
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
