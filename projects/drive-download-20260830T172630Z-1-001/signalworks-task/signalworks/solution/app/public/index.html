<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signalworks — signalling control &amp; maintenance</title>
<style>
  :root { --line:#d6dce4; --ink:#141d27; --muted:#5b6877; --bg:#f4f6f9; --card:#fff;
          --ok:#0a7d3f; --bad:#b3261e; --warn:#8a5a00; --accent:#123f6d; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:10px 18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; letter-spacing:.3px; }
  header .who { margin-left:auto; font-size:13px; }
  nav { background:#fff; border-bottom:1px solid var(--line); padding:6px 18px; display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--muted); }
  nav button.active { background:#e7eef7; color:var(--accent); border-color:#c4d5ea; font-weight:600; }
  main { padding:18px; max-width:1250px; }
  h2 { font-size:19px; margin:0 0 12px; }
  h3 { font-size:15px; margin:18px 0 8px; }
  h4 { font-size:13.5px; margin:12px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; }
  .money, .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef1f5; color:var(--muted); }
  .tag.ok { background:#e3f5eb; color:var(--ok); } .tag.bad { background:#fdeceb; color:var(--bad); }
  .tag.warn { background:#fdf3e0; color:var(--warn); }
  button.act { background:var(--accent); color:#fff; border:0; padding:6px 11px; border-radius:6px; cursor:pointer; font-size:13px; margin:0 4px 4px 0; }
  button.act.sec { background:#e7eef7; color:var(--accent); }
  input,select,textarea { padding:5px 8px; border:1px solid var(--line); border-radius:5px; font-size:14px; font-family:inherit; }
  form.inline { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  label { font-size:13px; color:var(--muted); }
  #flash { padding:10px 14px; border-radius:7px; margin-bottom:14px; display:none; font-size:14px; }
  #flash.err { background:#fdeceb; color:var(--bad); border:1px solid #f3c6c2; display:block; }
  #flash.ok { background:#e3f5eb; color:var(--ok); border:1px solid #b9e2cb; display:block; }
  .login { max-width:400px; margin:70px auto; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:14px; margin:0; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  .rec { border-top:1px dashed var(--line); padding-top:10px; margin-top:10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/js/app.js"></script>
</body>
</html>
