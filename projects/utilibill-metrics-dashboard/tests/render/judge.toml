# Prompt version: utilibill-render-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "authenticated_render"
name = "authenticated_render"
type = "binary"
weight = 2.0
description = """
Open the app, sign in as the billing operator, and confirm a substantive, usable UtiliBill dashboard renders with populated content and without a fatal browser error or broken page.
"""

[[criterion]]
id = "workspace_rendering"
name = "workspace_rendering"
type = "binary"
weight = 1.0
description = """
Open Dashboard, Accounts, Settlement, and Audit. Each destination must visibly activate and show its own meaningful heading and content; four labels pointing to one unchanged screen do not pass.
"""
