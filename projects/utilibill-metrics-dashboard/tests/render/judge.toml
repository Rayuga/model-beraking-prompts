[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "workspace_navigation"
name = "workspace_navigation"
type = "binary"
weight = 1.0
description = """
After the global gate, use the visible navigation to reach each of Dashboard, Accounts, Settlement and Audit and return to Accounts. Require distinct substantive views appropriate to each purpose and a usable return path. This grades navigation among the four requested workspaces; the shared gate already covers initial load and authentication.
"""
