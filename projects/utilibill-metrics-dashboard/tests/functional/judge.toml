[judge]
mode = "batched"
timeout = 9000
isolated = false
temperature = 0
weight = 0.6
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "authenticated_role_identity"
name = "authenticated_role_identity"
type = "binary"
weight = 1.0
description = """
Sign in with all five demo accounts and require each protected workspace to identify its actual name and correct role. Both controllers must have the same role while remaining distinct people. Public login hints do not count.
"""

[[criterion]]
id = "applicable_policy_details"
name = "applicable_policy_details"
type = "binary"
weight = 1.0
description = """
As Rhea, inspect Dashboard and applicable account billing details. Require the supplied tier rates, TOU rates and effective instant, each rider rate/base, fixed charge, export rate and approval threshold to be discoverable where relevant. Rate review is read-only; no rate editor is required. This criterion grades availability of the applicable policy details, not numerical billing outcomes.
"""

[[criterion]]
id = "dashboard_current_totals"
name = "dashboard_current_totals"
type = "binary"
weight = 1.0
description = """
At the end of the journey, compare Dashboard totals to current account records: all 11 accounts, sum of normal cycle bills, sum of both net-metering banks, sum of both deferred balances and recent business activity. Include any C11 bills from previous gates; do not hardcode the overall billed total. Require visible totals to agree with current detail records after reload.
"""

[[criterion]]
id = "tou_metered_boundary"
name = "tou_metered_boundary"
type = "binary"
weight = 3.0
description = """
In the newly issued C2 JUL bill, require peak 200 kWh at 30 cents and 150 kWh at 34 cents, including the 40 kWh at the effective instant on the new side. Peak is $111.00, shoulder $48.00, off-peak $45.00 and energy $204.00. Require a retained breakdown after reload, not just an unissued preview.
"""

[[criterion]]
id = "fresh_tier_blocks"
name = "fresh_tier_blocks"
type = "binary"
weight = 2.0
description = """
In the newly issued C7 JUL bill, require 400 kWh at 8 cents, 500 at 13 cents and 150 at 20 cents, with energy $127.00. Inspect the issued bill after reload. This criterion grades the normal tiered-energy calculation only.
"""

[[criterion]]
id = "rps_gross_energy"
name = "rps_gross_energy"
type = "binary"
weight = 2.0
description = """
Inspect the issued normal bills for C2 JUL, C7 JUL, C5 JUL, C6 JUL and C5 AUG after each is created. RPS must be 4% of gross energy: respectively $8.16, $5.08, $0.96, $2.32 and $0.80, with the gross base visible. Require all five; an energy credit must not erase RPS.
"""

[[criterion]]
id = "sbc_gross_volume"
name = "sbc_gross_volume"
type = "binary"
weight = 2.0
description = """
For those same five issued bills require SBC at 0.90 cents per gross delivered kWh: $10.35, $9.45, $2.70, $5.40 and $2.25 respectively. Require the delivered-volume base, including both net-metering accounts and the later C5 bill; exported volume must not reduce this base.
"""

[[criterion]]
id = "grt_receipt_base"
name = "grt_receipt_base"
type = "binary"
weight = 2.0
description = """
For those same five issued bills require GRT on net energy plus fixed plus RPS plus SBC, rounded half-up: respectively $5.86 on $234.51, $3.84 on $153.53, $0.39 on $15.66, $1.62 on $64.72 and $0.38 on $15.05. Require all bases and amounts in issued detail. This criterion exclusively grades GRT.
"""

[[criterion]]
id = "fixed_and_grand_total"
name = "fixed_and_grand_total"
type = "binary"
weight = 1.0
description = """
For the five issued normal bills require the $12.00 fixed line and a grand total equal to the sum of the app's displayed component lines. Score arithmetic assembly independently of whether those component values satisfy their own criteria; do not fail this criterion solely for an RPS or energy error already graded elsewhere. Correct reference totals are C2 $240.37, C7 $157.37, C5 JUL $16.05, C6 $66.34 and C5 AUG $15.43.
"""

[[criterion]]
id = "export_credit_rate"
name = "export_credit_rate"
type = "binary"
weight = 2.0
description = """
Require earned export credit of $32.50 on C5 JUL (500 kWh), $13.00 on C6 JUL (200 kWh), and $9.75 on C5 AUG (150 kWh), each at 6.50 cents/kWh. Distinguish earned credit from the amount applied to energy and from the prior bank.
"""

[[criterion]]
id = "energy_only_credit_offset"
name = "energy_only_credit_offset"
type = "binary"
weight = 2.0
description = """
On the issued C5 JUL, C6 JUL and C5 AUG bills, require available credit to offset energy alone: remaining energy $0.00, $45.00 and $0.00 respectively. Fixed and rider lines remain payable and no excess is paid out. Grade the destination and cap of the credit separately from its rate or bank persistence.
"""

[[criterion]]
id = "credit_bank_compounds"
name = "credit_bank_compounds"
type = "binary"
weight = 3.0
description = """
Start with C5 bank $10.00 and C6 bank $0.00. After C5 JUL require C5 $18.50, a +$8.50 movement; after C6 JUL require its bank $0.00. After C5 AUG require prior bank $18.50, new bank $8.25 and a -$10.25 movement. The original and earlier movements remain, and the bank equals their sum after reload. Do not bill C5 AUG before recording its JUL checkpoint.
"""

[[criterion]]
id = "catchup_weighted_allocation"
name = "catchup_weighted_allocation"
type = "binary"
weight = 3.0
description = """
Raise C1 M2 from its actual 1600 kWh read: retained per-cycle allocations must be M1 850 and M2 750 from weights 17:15. Then raise C1 M3 from 2200 kWh: M2 825 and M3 1375 from weights 15:25. For each of C8 and C9 K2, 2000 kWh with weights 3:1 must allocate K1 1500 and K2 500. Require all allocations in the created correction records; score volumes separately from charges.
"""

[[criterion]]
id = "catchup_energy_rebilling"
name = "catchup_energy_rebilling"
type = "binary"
weight = 3.0
description = """
At the corresponding newly created correction checkpoints require fresh tier blocks per accrual period: C1 first M1 $90.50 and M2 $77.50 (sum $168.00); C1 second M2 $87.25 and M3 $192.00 (sum $279.25); each of C8 and C9 K1 $217.00 and K2 $45.00 (sum $262.00). No fixed charge or rider enters these energy-only bills. Require visible persisted breakdowns.
"""

[[criterion]]
id = "retained_bill_generations"
name = "retained_bill_generations"
type = "binary"
weight = 3.0
description = """
Inspect C1 before and after both corrections and C8/C9 before and after approval. All earlier bills retain their original IDs and amounts; supersession marks and links identify the next generation. In particular C1 M1 retains $45.00, and the first M2 $77.50 survives the second correction marked superseded by its $87.25 replacement. On each Kestrel account the original $24.00 remains intact. Grade retained history and links separately from contra amounts.
"""

[[criterion]]
id = "contra_live_prior_delta"
name = "contra_live_prior_delta"
type = "binary"
weight = 3.0
description = """
C1 first correction posts only an M1 +$45.50 contra; M2 has no contra row, not even zero. C1 second posts M2 +$9.75 against its live $77.50 bill, and no M3 contra. Approved C8 and C9 each post K1 +$193.00 against $24.00 and no K2 contra. Require actual posted rows linked to their replacement bills after reload; a proposed value does not prove a posting.
"""

[[criterion]]
id = "threshold_holds_entire_batch"
name = "threshold_holds_entire_batch"
type = "binary"
weight = 2.0
description = """
Record C1 first correction posting immediately below the $100.00 threshold. Raise each Kestrel correction as Anaya and inspect before approval: the entire batch is pending, both original $24.00 bills remain live in their respective accounts, and no contra has posted. Only the controller approval releases each held batch. Do not infer this from a pending label after the originals have already changed.
"""

[[criterion]]
id = "distinct_controller_approval"
name = "distinct_controller_approval"
type = "binary"
weight = 2.0
description = """
Approve C8 as Cira and C9 as Cyrus through the UI. Each batch must release, and retained details must identify Anaya as raiser and the actual controller as approver, distinct from Anaya. Both named controllers must work. Replay each approved request afterward to verify the stored approver cannot be replaced (the duplicate-write accounting effect is graded separately).
"""

[[criterion]]
id = "budget_historical_movements"
name = "budget_historical_movements"
type = "binary"
weight = 2.0
description = """
Before annual settlement inspect both budget accounts. Each of 12 historical movements equals that cycle's actual minus the original $150.00 levelized amount. C3 sums to +$105.00, with the last $165.00 actual producing +$15.00; C4 sums to -$60.00. After C3 is re-levelled, those historical per-cycle amounts and their original levelized base remain unchanged.
"""

[[criterion]]
id = "annual_balance_settlement"
name = "annual_balance_settlement"
type = "binary"
weight = 2.0
description = """
As Owen run C3 annual true-up once after recording the before-state. Require a newly retained $105.00 settlement and remaining deferred balance $0.00 after reload. Grade balance settlement independently of the new monthly levelized value.
"""

[[criterion]]
id = "annual_relevel_from_actuals"
name = "annual_relevel_from_actuals"
type = "binary"
weight = 2.0
description = """
On that C3 annual true-up require a new levelized amount of $158.75 from the trailing 12 actual total $1905.00 divided by 12, with the basis visible. The new amount persists after reload. This criterion does not re-grade settlement of the old balance.
"""

[[criterion]]
id = "anniversary_eligibility"
name = "anniversary_eligibility"
type = "binary"
weight = 2.0
description = """
Use the successful C3 annual action as the positive control. Repeat its observed request shape for C4 while signed in as Owen. Require 4xx refusal because reference 2026-08-15T09:00:00Z is before C4 anniversary 2026-11-01T00:00:00Z; C4 retains levelized $150.00, deferred -$60.00 and no annual settlement. Show the dates and reason. C3, anniversary 2026-08-01, must have been eligible.
"""

[[criterion]]
id = "atomic_cycle_finalization"
name = "atomic_cycle_finalization"
type = "binary"
weight = 2.0
description = """
After billing C2 and C7, finalize exactly those two cycles into P1 through the operator UI. Separately finalize C10 into P2. Require retained membership and FINALIZED state. Before the positive action, use the observed valid request shape to submit an empty selection, duplicate IDs and a mixed valid-plus-unknown selection; each must return 4xx with no partial membership, cycle-state or business-audit change. A positive control must subsequently finalize the valid selection.
"""

[[criterion]]
id = "remittance_from_own_riders"
name = "remittance_from_own_riders"
type = "binary"
weight = 3.0
description = """
As Cira release P1, containing only C2 and C7. Require sum of its own posted riders: RPS $13.24, SBC $19.80, GRT $9.70 and total $42.74, a retained acknowledgement and REMITTED period/cycle states. As Cyrus also release P2 after C10 is finalized; its remittance must equal C10's own rider accruals. C11 gate bills and unrelated accounts must not enter either sum.
"""

[[criterion]]
id = "bill_role_enforced"
name = "bill_role_enforced"
type = "binary"
weight = 2.0
description = """
For normal cycle billing, capture the genuine authorized UI request from Owen. Test the same valid action shape under separate sessions for every unauthorized user: Anaya, Rhea, Cira and Cyrus. Require 403 from each and unchanged target records/business activity. Preserve request shape and target state; capture the outgoing authorized request before completing the action when needed, and then let the genuine UI action succeed as the positive control. Absence of a button alone is insufficient. A state-conflict response or malformed-request error is not evidence of role enforcement.
"""

[[criterion]]
id = "raise_role_enforced"
name = "raise_role_enforced"
type = "binary"
weight = 2.0
description = """
For raising a catch-up correction, capture the genuine authorized UI request from Anaya. Test the same valid action shape under separate sessions for every unauthorized user: Owen, Rhea, Cira and Cyrus. Require 403 from each and unchanged target records/business activity. Preserve request shape and target state; capture the outgoing authorized request before completing the action when needed, and then let the genuine UI action succeed as the positive control. Absence of a button alone is insufficient. A state-conflict response or malformed-request error is not evidence of role enforcement.
"""

[[criterion]]
id = "approve_role_enforced"
name = "approve_role_enforced"
type = "binary"
weight = 2.0
description = """
For approving a pending correction, capture the genuine authorized UI request from Cira and Cyrus. Test the same valid action shape under separate sessions for every unauthorized user: Anaya, Owen and Rhea. Require 403 from each and unchanged target records/business activity. Preserve request shape and target state; capture the outgoing authorized request before completing the action when needed, and then let the genuine UI action succeed as the positive control. Absence of a button alone is insufficient. A state-conflict response or malformed-request error is not evidence of role enforcement.
"""

[[criterion]]
id = "budget_role_enforced"
name = "budget_role_enforced"
type = "binary"
weight = 2.0
description = """
For annual budget true-up, capture the genuine authorized UI request from Owen. Test the same valid action shape under separate sessions for every unauthorized user: Anaya, Rhea, Cira and Cyrus. Require 403 from each and unchanged target records/business activity. Preserve request shape and target state; capture the outgoing authorized request before completing the action when needed, and then let the genuine UI action succeed as the positive control. Absence of a button alone is insufficient. A state-conflict response or malformed-request error is not evidence of role enforcement.
"""

[[criterion]]
id = "finalize_role_enforced"
name = "finalize_role_enforced"
type = "binary"
weight = 2.0
description = """
For finalizing a selection, capture the genuine authorized UI request from Owen. Test the same valid action shape under separate sessions for every unauthorized user: Anaya, Rhea, Cira and Cyrus. Require 403 from each and unchanged target records/business activity. Preserve request shape and target state; capture the outgoing authorized request before completing the action when needed, and then let the genuine UI action succeed as the positive control. Absence of a button alone is insufficient. A state-conflict response or malformed-request error is not evidence of role enforcement.
"""

[[criterion]]
id = "remit_role_enforced"
name = "remit_role_enforced"
type = "binary"
weight = 2.0
description = """
For releasing a remittance, capture the genuine authorized UI request from Cira and Cyrus. Test the same valid action shape under separate sessions for every unauthorized user: Anaya, Owen and Rhea. Require 403 from each and unchanged target records/business activity. Preserve request shape and target state; capture the outgoing authorized request before completing the action when needed, and then let the genuine UI action succeed as the positive control. Absence of a button alone is insufficient. A state-conflict response or malformed-request error is not evidence of role enforcement.
"""

[[criterion]]
id = "client_claims_are_ignored"
name = "client_claims_are_ignored"
type = "binary"
weight = 2.0
description = """
For one genuine authorized UI action in each family (bill, raise, approve, budget, finalize, remit), preserve its required payload and add false role/actor/approver/approved/amount claims to the outgoing request. The action must still succeed, using stored figures and real session identity. Inspect retained business and audit records; approved:true cannot auto-release an analyst's held Kestrel batch, and claiming another controller cannot change the real approver. Also include these claims in unauthorized-role replays; they must still be refused. Do not require particular payload names for ordinary inputs; extra authority/amount claims are the contract-defined fields.
"""

[[criterion]]
id = "repeated_writes_are_inert"
name = "repeated_writes_are_inert"
type = "binary"
weight = 2.0
description = """
After successful actions, replay their captured requests as the authorized users: a normal bill (C10), each C1 correction, both approvals, C3 annual settlement, each finalized selection and each remittance. Require explicit 4xx refusals and no extra bill, rider, bank, contra, settlement, membership, remittance or business-audit row. Compare affected records before and after. Authentication events are excluded. Retry safety is the single observation here; other calculation criteria grade first-write amounts.
"""

[[criterion]]
id = "finalized_and_remitted_locks"
name = "finalized_and_remitted_locks"
type = "binary"
weight = 2.0
description = """
After C10 is finalized and again after P2 is remitted, attempt another bill with the captured bill shape; require 4xx and unchanged records. For a positive-controlled correction lock, after BOTH C1 corrections and their history checkpoints, finalize C1 M2 into a third locally created period only if the product offers period creation; otherwise finalize it into still-open P2 before P2 remittance, together with C10. Correction bills have no riders, so P2 rider sum remains C10-only. Replay the captured M3 correction as Anaya and require a lock-specific refusal naming its locked M2 accrual cycle at FINALIZED and REMITTED stages, not merely duplicate detection. Preserve all correction generations, contras and activity. Never invent a period-creation requirement.
"""

[[criterion]]
id = "business_audit_content"
name = "business_audit_content"
type = "binary"
weight = 2.0
description = """
In Audit find each successful business family from this journey: bill, correction raise/post, approval, annual settlement, finalization and remittance. Require actual actor, action, subject, fixed reference timestamp and computed figure; finalization may record cycle count instead of money. For each approval the recorded figure is its $193.00 posted contra, and the actor is the real approving controller. This grades audit content independently of business amount correctness; an audit matching an incorrectly calculated bill may pass content consistency while billing fails.
"""

[[criterion]]
id = "audit_append_only"
name = "audit_append_only"
type = "binary"
weight = 1.0
description = """
After observing newly appended business entries, try any visible edit/delete action. If none exists, use the observed successful audit-read resource to issue same-origin PUT/PATCH/DELETE attempts for an existing entry with a changed detail. A 404 or 405 is acceptable when no write route exists. Require no changed/deleted history for each of the four roles, including both controllers. Re-read actual history after each attempt. Do not invent a positive edit endpoint: the positive control is a real existing audit read plus the successful business append.
"""

[[criterion]]
id = "signout_revokes_session"
name = "signout_revokes_session"
type = "binary"
weight = 1.0
description = """
Sign out through the UI after authenticated work, with the successful protected read and business request shapes captured. Require protected content to disappear, including an open detail surface if one remains during session expiry. Reuse the old session credential only in a private evaluator-owned context and repeat the known protected read and each of the six write families; require unauthenticated 4xx refusals without private response data or business changes. Fresh valid sign-in must restore access. Do not count merely hiding the UI as revocation.
"""

[[criterion]]
id = "post_mutation_restart_durability"
name = "post_mutation_restart_durability"
type = "binary"
weight = 3.0
description = """
After all business checkpoints, save exact record IDs, values and relationships for C1 generations/contras, both Kestrel approvers, both net banks and movements, C3 annual settlement, both remittances and business audit. Invoke python3 /tests/app-lifecycle.py restart through the trusted evaluator process. Require a new live app PID with the same database path; no database reset or reinstall is allowed. Reload and open every affected record in the UI, then repeat from fresh sign-ins. Require those exact mutated records to remain. Repeat a second real restart and re-read. A startup restart, seed-only check, page refresh or cached text is not a substitute. The helper is for lifecycle only; do not inspect app source or calculate verdicts from it.
"""
