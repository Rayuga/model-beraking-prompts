# Prompt version: utilibill-constraints-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "authentication_boundary"
name = "authentication_boundary"
type = "binary"
weight = 1.0
description = """
Confirm the protected workspace is not exposed before sign-in. An incorrect operator password must be rejected and leave the browser signed out; immediately afterwards, Utilibill!2026 must authenticate successfully and show populated protected data.
"""

[[criterion]]
id = "server_backed_persistent_application"
name = "server_backed_persistent_application"
type = "binary"
weight = 2.0
description = """
Confirm the app is served successfully at localhost:3000 and its authentication, reads, and at least one safe UI mutation use successful same-origin server requests. Refresh and confirm the mutation remains. A static/local-only mock, missing backend, failed request, or dependency on an external browser asset does not pass. This app grades a single continuous journey across every dimension against one live database, so prefer a mutation that provably cannot affect anything another dimension checks: signing in as the billing operator and billing cycle CY-C11-J on account ACCT-C11 (Quietwood Court) is such a mutation — no other check in this task touches ACCT-C11. Do not raise or approve a true-up, run a budget true-up, or finalize/remit a settlement period for this check; those are exercised, and their outcomes are graded precisely, elsewhere.
"""
