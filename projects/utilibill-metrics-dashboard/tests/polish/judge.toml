# Prompt version: utilibill-polish-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 600
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "theme_switching"
name = "theme_switching"
type = "binary"
weight = 0.5
description = """
Use the visible theme control and confirm it produces a clear rendered change between light and dark presentation while preserving legibility and the current workspace.
"""

[[criterion]]
id = "responsive_accessible_layout"
name = "responsive_accessible_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 mobile viewport, confirm the main content fits without horizontal page overflow and all four workspaces remain reachable. Confirm the desktop experience has a navigation landmark, main landmark, meaningful headings, and accessible names or associated labels for visible buttons, inputs, and selects.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Confirm interactive controls have clear hover or focus feedback, forms and status controls communicate successful or invalid actions, and an account or cycle detail drawer opens and closes without obscuring or breaking the surrounding workspace.
"""
