schema_version = "1.4"
artifacts = ["/app", "/logs/verifier"]

[task]
name = "turing/utilibill-metrics-dashboard"
version = "1.3.0"
description = "Full-stack Node.js, Express, and SQLite energy-retailer billing and regulatory-settlement back office with tiered/TOU billing, net-metering, budget/levelized true-ups, dual-control catch-up re-billing, and browser-only Luna judging"
keywords = ["webdev", "codearena", "full-stack", "nodejs", "express", "sqlite", "billing", "utility", "net-metering", "settlement", "authentication", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "converted/restructured from an externally-sourced utility-billing task (utilibill), full template conversion to the v2 4-dim format with breakers extracted from a delivered frontier run's own judge reasoning, 2026-09-01"
arena_slice = "full-stack-node-express-sqlite-utilibill"
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
