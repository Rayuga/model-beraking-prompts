# DropLine Lite browser rubric. Every criterion is binary, deterministic, and
# independently judgeable; segments use fresh browser sessions.

[judge]
judge = "claude-code"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 3000
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[[criterion]]
id = "offline_self_contained_delivery"
name = "offline_self_contained_delivery"
type = "binary"
weight = 1.0
description = """
Open the app while allowing its localhost document request but blocking every
request to any external origin. Reload and confirm the page still loads into a
usable, nonblank game and makes no external request. Inspect the submitted
`/app/index.html` only as plain text and confirm its CSS and JavaScript are
inline and it does not depend on external stylesheets, scripts, fonts, images,
libraries, or package assets. Both the offline browser check and source check
must pass.
"""

[[criterion]]
id = "initial_board_controls_and_status"
name = "initial_board_controls_and_status"
type = "binary"
weight = 1.0
description = """
Reload the app. Confirm there is exactly one seven-column by six-row grid with
exactly 42 empty cells, exactly seven visible usable buttons named `Drop in
column 1` through `Drop in column 7`, visible status `Red's turn`, and a visible
usable `New game` control. Confirm every cell's accessible name identifies its
row, column, and empty state.
"""

[[criterion]]
id = "gravity_and_turn_alternation"
name = "gravity_and_turn_alternation"
type = "binary"
weight = 1.0
description = """
Start a new game. Using pointer clicks on the named column controls, play
columns 4,4,4. Confirm column 4 contains Red in row 6, Yellow in row 5, Red in
row 4, and empty cells in rows 1 through 3. Confirm every other cell is empty
and the visible status is exactly `Yellow's turn`.
"""

[[criterion]]
id = "full_column_rejection"
name = "full_column_rejection"
type = "binary"
weight = 1.0
description = """
Start a new game and use pointer clicks to play column 1 exactly six times.
Confirm the column is full from bottom to top as Red, Yellow, Red, Yellow, Red,
Yellow and the status is `Red's turn`. Record all 42 cells and the turn, click
column 1 once more, and confirm the board and turn are unchanged and visible
feedback says exactly `Column 1 is full`.
"""

[[criterion]]
id = "horizontal_red_win"
name = "horizontal_red_win"
type = "binary"
weight = 1.0
description = """
Start a new game and use pointer clicks to play 1,7,2,7,3,6,4. Confirm visible
status says exactly `Red wins`. Confirm exactly the four Red pieces in row 6,
columns 1 through 4 have visible winning treatment; no other cell may have
winning treatment.
"""

[[criterion]]
id = "vertical_red_win"
name = "vertical_red_win"
type = "binary"
weight = 1.0
description = """
Start a new game and use pointer clicks to play 1,2,1,2,1,2,1. Confirm visible
status says exactly `Red wins`. Confirm exactly the four Red pieces in column
1, rows 3 through 6 have visible winning treatment; no other cell may have
winning treatment.
"""

[[criterion]]
id = "rising_diagonal_red_win"
name = "rising_diagonal_red_win"
type = "binary"
weight = 1.0
description = """
Start a new game and use pointer clicks to play
1,2,2,3,4,3,3,4,5,4,4. Confirm visible status says exactly `Red wins` and
exactly four Red pieces have visible winning treatment on the diagonal at
row 6 column 1, row 5 column 2, row 4 column 3, and row 3 column 4. No other
cell may have winning treatment.
"""

[[criterion]]
id = "falling_diagonal_red_win"
name = "falling_diagonal_red_win"
type = "binary"
weight = 1.0
description = """
Start a new game and use pointer clicks to play
7,6,6,5,4,5,5,4,3,4,4. Confirm visible status says exactly `Red wins` and
exactly four Red pieces have visible winning treatment on the diagonal at
row 3 column 4, row 4 column 5, row 5 column 6, and row 6 column 7. No other
cell may have winning treatment.
"""

[[criterion]]
id = "yellow_win_after_alternating_turns"
name = "yellow_win_after_alternating_turns"
type = "binary"
weight = 1.0
description = """
Start a new game and use pointer clicks to play 7,1,7,2,6,3,6,4. Confirm
visible status says exactly `Yellow wins`. Confirm exactly the four Yellow
pieces in row 6, columns 1 through 4 have visible winning treatment and every
one of those cells has an accessible name containing its row, column, Yellow,
and `winning`.
"""

[[criterion]]
id = "terminal_state_blocks_later_moves"
name = "terminal_state_blocks_later_moves"
type = "binary"
weight = 1.0
description = """
Create the Red win with pointer sequence 1,7,2,7,3,6,4. Record all 42 cell
states, the result text, and the four winning markers. Attempt drops in columns
5 and 1 through the visible controls. Confirm no cell, turn, result, or winning
marker changes and no additional piece is added after the win.
"""

[[criterion]]
id = "exact_draw_and_terminal_lock"
name = "exact_draw_and_terminal_lock"
type = "binary"
weight = 1.0
description = """
Start a new game and play this exact pointer-click sequence:
4,4,4,4,4,4,3,3,3,3,3,3,5,2,5,6,5,5,5,5,2,2,2,2,2,6,1,6,6,6,6,1,1,1,1,1,7,7,7,7,7,7.
Confirm all 42 cells are occupied, visible status says exactly `Draw`, and no
cell has winning treatment. Record the board, attempt another visible drop,
and confirm the board and result remain unchanged.
"""

[[criterion]]
id = "new_game_resets_completed_win"
name = "new_game_resets_completed_win"
type = "binary"
weight = 1.0
description = """
Create the Red win with pointer sequence 1,7,2,7,3,6,4, then activate the
visible `New game` control. Confirm exactly 42 cells are empty, no winning
treatment remains, the status is exactly `Red's turn`, and all seven named
column controls are usable. Click column 7 once and confirm a Red piece appears
in row 6 column 7 and the status becomes `Yellow's turn`.
"""

[[criterion]]
id = "keyboard_column_navigation"
name = "keyboard_column_navigation"
type = "binary"
weight = 1.0
description = """
Start a new game and focus `Drop in column 1`. Press ArrowRight and confirm
focus is on column 2, press End and confirm column 7, press Home and confirm
column 1, press ArrowLeft and confirm focus stays on column 1, then press
ArrowRight twice and ArrowLeft once and confirm focus ends on column 2. Do not
use pointer clicks to move focus during this check.
"""

[[criterion]]
id = "keyboard_enter_and_space_drop"
name = "keyboard_enter_and_space_drop"
type = "binary"
weight = 1.0
description = """
Start a new game, focus `Drop in column 3`, and press Enter. Confirm Red appears
at row 6 column 3 and status becomes `Yellow's turn`. Without using a pointer,
press Space on the same focused control. Confirm Yellow appears directly above
at row 5 column 3, status becomes `Red's turn`, and keyboard focus remains on a
usable column control.
"""

[[criterion]]
id = "responsive_375px_layout"
name = "responsive_375px_layout"
type = "binary"
weight = 1.0
description = """
Set the browser viewport to exactly 375 by 760 pixels and reload. Confirm the
complete seven-column board, all seven column controls, current status, and
`New game` are visible and usable with no horizontal page scrolling, clipped
controls, or overlapping text. Click columns 1 and 7, confirm both pieces are
visible at the bottom corners, and confirm the page still has no horizontal
scrolling or overlap.
"""
