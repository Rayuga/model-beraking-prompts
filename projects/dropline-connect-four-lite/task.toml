schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "turing/dropline-connect-four-lite"
version = "2.0.0"
description = "Build DropLine, a polished self-contained vanilla HTML/CSS/JS Connect Four game with exact rules and responsive pointer and keyboard play."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["webdev", "vanilla-js", "single-file", "browser-game", "connect-four", "accessibility"]

[metadata]
category = "Software"
difficulty = "medium"
difficulty_explanation = "Nine equally weighted browser criteria independently test a compact but complete interactive state machine: delivery constraints, gravity, alternating turns, full columns, four-direction terminal detection, draw handling, terminal locking, keyboard focus, and narrow-screen usability."
solution_explanation = "The reference solution is one self-contained HTML document with an in-memory six-by-seven board, pure accepted-move transitions, four-direction win checks, semantic controls, and responsive rendering."
persona = "Browser game designer"
task_id = "WEBDEV-DROPLINE-LITE-001"
capabilities = ["frontend-ui", "game-state", "accessibility", "responsive-design"]
industry_category = "Software"
subcategory = "Classic & Board Games"

[agent]
timeout_sec = 1800.0
network_mode = "public"

[verifier]
timeout_sec = 3600.0
network_mode = "public"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "public"
