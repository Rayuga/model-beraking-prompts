schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "turing/dropline_connect_four_lite"
version = "4.0.0"
description = "Full-stack Connect Four game with authenticated per-account state, deterministic gameplay, and SQLite persistence"
keywords = ["webdev", "codearena", "full-stack", "nodejs", "express", "sqlite", "connect-four", "authentication", "accessibility"]

[metadata]
difficulty = "medium"
category = "Software"
subcategory = "Classic & Board Games"
tags = ["full-stack", "browser-game", "state-machine", "authentication", "persistence", "accessibility"]
provenance = "DropLine Connect Four Lite task aligned to the BazaarBridge five-dimension task format"
arena_slice = "full-stack-node-express-sqlite-board-game"
expert_time_estimate_hours = 5
difficulty_explanation = "The core game is familiar, but the submission must combine exact gravity and terminal-state behavior with protected bearer-token APIs, account-isolated SQLite state, deterministic reload persistence, keyboard access, and responsive presentation."
solution_explanation = "The reference keeps users, active bearer sessions, and one game-state row per account in SQLite. Server-side move transactions validate gravity and terminal locks, calculate four-direction wins, update scores once, and return a complete renderable state to a vanilla browser client."
verification_explanation = "Five pinned Codex browser dimensions evaluate render, constraints, functional behavior, polish, and aesthetics. Deterministic move sequences establish exact board coordinates and results; authentication and persistence checks use visible controls plus same-origin network evidence and reloads."
persona = "Full-stack JavaScript game developer"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"

[verifier.environment]
docker_image = "codearena/webdev-verifier:1.1.0"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
