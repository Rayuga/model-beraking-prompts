# Reward policy (render/constraints hard-gate is applied in test.sh, NOT in this file — rewardkit has no gate mode; the weighted_mean below is the ungated aggregation only):
#   if render == 0 OR constraints == 0 → reward = 0
#   else reward = 0.6 * functional + 0.4 * polish
# Applied in test.sh after dimension scores are collected (rewardkit has no gate mode).
# Aesthetic dimension removed — not graded.

[[reward]]
name = "reward"
aggregation = "weighted_mean"
