# Prompt version: ridgeline-print-storefront-polish-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 1200
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[criterion]]
id = "theme_switching"
name = "theme_switching"
type = "binary"
weight = 0.5
description = """
Use the visible theme control and confirm it produces a clear rendered change between light and dark presentation across the page — background, text and the product cards — while preserving legibility and the current view.
"""

[[criterion]]
id = "responsive_accessible_layout"
name = "responsive_accessible_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 mobile viewport, confirm the grid, the basket, and checkout each fit without horizontal page overflow and remain fully usable — filters and the basket do not require horizontal scrolling to operate. Confirm the desktop experience has a navigation or header landmark, a main landmark, a meaningful page heading, and accessible names or associated labels for the search box, the filter/sort selects, and the basket and theme controls.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Confirm interactive controls (buttons, the filter/sort selects, quantity inputs) have clear hover or focus feedback, and that adding a print to the basket gives clear, visible confirmation (for example the basket count updating or a confirmation message) distinct from a failed or refused add. Open a print's detail view, then close it using its own close control: confirm it fully disappears — no leftover overlay, backdrop, or dialog element remains in the page — and confirm pressing Escape closes it the same way from a fresh open. Confirm the basket panel closes just as cleanly.
"""

[[criterion]]
id = "keyboard_only_purchase_journey"
name = "keyboard_only_purchase_journey"
type = "binary"
weight = 1.5
description = """
Using only the keyboard — Tab, Shift+Tab, Enter, Space and Escape, no pointer clicks and no synthetic focus() calls — complete a full purchase starting from the home page. Reach the search box and the size/paper/sort controls by Tab alone; then Tab to any in-stock print's card and open it with Enter or Space. Inside the opened print, Tab to its quantity field, set a quantity, Tab to its Add-to-basket control and activate it with the keyboard, then close the view with Escape. Tab to the header's basket control and open it with the keyboard, Tab to its Checkout control and activate it, then on the checkout page Tab through every delivery-address field, type into each, and move to the review step with the keyboard. From review, activate Place order with the keyboard and confirm the order confirmation screen is reached. Confirm every one of these controls shows a clearly visible focus indicator as it receives focus — not just an accessible name in the DOM — and that no step of this journey required a pointer click or a mouse-only affordance.
"""
