schema_version = "1.4"
artifacts = ["/app", "/logs/verifier"]

[task]
name = "turing/ridgeline-print-storefront"
version = "1.0.0"
description = "Full-stack React (Vite) + Tailwind + SQLite risograph print-shop storefront — no accounts, per-line stock and trade-break pricing, weight-banded postage, and price-as-charged order immutability, with browser-only Luna judging"
keywords = ["webdev", "codearena", "full-stack", "react", "vite", "tailwind", "sqlite", "ecommerce", "product-catalog", "browser-judge", "rewardkit"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "converted/restructured from an externally-sourced requirement brief (named ridgeline-print-storefront as of the 2026-09-05 canonical rename; originally ridgeline-press-ecommerce-checkout, batch 4, authored 2026-09-01) that shipped only instruction.md and the /catalogue attachments; solution/ and tests/ built from scratch in the v2 4-dimension format, 2026-09-02"
arena_slice = "full-stack-react-vite-tailwind-sqlite-ridgeline-print-storefront"
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
