schema_version = "1.4"

[task]
name = "codearena/bazaarbridge-marketplace"
version = "5.1.0"
description = "Full-stack Node.js, Express, and SQLite BazaarBridge marketplace application with authenticated workflows and browser-only Luna judging"
keywords = ["webdev", "codearena", "full-stack", "nodejs", "express", "sqlite", "marketplace", "authentication", "browser-judge", "rewardkit"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
# Provenance: lightly edited from the user-provided BazaarBridge product task
# and its existing operations-dashboard brief; the terse request voice is kept.
provenance = "user-provided BazaarBridge product task and migration request, 2026-08-31"
arena_slice = "full-stack-node-express-sqlite-marketplace"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"

[verifier.environment]
docker_image = "codearena/webdev-verifier:1.1.0"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
