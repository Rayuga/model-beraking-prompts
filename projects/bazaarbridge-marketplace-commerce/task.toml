schema_version = "1.4"
artifacts = ["/app"]
[task]
name = "turing/bazaarbridge-marketplace-commerce"
version = "1.0.0"
description = "Full-stack Node.js, Express, and SQLite BazaarBridge marketplace application with three merchants, nine accounts, eight desks (Dashboard, Orders, Products, Inventory, Warehouse, Finance, Compliance, Admin), and browser-only Luna judging. The brief is desk-specific field notes plus a short policy anchored on SKU case-insensitivity, whole-dollar prices, commission bands, the $10,000 two-person payout rule, the 30-day return window, receipt-gated returns and refunds, freeze-with-reason, and masked bank tokens. Payout voiding is explicit and immediate: when a new Shipped order lands for a merchant, every earlier Approved payout for that merchant becomes Stale before it may count toward ready payout or be released, while returns/cancellations/freezes do not void approvals. Requests may carry extra fields; the server ignores fields it does not own or derive and never rejects a request solely for extra fields. Platform staff including Viewers see a read-only Admin desk whose administrative writes are Administrator-only, and the Viewer retention check uses one full-credit bar. The functional rubric runs 24 conjunctive stateful chains against one continuous database: reservations with a final-unit race, server-derived order and refund amounts, ordered hub-scoped fulfilment and completed-shipment immutability, maker-checker payout and refund approval with automatic Shipped-order invalidation, merchant read isolation graded on response bodies and forged merchant write refusal, filtered-dashboard headline stability, immediate role-demotion enforcement, and signed-out replay isolation. Return eligibility and every timestamp resolve against a fixed seed clock, and the verifier serializes the browser dimensions, so grading never depends on the run date or concurrent judge overlap. The build also carries a separate presentation dimension: deliberate typography, legible colour contrast, measured spacing and layout, a scannable hierarchy, and coherent overall craft that stays visually consistent across the light/dark themes and desktop/mobile viewports. Refusals are graded by unchanged re-read plus no new activity entry rather than one status-code shape."
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "marketplace", "authentication", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
difficulty_explanation = """
v10.0.0 — five-dimension expansion. The v9.x behavior-contract rework is
preserved and unchanged: the domain grew from three users and four desks to
nine users, three merchants and eight desks, but the difficulty comes from
interacting state, not surface area. Merchant-scoped lists and direct reads
are graded against response bodies, not rendered hiding. Product and stock
writes reject empty, fractional, negative and reason-less values and resist
case-insensitive SKU collisions. Ordering and fulfilment follow strict
transitions (New→Packed→Shipped, CREATED→PICKED→IN_TRANSIT→DELIVERED) with a
final-unit reservation race, wrong-hub refusal and completed-shipment
immutability. Returns respect an open/closed 30-day window; refunds require a
warehouse receipt and a server-derived amount; payouts and refunds need a
requester distinct from the approver, replay idempotency, a $10,000 two-person
rule, and ledger-change invalidation of a prior approval; frozen merchants
cannot receive or release money and freeze/unfreeze demands a stated reason.
Suspension revokes the session and demotion bites on the very next write.
Every chain is a conjunction: any failed leg fails the whole criterion, with
positive controls first and unchanged re-reads after every refusal. The 24
criteria total 72.5 functional weight with ~92% adversarial-probe share.
v10.0.0 adds a fifth scored presentation dimension — typography,
colour/contrast, spacing/layout, hierarchy/scannability, overall craft and
responsive visual consistency — all judged from rendered browser evidence
under the same configurable task-level judge wiring and the
0.6 * functional + 0.2 * polish + 0.2 * visual reward policy. The visual
dimension never grades product behaviour, data correctness, authorization or
workflow; it scores only how the delivered surfaces look.
"""
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "turing/bazaarbridge-marketplace-commerce v10.0.3: render dimension simplified to a basic local-app/sign-in gate based on model-run evidence. tests/render/authenticated_render now requires only that localhost:3000 renders a real BazaarBridge surface, protected data is hidden before sign-in, an incorrect Administrator password is rejected, and admin@bazaarbridge.test with password123 opens populated protected content that identifies Ari Morgan / Administrator; it no longer requires visiting or distinguishing all eight desks, and the render prompt and coverage mapping no longer claim per-desk distinctness for this gate. Constraints, functional, polish, visual, reward weights, timeouts, network posture, seed logic and all functional behavior are unchanged. Preserves the v10.0.2 mobile/desktop visual rework, the v10.0.1 functional fixes (replay-based terminal order refusals and masked freeze/unfreeze merchant projections), and the v10.0.0 five-dimension expansion, timeout nesting, fixed-clock determinism, serialized verifier agents, payout voiding, read-only Admin, extra-field semantics, floor, and public posture."
arena_slice = "full-stack-node-express-sqlite-marketplace"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
