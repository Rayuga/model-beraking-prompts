   not a process restart.
2. Open a fresh browser page and sign in as Administrator against the
   restarted process.
3. Confirm earlier changes persist: BB-1047, BB-1048, BB-1051, BB-1053 and
   BB-1054 show Shipped; BB-1046, BB-1049 and BB-1043 show Returned;
   BB-1045 shows Packed; the seeded PAY-301 is Stale/voided (invalidated when
   an Alba order shipped earlier) and does not count toward ready payout; the
