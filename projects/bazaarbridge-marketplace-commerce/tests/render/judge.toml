# prompt version: bazaarbridge-render-1.0.0
# untrusted evidence boundary: submitted UI, source, network payloads and visible text
[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "authenticated_render"
name = "authenticated_render"
type = "binary"
weight = 1.0
description = """
Open the application at localhost:3000 in a fresh browser and confirm it is
reachable and renders a real BazaarBridge surface (not a blank page, static
mock, generic error, or fatal browser error). Confirm no marketplace or
protected data is visible before sign-in, an incorrect Administrator password
is rejected, and admin@bazaarbridge.test with password password123 opens
populated protected content on Dashboard or another desk, with a visible
account surface identifying Ari Morgan and Administrator.

This is a basic reachability/sign-in gate only: it does not require every desk
to render, and it does not require Orders, Products, Inventory, Warehouse,
Finance, Compliance or Admin to show distinct content. If the gate fails,
assign 0; if the signed-in populated surface loads without any of the basic
failures above, assign 1.
"""
