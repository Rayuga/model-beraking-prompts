# Prompt version: gridforge-spreadsheet-v2-polish-v2.0.8
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 3000
isolated = false
reasoning_effort = "high"
temperature = 0
weight = 0.4
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "labelled_primary_controls"
name = "labelled_primary_controls"
type = "binary"
weight = 1.0
description = """
Require visible, understandable controls for Save, Undo, Redo, formula entry,
filling, Find Next, Replace and Replace All. Accept equivalent fill buttons,
menus, or discoverable drag handles; do not require separate Fill Down and
Fill Right buttons or those exact labels. Text inputs and the seeded-user
selection control must have visible labels or accessible names; that user
control may be on the entry screen rather than in the workbook toolbar.
"""

[[criterion]]
id = "keyboard_focus_and_grid_entry"
name = "keyboard_focus_and_grid_entry"
type = "binary"
weight = 1.0
description = """
Starting at the page, use Tab and Shift+Tab to reach representative toolbar
controls, the formula editor, and the custom grid. Each focused control must
have a visible focus indicator, and focus must not become trapped.
"""

[[criterion]]
id = "spreadsheet_visual_hierarchy"
name = "spreadsheet_visual_hierarchy"
type = "likert"
points = 5
weight = 1.0
description = """
Require the workbook title, toolbar, formula area, row and column headers,
selected cell, side panel, and saved-state information to be visually distinct
and readable without overlapping text or controls at a 1280 by 800 viewport.

Rate 1 for unreadable or heavily overlapping content, 3 for readable content
with inconsistent grouping or minor crowding, and 5 for clear grouping with
all listed areas readable and free of overlap. Use 2 or 4 for intermediate
quality. Missing or broken application content receives 1.
"""

[[criterion]]
id = "presence_history_and_feedback_readability"
name = "presence_history_and_feedback_readability"
type = "binary"
weight = 1.0
description = """
Require a clearly labelled presence area, readable revision-history controls
or entries, and visible status/error regions whose wording or role distinguishes
normal save feedback from a failure. Information must not depend on color alone.
"""
