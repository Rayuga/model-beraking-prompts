schema_version = "1.4"

artifacts = ["/app", "/logs/verifier"]

[task]
name = "turing/gridforge-spreadsheet-v2"
version = "2.0.0"
description = "Full-stack custom spreadsheet with formulas, range editing, live collaboration, SQLite revisions, autosave, and conflict-safe concurrent writes"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "spreadsheet", "formula-engine", "collaboration", "concurrency", "rewardkit"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Spreadsheet Editors"
tags = ["full-stack", "custom-grid", "formulas", "sqlite", "live-collaboration", "optimistic-concurrency", "browser-judge"]
provenance = "Version 2 restructures the existing GridForge spreadsheet brief and verifier into the current four-dimension RewardKit format without reducing its functional requirements."
arena_slice = "full-stack-node-express-sqlite-custom-spreadsheet"
difficulty_explanation = "The task combines a from-scratch keyboard and mouse grid, formula parsing and dependency recovery, atomic clipboard/fill actions, live presence, cell attribution, SQLite revisions, autosave and server-enforced concurrent save safety."
solution_explanation = "The reference solution uses a custom DOM grid, a dependency-aware formula engine, browser event streams for presence, and a Node SQLite service with revision-aware merge and rejection rules."
verification_explanation = "Small Render and Constraints gates verify only a healthy local product shell. Twenty original high-resolution behavioral checks remain in Functional, while four narrow Polish checks cover visible usability without becoming a second functional suite."
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 7200.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 1800.0

[verifier]
timeout_sec = 12600.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "high"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.openai.com"]
