schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/dropline-four-connect"
version = "1.0.0"
description = "Connect Four with private branching studies, atomic subtree transplantation, bounded tactical proof trees, durable replay and conflict-safe SQLite persistence"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "connect-four", "authentication", "undo-redo", "optimistic-concurrency", "replay", "accessibility", "analysis-tree"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Combine exact Connect Four and durable concurrent analysis trees with recursive subtree transformation, identity-preserving edge merges, dual-revision atomic commits and deterministic adversarial search with complete bounded proof trees. Preserve ownership, retry receipts, terminal boundaries and competitive isolation across restart."
category = "Software"
tags = ["full-stack", "browser-game", "state-machine", "authentication", "persistence", "concurrency", "idempotency", "accessibility"]
provenance = "Derived from the repository Deliverables Tracker assignment for Classic & Board Games / Tic-tac-toe or Connect-4 and the task owner's live request to add undo and redo; the natural request is retained in instruction.md"
arena_slice = "full-stack-node-express-sqlite-board-game"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
