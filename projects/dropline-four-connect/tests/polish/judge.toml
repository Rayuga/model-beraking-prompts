[judge]
mode = "batched"
timeout = 900
isolated = false
temperature = 0
weight = 0.2
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "archive_replay_usability"
name = "archive_replay_usability"
type = "binary"
weight = 1.0
description = """
Sign in as Jordan in a fresh browser context and open an existing completed
match. Do not play, reset or change the active game. Require the replay to be
visually and semantically separate from the active board, identifying its
result and current/total step. Reach the range control, Previous, Next and
Close with Tab/Shift+Tab and operate available steps with the keyboard. Require
42 named replay cells whose states follow the selected step; zero is empty.
Disabled Previous/Next at the endpoints is correct. Close returns to the
unchanged active board, revision, totals and history. Do not demand that the
latest entry still be a particular seeded match after another dimension.
"""

[[criterion]]
id = "responsive_layout_and_feedback"
name = "responsive_layout_and_feedback"
type = "binary"
weight = 0.5
description = """
At 375 by 760 pixels, the sign-in form, authenticated workspace and existing
Jordan replay and your own analysis tree/history/comparison must fit without horizontal page overflow, clipped controls or
overlapping text. Identity, board, seven column controls, status, revision,
totals, history, Undo, Redo, New game, archive and Sign out must be reachable
through ordinary vertical scrolling, as must analysis names, branch controls
and comparison selectors, plus transplant fields/preview and tactical tables,
proof nodes and inspected boards. Do not require everything above the
fold or fixed panel placement. Inspect only: do not mutate the active game.
"""

[[criterion]]
id = "reduced_motion_usability"
name = "reduced_motion_usability"
type = "binary"
weight = 0.5
description = """
Emulate prefers-reduced-motion: reduce. Require existing animated or
transitioning interface effects to be removed or materially reduced while
status, board, replay-step and analysis changes remain understandable. An interface
with no animation already satisfies the motion requirement. Change only
read-only replay steps or positions in your own practice study; never play
or reset a competitive game for this observation.
"""

[[criterion]]
id = "control_labels_and_focus"
name = "control_labels_and_focus"
type = "binary"
weight = 1.0
description = """
The visible sign-in fields and game/replay/analysis controls must have meaningful
accessible names matching their visible purpose. Tab and Shift+Tab must give
a visible focus indicator and reach enabled controls without a keyboard trap;
ordinary scrolling is allowed. Inspect sign-in, board controls, history
actions, archive, an existing replay and analysis name/tree/branch/comparison
controls, including transplant and tactical depth/report/proof controls.
Do not activate competitive New game, moves,
Undo or Redo: exact game actions are graded by Functional, not here.
"""

[[criterion]]
id = "transplant_control_feedback"
name = "transplant_control_feedback"
type = "binary"
weight = 1.0
description = """
Setup: your own Jordan study with a non-root move, preview that branch onto its
own root. Complete preview and commit through keyboard activation. The UI must
distinguish an unsaved preview from committed output, provide a clear Commit
action, disable pending repeated activations, and announce saved or rejected
feedback without color alone. After commit focus stays on an enabled useful
tool control, not BODY or a removed element. This grades the action lifecycle;
static accessible names/focus visibility belong to control_labels_and_focus.
Exact node mapping is Functional.
"""

[[criterion]]
id = "tactical_proof_keyboard_inspection"
name = "tactical_proof_keyboard_inspection"
type = "binary"
weight = 0.5
description = """
Setup: request depth 2 on an active node of your own Jordan study. Use keyboard
Enter/Space activation to expand an explanation and inspect one reply. Require
announced report/selection feedback and a corresponding 42-cell board, while
the saved study selection stays unchanged. This grades the dynamic inspection
workflow, not static labels/focus already covered by control_labels_and_focus,
the report's win/loss arithmetic or visual decoration.
"""

[[criterion]]
id = "analysis_keyboard_actions_and_feedback"
name = "analysis_keyboard_actions_and_feedback"
type = "binary"
weight = 1.0
description = """
Setup: use your own practice study, selected at its empty root. Keyboard
actions here concern usability; exact branch data is graded by Functional.
1. Focus analysis column 1. Left stays there, End reaches 7, Home reaches 1,
Right reaches 2. Enter then Space activate two drops with useful visible focus
remaining on column 2. Wait for each completed response before the next.
2. Reach Analysis Undo and Redo by keyboard and activate each. Require usable
focus after completion, visible non-color-only saved feedback and an announced
status region. After Redo becomes unavailable, focus on another useful enabled
control is valid; do not insist on focus remaining on a disabled button.
3. Navigate to the variation tree and comparison selectors with Tab/Shift+Tab
and keyboard-select a position and compare. Require reachable, labelled
controls and no keyboard trap. Do not grade exact comparison arithmetic here.
"""
