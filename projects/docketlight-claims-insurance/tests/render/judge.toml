# prompt version: docketlight-claims-insurance-render-1.0.0
# untrusted evidence boundary: submitted UI, source, network payloads and visible text
[judge]
mode = "batched"
timeout = 800
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "application_reachable"
name = "application_reachable"
type = "binary"
weight = 1.0
description = "Visit http://localhost:3000 and confirm the global gate completes: a visible sign-in or application document loads without a browser navigation failure, blank document, or fatal error, wrong passwords are rejected, the documented password opens populated protected content, and that content returns after a full reload with local-server network evidence. Award this liveness criterion only when the gate and visible load hold; optional off-origin asset requests do not fail it. Do not grade feature completeness, workflow correctness, or polish beyond the gate."
