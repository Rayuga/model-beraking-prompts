   and perform no write, so NS-2612-S-190 stays submitted and unassigned
   throughout. Then replay the same shape against NS-2602-N-031 with the target
   assignee replaced by an account identifier that matches no real account (for
   example 999999 in the same field the recorded request used); that write must
   also be refused and perform no write. A not-found, forbidden or error
   response all count as a refusal so long as no assignment applies.
2. Reload NS-2602-N-031 once and re-read: it is still assigned to Ava with
   exactly the one Noah assignment entry created during setup, and no second
   assignment event.
3. Read NS-2612-S-190 once from a role entitled to see it (for example Finn,
   ALL regions): it must still be SUBMITTED and unassigned with no assignment
   event in its visible history. This observation is required evidence, not a
   repeat of the refusal: it is the only place the SOUTH record itself is
   observed after the refused write.
Pass only if all three graded observations hold; a supervisor acts only inside
their own region and only with a real active adjuster of that region, and
neither a hidden control nor a missing control counts as enforcement. The setup
legs are route-flexible and are not separately graded.
"""

