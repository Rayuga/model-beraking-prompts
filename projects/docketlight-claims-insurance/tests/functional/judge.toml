2. Replay the recorded create request in-page with the policy target changed to
   the other region's policy POL-S-200 (Southline Logistics) and client-supplied
   region or owner fields naming SOUTH; the server must refuse it and create no
   claim, so after a refresh no claim from that replay exists in Nora's records.
Pass only if both graded observations hold. The setup legs are route-flexible
and are not separately graded.
"""

