3. After the final reload the ESTIMATE row and its actor/time history remain on
   NS-2603-N-074 exactly once and the claim state persists.
Pass only if all three graded observations hold. The setup legs are
route-flexible and are not separately graded.
"""

[[criterion]]
id = "demo_roles_and_summary"
name = "demo_roles_and_summary"
