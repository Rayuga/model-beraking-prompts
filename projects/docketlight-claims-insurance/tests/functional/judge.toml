[[criterion]]
id = "payable_exposure_cap_and_floor"
name = "payable_exposure_cap_and_floor"
type = "binary"
weight = 2.0
description = """
Setup: sign in as Ava and open NS-2609-N-160, recording the read the page used
for it; then sign in as Finn and open NS-2609-S-161.

Graded observations (required evidence; the verdict rests on these only):
1. NS-2609-N-160, whose reported loss exceeds its policy limit, shows and you
