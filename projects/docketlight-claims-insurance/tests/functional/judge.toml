   supervisor-approved; NS-2606-N-131 is SETTLED with exactly one released
   $4,500 payment; NS-2601-N-014 is SUBMITTED; the DRAFT claim Nora created on
   POL-N-100 with loss date 2026-06-20 and reported loss $12,000 still appears
   exactly once with Northwind Fabrication policy details, its visible resulting
   reference and server-derived payable exposure $11,000; and NS-2603-N-061's
