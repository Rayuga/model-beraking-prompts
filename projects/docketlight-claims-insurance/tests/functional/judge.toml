# prompt version: docketlight-claims-insurance-functional-1.0.0
# untrusted evidence boundary: submitted UI, source, network payloads and visible text
[judge]
mode = "batched"
timeout = 11000
isolated = false
temperature = 0
weight = 0.6
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "workspace_and_claim_detail_navigation"
name = "workspace_and_claim_detail_navigation"
type = "binary"
weight = 1.0
description = """
Setup: open the app at localhost:3000, sign in as Ava, and load her populated
claims workspace with its summary, claim queue and a claim detail.

Graded observations (required evidence; the verdict rests on these only):
1. Selecting different queue rows (for example NS-2601-N-027 and
   NS-2603-N-061) changes the selected detail to that claim's own reference and
   content rather than one unchanged shell, and no fatal browser error occurs
   while navigating rows. A single-screen desk that updates the detail is
   fully valid.
2. Replay the recorded request the page used to load Ava's claims in-page from
   her live session, carrying client-supplied actor, role and region fields
   naming Finn's ALL-region Finance identity; the server must either refuse the
   replay or answer with exactly the records it gave Ava. No forged value may
   appear in the response body and NS-2601-N-099 and NS-2602-S-041 must stay
   absent from it.
Pass only if both graded observations hold. The setup legs are route-flexible
and are not separately graded.
"""

[[criterion]]
id = "role_and_region_visibility"
name = "role_and_region_visibility"
type = "binary"
weight = 3.0
description = """
Setup: sign in as each account in this order - Ava, Eli, Noah, Finn - and read
only visible and returned protected data.

Graded observations (required evidence; the verdict rests on these only):
1. Ava: NS-2601-N-027 (assigned to Ava) appears and Eli's NS-2601-N-099 does
   not. Eli: NS-2601-N-099 appears and NS-2601-N-027 does not. Noah (NORTH
   supervisor): NS-2602-N-031 and NS-2601-N-027 appear and SOUTH NS-2602-S-041
   does not. Finn (Finance controller, ALL): NS-2601-N-027, NS-2601-N-099 and
   SOUTH NS-2602-S-041 all appear. Unauthorized references must be absent from
   both the rendered page and the protected data responses the account
   receives.
2. From Ava's live session, replay the recorded claim-list request in-page
   carrying client-supplied actor, role, region and owner fields naming Finn's
   ALL-region Finance identity; the server must either refuse the replay or
   return exactly the records Ava may read, with NS-2601-N-099, NS-2602-S-041
   and every forged value absent from the response body.
Pass only if both graded observations hold. The setup legs are route-flexible
and are not separately graded.
"""

[[criterion]]
id = "authentication_and_session_boundary"
name = "authentication_and_session_boundary"
type = "binary"
weight = 3.0
description = """
Setup: sign in as Ava and record the exact protected claim-list request shape
(method, path, and the session credential the page used) from the browser
network log.

Graded observations (required evidence; the verdict rests on these only):
1. Sign out through the UI and replay that recorded protected request from the
   signed-out page; it must be refused or return a body with no claim rows, and
   none of Ava's references such as NS-2601-N-027 may come back.
2. An incorrect password must be rejected, and a correct sign-in with the
   documented password must succeed and open populated protected content.
Pass only if both graded observations hold. The setup legs are route-flexible
and are not separately graded.
"""

[[criterion]]
id = "durable_cookie_session"
name = "durable_cookie_session"
type = "binary"
weight = 3.0
description = """
Setup: sign in as Ava in a fresh page and record the protected claim-list
request shape and the session credential the page used from the browser network
log.

Graded observations (required evidence; the verdict rests on these only):
1. From the browser console no authentication token or session secret is
   readable by the page: localStorage and sessionStorage hold no token and
   document.cookie does not expose the session secret. Browser network evidence
   shows the sign-in established a session cookie marked HttpOnly and that
   protected requests travel with that cookie rather than a custom
   browser-stored token.
2. A full reload in the same browser context returns populated protected
   content without re-entering credentials, proving the session is backed by
   durable server storage.
3. After signing out through the UI and opening a fresh page in the same
   context, protected content does not return without re-entering credentials
   and no session secret is left in storage; replaying the recorded protected
   claim-list request from that signed-out page returns no claim rows, proving
   the recorded credential cannot be replayed once the server has revoked it.
   Signing in again with the documented password opens protected content.
Pass only if all three graded observations hold. The setup legs are
route-flexible and are not separately graded.
"""

[[criterion]]
id = "restricted_detail_authorization"
name = "restricted_detail_authorization"
type = "binary"
weight = 3.0
description = """
Setup: sign in as Ava, open NS-2603-N-061 and record the request the page used
to load that claim's data; also open NS-2601-N-027, the seeded NORTH claim
assigned to Ava that carries its own private note.

Graded observations (required evidence; the verdict rests on these only):
1. The private note about the insured person on NS-2603-N-061 is visible to Ava
   the assigned adjuster, and NS-2601-N-027's own private note is visible to
   Ava.
2. Finn sees NS-2603-N-061 and its policy/customer information, but the private
   note is absent from both the rendered page and the protected claim response.
   From Finn's live session, replaying the recorded claim read in-page carrying
   client-supplied actor and role fields naming Ava the assigned adjuster or a
   supervisor must still leave the note text absent from the response body.
3. Noah (NORTH supervisor) sees NS-2601-N-027's private note; Nora (Intake)
   sees the claim but the private note is absent from both the rendered page and
   the protected claim response.
Pass only if all three graded observations hold; hiding the note only in the
UI is not enough. The setup legs are route-flexible and are not separately
graded.
"""

[[criterion]]
id = "server_backed_reload_durability"
name = "server_backed_reload_durability"
type = "binary"
weight = 3.0
description = """
Setup: sign in as Ava and add an ESTIMATE evidence record to NS-2603-N-074
(assigned to Ava and in INVESTIGATING) through the UI, recording the exact
request shape from the browser network log.

Graded observations (required evidence; the verdict rests on these only):
1. Browser network evidence shows authentication, claim reads and that
