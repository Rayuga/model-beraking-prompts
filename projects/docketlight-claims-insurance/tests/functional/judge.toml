2. NS-2609-S-161 on POL-S-200, whose reported loss $400 is below its $500
   deductible, shows and you quote reported loss $400 and server-derived
   payable exposure of zero (shown as $0, $0.00 or any equivalent zero figure),
   proving the floor never goes below zero.
3. Replay the recorded NS-2609-N-160 read in-page carrying client-supplied
   loss, policy-limit, deductible and payable fields that would make the
   exposure $120,000; the server must either refuse the replay or return its own
   $99,000 figure, and no forged amount may appear.
Pass only if all three graded observations hold and every named figure was
observed and quoted; the same amount rendered with or without trailing zeros
counts as the figure named. The setup legs are route-flexible and are not
separately graded.
"""

