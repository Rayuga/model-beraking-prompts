Graded observations (required evidence; the verdict rests on these only):
1. After a refresh a row with that resulting reference exists exactly once, is
   DRAFT, carries Northwind Fabrication policy details and shows server-derived
   payable exposure $11,000. Other seeded DRAFT claims may also be present; a
