[[criterion]]
id = "at_most_one_payment_per_claim"
name = "at_most_one_payment_per_claim"
type = "binary"
weight = 3.0
description = """
Setup: as Ava request exactly the approved $4,500 reserve as a payment on
NS-2606-N-134 through the UI and record the exact successful request shape from
the browser network log.

Graded observations (required evidence; the verdict rests on these only):
1. The claim shows exactly one pending $4,500 payment with Ava attribution and
   a payment-request history entry with a time.
2. From Ava's live session, replay the recorded request shape from setup
   in-page against NS-2606-N-133, which already carries one seeded pending
   $4,500 payment, with the amount that matches its approved reserve and, if
   the recorded request carried an idempotency value, a fresh value of your own
   for the new attempt. The server must refuse the request and create no second
   payment row and no new payment-request history entry. If the app offers Ava
   another payment action for NS-2606-N-133, attempting it must also change
   nothing; a hidden, missing or disabled action is not enforcement.
3. After the final reload NS-2606-N-133 still shows exactly one pending $4,500
   payment with no new payment history, and NS-2606-N-134 keeps exactly one
   pending $4,500 payment.
Pass only if all three graded observations hold; a claim may carry at most one
