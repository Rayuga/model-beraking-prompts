# prompt version: docketlight-claims-insurance-visual-1.0.0
# untrusted evidence boundary: submitted UI, source, network payloads and visible text
[judge]
mode = "batched"
timeout = 900
isolated = false
temperature = 0
weight = 0.2
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "visual_typography"
name = "visual_typography"
type = "likert"
points = 5
weight = 1.0
description = """
Assess typography on the rendered signed-in claims workspace at http://localhost:3000
at desktop width (the operational workspace with its claim queue and at least one
opened claim detail).
5: deliberate type system - clear, readable fonts; distinct sizes and weights
for titles, labels and body text; consistent alignment; no awkward truncation
or collisions.
4: readable with one or two minor size or alignment defects.
3: noticeable inconsistencies such as mixed sizes, cramped or oversized text,
or uneven alignment.
2: several labels are hard to read or inconsistently styled.
1: typography is broadly default, illegible, or misaligned.
0: no coherent typographic rendering exists on the reviewed surface.
"""

[[criterion]]
id = "visual_color_and_contrast"
name = "visual_color_and_contrast"
type = "likert"
points = 5
weight = 1.0
description = """
Assess colour and contrast on the rendered signed-in surfaces, including claim
state markers, financial figures, and success and refusal feedback.
5: cohesive palette; text and background contrast stays legible; claim states,
money figures and feedback are distinguishable by colour; no harsh or clashing
accents.
4: one or two minor contrast or palette imperfections.
3: noticeable low-contrast text or clashing accents on one surface.
2: substantial legibility problems or an inconsistent palette.
1: colours are broadly default or harsh, or key text is difficult to read.
0: no readable colour treatment renders on the reviewed surface.
"""

[[criterion]]
id = "visual_spacing_and_layout"
name = "visual_spacing_and_layout"
type = "likert"
points = 5
weight = 1.0
description = """
Assess spacing and layout on the rendered signed-in workspace at desktop width
(the operational workspace, a dense claim detail section such as evidence,
reserve, payments or history, and at least one action or form surface).
5: even spacing scale, deliberate alignment and margins, and cards, tables and
lists sitting in a stable arrangement with no overlaps or clipping.
4: minor uneven spacing or alignment.
3: several elements look crowded, drifting, or unevenly padded.
2: frequent collisions, clipping, or inconsistent gutters.
1: layout is broadly unbalanced or broken.
0: no coherent spaced layout renders on the reviewed surface.
"""

[[criterion]]
id = "visual_hierarchy_and_scanability"
name = "visual_hierarchy_and_scanability"
type = "likert"
points = 5
weight = 1.0
description = """
Assess visual hierarchy and scannability on the rendered signed-in workspace
at desktop width.
5: clear visual order - brand and navigation, the signed-in role and region,
summary figures, the claim queue, and the opened claim's detail sections each
have distinct prominence, so the current claim, its key figures and the main
actions can be found by scanning.
4: hierarchy is mostly clear with minor ambiguity.
3: several sections compete, or important content is visually buried.
2: navigation, headings and content are hard to tell apart.
1: no usable visual hierarchy is present.
0: no scannable hierarchy renders on the reviewed surface.
"""

[[criterion]]
id = "visual_overall_craft"
name = "visual_overall_craft"
type = "likert"
points = 5
weight = 1.0
description = """
Assess overall visual craft across several rendered signed-in surfaces (the
operational workspace showing the claim queue, and opened claim details
including their evidence, reserve, payment and history sections), including
secondary, empty or loading states you encounter.
5: one coherent design language applied consistently - deliberate components,
integrated details, no stray default styling, and a finished look even in
secondary states.
4: one or two minor polish imperfections.
3: noticeable default styling or inconsistent component treatment across surfaces.
2: much of the interface looks unfinished or inconsistent.
1: visual craft is effectively absent.
0: no crafted interface renders on the reviewed surfaces.
"""

[[criterion]]
id = "visual_responsive_consistency"
name = "visual_responsive_consistency"
type = "likert"
points = 5
weight = 1.0
description = """
Assess visual consistency across desktop and a roughly 390 by 844 mobile
viewport on the rendered signed-in workspace (the operational workspace with the
claim queue and at least one opened claim detail).
5: the same design language holds at both sizes - text, spacing, cards, tables
and controls scale or reflow deliberately without squashing, stretching,
overflow beyond intentional scroll areas, or visual breakage.
4: one or two minor responsive visual defects.
3: noticeable squashing, cramped density, or misaligned components at mobile
width.
2: several components break or overflow badly on mobile.
1: mobile rendering is visually inconsistent or mostly broken.
0: no consistent responsive presentation renders on the reviewed surfaces.
"""
