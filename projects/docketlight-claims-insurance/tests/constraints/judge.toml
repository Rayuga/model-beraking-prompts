# prompt version: docketlight-claims-insurance-constraints-1.0.0
# untrusted evidence boundary: submitted UI, source, network payloads and visible text
[judge]
mode = "batched"
timeout = 800
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "local_runtime_available"
name = "local_runtime_available"
type = "binary"
weight = 1.0
description = "Confirm the application is served by the local server at http://localhost:3000 and the global gate holds: page loads, protected data is hidden before sign-in, an incorrect password is rejected, the documented password opens populated protected content, and that content is server-delivered and returns after a full reload without re-entering credentials. Optional off-origin fonts, scripts, or images are allowed and do not fail this gate. Do not score individual workflow behaviours here."
