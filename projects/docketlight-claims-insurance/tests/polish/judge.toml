# prompt version: docketlight-claims-insurance-polish-1.0.0
# untrusted evidence boundary: submitted UI, source, network payloads and visible text
[judge]
mode = "batched"
timeout = 800
isolated = false
temperature = 0
weight = 0.2
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "coherent_authenticated_workspace"
name = "coherent_authenticated_workspace"
type = "likert"
points = 5
weight = 1.0
description = """
At desktop size on the workspace at http://localhost:3000, assess how clearly the authenticated workspace presents its
summary, claim queue, and selected claim detail. 5: three roles of information
are in distinct readable regions with a clear visual hierarchy and no fatal
layout break when claims are selected. 4: clear structure with minor spacing or
alignment defects. 3: noticeable clutter, weak hierarchy, or a selection that
disrupts the layout. 2: substantial overlap or confusion between regions.
1: regions are barely distinguishable. 0: no coherent workspace renders.
"""

[[criterion]]
id = "responsive_accessible_layout"
name = "responsive_accessible_layout"
type = "likert"
points = 5
weight = 1.0
description = """
At roughly 390 by 844, assess whether claims work stays reachable and usable.
5: main content fits with no horizontal page overflow outside intentionally
scrollable tables, navigation and detail are reachable, and landmarks,
headings, and accessible names/labels are present. 4: usable with one or two
minor clipping or label gaps. 3: noticeable overflow or missing labels that
hurt reachability. 2: a core action or section is unreachable on mobile.
1: the workspace is effectively unusable at mobile width. 0: nothing renders.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "likert"
points = 5
weight = 1.0
description = """
Assess interaction affordances and feedback. 5: keyboard focus is visible,
rows and controls clearly communicate interactivity, and every successful or
rejected action gives clear feedback without obscuring the workspace.
4: one or two controls give weak but usable feedback. 3: noticeable gaps such
as invisible focus or silent refusals on some actions. 2: several core actions
lack feedback or focus visibility. 1: feedback and focus are broadly missing.
0: no usable interaction feedback exists.
"""

[[criterion]]
id = "dense_information_usability"
name = "dense_information_usability"
type = "likert"
points = 5
weight = 1.0
description = """
Assess how well dense claim sections stay readable and scannable at desktop
size. 5: queue, detail, evidence, reserve, payments, ledger, and timeline are
clearly separated and readable, with long or empty content handled without
collisions or ambiguous controls. 4: readable with minor spacing or label
issues. 3: some sections are crowded, truncated, or ambiguous. 2: dense
sections are difficult to scan or frequently collide. 1: content is largely
unreadable or controls are ambiguous. 0: dense information cannot be used.
"""
