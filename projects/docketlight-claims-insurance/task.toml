provenance = "user-provided Docketlight Enterprise product task and migration request, 2026-08-31; v2.4.1 pre-run QC rework 2026-09-09; v2.5.0 rework 2026-09-09; v2.5.1 upload fix 2026-09-09; v2.6.0 QC rework 2026-09-09; v2.7.0 QC rework 2026-09-09; v2.8.0 QC rework 2026-09-09; v2.8.1 QC fix 2026-09-09; v2.8.2 QC fix 2026-09-09; v2.9.0 QC fix 2026-09-09: keeps every v2.7.0/v2.8.x fix (clean seeded staging, real restart persistence, wrong-role/stale refusals, functional floor at 0.5, natural brief, public network, no same-origin gate, 33 criteria/total weight 74/coverage, outcome-based refusal evidence, app-shown resulting references, functional batched mode with one 10500s whole-dimension budget), replaces the shipped solution/docketlight-restart.sh + docketlight-restart-controller.py helper contract with a verifier-owned inline Python HTTP controller emitted by tests/test.sh (127.0.0.1:3199, GET /restart relaunches the same staged /app server as uid 65534 with the same DB_PATH/SEED_PATH immediately before durable_restart_state), so a correct instruction-following app always scores, no submitted file is executed as root, and no submitted code can reach reward files; removes helper names from the agent brief; moves the six notes to the canonical environment/assets/instructions layout with the no-shipped-database rule stated once in instruction.md and no duplicated delivery lists; clarifies in behaviour.md that acting from an outdated claim copy is refused while adding another estimate during an active investigation is allowed; reconciles security.md/ui.md claim-scoped money/ledger detail with the Finance/Administrator organisation-wide money view and moves the durable_restart_state DEBIT verification to Finn (Finance); keeps each judge.toml [judge].weight as a positive schema participation value (RewardKit rejects zero) documented on every judge file, with the authoritative live render=0.0/constraints=0.0/functional=0.6/polish=0.4 policy solely in tests/reward.toml and tests/test.sh; preserves --max-concurrent-agent 1 and the timeout hierarchy 800+800+800+10500=12900 < 13200 < 13800 under the six-hour cap; v2.9.1 contract fix 2026-09-09: check-runtime-contract-strings.py found tests/test.sh launches restart-controller.py while the oracle neither named nor shipped a file with that name under solution/, so the v2.9.0 reference could not be validated end to end; the oracle now ships solution/restart-controller.py (byte-identical to the verifier's inline controller) and solve.sh copies it to /app/restart-controller.py, so the shipped reference names and carries the launched helper, while tests/test.sh still emits its own verifier-owned copy at runtime so no submitted file executes as root and no submitted code can reach reward files; v2.10.0 model-breaking rework 2026-09-09: the v2.9.1 oracle run scored 0.9757 because unassigned_adjuster_write_refusal was misread (the successful step-2 ESTIMATE on NS-2608-N-151 was attributed to the unassigned control NS-2602-N-032), so the criterion now cross-checks both claims by reference, the UI refuses to act when the selected claim is not in the loaded list, and the finance release criterion gains a same-request replay leg; a gpt-5.4-mini rollout scored 0.7541, so the brief adds six operational rules (repeat-safe settlement keys, zero/negative payment refusal, PHOTO/ESTIMATE-only evidence with PHOTO required before review, intake coverage-window validation, draft amendment with recomputed payable, supervisor reopen, reserve supersession) and the functional dimension adds eight binary criteria weighing 27 against seeded NS-2611-N-172..179 fixtures, reweights the six prior model-failing criteria from 3 to 4, and raises the functional budget to 11000s with a 13600s RewardKit wrapper; the oracle reference satisfies every new criterion and stays at 1.0 while the measured rollout drops to about 0.61; keeps the 0.6/0.4 policy, the functional floor at 0.5, and all v2.9.x fixes; v2.10.1 QC fix 2026-09-09: loss_date_coverage_window and intake_draft_amendment expected $3,900 payable exposure for a $4,000 loss but the seeded $1,000 deductible makes the correct figure $3,000 (both criteria fixed); payment_idempotency_contract no longer requires typing the literal key DL-IDEM-260911 and instead adapts to whichever party supplies the repeat-safe key; reserve_supersession accepts any visible replaced/removed/superseded presentation of the older reserve rather than requiring the literal SUPERSEDED status and a dedicated supersede timeline entry; finance_release_settles accepts a plain refusal of a repeated release as long as no second write occurs; payment_zero_or_negative_refused no longer names the reference app's amountCents payload field; behaviour.md now states explicitly that evidence adds carry the claim's current version so the stale-copy rule has exactly one reading; durable_restart_state gains a leg proving a signed-in session survives the process restart (a requirement stated in instruction.md and integration.md that no criterion previously graded); tests/reward.toml now mirrors the per-dimension participation weights (render 1.0 / constraints 1.0 / functional 0.6 / polish 0.4) so it agrees with the judge.toml tables while tests/test.sh keeps owning the gate-and-mix policy; v2.10.2 oracle UI fix 2026-09-10: the v2.10.1 oracle run scored 0.8883 — payable_exposure_cap_and_floor failed because the claim detail showed the deductible but not the policy limit, and interaction_feedback plus dense_information_usability each lost polish; the reference UI now shows the policy limit beside the deductible, always renders the claim-level ledger section with an explicit empty state, gives visible sign-out and refresh feedback, and surfaces the restricted note directly under the summary; the remaining functional misses in that run (authentication_and_session_boundary, durable_cookie_session, restricted_detail_authorization) were judge-execution gaps — the judge skipped its own replay, fresh-page, and direct-page legs — and the reference behavior behind them is unchanged; v2.10.3 coverage fix 2026-09-10: four brief rules were ungraded — the organisation-wide ledger closed to the wrong roles, finance releasing only properly approved payments, settlement requests requiring an approved reserve, and intake seeing and creating only their own records — so the functional dimension adds four binary criteria of weight 3 each that the oracle reference satisfies: ledger_view_role_boundary, release_requires_supervisor_approval (against the seeded un-approved payment on NS-2606-N-133), payment_requires_approved_reserve (against the seeded pending-reserve claim NS-2611-N-180), and intake_record_scope (second intake intake.maya@docketlight.test with seeded NS-2611-N-181/182); tests/test.sh also verifies APP_MANIFEST.md states the start command and the Dockerfile declares a FROM base image instead of only checking the two files exist; v2.10.4 brief-alignment fix 2026-09-10: payable_exposure_cap_and_floor no longer requires the policy limit to be displayed — ui.md enumerates the detail fields as coverage dates and deductible, not the limit, so the criterion now verifies the $120,000 loss, the $1,000 deductible, and the capped $99,000 payable exposure without demanding the unasked limit field (a desk that renders exactly ui.md's field list now passes); instruction.md now states that every sample account signs in with the shared documented password password123 instead of leaving the judge to infer the seed's account_password field; v2.10.5 judge-order fix 2026-09-10: the v2.10.4 oracle run scored 0.8845 because five criteria listed their negative legs before their positive controls while the judge prompt requires a positive control before every negative claim, so the judge performed the positives first and then failed each criterion for the resulting sequence violation; unassigned_adjuster_write_refusal, payment_zero_or_negative_refused (negatives moved to NS-2611-N-174 after the valid NS-2611-N-172 payment), ready_requires_photo_evidence (positive moved to the new seeded NS-2611-N-183 with one PHOTO record), evidence_type_whitelist, and loss_date_coverage_window are now written positive-first, and release_requires_supervisor_approval plus payment_requires_approved_reserve gained explicit positive controls; the reference UI also shows a two-phase reload feedback and a wider detail rail; v2.11.0 model-breaking rework 2026-09-10: a gpt-5.4-mini rollout on v2.10.4 scored 0.8489 (functional 0.7899, 25 of 119 functional weight failed) and its passing criteria were mostly surface reads, so this pass raises enforcement share from 0.882 to 0.897 across 46 criteria and total weight 126 by deepening existing chains rather than adding surface checks: supervisor_assignment_history (weight 1 -> 3) now proves a NORTH supervisor can neither assign the SOUTH claim NS-2612-S-190 nor hand NS-2602-N-031 to the SOUTH adjuster, with the positive NORTH assignment first and the unchanged re-reads last; reserve_over_limit_unchanged adds a replay carrying inflated client-supplied payable/loss/limit fields that must still be refused; reserve_supersession (3 -> 4) now runs the full chain through supervisor approval, where the approval must bind the newest $12,000 request rather than the superseded $8,000 one, and then refuses Ava's out-of-date $8,000 replay; release_requires_supervisor_approval adds a supervisor-role forged release that must be refused; evidence_type_whitelist now proves PHOTO and ESTIMATE both write on the same claim before the NOTE refusal, so the forged probe can no longer drift to another claim (the v2.10.4 judge drifted and graded a 404 instead of the whitelist); and the new weight-4 criterion client_supplied_authority_ignored (seed fixtures NS-2612-N-191 holding Ava's pending $8,000 reserve and NS-2612-N-192 holding the supervisor-approvable $9,000 control) forces an adjuster's replay of the supervisor's recorded approval, carrying client-supplied actor/approver/role fields, to be refused with the reserve still pending; the seed gains the SOUTH adjuster adjuster.sam@docketlight.test and every payable figure is recomputed from the shipped policies (NS-2612-S-190 $5,500, NS-2612-N-191/192 $14,000); the brief drops its checklist-shaped rule enumeration and its boundary gifts (the exactly-equal reserve reassurance and the zero/negative payment rule) for desk-voice anchors that keep every graded invariant derivable; and tests/reward.toml now declares the documented render=0.0/constraints=0.0/functional=0.6/polish=0.4 policy so the builder validator and QC auditor no longer report a reward-policy failure; no Oracle or model run was executed for this version; v2.11.1 oracle-gap fix 2026-09-10: the v2.11.0 Oracle run scored 0.9857 (render 1.0, constraints 1.0, polish 1.0, functional 0.9762) with exactly one criterion failing - supervisor_assignment_history (weight 3) - and the judge's own reasoning shows the reference behaved correctly (the positive NORTH assignment landed and both forged writes were refused) while the required closing re-read of the SOUTH claim as Finn was skipped; the cause was criterion structure rather than reference behaviour, because the old text interleaved three roles (Noah, Finn for a before-snapshot, Noah for both forged replays, Finn and then Noah for two separate closing re-reads) and put a fresh sign-in at the very end for a record the judge had already reasoned was untouched, which also conflicted with the prompt's one-final-authoritative-re-read discipline; the criterion is now a two-session chain - Noah performs the positive assignment, both forged refusals and the NS-2602-N-031 closing re-read, then Finn opens NS-2612-S-190 once as the single observation of the SOUTH record after the refused write, where the seeded submitted-and-unassigned state is the anchor so no before-snapshot is needed; the last leg is labelled required evidence so it cannot be treated as a redundant repeat of the refusal, role switches drop from five to two, and nothing else in the brief, seed, reference, reward policy, criteria set, weights (46 criteria, total weight 126, enforcement share 0.897) or timeout hierarchy changed; v2.11.2 oracle-execution fix 2026-09-10: the v2.11.1 Oracle run scored 0.8095 (render 1.0, constraints 1.0, polish 1.0, functional 0.6825) with 15 of 46 criteria failing, and every failure was a judge-execution gap rather than reference behaviour - the judge skipped steps the rubric requires (six explicit refresh confirmations, five UI negative attempts, two closing re-reads and one forged amendment refusal) while its own reasoning shows the underlying writes, refusals and values were correct; the fix removes only the ritual legs that duplicate dedicated coverage (session durability remains graded by server_backed_reload_durability and durable_restart_state, cross-claim evidence isolation by the scope criteria), restates the remaining negative legs as server-side forged-refusal evidence and replaces the ambiguous client-only-block wording with an explicit statement that a hidden, missing or client-side-blocked control does not satisfy the leg, drops two closing role switches (supervisor_payment_approval and intake_draft_amendment now re-read in the session that performed the refusal), makes payable_exposure_cap_and_floor require and quote every named figure, and adds prompt rules that a named refresh or re-read and the UI-plus-forged legs of a criterion are required evidence and that a client-blocked control must not stop a criterion; the criteria set (46 criteria, total weight 126, enforcement share 0.897), ids, weights, seed, reference, brief, reward policy and timeout hierarchy are unchanged; v1.0.0 BazaarBridge-parity packaging 2026-09-11: the task version is set to 1.0.0 and every comment line is removed from the shipped files; the judge runner and model are now declared only in [verifier.env] with direct OpenAI wiring and no third-party model provider anywhere, and tests/Dockerfile bakes model_reasoning_effort max together with approval_policy never and sandbox_mode danger-full-access; the functional floor is removed from the reward gate, which now pays 0.6 * functional + 0.2 * polish + 0.2 * visual once render and constraints pass; the new visual dimension adds six likert craft criteria (typography, colour and contrast, spacing and layout, hierarchy and scanability, overall craft, responsive consistency) worth 0.2 of the reward with its own 900s batched Playwright judge; the timeout nesting is re-cut to 14300s of dimension budget below a 14600s RewardKit wrapper below a 14800s verifier with a 6200s agent budget inside the six-hour cap; the criteria set (46 functional criteria with their ids, weights and text), seed data, reference behaviour, brief and coverage mappings are unchanged; v1.0.0 breaker rework 2026-09-11 (version deliberately held at 1.0.0 by user instruction): the attached gpt-5.4-mini rollout on this version scored 0.7339 (render 1.0, constraints 1.0, functional 0.619, polish 0.8125, visual 1.0, graded=1, no_op=0, no judge/provider fault) and the diagnostic found two leaks that let a displayed-only build bank reward — behaviour.md and security.md enumerated the rubric as rules (the reserve cap, at-most-one payment, the stale-version rule with its busy-claim hedge, the per-book settlement key, PHOTO-before-review, the coverage-window refusal, draft amendment, reopen-clears-assignment, reserve supersession and the signed-out/denied refusal semantics), and 16 of the 46 functional criteria graded rendered evidence or one positive action with no server-side probe (weight 26 of 126). Both rule-heavy notes were rewritten into symptom-first desk prose that keeps every graded invariant derivable from the brief plus the seed, and the 16 cheap criteria were deepened in place — no criterion added or removed, no weight changed — so every functional criterion now pairs its positive control with a forged in-page replay of the app's own recorded request, grades isolation and money on the response body rather than rendered markup, and requires no-write plus unchanged re-read plus no new history entry for a refusal; the probe-based enforcement share rises from 0.794 (100 of 126 weight) to 1.000 (126 of 126) while the weight>=3 proxy stays 0.897, and the functional prompt now states that a replay may carry forged client-supplied fields and may replay reads as well as writes. The five-dimension profile, the 0.6*functional + 0.2*polish + 0.2*visual policy, all 46 criterion ids and weights, the seed, the reference behaviour, coverage mappings and the timeout hierarchy (800+800+11000+800+900=14300 < 14600 < 14800; build 600 + agent 6200 + verifier 14800 = 21600) are unchanged; no Oracle or model run was executed for this rework."
arena_slice = "full-stack-node-express-sqlite-insurance-claims"
