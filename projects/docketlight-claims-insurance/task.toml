difficulty_explanation = "Requires six authenticated role surfaces, region- and assignment-scoped reads and writes, durable server-owned sessions whose identity is never taken from the request body, an eight-state claims workflow with exact-money rules, supersession, maker-checker separation, at-most-once settlement and audit history, an account-administration surface, responsive accessible UI, and browser-verified server enforcement proved by forged in-page replays."
solution_explanation = "The reference implements a cookie-session claims desk seeded from the canonical sample data file with role-scoped access and server-persisted claims and audit state."

