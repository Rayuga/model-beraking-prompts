# Prompt version: pellmoor-job-pipeline-render-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[criterion]]
id = "authenticated_render"
name = "authenticated_render"
type = "binary"
weight = 2.0
description = """
Open the app, sign in as `hiring@pellmoor.test`, and confirm a substantive, usable
pipeline renders with the seeded vacancies and candidates populated, without a
fatal browser error or broken page.
"""

[[criterion]]
id = "vacancy_candidate_and_funnel_render"
name = "vacancy_candidate_and_funnel_render"
type = "binary"
weight = 1.0
description = """
Confirm three distinct destinations render and each shows its own content: a
vacancy view with candidates arranged by stage, a candidate view with their panel,
scores and notes, and a funnel chart. Several labels pointing at one unchanged
screen do not pass.
"""
