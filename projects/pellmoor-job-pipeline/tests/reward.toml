# Reward policy:
#   if render == 0 or constraints == 0 -> reward = 0
#   else reward = 0.6 * functional + 0.4 * polish
# Render and constraints are gates rather than scoring inputs, so they carry
# zero weight here; test.sh applies the gate to the RewardKit dimension scores.
[[reward]]
name = "reward"
aggregation = "weighted_mean"
weights = { render = 0.0, constraints = 0.0, functional = 0.6, polish = 0.4 }
