# Prompt version: pellmoor-job-pipeline-polish-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 600
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 3.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[criterion]]
id = "theme_or_visual_treatment"
name = "theme_or_visual_treatment"
type = "binary"
weight = 1.0
description = """
Confirm the application carries a deliberate visual treatment rather than default
browser styling: a chosen palette applied consistently, considered spacing, and a
type hierarchy in which the vacancy titles, the stage labels, the candidate names and the chart's own labels are clearly distinguished. If the product
offers a light/dark control, use it and confirm it produces a clear rendered
change while preserving legibility and the current screen. Unstyled controls on a
white page fails.
"""

[[criterion]]
id = "responsive_layout"
name = "responsive_layout"
type = "binary"
weight = 1.0
description = """
At roughly a 390 by 844 mobile viewport, confirm the main content fits without
horizontal page overflow and that the vacancy view, a candidate view and the funnel remain reachable and usable.
"""

[[criterion]]
id = "accessible_controls"
name = "accessible_controls"
type = "binary"
weight = 1.0
description = """
On the desktop experience, confirm a navigation landmark where the product has
navigation, a main landmark, meaningful headings, and accessible names or
associated labels for the visible buttons, inputs and selects actually used to
operate the pipeline — signing in, opening a vacancy or candidate, moving a stage, scoring and noting.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Confirm interactive controls have clear hover or focus feedback. Confirm that
a stage move refused because it skips a stage or because the role may not make it is communicated with a visible reason in words rather than by colouring
a control red or failing silently.
"""

[[criterion]]
id = "empty_and_transitional_states"
name = "empty_and_transitional_states"
type = "binary"
weight = 1.0
description = """
Open the funnel for a vacancy nobody has applied to, and a candidate with no panel
and no scores.
 Confirm the state reads as deliberate rather than as a failure or a blank
screen, and that opening and closing any dialog, drawer or panel the product
provides leaves the surrounding screen usable rather than permanently obscured.
"""
