difficulty_explanation = "The task couples a strict hiring stage machine with panel and scoring gates, role enforcement, per-vacancy funnel derivation, append-only activity, bearer sessions, optimistic revisions and replay-safe mutations. A valid action changes several visible and durable views while rejected actions must leave all of them unchanged."



solution_explanation = """
The reference implementation is one Express process serving the esbuild-bundled
browser side from public/ and a JSON API on port 3000, with better-sqlite3 at
pellmoor.db under /app.

backend/rules.js holds the stage machine and the gates as pure functions over the
stored pipeline: whether a transition is admissible, whether an offer may go out,
and what the funnel is for a role. backend/server.js applies them before any
write and recomputes the funnel on every read, so a client that posts a stage, a
funnel count or somebody else's identity is ignored rather than believed.

src/app.ts draws the funnel with d3 against real scales and renders the stage
columns from the same payload, so the chart and the columns cannot disagree --
they are two views of one response rather than two independent queries.
"""

verification_explanation = "Two lightweight Render checks and two lightweight self-contained Constraints checks gate a working local application after a real server-backed authentication preflight. Functional browser criteria exercise the seeded pipeline, legal and rejected transitions, offer gates, role isolation, derived funnels, durable activity, stale revisions and idempotent retries. Twelve narrow Polish criteria cover concrete responsive and accessible interaction quality."

