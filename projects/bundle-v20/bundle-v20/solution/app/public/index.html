<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GearVault</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #78716c;
      --primary: #b45309;
      --primary-dark: #92400e;
      --surface: #fff;
      --background: #f5f0e8;
      --border: #e7e0d4;
      --success: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--background);
      line-height: 1.55;
    }
    header {
      background: #1c1917;
      color: white;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 12px #1c191733;
    }
    .container { width: min(1160px, calc(100% - 32px)); margin: 0 auto; }
    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 750;
      letter-spacing: -.02em;
    }
    .brand img { display: block; width: 40px; height: 40px; }
    nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    nav a { color: white; text-decoration: none; padding: 8px 10px; }
    nav label { font-size: .82rem; color: #e7e5e4; }
    nav select {
      max-width: 280px;
      padding: 9px 12px;
      border: 1px solid #ffffff55;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    #current-user { font-size: .88rem; color: #e7e5e4; }
    .page { padding: 48px 0 80px; }
    h2 {
      margin: 8px 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -.035em;
    }
    h3 { font-size: 1.35rem; margin: 24px 0 16px; }
    h4 { font-size: 1.1rem; margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .eyebrow {
      color: var(--primary);
      font-size: .82rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .1em;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0 36px; }
    .btn {
      display: inline-block;
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary {
      background: white;
      color: var(--ink);
      border: 1px solid var(--border);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 6px 24px #1c19170b;
    }
    .card p { margin: 7px 0; }
    .profile { max-width: 760px; margin-top: 20px; }
    .profile hr { margin: 28px 0; border: 0; border-top: 1px solid var(--border); }
    .accent { color: var(--primary); font-weight: 750; }
    .status {
      display: block;
      width: fit-content;
      margin-top: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--success);
      background: #dcfce7;
      font-size: .82rem;
      font-weight: 750;
      text-transform: capitalize;
    }
    .empty {
      padding: 28px;
      border: 1px dashed #a8a29e;
      border-radius: 12px;
      background: #ffffff88;
      color: var(--muted);
    }
    .link-button {
      border: 0;
      background: transparent;
      color: var(--primary);
      padding: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    label { display: block; font-weight: 700; margin: 16px 0 6px; }
    input, textarea, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 88px; resize: vertical; }
    .error { color: #b42318; }
    .success-card { text-align: center; max-width: 620px; margin: 40px auto; }
    footer { padding: 28px 0; color: var(--muted); border-top: 1px solid var(--border); }
    #toast-root {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: min(360px, calc(100vw - 40px));
      pointer-events: none;
    }
    .toast {
      padding: 12px 16px;
      border-radius: 10px;
      background: #1c1917;
      color: #fff;
      font-size: .92rem;
      font-weight: 600;
      box-shadow: 0 8px 28px #1c191733;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .toast-visible { opacity: 1; transform: translateY(0); }
    .toast-success { background: var(--success); }
    .toast-error { background: #b42318; }
    .toast-info { background: #1c1917; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .tabs button {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      padding: 8px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-active {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
      color: white !important;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px 18px;
      margin: 24px 0 28px;
      padding: 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .filters label { margin: 0 0 6px; font-size: .88rem; }
    .filters select, .filters input { margin: 0; }
    .quote-panel {
      margin: 18px 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fffaf3;
    }
    .quote-panel h4 { margin: 0 0 12px; font-size: 1rem; }
    .quote-lines {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .quote-lines li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 0;
      border-bottom: 1px dashed #e7e0d4;
    }
    .quote-lines .quote-total {
      border-bottom: 0;
      margin-top: 6px;
      padding-top: 10px;
      font-size: 1.05rem;
    }
    .badge-member {
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .audit-table-wrap { overflow-x: auto; }
    .audit-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      font-size: .88rem;
    }
    .audit-table th, .audit-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .audit-table th { background: #faf7f2; font-weight: 750; }
    @media (max-width: 760px) {
      .header-inner { align-items: flex-start; flex-direction: column; padding: 16px 0; }
      nav { justify-content: flex-start; }
      #current-user { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">
        <img src="/shop/riverside_mark.svg" width="40" height="40" alt="Riverside river mark">
        <span>GearVault</span>
      </div>
      <nav id="nav" aria-label="Primary navigation">Loading demo session…</nav>
    </div>
  </header>
  <main id="main-content"></main>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <footer>
    <div class="container">GearVault demo · Shop Postgres ledger · Stripe test payments</div>
  </footer>
  <script src="/js/app.js"></script>
</body>
</html>
