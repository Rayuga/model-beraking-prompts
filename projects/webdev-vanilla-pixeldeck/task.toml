schema_version = "1.4"

[task]
name = "turing/webdev-vanilla-pixeldeck"
version = "1.0.0"
description = "Raw HTML/CSS/JS Canvas pixel editor - compact interaction correctness under aesthetic pressure"
keywords = ["webdev", "codearena", "rewardkit", "canvas", "vanilla-js", "pixel-art", "drawing-tool"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["frontend", "arena", "rl-training", "generative-art-and-animation"]
# Adapted from real WebDev Arena prompt aa9a73ebdb77d2e8388f21aaabcc6a93:
# "Online version of classic Microsoft Paint". Arena outcome: tie (bothbad).
taxonomy_category = "Generative Art & Animation"
taxonomy_app = "Paint / drawing toy"
arena_question_id = "aa9a73ebdb77d2e8388f21aaabcc6a93"
arena_outcome = "tie (bothbad)"
arena_slice = "canvas-vanilla-html-js"

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[verifier.environment]
docker_image = "codearena/webdev-verifier:1.0.0"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
