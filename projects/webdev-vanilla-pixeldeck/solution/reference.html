<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelDeck</title>
<style>
:root{--ink:#18212f;--muted:#6c7687;--paper:#f7f8fb;--line:#dce1e9;--blue:#3b6eea;--hot:#ec5c6c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;background:linear-gradient(145deg,#edf3ff,#fff2f0 55%,#f6f7fb)}
button,input,select{font:inherit}.top{height:68px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ccd4e1;background:#ffffffd9;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:36px;height:36px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--hot);background:conic-gradient(#ffca58 25%,#ec5c6c 0 50%,#5688f5 0 75%,#53c69c 0)}
h1{margin:0;font-size:20px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:10px}.actions{display:flex;gap:8px}
button,.select{border:1px solid #c8d0dc;border-radius:7px;background:#fff;color:var(--ink);min-height:36px;padding:8px 12px;box-shadow:0 2px 0 #d6dce6;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s,background .12s}
button:hover{border-color:#8092ad;transform:translateY(-1px);box-shadow:0 4px 0 #d6dce6}button:active{transform:translateY(1px);box-shadow:none}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b8cdfd;outline-offset:2px}
.app{display:grid;grid-template-columns:150px minmax(300px,1fr) 210px;gap:18px;max-width:1180px;margin:auto;padding:22px}.panel{background:#fffffff0;border:1px solid var(--line);box-shadow:0 12px 32px #34415b19;padding:14px}.tools{display:grid;gap:9px;align-content:start}.tools h2,.inspector h2{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.12em;margin:2px 0 6px}.tool{text-align:left;display:flex;align-items:center;gap:9px}.key{display:grid;place-items:center;width:24px;height:24px;border:1px solid #bcc5d2;background:#f3f5f8;font-size:11px}.tool.active{color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 #95aff2}.tool.active .key{color:var(--ink);background:#fff}
.stage{min-width:0;display:grid;place-items:center;align-content:center;gap:12px;padding:18px;background:linear-gradient(45deg,#eef1f5 25%,transparent 25%) 0 0/18px 18px,linear-gradient(45deg,transparent 75%,#eef1f5 75%) 0 0/18px 18px,#fafbfc;border:1px solid #d4dae4;box-shadow:inset 0 0 0 7px #fff,0 12px 32px #34415b19;overflow:auto}
.canvas-wrap{max-width:100%;filter:drop-shadow(8px 10px 0 #bdc7d5)}canvas{display:block;max-width:min(66vw,620px);max-height:68vh;width:auto;height:auto;background:#fff;image-rendering:pixelated;cursor:crosshair;touch-action:none;border:2px solid var(--ink)}.status{background:var(--ink);color:#fff;padding:7px 11px;font-size:11px;min-width:220px;text-align:center}.status b{color:#ffce62}
.inspector{display:grid;gap:15px;align-content:start}.field{display:grid;gap:7px}.field label{font-size:11px;color:var(--muted)}.color-row{display:flex;gap:9px;align-items:center}input[type=color]{width:48px;height:42px;padding:3px;border:1px solid #bfc8d5;background:#fff}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.swatch{padding:0;min-height:30px;border:2px solid #fff;outline:1px solid #c8d0da;box-shadow:none}.swatch:hover{box-shadow:none;transform:scale(1.08)}select{width:100%;height:38px;border:1px solid #c8d0dc;border-radius:7px;background:#fff;padding:0 9px}.grid-on{background:#eef3ff;border-color:#799cf1}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.panel,.stage{animation:enter .35s ease-out both}.stage{animation-delay:.06s}.inspector{animation-delay:.12s}
@media(max-width:780px){.top{height:auto;padding:14px;gap:12px;align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.app{grid-template-columns:1fr;padding:12px}.tools{grid-template-columns:repeat(4,1fr)}.tools h2{grid-column:1/-1}.tool{justify-content:center}.tool span:last-child{display:none}.stage{min-height:360px}canvas{max-width:88vw;max-height:none}.inspector{grid-template-columns:1fr 1fr}.inspector h2{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"></span><div><h1>PixelDeck</h1><small>SMALL CANVAS / BIG IDEAS</small></div></div><div class="actions"><button id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button><button id="clear">Clear</button><button id="grid" class="grid-on" aria-pressed="true">Grid</button><button id="export">Download PNG</button></div></header>
<main class="app">
<aside class="panel tools" aria-label="Drawing tools"><h2>Tools</h2><button class="tool active" data-tool="pencil"><span class="key">P</span><span>Pencil</span></button><button class="tool" data-tool="eraser"><span class="key">E</span><span>Eraser</span></button><button class="tool" data-tool="fill"><span class="key">F</span><span>Flood Fill</span></button><button class="tool" data-tool="pick"><span class="key">I</span><span>Eyedropper</span></button></aside>
<section class="stage" aria-label="Pixel canvas workspace"><div class="canvas-wrap"><canvas id="art" width="384" height="384" aria-label="16 by 16 pixel drawing canvas"></canvas></div><div class="status"><b id="toolName">PENCIL</b> / <span id="coords">X -- / Y --</span></div></section>
<aside class="panel inspector"><h2>Color and canvas</h2><div class="field"><label for="color">Active color</label><div class="color-row"><input id="color" type="color" value="#3b6eea"><output id="hex">#3B6EEA</output></div></div><div class="swatches" aria-label="Color palette"></div><div class="field"><label for="size">Canvas size</label><select id="size"><option value="8">8 x 8</option><option value="16" selected>16 x 16</option><option value="24">24 x 24</option><option value="32">32 x 32</option></select></div></aside>
</main>
<script>
const $=s=>document.querySelector(s),canvas=$('#art'),ctx=canvas.getContext('2d'),color=$('#color');
let n=16,unit=24,pixels=Array(n*n).fill(null),tool='pencil',down=false,last=-1,grid=true,history=[];
const colors=['#18212f','#ffffff','#ec5c6c','#ff9f43','#ffca58','#53c69c','#27ae60','#3b6eea','#7856d8','#d95aa7'];
const sw=$('.swatches');colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.setAttribute('aria-label','Use color '+c);b.onclick=()=>setColor(c);sw.append(b)});
function setColor(c){color.value=c;$('#hex').textContent=c.toUpperCase()}
function snapshot(){history.push({n,pixels:[...pixels]});if(history.length>40)history.shift();$('#undo').disabled=false}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);pixels.forEach((c,i)=>{if(c){ctx.fillStyle=c;ctx.fillRect(i%n*unit,Math.floor(i/n)*unit,unit,unit)}});if(grid){ctx.strokeStyle='#d8dde6';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=n;i++){ctx.moveTo(i*unit+.5,0);ctx.lineTo(i*unit+.5,canvas.height);ctx.moveTo(0,i*unit+.5);ctx.lineTo(canvas.width,i*unit+.5)}ctx.stroke()}canvas.setAttribute('aria-label',n+' by '+n+' pixel drawing canvas')}
function locate(e){let r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*n/r.width),y=Math.floor((e.clientY-r.top)*n/r.height);return x<0||y<0||x>=n||y>=n?-1:y*n+x}
function paint(i){if(i<0||i===last)return;last=i;if(tool==='pencil')pixels[i]=color.value;if(tool==='eraser')pixels[i]=null;render()}
function flood(i){let from=pixels[i],to=color.value;if(from===to)return;let q=[i],seen=new Set(q);while(q.length){let p=q.pop();if(pixels[p]!==from)continue;pixels[p]=to;let x=p%n,y=Math.floor(p/n);[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([a,b])=>{let k=b*n+a;if(a>=0&&b>=0&&a<n&&b<n&&!seen.has(k)){seen.add(k);q.push(k)}})}render()}
canvas.addEventListener('pointerdown',e=>{let i=locate(e);if(i<0)return;canvas.setPointerCapture(e.pointerId);if(tool==='pick'){if(pixels[i])setColor(pixels[i]);return}snapshot();if(tool==='fill')flood(i);else{down=true;last=-1;paint(i)}});
canvas.addEventListener('pointermove',e=>{let i=locate(e);if(i>=0)$('#coords').textContent='X '+(i%n+1)+' / Y '+(Math.floor(i/n)+1);if(down)paint(i)});addEventListener('pointerup',()=>{down=false;last=-1});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));$('#toolName').textContent=b.textContent.trim().toUpperCase()});
$('#undo').onclick=()=>{let s=history.pop();if(!s)return;n=s.n;unit=24;pixels=s.pixels;canvas.width=canvas.height=n*unit;$('#size').value=n;$('#undo').disabled=!history.length;render()};
$('#clear').onclick=()=>{if(pixels.some(Boolean)){snapshot();pixels.fill(null);render()}};
$('#grid').onclick=e=>{grid=!grid;e.currentTarget.classList.toggle('grid-on',grid);e.currentTarget.setAttribute('aria-pressed',grid);render()};
$('#size').onchange=e=>{snapshot();n=+e.target.value;unit=24;pixels=Array(n*n).fill(null);canvas.width=canvas.height=n*unit;render()};
$('#export').onclick=()=>{let out=document.createElement('canvas');out.width=out.height=n;let c=out.getContext('2d');pixels.forEach((v,i)=>{if(v){c.fillStyle=v;c.fillRect(i%n,Math.floor(i/n),1,1)}});let a=document.createElement('a');a.download='pixeldeck-'+n+'x'+n+'.png';a.href=out.toDataURL('image/png');a.click()};
color.oninput=()=>setColor(color.value);addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('#undo').click();return}let m={p:'pencil',e:'eraser',f:'fill',i:'pick'}[e.key.toLowerCase()];if(m){e.preventDefault();document.querySelector('[data-tool="'+m+'"]').click()}});
render();
</script>
</body>
</html>
