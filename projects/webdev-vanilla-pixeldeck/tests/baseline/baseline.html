<!doctype html>
<!-- FROZEN BASELINE: competent but visually plain. Do not edit after release. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Paint</title>
<style>body{font-family:sans-serif;margin:24px;background:#eee;color:#222}main{display:flex;gap:18px;align-items:flex-start}aside{display:grid;gap:8px;width:130px}button,input,select{padding:7px}canvas{background:#fff;border:1px solid #444;max-width:70vw;image-rendering:pixelated;touch-action:none}@media(max-width:600px){main{display:block}aside{display:flex;width:auto;flex-wrap:wrap;margin-bottom:12px}}</style></head>
<body><h1>Pixel Paint</h1><main><aside><button data-t="pencil">Pencil</button><button data-t="eraser">Eraser</button><button data-t="fill">Fill</button><button data-t="pick">Eyedropper</button><input id="color" type="color" value="#ff0000"><select id="size"><option>8</option><option selected>16</option><option>24</option></select><button id="undo">Undo</button><button id="clear">Clear</button><button id="grid">Grid</button><button id="download">Download PNG</button></aside><canvas id="c" width="384" height="384"></canvas></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),co=document.querySelector('#color');let n=16,u=24,p=Array(256).fill(null),t='pencil',down=0,h=[];
function draw(){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);p.forEach((v,i)=>{if(v){x.fillStyle=v;x.fillRect(i%n*u,Math.floor(i/n)*u,u,u)}})}
function at(e){let r=c.getBoundingClientRect();return Math.floor((e.clientY-r.top)*n/r.height)*n+Math.floor((e.clientX-r.left)*n/r.width)}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>t=b.dataset.t);c.onpointerdown=e=>{let i=at(e);if(t==='pick'){if(p[i])co.value=p[i];return}h.push([...p]);if(t==='fill')p=p.map(v=>v===p[i]?co.value:v);else{down=1;p[i]=t==='eraser'?null:co.value}draw()};c.onpointermove=e=>{if(down){p[at(e)]=t==='eraser'?null:co.value;draw()}};onpointerup=()=>down=0;
undo.onclick=()=>{if(h.length)p=h.pop();draw()};clear.onclick=()=>{h.push([...p]);p.fill(null);draw()};grid.onclick=()=>{};size.onchange=e=>{n=+e.target.value;u=24;p=Array(n*n).fill(null);c.width=c.height=n*u;draw()};download.onclick=()=>{let a=document.createElement('a');a.download='pixel.png';a.href=c.toDataURL();a.click()};draw();
</script></body></html>
