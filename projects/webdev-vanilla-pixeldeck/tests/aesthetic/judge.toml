[judge]
judge = "anthropic/claude-opus-4-5"
files = ["/app/index.html"]
reference = "/tests/baseline/baseline.html"
reasoning_effort = "medium"
timeout = 420

prompt_template = """
You are judging a submitted web app against a FROZEN BASELINE implementation
of the same compact pixel-painting prompt. Both are single self-contained HTML
files.

The requested product is a polished raw HTML/CSS/JS pixel editor with pencil,
eraser, flood fill, eyedropper, palette, undo, clear, grid toggle, canvas-size
control, PNG download, and mouse/touch usability.

Judge as a Code Arena voter would: inspect and use the rendered application.
Reward visible usability and working behavior. Do not reward source comments or
architecture. Score the SUBMISSION relative to the BASELINE.

{criteria}
"""

[[criterion]]
description = "Functionality - do the named paint tools and file action form a genuinely usable pixel editor at least as complete as the baseline?"
type = "likert"
points = 5
weight = 3.0

[[criterion]]
description = "Usability - are tools, active color, canvas size, status, undo, clear, grid and download discoverable and comfortable on desktop and mobile?"
type = "likert"
points = 5
weight = 2.0

[[criterion]]
description = "Visual quality - does the app feel like a deliberate creative tool rather than default browser controls around a canvas?"
type = "likert"
points = 5
weight = 2.0

[[criterion]]
description = "Would a Code Arena voter pick this submission over the frozen baseline in a blind side-by-side?"
type = "binary"
weight = 3.0

[scoring]
aggregation = "weighted_mean"
