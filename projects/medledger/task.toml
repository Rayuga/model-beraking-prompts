schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "webdev/medledger-health"
version = "1.0.0"
description = "Build MedLedger, a health system's back-office platform spanning eight naturally cross-feeding domains — clinic (patients, encounters, orders), pharmacy (controlled dispensing, an append-only DEA-style ledger), lab (results, critical flags), imaging/radiology (studies, contrast media), medical transport (dispatch, DVIR, hours-of-service), central supply (SKUs, movements, cycle counts), billing/claims (charges, prior-auth, claims, statements), and credentialing/compliance (provider credentials, DocuSeal consent/attestation, panels, general ledger, audit) — where one party is patient/payer/consent-subject and one provider is ordering/rendering/panel-holder under different domain vocabulary; with SQLite persistence, a seed-identity switcher, real Stripe test-mode Checkout and a DocuSeal envelope twin with offline fallbacks, site-scoped authorization, a single close-of-shift trigger with multiple downstream effects, and penny-exact cross-domain reconciliation; graded by a RewardKit CUA browser judge with forged definitive-artifact probes."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["vibe-code", "webdev", "fullstack", "nodejs", "sqlite", "react", "healthcare", "cross-domain", "reconciliation", "role-based-access"]

[metadata]
category = "web-development"
difficulty = "hard"
difficulty_explanation = """
Difficulty lives in NON-OBVIOUS buried cross-domain cascades behind a scarce
narrative brief, not in CRUD volume and not in first-order enforcement (which a
competent health-billing build emits by default). Eight clinical/operational
domains are never enumerated — they must be found by reading the floor's war
stories. All 24 flat-weight-1 criteria are graded by a RewardKit CUA browser
judge that forges definitive-artifact reads of the app's OWN records (GET
/api/...) and checks each against an EXACT pinned answer (exact cents, exact
secondary record, cross-domain id consistency): 22 are BREAKERS keyed on a
SECONDARY derived record a satisficing build never creates because it requires a
bespoke, counter-intuitive, buried rule, and 2 are anchors (seed-roster loaded;
site-isolation rejects an unknown identity). Representative breakers: a critical
value that lands AFTER a fill was billed must REVERSE the posted charge so the
department nets to zero (not merely hold it) AND freeze the patient's OTHER open
imaging + transport; a DENIED claim rolls a patient balance NET of a buried 18%
payer contractual allowance (not the raw charge) plus a contra-revenue line;
every controlled fill MINTS a discrete DEA-form record, and a BELOW-$150 fill
mints the form but NO audit memo; a period close squares a whole-SKU on-hand
value identity (opening value − Σ COGS == stored on-hand × unit cost) with the
matching SUPPLY COGS lines wired; a past-due balance over $600 raises a
collections hold that FREEZES the party's NEW clinic order (a balance of exactly
$600 does not); a pulled copay nets pharmacy revenue to zero AND MINTS a refund
voucher; a lapsed credential FREEZES the panel AND retro-flags the doctor's open
claim; a cancelled run nets the fare to zero; a priority ride computes the
surcharged fare AND posts the $75 surcharge on its OWN GL line (not folded into
revenue); plus a degenerate zero-base contrast read, a multi-hop patient
statement, a two-book ledger-vs-shelf reconciliation, and a cycle-count variance,
each pinning an exact secondary value. Every computation input and every
reason-code word is stated; only the connection, the precedence and the
derivation are buried in anecdote. Each criterion is binary and conjunctive.
reward = passed / 24.
"""
task_id = "WEBDEV-MEDLEDGER-001"
capabilities = ["backend-api", "frontend-ui", "persistence", "authorization", "integrations"]

[agent]
timeout_sec = 17400.0
network_mode = "public"

[verifier]
timeout_sec = 17400.0
network_mode = "public"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[solution]
env = {}

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "public"

[environment.env]
PORT = "3000"
BASE_URL = "http://localhost:3000"
APP_PUBLIC_URL = "http://localhost:3000"
APP_PUBLIC_PORT = "3000"
EMAIL_DRY_RUN = "true"
# Real Stripe test-mode Checkout in the agent/graded environment (degrades to the
# offline twin on any Stripe error). Egress required to checkout.stripe.com,
# api.stripe.com and *.stripe.com; the app grades its OWN payments/gl_lines rows
# and the Checkout screen, never the provider. TEST KEYS ONLY, supplied at run time
# via .env (--env-file); interpolated here, never shipped as literals. Absent → the
# app boots on its deterministic offline twin (server reads process.env only).
STRIPE_SECRET_KEY = "${STRIPE_SECRET_KEY}"
STRIPE_PUBLISHABLE_KEY = "${STRIPE_PUBLISHABLE_KEY}"
STRIPE_WEBHOOK_SECRET = ""
STRIPE_USE_TEST_CLOCK = "1"
DOCUSEAL_DRY_RUN = "true"
DOCUSEAL_API_KEY = ""
DOCUSEAL_BASE_URL = ""
DOCUSEAL_TEMPLATE_ID = ""
CLINIC_CLOCK = "2026-08-17T10:00:00.000Z"
