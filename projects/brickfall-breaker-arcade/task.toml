schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/brickfall-breaker-arcade"
version = "1.0.0"
description = "Deterministic full-stack brick-breaker arcade game with authenticated profiles, mechanics checkpoints, revision-safe persistence, run history, and SQLite leaderboards"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "canvas", "brick-breaker", "authentication", "physics", "optimistic-concurrency", "idempotency", "rewardkit"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Real-time fixed-step physics, exact brick and power-up rules, and ten workbook walls must coexist with full run snapshots, account-wide token revocation, optimistic two-tab coordination, idempotent mutation receipts, and inspectable terminal history. Deterministic non-scoring checkpoints make those interacting invariants testable without weakening them. Five browser dimensions use Render and Constraints as prerequisites, followed by 60% Functional, 20% interaction Polish and 20% appearance-only Visual. Twenty-two Functional criteria retain deterministic mechanics, persistence, revision safety and receipt replay checks; the presentation rubric follows the shared six-axis visual standard, including the required mobile view."
category = "Software"
tags = ["full-stack", "canvas-game", "fixed-timestep", "authentication", "persistence", "concurrency", "idempotency", "accessibility"]
provenance = "Adapted from the repository's original Brick Breaker request and the real user task-intake conversation for this workspace; expanded into the standardized full-stack contract on 2026-09-02"
arena_slice = "brickfall-breaker-arcade-canvas-vanilla-html-js"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
