schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "turing/brickfall-breaker-arcade"
version = "2.0.4"
description = "Deterministic full-stack brick-breaker arcade game with authenticated profiles, mechanics checkpoints, revision-safe persistence, run history, and SQLite leaderboards"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "canvas", "brick-breaker", "authentication", "physics", "optimistic-concurrency", "idempotency", "rewardkit"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Arcade & Platform Games"
tags = ["full-stack", "canvas-game", "fixed-timestep", "authentication", "persistence", "concurrency", "idempotency", "accessibility"]
provenance = "Adapted from the repository's original Brick Breaker request and the real user task-intake conversation for this workspace; expanded into the standardized full-stack contract on 2026-09-02"
arena_slice = "brickfall-breaker-arcade-canvas-vanilla-html-js"
expert_time_estimate_hours = 16
difficulty_explanation = "Real-time fixed-step physics, exact brick and power-up rules, and ten workbook walls must coexist with full run snapshots, account-wide token revocation, optimistic two-tab coordination, idempotent mutation receipts, and inspectable terminal history. Deterministic non-scoring checkpoints make those interacting invariants testable without weakening them."
solution_explanation = "The reference combines a fixed-step canvas engine and semantic telemetry with SQLite transactions, monotonic account revisions, persisted success and 4xx receipts, serialized browser saves, authoritative stale-state reconciliation, account-wide bearer revocation, and exact terminal snapshots."
verification_explanation = "Render and Constraints remain two simple checks each, with a shared zero-reward authentication/server-backing prerequisite. After those gates, 60% Functional and 40% Polish is unchanged. Twenty-two independent Functional criteria cover seeded checkpoints, exact real-engine mechanics, snapshots, revisions, revocation and receipt replay. Splitting terminal/drill bundles preserves their total weights and every assertion. Seven Polish criteria cover arcade usability: five anchored five-point craft ratings and two objective binary checks. Likert 1 normalizes to zero. Agent budget is two hours; judge budgets total 9860 seconds inside a 11400-second wrapper and 12600-second verifier, with explicit 1800-second build budget, totaling six hours across build, agent and verifier. The human expert estimate is not the automated agent budget. These are configured ceilings, not measured completion guarantees."

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 4096

[verifier]
timeout_sec = 12600.0
environment_mode = "separate"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "high"

[verifier.environment]
network_mode = "public"
