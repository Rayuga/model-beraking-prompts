schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "turing/brickfall-breaker-arcade"
version = "1.0.0"
description = "Deterministic full-stack brick-breaker arcade game with authenticated profiles, exact power-up lifecycles, durable progression, and SQLite leaderboards"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "canvas", "brick-breaker", "authentication", "physics", "rewardkit"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Arcade & Platform Games"
tags = ["full-stack", "canvas-game", "fixed-timestep", "authentication", "persistence", "accessibility"]
provenance = "Adapted from the repository's original Brick Breaker request and the real user task-intake conversation for this workspace; expanded into the standardized full-stack contract on 2026-09-02"
arena_slice = "brickfall-breaker-arcade-canvas-vanilla-html-js"
expert_time_estimate_hours = 12
difficulty_explanation = "A familiar arcade surface hides interacting real-time invariants: fixed-step collision resolution, paddle steering, speed bounds, four mutually exclusive timed power-ups, multiball life semantics, exact scoring thresholds, ten seeded levels, and authenticated server-backed resume and leaderboard state."
solution_explanation = "The reference uses requestAnimationFrame for presentation and a fixed simulation step for physics, consumes workbook-defined levels, mirrors critical state in an accessible DOM HUD, and saves authenticated run snapshots, progress, bearer sessions, and leaderboard entries in SQLite."
verification_explanation = "Four pinned Codex browser dimensions use non-mutating Render and Constraints gates, deterministic seeded profiles and levels for Functional scenarios, and responsive canvas/HUD inspection for Polish."
persona = "JavaScript arcade-game and full-stack systems developer"
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "high"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
