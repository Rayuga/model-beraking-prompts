# Prompt version: brickfall-render-v2.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
# Local application: http://localhost:3000
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "medium"
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "page_load_and_refresh"
name = "page_load_and_refresh"
type = "binary"
weight = 1.0
description = """
Open the same-origin page and require a substantive Brickfall sign-in screen
with a visible product heading, email and password fields, and a usable sign-in
control. Fully refresh once and require the same usable page to render again
without a blank screen or fatal error.
"""

[[criterion]]
id = "basic_sign_in_and_game_surface"
name = "basic_sign_in_and_game_surface"
type = "binary"
weight = 1.0
description = """
Enter `dev@brickfall.test` in the visible email field and `password123` in the
password field, then sign in. Require Dev's identity plus a substantive game
workspace containing the canvas, status, score, lives, level, combo, active
power-up, controls, level selection, mechanics lab, and global leaderboard.
Do not start, resume, clear, or otherwise play a run.
"""
