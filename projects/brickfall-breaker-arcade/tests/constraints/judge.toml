# Prompt version: brickfall-constraints-v1.0.1
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
# Local application: http://localhost:3000
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "medium"
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "server_backed_authenticated_workspace"
name = "server_backed_authenticated_workspace"
type = "binary"
weight = 1.0
description = """
From a signed-out page, sign in as `dev@brickfall.test` with `password123`.
Require successful same-origin application requests and a protected workspace
that visibly identifies Dev and contains the game canvas, HUD, controls, level
selection, and leaderboard. A static imitation with no successful application
request does not pass. Do not launch or alter a run.
"""

[[criterion]]
id = "self_contained_refresh_runtime"
name = "self_contained_refresh_runtime"
type = "binary"
weight = 1.0
description = """
While Dev's workspace is visible, fully reload and require the authenticated
workspace to render again and remain usable. Browser network evidence must
show the product works from the same origin without a required public-origin
script, stylesheet, font, image, API, or runtime package install. Do not require
a particular save, selected level, score, phase, or enabled control state.
"""
