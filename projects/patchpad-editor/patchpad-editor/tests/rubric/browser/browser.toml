[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
mode = "individual"
timeout = 8400
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

# feature = custom_editor
# sub_feature = forbidden_native_surfaces
[[criterion]]
id = "custom_editor_no_native_editing_surface"
name = "custom_editor_no_native_editing_surface"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=seed_bootstrap_and_custom_editor; sub_feature=exact_seed_forbidden_native_surfaces_and_controls; kind=graded; depends_on=preflight_manifest_restart. This criterion is all-or-nothing and is evaluated before criteria that save edits. Open the normal app without a login step and establish that the custom editor is usable. Through the visible UI and a same-origin GET of the document API, verify exactly one document titled "Northwind API Incident Report" exists at saved revision 1 and contains exactly 1,226 logical lines before any edit. Verify line 1 is exactly "Incident: Northwind API latency event", line 18 is exactly "TODO: Replace temporary dashboard link before publishing.", line 24 is exactly "Log line 0001: region=us-east service=checkout marker=ALPHA-0001 status=observed note=repeatable text for editor offset validation.", line 623 contains both "Log line 0600:" and "marker=ALPHA-0600", line 1223 contains both "Log line 1200:" and "marker=ALPHA-1200", line 1225 is exactly "Reviewer notes", and line 1226 is exactly "The editor must preserve this tail sentinel: OMEGA-END-ANCHOR.". Any missing, unpadded, duplicated, reordered, or extra generated line fails. Inspect the live editing surface and fail if it is a textarea, input, contenteditable element, or an editor supplied by Monaco, CodeMirror, ProseMirror, TipTap, Quill, Slate, Draft.js, or another editor widget. Search fields outside the editor are allowed. Verify discoverable controls by intent for Save, Undo, Redo, Find Next, Replace Current, Replace All, and revision history, plus visible saved/dirty and error/status regions. Click the visible custom editor with the real mouse, type the exact marker CUSTOM-SURFACE-PROOF with normal keyboard input, and verify that exact full marker appears once in the document. Do not dispatch synthetic events or invoke application handlers. Reload without saving, accept any unload dialog, and verify the marker is absent again.
"""

# feature = persistence
# sub_feature = no_op_save
[[criterion]]
id = "noop_save_revision_invariant"
name = "noop_save_revision_invariant"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=persistence; sub_feature=no_op_save; kind=graded; depends_on=none. This criterion is all-or-nothing. With the document visibly saved and unchanged, record its current revision, exact content, and exact revision-list count through same-origin GET requests. Attempt the visible Save command if enabled, then press Ctrl/Cmd+S three times without editing. Re-read all three values and require the revision number, byte-for-byte content, and revision-list count to remain exactly unchanged. The UI must remain saved rather than dirty and must disable Save or visibly report that there are no changes.
"""

# feature = persistence
# sub_feature = save_and_unsaved_reload
[[criterion]]
id = "edit_save_reload_and_dirty_discard"
name = "edit_save_reload_and_dirty_discard"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=persistence; sub_feature=save_unsaved_reload_and_fresh_client; kind=graded; depends_on=none. This criterion is all-or-nothing. Use only the visible editor and keyboard to append " BASIC-SAVE-CHECK" to logical line 1. Verify line 1 becomes exactly "Incident: Northwind API latency event BASIC-SAVE-CHECK", the UI becomes dirty, and one visible Save advances the revision by exactly one. Record the exact saved content and revision, then clear localStorage, sessionStorage, IndexedDB, cache storage, and cookies and open a fresh ordinary page. Require that fresh client to load the same byte-for-byte server content and revision with BASIC-SAVE-CHECK exactly once. Append " UNSAVED-SHOULD-DISAPPEAR" to line 1 without saving, verify dirty state, reload while accepting any unload confirmation, and require the unsaved suffix to be absent from both the visible line and a fresh document GET while BASIC-SAVE-CHECK remains exactly once.
"""

# feature = cursor_navigation
# sub_feature = exact_logical_coordinates
[[criterion]]
id = "keyboard_navigation_exact_coordinates"
name = "keyboard_navigation_exact_coordinates"
type = "binary"
weight = 1.0
description = """
Feature metadata: feature=cursor_navigation; sub_feature=exact_logical_coordinates; kind=graded; depends_on=preflight_manifest_restart. This criterion is all-or-nothing. Use the real mouse to place the caret at line 1 column 1, then use real key presses only. Four ArrowDown presses must report line 5 column 1. End must report line 5 column 9. ArrowDown must report line 6 column 9; Home must report line 6 column 1; ArrowLeft must cross the newline and report line 5 column 9; ArrowRight must return to line 6 column 1. Press End on line 6 and require line 6 column 59, then ArrowUp must clamp to line 5 column 9 and ArrowDown must restore the intended column at line 6 column 59. Finally use the real mouse to place the caret inside the final logical line, press End, and require line 1226 column 63. If any required key loses editor focus, selects a different line, or produces another coordinate, fail.
"""

# feature = cursor_navigation
# sub_feature = word_navigation_and_selection
[[criterion]]
id = "word_navigation_and_selection_shortcuts"
name = "word_navigation_and_selection_shortcuts"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=cursor_navigation; sub_feature=word_navigation_and_selection_shortcuts; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Focus the visible editor on logical line 1 and press Home, requiring line 1 column 1. Use the real platform Ctrl/Cmd+ArrowRight shortcut once and require line 1 column 11 at the start of Northwind. Hold the same platform modifier plus Shift and press ArrowRight once; require line 1 column 21 and copy the live selection with Ctrl/Cmd+C, requiring the clipboard to equal exactly "Northwind " including its trailing space. Use modifier+Shift+ArrowLeft once and require the selection to collapse back at line 1 column 11. Then use modifier+ArrowLeft once and require line 1 column 1. Do not dispatch keyboard events, set selection state, or call editor handlers from JavaScript. The reasoning must quote all four coordinates and the exact copied selection.
"""

# feature = deletion
# sub_feature = newline_boundary_join
[[criterion]]
id = "backspace_delete_exact_line_join"
name = "backspace_delete_exact_line_join"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=deletion; sub_feature=newline_boundary_join; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. At the document end create exactly three adjacent logical lines JOIN-LEFT, JOIN-RIGHT, and JOIN-TAIL through normal paste or keyboard input. Put the caret at the start of JOIN-RIGHT and press Backspace once; require the two lines to become exactly JOIN-LEFTJOIN-RIGHT followed by unchanged JOIN-TAIL, with the document line count reduced by one and no duplicated characters. Undo once and require all three original lines. Put the caret at the end of JOIN-LEFT and press Delete once; require exactly the same joined result and line count. Reload without saving and verify none of the JOIN markers persisted.
"""

# feature = editing
# sub_feature = tab_indentation
[[criterion]]
id = "tab_indentation_and_reversal"
name = "tab_indentation_and_reversal"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=editing; sub_feature=tab_and_shift_tab_indentation; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Use the real mouse and keyboard to focus seeded logical line 5, whose exact value is Timeline, and press Home. Press Tab exactly once. Require focus to remain in the custom editor and line 5 to become an indented form of Timeline by adding only one to four leading whitespace characters, with Timeline itself byte-for-byte unchanged. Record that exact indented line. Press Shift+Tab exactly once and require line 5 to return exactly to Timeline. Press Undo exactly once and require the exact recorded indented line to return; press Redo exactly once and require exactly Timeline again. Adjacent lines must remain unchanged throughout. Reload without saving and require line 5 to remain Timeline. Browser focus traversal, insertion away from the line start, non-whitespace content changes, or multiple Tab/Shift+Tab presses fail.
"""

# feature = selection
# sub_feature = real_mouse_and_keyboard_paths
[[criterion]]
id = "selection_real_mouse_word_line_range_keyboard"
name = "selection_real_mouse_word_line_range_keyboard"
type = "binary"
weight = 1.5
description = """
Feature metadata: feature=selection; sub_feature=real_mouse_and_keyboard_paths; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Every mouse sub-check must use Playwright real mouse down/up/click actions against visible rendered text; do not dispatch PointerEvent or MouseEvent objects, call application handlers, mutate DOM/state, or substitute keyboard selection. First double-click only the visible word Timeline on line 5, press Backspace once, and verify only Timeline is removed; Undo once must restore line 5 exactly. Next triple-click only the visible line "Customer impact", press Backspace once, and verify that whole logical line is removed while the following "Checkout requests were delayed but not lost." remains intact; Undo once must restore both lines exactly. Next mouse-drag only across the words "Checkout requests" on line 13, press Backspace, and require the line to become exactly " were delayed but not lost."; Undo once must restore it. Finally use keyboard only on line 18: Home, Shift+ArrowRight four times, type DONE, and require exactly "DONE: Replace temporary dashboard link before publishing." with surrounding lines unchanged. Reload without saving and require all seeded lines restored. Failure of any one interaction path fails the criterion.
"""

# feature = selection
# sub_feature = offscreen_autoscroll
[[criterion]]
id = "selection_autoscroll_exact_offscreen_range"
name = "selection_autoscroll_exact_offscreen_range"
type = "binary"
weight = 1.0
description = """
Feature metadata: feature=selection; sub_feature=offscreen_autoscroll; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Navigate visibly to ALPHA-0010. Starting at the beginning of its rendered line, use real mouse down and drag below the editor's bottom edge long enough to scroll through at least ALPHA-0060, then mouse up near the right edge. Require editor scrollTop to increase and the selected text, copied with Ctrl/Cmd+C, to begin in the ALPHA-0010 line and include ALPHA-0060 in document order. Do not use synthetic events or set scrollTop directly. Clear the selection, return to the beginning of ALPHA-0010, hold Shift, press ArrowDown exactly 50 times, then press Shift+End to include the target line. Require the editor to scroll, the caret to remain visible, and copied selected text to include both ALPHA-0010 and ALPHA-0060 in order. A stationary viewport or selection ending at the original visible edge fails.
"""

# feature = clipboard
# sub_feature = external_multiline_and_internal_cut
[[criterion]]
id = "clipboard_external_multiline_internal_exact"
name = "clipboard_external_multiline_internal_exact"
type = "binary"
weight = 1.0
description = """
Feature metadata: feature=clipboard; sub_feature=external_multiline_and_internal_cut; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Put the exact external clipboard payload "EXTERNAL-A\nEXTERNAL-B\tCELL\nEXTERNAL-C" on the real browser clipboard outside the editor. Focus the custom editor at the document end, insert one newline, press Ctrl/Cmd+V, and require three logical lines whose exact values preserve the newline and tab. On the second inserted line use Home then Shift+End and Ctrl/Cmd+C; read the real clipboard and require exactly "EXTERNAL-B\tCELL". Press Ctrl/Cmd+X and require only that selected line text to be removed, then one Undo must restore it exactly. Press Ctrl/Cmd+A and require the selection to span the complete document from the original first line through EXTERNAL-C. Reload without saving and verify no EXTERNAL marker persisted. Directly injecting text or calling clipboard handlers fails.
"""

# feature = undo_redo
# sub_feature = separate_edit_boundaries
[[criterion]]
id = "undo_separate_locations_and_redo_invalidation"
name = "undo_separate_locations_and_redo_invalidation"
type = "binary"
weight = 1.0
description = """
Feature metadata: feature=undo_redo; sub_feature=separate_full_typing_groups_and_redo_invalidation; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Retain an exact baseline content copy. At line 1 type the complete marker " LOCATION-ONE" using 13 normal sequential key presses, not paste. Navigate to the ALPHA-0600 line and type the complete marker " LOCATION-TWO" using 13 normal sequential key presses, not paste. Navigate to the final line and type the complete marker " LOCATION-THREE" using 15 normal sequential key presses, not paste. Before Undo, require LOCATION-ONE, LOCATION-TWO, and LOCATION-THREE to occur exactly once. Press Undo exactly once, inspect immediately, and require LOCATION-THREE to occur zero times while LOCATION-ONE and LOCATION-TWO each remain once; if LOCATION-THRE or any other partial third marker remains, score no. Press Undo exactly once more and require LOCATION-TWO to occur zero times while LOCATION-ONE remains once. Press Redo exactly once and require the complete LOCATION-TWO to return, then Redo exactly once more and require the complete LOCATION-THREE to return. Next type the complete " REDO-CLEAR-ORIGINAL" sequentially, press Undo exactly once and require the whole marker to be absent, then type the complete " REDO-CLEAR-NEW" sequentially and verify neither the visible Redo control nor Ctrl/Cmd+Y resurrects any part of REDO-CLEAR-ORIGINAL. Using X, ONE, TWO, THREE, another shortened marker, paste, repeated Undo, or inferred behavior is an automatic failure. Reload without saving afterward.
"""

# feature = undo_redo
# sub_feature = compound_command_atomicity
[[criterion]]
id = "undo_paste_cut_atomic"
name = "undo_paste_cut_atomic"
type = "binary"
weight = 1.0
description = """
Feature metadata: feature=undo_redo; sub_feature=paste_and_cut_atomicity; kind=graded; depends_on=clipboard_external_multiline_internal_exact. This criterion is all-or-nothing. Paste exact text "PASTE-A\nPASTE-B\nPASTE-C" once and require one Undo to remove all three lines and one Redo to restore all three. Select the complete phrase PASTE-B using keyboard selection, press Ctrl/Cmd+X, and require one Undo to restore the whole phrase and one Redo to remove it again. Any partial paste or cut reversal fails. Reload without saving afterward.
"""

# feature = undo_redo
# sub_feature = typed_selection_replacement
[[criterion]]
id = "undo_typed_selection_replacement_atomic"
name = "undo_typed_selection_replacement_atomic"
type = "binary"
weight = 1.5
description = """
Feature metadata: feature=undo_redo; sub_feature=typed_selection_replacement; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. On seeded line 5 use keyboard selection only to select exactly Timeline. Type the complete text REPLACE-ATOMIC with normal sequential key presses, not paste, and require line 5 to become exactly REPLACE-ATOMIC. Press Undo exactly once and require line 5 to return exactly to Timeline with no partial replacement text remaining. Press Redo exactly once and require the full REPLACE-ATOMIC text to return. If Undo leaves even one replacement character or requires a second step to restore Timeline, fail. Reload without saving afterward.
"""

# feature = find_replace
# sub_feature = wrap_counts_and_offset_integrity
[[criterion]]
id = "find_replace_exact_counts_and_offsets"
name = "find_replace_exact_counts_and_offsets"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=find_replace; sub_feature=wrap_counts_and_offset_integrity; kind=graded; depends_on=preflight_manifest_restart. This criterion is all-or-nothing. In the visible controls search TODO and require exactly 3 matches. Use Find Next repeatedly and copy each active selection to verify the exact three TODO lines are visited in document order and the fourth Find Next wraps to the first line. Set replacement to FOLLOWUP and Replace Current once; require exactly line 18 to become "FOLLOWUP: Replace temporary dashboard link before publishing.", with the other two TODO lines unchanged. Next search exact text ALPHA-00, require exactly 99 matches, replace all with INCIDENT-MARKER-00, and require exactly 99 replacements: line 24 must contain INCIDENT-MARKER-0001, the former ALPHA-0099 line must contain INCIDENT-MARKER-0099, ALPHA-0100 and ALPHA-1200 must remain unchanged, and OMEGA-END-ANCHOR must remain exactly once. Reload without saving and require the original saved content to return.
"""

# feature = find_replace
# sub_feature = keyboard_focus_and_cycle
[[criterion]]
id = "keyboard_find_focus_and_cycle"
name = "keyboard_find_focus_and_cycle"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=find_replace; sub_feature=keyboard_focus_forward_backward_and_escape; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Focus the custom editor and press the real platform Ctrl/Cmd+F shortcut exactly once. Require the app's visible Find input, not the browser find UI, to receive focus. Type TODO with normal sequential key presses. Press Enter exactly once and require the active editor selection to be the TODO on logical line 18; copy it with Ctrl/Cmd+C and require the clipboard to equal exactly TODO. Press Enter exactly once more and require the selected TODO to be on logical line 19. Press Shift+Enter exactly once and require selection to return to the TODO on line 18. Press Escape exactly once and require keyboard focus to return to the custom editor. Do not click Find Next, dispatch keyboard events, invoke handlers, or mutate focus/selection from JavaScript. The reasoning must quote the focused control, exact selected text, and lines after forward, second-forward, and backward navigation.
"""

# feature = long_document
# sub_feature = three_region_round_trip
[[criterion]]
id = "long_document_three_region_round_trip"
name = "long_document_three_region_round_trip"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=long_document; sub_feature=three_region_round_trip; kind=graded; depends_on=preflight_manifest_restart. This criterion is all-or-nothing. Read and retain an unchanged baseline copy from the document API. Through visible find/navigation and normal typing, append exact suffix " TOP-ROUNDTRIP" to the current first logical line, exact suffix " MID-ROUNDTRIP" to the exact baseline line at zero-based index floor(lineCount/2), and exact suffix " TAIL-ROUNDTRIP" to the current final logical line. Save once and reload. Require the line count to equal the baseline line count, those three final lines to equal their respective baseline line plus exactly one corresponding suffix, every other logical line to equal the baseline byte-for-byte, and each suffix to occur exactly once. Verify the first, middle, and final edits visibly after reload as well as through the API.
"""

# feature = revision_history
# sub_feature = preview_restore_and_undo
[[criterion]]
id = "revision_history_preview_restore_undo_exact"
name = "revision_history_preview_restore_undo_exact"
type = "binary"
weight = 1.5
description = """
Feature metadata: feature=revision_history; sub_feature=preview_restore_and_undo; kind=graded; depends_on=none. This criterion is all-or-nothing. Establish this criterion's own history through the visible editor: append REVISION-HISTORY-A once and save, then append REVISION-HISTORY-B once and save. Record the exact current draft and current revision. Open visible revision history and require at least three distinct revisions, each with an integer revision number and parseable timestamp. Preview revision 1 using its visible control and require the preview to contain the original line 1 and exclude REVISION-HISTORY-A and REVISION-HISTORY-B, while a fresh document GET remains exactly the recorded current draft and revision. Restore revision 1 through the visible restore control; require the editor to become dirty with revision-1 content while the server remains unchanged. Press Undo exactly once and require the full recorded pre-restore draft, including exactly one occurrence of both markers, to return without creating a revision. Any immediate save, corrupted preview, or multi-step restoration fails.
"""

# feature = conflict_safety
# sub_feature = chained_two_tab_conflicts
[[criterion]]
id = "two_tab_chained_stale_save_conflicts"
name = "two_tab_chained_stale_save_conflicts"
type = "binary"
weight = 1.5
description = """
Feature metadata: feature=conflict_safety; sub_feature=chained_two_tab_conflicts; kind=graded; depends_on=none. This criterion is all-or-nothing. Open two ordinary tabs A and B on the same saved revision R. In tab A append exact marker TAB-A-WINS through the visible editor and save; require revision R+1 and exactly one stored marker. Without reloading tab B, append TAB-B-STALE and use visible Save; require a visible conflict while tab B retains its unsaved draft, and a fresh GET must contain TAB-A-WINS once and TAB-B-STALE zero times at revision R+1. Reload tab B, append TAB-B-REBASSED, save, and require revision R+2 with TAB-A-WINS and TAB-B-REBASSED each exactly once. Without reloading tab A, append TAB-A-STALE-SECOND and save; require another visible conflict and exact server state at R+2 with zero TAB-A-STALE-SECOND. A disabled button without a server attempt is insufficient.
"""

# feature = multi_caret
# sub_feature = full_typing_single_undo
[[criterion]]
id = "multi_caret_full_typing_single_undo"
name = "multi_caret_full_typing_single_undo"
type = "binary"
weight = 1.5
description = """
Feature metadata: feature=multi_caret; sub_feature=full_typing_single_undo; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Use one real normal mouse click and either two real Alt+Click actions or two real platform Ctrl/Cmd+Click actions, never synthetic events, to place exactly three carets immediately after the words Timeline, impact, and items on three different visible logical lines. Determine which permitted modifier the app supports on a fresh pair of carets; if the first modifier does not add a caret, clear the attempted carets before trying the other permitted modifier. Once a working modifier is found, use that same modifier for both added carets. Hold the chosen modifier key down during each real mouse click and release it afterward; do not dispatch synthetic mouse events or invoke handlers. Confirm exactly three visible carets. Type exactly MULTI using five normal sequential key presses: M, U, L, T, I. Do not type X, MC, MC-, M, or another shorter proxy. Require the exact affected lines to be "TimelineMULTI", "Customer impactMULTI", and "Action itemsMULTI", with no insertion on adjacent lines. Press Undo exactly once and inspect immediately: all three lines must be exactly "Timeline", "Customer impact", and "Action items". If one Undo leaves MULT, MUL, MU, M, or any other part of MULTI at even one caret, score no and do not issue more Undo commands to rescue the check. Press Redo exactly once and require all three complete MULTI insertions to return. The reasoning must quote the chosen modifier and all three exact lines before typing, after typing, after the single Undo, and after the single Redo; otherwise score no. Reload without saving afterward.
"""

# feature = multi_caret
# sub_feature = backspace_delete_sibling
[[criterion]]
id = "multi_caret_backspace_delete_sibling"
name = "multi_caret_backspace_delete_sibling"
type = "binary"
weight = 0.5
description = """
Feature metadata: feature=multi_caret; sub_feature=backspace_delete_sibling; kind=graded; depends_on=custom_editor_no_native_editing_surface. This criterion is all-or-nothing. Using one real normal click and the same permitted real modifier-click path established for this criterion, create exactly three carets immediately after the final characters of Timeline, Customer impact, and Action items. The permitted path is Alt+Click or platform Ctrl/Cmd+Click; hold the chosen modifier during each real mouse click, use it consistently, and never dispatch synthetic events. Press Backspace exactly once. Require the three complete lines to become exactly "Timelin", "Customer impac", and "Action item" while adjacent lines remain unchanged. Press Undo exactly once and require all three original lines to return. Clear the carets. Repeat the same modifier-down, real mouse click, modifier-up sequence for each added caret immediately before the first characters of Timeline, Customer impact, and Action items. Press Delete exactly once. Require the three complete lines to become exactly "imeline", "ustomer impact", and "ction items" while adjacent lines remain unchanged. Press Undo exactly once and require all three original lines to return. The reasoning must quote the chosen modifier and all three exact lines after Backspace, after its one Undo, after Delete, and after its one Undo. Testing only one caret, a shorter subset, or only one deletion key is an automatic failure. Reload without saving afterward.
"""

# feature = conflict_safety
# sub_feature = direct_api_rejection_matrix
[[criterion]]
id = "direct_api_save_rejection_nonmutation_matrix"
name = "direct_api_save_rejection_nonmutation_matrix"
type = "binary"
weight = 1.0
description = """
Feature metadata: feature=conflict_safety; sub_feature=direct_api_rejection_matrix; kind=graded; depends_on=none. This criterion is all-or-nothing and must be the final criterion evaluated. Use same-origin fetch calls and the live app's real save route/body shape. Record base content, revision R, and the exact revision list. Make one legitimate save at R that appends API-CURRENT-WINS and require success at R+1 with exactly one new revision. Protect that exact post-save state. Using the older R and baseline content, attempt FORGED-STALE-OVERWRITE and require HTTP 409. Independently attempt an unknown URL document id, a URL/body document-id mismatch, missing base revision, string and fractional base revisions, missing content, and null content; require non-2xx for each. Finally send the protected content with the current R+1 base revision plus an extra forged currentRevision field; the server may reject it or ignore only that extra field, but it must not change content or create a revision. Re-read the real document and revision list after every probe. At the end require API-CURRENT-WINS exactly once, FORGED-STALE-OVERWRITE zero times, revision still R+1, and the revision list exactly equal to the protected post-save list. Any rejected request that mutates content or creates a revision is an immediate failure. Do not restore, resave, or otherwise repair the document after any unexpected mutation.
"""

[scoring]
aggregation = "weighted_mean"
