<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatchPad Editor</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><div><span class="brand">PatchPad</span><h1 id="document-title">Loading document…</h1></div>
  <div class="status-group" aria-live="polite"><span id="position-status">Line 1, Column 1</span><span id="revision-status">Revision —</span><strong id="save-status">Loading</strong></div></header>
<main>
  <section class="toolbar" aria-label="Editor actions">
    <button id="save-button" type="button">Save</button><button id="undo-button" type="button">Undo</button><button id="redo-button" type="button">Redo</button><span class="divider"></span>
    <label>Find <input id="find-input" type="search" autocomplete="off"></label><button id="find-next-button" type="button">Find next</button>
    <label>Replace <input id="replace-input" type="text" autocomplete="off"></label><button id="replace-button" type="button">Replace current</button><button id="replace-all-button" type="button">Replace all</button><span id="find-status" aria-live="polite"></span>
  </section>
  <div id="message" role="alert" hidden></div>
  <section class="workspace">
    <div class="editor-column">
      <div id="editor" class="editor" tabindex="0" role="textbox" aria-multiline="true" aria-label="Incident report editor" aria-describedby="editor-help"><div id="editor-spacer"></div><div id="editor-lines"></div></div>
      <p id="editor-help">Type to edit. Alt+Click or Ctrl/Command+Click adds a caret. Shift extends selection.</p>
    </div>
    <aside><h2>Revision history</h2><p class="aside-help">Preview a saved revision, then restore it as a new revision.</p>
      <div id="preview-banner" hidden>Previewing revision <strong id="preview-number"></strong><button id="exit-preview-button" type="button">Return to editor</button><button id="restore-button" type="button">Restore this revision</button></div>
      <ol id="revision-list"></ol>
    </aside>
  </section>
</main>
<script src="/editor.js"></script><script src="/app.js"></script>
</body></html>
