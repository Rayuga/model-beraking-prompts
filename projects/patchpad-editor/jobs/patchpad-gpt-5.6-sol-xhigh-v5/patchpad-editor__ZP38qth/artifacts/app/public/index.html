<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatchPad</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div><span class="eyebrow">PATCHPAD / INCIDENT REPORT</span><h1 id="title">Loading document…</h1><p id="byline"></p></div><div class="save-block"><button id="save" class="primary">Save <kbd>Ctrl S</kbd></button><span id="save-state" role="status">Loading…</span></div></header>
<main><section class="workspace" aria-label="Document editor"><div class="toolbar"><div class="group"><button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button></div><div class="search group"><label>Find <input id="find" type="search" autocomplete="off" placeholder="text"></label><button id="find-next">Find Next</button><label>Replace <input id="replace" type="text" autocomplete="off" placeholder="replacement"></label><button id="replace-current">Replace Current</button><button id="replace-all">Replace All</button></div><button id="history-toggle" aria-expanded="true">Revision History</button></div>
<div id="message" role="alert" hidden></div><div class="editor-shell"><div id="scroll" class="scroll"><div id="sizer"></div><canvas id="editor" tabindex="0" role="textbox" aria-label="Incident report editor" aria-multiline="true" aria-description="Custom text editor. Alt-click or Control-click to add carets."></canvas></div><aside id="history"><div class="aside-head"><h2>Revision history</h2><button id="history-close" aria-label="Close revision history">×</button></div><p>Preview a saved revision, then restore it as an unsaved draft.</p><div id="revision-list"></div></aside></div>
<footer><span id="position">Ln 1, Col 1</span><span id="selection-state">1 caret</span><span id="revision">Revision —</span><span class="hint">Alt/⌘/Ctrl + click adds a caret</span></footer></section></main>
<dialog id="preview"><div class="dialog-head"><h2 id="preview-title">Revision preview</h2><button id="preview-close" aria-label="Close preview">×</button></div><pre id="preview-content"></pre><div class="dialog-actions"><button id="restore" class="primary">Restore as draft</button><button id="preview-cancel">Cancel</button></div></dialog><script type="module" src="/app.js"></script></body></html>
