# Per-dimension keys stay in reward.json for diagnostics. These add rolled-up keys.
#
# "reward" is the number you train on. Gating is already baked in: every
# criterion in functional/ and polish/ returns 0 when the render or constraint
# gate fails, so a broken or constraint-violating rollout collapses toward 0
# without needing a multiplicative aggregator.

[[reward]]
name = "reward"
aggregation = "weighted_mean"

# NOTE: rewardkit's "threshold" aggregation thresholds the weighted mean across
# dimensions, NOT each dimension independently — a strict-looking
# [[reward]] with threshold=0.7 still passes when polish=0.06 drags under a
# strong functional score. If you want true per-dimension gating, read the
# `render` and `constraints` keys directly in your trainer.
