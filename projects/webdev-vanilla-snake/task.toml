schema_version = "1.4"

[task]
name = "codearena/webdev-vanilla-snake"
version = "1.0.0"
description = "Raw HTML/CSS/JS canvas Snake — constraint adherence under aesthetic pressure"
keywords = ["webdev", "codearena", "rewardkit", "judge-grading", "canvas", "vanilla-js", "constraint-adherence"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["frontend", "arena", "rl-training"]
# Provenance: verbatim prompt from lmarena-ai/webdev-arena-preference-10k.
# Outcome in the arena: tie (bothbad) — BOTH frontier models failed this prompt.
arena_slice = "vanilla-html-js"
arena_bothbad_rate = 0.345

[agent]
timeout_sec = 600.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[verifier.environment]
docker_image = "codearena/webdev-verifier:1.0.0"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]
