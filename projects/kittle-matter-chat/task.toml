schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/kittle-matter-chat"
description = "Law-firm client chat organised by legal matter. Ethical walls hide a matter from walled staff in lists, search, posting and transcripts; matters can use disappearing-message timers; partners place legal holds that no timer can remove; transcripts list a matter's surviving messages. Express and SQLite, browser-judged."
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "messaging", "chat", "legal", "retention", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Hard because a wall must hold across list, search, post and transcript requests, timer deletion is permanent and measured from stored times against a fixed clock, holds override timers until released, and only a partner changes timers or holds."
category = "Messaging & Chat Interfaces"
tags = ["full-stack", "browser", "arena", "rl-training", "messaging-chat"]
provenance = "turing/kittle-matter-chat v1.0.0. Messaging and chat interfaces package."
arena_slice = "full-stack-express-sqlite-messaging-chat-kittle-matter-chat"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
