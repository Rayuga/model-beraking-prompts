<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kittle &amp; Rowe · Matter chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="signin" class="signin" hidden>
    <form id="signin-form" class="signin-card" novalidate>
      <p class="firm-mark">Kittle &amp; Rowe</p>
      <h1>Matter chat</h1>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="signin-error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <a class="brand" href="/" data-nav="/">Kittle &amp; Rowe</a>
      <form id="search-form" class="search" role="search">
        <label class="visually-hidden" for="search-input">Search messages</label>
        <input id="search-input" type="search" placeholder="Search messages">
        <button type="submit">Search</button>
      </form>
      <a id="mentions-link" class="mentions-link" href="/mentions" data-nav="/mentions">Mentions <span id="mention-count" class="badge" hidden></span></a>
      <span id="who" class="who"></span>
      <button id="signout" type="button" class="quiet">Sign out</button>
    </header>

    <nav class="sidebar" aria-label="Matters">
      <h2>Matters</h2>
      <ul id="matter-list" class="matter-list"></ul>
    </nav>

    <main id="main" class="main">
      <section id="empty-view" class="empty-view">
        <p>Choose a matter to see its conversation.</p>
      </section>

      <section id="matter-view" class="matter-view" hidden>
        <header class="matter-head">
          <div>
            <h2 id="matter-title"></h2>
            <p id="matter-timer" class="timer"></p>
          </div>
          <a id="transcript-link" class="transcript-link" target="_blank" rel="noopener">Transcript</a>
        </header>
        <div id="partner-tools" class="partner-tools" hidden>
          <form id="timer-form" class="inline-form">
            <label for="timer-select">Timer</label>
            <select id="timer-select">
              <option value="off">Off</option>
              <option value="1">1 day</option>
              <option value="7">7 days</option>
              <option value="30">30 days</option>
            </select>
            <button type="submit">Set timer</button>
            <span id="timer-error" class="error" hidden></span>
          </form>
          <form id="wall-form" class="inline-form">
            <span class="label">Walls</span>
            <span id="wall-list" class="wall-list"></span>
            <label class="visually-hidden" for="wall-select">Staff member</label>
            <select id="wall-select"></select>
            <button type="submit" id="wall-add">Wall from this matter</button>
            <span id="wall-error" class="error" hidden></span>
          </form>
        </div>
        <p id="matter-unavailable" class="unavailable" hidden>Not available.</p>
        <ol id="thread" class="thread" aria-live="polite"></ol>

        <form id="composer" class="composer">
          <div id="composer-context" class="composer-context" hidden>
            <span id="composer-context-text"></span>
            <button type="button" id="composer-cancel" class="quiet">Cancel</button>
          </div>
          <label class="visually-hidden" for="composer-input">Message</label>
          <textarea id="composer-input" rows="3" placeholder="Write a message"></textarea>
          <div class="composer-row">
            <p id="composer-error" class="error" role="alert" hidden></p>
            <button type="submit" id="composer-send" class="primary">Send</button>
          </div>
        </form>
      </section>

      <section id="mentions-view" class="list-view" hidden>
        <h2>Mentions</h2>
        <ol id="mentions" class="results"></ol>
      </section>

      <section id="search-view" class="list-view" hidden>
        <h2 id="search-title">Search</h2>
        <ol id="results" class="results"></ol>
      </section>
    </main>

    <div id="link-box" class="link-box" hidden>
      <label for="link-value">Message link</label>
      <input id="link-value" readonly>
      <button type="button" id="link-close" class="quiet">Close</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
