<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kittle &amp; Rowe</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">Kittle &amp; Rowe</p>
        <h1>Matter chat</h1>
      </div>
      <div id="who"></div>
    </div>
  </header>
  <main>
    <form id="signin">
      <p class="lede">Sign in to open your matters.</p>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <p id="signin-error" class="refusal" hidden></p>
    </form>
    <section id="desk" hidden>
      <form id="search-form" class="search-form">
        <label>Search messages <input name="q" type="search" autocomplete="off"></label>
        <button type="submit">Search</button>
        <p id="search-error" class="refusal" hidden></p>
      </form>
      <div id="results"></div>
      <div class="workspace">
        <div class="matter-pane" id="matter-pane"></div>
        <div class="thread-pane">
          <p id="thread-error" class="refusal" hidden></p>
          <div id="thread"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
