[judge]
# Judge agent and model are set once for all dimensions by REWARDKIT_JUDGE /
# REWARDKIT_MODEL in task.toml [verifier.env]; the value here is only the
# fallback agent type for local runs.
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "matter_sidebar"
name = "matter_sidebar"
type = "likert"
points = 5
weight = 2.0
description = """
Assess the matter list at desktop width, whether it sits beside the thread or on its own screen.
5: each matter is easy to identify at a glance, the selected matter is unmistakable, and unread counts stand out without crowding the list.
4: clear with one weak selection state.
3: readable but the matters run together.
2: hard to tell which matter is open.
1: an unstyled list.
0: no matter list is rendered.
"""

[[criterion]]
id = "retention_marks"
name = "retention_marks"
type = "likert"
points = 5
weight = 2.0
description = """
Assess how hold marks and the timer notice look in a thread such as M-13.
5: held messages carry a calm, legible On hold badge, the disappearing-timer notice is clear without alarming, and both read in context.
4: clear with one weak mark.
3: visible but inconsistently placed.
2: marks are easy to miss.
1: barely present.
0: no marks are rendered.
"""

[[criterion]]
id = "transcript_page"
name = "transcript_page"
type = "likert"
points = 5
weight = 1.0
description = """
Assess the M-11 transcript page.
5: a document-like page with a clear heading block, author and time placed consistently for every message, and a comfortable reading width.
4: good page with one spacing slip.
3: readable but plain or uneven.
2: cluttered or hard to follow.
1: a raw dump.
0: no transcript is rendered.
"""

[[criterion]]
id = "phone_chambers"
name = "phone_chambers"
type = "likert"
points = 5
weight = 1.0
description = """
Assess Gwen's matter thread at 390 by 844.
5: the matter title, messages and box fit the width with clean wrapping and the hold mark still readable.
4: fits with one tight spot.
3: fits but feels cramped.
2: text clipped or box off screen.
1: barely usable.
0: nothing usable at that width.
"""
