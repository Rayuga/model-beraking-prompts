[judge]
# Judge agent and model are set once for all dimensions by REWARDKIT_JUDGE /
# REWARDKIT_MODEL in task.toml [verifier.env]; the value here is only the
# fallback agent type for local runs.
judge = "claude-code"
mode = "individual"
# Individual mode grades each criterion in its own sequential session; this timeout
# applies per criterion. Keep criteria x timeout + polish + visual within the
# 11100 s scored budget in test.sh: 16 x 550 + 900 + 900 = 10600 s, leaving 500 s.
# The template default is batched/9000; individual mode is the lead's instruction,
# relayed by the task owner on 8 Oct 2026. Not yet measured against a judge run.
timeout = 550
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

# Verifier-only tool for the persistence criterion's process restart.
[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

# Weight rule: each part of a criterion is weighted by what it protects. Core legal
# behaviour (walls, retention, holds, persistence) is 2.0, ordinary chat behaviour is
# 1.5 and a single small behaviour is 1.0; a criterion with parts takes their sum.
# For example wall_every_route and timer_changes are two 2.0 parts each, and
# signin_and_client_scope is 1.5 for sign-in plus 1.5 for client scope, and persistence
# is 2.0 for durable walls plus 2.0 for durable retention and holds. Total 44.0.
# Each observable is graded in exactly one criterion.

[[criterion]]
id = "signin_and_client_scope"
name = "signin_and_client_scope"
type = "binary"
weight = 3.0
description = """
Part A.
As harriet@kittle.test post "@Gwen please check JUDGE-CS0" in M-11. Then sign in as gwen@kittle.test and confirm her matter list shows "Pryce lease dispute" and "Pryce will" and not "Marsh Holdings acquisition", recording the request that loads the matter list. While signed in, open M-11 and record the request that loads its messages, open her mentions list (it shows JUDGE-CS0) and record that request, search for "Survey" (it finds "Survey booked for Friday.") and record that request, and note the M-11 transcript address (the transcript opens). These are the positive controls. Sign out: no matter title, name or message stays visible. Then, signed out, replay each recorded request from the app page and open the M-11 transcript address: none returns any matter, message, mention or name data. Try harriet@kittle.test with a wrong password: sign-in is refused.
Fails if any positive control did not work, if Gwen's list lacks either of her matters or shows M-12, if anything private remains after sign-out, if any signed-out replay or the transcript address returns matter, message, mention or name data, or if the wrong password signs in.
Part B.
As harriet@kittle.test open M-12 and record the request the page makes to load its messages (it shows M-12's messages, positive control), and note the M-12 transcript address. As gwen@kittle.test, post "Lease question JUDGE-CS1" in M-11 and record the posting request; it must appear in M-11 (positive control). From Gwen's session, replay her posting request aimed at M-12 using the M-12 identifier seen in Harriet's recorded request, with the text "Cross post JUDGE-CS2", replay Harriet's recorded M-12 message-loading request, and open the M-12 transcript address in Gwen's browser.
Fails if the M-11 post did not work, if any of these returns or writes anything in M-12 (check as harriet@kittle.test that M-12 has no JUDGE-CS1 or JUDGE-CS2), or if the refusal is not a plain not-available answer.
Both parts must hold; failing either fails this criterion.
"""

[[criterion]]
id = "wall_every_route"
name = "wall_every_route"
type = "binary"
weight = 4.0
description = """
As sian@kittle.test (not walled), open M-12 and post "Wall check JUDGE-W0" there. Record the requests the page makes to load the matter list, to load the M-12 thread, to open the M-12 transcript and to search for "JUDGE-W0". Sian sees JUDGE-W0 in the thread, her search finds it, and the M-12 transcript shows it (positive controls). Then sign in as dev@kittle.test, who is walled from M-12.
1. Dev's matter list shows M-11 and M-13 and nothing from M-12, not even its title or number.
2. Searching "JUDGE-W0", "heads of terms" and "Fenwick" returns nothing, with no snippet, count or matter name from M-12, while Dev's search for "Survey booked" finds the M-11 message (positive control).
3. Replaying, as Dev, the recorded matter-list, thread, transcript and search requests returns nothing from M-12; the thread and transcript answers are a plain not-available.
4. Opening the M-12 transcript address directly in Dev's browser shows not-available.
5. As Dev in M-11 reply to "Rent review meeting moved to the afternoon." with "Reply check JUDGE-W1" and record that reply request; JUDGE-W1 appears under that message (positive control). From Dev's session replay it with the text "Cross reply JUDGE-W2" and, as the message it answers, the identifier of "Wall check JUDGE-W0" as it appears in Sian's recorded M-12 thread request: it is refused, and JUDGE-W2 appears nowhere, neither in M-11 for Dev or harriet@kittle.test nor in M-12 for Sian. Then, as Dev, open M-13 and record the request that loads its messages, and replay the reply request once more with the text "Cross reply JUDGE-W3" and the identifier of "Draft will sent for your review." from that M-13 request as the message it answers. Either it is refused in any way and JUDGE-W3 appears nowhere, or JUDGE-W3 is filed as a reply under "Draft will sent for your review." in M-13, its own parent's matter; it must never appear in M-11 or under a message of another matter.
Fails if Dev's reply did not work, if JUDGE-W2 is accepted or shows anywhere, if JUDGE-W3 shows in M-11 or under a message of another matter, if Dev's list lacks M-11 or M-13, if any M-12 title, number, message text, author or count reaches Dev by any of these routes, if a refusal of an M-12 route (legs 3 and 4 and the JUDGE-W2 replay) is anything but a plain not-available, or if any of Sian's positive controls did not work.
"""

[[criterion]]
id = "wall_mentions_and_links"
name = "wall_mentions_and_links"
type = "binary"
weight = 4.0
description = """
Part A.
As harriet@kittle.test, open M-12, use the app's control to copy the link of the message "Draft heads of terms ready for comment.", then in M-11 post "See the linked terms JUDGE-L1 " followed by that link. As Harriet, M-11 shows a short preview of the linked message, and following the link opens M-12 at that message (positive controls). In M-12, type and post "@Dev please review JUDGE-M1" as written (Dev is walled from M-12, so he is not expected among any suggestions there; it posts normally and Dev must simply never hear of it), and in M-11 post "@dev survey update JUDGE-M2" exactly as written, in lower case.
Then as dev@kittle.test: in M-11, the JUDGE-L1 message shows "not available" where the preview would be, with no text, author or title from M-12; following the link shows not-available; Dev's mentions list shows the JUDGE-M2 mention and nothing about JUDGE-M1 or M-12.
Fails if Harriet's preview or link did not work, if Dev sees any part of the linked M-12 message or its matter, if Dev's mentions reveal JUDGE-M1, or if the M-11 mention JUDGE-M2 is missing for Dev.
Part B.
As harriet@kittle.test open M-12 and type "@" in the message box: the app suggests people who can see M-12, including Sian Lloyd and Paul Marsh, and never Dev Anand or Gwen Pryce. If showing the suggestions made a request, record it. Clear the box, open M-11 and type "@": the suggestions include Dev Anand, Sian Lloyd and Gwen Pryce, and never Paul Marsh. Pick Dev from those suggestions, type " suggestion check JUDGE-M3" after what the pick put in, and send: as dev@kittle.test the mentions list shows JUDGE-M3. Finally, as dev@kittle.test, replay any recorded M-12 suggestion request: it returns no names and nothing from M-12.
Fails if typing @ shows no suggestions, if the M-12 suggestions include Dev or Gwen or the M-11 suggestions include Paul, if picking a suggestion does not make a working mention, or if Dev's replay returns any name or M-12 data.
Both parts must hold; failing either fails this criterion.
"""

[[criterion]]
id = "wall_added_live"
name = "wall_added_live"
type = "binary"
weight = 2.0
description = """
In one browser context sign in as sian@kittle.test, open M-12, post "Before wall JUDGE-WL0" and record that posting request; keep the page open. In a separate browser context sign in as harriet@kittle.test and open M-12. With the app's controls, wall Sian from M-12 and lift that wall again, recording both requests (Sian's page may briefly change; that is fine). Then wall Sian from M-12 once more.
1. In Sian's page, without reloading, within about ten seconds M-12 disappears from her list and its thread stops showing messages or says it is not available, while M-11 and M-13 stay in her list and opening M-11 still shows its messages without signing in again (positive control).
2. From Sian's session, replay her recorded posting request with the text "Too late JUDGE-WL1": it is refused, and as Harriet M-12 has no JUDGE-WL1.
3. From Sian's session, replay Harriet's recorded wall-lifting request: it is refused, and Sian still gets not-available for M-12.
4. As Harriet lift Sian's wall with the app's control: after a reload Sian sees M-12 again, including JUDGE-WL0.
Fails if Sian keeps seeing M-12 messages after the wall, if her post reaches M-12, if she can lift her own wall, or if lifting the wall does not give her M-12 back.
"""

[[criterion]]
id = "nested_replies"
name = "nested_replies"
type = "binary"
weight = 1.5
description = """
As harriet@kittle.test in M-13, post "Root question JUDGE-R0". Reply to it with "Level one JUDGE-R1", reply to that with "Level two JUDGE-R2", and reply to that with "Level three JUDGE-R3". Then post a separate top-level message "Unrelated JUDGE-RX", and after it add a second reply to JUDGE-R0: "Another level one JUDGE-R1B".
1. JUDGE-R1, JUDGE-R2 and JUDGE-R3 each sit under the message they answer, nested three levels deep, each with a short quote of its parent's text.
2. JUDGE-R1B sits under JUDGE-R0 after JUDGE-R1's branch, not after JUDGE-RX at the bottom of the matter.
3. As gwen@kittle.test after a reload, the same structure and quotes are shown.
Fails if any reply is shown at the wrong level, loses its quote, or is placed by arrival time instead of under its parent.
"""

[[criterion]]
id = "deleted_and_expired_messages"
name = "deleted_and_expired_messages"
type = "binary"
weight = 4.0
description = """
Part A.
As gwen@kittle.test open M-11. The seeded message "Here is the original lease scan, clause 14 is the problem." was sent on 1 May on a seven-day matter, so it is gone, but Harriet's reply "Clause 14 noted, we will raise it with the landlord." and Gwen's held reply under it survive.
1. Harriet's reply is shown with a placeholder saying the original message was deleted, in place of a quote, and Gwen's held reply stays nested under it. Searching "original lease scan" finds nothing; searching "Clause 14 noted" finds Harriet's reply.
2. As Gwen post "Delete parent JUDGE-X0" in M-11; as harriet@kittle.test reply to it with "Reply stays JUDGE-X1". As Gwen delete JUDGE-X0 with the app's control, recording the request: JUDGE-X1 stays, with a placeholder saying the original message was deleted in place of a quote, and searching "JUDGE-X0" finds nothing while "JUDGE-X1" finds the reply.
3. As sian@kittle.test replay Gwen's recorded delete request against JUDGE-X1, which is not Sian's: it is refused and JUDGE-X1 stays.
4. The M-11 transcript shows the placeholder in place of both deleted parents with their replies under it, and contains neither "original lease scan" nor "Delete parent JUDGE-X0".
Fails if deleted text appears anywhere (thread, quote, search, transcript), if a surviving reply is missing or loses its nesting, if no placeholder marks a deleted parent, or if Sian can delete someone else's message.
Part B.
As harriet@kittle.test open M-11 (seven-day timer; the clock is 2026-05-12T11:00:00Z). The seeded "Boundary note: rent review date is 5 June." was sent exactly seven days ago and must be gone; "Rent review meeting moved to the afternoon." was sent one second later and must be shown (positive control). Search "rent review date" finds nothing, and the M-11 transcript does not contain it.
Fails if the exactly-seven-day message is shown anywhere, or if the one-second-younger message is missing.
Both parts must hold; failing either fails this criterion.
"""

[[criterion]]
id = "timer_changes"
name = "timer_changes"
type = "binary"
weight = 4.0
description = """
As harriet@kittle.test open M-13 (30-day timer). "Probate estimate is 4,200 pounds." (sent 4 May, not held) and the held "My executor will be my sister." (sent 4 May) are shown. The matter's timer control offers off, 1 day, 7 days and 30 days (positive control). If the app lets Harriet open earlier versions (that viewer itself is graded in edits_and_stale_edit), open the probate message's earlier versions, confirm "Probate estimate is 2,400 pounds." is listed, and record the request that returned them, whether a dedicated request or the thread request if they arrived with it. Then edit Harriet's seeded "Costs estimate sent to Gwen." (sent 3 May) to "Costs estimate sent to Gwen JUDGE-TE" with the app's edit control: it now reads "Costs estimate sent to Gwen JUDGE-TE" (positive control).
1. Change the M-13 timer to 7 days with the app's control, recording the request: the probate message and JUDGE-TE disappear at once (JUDGE-TE was sent nine days ago; editing it today does not make it younger), the held executor message stays, and the matter's timer setting now reads 7 days.
2. If an earlier-versions request was recorded, replaying it now returns no text of the deleted message: a not-available answer, an error or an empty list are all fine, as long as neither "2,400" nor "4,200" appears. Searching "Probate", "2,400", "4,200" and "JUDGE-TE" finds nothing, while searching "executor" finds the held message; the M-13 transcript contains none of "2,400", "4,200" and "JUDGE-TE" but does contain the executor message.
3. Change the timer to off: the matter's timer setting now reads off, and the probate message does not come back.
4. Set the timer back to 30 days: the setting reads 30 days and the probate message still does not come back.
5. As sian@kittle.test, an associate, open M-13 (she can see it, as a positive control), then replay the recorded timer request with the setting off: it is refused, and as Harriet after a reload M-13 still shows 30 days.
Fails if a positive control did not work, if shortening does not delete the eight-day-old message and its earlier version at once, if the edited nine-day-old JUDGE-TE survives, if the held message is deleted, if the 7-day setting is not shown, if turning the timer off brings anything back, or if Sian's change is accepted.
"""

[[criterion]]
id = "hold_scope_and_release"
name = "hold_scope_and_release"
type = "binary"
weight = 2.0
description = """
As harriet@kittle.test in M-11:
1. Post "Delete me JUDGE-H3" and delete it with the app's control, recording the delete request: it disappears (positive control for deleting).
2. Post "Hold parent JUDGE-H0", reply to it with "Hold child JUDGE-H1", and reply to JUDGE-H1 with "Hold grandchild JUDGE-H1C". Place a hold on JUDGE-H1 only, recording the hold request. For gwen@kittle.test after a reload, JUDGE-H1 is marked On hold and JUDGE-H0 and JUDGE-H1C are not.
3. As Harriet try to delete JUDGE-H1 with the app's control if it offers one, and replay the recorded delete request against JUDGE-H1: deletion is refused and JUDGE-H1 stays.
4. As sian@kittle.test replay the recorded hold request against JUDGE-H0: it is refused and JUDGE-H0 is still not on hold.
5. As Harriet post "Not really On hold JUDGE-H2": it shows as ordinary text without the hold mark.
6. Release the hold on the seeded "Insurer letter acknowledged." (sent 3 May on the seven-day M-11) with the app's control, recording the request: it disappears at once, searching "Insurer letter" finds nothing, and searching "Hold child JUDGE-H1" finds JUDGE-H1 (positive control for search).
7. As sian@kittle.test replay the recorded release request against JUDGE-H1: it is refused and JUDGE-H1 is still On hold.
Fails if the first delete did not work, if the hold spreads to the parent or the reply, if a held message can be deleted, if Sian can place or release a hold, if typed "On hold" text looks like a hold mark, or if the overdue message survives its release.
"""

[[criterion]]
id = "edits_and_stale_edit"
name = "edits_and_stale_edit"
type = "binary"
weight = 3.0
description = """
Part A.
As gwen@kittle.test in M-13 post "Version one <i>JUDGE-E1</i>" exactly as written. Open M-13 as gwen@kittle.test in a second, separate browser context too, and there open the edit box for that message so it holds that text; leave it open. In the first context edit the message to "Version two JUDGE-E1" and save, recording the edit request.
1. It shows "edited"; as harriet@kittle.test its earlier version can be opened and reads "Version one <i>JUDGE-E1</i>" with the angle-bracket text shown literally, not as italics.
2. In the second context's still-open edit box, change the text to "Version stale JUDGE-E1" and save: the edit is refused with a reason in words shown next to the edit box that is still there about ten seconds later, "Version stale JUDGE-E1" stays in the edit box, and after a reload the message reads "Version two JUDGE-E1".
3. As sian@kittle.test open M-13 (she can see it, as a positive control) and note the message's current version or other change marker from the request that loads the thread. Replay Gwen's recorded edit request with the text "Hijack JUDGE-E1" and, if the request carries a version or similar field, that current value, so that only authorship can explain a refusal: it is refused and the message still reads "Version two JUDGE-E1".
4. The M-13 transcript shows the message as "Version two JUDGE-E1" marked edited.
Fails if the edit lacks the edited mark or its literal earlier version, if the stale edit overwrites the newer one or throws the typed text away, if Sian can edit Gwen's message, or if the transcript does not mark the edit.
Part B.
As harriet@kittle.test in M-13 post "Plain note JUDGE-ME1"; as dev@kittle.test the mentions list has no JUDGE-ME1. As Harriet edit it to "@Dev plain note JUDGE-ME1": Dev's mentions list now shows JUDGE-ME1. Edit it again to "Plain note JUDGE-ME1 done": Dev's mentions list no longer shows JUDGE-ME1. Then post "@Dev short lived JUDGE-ME2": Dev's mentions list shows it (positive control). Delete it with the app's control: Dev's mentions list no longer shows JUDGE-ME2. Re-open or reload Dev's mentions list for each check.
Fails if a mention edited into a message does not reach Dev's list, if a mention edited out stays on it, or if a deleted message's mention stays on it.
Both parts must hold; failing either fails this criterion.
"""

[[criterion]]
id = "safe_formatting"
name = "safe_formatting"
type = "binary"
weight = 1.5
description = """
As gwen@kittle.test in M-13 post this exact text: "Notes JUDGE-F1 *bold part* `code part` <img src=x onerror=alert(7)> <script>alert(8)</script> [click](javascript:alert(9)) https://example.org/lease". Then reply to it with "> quoted line JUDGE-F2" on its own line.
1. "bold part" appears bold, "code part" appears in a code style, the https address is a link that opens in a new tab, and the reply's line starting with "> " is shown as a quote (positive controls).
2. The img, script and javascript: parts show literally as text; no image element, script or dialog is created, and the javascript: text is not a working link. Check the thread, the reply's quote, a search for "JUDGE-F1" (the snippet), and the M-13 transcript; a shortened quote or snippet is fine, and whatever part of the text it shows must appear literally.
3. The seeded M-11 message beginning "Pasted from the lease:" shows its tags such as <b>Schedule 2</b> literally, as typed, in the thread and the transcript.
Fails if any markup is interpreted, any dialog appears, any javascript: link is clickable, or the simple formatting does not render.
"""

[[criterion]]
id = "message_links"
name = "message_links"
type = "binary"
weight = 1.5
description = """
As harriet@kittle.test, copy the link of the M-13 message "Draft will sent for your review." with the app's control and post "See draft JUDGE-P1 " followed by that link in M-11. In M-11 a short preview of the linked message is shown; as gwen@kittle.test (who can see M-13) the preview shows too, and following the link opens M-13 at that message. Then, as harriet@kittle.test, post "Temp JUDGE-P2" in M-13, copy its link, post "Gone soon JUDGE-P3 " plus that link in M-11, and delete JUDGE-P2 with the app's delete control: JUDGE-P3 now shows "not available" for the link, with no text of JUDGE-P2.
Fails if the preview or link opening does not work, or if a deleted message's text stays visible through a link.
"""

[[criterion]]
id = "unread_and_new_messages_line"
name = "unread_and_new_messages_line"
type = "binary"
weight = 1.5
description = """
Sign in as dev@kittle.test in two separate browser contexts. In the first, open M-13 so it is read up to its newest message, then open M-11; in the second, open M-11. Within about ten seconds M-13 shows no unread count in either context, and both stay on M-11 until a step says otherwise. Then as harriet@kittle.test post three messages in M-13, "Unread one JUDGE-U1", "Unread two JUDGE-U2" and "Unread gone JUDGE-U3", and delete JUDGE-U3 with the app's control.
1. Within about ten seconds, without reloading, Dev's M-13 count shows 2 in both contexts; the deleted message does not count.
2. In the first context Dev opens M-13: a "new messages" line sits just above JUDGE-U1, and within about ten seconds, without reloading, the second context shows no unread count for M-13.
3. Dev marks JUDGE-U2 unread from that message: within about ten seconds both contexts show 1 for M-13, and on reopening M-13 the line sits just above JUDGE-U2.
4. As gwen@kittle.test, with M-11 open, M-13 shows her own unread count of at least 2, which Dev's reading did not clear.
Fails if a count is wrong, differs between Dev's contexts after the wait, or counts the deleted message, if the new-messages line is missing or misplaced, if mark-unread does not move it, or if Gwen's count follows Dev's.
"""

[[criterion]]
id = "sent_once_in_order"
name = "sent_once_in_order"
type = "binary"
weight = 2.5
description = """
Part A.
As sian@kittle.test in M-11, post "Sent once JUDGE-D1" and record the request. Replay exactly the same request twice from the app page, as if the reply had been lost. Reload: JUDGE-D1 appears exactly once in M-11, once in search for "JUDGE-D1" and once in the M-11 transcript. Then post "Sent once JUDGE-D2" normally through the box: it appears once (positive control that sending still works).
Fails if JUDGE-D1 appears more than once anywhere, or if normal sending stops working.
Part B.
As harriet@kittle.test post three top-level messages in M-11 in this order, quickly: "Order C JUDGE-O", "Order A JUDGE-O", "Order B JUDGE-O". In the M-11 thread for harriet@kittle.test and for gwen@kittle.test, after reloads, in a search for "JUDGE-O" and in the M-11 transcript, they appear in the order C, A, B every time.
Fails if the order differs in any of these places or between reloads.
Both parts must hold; failing either fails this criterion.
"""

[[criterion]]
id = "live_updates_keep_my_work"
name = "live_updates_keep_my_work"
type = "binary"
weight = 1.5
description = """
As harriet@kittle.test post "Live base JUDGE-LB" and "Live gone JUDGE-LG" in M-13. In a separate browser context sign in as gwen@kittle.test, open M-13, scroll the thread so it is not at the very bottom and note which message is at the top of the view, open the reply box on "Draft will sent for your review." and type "Half typed JUDGE-LV" without sending. Then as Harriet: post "Live arrival JUDGE-LA", reply to JUDGE-LB with "Live reply JUDGE-LR", edit JUDGE-LB to "Live base JUDGE-LB JUDGE-LE", and delete JUDGE-LG.
Back in Gwen's page, without reloading, within about ten seconds: JUDGE-LA appears, JUDGE-LR appears under JUDGE-LB, the JUDGE-LE edit shows, and JUDGE-LG is gone. "Half typed JUDGE-LV" is still in the reply box, the reply box is still open on the same message, and the thread has not jumped to a different place.
Fails if any of the four changes does not appear without a reload, or if the draft, open reply box or scroll position is lost.
"""

[[criterion]]
id = "search_and_transcript"
name = "search_and_transcript"
type = "binary"
weight = 4.0
description = """
Part A.
As gwen@kittle.test search "survey BOOKED": the M-11 message "Survey booked for Friday." is found, regardless of case, and clicking that result opens M-11 at that message. Searching "notice recieved" (the earlier version of the held "Landlord's notice received and filed.") finds nothing, while "notice received and filed" finds the message. Gwen's search for "heads of terms" returns nothing from M-12.
Fails if case matters, if clicking does not open the message, or if earlier versions or other clients' matters appear in results.
Part B.
As harriet@kittle.test in M-11 post "Transcript parent JUDGE-T0" and reply to it with "Transcript child JUDGE-T1". Then open the M-11 transcript.
1. It is headed with "M-11", "Pryce lease dispute" and the generated time 2026-05-12 11:00 (any clear date-time format), and has no message box, send, reply, edit or delete controls.
2. Messages are oldest first and in their threads: JUDGE-T1 sits under JUDGE-T0, each message shows its author, and each shows its own sent time; for example "Survey booked for Friday." shows 2026-05-08 15:00 (any clear format), not the generated time.
3. "Landlord's notice received and filed." is marked On hold and shows both its versions, including "Landlords notice recieved.".
Fails if any heading part, thread placement, author, sent time, hold mark or version is wrong or missing, or if chat controls appear.
Part C.
As gwen@kittle.test in M-11 post "Deposit is 100% JUDGE-Q1", "Deposit is 1000 pounds JUDGE-Q2", "Ref A_1 JUDGE-Q3" and "Ref AB1 JUDGE-Q4". Search "100%": JUDGE-Q1 is found and JUDGE-Q2 is not. Search "A_1": JUDGE-Q3 is found and JUDGE-Q4 is not. Then post "Code X*9 JUDGE-Q5" and "Code XY9 JUDGE-Q6". Search "1000 pounds": JUDGE-Q2 is found (positive control). Search "X*9": JUDGE-Q5 is found and JUDGE-Q6 is not. Search "urvey booked": "Survey booked for Friday." is found, because search matches the characters typed, even inside a word.
Fails if %, _ or * acts as a wildcard or operator, if part of a word is not found, or if a literal match is missed.
All three parts must hold; failing any fails this criterion.
"""

[[criterion]]
id = "persistence"
name = "persistence"
type = "binary"
weight = 4.0
description = """
Before restarting, as harriet@kittle.test:
