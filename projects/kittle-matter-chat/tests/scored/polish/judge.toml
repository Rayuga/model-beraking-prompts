[judge]
# Judge agent and model are set once for all dimensions by REWARDKIT_JUDGE /
# REWARDKIT_MODEL in task.toml [verifier.env]; the value here is only the
# fallback agent type for local runs.
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "enter_sends"
name = "enter_sends"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test open M-13, click in the message box and type "Enter check JUDGE-K1", press Shift+Enter, type "second line JUDGE-K1" and press Enter. Exactly one message is sent, showing both lines with "second line JUDGE-K1" on its own line, and the message box is empty afterwards. Fails if Shift+Enter sends, if Enter does not send, if the lines arrive as two messages, or if the box still holds the text.
"""

[[criterion]]
id = "escape_closes"
name = "escape_closes"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test in M-13 post "Escape check JUDGE-K3". Open its edit control, change the text to "Escaped edit JUDGE-K3" and press Escape: the edit closes without saving, and after a reload the message still reads "Escape check JUDGE-K3" with no "edited" mark. Then open the reply control on it, type "Escaped reply JUDGE-K3" and press Escape: the reply closes, and after a reload no "Escaped reply JUDGE-K3" was posted. Fails if Escape saves or posts anything, leaves either box open, or changes the message.
"""

[[criterion]]
id = "delete_confirm"
name = "delete_confirm"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test in M-13 post "Confirm check JUDGE-K2" and use its delete control. The app asks to confirm before anything is deleted (in the page or as a browser dialog). Decline: the message stays, also after a reload. Use the delete control again and confirm: the message goes. Fails if one click deletes without asking, or if declining deletes the message.
"""

[[criterion]]
id = "link_highlight"
name = "link_highlight"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test search "Survey booked" and open the result for "Survey booked for Friday.". M-11 opens with that message in view and visibly highlighted, marked differently from the messages around it, and, without opening anything else, it is still highlighted about ten seconds later. Then in M-13 use the copy-link control on "Draft will sent for your review.", open M-11, and go to the copied address in the browser: M-13 opens with that message highlighted the same way. Fails if nothing sets the opened message apart on either route, or if the highlight is gone after about ten seconds.
"""

[[criterion]]
id = "transcript_print"
name = "transcript_print"
type = "binary"
weight = 1.0
description = """
At 390 by 844, signed in as gwen@kittle.test, open the M-11 transcript. It lists M-11's messages, including "Survey booked for Friday." (positive control). Confirm documentElement.scrollWidth equals the viewport width and every message's text can be read without scrolling sideways.
"""

[[criterion]]
id = "refusal_in_place"
name = "refusal_in_place"
type = "binary"
weight = 1.0
description = """
Sign out, then try to sign in as gwen@kittle.test with a wrong password, and wait about ten seconds without touching anything. The reason must appear in words next to the sign-in form and still be there after the wait. Then sign in with the right password: no reason is shown. Fails if the refusal shows no reason, shows it only as a passing toast that has gone after the wait, or shows it far from the form.
"""
