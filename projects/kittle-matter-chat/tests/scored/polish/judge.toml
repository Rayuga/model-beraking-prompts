[judge]
# Judge agent and model are set once for all dimensions by REWARDKIT_JUDGE /
# REWARDKIT_MODEL in task.toml [verifier.env]; the value here is only the
# fallback agent type for local runs.
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "timer_label"
name = "timer_label"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test open M-11. Confirm the disappearing-messages setting sits next to the matter title and can be read at a glance, without opening a menu or settings panel.
"""

[[criterion]]
id = "hold_mark"
name = "hold_mark"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test open M-13. Confirm the On hold mark on the executor message is visible without hovering.
"""

[[criterion]]
id = "phone_matter"
name = "phone_matter"
type = "binary"
weight = 1.0
description = """
At 390 by 844 signed in as gwen@kittle.test with M-11 open, confirm documentElement.scrollWidth equals the viewport width and the message box is reachable.
"""

[[criterion]]
id = "transcript_print"
name = "transcript_print"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test open the M-11 transcript. Confirm each reply is clearly shown as part of the thread it answers, by its placement or by a visible reply-to label, so a thread can be followed without opening anything.
"""

[[criterion]]
id = "refusal_in_place"
name = "refusal_in_place"
type = "binary"
weight = 1.0
description = """
Sign out, then try to sign in as gwen@kittle.test with a wrong password, and wait about ten seconds without touching anything. The reason must appear in words next to the sign-in form and still be there after the wait. Then sign in with the right password: no reason is shown. Fails if the refusal shows no reason, shows it only as a passing toast that has gone after the wait, or shows it far from the form.
"""
