[judge]
# Judge agent and model are set once for all dimensions by REWARDKIT_JUDGE /
# REWARDKIT_MODEL in task.toml [verifier.env]; the value here is only the
# fallback agent type for local runs.
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "timer_label"
name = "timer_label"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test open M-11. Confirm the thread shows that messages disappear after 7 days, near the matter title.
"""

[[criterion]]
id = "hold_mark"
name = "hold_mark"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test open M-13. Confirm the On hold mark on the executor message is visible without hovering.
"""

[[criterion]]
id = "phone_matter"
name = "phone_matter"
type = "binary"
weight = 1.0
description = """
At 390 by 844 signed in as gwen@kittle.test with M-11 open, confirm documentElement.scrollWidth equals the viewport width and the message box is reachable.
"""

[[criterion]]
id = "transcript_print"
name = "transcript_print"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test open the M-11 transcript. Confirm it is a clean, readable page without the chat composer or navigation controls inside the listing.
"""

[[criterion]]
id = "refusal_in_place"
name = "refusal_in_place"
type = "binary"
weight = 1.0
description = """
As gwen@kittle.test try something the app refuses, such as signing in with a wrong password or editing a message from an out-of-date page, and also do the same action successfully. The refusal reason must appear next to the control or message you used, in words, and stay until you change what you typed; the successful action shows its result without a reason. Fails if a refusal shows no reason, shows it only as a passing toast that disappears by itself, or shows it far from the control.
"""
