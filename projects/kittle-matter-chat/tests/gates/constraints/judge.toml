[judge]
# Judge agent and model are set once for all dimensions by REWARDKIT_JUDGE /
# REWARDKIT_MODEL in task.toml [verifier.env]; the value here is only the
# fallback agent type for local runs.
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "server_backed_local_application"
name = "server_backed_local_application"
type = "binary"
weight = 1.0
description = """
Confirm the application is reached from the local server at
http://localhost:3000 and renders a real application surface rather than a
blank page, static mock, missing backend, or broken shell. Under the declared
public network posture, external font, script, or CDN asset requests are
allowed and must not fail this gate. Sign in as
gwen@kittle.test, post "Gate check JUDGE-G1" in her matter M-11 and reload the
page: the message is still shown. Then, in a separate browser context, sign in
as harriet@kittle.test and open M-11: "Gate check JUDGE-G1" is shown there too.
A message that never saves, or that only the posting browser can see, fails
this gate. This gate does not grade roles, correctness, or feature
completeness.
"""
