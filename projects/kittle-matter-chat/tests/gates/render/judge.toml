[judge]
# Judge agent and model are set once for all dimensions by REWARDKIT_JUDGE /
# REWARDKIT_MODEL in task.toml [verifier.env]; the value here is only the
# fallback agent type for local runs.
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "authenticated_render"
name = "authenticated_render"
type = "binary"
weight = 1.0
description = """
Open the application at localhost:3000 in a fresh browser and confirm it is
reachable and renders a real Kittle & Rowe matter chat (not a blank page, static
mock, generic error, or fatal browser error). Confirm nothing private is
visible before sign-in, an incorrect password is rejected, and
gwen@kittle.test with password password123 opens her matters and their messages.

This is a basic reachability/sign-in gate only. If the gate fails, assign 0;
if the signed-in populated surface loads without any of the basic failures
above, assign 1.
"""
