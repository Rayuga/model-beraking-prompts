[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

# Criterion weights: 1.0 standard, 1.5 important, 2.0 core to the brief (Visual Likert rows are equal).

[[criterion]]
id = "hro_vis_type"
name = "hro_vis_type"
type = "likert"
points = 5
weight = 1
description = """
Judge desktop typography on the board, conversations and activity.
5: clear consistent type scale, readable names, labels and messages, deliberate hierarchy.
4: mostly consistent with minor size or weight issues.
3: noticeable inconsistency or crowded text.
2: several important labels or messages hard to read.
1: typography broadly illegible or unstructured.
"""

[[criterion]]
id = "hro_vis_color"
name = "hro_vis_color"
type = "likert"
points = 5
weight = 1
description = """
Judge palette and contrast across staff and candidate views, including badges, stage markers and the rejected stage.
5: cohesive palette, readable contrast, restrained distinct accents.
4: minor palette or contrast imperfections.
3: noticeable low contrast or inconsistent accents.
2: substantial readability or palette problems.
1: colour treatment broadly prevents reading.
"""

[[criterion]]
id = "hro_vis_layout"
name = "hro_vis_layout"
type = "likert"
points = 5
weight = 1
description = """
Judge spacing and alignment of the board columns and cards and of the conversation pane.
5: coherent spacing scale, stable aligned columns and messages, deliberate density.
4: minor spacing inconsistencies.
3: several cramped or drifting groups.
2: frequent crowding or collisions.
1: composition broadly broken.
"""

[[criterion]]
id = "hro_vis_hierarchy"
name = "hro_vis_hierarchy"
type = "likert"
points = 5
weight = 1
description = """
Assess prominence of the job, stage headings, card names, unread counts and primary actions against supporting detail.
5: clear scan order and primary/supporting distinction on every examined surface.
4: mostly clear with occasional competing emphasis.
3: several important items visually buried.
2: weak distinction among navigation, headings and data.
1: no coherent visual order.
"""

[[criterion]]
id = "hro_vis_consistency"
name = "hro_vis_consistency"
type = "likert"
points = 5
weight = 1
description = """
Assess whether cards, forms, conversation, activity and empty states share one finished visual language.
5: components and secondary states have a coherent deliberate treatment.
4: one or two isolated inconsistent components.
3: repeated mismatch among component families.
2: many unfinished or inconsistent surfaces.
1: no coherent component treatment.
"""
