[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "hro_vis_type"
name = "Typography"
type = "likert"
points = 5
weight = 1.0
description = """
Judge desktop typography on dashboard, dense offer economics and audit history.
5: clear consistent type scale, readable labels and numbers, deliberate alignment.
4: mostly consistent with minor alignment or size issues.
3: noticeable inconsistency or crowded text.
2: several important labels or numbers difficult to read.
1: typography broadly illegible or unstructured.
"""

[[criterion]]
id = "hro_vis_color"
name = "Color and contrast"
type = "likert"
points = 5
weight = 1.0
description = """
Judge palette and contrast across available light/dark presentation and statuses. Theme functionality belongs to Polish; assess the appearance of states that exist without charging missing switching twice.
5: cohesive palette and readable foreground/background contrast with distinct restrained accents.
4: minor palette or contrast imperfections.
3: noticeable low contrast or inconsistent accents.
2: substantial readability or palette problems.
1: color treatment broadly prevents reading.
"""

[[criterion]]
id = "hro_vis_layout"
name = "Spacing and alignment"
type = "likert"
points = 5
weight = 1.0
description = """
Judge desktop spacing/alignment across a data-heavy screen and an ordinary form. Phone overflow belongs to Polish, not this row.
5: coherent spacing scale and stable aligned groups with deliberate density.
4: minor spacing inconsistencies.
3: several cramped or drifting groups.
2: frequent crowding or collisions.
1: composition broadly broken.
"""

[[criterion]]
id = "hro_vis_hierarchy"
name = "Information hierarchy"
type = "likert"
points = 5
weight = 1.0
description = """
Assess prominence of primary metrics/navigation/actions versus supporting economics across dashboard, offers and history; fewer correctly authorized actions are not a defect.
5: clear scan order and primary/supporting distinction across all examined surfaces.
4: mostly clear with occasional competing emphasis.
3: several important figures or actions visually buried.
2: weak distinction among navigation/headings/data.
1: no coherent visual order.
"""

[[criterion]]
id = "hro_vis_consistency"
name = "Component consistency"
type = "likert"
points = 5
weight = 1.0
description = """
Assess whether forms,tables,cards,details and available empty/error surfaces share a finished visual language. Score consistency across surfaces; do not repeat typography/palette/spacing defects merely because they exist.
5: components and secondary states have a coherent deliberate visual treatment.
4: one or two isolated inconsistent components.
3: repeated mismatch among component families.
2: many unfinished or inconsistent component surfaces.
1: no coherent component treatment.
"""

