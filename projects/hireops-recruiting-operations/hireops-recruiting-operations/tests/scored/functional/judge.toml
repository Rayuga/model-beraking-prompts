[judge]
judge = "claude-code"
mode = "individual"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

# Criterion weights: each criterion runs in its own judge session (mode = "individual"). Each leg of a criterion is weighted 1.0 standard, 1.5 important or 2.0 core to the brief, and a criterion's weight is the sum of its legs' weights (61 in all), so bundles are not re-weighted.
# Timeout: individual mode was set at the lead's instruction (relayed by the task owner, 8 October 2026). RewardKit applies [judge].timeout to each criterion's session, so 15 sessions x 600 s plus polish 900 s and visual 900 s = 10800 s fits the scored-suite budget of 11100 s in tests/test.sh. Not yet measured against a configured judge run.
# Legs: intake_restart 4.5 = job opening 1 + adding 1 + email rules 1 + restart 1.5; moves 4 = one stage 1.5 + bottom 1 + re-order 1.5; reject_reopen 3 = reject 1 + hired 1 + reopen 1; two_people 4 = stale move 2 + live board 2; interview_places 5.5 = full 1.5 + free place 1 + undo full 1 + put back 2; bulk 5 = move 1.5 + all or none 2 + places 1.5; undo 5 = restores 2 + conflict 2 + once 1; activity 2 = lines 1 + refusals 1; manager_roles 4 = late stages 1 + early refused 1 + other job 1 + notes 1; readonly_roles 4.5 = observer 1 + candidate 1 + anonymous 1.5 + statuses 1; messaging 4 = exchange 1.5 + compose 1 + access 1.5; drafts 2; long_thread 5.5 = latest 1.5 + earlier 2 + scrolled up 2; unread_seen 3.5 = unread 2 + seen 1.5; candidate 4.5 = view 1.5 + private 2 + linked 1.

[[criterion]]
id = "hro_intake_restart"
name = "hro_intake_restart"
type = "binary"
weight = 4.5
description = """
Steps. (1) Before anything else, as Rafael and without opening any conversation, read the seeded Platform Engineer board: Applied reads Greta Lindqvist, Ade Bello, Marco Rossi and Screen reads Priya Nair, Samuel Ortiz, in that order; open Noor Haddad's card there: its internal note reads 'Strong systems answers; weaker on incident follow-up.' Move nothing on that job. (2) Open job J1 with hiring manager Ingrid Sorensen and 2 interview places, and job J2 with hiring manager Bill Okafor and 2 places; also try to open a job with a blank title, with places 0, 51 and 2.5, and (by replaying the observed request) with a Recruiter's account as the hiring manager. (3) Add six candidates to J1 (A to F in that order) and read them as Mei Lin in an independent context. On J1 try adding an invalid email address and A's address in different letter case; add A's address to J2 (the control). (4) Move B to Screen, move E up one place within Applied, reject F with a suffixed reason, add an internal note to one J1 card, send one suffixed message in Noor's Platform Engineer conversation, and record your jobs, their card order per stage, F's rejection and reason, that note, that message, your unread total and the Activity lines of J1, with the seeded Platform Engineer order and note. Call restart_app once, then sign in again in a fresh independent context and compare. A reload is not a restart; if restart_app reports an error or cannot be called, this criterion is 0. Bar. The seeded Platform Engineer order and Noor's note are as quoted. Each job opens with its title, and any team, manager or places value the app shows matches what was entered; an independent context sees it. The blank title, places 0, 51 and 2.5 and the Recruiter-as-manager are refused with nothing created. Added candidates appear at the bottom of Applied in the order added with the entered name, Mei reads the same order, and any email or source the app shows matches what was entered. The invalid and different-case addresses are refused with no new card, the refusal is shown at the email field and the typed name, email and source stay in the form; the same address on J2 is accepted. After the restart everything recorded is unchanged (nothing lost, reordered or duplicated) and the starting data is not loaded again (the seeded jobs appear once). Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_moves"
name = "hro_moves"
type = "binary"
weight = 4
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) with 2 interview places and add A, B, D, E in that order. Through ordinary controls (no dragging required): move A Applied to Screen; move B Applied to Screen; move A Screen to Interview; try A Interview to Hired and A Interview to Applied; move A back Interview to Screen; read Screen's order again as Mei Lin in an independent context. Move a card up and down within Applied and read the order, also as Mei Lin. Bar. Every one-stage move forward and back works through ordinary non-drag controls and the mover's page shows the card in its new stage at the first look after the action, without a reload or another person's update; the two skips (Interview to Hired, Interview to Applied) are refused with the card unchanged. B lands below A, and A, moved back into Screen, lands below B; Mei reads the same order. A card's place within a stage changes up and down with ordinary controls and Mei reads the same order. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_reject_reopen"
name = "hro_reject_reopen"
type = "binary"
weight = 3
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) with 2 interview places and add C, D, E, F, G, H. Reject C from Applied, first with a blank reason and then with a reason; undo that rejection; reject it again with a reason; read the rejected-from stage and reason; try to reopen C to Screen; reopen it to Applied; undo that reopening; reopen it again. Move E to Screen and reject it with a reason; try to reopen it to Applied and to Interview; reopen it to Screen. Advance D one stage at a time to Hired and try to reject it. Move F and G one stage at a time into Interview; reject F from Interview with a reason; move H into Interview (2 of 2); try to reopen F; move H back to Screen; reopen F. Bar. A blank reason is refused; a rejection with a reason moves the card to Rejected and staff can read the reason and the stage it was rejected from (on the card, its details, its reopen control or its Activity line); undoing the rejection puts C back in Applied at its place. A rejected card reopens only to the stage it was rejected from (C to Screen refused; E to Applied and to Interview refused, each with the card unchanged); after reopening the reason is gone; undoing the reopening puts C back in Rejected with its reason. Whether a reason is present is read from the card's current state (the card, its details or reopen control, or a fresh board or card read the UI makes), never from Activity, whose old rejection line keeps it by design. Rejecting the Hired card is refused and it stays Hired. Reopening F while Interview is full is refused with F still Rejected, and once a place is free F reopens to Interview. All of this works through ordinary non-drag controls. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_two_people"
name = "hro_two_people"
type = "binary"
weight = 4
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) and add F, G and H. (1) Move F Applied to Screen on this page and capture that request, including whatever version or freshness value it sends. In an independent context Mei Lin moves F Screen to Applied. Replay the captured request from this page exactly as it was sent; it now comes from an out-of-date view of F. (2) Keep this page on the job's board as Rafael. As one timed observation, Mei Lin in her own independent context moves G to Screen and adds a new suffixed card to the job, and this page is read until both show. Bar. The out-of-date move is refused with status 409 and changes nothing; F stays where Mei put it; the refusal says the card was changed and identifies who changed it, by name in the response or on screen, or by an identifier that the app's own staff data shows belongs to Mei. The original move is the control. Within 15 seconds, without reload or click, this page shows Mei's move in the new stage and place and shows her new card. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_interview_places"
name = "hro_interview_places"
type = "binary"
weight = 5.5
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) with 2 interview places and add A, B, E. Move A and B one stage at a time into Interview (2 of 2). Move E to Screen and try Screen to Interview through the UI. Then replay the captured successful move request with E and Interview in Rafael's session. Re-order A and B inside Interview. Move A to Offer, then E into Interview, then E back to Screen (Rafael's latest move). As Mei Lin in an independent context move A Offer to Interview (2 of 2 again). As Rafael undo the E move. As Mei Lin move A Interview to Offer; as Rafael undo the E move again. Bar. The move into the full Interview is refused through the UI and by replay and E stays in Screen; A and B entering Interview are the control. On the page that tried it, E is shown in its real stage and place, the reason is shown (on or for that card, or a message shown right after the attempt that is about that move), and keyboard focus is on a control of that card (document.activeElement inside the card or its open details). Two other ways meet the same three legs: a UI that refuses before the card moves, and a UI that does not offer the move at all where that card itself shows why (Interview is full) and focus is on a control of that card after you looked for the move there. Re-ordering inside the full Interview is allowed and the freed place is taken at once. The undo that would overfill Interview is refused with nothing changed; once a place is free the same undo goes ahead and E is back in Interview. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_bulk"
name = "hro_bulk"
type = "binary"
weight = 5
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) with 2 interview places and add V, W, X, Y, Z and then A2. Through ordinary controls (no dragging required), capturing the request of the first successful multi-card move for the replays: (1) move V to Screen; (2) move Y up two places within Applied (Applied reads Y, W, X, Z, A2); (3) select W, X and Y (in that order) and move them to Screen together, and read Screen's order as Mei Lin in an independent context; (4) select V and Z and try Interview (Z would skip), and replay the captured multi-card request with V, Z and Interview; (5) select V, W, X and try Interview (3 into 2 places), and replay it with V, W, X and Interview; (6) select V and X and move them to Interview; (7) as Mei Lin move X back to Screen; (8) as Rafael select V (Interview) first and then W (Screen) and try Applied (V would skip Screen), and replay it with V, W and Applied; (9) select V (Interview) and A2 (Applied) and move them to Screen together, and read Screen's order as Mei Lin. Bar. The three cards move in one action and land below V ordered as the board had them (Y, W, X), not in selection order; V and A2 from different stages land together at the bottom of Screen as A2, V; Mei reads the same orders. The sets with a skipping card (first in board order in step 4, last and selected first in step 8) and the three into two places are each refused through the UI and by replay with none of the set moved; steps 3, 6 and 9 are the control. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_undo"
name = "hro_undo"
type = "binary"
weight = 5
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) with 2 interview places and add V, W, X, Y, Z and then A2. (1) Move V to Screen and undo it. (2) Move V to Screen again; move Y up two places within Applied. (3) Select W, X and Y and move them to Screen together; undo; read Applied as Mei Lin in an independent context; try to undo again and replay that undo request. (4) Move W, X, Y to Screen together again; select V and X and move them to Interview; as Mei Lin move X back to Screen; as Rafael try to undo the V-and-X move (UI and replay). (5) Move Z Applied to Screen, then A2 Applied to Screen, add an internal note to A2, and as Mei Lin re-order Y within its stage; undo once; then try to undo again (UI and replay). (6) Select Y and W and move them to Applied together; as Mei Lin move W one place within Applied; as Rafael try to undo (UI and replay). (7) Move Z Screen to Applied; as Mei Lin reject Z with a reason; as Rafael try to undo. (8) Reject Y with a reason; as Mei Lin reopen Y; as Rafael try to undo the rejection (UI and replay). Bar. Undo of V's move puts V back at the top of Applied; undo of the three-card move puts Y, W and X back in Applied at their places (Y, W, X, Z, A2) with V still in Screen, and Mei reads the same. The repeated undo in step 3 is refused. The undo is refused with nothing changed after another person moved one card of the move to another stage (4), re-ordered one within its stage (6), rejected one (7) and reopened a card Rafael rejected (8); the undo in step 5 goes ahead because only a note and a different card changed, and A2 is back in Applied; after it a further undo is refused and Z stays in Screen. If Mei's re-order, rejection or reopening itself does not work (graded in hro_moves and hro_reject_reopen), the undo leg it was meant to trigger is left out. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_activity"
name = "hro_activity"
type = "binary"
weight = 2
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) and add four cards. Through ordinary controls: move one card to Screen; move two cards to Screen together; re-order a card within Applied; reject a card with a suffixed reason and reopen it; undo your latest move. Try one blank-reason rejection and one skipped stage. Read the Activity view, then filter it to this job, then read the same lines as Aud Halvorsen (Observer) in an independent context. Bar. Activity has a readable line naming who and what changed (the stages for moves) for every successful action of this session on the job: the opening, each addition, each card of the single and multi-card moves (one line naming every card of a multi-card move with its stages also counts), the rejection with its reason, the reopening, the re-ordering and the undo; notes need not appear. Lines are newest first; the unfiltered view shows them among other jobs' lines (all jobs), and the filter shows all of this job's lines and only this job's; the refused attempts added no line; the Observer reads the same lines. A line is expected only for an action that succeeded in this session; an action that did not succeed (for example an undo the app refused) needs no line, and its own failure is graded in its own criterion. If no stage move succeeded in this session, this criterion is 0. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_manager_roles"
name = "hro_manager_roles"
type = "binary"
weight = 4
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) J1 with hiring manager Ingrid Sorensen and 4 interview places, and a job J2 with hiring manager Bill Okafor. Add seven cards to J1 and, as Rafael, move cards so that J1 has cards in Applied, Screen and Interview (three in Interview). As Ingrid in an independent context: move an Interview card to Offer, to Hired and back to Offer; re-order cards in Offer or Interview; reject one card from Interview with a reason and reopen it; reject one from Offer with a reason and reopen it to Offer; try Applied to Screen, Screen to Interview, Interview to Screen, rejecting a Screen card and re-ordering cards within Applied. As Rafael reject a J1 Screen card with a reason; as Ingrid try to reopen it; then as Rafael reopen it (the control). As Rafael also move one J1 Interview card back to Screen and forward again, and re-order two Applied cards, as controls for Ingrid's refused equivalents. As Ingrid try to open a job and to add a candidate (replay Rafael's observed requests if not offered). As Rafael move two J1 Applied cards to Screen together once, capturing that request. As Ingrid select one Offer card and one Screen card and try to move them to Interview together (if the UI does not offer it, replay Rafael's captured multi-card request in her session with those two cards and Interview); then as Rafael make the same two-card move as the control. As Bill Okafor try a move, a re-order, a rejection, a reopening and a note on J1 cards through the UI; for any that is not offered, replay Rafael's observed request of that kind (fresh legal values) in Bill's session. As Rafael add an internal note on a J1 card; as Ingrid add a note on a J1 card; as Aud Halvorsen (Observer) in an independent context read both notes. Bar. Ingrid's late-stage moves, re-orders, rejections from Interview and Offer and their reopenings all succeed. Her multi-card move of an Offer card with a Screen card is refused with neither card moved, while Rafael's identical move succeeds. Her Applied to Screen, Screen to Interview and Interview to Screen, rejecting a Screen card, re-ordering within Applied, reopening the Screen rejection, opening a job and adding a candidate are each refused with nothing changed (UI or replay); Rafael's identical requests are the control. Bill's move, re-order, rejection, reopening and note on J1 are each refused by the server with nothing changed, through the UI or by replay (hiding the controls is optional); Ingrid's move and Rafael's note are the controls. Rafael's and Ingrid's notes are saved and the Observer reads both. A refusal leg for Ingrid or Bill exists only for a request kind whose Rafael control succeeded in this session (otherwise that feature is graded in its own criterion). Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_readonly_roles"
name = "hro_readonly_roles"
type = "binary"
weight = 4.5
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) and add five cards. As Rafael perform and capture one move, one multi-card move, one re-order within a stage, one reject, one reopen, one undo, one open-job (a second suffixed job), one add-candidate and one note request, one board read, one Activity read, one card-detail or notes read, one conversation read and one message send (open the conversation of a card you added in this session and send a suffixed message there). As Aud Halvorsen (Observer) in an independent context sign in and load the board, then replay the move, multi-card move, re-order, reject, reopen, undo, add-candidate, open-job and note requests (fresh legal values as described above). As Tomas Varga (candidate) in an independent context sign in and load his applications list, then replay the same nine requests. In a fresh context with no credentials replay the board read, Activity read, card-detail or notes read, conversation read, move, multi-card move, re-order, reject, reopen, undo, add-candidate, note and message requests. Bar. Every one of those replays is refused with nothing changed and returns no workspace data: the Observer's with 403; Tomas's with 403, or 404 when the request names an application that is not his; the anonymous ones with 401. The Observer's board and Tomas's list load in their sessions (the session controls) and Rafael's requests succeeded (the same-kind controls). A refusal leg exists only for a request kind whose staff control succeeded in this session (otherwise there is nothing of that kind to refuse, and that feature is graded in its own criterion); if no kind has a successful control, this criterion is 0. Whether the Observer's screens show write controls is the app's choice. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_messaging"
name = "hro_messaging"
type = "binary"
weight = 4
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) with hiring manager Bill Okafor and add a card for Tomas Varga with email tomas.varga@candidates.example; that gives Tomas a new conversation (if it never appears for him, which hro_candidate grades, use his seeded Data Analyst conversation instead, with Bill and Ingrid's legs judged on that job's own manager and another job's manager, and counts read relative to their values before you act). (1) As Rafael send a message there that includes the characters <b>plain</b>; as Tomas in an independent context read it and reply; watch the reply arrive on Rafael's open conversation (a timed observation). (2) Try sending a blank message. Type a two-line message using Shift+Enter, send with Enter, and read the box and focus; reload and open the conversation again and read the box. (3) As Mei Lin write in this conversation; as Bill write in it; as Ingrid Sorensen (not this job's manager) check it is not listed or is refused, and replay Rafael's observed read of it in her session; as Aud Halvorsen read it and look for a way to send. Replay Rafael's observed send request on it, with new text, in Aud's, Ingrid's and Noor Haddad's sessions. Bar. Rafael's message reaches Tomas and Tomas's reply appears on Rafael's open conversation within 15 seconds without reload. <b>plain</b> shows as those literal characters, not bold; the blank message is refused; Shift+Enter makes a new line, Enter sends and the line break is kept; afterwards the box is empty and still focused, and after the reload the sent text does not reappear. Mei and Bill write in it; Ingrid cannot open it and her read replay is refused with no messages returned; the Observer reads it with no send control or a refused send; the send replays are refused with nothing added, Aud's and Ingrid's with 403 and Noor's as not found (404). Rafael's own read and send are the controls. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_drafts"
name = "hro_drafts"
type = "binary"
weight = 2
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) and add two cards, so that two conversations of your own exist. As Rafael open the first conversation and type an unsent reply; open the second conversation, then the Board, then come back to the first, then reload, reading the first conversation's box each time. Type a different unsent reply in the second conversation and check each conversation keeps its own. Bar. Each unsent reply stays with its own conversation through the switch to another conversation, the Board and the reload, and the two conversations keep different drafts. That a sent message does not come back after a reload is graded only in hro_messaging. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_long_thread"
name = "hro_long_thread"
type = "binary"
weight = 5.5
description = """
Steps. As Rafael open Noor Haddad's Platform Engineer conversation (earlier sessions may have added messages to it; read counts relative to what it holds). Count the messages shown and their order and where the view is. Bring in earlier messages repeatedly, reading the counts, the order and the remaining count each time, until none remain. Then click into the message box and type an unfinished reply, scroll the message list up to earlier messages without clicking elsewhere (mouse wheel over the list, or set its scrollTop), and as Noor in an independent context (Mei Lin if Noor cannot send, which hro_messaging grades) send a suffixed message as a timed observation. Read Rafael's place, the notice, his reply text, document.activeElement and his unread count for that conversation; then go to the new message and read the count again. Scroll up to earlier messages again; Noor sends one more suffixed message (a timed observation); with Rafael still scrolled up, send a short reply with Enter and read his unread count for the conversation. Bar. Where Mei Lin stood in for a candidate who could not send, read that candidate's name in this Bar as Mei's. The conversation opens showing its most recent 30 messages, oldest of them first, scrolled to the newest. Earlier messages come in 30 at a time in order, with how many are still to come shown correctly, until none remain, with none missing or repeated. While Rafael is scrolled up with an unfinished reply, Noor's message does not move his place; within 15 seconds without reload he is told there is one new message; the reply still reads exactly what was typed and the box still has focus; the conversation stays unread until he goes to the new message, then it is read; and after Noor's next message, sending his own reply while still scrolled up leaves his unread count for it at 0 (sending counts as reading). Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_unread_seen"
name = "hro_unread_seen"
type = "binary"
weight = 3.5
description = """
Steps. (1) In an independent context sign in as Lena Fischer and, without opening it, read her unread count on her Product Designer conversation; the starting read markers give her 1. No other session opens Lena's conversation. (2) As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) with hiring manager Bill Okafor and add a card for Tomas Varga with email tomas.varga@candidates.example (if it never appears for him, use his seeded Data Analyst conversation and its own manager, with counts relative to their values before you act). Send one message in it as Rafael so it exists. Every reading below that follows another person's action is a timed observation; never reload, navigate or click in the observed page while it runs. (3) With Rafael's page on the Conversations view and this conversation not open, read his count on it and his total; Tomas sends two messages (if Tomas cannot send, which hro_messaging grades, Mei Lin sends them); read both again; open the conversation. With it open at its newest message, Tomas sends one more; read Rafael's count and total. Read Mei Lin's count for this conversation in her own session without opening it. (4) Close the conversation on Tomas's page with the app's own close or back control; if it has none, reload his page (a conversation opens only when he chooses one) and confirm that none is open. Rafael sends a new message; read it as not seen; Aud Halvorsen opens the conversation; read again; Tomas opens it; read on Rafael's page. (5) Move Rafael's page to the Board and keep Mei out of the conversation. Tomas sends a message and, with his page left open, Bill opens the conversation; read on Tomas's page. Close Bill's context. Tomas sends one more and Rafael opens the conversation; read on Tomas's page. Bar. Where Mei Lin stood in for a candidate who could not send, read that candidate's name in this Bar as Mei's. Lena's count is 1. Rafael's count and total each rise by exactly two within 15 seconds without reload or click, opening the conversation clears it, and the message that arrives while it is open at its newest does not raise either; his own messages never count. Mei's count equals the messages in it not written by her (she has not opened it). Rafael's message shows as not seen, is still not seen after only the Observer opened it, and shows as seen on his page within 15 seconds without reload after Tomas opens it. Tomas's message shows as seen on his page within 15 seconds without reload after Bill opens the conversation, and his next one after Rafael opens it. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_candidate"
name = "hro_candidate"
type = "binary"
weight = 4.5
description = """
Steps. As Rafael Costa (Recruiter) open a new job (any title and team, suffixed) and add a card for Tomas Varga with email tomas.varga@candidates.example. Sign in as Noor Haddad and as Tomas Varga in independent contexts and read their application lists, statuses and conversations. Capture every request the candidate pages make and inspect every response; if a candidate page keeps an event stream or socket open, also read what it receives (for example page.on('websocket') frames, or a new EventSource on the observed URL) and count those payloads as received responses. As Rafael add an internal note with a unique suffix to Tomas's new card and reject the card with a reason ending in a unique suffix, and read both back as Rafael (the control); search every candidate response for both; then reopen the card once, then move it one stage at a time to Hired, reading Tomas's status wording after each move (reload or re-open his applications list first). As Tomas replay the staff card-detail or notes read you observed as Rafael for a card that is not his, and the board read and the Activity read you observed as Rafael, and ask for the conversation of an application that is not his using an id you saw as staff. Bar. The card added with Tomas's email becomes his application and conversation when he signs in. Each candidate's own applications appear with job title, team and status in the candidate wording, including Noor's Platform Engineer (Infrastructure, Interviewing) and Product Designer (Design, Application received) and Tomas's Data Analyst (Finance Systems, In review); Tomas's new card reads Not moving forward, then Application received, In review, Interviewing, Offer and Hired as it moves; each can open and read their own conversations. No response a candidate page receives contains internal notes, a rejection reason, a rejected-from stage, board positions, other candidates or their applications, or activity, including while Tomas's card is rejected. The replayed staff notes or card-detail read is refused while Rafael's identical read succeeded; the board and Activity replays are refused or answered with only what the candidate's own view shows; the other application's conversation is answered as not found. A candidate page that receives none of its own data makes this criterion 0. Fails if any condition stated above does not hold.
"""
