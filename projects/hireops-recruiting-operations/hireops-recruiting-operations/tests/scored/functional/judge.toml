[judge]
judge = "claude-code"
mode = "batched"
timeout = 9000
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "hro_numeric_validation"
name = "hro_numeric_validation"
type = "binary"
weight = 0.09042553
description = """
P2 requisition input: after a valid requisition creation control, reject negative, fractional-cent, nonnumeric and unsafe-integer budget values in the app's observed input representation. The invalid attempt adds no requisition or economic record and does not change an existing one. Browser money fields legitimately accept two decimal dollar amounts. Offer inputs and computed overflow have separate owners.
"""

[[criterion]]
id = "hro_offer_create_validation"
name = "hro_offer_create_validation"
type = "binary"
weight = 0.09042553
description = """
P2 offer creation input: after a valid offer creation control, reject negative money, fractional shares, fractional cents in an observed cents-valued request, nonnumeric and unsafe-integer economic inputs without creating or replacing an offer or economic record. Reuse the UI-observed request shape; interpret units as whole shares and normal browser money as two-decimal dollars. Requisition budget and revision validation have separate owners.
"""

[[criterion]]
id = "hro_offer_revision_validation"
name = "hro_offer_revision_validation"
type = "binary"
weight = 0.09042553
description = """
P2 offer revision input: after a valid revision control, reject negative money, fractional shares, fractional cents in an observed cents-valued request, nonnumeric and unsafe-integer economic inputs. The invalid revision preserves the current offer, lineage and all economic records. Reuse the UI-observed request shape; valid create and invalid create receive separate credit.
"""

[[criterion]]
id = "hro_computed_overflow"
name = "hro_computed_overflow"
type = "binary"
weight = 0.09042553
description = """
P2 computed overflow: units9007199254740991 at fair.02/strike0 exceed safe intrinsic despite individually safe inputs and must be refused without creating or changing an offer or economic record. Accept and preserve a neighboring valid control with the same safe units and zero fair/strike spread. Use the actual UI or observed request representation. Input-type validation has separate credit.
"""

[[criterion]]
id = "hro_money_precision"
name = "hro_money_precision"
type = "binary"
weight = 0.12056737
description = """
P2 exact-money control: on an affordable ordinary requisition, raise through the UI a base100.00, bonus0, one-unit offer with relocation90071992547409.91 and fair/strike both70368744177664.01 dollars. These are valid safe-integer cent values; equal fair and strike keep intrinsic zero and run-rate small while the nonzero unit makes the equity fields applicable. Save and freshly read the exact values. Approve as a distinct sufficient-tier approver, then open revision through the UI, change only base to101.00 and submit without retyping the three large money fields. The saved revision and retained predecessor must preserve all three large amounts exactly. A normal small-money creation/revision establishes working controls; reuse prior controls. Observe rendered values or ordinary product responses, interpreting their public representation rather than demanding cents-valued keys. This row owns exact UI money round-tripping, not rejection of invalid inputs, general revision lineage or arithmetic formulas.
"""

[[criterion]]
id = "hro_date_rejection"
name = "hro_date_rejection"
type = "binary"
weight = 0.18085106
description = """
P2 offer date refusal: first successfully create an offer with valid full UTC offer/referral instants. Impossible 2025-02-30T00:00:00Z, nonsensical date text, missing required offer start, and missing separate hire start with a selected referrer must be refused without new/changed offer data. Use otherwise valid controls and observed replays if native inputs block invalid text. An economic-only revision may ignore injected date fields while applying the valid economic change; it need not edit dates. Valid date-only acceptance and rescission-date validation have separate credit.
"""

[[criterion]]
id = "hro_date_only"
name = "hro_date_only"
type = "binary"
weight = 0.18085106
description = """
P2 date-only acceptance: through offer creation, save real YYYY-MM-DD values for both required offer start and separate referred-hire start with a referrer. Fresh readback represents each as UTC midnight; equivalent valid display formatting is allowed. This accepts valid calendar inputs independently of invalid-date refusal. Full UTC instant precision is covered by the dedicated date/lineage protocols.
"""

[[criterion]]
id = "hro_rescission_date_validation"
name = "hro_rescission_date_validation"
type = "binary"
weight = 0.12056737
description = """
P2 rescission date: on an independently prepared current committed offer, establish one valid Finance rescission control. An impossible calendar date 2025-02-30T00:00:00Z, invalid text or missing effective date must refuse rescission without changing status, budget or settlement records. Accept a real YYYY-MM-DD date as UTC midnight. Do not inherit offer-creation date validation or unrelated settlement arithmetic verdicts.
"""

[[criterion]]
id = "hro_intrinsic"
name = "hro_intrinsic"
type = "binary"
weight = 0.4822695
description = """
P3: visible intrinsic equals units times positive fair-minus-strike: two units at .03/.02 -> $.02. Also inspect pending offers with fair equal to and below strike: intrinsic is zero. No credit for gross-fair or strike notional as intrinsic. Owns only intrinsic. Apply P5a to any actually observed computed claims for this owned intrinsic result; keep credit independent of claims affecting other outcomes. A supported request with no such claims satisfies this conditional authority observation without invented keys.
"""

[[criterion]]
id = "hro_annual"
name = "hro_annual"
type = "binary"
weight = 0.4822695
description = """
P3: $.02 intrinsic annualizes to $.01; $.01 intrinsic annualizes to $0.00. Require exact visible annualized values; no rounding the unit spread or using gross grant value. Can establish these independently with valid pending offers if another composition leg is broken. Apply P5a to any actually observed computed claims for this owned annualized intrinsic result; keep credit independent of claims affecting other outcomes. A supported request with no such claims satisfies this conditional authority observation without invented keys.
"""

[[criterion]]
id = "hro_runrate"
name = "hro_runrate"
type = "binary"
weight = 0.4822695
description = """
P3 and P4 initial: run-rate excludes signing and relocation and includes annualized intrinsic; P3 baseline $199999.98, P4 $100001.77. Check visible figure, independently of band or commitment correctness. Apply P5a to any actually observed computed claims for this owned run-rate result; keep credit independent of claims affecting other outcomes. A supported request with no such claims satisfies this conditional authority observation without invented keys.
"""

[[criterion]]
id = "hro_basis"
name = "hro_basis"
type = "binary"
weight = 0.4822695
description = """
P3 baseline basis $199999.99 (base199999.97 plus half-up .01 bonus plus annual .01); P4 initial basis $105001.78. Relocation excluded. Distinguish rounding half the odd-cent bonus before addition. Apply P5a to any actually observed computed claims for this owned approval basis result; keep credit independent of claims affecting other outcomes. A supported request with no such claims satisfies this conditional authority observation without invented keys.
"""

[[criterion]]
id = "hro_bands"
name = "hro_bands"
type = "binary"
weight = 0.4822695
description = """
P3: bases199999.97/199999.98 and349999.97/349999.98, each with bonus.01 and equity intrinsic.02, yield bases199999.99/200000.00/349999.99/350000.00 and required tiers1/2/2/3. Judge the stated bands against known raw inputs, not a possibly wrong sibling display. Apply P5a to any actually observed computed claims for this owned displayed band/tier result; keep credit independent of claims affecting other outcomes. A supported request with no such claims satisfies this conditional authority observation without invented keys.
"""

[[criterion]]
id = "hro_approval_role_recruiter"
name = "hro_approval_role_recruiter"
type = "binary"
weight = 0.12056737
description = """
P5: first observe successful UI approval by a distinct authorized approver. Replay the observed request as Rafael Costa, Recruiter against another affordable pending offer; require403, unchanged pending state and no settlement records. Use valid eligible data; hiding a control is insufficient. Each forbidden role has independent credit. In P5a, if the observed request supplies identity/role/tier/band claims, alter only those claims on this otherwise valid control; they cannot override this session-based permission. Absent claims are conforming; do not invent keys or inherit another permission verdict.
"""

