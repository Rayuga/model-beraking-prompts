[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "hro_pol_preserve_revision"
name = "hro_pol_preserve_revision"
type = "binary"
weight = 1.5
description = """
On a dedicated current committed offer, open its revision editor. Change at least one valid editable compensation field to a distinctive value, then make a different field invalid. Prefer a clearly over-budget base with a small valid changed signing bonus so the UI can naturally submit a refusal; ordinary native numeric validation is also permitted. Submit normally, observe an understandable visible refusal explanation (native validation or equivalent app wording is valid), and verify the valid changed input remains editable together with the other unchanged fields. Correct only the invalid input to an ordinary affordable value and save the revision successfully. Compare entered values rather than requiring a particular input representation. Owns understandable refusal feedback, retained revision-editor state and successful recovery; no exact available-budget/shortfall wording is required. Do not regrade revision lineage or financial formulas. Use a new ordinary target if an unrelated prior scenario fails.
"""

[[criterion]]
id = "hro_pol_preserve_rescission"
name = "hro_pol_preserve_rescission"
type = "binary"
weight = 1.5
description = """
Open Finance's rescission form on an eligible dedicated committed target and enter a real effective date, e.g.2025-02-01 (or its equivalent UTC instant). First establish a successful normal UI rescission on another dedicated target and observe its actual request family. On the retained-input target, interrupt exactly one outgoing request belonging to that already-observed rescission operation before forwarding it to the server; leave its entered form data and request payload unmodified. A visible failure appears and the valid effective date remains visible in retained operation state, allowing an unchanged retry. Editable controls or a read-only confirmation with a Retry action are both valid. Remove the interruption and retry normally; the rescission succeeds with the same entered date. Do not fabricate an HTTP status, error body or server response; do not guess a route, mutate application code, delete browser validation, or claim an operation failed after it actually settled. This row owns retained rescission input and retry, not the settlement formulas or transport implementation. If the available browser tool cannot safely perform and release this single-operation interruption, report missing tool evidence honestly rather than assuming app failure or granting credit. If the form has several editable fields, an ordinary genuinely invalid field plus another valid distinctive field may instead establish the same retention/correction observation. Never require extra fields or free-text dates, or force impossible text into a native date input. Compare equivalent date representations semantically.
"""

[[criterion]]
id = "hro_pol_change_prepare_recovery"
name = "hro_pol_change_prepare_recovery"
type = "binary"
weight = 0.5
description = """
Establish a valid ordinary UI preparation control with a saved, readable preview. On dedicated current members, enter distinctive valid destinations and compensation terms, then make one different term invalid or the final budget overrun and submit Prepare normally. After an actual refused preparation, show an understandable failure explanation and retain member selections, destinations and otherwise valid entered terms. Native validation and equivalent wording are valid. Correct only the offending input, use a new operation key if necessary, then obtain a saved, readable corrected preview without re-entering unchanged values. Commit success is not required for this preparation-only observation. Owns preparation-stage retention/correction independently of commit-refusal recovery and budget/validation enforcement. Deferring over-budget refusal until commit is allowed; if Prepare accepts that draft, use a genuine malformed-input refusal instead. A dead form cannot earn credit. Do not force impossible text into native controls or require additional input fields.
"""

[[criterion]]
id = "hro_pol_change_recovery"
name = "hro_pol_change_recovery"
type = "binary"
weight = 2.5
description = """
First establish a valid ordinary UI coordinated prepare/commit control. On another eligible operation, retain distinctive member selections, destinations and replacement terms, then attempt a genuinely refused commit. Prefer a saved preview invalidated by a separate settlement on a touched requisition while selected sources remain current. If that freshness branch wrongly succeeds, preserve the Functional failure and obtain an independent real refusal by revising a selected source after preview, or by a genuine budget conflict through the same editor. Observe an understandable visible explanation of refusal. The entered member selections, destinations and otherwise valid terms remain available/editable. Correct only the stale/invalid element as necessary, use a new operation key, prepare the current preview and commit successfully without re-entering unchanged values. Owns usable commit-refusal recovery, not freshness enforcement, formulas or a sibling verdict. Native validation/equivalent error wording and explicit refresh/correction controls are valid if they preserve the draft. If no genuine refusal can be observed, give no unobserved recovery credit and report the actual missing evidence.
"""

[[criterion]]
id = "hro_pol_uncertain_commit"
name = "hro_pol_uncertain_commit"
type = "binary"
weight = 3
description = """
First observe an ordinary successful UI coordinated commit and its actual request. On another valid saved operation, forward exactly one matching outgoing UI commit to the real server, receive its real response, then suppress only delivery of that response to the browser. Do not fabricate a payload/status or suppress unrelated traffic. Remove interception in finally. The UI reports uncertainty/failure and lets the operator retry that SAME saved operation; the retry displays its original confirmed result and does not silently create a new key/preview. Judge usable recovery and operation continuity; exact duplicate-settlement counts belong to Functional. If tools cannot safely forward then interrupt response delivery, give no unobserved credit and report the evaluator limitation.
"""

