[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

# Criterion weights: 1.0 standard, 1.5 important, 2.0 core to the brief (Visual Likert rows are equal).

[[criterion]]
id = "hro_pol_live_board"
name = "hro_pol_live_board"
type = "binary"
weight = 2
description = """
First make the board scroll: add cards to your job through the ordinary controls until the page, or the board's scroll container, scrolls (up to twelve cards in one stage), move one other card of the job to Screen, and scroll it partway, neither at the top nor at the very bottom; only if neither can be made to scroll with twelve cards, record that and judge the other legs. Then, as Rafael and without scrolling back, open one of your cards' details, click into its note box and type an unfinished note such as 'Call back on Fri' without saving, and read the scroll offset. In an independent context another recruiter moves that Screen card to Interview (not a card of the stage you filled, so the board's height does not change). Once the move is visible on this page (watch up to 60 seconds, no reload; how quickly it arrived is graded only in Functional), the card details are still open, the note still reads exactly what was typed, it is still document.activeElement, the scroll offset is within 2 px of what it was before the move, and typing more appends to it. Fails if the update closes the details, clears or changes the note, moves focus or resets scroll. If no update arrives within 60 seconds, preservation cannot be shown and this row is 0; say so. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_pol_live_thread"
name = "hro_pol_live_thread"
type = "binary"
weight = 2
description = """
As Rafael open Noor Haddad's Platform Engineer conversation at its newest message, click into the message box and type an unfinished reply. In an independent context Noor sends a message (Mei Lin if Noor cannot send; that is graded in Functional, and below Noor's message then means Mei's). When it appears (watch up to 60 seconds, no reload; how quickly it arrived is graded only in Functional) the reply still reads exactly what was typed, the box still has focus, and typing more appends to it. The view stays at the newest message, showing Noor's message. Fails if the draft or focus is lost or the view moves away from the newest message. If Noor's message does not appear within 60 seconds, preservation cannot be shown and this row is 0; say so. This row owns the draft, the focus and staying at the newest message when a message arrives while Rafael is at the newest message; the same while he is scrolled up to earlier messages, and where the view goes then, are graded only in Functional (hro_long_thread). Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_pol_earlier_place"
name = "hro_pol_earlier_place"
type = "binary"
weight = 2
description = """
In Noor Haddad's Platform Engineer conversation scroll up to a few pixels below the top of what is shown (so that an app that loads earlier messages on reaching the top has not loaded yet), and note which message is at the top of the view and its position (getBoundingClientRect().top). Bring in earlier messages: with the app's control, or, if it loads on reaching the top, by scrolling those last few pixels. The same message stays at the same position on screen (within a few pixels), with the earlier ones above it. Fails if the view jumps to the top, the bottom or elsewhere. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_pol_failed_send"
name = "hro_pol_failed_send"
type = "binary"
weight = 1.5
description = """
As Rafael type a distinctive reply in a conversation and send it while that send cannot reach the server: abort exactly one outgoing send request before dispatch, or, if sends do not use an ordinary request, set the context offline (context.setOffline(true)) for that one send and back online afterwards. A visible explanation appears, the message text is still in the box and nothing was sent or shown as sent (a local not-sent marker is acceptable). Remove the interception and send again: it is sent once. Fails if no explanation is shown, the failed message is lost, shown as sent, or sent twice. Unsaved note drafts are graded only in hro_pol_session_resume. Fails if any condition stated above does not hold.
"""

[[criterion]]
id = "hro_pol_session_resume"
name = "hro_pol_session_resume"
type = "binary"
weight = 2
description = """
As Rafael type a distinctive unsent reply in one conversation. End the session without touching this page: open a second tab in the same browser context, sign out there and close it (if sessions are per tab, use this page's own sign-out instead). Press Enter or Send in the first page, unless the sign-in prompt has already appeared on its own (that leg also passes): the app asks for sign-in again, with no silent failure, and nothing was sent. Sign in as Rafael: the same conversation's reply is as left and sends, which is the positive control. Then type a second distinctive unsent reply in that conversation and an unsaved note on one of your cards, sign out, sign in as Mei Lin on this browser and open that conversation and that card: both boxes are empty. Sign out and sign in as Rafael again: his reply and note drafts are still there. Fails if the reply is lost or sent without sign-in, the ended session gives no prompt, Mei sees either of Rafael's drafts, or Rafael's drafts are gone after Mei's visit. Fails if any condition stated above does not hold.
"""
