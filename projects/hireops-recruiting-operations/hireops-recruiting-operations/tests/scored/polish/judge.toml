[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "hro_pol_live_keeps_entries"
name = "hro_pol_live_keeps_entries"
type = "binary"
weight = 3
description = """
Finance has a saved, uncommitted preview on dedicated hires and the editor still holds its entries. Click into one compensation field of the second member and type a distinctive unfinished value such as41.5 without leaving the field. Scroll whatever scrolls the desk (the window or the field's nearest scrolling ancestor) away from its top while that field stays visible. Record the field's value, that it is document.activeElement, the scroll offset of what scrolled, and the field's getBoundingClientRect().top. In a separate browser context another permitted user then makes a commitment-changing settlement on a touched requisition, for example approving a prepared pending offer. Do not touch the first page. Once the update is seen there (the preview marked out of date, or the editor's headroom figure changed), the field still holds41.5, is still document.activeElement, the scroll offset has not been reset to the top and the field is still in the viewport, and typing one more character appends to it. A shift of a few lines because content above the field grew is not a reset. If the whole desk fits the viewport so nothing can scroll, decide on value and focus alone. Fails if the arriving update clears or resets the typed value, moves focus away, or resets the scroll position. If no update arrives within15 seconds there is nothing to observe: give0 and say so; never reload to obtain it. Owns undisturbed entries, focus and scroll under a live update; arrival itself belongs to Functional.
"""

[[criterion]]
id = "hro_pol_session_resume"
name = "hro_pol_session_resume"
type = "binary"
weight = 2.5
description = """
As Finance enter a distinctive operation key and distinctive terms for two members and do not save. End the session without touching this page: open a second tab in the same browser context, sign out there through the UI and close it. If the app keeps a separate session per tab, so the second tab is not signed in, instead use the first page's own sign-out. Back in the first page press the save control if it is still shown: the app asks for sign-in again, with no silent failure, and nothing was saved. Sign in as Finance: the key, members, destinations and terms are as they were left, and saving now succeeds and shows the saved preview, which is the positive control. Then sign out and sign in as Recruiter: the editor shows neither that key nor those terms. Fails if the entries are lost for Finance, are shown to the Recruiter, or the ended session produces no sign-in prompt. Do not clear cookies or storage by script. Owns resuming unsent entries after an ended session and their privacy between people on one browser.
"""

[[criterion]]
id = "hro_pol_focus"
name = "hro_pol_focus"
type = "binary"
weight = 1.5
description = """
Read document.activeElement after three outcomes reached through ordinary controls. After a preview is saved successfully, focus is on or inside that saved preview. After a save is refused for one malformed term, focus is on or inside the explanation of the refusal, or on the offending field when the explanation sits at that field, as with native validation. After a commit is refused, for example the out-of-date preview used for hro_pol_change_recovery, focus is on or inside that explanation. All three outcomes are required. Use any genuine commit refusal the Polish prompt allows; if none can be obtained, give0 with reason NOT EXERCISED. Fails if focus is left on the pressed button, on the page body, or at the top of the page in any of the three. Owns where focus lands, not the wording of the explanation or retained entries.
"""

[[criterion]]
id = "hro_pol_change_recovery"
name = "hro_pol_change_recovery"
type = "binary"
weight = 2
description = """
First establish a valid ordinary UI coordinated prepare/commit control. On another eligible operation, retain distinctive member selections, destinations and replacement terms, then attempt a genuinely refused commit. Prefer a saved preview invalidated by a separate settlement on a touched requisition while selected sources remain current. If that freshness branch wrongly succeeds, preserve the Functional failure and obtain an independent real refusal by revising a selected source after preview, or by a genuine budget conflict through the same editor. Observe an understandable visible explanation of refusal. The entered member selections, destinations and otherwise valid terms remain available/editable. Correct only the stale/invalid element as necessary, use a new operation key, prepare the current preview and commit successfully without re-entering unchanged values. Owns usable commit-refusal recovery, not freshness enforcement, formulas or a sibling verdict. Native validation/equivalent error wording and explicit refresh/correction controls are valid if they preserve the draft. If no genuine refusal can be observed, give no unobserved recovery credit and report the actual missing evidence.
"""

[[criterion]]
id = "hro_pol_uncertain_commit"
name = "hro_pol_uncertain_commit"
type = "binary"
weight = 3
description = """
First observe an ordinary successful UI coordinated commit and its actual request. On another valid saved operation, forward exactly one matching outgoing UI commit to the real server, receive its real response, then suppress only delivery of that response to the browser. Do not fabricate a payload/status or suppress unrelated traffic. Remove interception in finally. The UI reports uncertainty/failure and lets the operator retry that SAME saved operation; the retry displays its original confirmed result and does not silently create a new key/preview. Judge usable recovery and operation continuity; exact duplicate-settlement counts belong to Functional. If tools cannot safely forward then interrupt response delivery, give no unobserved credit and report the evaluator limitation.
"""
