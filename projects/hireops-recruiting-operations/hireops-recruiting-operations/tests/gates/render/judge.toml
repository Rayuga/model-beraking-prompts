[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "hro_gate_render"
name = "Authenticated operational workspace"
type = "binary"
weight = 1.0
description = """
Incorrect password must leave the visitor signed out; the correct seeded password then signs in and reveals a substantive populated recruiting workspace with usable navigation and readable records, without a fatal error. A static login/dashboard picture or only a health response is insufficient. Account-by-account permissions and advanced economics belong to scored outcomes.
"""

