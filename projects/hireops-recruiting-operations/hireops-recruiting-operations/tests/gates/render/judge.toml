[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

# Criterion weights: 1.0 standard, 1.5 important, 2.0 core to the brief (Visual Likert rows are equal).

[[criterion]]
id = "hro_gate_render"
name = "hro_gate_render"
type = "binary"
weight = 1
description = """
An incorrect password leaves the visitor signed out (a refusal message is welcome but not required); the correct password for a seeded Recruiter (prefer Rafael Costa) then signs in and shows a usable staff workspace with navigation and readable content (a job board, conversations or activity), without a fatal error. A static picture or only a health response is insufficient. Permissions and workspace rules belong to scored outcomes. Fails if any condition stated above does not hold.
"""
