[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

# Criterion weights: 1.0 standard, 1.5 important, 2.0 core to the brief (Visual Likert rows are equal).

[[criterion]]
id = "hro_gate_shared"
name = "hro_gate_shared"
type = "binary"
weight = 1
description = """
Sign in as a seeded Recruiter (prefer Rafael Costa). Through ordinary UI controls add one candidate to the seeded Data Analyst job with a unique name, a unique email address and any source. Reload the page: the visitor is still signed in and the card is still there. In a new independent empty browser context sign in as the Observer (prefer Aud Halvorsen; another working staff account is acceptable) and, through the UI, find exactly one card for that candidate in the Data Analyst job's Applied, with the entered name. A static seed response, a no-op success message or a browser-only save does not satisfy the gate. Do not grade job opening, stage rules, conversations or live updates here. Fails if any condition stated above does not hold.
"""
