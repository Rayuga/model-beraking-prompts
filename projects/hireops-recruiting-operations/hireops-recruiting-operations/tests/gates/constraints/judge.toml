[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "hro_gate_shared"
name = "hro_gate_shared"
type = "binary"
weight = 1.0
description = """
As any signed-in role, create one unique requisition using its UI with an ordinary valid ID, title, department and annual budget1000.00. Record the saved details. In an independent empty browser context, sign in using a seeded account and read the same requisition from the actual operational UI; exactly one persisted record with those details must appear. Successful UI write plus independent-context retrieval is required; static seed responses, no-op successful POSTs and localStorage-only writes fail. Do not require approval, revision or any compensation calculation. This gate leaves its uniquely named record in place; every scored suite must tolerate it.
"""

