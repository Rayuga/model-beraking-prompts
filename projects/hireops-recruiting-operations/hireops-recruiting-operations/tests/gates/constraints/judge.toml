[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "hro_gate_shared"
name = "hro_gate_shared"
type = "binary"
weight = 1.0
description = """
Sign in as the seeded Recruiter. Through ordinary UI controls, create a uniquely named requisition with an ordinary nonblank ID, a title, a department and annual budget1000.00. On that requisition create a uniquely named offer for a new candidate with base salary10.00, zero signing bonus, zero relocation, zero equity units and no referral; supply a valid offer start date such as2026-09-01. Leave inapplicable optional fields empty or use their ordinary zero defaults as the UI permits. Record the saved requisition and offer identities and their association; the offer must initially be PENDING.
Sign out or use another authenticated browser context, then sign in as the distinct seeded tier3 Approver and approve that same offer through its ordinary UI action. Observe a successful transition to COMMITTED. In a new independent empty browser context, sign in as the seeded Auditor and navigate through the operational UI to retrieve the same newly created requisition and offer. Exactly one of each saved identity must be present, the offer must still belong to that requisition and have COMMITTED status, and the entered title/department/candidate/base/start-date values must be preserved. Ordinary details and the UI's normal product responses can establish saved values; equivalent date and money representations are valid.
This is a minimal working offer and shared-storage prerequisite. Do not grade headroom arithmetic, required-band calculation, movement amounts, grants, payments, referrals, receipts, revisions or rescissions here. Do not require a particular label, route, selector, response schema, ID prefix, modal layout or database-engine probe. A static seed response, no-op success message, browser-only mutation, requisition-only app, or approval button that never changes saved state does not satisfy the gate. Missing evidence due to a tool/evaluator problem must be reported as such, not invented as an observed app failure.
Use only your two uniquely named records and leave them in place. Never settle a seeded offer or another judge's record. Every scored suite must tolerate this additional requisition and committed offer.
"""

