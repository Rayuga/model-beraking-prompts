<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HireOps recruiting workspace</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="topbar" aria-label="HireOps">
    <strong id="brand">HireOps</strong>
    <nav id="nav" aria-label="Primary"></nav>
    <span id="who"></span>
    <button id="logout" type="button" hidden>Sign out</button>
  </header>

  <main id="main">
    <section id="login-view" aria-labelledby="login-title">
      <h1 id="login-title">Sign in to HireOps</h1>
      <p id="login-note" class="note" role="status"></p>
      <form id="login-form">
        <label>Email <input id="email" name="email" type="email" autocomplete="username" required /></label>
        <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit" class="primary">Sign in</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </section>
    <section id="app-view" hidden></section>
  </main>

  <script src="/js/board.js"></script>
  <script src="/js/threads.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
