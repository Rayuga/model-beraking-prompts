schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/hireops-recruiting-operations"
description = "Recruiting workspace with a shared pipeline board and recruiter-candidate conversations that stay correct and usable while several people work at once."
keywords = ["recruiting", "pipeline", "messaging", "realtime", "webdev", "turing", "full-stack"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Several people move candidates and talk to them at the same time. Stage moves follow one-step, interview-capacity and role rules; out-of-date moves are refused and explained; bulk moves are all-or-nothing and undoable only while untouched. Conversations need per-person unread and seen state, paged history that keeps the reader's place, and drafts that survive reloads and ended sessions. Live updates must arrive without disturbing typing, focus or scroll, and candidates must never receive staff-only data."
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "Adapted from the supplied HireOps task as a recruiting workspace, with an authored reference implementation and browser rubric."
arena_slice = "recruiting-hiring-operations"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
