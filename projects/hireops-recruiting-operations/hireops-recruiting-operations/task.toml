schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/hireops-recruiting-operations"
description = "Recruiting and compensation operations with exact valuation, tiered approvals, netted multi-offer transfers, stale previews, atomic settlement and durable retry receipts."
keywords = ["recruiting", "compensation", "ledger", "webdev", "turing", "full-stack"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Finance must revise and transfer several committed offers in one netted transaction, detect intervening economic history even after balances return, and replay the original receipt after later changes or restart. Exact rounding, UTC calendar boundaries, signed bonus adjustments, historical equity and referral provenance remain consistent under stale and competing requests. Useful outcomes receive independent credit."
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "Adapted from the supplied HireOps task with clarified lifecycle rules and an authored reference implementation and browser rubric."
arena_slice = "recruiting-hiring-operations"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
