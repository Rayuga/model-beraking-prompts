[judge]
judge = "claude-code"
mode = "batched"
timeout = 9000
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "cw_custom_typing_and_line_join"
name = "cw_custom_typing_and_line_join"
type = "binary"
weight = 1.0
description = """
In a scratch draft, type two short lines through the visible custom editor using real keys. Put the caret at the start of the second line and press Backspace once: the source must become exactly one line made of the two texts joined, with no character missing or doubled. One Undo with the usual keyboard shortcut must bring back both lines. Then put the caret at the end of the first line and press Delete once: the same exact join must result, and one Undo with the keyboard shortcut must bring back both lines. Fails if either join loses or duplicates a character, if either Undo does not return the exact two-line source, if the Undo keyboard shortcut does nothing, or if the text can only be changed by setting it programmatically.
"""

[[criterion]]
id = "cw_caret_navigation_and_line_numbers"
name = "cw_caret_navigation_and_line_numbers"
type = "binary"
weight = 1.0
description = """
Use a three-line source whose middle line is shorter than both neighbours. With real Home, End and Arrow keys, check that the displayed line and column readout matches the caret's text position and the displayed logical line numbers. From the end of the first line, ArrowDown must clamp the caret to the end of the short line, and a second ArrowDown must return it to the original longer column on the third line. ArrowLeft at the start of a line must move to the end of the previous line and ArrowRight must return. Fails if the readout disagrees with the caret position, if the intended column is forgotten after the short line, if a line break cannot be crossed with Left and Right, or if any of these moves changes the source.
"""

[[criterion]]
id = "cw_grapheme_navigation_and_deletion"
name = "cw_grapheme_navigation_and_deletion"
type = "binary"
weight = 1.0
description = """
Enter one line that has an emoji and a decomposed accented letter (a base letter followed by a combining accent) between plain ASCII characters. Each single ArrowRight or ArrowLeft press must step over the emoji or the accented letter as one visible character, and Shift+Arrow must select it whole, confirmed by the copied or highlighted text. One Backspace directly after the emoji must remove only the whole emoji, and one Delete directly before the accented letter must remove only the whole accented letter; one Undo after each must restore the exact original line. Fails if a single arrow press or a single Backspace or Delete leaves half of the emoji or a stray accent behind, or if Undo does not restore the exact characters.
"""

[[criterion]]
id = "cw_mouse_selection"
name = "cw_mouse_selection"
type = "binary"
weight = 1.0
description = """
In a source with three distinct lines, use the real mouse: a double click on a word must select exactly that word, a triple click must select exactly that logical line (with or without its line break), and a drag from the middle of one line to the middle of the next must select exactly the text between those two points across the line break. Confirm each selection by copying it with the usual keyboard shortcut and comparing the copied text, before any typing. Fails if any of the three gestures selects more or less than stated, if nothing is copied, or if only a highlight is drawn while the copied text is empty or different.
"""

[[criterion]]
id = "cw_selection_replace_and_paste_undo"
name = "cw_selection_replace_and_paste_undo"
type = "binary"
weight = 1.5
description = """
In a known three-line source, select a range inside the middle line and type one character: the selected text must be replaced by that character and nothing else changes. Undo must restore the exact source. Then copy a selection that spans two lines, select a different word, and paste over it with the usual shortcut: the word must be replaced by the complete copied two-line text. A single Undo must then remove the whole paste and bring the replaced word back. Fails if typing or pasting inserts beside the selection instead of replacing it, if the paste needs more than one Undo, or if the source after Undo is not exactly the earlier source.
"""

[[criterion]]
id = "cw_block_indent_undo"
name = "cw_block_indent_undo"
type = "binary"
weight = 1.0
description = """
Select two complete logical lines whose selection ends at column zero of the following third line, then press Tab: each of the two lines gains the same indent and their text is otherwise unchanged, while the third line is not indented. Shift+Tab removes that indent again. Press Tab once more, then one Undo returns both lines to the unindented state and one Redo with the usual keyboard shortcut indents both again. Finally select a few characters inside a single line and press Tab: that line must be indented as a whole and the selected characters must not be replaced. Fails if the third line is indented, if the indent step needs more than one Undo, if the Redo keyboard shortcut does nothing, or if Tab replaces the characters selected inside the single line.
"""

[[criterion]]
id = "cw_caret_kept_in_view"
name = "cw_caret_kept_in_view"
type = "binary"
weight = 1.5
description = """
Use a draft with more lines than fit in the visible editor (for example sixty short numbered lines). Put the caret at the very start, then move it to the end of the document with the keyboard and type a marker: the editor must have scrolled by itself so the last line, its line number and the caret are inside the visible editor area. Move the caret back to the document start with the keyboard: the first line must be visible again. Then on one line keep typing until the line is clearly wider than the editor: after the last typed character the caret must still be visible at the right, without manual scrolling. Fails if the caret or the text being typed is outside the visible editor area at any of these three points, or if only a manual scroll brings it back.
"""

[[criterion]]
id = "cw_long_line_editing"
name = "cw_long_line_editing"
type = "binary"
weight = 1.0
description = """
Use a valid one-line JavaScript draft at least 500 characters long that carries unique start, middle and tail markers. The line must be shown unwrapped as one logical line. Bring the tail into view by scrolling the editor horizontally, with the mouse wheel, its scrollbar or the End key, then use the real mouse and keyboard to change only the tail marker. The complete source must be otherwise identical, including the start and middle markers. Running the draft is not part of this criterion. Fails if the line is wrapped into several numbered lines, if the tail cannot be brought into view, or if the edit damages any other part of the line.
"""

[[criterion]]
id = "cw_multi_caret_typing_atomic"
name = "cw_multi_caret_typing_atomic"
type = "binary"
weight = 2.0
description = """
Use one ordinary click, then one real Alt+Click and one real Ctrl/Cmd+Click, to place three visible carets after distinct words on three different lines. Type the five characters MULTI as normal sequential keys. The suffix must appear exactly once at each caret and nowhere else. One Undo must remove all fifteen inserted characters and one Redo must restore all of them. Fails if either modifier-click does not add a caret, if fewer than three carets receive the text, if the burst needs more than one Undo, or if Redo does not restore the same fifteen characters.
"""

[[criterion]]
id = "cw_multi_caret_delete"
name = "cw_multi_caret_delete"
type = "binary"
weight = 1.5
description = """
Place exactly two carets at the ends of two different lines: one ordinary click for the first, then one real modifier-click for the second. One Backspace must remove exactly the last character of each of those two lines, and one Undo must restore both. Then place exactly two carets at the starts of two different lines, again with one ordinary click and one modifier-click. One Delete must remove exactly the first character of each, and one Undo must restore both. Fails if only one caret is affected, if a neighbouring line or character changes, or if either Undo does not restore the exact source.
"""

[[criterion]]
id = "cw_same_line_carets"
name = "cw_same_line_carets"
type = "binary"
weight = 2.0
description = """
On a single line that contains three separate words, place one caret after each word using one ordinary click and two real modifier-clicks (Alt+Click or Ctrl/Cmd+Click, either works here), so three carets sit on the same line. Type two characters: both characters must appear directly after each of the three words, in order, and nowhere else. Press Backspace once: exactly one of the typed characters must be removed after each word, leaving one typed character after each word. Fails if a second caret cannot be added on the same line, if any inserted characters land at a shifted position inside or before a word, or if Backspace removes a character at fewer than three places or at a wrong place. Undo behaviour is not judged here.
"""

[[criterion]]
id = "cw_undo_restores_caret"
name = "cw_undo_restores_caret"
type = "binary"
weight = 1.5
description = """
In a four-line source put the caret in the middle of the second line and type a short marker. Move the caret to the end of the last line with the keyboard and type a second marker there. Press Undo repeatedly until both markers are gone and the source equals the original four lines; stop as soon as it does. Without clicking or moving the caret, immediately type one character: it must be inserted in the second line at the exact place where the first marker had begun, and the line and column readout must show that position. Fails if the character typed after the last Undo lands anywhere else, such as the end of the document or the start of the file, or if Undo cannot return to the original source.
"""

[[criterion]]
id = "cw_find_forward_backward_wrap"
name = "cw_find_forward_backward_wrap"
type = "binary"
weight = 1.0
description = """
Use a draft with three case-sensitive occurrences of a distinctive literal on different lines, one differently cased near-match on a fourth line, and a fifth line that differs from the literal only where the literal has a dot. The literal must contain a dot and an opening bracket, for example a short call such as a name, a dot, another name and an opening bracket. With the caret at the document start, use the visible Find control and its Next action to visit the three occurrences in document order, then a fourth Next must wrap to the first. Previous from the first must wrap to the last. At each step the current match must be a real selection on the expected line, confirmed by the line readout and the copied or highlighted text. Fails if the differently cased line or the line that differs at the dot is ever visited, if the search reports an error or finds nothing because of the dot or bracket, if the order is wrong, if either wrap does not happen, or if matches are only decorated and never become the current selection.
"""

[[criterion]]
id = "cw_replace_current"
name = "cw_replace_current"
type = "binary"
weight = 1.0
description = """
With three literal matches on three lines, navigate with Find so the middle match is the current one and use Replace current once. Only that middle occurrence may change; the first and last occurrences and all other text stay exact, and the current match must then be the last occurrence. One Undo must restore the middle occurrence and one Redo must reapply that single replacement. Fails if a different occurrence or more than one occurrence changes, if the current match does not move on to the following occurrence, or if Undo and Redo do not reverse and reapply exactly the one replacement.
"""

[[criterion]]
id = "cw_replace_all_atomic"
name = "cw_replace_all_atomic"
type = "binary"
weight = 1.5
description = """
In a scratch draft with exactly four literal matches across several lines and one differently cased near-match, use Replace all once. All four matches must be replaced and the near-match must stay unchanged. One Undo with the visible Undo control must restore all four original occurrences and one Redo with the visible Redo control must replace all four again. After a further Undo, type one new character and then look at the visible Redo control: if it is shown as disabled that is enough and it need not be clicked; if it is enabled, click it and the replacements must not come back. Fails if fewer or more than the four matches change, if Replace all needs more than one Undo, or if Redo still reapplies the replacements after the new edit.
"""

[[criterion]]
id = "cw_replace_self_containing_text"
name = "cw_replace_self_containing_text"
type = "binary"
weight = 1.5
description = """
Use a draft with exactly three occurrences of a short literal, and a replacement text that itself contains that literal (for example replacing a word with the same word twice joined by a hyphen). Replace all once: each of the three original occurrences must be replaced exactly once, so the result holds exactly three copies of the replacement and the operation ends. Undo. Then make the first occurrence current and use Replace current twice in a row: the first use must change the first occurrence and the second use must change the second original occurrence, never the text that was just inserted. Fails if Replace all rescans its own output or does not finish, if the count of replacements is not three, or if the second Replace current changes text inside the first replacement.
"""

[[criterion]]
id = "cw_js_semantic_coloring"
name = "cw_js_semantic_coloring"
type = "binary"
weight = 1.5
description = """
Enter valid JavaScript containing a function declaration name, the keywords function and return, a quoted string, a number, a comment and a call of that function. Inspect the rendered editor text and its visible styles (computed styles, or a screenshot when the editor draws on a canvas), not CSS selectors or source files. One bar: the keyword, the function name, the string, the number and the comment must show five visibly different treatments, each also different from a plain variable name, and the function name must look the same at its declaration and at its call. The source text must stay exact. No fixed colour values are required. Fails if any two of those five categories look the same, if any of them looks like a plain variable name, if the function name is styled at only one of the two places, or if the displayed text contains stray markup characters that are not in the source.
"""

[[criterion]]
id = "cw_html_semantic_coloring"
name = "cw_html_semantic_coloring"
type = "binary"
weight = 1.0
description = """
With an .html filename, enter complete HTML that has a tag name, an attribute name, a quoted attribute value and a comment. Inspect the rendered editor text and its visible styles (computed styles, or a screenshot when the editor draws on a canvas). The tag name, the attribute name, the quoted value and the comment must show four visibly different treatments, and the displayed text must equal the source. Do not require a particular DOM tag or CSS class. Fails if any two of the four categories look the same or if the displayed text shows characters that are not in the source.
"""

[[criterion]]
id = "cw_js_format_semantics_and_undo"
name = "cw_js_format_semantics_and_undo"
type = "binary"
weight = 2.0
description = """
Paste or type a compact one-line valid JavaScript program that has a function with a nested loop and if block, a double-quoted string containing braces and a semicolon, and a comment, and that writes a computed result to the preview. Run it and note the result. Use Format document: the source must become several lines with consistent two-space nesting, with the characters inside the string and the comment text unchanged. Run the formatted source: the result must equal the earlier result. Formatting again must leave the text identical. One Undo must restore the exact original one-line source and one Redo must restore the formatted source. Fails if the result changes, if the characters inside the string or the comment text are altered, if nesting is not in two-space steps, if a second Format changes the text, or if Undo or Redo need more than one step. A change of quote style alone is not a failure.
"""

[[criterion]]
id = "cw_html_format_semantics_and_undo"
name = "cw_html_format_semantics_and_undo"
type = "binary"
weight = 1.5
description = """
With an .html filename, paste or type a compact one-line complete HTML document with nested block-level tags such as main, section and p, no style element, a double-quoted attribute value containing a greater-than sign, a comment and an inline script that changes visible text. Run it and note the rendered result. Use Format document: the source must become several lines with consistent two-space nesting, keeping the characters of the attribute value and the comment text. Run again: the rendered result must be the same. A second Format must leave the text identical. One Undo must return the exact original source and one Redo the formatted source. Fails if the rendered result changes, if the attribute value or comment text is altered, if nesting is not in two-space steps, if a second Format changes the text, or if Undo or Redo need more than one step. A change of quote style alone is not a failure.
"""

[[criterion]]
id = "cw_format_error_keeps_draft"
name = "cw_format_error_keeps_draft"
type = "binary"
weight = 1.0
description = """
First format a small valid JavaScript draft written compactly, with two statements on one line and no spaces around the equals signs, and see it change, as the working control. Then, with a .js filename, enter a JavaScript draft whose syntax error is an opening bracket, brace or parenthesis that is never closed, spread over two lines, and use Format document. A visible message must say that formatting failed, and the draft must be exactly the same text as before the attempt. Fails if the draft is changed, emptied or partly formatted, if no visible failure message appears, or if the valid control did not format.
"""

[[criterion]]
id = "cw_basic_run_output"
name = "cw_basic_run_output"
type = "binary"
weight = 1.0
description = """
Make sure the filename ends in .js, clear the draft and, through the visible editor with the real keyboard, type a one-line JavaScript program that adds two small integers you choose and writes the sum both to the page body of the preview and to the console. Press Run: the preview must show the correct sum and the app console must contain it. Change one of the two integers in the editor with the keyboard and Run again: the preview must show the new sum and the app console must contain the new sum; console lines from the first Run may still be listed. Fails if Run does not show the computed sum in the preview, if the sum does not appear in the app console, or if after the second Run the preview still shows the first sum or the console lacks the new sum.
"""

[[criterion]]
id = "cw_html_preview"
name = "cw_html_preview"
type = "binary"
weight = 1.0
description = """
With an .html filename, enter a complete HTML document with a heading, a button whose inline handler changes visible text, and an inline script that writes a console marker. Run it through the visible editor. The heading must be rendered in the preview as a heading, the console marker must appear in the app console, and clicking the button in the preview must change the visible text. Fails if the document is shown as escaped source text, if the button does nothing, or if the console marker is missing.
"""

[[criterion]]
id = "cw_error_message_and_line"
name = "cw_error_message_and_line"
type = "binary"
weight = 1.0
description = """
First run a small valid JavaScript draft as the working control. Then run a JavaScript draft that throws an Error with a distinctive message on its fourth line. Then, with an .html filename, run a complete HTML file whose inline script throws an Error with another distinctive message on a known line of the whole file, below several lines of markup. For each of these two failures the app console must show the authored message and the one-based line number counted from the first line of the entered source: four for the JavaScript draft and the whole-file line for the HTML file. Finally, with a .js filename, run a two-line draft that has a syntax error such as a missing closing bracket: a visible error must be shown and the draft must be exactly as entered. Fails if either authored message is missing, if a line number is absent or wrong, if the HTML line is counted from the start of the script block instead of the file, or if running the syntax-error draft shows no error or changes the draft.
"""

[[criterion]]
id = "cw_promise_rejection_message_and_line"
name = "cw_promise_rejection_message_and_line"
type = "binary"
weight = 1.5
description = """
First run a draft whose rejected Promise is handled by a catch that logs a marker: the marker must appear and the run must finish without an error, as the working control. Then run a draft that calls Promise.reject with a new Error carrying a distinctive message on its third line and never handles it. Then run a draft in which an async function, called on the first line, throws a new Error with another distinctive message on its fourth line after an await, and nothing handles it. For both unhandled cases the app console must show the authored message text and the one-based line number of the line that created the rejection (three and four). Fails if the message is shown as an empty object or a generic text without the authored message, if the line number is missing or wrong, or if the unhandled rejection is not reported at all.
"""

[[criterion]]
id = "cw_output_before_failure_kept"
name = "cw_output_before_failure_kept"
type = "binary"
weight = 1.5
description = """
Run three separate drafts, each of which first writes its own distinctive console marker and then ends badly: one throws an Error on a later line, one enters an endless loop written in the source, and one schedules a timer for four seconds later and is ended with Stop before that timer is due. After each run has ended, the marker written before the failure must still be visible in the app console. Fails if any of the three markers is missing from the console after its run ended. What the app says about why the run ended is scored by other criteria, not here.
"""

[[criterion]]
id = "cw_run_starts_fresh_document"
name = "cw_run_starts_fresh_document"
type = "binary"
weight = 1.0
description = """
With a .js filename, run a first draft that adds a paragraph with a distinctive first marker to the preview and sets a global variable to a distinctive value. Confirm the first marker is shown. Then run a second draft that adds a paragraph with a second marker and also writes into the preview whether that global variable is defined. The preview must now show the second marker, must not show the first marker, and must report the variable as not defined. Fails if the first run's paragraph is still in the preview after the second run, or if the second run can see the first run's variable.
"""

[[criterion]]
id = "cw_console_levels_in_order"
name = "cw_console_levels_in_order"
type = "binary"
weight = 1.0
description = """
Run a valid JavaScript draft that writes four distinctive markers in this order: one with console.log, one with console.warn, one with console.error and one with console.info. All four markers must appear in the app console, in the order they were written. Fails if any of the four markers is missing, or if they are shown in a different order from the order in the source.
"""

[[criterion]]
id = "cw_interaction_starts_fresh_budget"
name = "cw_interaction_starts_fresh_budget"
type = "binary"
weight = 1.5
description = """
With an .html filename, run a complete HTML page that has two buttons: the first, when clicked, shows a marker in the page after a one-second timer; the second, when clicked, starts a timer callback that schedules itself again without end. Wait until the run has finished, then wait at least eight more seconds so the original five seconds have long passed. Click the first button: its marker must appear about a second later and the preview must keep working, which is the working control that an interaction after the run gets its own time. Then click the second button: within about ten seconds a visible time-limit reason must appear. Fails if the first button's delayed marker never appears, if the app reports a time limit for the first button's short timer, or if the second button's endless callbacks are never ended with a visible time-limit reason.
"""

[[criterion]]
id = "cw_last_good_recovery"
name = "cw_last_good_recovery"
type = "binary"
weight = 2.0
description = """
Run a successful preview that shows a text input, a 2D canvas and a button that draws a filled shape on the canvas. In the preview type a distinctive value into the input and click the button so the canvas visibly changes. Then run a different draft that throws an Error. The preview must return to the most recent successful picture: the input still shows the typed value and the canvas still shows the drawn shape. The restored picture may be static. A later valid Run must work normally. Fails if the preview is blank, shows the failed draft's partial output, shows the input or canvas in their initial untouched state, or if a later valid Run does not work.
"""

[[criterion]]
id = "cw_time_limit_recovery"
name = "cw_time_limit_recovery"
type = "binary"
weight = 1.5
description = """
First run a draft that finishes a short timer and shows a marker, as the working control and last-good picture. Then run a draft with an endless loop written in the source: within about ten seconds a visible time-limit reason must appear and the preview must show the control's picture again. Then run a draft whose timer callback schedules itself again without end: the same must happen. After each, the page and its controls must stay responsive, and a final valid Run must show its own new output. Give the five-second budget normal scheduling margin and do not demand sub-second precision. Fails if either run is never ended with a visible time-limit reason, if the page becomes unusable, if the last-good picture is not shown afterwards, or if the final valid Run does not work.
"""

[[criterion]]
id = "cw_stop_cancels_pending_work"
name = "cw_stop_cancels_pending_work"
type = "binary"
weight = 2.0
description = """
First run a control draft that, about two seconds after Run, writes a distinctive control marker to the preview and to the console three ways: from a timer, from an interval that cancels itself on its first tick, and from a Promise callback, leaving nothing running afterwards; wait and confirm the marker appears in the preview and the console and the run finishes. Then run a second draft that would do the same with a different marker about four seconds after Run, and press Stop as your very next action after Run. If the second marker had already appeared before you pressed Stop, the attempt is void: run the control draft again so its picture is the latest one, then repeat the attempt once with a fresh marker, and if the repeat is void as well, fail this criterion and say that Stop could not be pressed in time. A visible stop reason must appear. Then wait at least eight more seconds. The second marker must never appear in the preview or in the console, and the preview must show the control's picture. Fails if the second marker appears anywhere after Stop, if no stop reason is shown, if the preview does not return to the control's picture, or if the control marker never appeared.
"""

[[criterion]]
id = "cw_newer_run_supersedes"
name = "cw_newer_run_supersedes"
type = "binary"
weight = 1.5
description = """
First run, on its own, a draft that writes a control marker to the preview and the console from a timer about four seconds after Run, and wait until that marker appears: this is the working control that the delayed write really happens. Then run the same draft with a different marker, the old marker, and as your very next actions replace the source with a draft that immediately writes a new marker to the preview and the console, and Run it. If the old marker had already appeared before the newer Run, the attempt is void: repeat it once with fresh old and new markers, and if the repeat is void as well, fail this criterion and say that the newer Run could not be started in time. Confirm the new marker appears, then wait at least eight more seconds. The old marker must never appear in the preview or the console, and the preview must still show the new marker. Fails if the old marker appears after the newer Run, if the newer preview is overwritten, if the new marker did not appear, or if the control marker never appeared.
"""

[[criterion]]
id = "cw_preview_isolation"
name = "cw_preview_isolation"
type = "binary"
weight = 1.5
description = """
First save one snippet and confirm in the app page that its library entry is shown, and confirm that a normal browser tab can load the health address given in the application notes, as working controls. Run a draft that changes its own preview document and logs a marker: both must work. Then run drafts that, from the preview, try to read the parent page's document or title, try to read or write the origin's localStorage, and call fetch on the health address in no-cors mode, each catching failures and logging what it obtained or that it failed. The preview must not obtain the parent's content or a stored value, and the fetch promise must reject rather than resolve; a resolved promise, even with an opaque response, counts as reaching the network. If a public https address of your choice loads in a normal tab, repeat the no-cors fetch from the preview against it: that promise must reject too. Afterwards the app page's title and that library entry must be as before. Fails if the preview reads or changes anything of the playground page or its storage, if a fetch from the preview resolves, or if ordinary own-preview DOM and console activity did not work.
"""

[[criterion]]
id = "cw_dynamic_code_refused"
name = "cw_dynamic_code_refused"
type = "binary"
weight = 1.5
description = """
First run a draft that only mentions eval, Function, WebAssembly, Worker and import inside ordinary string literals and comments and logs a marker: it must run normally and log the marker, as the working control. Then run five separate small drafts that really use eval, the Function constructor, WebAssembly compilation, a new Worker and a dynamic import, each written so that the dynamically created code would write a distinctive payload marker. Each of the five must be refused with a visible reason in the app, and its payload marker must not appear in the preview or the console. Fails if any of the five dynamic forms shows its payload marker, if any is refused silently, or if the harmless control draft is refused.
"""

[[criterion]]
id = "cw_save_reload_restart"
name = "cw_save_reload_restart"
type = "binary"
weight = 1.5
description = """
Use New to start a snippet, give it an exact unique title, filename and source through the editor, Save once, and note its library entry, its revision and its history. Then clear this origin's browser storage as described in the application notes and reload: the library must still show that record, and opening it must show the exact title, filename and source, as one record. Then call the verifier-provided restart_app tool once. After it reports a completed restart, a fresh page must show the same single record with the same revision, title, filename, source and history. Do not infer a restart from a reload or a health response. Fails if the record is gone or changed after browser storage was cleared, if any field, the revision or the history differs after the restart, or if the record is duplicated or missing. If the restart tool itself reports an error, this criterion fails.
"""

[[criterion]]
id = "cw_stale_save_refused"
name = "cw_stale_save_refused"
type = "binary"
weight = 1.5
description = """
Save a snippet, then open that same saved revision in two tabs or browser contexts, A and B. In A change the source and Save successfully: this accepted Save is the working control and advances the revision by one. In B, which still holds the old revision, change the title, filename and source to different valid values and press Save. B's Save must be refused with visible feedback that the snippet changed elsewhere. A fresh read of the record in a third page or after a reload in A must show exactly A's saved title, filename and source and exactly one new revision. Fails if B's Save is accepted, if the saved record or its history contains any of B's values, if no conflict feedback is shown in B, or if A's control Save did not succeed.
"""

[[criterion]]
id = "cw_stale_save_keeps_draft"
name = "cw_stale_save_keeps_draft"
type = "binary"
weight = 1.5
description = """
Create the stale-save situation with a new snippet: tabs A and B hold the same saved revision, A saves a newer revision, and B, still on the old revision, edits the title, filename and source and presses Save. First confirm the working control: B's Save was refused with visible feedback, and a fresh read shows A's values. If B's Save was accepted there is no refused Save to observe and this criterion fails. Then check B: its title field, filename field and editor must still hold exactly B's unsaved values, and typing one more character in B's editor must add it to that draft. Fails if any of B's three unsaved fields is replaced by the saved record, emptied or reloaded, if B's draft can no longer be edited, or if B's Save was not refused.
"""

[[criterion]]
id = "cw_history_restore_retry"
name = "cw_history_restore_retry"
type = "binary"
weight = 1.5
description = """
Build three saved revisions of one snippet through valid Saves with different sources. Inspect the first revision in history: its exact title, filename and source must be shown without changing the current saved revision. Restore that first revision: the snippet must get a fourth revision whose fields equal the first, with revisions one, two and three still listed. Send the same already completed restore request again, through the control the app offers for retrying it or, if it offers none, by replaying the recorded request as the application notes allow: no fifth revision may be created. Then open the snippet in a second tab, save a fifth revision from the first tab with a new distinctive source, and from the second tab restore revision two. Whatever that second tab does, the fifth revision's distinctive source must still be listed afterwards when you open the snippet's history in a freshly loaded page: the restore is either refused or added on top as a later revision. Fails if inspecting changes the record, if the first restore overwrites history instead of adding a revision, if the repeated request adds a revision, or if the fifth revision's source is no longer in the history after the second tab's restore.
"""

[[criterion]]
id = "cw_live_library_update"
name = "cw_live_library_update"
type = "binary"
weight = 1.5
description = """
Open the app in tab A and leave it open. In a second tab or browser context B, save a new snippet with a unique title. Return to A and, without reloading or pressing anything in A, watch its library for up to ten seconds: the new title must appear. Then in B change that snippet's title and Save again: within ten seconds A's library must show the changed title, again without a reload. Fails if A shows either change only after a reload, a click or another action in A, or not at all.
"""

[[criterion]]
id = "cw_live_update_keeps_editing_state"
name = "cw_live_update_keeps_editing_state"
type = "binary"
weight = 2.0
description = """
In tab A enter a draft of at least forty lines, type a custom title and filename without saving, type a marker in the middle of a line near the bottom so the editor is scrolled down and the caret is in the middle of that line. In a second tab B save a new snippet with a unique title, and wait until A's library shows it. Then check A: the title, the filename and the full source must be exactly as left, the editor must still be scrolled to the same lines, and typing one more character must insert it at the same caret position, directly after the marker. Then press Undo repeatedly until that character and the marker are gone: the source must return exactly to the draft as it was before the marker was typed. Fails if the library refresh changes or reloads the draft or either field, moves the caret, scrolls the editor to another place, or empties the Undo history so the marker cannot be undone. If A's library never shows B's snippet, this criterion fails as well because the situation could not be produced.
"""

[[criterion]]
id = "cw_newer_revision_notice_keeps_draft"
name = "cw_newer_revision_notice_keeps_draft"
type = "binary"
weight = 1.5
description = """
Save a snippet and open that saved revision in tabs A and B. In A change the source without saving, so A has an unsaved draft. In B change the source to something different and Save successfully. Within ten seconds and without any action in A, A must show a visible notice that a newer revision of the open snippet exists or was saved elsewhere, and A's editor must still hold exactly A's unsaved draft. Fails if no such notice appears in A, or if A's draft is replaced by B's saved source.
"""
