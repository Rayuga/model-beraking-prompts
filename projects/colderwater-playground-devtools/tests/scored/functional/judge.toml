[judge]
judge = "claude-code"
mode = "batched"
timeout = 9000
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "cw_custom_typing_and_line_join"
name = "cw_custom_typing_and_line_join"
type = "binary"
weight = 1.0
description = """
In a fresh draft, type two lines through the visible custom editor using real keys. At the start of the second line press Backspace once: require exactly one joined line with no missing or duplicate character. Undo once restores both lines. At the end of the first line press Delete once for the same exact join; Undo restores both. Real keyboard interaction and exact source readback are required.
"""

[[criterion]]
id = "cw_caret_navigation_and_line_numbers"
name = "cw_caret_navigation_and_line_numbers"
type = "binary"
weight = 1.0
description = """
Use a three-line source whose middle line is shorter than both neighbors. With real Home, End and Arrow keys, verify the visible caret and line/column readout agree with text positions and displayed logical line numbers. ArrowDown onto the shorter line clamps the caret; ArrowDown again restores the intended longer-line column. Cross a newline with Left and Right. No source change is allowed.
"""

[[criterion]]
id = "cw_grapheme_navigation_and_deletion"
name = "cw_grapheme_navigation_and_deletion"
type = "binary"
weight = 1.0
description = """
Type or paste a line containing an emoji and a decomposed accented letter between ASCII characters. Real Arrow and Shift+Arrow actions must traverse and select each complete visible character, confirmed by copied text. One Backspace after the emoji and one Delete before the accented letter each remove only that whole grapheme; one Undo per action restores exact code points. Do not inspect editor internals or dispatch synthetic key events.
"""

[[criterion]]
id = "cw_mouse_selection"
name = "cw_mouse_selection"
type = "binary"
weight = 1.0
description = """
In visible source with three distinct lines, use real mouse double-click to select exactly one word, triple-click to select exactly one logical line, and drag to select a range crossing a line break. Copy each live selection and compare exact text before replacing any part. A clicked decoration without a real editor selection fails.
"""

[[criterion]]
id = "cw_block_indent_undo"
name = "cw_block_indent_undo"
type = "binary"
weight = 1.0
description = """
Select at least two complete logical lines through the visible editor. Tab adds one consistent indent unit to each selected line without changing their text; Shift+Tab removes it. After another Tab, one Undo returns both lines to the prior state and one Redo reindents both. A selection ending at the next line's column zero must not indent that next line. Judge exact source, not the appearance alone.
"""

[[criterion]]
id = "cw_multi_caret_typing_atomic"
name = "cw_multi_caret_typing_atomic"
type = "binary"
weight = 2.0
description = """
Use one ordinary click and two real Alt+Click or Ctrl/Cmd+Click actions to place three visible carets after distinct words on three lines. Type the five characters MULTI as normal sequential keys. Require the suffix once at each caret and nowhere else. One Undo removes all fifteen inserted characters; one Redo restores them. Multiple key events that require multiple Undo actions fail. Do not set the caret model programmatically.
"""

[[criterion]]
id = "cw_multi_caret_delete"
name = "cw_multi_caret_delete"
type = "binary"
weight = 1.5
description = """
Establish two visible carets after different line-ending characters with real modifier-clicks. One Backspace removes one complete character at each; one Undo restores both. Establish two carets before different first characters. One Delete removes both first characters; one Undo restores both. Adjacent lines and other source must remain exact.
"""

[[criterion]]
id = "cw_find_forward_backward_wrap"
name = "cw_find_forward_backward_wrap"
type = "binary"
weight = 1.0
description = """
Use a draft with three case-sensitive occurrences of a distinctive literal on different lines and a differently cased near-match. Use the visible Find control and real keyboard Next/Previous actions to visit all three in document order, wrap forward and backward, and copy the active match each time. The near-match must not count. Do not treat decorative highlights as an active selection.
"""

[[criterion]]
id = "cw_replace_current"
name = "cw_replace_current"
type = "binary"
weight = 1.0
description = """
With three literal matches, choose the middle one through the visible Find flow and Replace current once. Require only that occurrence to change, the others and surrounding source unchanged, and one Undo/Redo to reverse/reapply the one replacement. Do not let a different active match count as the requested middle replacement.
"""

[[criterion]]
id = "cw_replace_all_atomic"
name = "cw_replace_all_atomic"
type = "binary"
weight = 1.5
description = """
In a fresh draft with at least four literal matches across lines and one differently cased near-match, use Replace all once. Require exactly the four intended replacements and unchanged near-match. One Undo restores every original occurrence and one Redo reapplies all. A new edit after Undo must clear that Redo; neither operation saves the draft automatically.
"""

[[criterion]]
id = "cw_js_semantic_coloring"
name = "cw_js_semantic_coloring"
type = "binary"
weight = 1.5
description = """
Enter valid JavaScript containing a function declaration name, a keyword, a quoted string, a number, a comment, and a call of that function. Inspect the rendered editor text and computed visible styles, not source code or CSS selectors. Require distinct treatments for keyword, function name at declaration and call, string, number and comment; the function name must not inherit the keyword or string treatment. The source text must remain exact. No fixed RGB values are required.
"""

[[criterion]]
id = "cw_html_semantic_coloring"
name = "cw_html_semantic_coloring"
type = "binary"
weight = 1.0
description = """
Enter complete HTML with a tag name, attribute name, quoted attribute value and comment. Inspect the rendered editor text and computed visible styles. Each category must be distinguishable by the offered colour/treatment, with source text unchanged. Do not require a particular DOM tag or CSS class in the editor.
"""

[[criterion]]
id = "cw_js_format_semantics_and_undo"
name = "cw_js_format_semantics_and_undo"
type = "binary"
weight = 2.0
description = """
Paste a compact one-line valid JavaScript function with nested if/loop blocks, a string containing braces and semicolons, and a comment. Activate Format document. Require readable multiple lines with consistent two-space nesting and exact literal/comment preservation. Run the formatted source and compare its computed preview result with the original. Formatting again must produce identical text. One Undo restores the exact original one-line source and one Redo restores the formatted source.
"""

[[criterion]]
id = "cw_html_format_semantics_and_undo"
name = "cw_html_format_semantics_and_undo"
type = "binary"
weight = 1.5
description = """
Paste a compact complete HTML document with nested tags, an attribute value containing a greater-than sign, a comment, and inline JavaScript. Format it through the UI. Require readable lines with consistent two-space nesting, preserved attribute/comment/script meaning and the same rendered preview. A second Format is idempotent. One Undo returns the exact original source; Redo returns the formatted source. Separately submit an invalid HTML draft: a useful formatting error must leave its exact source intact.
"""

[[criterion]]
id = "cw_long_line_editing"
name = "cw_long_line_editing"
type = "binary"
weight = 1.0
description = """
Use a valid one-line JavaScript draft at least 500 characters long with unique start, middle and tail markers. Horizontally scroll the visible editor to reach the tail, then use real mouse/keyboard editing to change only that marker. Confirm the complete source before and after, including intact start/middle markers, and Run to show the changed tail output. Finding the tail through a search control alone does not prove horizontal reachability.
"""

[[criterion]]
id = "cw_html_preview"
name = "cw_html_preview"
type = "binary"
weight = 1.0
description = """
Enter a complete .html document with a heading, inline button handler and console marker. Run it through the visible editor. Require the heading in the preview, an interactive button update and the expected console marker. The document must be executed as HTML rather than shown as escaped source. A .js extension is not a valid substitute.
"""

[[criterion]]
id = "cw_error_message_and_line"
name = "cw_error_message_and_line"
type = "binary"
weight = 1.0
description = """
First run a valid JavaScript control and a successful complete HTML file with an inline script. Then run JavaScript with a deliberate thrown error on a known nonfirst line and a complete HTML file with a deliberate inline-script error below preceding markup. For each failure, require the authored error message and a one-based line number relative to the actual entered source in the visible console. An arbitrary constant line number or copied source text fails.
"""

[[criterion]]
id = "cw_last_good_recovery"
name = "cw_last_good_recovery"
type = "binary"
weight = 2.0
description = """
Run a successful preview with an input and a 2D canvas, then change the input value and canvas drawing through its ordinary controls. Run a failing candidate. Require the most recent actual successful visible state, including changed input value and canvas pixels, to return without rerunning source. A static restored picture is valid. A later ordinary Run must still work.
"""

[[criterion]]
id = "cw_timeout_stop_and_supersession"
name = "cw_timeout_stop_and_supersession"
type = "binary"
weight = 1.5
description = """
Establish a working short timer control. Start a source-written endless loop or callback chain and require a visible time-limit reason within a bounded wait, restoration of the last-good picture and later ordinary recovery. In separate attempts start a delayed marker, then immediately Run a distinct newer marker; repeat with Stop. Wait past the old marker's delay in both cases. The old marker must never appear later in the current preview/console/status. Give the five-second budget normal scheduling margin; do not demand hidden thread termination or subsecond reaction.
"""

[[criterion]]
id = "cw_preview_boundary"
name = "cw_preview_boundary"
type = "binary"
weight = 1.5
description = """
Prove ordinary own-preview DOM and console activity works. Then attempt parent-document/origin-storage access and a separate user-authored network request from the preview. Require the parent/library data to remain untouched and no network delivery, with clear refusal or blocked-effect evidence. App-owned external resources are allowed. Test harmless quoted or commented mentions as a positive control. Then try real eval, Function, WebAssembly, Worker and dynamic import in separate small drafts; each must be refused with clear feedback without losing the last good preview.
"""

[[criterion]]
id = "cw_save_reload_restart"
name = "cw_save_reload_restart"
type = "binary"
weight = 1.5
description = """
Use New to create one snippet with exact title, filename and source through the editor, Save once and record identity, revision and history. Reload and read from an independent clean browser context: require exact fields and one record. Then use the verifier-provided restart_app tool once; after a completed restart, a fresh page must show the same identity, revision, fields and history. Do not infer restart from reload or health alone. If the restart tool fails, report unavailable restart evidence rather than declaring a product failure.
"""

[[criterion]]
id = "cw_stale_save_draft_safety"
name = "cw_stale_save_draft_safety"
type = "binary"
weight = 1.5
description = """
Open the same saved revision in two ordinary editor contexts. Save a changed exact title/filename/source from A. Change all three fields in B and attempt its stale Save. Require refusal or clear proactive prevention, useful conflict feedback, B's exact unsaved fields retained, and a fresh server read showing only A's whole accepted record and one advanced revision. Reverse editor roles in a second valid trial. A rejected request with unrelated invalid fields is not evidence.
"""

[[criterion]]
id = "cw_history_restore_retry"
name = "cw_history_restore_retry"
type = "binary"
weight = 1.5
description = """
Build three saved revisions of one identity through valid UI Saves. Inspect an older snapshot and require its exact fields without mutating the current saved head or dirty draft. Restore that snapshot deliberately: require a new advanced revision, older and intervening snapshots intact. Retry the same already committed restore operation through the offered UI/observed request contract and require no additional revision; a genuinely new restore action is allowed to create one. A stale restore after a newer Save must be refused without changing the saved head.
"""
