[judge]
judge = "claude-code"
mode = "batched"
timeout = 9000
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "cw_startup_ready"
name = "cw_startup_ready"
type = "binary"
weight = 0.20
description = "S01.startup_ready: Useful starting source automatically produces preview and console output without Run."

[[criterion]]
id = "cw_usable_examples"
name = "cw_usable_examples"
type = "binary"
weight = 0.15
description = "S01.usable_examples: A chosen built-in example supplies editable source and working output; an authored edit actually executes."

[[criterion]]
id = "cw_example_separate"
name = "cw_example_separate"
type = "binary"
weight = 0.15
description = "S01.example_separate: The edited example saves as a separate exact user record; reloading the built-in example preserves its original filename/source."

[[criterion]]
id = "cw_js_html_filename_dispatch"
name = "cw_js_html_filename_dispatch"
type = "binary"
weight = 0.40
description = "S02.js_html_filename_dispatch: JS and complete HTML execute in the mode selected by filename alone. Lowercase fallback isolates case handling."

[[criterion]]
id = "cw_css_builtin_preview"
name = "cw_css_builtin_preview"
type = "binary"
weight = 0.30
description = "S02.css_builtin_preview: A CSS Run applies the authored stylesheet to a visible built-in sample page. The sample is independent of the prior authored JS/HTML content."

[[criterion]]
id = "cw_extension_case"
name = "cw_extension_case"
type = "binary"
weight = 0.15
description = "S02.extension_case: Uppercase .JS, .HTML and .CSS dispatch correctly without selecting a separate language."

[[criterion]]
id = "cw_js_fresh_document"
name = "cw_js_fresh_document"
type = "binary"
weight = 0.25
description = "S02.js_fresh_document: After the observed prior document, the later JS Run produces its own fresh-undefined preview and fresh-js-log without the old heading. Global freshness also requires S04's executed A setter/start and B DOM/log showing typeof window.__cancelLeak is undefined; cancellation timing need not pass."

[[criterion]]
id = "cw_later_interactions"
name = "cw_later_interactions"
type = "binary"
weight = 0.60
description = "S03.later_interactions: After each six-second idle interval, the completed preview handles the click and later focused key/input without rerunning source."

[[criterion]]
id = "cw_completed_stop"
name = "cw_completed_stop"
type = "binary"
weight = 0.20
description = "S03.completed_stop: After a completed preview and at least one of its authored handlers actually works, Stop reports stopped and prevents further old-handler output. Use the immediate-handler fallback when needed; delayed-interaction, preview-retention and later-recovery credit are not prerequisites. Removed/static/disabled controls after Stop can establish handler suppression, but not preview retention."

[[criterion]]
id = "cw_completed_stop_preview"
name = "cw_completed_stop_preview"
type = "binary"
weight = 0.10
description = "S03.completed_stop_preview: The same Stop attempt retains the actual successful visible content recorded immediately before Stop, including the displayed input value. A static picture is valid; deleting, emptying or hiding that content is not preservation. Require a positively observed completed render, independently of handler suppression, Stop feedback, delayed interactions or subsequent recovery."

[[criterion]]
id = "cw_supersede_pending"
name = "cw_supersede_pending"
type = "binary"
weight = 1.40
description = "S04.supersede_pending: After the matching four-second callback actually fires in the uncancelled control, B supersedes genuinely pending A: no additional A delayed log or thrown error appears, B stays completed, and no late A DOM or success becomes current. Fresh globals are owned by S02."

[[criterion]]
id = "cw_stop_pending_execution"
name = "cw_stop_pending_execution"
type = "binary"
weight = 1.00
description = "S04.stop_pending_execution: After the matching four-second callback actually fires in the uncancelled control, Stop reports cancellation and prevents the active timer's late log, thrown error and DOM replacement. Rollback and later recovery are separate outcomes."

[[criterion]]
id = "cw_stop_pending_rollback"
name = "cw_stop_pending_rollback"
type = "binary"
weight = 0.70
description = "S04.stop_pending_rollback: Stopping the positively observed active timer retains/restores the actual recorded stopLastGood render. Use the independently completed control when the preceding supersession trial did not produce a completed B. Provisional display is optional; do not inherit supersession, cancellation or later-recovery verdicts."

[[criterion]]
id = "cw_preview_origin_boundary"
name = "cw_preview_origin_boundary"
type = "binary"
weight = 1.10
description = "S05.preview_origin_boundary: With the successful own-document control, all four parent-document/storage operations are blocked, the forbidden snippet title is never applied, and the otherwise-unused storage key is unchanged. Legitimate app-owned title/status changes are allowed. Later ordinary execution is scored separately."

[[criterion]]
id = "cw_snippet_network_boundary"
name = "cw_snippet_network_boundary"
type = "binary"
weight = 0.30
description = "S07.snippet_network_boundary: With successful matching transport and ordinary-execution controls, separate fetch/Image runs visibly refuse or report blocked access with no extra deliveries/content. Score enforcement independently of preview preservation and the subsequent recovery Run."

[[criterion]]
id = "cw_network_refusal_preview"
name = "cw_network_refusal_preview"
type = "binary"
weight = 0.10
description = "S07.network_refusal_preview: For each observed explicit execution refusal, retain the most recently completed good preview recorded before that attempt. A caught blocked operation may instead complete its legitimate authored code with the expected observable effects; that branch requires no rollback. Both prescribed attempts need actual refusal/blocked evidence; absence alone is insufficient. Score this preview outcome independently of transport enforcement and later recovery."

[[criterion]]
id = "cw_network_recovery"
name = "cw_network_recovery"
type = "binary"
weight = 0.10
description = "S07.network_recovery: After the two attempted network runs, the subsequent ordinary own-document DOM update and console marker execute successfully. Retain this observed recovery credit independently of earlier enforcement or preview failures."

[[criterion]]
id = "cw_harmless_scope_words"
name = "cw_harmless_scope_words"
type = "binary"
weight = 0.25
description = "S08.harmless_scope_words: The HTML control's ordinary quoted object keys and data lookups, strings, comments and text render and log all five words successfully; its locally named Worker data and Function function also log ordinary-binding ordinary-function."

[[criterion]]
id = "cw_unsupported_execution_refused"
name = "cw_unsupported_execution_refused"
type = "binary"
weight = 1.00
description = "S08.unsupported_execution_refused: With an actually successful supported-code control, each of the five separate unsupported-family probes is clearly refused without claiming successful execution. Score the refusal evidence independently of preserving the good render and subsequent recovery."

[[criterion]]
id = "cw_unsupported_refusal_preview"
name = "cw_unsupported_refusal_preview"
type = "binary"
weight = 0.30
description = "S08.unsupported_refusal_preview: Each of the five observed refused attempts retains/restores the actual most recent completed good preview recorded before that attempt. Actual refusal and a positively established good render are necessary evidence; a silent no-op or an allowed successful attempt does not prove refusal rollback. A later recovery failure does not erase valid preservation observations."

[[criterion]]
id = "cw_unsupported_execution_recovery"
name = "cw_unsupported_execution_recovery"
type = "binary"
weight = 0.20
description = "S08.unsupported_execution_recovery: After the five unsupported-family attempts, the new ordinary JavaScript DOM update and console marker execute successfully. Grade the actual recovery independently of earlier refusal or preview-preservation failures."

[[criterion]]
id = "cw_literal_loop_deadline"
name = "cw_literal_loop_deadline"
type = "binary"
weight = 2.50
description = "S09.literal_loop_deadline: The bounded braced, unbraced and Promise-callback loop controls first complete with their computed values. Both top-level infinite literal loops and the looping Promise callback then reach a visible timed-out state within the allowed budget margin, with a time-limit reason and early logs preserved; no later effects from those runs become current during the remaining observations. Grade these visible results, not hidden execution state. Rollback and later recovery have separate owners."

[[criterion]]
id = "cw_literal_loop_rollback"
name = "cw_literal_loop_rollback"
type = "binary"
weight = 0.75
description = "S09.literal_loop_rollback: Each loop timeout retains/restores recorded currentLastGood rather than a failed or empty candidate."

[[criterion]]
id = "cw_js_error_message"
name = "cw_js_error_message"
type = "binary"
weight = 0.25
description = "S10.js_error_message: The console identifies the not-a-function error involving forEeach."

[[criterion]]
id = "cw_js_error_line"
name = "cw_js_error_line"
type = "binary"
weight = 0.25
description = "S10.js_error_line: The error identifies line 4 of the exact entered JS source, without wrapper offsets."

[[criterion]]
id = "cw_js_error_rollback"
name = "cw_js_error_rollback"
type = "binary"
weight = 0.80
description = "S10.js_error_rollback: After successful A then distinct successful B, the JS failure restores B's text and visibly changed Preview note field, not A, the initial field value or failed-partial-dom. Later execution is scored separately."

[[criterion]]
id = "cw_html_error_message"
name = "cw_html_error_message"
type = "binary"
weight = 0.25
description = "S11.html_error_message: The console identifies undefinedFunctionCall from the complete HTML source."

[[criterion]]
id = "cw_html_error_line"
name = "cw_html_error_line"
type = "binary"
weight = 0.25
description = "S11.html_error_line: The error identifies script line 6 of the exact complete HTML document, including its markup and earlier matching ordinary paragraph text."

[[criterion]]
id = "cw_html_error_rollback"
name = "cw_html_error_rollback"
type = "binary"
weight = 0.40
description = "S11.html_error_rollback: The HTML failure restores recorded currentLastGood, not Failed HTML candidate. Later execution is scored separately."

[[criterion]]
id = "cw_timer_error_message"
name = "cw_timer_error_message"
type = "binary"
weight = 0.25
description = "S12.timer_error_message: Both JS and complete-HTML timer fixtures report their own thrown error marker as a failure."

[[criterion]]
id = "cw_timer_error_line"
name = "cw_timer_error_line"
type = "binary"
weight = 0.25
description = "S12.timer_error_line: The JS timer error identifies entered line 2 and the complete-HTML timer error identifies document line 6, including markup."

[[criterion]]
id = "cw_timer_error_rollback"
name = "cw_timer_error_rollback"
type = "binary"
weight = 0.40
description = "S12.timer_error_rollback: Both timer failures restore recorded currentLastGood instead of the failed candidate. Later execution is scored separately."

[[criterion]]
id = "cw_promise_error_message"
name = "cw_promise_error_message"
type = "binary"
weight = 0.25
description = "S13.promise_error_message: Error-object and plain-string unhandled rejections report their own error markers as failures in the specified JS and complete-HTML fixtures."

[[criterion]]
id = "cw_promise_error_line"
name = "cw_promise_error_line"
type = "binary"
weight = 0.25
description = "S13.promise_error_line: Both JS rejection fixtures identify entered line 2, and the complete-HTML rejection identifies document line 6, including markup. Plain-string reasons must not lose their location."

[[criterion]]
id = "cw_promise_error_rollback"
name = "cw_promise_error_rollback"
type = "binary"
weight = 0.40
description = "S13.promise_error_rollback: Each rejection restores recorded currentLastGood instead of its failed candidate. Later execution is scored separately."

[[criterion]]
id = "cw_console_level_stream"
name = "cw_console_level_stream"
type = "binary"
weight = 0.60
description = "S14.console_level_stream: The four authored console levels have their exact values, order and unambiguous level indicators; console.error alone is a log."

[[criterion]]
id = "cw_console_value_inspection"
name = "cw_console_value_inspection"
type = "binary"
weight = 0.80
description = "S15.console_value_inspection: App controls expose object properties, nested deep value and array elements rather than opaque summaries."

[[criterion]]
id = "cw_console_history"
name = "cw_console_history"
type = "binary"
weight = 0.30
description = "S16.console_history: Previously observed log entries remain while subsequent Runs actually append their distinct new markers, until Clear is used."

[[criterion]]
id = "cw_console_duration"
name = "cw_console_duration"
type = "binary"
weight = 0.10
description = "S16.console_duration: Observed successful short and delayed runs display elapsed durations consistent with their visibly measured lifetimes, allowing units, rounding and scheduling overhead. The delayed Run schedules its own timer; no duration update after a later preview interaction is required. A constant numeric placeholder does not pass."

[[criterion]]
id = "cw_console_clear_control"
name = "cw_console_clear_control"
type = "binary"
weight = 0.20
description = "S16.console_clear_control: Ordinary Clear removes prior rows; unrelated duration/status labels may remain."

[[criterion]]
id = "cw_autorun_debounce"
name = "cw_autorun_debounce"
type = "binary"
weight = 0.90
description = "S17.autorun_debounce: Enabled Auto-run waits for a typing pause, resets its wait on closer-spaced edits, then executes only the final version within about two seconds."

[[criterion]]
id = "cw_autorun_off_stays_idle"
name = "cw_autorun_off_stays_idle"
type = "binary"
weight = 0.30
description = "S17.autorun_off_stays_idle: First observe an authored edit execute automatically with Auto-run on and no manual Run. Then edits made with Auto-run already off remain unexecuted throughout the measured-delay-plus-margin window, and deliberate Run executes that exact pending source. A dead Auto-run feature cannot pass; correct debounce-reset behaviour is not a prerequisite."

[[criterion]]
id = "cw_autorun_off_cancels_queue"
name = "cw_autorun_off_cancels_queue"
type = "binary"
weight = 0.40
description = "S17.autorun_off_cancels_queue: After observing an authored edit execute automatically with Auto-run on, disable it before a further edit's measured debounce expires. That queued edit stays unexecuted for the full observation window and then executes through deliberate Run. A dead Auto-run feature cannot pass; correct debounce-reset behaviour is not a prerequisite."

[[criterion]]
id = "cw_manual_run_independent_of_autorun"
name = "cw_manual_run_independent_of_autorun"
type = "binary"
weight = 0.40
description = "S17.manual_run_independent_of_autorun: Ordinary Run executes authored code with Auto-run both on and off; the on-state proof has no pending edit debounce."

[[criterion]]
id = "cw_editor_monospace"
name = "cw_editor_monospace"
type = "binary"
weight = 0.10
description = "S19.editor_monospace: The populated editor uses a monospaced face."

[[criterion]]
id = "cw_editor_line_numbers"
name = "cw_editor_line_numbers"
type = "binary"
weight = 0.15
description = "S19.editor_line_numbers: The editor displays actual line numbers for entered source."

[[criterion]]
id = "cw_editor_syntax_colouring"
name = "cw_editor_syntax_colouring"
type = "binary"
weight = 0.25
description = "S19.editor_syntax_colouring: JS, complete HTML and CSS each have visible syntax colouring under their corresponding filenames."

[[criterion]]
id = "cw_saved_record_fidelity"
name = "cw_saved_record_fidelity"
type = "binary"
weight = 0.40
description = "S21.saved_record_fidelity: New drafts save as distinct exact records; loading restores each one's fields. S23's current Save updates its existing identity rather than adding another."

[[criterion]]
id = "cw_saved_records_browser_reload"
name = "cw_saved_records_browser_reload"
type = "binary"
weight = 0.50
description = "S21.saved_records_browser_reload: Both saved identities and exact fields remain retrievable after browser reload."

[[criterion]]
id = "cw_process_restart_durability"
name = "cw_process_restart_durability"
type = "binary"
weight = 1.80
description = "S22.process_restart_durability: The one process restart preserves every actual saved record's recorded identity, title, filename, exact source and revision, each present exactly once, including S21's HTML Beta and the JavaScript/CSS restart fixtures. Compare the whole recorded collection, ignoring order and unrelated display metadata. A later Save failure does not erase these observed readbacks."

[[criterion]]
id = "cw_restart_example_inventory"
name = "cw_restart_example_inventory"
type = "binary"
weight = 0.20
description = "S22.restart_example_inventory: After the same completed process restart, the built-in example choices retain their recorded entries and multiplicities; starting again adds no duplicate examples. Observe the actual example inventory independently of saved-user-record readbacks. No specific names, ordering, identifiers or picker layout are required."

[[criterion]]
id = "cw_process_restart_write"
name = "cw_process_restart_write"
type = "binary"
weight = 0.50
description = "S22.process_restart_write: After the same completed restart, a valid current-revision Save changes only its target, advances its revision and persists on a fresh read. Use the independent fresh-record fallback if the pre-restart target is unavailable; do not inherit the durability verdict."

[[criterion]]
id = "cw_stale_save_server_refusal"
name = "cw_stale_save_server_refusal"
type = "binary"
weight = 1.80
description = "S23.stale_save_server_refusal: In both successive trials with editor roles reversed, an otherwise-valid stale Save is refused with newer fields/revision unchanged. The successful newer Save is its control; S21 owns update fidelity."

[[criterion]]
id = "cw_stale_save_draft_preservation"
name = "cw_stale_save_draft_preservation"
type = "binary"
weight = 1.40
description = "S23.stale_save_draft_preservation: In both successive trials with editor roles reversed, the actual dirty editor gets useful conflict feedback and retains all exact unsaved fields after the stale Save attempt. Proactive prevention is valid. Observe these fields before deliberately reloading; later current-revision saving has a separate owner."

[[criterion]]
id = "cw_title_trimming"
name = "cw_title_trimming"
type = "binary"
weight = 0.30
description = "S24.title_trimming: Padded unused titles are stored/displayed trimmed after creation and an ordinary Save update."

[[criterion]]
id = "cw_title_collision_refusal"
name = "cw_title_collision_refusal"
type = "binary"
weight = 0.40
description = "S24.title_collision_refusal: With actually successful prior valid creation/update controls, UI and observed server formats refuse exact/padded collisions for NEW creation and current-revision updates, with useful feedback and all complete records/revisions unchanged. Valid-write controls may use unused unpadded titles independently of trimming credit. Later recovery is scored separately."

[[criterion]]
id = "cw_title_empty_rejected"
name = "cw_title_empty_rejected"
type = "binary"
weight = 0.15
description = "S24.title_empty_rejected: With actually successful prior valid creation/update controls, otherwise-valid empty and whitespace-only titles are refused for NEW creation and current-revision updates without saved-state mutation. Valid-write controls may use unused unpadded titles independently of trimming credit. Later recovery is scored separately."

[[criterion]]
id = "cw_title_case_sensitive"
name = "cw_title_case_sensitive"
type = "binary"
weight = 0.25
description = "S24.title_case_sensitive: A case-distinct title coexists under its own identity and exact fields."

[[criterion]]
id = "cw_theme_actual_switch"
name = "cw_theme_actual_switch"
type = "binary"
weight = 0.20
description = "S34.theme_actual_switch: The control switches chrome, editor and console into both actual appearances; either may be the starting theme."

[[criterion]]
id = "cw_theme_work_preserved"
name = "cw_theme_work_preserved"
type = "binary"
weight = 0.20
description = "S34.theme_work_preserved: During two actually observed theme changes, the recorded exact draft fields and existing successful preview/console output remain intact. Preview recolouring is not required."

[[criterion]]
id = "cw_callback_shared_run_deadline"
name = "cw_callback_shared_run_deadline"
type = "binary"
weight = 1.00
description = "S36.callback_shared_run_deadline: A working short nested-timer control produces its completion marker. With both delays increased to three seconds, the outer callback's entry marker appears, the run reports a time-limit reason within the allowed margin, and the inner callback's completion marker never appears in the current preview or console throughout S36's ten-second observation. The original run must not later claim success. These visible effects establish the shared-budget outcome without claiming hidden callback termination. Preview restoration and later recovery are separate."

[[criterion]]
id = "cw_callback_timeout_rollback"
name = "cw_callback_timeout_rollback"
type = "binary"
weight = 0.35
description = "S36.callback_timeout_rollback: The timed-out callback retains/restores recorded currentLastGood rather than failed-loop-candidate; provisional display is optional."

[[criterion]]
id = "cw_js_error_recovery"
name = "cw_js_error_recovery"
type = "binary"
weight = 0.10
description = "S10.js_error_recovery: After the observed js failure, a new valid Run produces its own rendered and logged recovery markers. Do not inherit rollback, error-message or line-number verdicts."

[[criterion]]
id = "cw_html_error_recovery"
name = "cw_html_error_recovery"
type = "binary"
weight = 0.10
description = "S11.html_error_recovery: After the observed html failure, a new valid Run produces its own rendered and logged recovery markers. Do not inherit rollback, error-message or line-number verdicts."

[[criterion]]
id = "cw_timer_error_recovery"
name = "cw_timer_error_recovery"
type = "binary"
weight = 0.10
description = "S12.timer_error_recovery: After the observed timer failure, a new valid Run produces its own rendered and logged recovery markers. Do not inherit rollback, error-message or line-number verdicts."

[[criterion]]
id = "cw_promise_error_recovery"
name = "cw_promise_error_recovery"
type = "binary"
weight = 0.10
description = "S13.promise_error_recovery: After the observed promise failure, a new valid Run produces its own rendered and logged recovery markers. Do not inherit rollback, error-message or line-number verdicts."

[[criterion]]
id = "cw_terminal_durations"
name = "cw_terminal_durations"
type = "binary"
weight = 0.10
description = "S16.terminal_durations: Already-observed failed, stopped and timed-out runs also show elapsed durations consistent with their recorded lifetimes. Judge the duration evidence independently of rollback or later recovery."

[[criterion]]
id = "cw_save_load_execution_canary"
name = "cw_save_load_execution_canary"
type = "binary"
weight = 0.20
description = "S21.save_load_execution_canary: Saving, updating and loading the carrier as text cause no observable execution side effect on its dedicated monitor record, with matching successful write controls. Attribute browser-originated requests separately; this bounded canary is not proof that all server evaluation is absent."

[[criterion]]
id = "cw_completed_stop_recovery"
name = "cw_completed_stop_recovery"
type = "binary"
weight = 0.10
description = "S03.completed_stop_recovery: After the Stop attempt on a completed preview, the subsequent ordinary Run produces both completed-stop-recovered DOM and completed-stop-recovered-log. Score later execution independently of the Stop and delayed-handler results."

[[criterion]]
id = "cw_pending_stop_recovery"
name = "cw_pending_stop_recovery"
type = "binary"
weight = 0.20
description = "S04.pending_stop_recovery: After attempting Stop during the observed pending timer, a subsequent short ordinary Run produces its own DOM and console markers. Keep this observed later execution independent of cancellation and rollback."

[[criterion]]
id = "cw_origin_boundary_recovery"
name = "cw_origin_boundary_recovery"
type = "binary"
weight = 0.15
description = "S05.origin_boundary_recovery: After the parent-access attempts, the final ordinary own-document DOM update and console marker succeed. Grade this observation independently of whether the parent-access boundary held."

[[criterion]]
id = "cw_literal_loop_recovery"
name = "cw_literal_loop_recovery"
type = "binary"
weight = 0.25
description = "S09.literal_loop_recovery: After the three supported loop attempts, the subsequent ordinary recovery snippet renders and logs timeout-recovered. Score that actual new execution independently of the deadline and preview-restoration observations."

[[criterion]]
id = "cw_callback_deadline_recovery"
name = "cw_callback_deadline_recovery"
type = "binary"
weight = 0.15
description = "S36.callback_deadline_recovery: After the nested-callback attempt, the final ordinary source renders shared-deadline-recovered and logs shared-deadline-recovered-log, without old work replacing them. Grade this later execution independently of timeout enforcement or rollback."

[[criterion]]
id = "cw_stale_save_reapply"
name = "cw_stale_save_reapply"
type = "binary"
weight = 0.60
description = "S23.stale_save_reapply: In both trials with editor roles reversed, deliberately loading the latest copy, reapplying the recorded dirty fields and saving through the UI succeeds under the same identity with advanced revision and exact fresh readback. Use the recorded pre-attempt draft even if its preservation failed. Earlier refusal, feedback or preservation verdicts are not prerequisites."

[[criterion]]
id = "cw_title_refusal_recovery"
name = "cw_title_refusal_recovery"
type = "binary"
weight = 0.10
description = "S24.title_refusal_recovery: After the invalid-title attempts, saving the existing Source under unused title QC Title Recovered succeeds, advances its revision and changes no sibling, as confirmed on a fresh read. Attempt it using the actual current identity/revision even if an earlier refusal failed; do not inherit trimming, collision, emptiness or case-sensitive-title verdicts."
