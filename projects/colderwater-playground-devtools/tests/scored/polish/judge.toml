[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "cw_controls_keyboard_and_focus"
name = "cw_controls_keyboard_and_focus"
type = "binary"
weight = 1.0
description = """
Using only the keyboard, move through the title and filename fields, the Run, Stop and Save controls, the editor's Format, Find and Replace controls, and the library. Each of these controls that the app offers must be reachable with Tab or Shift+Tab and must show a visible focus indicator when focused. From inside the code editor it must be possible to leave to the next control with the keyboard alone, through whatever key sequence the app states or the ordinary Tab key. Fails if an offered control cannot be reached by keyboard, if focus is invisible on a reached control, or if keyboard focus is trapped inside the code editor with no working way out. A control the app does not have at all is scored elsewhere, not here.
"""

[[criterion]]
id = "cw_controls_feedback_and_labels"
name = "cw_controls_feedback_and_labels"
type = "binary"
weight = 1.0
description = """
Check that the main controls have understandable visible names and that three ordinary actions each give visible feedback a person can read: a Run that completes, a Run that throws an error, and a successful Save. After each action a status, message or console entry must say in words what happened. Exact wording is free. Fails if a main control has no readable name, or if any of the three actions ends with no visible textual feedback.
"""

[[criterion]]
id = "cw_focus_returns_to_code"
name = "cw_focus_returns_to_code"
type = "binary"
weight = 1.0
description = """
Type a short valid JavaScript draft and leave the caret at a known place. Activate Format document with the mouse, then immediately type one character without clicking in the editor: it must be inserted into the source. Do the same check after clicking Undo, after clicking Redo, after a Replace all that changed something, and after clicking Save: each time, typing one character straight afterwards must insert it into the source. Fails if after any of these five actions the typed character does not arrive in the source because keyboard focus stayed on the button or went elsewhere.
"""

[[criterion]]
id = "cw_undo_redo_availability"
name = "cw_undo_redo_availability"
type = "binary"
weight = 1.0
description = """
Load a saved snippet or start a new draft so there is no editing history, and look at the visible Undo and Redo controls: both must be shown as unavailable (disabled). Type a character: Undo becomes available and Redo stays unavailable. Use Undo: Redo becomes available and Undo is unavailable again. Type another character: Redo becomes unavailable again. Fails if either control looks available when it has nothing to do at any of these four points, or if the app has no visible Undo and Redo controls.
"""

[[criterion]]
id = "cw_unsaved_marker"
name = "cw_unsaved_marker"
type = "binary"
weight = 1.0
description = """
Save a snippet so the draft equals the saved revision and read the visible indication of its state: it must say the draft is saved or unchanged. Type one character in the source: the indication must change to say there are unsaved changes. Use Undo so the source equals the saved text again: the unsaved indication must go away. Type again and Save: the unsaved indication must go away after the Save. Fails if the app shows no visible saved or unsaved indication, if the indication does not appear after the edit, or if it stays after Undo restored the saved text or after the Save succeeded.
"""

[[criterion]]
id = "cw_narrow_width_usable"
name = "cw_narrow_width_usable"
type = "binary"
weight = 1.0
description = """
Resize the browser viewport to about 390 by 844 pixels and reload. The page must not scroll sideways. By scrolling only vertically, reach the code editor, the Run control, the preview, the console and the library. At this width type a one-line program in the editor, Run it and see its output in the preview and its console line. The editor's own controls must not overlap each other or be cut off. Fails if the page needs sideways scrolling, if any of those five areas cannot be reached, if controls overlap or are clipped so they cannot be read or pressed, or if typing and Run do not work at this width. Restore the desktop viewport afterwards.
"""
