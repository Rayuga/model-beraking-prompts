[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "responsive_layout"
name = "responsive_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 viewport, confirm the editor, preview and console can each be reached and used. Stacking, tabs, drawers and intentional pane scrolling are valid. Essential controls must not be permanently clipped or hidden behind another pane; horizontal scrolling within long code or console content is acceptable.
"""

[[criterion]]
id = "cw_controls_have_names"
name = "cw_controls_have_names"
type = "binary"
weight = 0.25
description = """
During P02, every requested enabled control has a visible label or accessible name identifying its purpose. Judge names independently of reachability, focus styling and successful navigation.
"""

[[criterion]]
id = "cw_controls_keyboard_reachable"
name = "cw_controls_keyboard_reachable"
type = "binary"
weight = 0.25
description = """
During P02, use actual keyboard events to reach every requested enabled control, including native/composite menus. Disabled controls need not be tab stops. Judge reachability independently of names, visible focus and successful view changes.
"""

[[criterion]]
id = "cw_controls_focus_visible"
name = "cw_controls_focus_visible"
type = "binary"
weight = 0.25
description = """
During actual P02 keyboard traversal, reached controls have visible focus feedback; native outlines are valid. An unreachable control affects the reachability outcome and does not erase focus credit for controls reached. If no control can receive keyboard focus, this outcome lacks positive evidence and fails.
"""

[[criterion]]
id = "cw_keyboard_library_navigation"
name = "cw_keyboard_library_navigation"
type = "binary"
weight = 0.25
description = """
During P02 use only actual keyboard actions to leave the editor, choose an example, load the recognisable saved control and return to the editor. Observe the correct example and saved source. Standard editor escape keys are valid without documentation. Judge navigation and return independently of labels or focus appearance; pointer setup is allowed before the route, not during it.
"""

[[criterion]]
id = "workspace_organisation"
name = "workspace_organisation"
type = "binary"
weight = 1.0
description = """
The editor, preview and console are recognisable from their labels or layout. The current filename and the saved-snippets library can be located without guessing at an unlabelled hidden surface. Empty library and console states are valid. Judge whether a user can understand which surface holds editable code, output or saved work; do not prescribe a pane arrangement or regrade theme switching, persistence or execution.
"""
