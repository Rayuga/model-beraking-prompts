[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "cw_controls_keyboard_and_focus"
name = "cw_controls_keyboard_and_focus"
type = "binary"
weight = 1.0
description = """
Use real keyboard traversal through the editor and the enabled controls offered for Format, Find, Run, Save and library/history. Judge whether each offered control is keyboard reachable and visibly focused, including leaving the custom editor through its ordinary Escape/Tab path. A feature that is absent entirely is scored by Functional, not by this row; do not require a complete keyboard-only workflow here.
"""

[[criterion]]
id = "cw_controls_feedback_and_labels"
name = "cw_controls_feedback_and_labels"
type = "binary"
weight = 1.0
description = """
Visible editor actions and save/conflict/run states have understandable names and status feedback. Inspect a successful format, an invalid format attempt and an unsaved draft. Require that users can tell what happened and whether source was saved, without reading implementation. Exact wording is free.
"""
