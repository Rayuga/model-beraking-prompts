[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "cw_visual_editor_readability"
name = "cw_visual_editor_readability"
type = "likert"
points = 5
weight = 1.0
description = """
Assess the rendered editor typography, line-number alignment, source readability and contrast at desktop size. This is visual quality, not exact token classification or line-number correctness. 5: clear and comfortable throughout; 4: minor distractions; 3: usable but several readability flaws; 2: substantial difficulty reading code; 1: mostly unreadable; 0: editor missing or impossible to read.
"""

[[criterion]]
id = "cw_visual_workspace_layout"
name = "cw_visual_workspace_layout"
type = "likert"
points = 5
weight = 1.0
description = """
Assess spacing and hierarchy among editor, preview, console, library and primary controls at desktop size. Do not penalize arbitrary authored preview content. 5: clear grouping and no important overlap; 4: minor spacing issues; 3: several crowded areas; 2: frequent overlap/clipping; 1: severe layout problems; 0: workspace missing or unusable.
"""

[[criterion]]
id = "cw_visual_component_finish"
name = "cw_visual_component_finish"
type = "likert"
points = 5
weight = 1.0
description = """
Assess colour harmony, repeated controls and visible finish of the app's own surfaces. Judge separately from editor typography and pane geometry. 5: coherent and polished; 4: a few small inconsistencies; 3: several mismatched details; 2: broadly rough; 1: largely unfinished; 0: app surfaces missing or unreadable.
"""
