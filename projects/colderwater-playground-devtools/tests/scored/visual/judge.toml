[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "cw_visual_editor_readability"
name = "cw_visual_editor_readability"
type = "likert"
points = 5
weight = 1.0
description = """
With a ten-line JavaScript draft in the editor at desktop size, assess the rendered editor's typography, line-number alignment with their lines, text contrast and the visibility of the caret and of a selection. This is about how the code looks, not whether token categories are correct.
5: clear and comfortable throughout, numbers aligned, caret and selection easy to see.
4: one or two minor distractions.
3: usable but several readability flaws.
2: code is hard to read or numbers are misaligned.
1: mostly unreadable or visibly corrupted text.
0: no editor is shown.
"""

[[criterion]]
id = "cw_visual_workspace_layout"
name = "cw_visual_workspace_layout"
type = "likert"
points = 5
weight = 1.0
description = """
At desktop size, assess the arrangement of the editor, preview, console, library and main controls: grouping, spacing, alignment and whether anything overlaps or is clipped. Do not judge the content that authored code draws inside the preview.
5: clear grouping, consistent spacing, nothing overlapping or clipped.
4: one or two small spacing issues.
3: several crowded or uneven areas.
2: frequent overlap or clipping.
1: severe layout problems throughout.
0: no workspace is shown.
"""

[[criterion]]
id = "cw_visual_component_finish"
name = "cw_visual_component_finish"
type = "likert"
points = 5
weight = 1.0
description = """
At desktop size, assess the colour harmony, consistency of buttons, fields and notices, and the overall finish of the app's own surfaces. Judge this separately from editor typography and from pane arrangement.
5: coherent and polished: one palette, consistent buttons, fields and notices.
4: a few small inconsistencies.
3: several mismatched or unstyled details.
2: broadly rough: many controls look unrelated to each other.
1: largely unfinished or default browser styling throughout.
0: no app surface is shown.
"""
