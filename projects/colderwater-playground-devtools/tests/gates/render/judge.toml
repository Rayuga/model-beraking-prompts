[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "cw_workspace_runs_authored_marker"
name = "cw_workspace_runs_authored_marker"
type = "binary"
weight = 1.0
description = """
Open http://localhost:3000 without signing in. Confirm a usable editor, preview and console workspace. An empty saved library is valid; a blank page, generic error or noninteractive placeholder fails.

Turn Auto-run off, use a new unsaved JavaScript draft with a .js filename, and enter a short valid snippet of your own. Choose a new distinctive marker and two small positive integers. Have the source add those integers, combine the computed sum with the marker in a variable, assign that variable to document.body.textContent, and console.log the same variable. For example, choose your own values for marker, a and b, then use const output = marker + ':' + (a + b); document.body.textContent = output; console.log(output);. Determine the expected result before running, but do not put that completed output into a source string literal. Confirm the actual editor contains that source, press Run, and observe the correct computed output in both the rendered preview and console. Source text or copied literals alone are insufficient. This is one ordinary successful JavaScript calculation, not a language-conformance or performance test. A dead Run or a demo that only copies quoted source strings fails this basic working-workspace prerequisite.

Match controls by purpose, not exact selectors or labels. Handle unsaved-work confirmations deliberately. Do not save, delete or change any library record. After two failed attempts at the same app action, report the observed failure. Grade only this ordinary successful run; language dispatch, failure recovery, time limits, precise console behavior, storage rules, editor features and styling remain scored criteria.
"""
