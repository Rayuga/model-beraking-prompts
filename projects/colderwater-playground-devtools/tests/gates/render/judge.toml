[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "cw_authored_custom_editor_run"
name = "cw_authored_custom_editor_run"
type = "binary"
weight = 1.0
description = """
Open / and find the code editing area, the preview and the console. Clear the draft and, through the visible editor with the real keyboard, type a one-line JavaScript program that adds two small integers you choose and writes the sum both to the preview document and to the console. Press Run: the preview and the app console must both show the correct sum. Change one of the two integers in the editor with the keyboard and Run again: both must show the new sum. This checks only that ordinary typing and running work. Fails if text cannot be typed into the editor, if Run does not show the computed sum in the preview and the console, or if the second Run still shows the first sum. Do not save anything and do not judge any other feature here.
"""
