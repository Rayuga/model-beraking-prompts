[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "cw_workspace_loads_and_takes_typing"
name = "cw_workspace_loads_and_takes_typing"
type = "binary"
weight = 1.0
description = """
Open / and wait for the page to load. The page must show a workspace with a code editing area and areas for a preview and a console, without a blank page or a fatal error. Click into the code editing area and type one short distinctive word with real key presses: the word must appear in the editor. Reload the page: the workspace must load again. This checks only that the app is running and its editor accepts typing. Fails if the page is blank or shows only an error, if no code editing area is shown, if the typed word does not appear in the editor, or if the workspace does not load again after the reload. Do not press Run, do not save anything and do not judge any other feature here.
"""
