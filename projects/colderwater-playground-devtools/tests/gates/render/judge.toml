[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "cw_workspace_loads_and_reloads"
name = "cw_workspace_loads_and_reloads"
type = "binary"
weight = 1.0
description = """
Open / and wait for the page to load. The page must show the playground workspace with a code editing area, without a blank page or a fatal error. Reload the page: the workspace must load again. If the browser asks whether to leave the page, accept that dialog; a reload that waits for that dialog is not a failure. This checks only that the app is running and serves its workspace. Fails if the page is blank or shows only an error, if no code editing area is shown, or if the workspace does not load again after the reload. Do not type, press Run, save anything or judge any other feature here; other dimensions grade those.
"""
