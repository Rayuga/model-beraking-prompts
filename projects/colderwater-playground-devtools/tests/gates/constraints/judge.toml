[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "cw_custom_document_surface"
name = "cw_custom_document_surface"
type = "binary"
weight = 1.0
description = """
Enter a distinctive word into the code editor by typing it or by pasting it with the usual shortcut, then inspect the live DOM read-only to find where that word is displayed. If neither puts the word into the editor, inspect where the source already shown in the editor is displayed instead. Fails if the displayed source text lives in a textarea, an input or an element with contenteditable enabled, including a transparent one layered over a highlighted copy, or if the editing area or its ancestors carry the root markers of a ready-made editor: class names cm-editor, CodeMirror, monaco-editor, ace_editor, ProseMirror, tiptap or ql-editor, the attribute data-slate-editor, or a DraftEditor class. Passes when the source is drawn by ordinary non-editable elements, canvas or SVG. A small input or textarea that is used only to receive keyboard or clipboard events is allowed as long as it is not what shows the source to the user: the source the user sees must be drawn by the other elements. Judge only these observable DOM facts; do not judge how well the editor works here.
"""

[[criterion]]
id = "cw_shared_saved_record"
name = "cw_shared_saved_record"
type = "binary"
weight = 1.0
description = """
Create one new .js snippet with a unique title and a short unique source entered in the editor by typing or by pasting with the usual shortcut, and the Save control, and see any visible sign that the Save went through, such as a status message or the snippet appearing in the library; the response need not echo the saved fields. Then clear this origin's browser storage as described in the application notes and reload the page, so nothing held only in the browser survives. Find that snippet in the library, open it and confirm the exact title, filename and source. Reload once more and confirm them again. Fails if the snippet is missing after browser storage was cleared, if any of the three fields differs, or if the snippet disappears after the second reload. Leave the saved record in place.
"""
