[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "cw_custom_document_surface"
name = "cw_custom_document_surface"
type = "binary"
weight = 1.0
description = """
Type a distinctive word into the code editor, then inspect the live DOM read-only to find where that word is displayed and which element has keyboard focus while typing. Fails if the displayed source text lives in a textarea, an input or an element with contenteditable enabled, including a transparent one layered over a highlighted copy, or if the editing area or its ancestors carry the root markers of a ready-made editor: class names cm-editor, CodeMirror, monaco-editor, ace_editor, ProseMirror, tiptap or ql-editor, the attribute data-slate-editor, or a DraftEditor class. Passes when the source is drawn by ordinary non-editable elements, canvas or SVG. A small input or textarea that is used only to receive keyboard or clipboard events is allowed as long as it does not hold or display the document source. Judge only these observable DOM facts; do not judge how well the editor works here.
"""

[[criterion]]
id = "cw_shared_saved_record"
name = "cw_shared_saved_record"
type = "binary"
weight = 1.0
description = """
Create one new .js snippet with a unique title and a short unique source through the editor and the Save control, and see that the app reports the Save as successful; the response need not echo the saved fields. Open the app in a second tab or browser context, find that snippet in the library, open it and confirm the exact title, filename and source. Reload that second page and confirm them again. Fails if the snippet is missing from the second page, if any of the three fields differs, or if the snippet disappears after the reload. Leave the saved record in place.
"""
