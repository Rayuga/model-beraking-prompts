[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "cw_custom_document_surface"
name = "cw_custom_document_surface"
type = "binary"
weight = 1.0
description = """
Inspect the live primary code editing surface and its ancestors read-only. Require a custom DOM, canvas or SVG editing surface. A textarea, input, contenteditable document surface, CodeMirror, Monaco, Ace, ProseMirror, TipTap, Quill, Slate, Draft.js or another ready-made editor implementing the document surface fails. A small input used only for keyboard or clipboard plumbing and an independent parser or formatter library are allowed. Use rendered DOM and browser-loaded asset evidence when needed, and explain how the surface actually handles editing. This is a hard prerequisite; a prohibited surface fails this gate regardless of its appearance or typing ability.
"""

[[criterion]]
id = "cw_shared_saved_record"
name = "cw_shared_saved_record"
type = "binary"
weight = 1.0
description = """
Create one unique new .js snippet through the editor and Save UI. Observe that the application accepts the write; its response need not echo the saved fields. In a separate clean browser context with no copied storage, open the normal library, load the same identity and confirm the exact title, filename and source from a fresh server response or server-rendered data. Reload the clean context and confirm again. A success toast, client storage alone, static seed file or separate duplicate creation cannot pass. Leave the saved gate record intact.
"""
