schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/colderwater-playground-devtools"
description = "A browser code playground with a custom editor, formatting, multiple carets, isolated preview and saved revisions."
keywords = ["webdev", "turing", "full-stack", "custom-editor", "javascript", "html", "formatting", "code-playground", "devtools"]

[metadata]
difficulty = "hard"
difficulty_explanation = "The main challenges are implementing a custom code editor with selection, multi-caret undo and formatting, then integrating its exact source with isolated execution and revision-safe saving."
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "Adapted from the supplied Colderwater playground task."
arena_slice = "custom-code-editor-formatting-preview-history"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
