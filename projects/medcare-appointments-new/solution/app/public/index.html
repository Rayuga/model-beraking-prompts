<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedCare Appointments</title>
  <style>
    :root {
      --ink: #17324d;
      --muted: #62758a;
      --primary: #087f8c;
      --primary-dark: #05636d;
      --surface: #fff;
      --background: #f2f7f8;
      --border: #d9e5e7;
      --success: #0b7a53;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--background);
      line-height: 1.55;
    }
    header {
      background: #0e3447;
      color: white;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 12px #0e344733;
    }
    .container { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { font-size: 1.25rem; font-weight: 750; letter-spacing: -.02em; }
    nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    nav a { color: white; text-decoration: none; padding: 8px 10px; }
    nav label { font-size: .82rem; color: #d7edf0; }
    nav select {
      max-width: 250px;
      padding: 9px 12px;
      border: 1px solid #ffffff55;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    #current-user { font-size: .88rem; color: #d7edf0; }
    .page { padding: 48px 0 80px; }
    h2 {
      margin: 8px 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -.035em;
    }
    h3 { font-size: 1.35rem; margin: 24px 0 16px; }
    h4 { font-size: 1.1rem; margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .eyebrow {
      color: var(--primary);
      font-size: .82rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .1em;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 28px 0 36px;
    }
    .btn {
      display: inline-block;
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary {
      background: white;
      color: var(--ink);
      border: 1px solid var(--border);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 6px 24px #17324d0b;
    }
    .card p { margin: 7px 0; }
    .profile { max-width: 760px; margin-top: 20px; }
    .profile hr {
      margin: 28px 0;
      border: 0;
      border-top: 1px solid var(--border);
    }
    .accent { color: var(--primary); font-weight: 750; }
    .status {
      display: block;
      width: fit-content;
      margin-top: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--success);
      background: #e4f6ef;
      font-size: .82rem;
      font-weight: 750;
      text-transform: capitalize;
    }
    .empty {
      padding: 28px;
      border: 1px dashed #a9bec2;
      border-radius: 12px;
      background: #ffffff88;
      color: var(--muted);
    }
    .link-button {
      border: 0;
      background: transparent;
      color: var(--primary);
      padding: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    label { display: block; font-weight: 700; margin: 16px 0 6px; }
    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #b9cacc;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 88px; resize: vertical; }
    .error { color: #b42318; }
    .success-card { text-align: center; max-width: 620px; margin: 40px auto; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: 24px;
      background: #0b202dbb;
    }
    .modal.active { display: grid; place-items: center; }
    .modal-content {
      width: min(560px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      position: relative;
      background: white;
      border-radius: 14px;
      padding: 28px;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      border: 0;
      background: transparent;
      font-size: 1.8rem;
      cursor: pointer;
    }
    footer {
      padding: 28px 0;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    @media (max-width: 760px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px 0;
      }
      nav { justify-content: flex-start; }
      #current-user { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">MedCare Appointments</div>
      <nav id="nav" aria-label="Primary navigation">Loading demo session…</nav>
    </div>
  </header>
  <main id="main-content"></main>
  <footer>
    <div class="container">MedCare demo · Local SQLite data · Stripe test payments</div>
  </footer>
  <script src="/js/app.js"></script>
</body>
</html>
