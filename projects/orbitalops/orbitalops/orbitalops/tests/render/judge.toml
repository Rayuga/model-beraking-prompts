# Prompt version: orbitalops-render-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "authenticated_render"
name = "authenticated_render"
type = "binary"
weight = 2.0
description = """
Sign in as the operator (mara.okoye@orbitalops.test) and confirm a substantive, usable Orbital Ops Console renders with populated content — a constellation status view showing craft cards — without a fatal browser error or broken page.
"""

[[criterion]]
id = "workspace_rendering"
name = "workspace_rendering"
type = "binary"
weight = 1.0
description = """
Sign in as the administrator (root@orbitalops.test), who sees every tab. Open Constellation, Command queue, Telemetry, and Administration. Each destination must visibly activate and show its own meaningful heading and content; four labels pointing to one unchanged screen do not pass.
"""
