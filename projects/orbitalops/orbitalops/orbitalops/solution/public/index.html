<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbital Ops Console</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="topbar" aria-label="Orbital Ops Console header">
    <strong id="brand">Orbital Ops</strong>
    <nav id="nav" aria-label="Primary"></nav>
    <span id="who" aria-live="polite"></span>
    <button id="theme-toggle" type="button" aria-label="Toggle light and dark theme">Theme</button>
    <button id="logout" type="button" hidden>Sign out</button>
  </header>

  <main id="main">
    <section id="login-view" aria-labelledby="login-title">
      <h1 id="login-title">Ground-station console — sign in</h1>
      <form id="login-form">
        <label>Email <input id="email" name="email" type="email" autocomplete="username" required value="mara.okoye@orbitalops.test" /></label>
        <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required value="password123" /></label>
        <button type="submit">Sign in</button>
      </form>
      <p class="muted">Accounts (password <code>password123</code>): operator <code>mara.okoye@orbitalops.test</code>,
        flight director <code>iris.vance@orbitalops.test</code>, analyst <code>tomas.lind@orbitalops.test</code>,
        admin <code>root@orbitalops.test</code>.</p>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="app-view" hidden>
      <div id="flash" aria-live="polite"></div>
      <div id="workspace"></div>
    </section>
  </main>

  <div id="detail-backdrop" class="drawer-backdrop" hidden>
    <aside id="detail-drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="drawer-head">
        <h2 id="detail-title">Details</h2>
        <button id="detail-close" type="button" aria-label="Close details">Close</button>
      </div>
      <div id="detail-body"></div>
    </aside>
  </div>

  <script src="/js/orbitalops.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
