schema_version = "1.4"
artifacts = ["/app", "/logs/verifier"]

[task]
name = "turing/orbitalops"
version = "1.2.0"
description = "Full-stack Node.js, Express, and SQLite satellite ground-station operations console with role-scoped authorization workflows and browser-only Luna judging"
keywords = ["webdev", "codearena", "full-stack", "nodejs", "express", "sqlite", "satellite", "authorization", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "converted/restructured from an externally-sourced satellite ground-station ops console task (orbital-ops-console-simulation-strategy), full template conversion to the v2 4-dim format, 2026-09-01"
arena_slice = "full-stack-node-express-sqlite-orbitalops"
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
