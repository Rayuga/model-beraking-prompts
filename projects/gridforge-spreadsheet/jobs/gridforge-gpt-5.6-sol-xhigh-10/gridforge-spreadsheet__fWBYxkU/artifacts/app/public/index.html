<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridForge</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">GF</span><div><strong>GridForge</strong><span id="title">Loading workbook…</span></div></div>
  <div id="presence" class="presence" aria-label="People currently viewing"></div>
  <label class="user">Editing as <select id="userSelect" aria-label="Signed in user"></select></label>
  <button id="cellHistoryBtn">Cell history</button><button id="historyBtn">Revision history</button><button id="saveBtn" class="primary">Save now</button>
</header>
<div class="statusbar"><span id="sheetTitle">Plan</span><span id="revision">Revision —</span><span id="saveState" class="saved">Loading…</span><span id="message" role="alert"></span></div>
<section class="toolbar" aria-label="Spreadsheet tools">
  <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button><span class="divider"></span>
  <button id="copyBtn">Copy</button><button id="cutBtn">Cut</button><button id="pasteBtn">Paste</button><button id="clearBtn">Clear</button><button id="fillDownBtn">Fill down</button><button id="fillRightBtn">Fill right</button>
  <span class="divider"></span><button id="findToggle">Find & replace</button>
</section>
<section id="findPanel" class="find-panel hidden">
  <input id="findInput" placeholder="Find text" aria-label="Find text"><input id="replaceInput" placeholder="Replace with" aria-label="Replacement text"><button id="findNextBtn">Find next</button><button id="replaceBtn">Replace</button><button id="replaceAllBtn">Replace all</button><button id="findClose">Close</button><span id="findStatus"></span>
</section>
<section class="formula-row">
  <input id="nameBox" value="A1" aria-label="Name box: jump to a cell or range"><span class="fx">fx</span><input id="formulaBar" aria-label="Formula or cell value" autocomplete="off" spellcheck="false"><button id="commitFormula" title="Commit formula">✓</button>
</section>
<main id="gridWrap" tabindex="0" aria-label="Spreadsheet grid. Use arrow keys to navigate.">
  <div id="grid" role="grid"></div><input id="cellEditor" autocomplete="off" spellcheck="false" aria-label="Edit cell"><div id="suggestions" class="suggestions hidden"></div>
</main>
<footer><span id="selectionSummary">A1</span><span class="hint">Double-click or type to edit · Drag to select · Ctrl+C / Ctrl+V</span></footer>
<aside id="revisionPanel" class="side-panel hidden" aria-label="Revision history"><div class="panel-head"><div><strong>Revision history</strong><small>Preview or restore a saved version</small></div><button id="historyClose">×</button></div><div id="revisionList"></div></aside>
<aside id="cellHistoryPanel" class="side-panel left hidden" aria-label="Cell history"><div class="panel-head"><div><strong id="cellHistoryTitle">Cell history</strong><small>Who changed this cell</small></div><button id="cellHistoryClose">×</button></div><div id="cellHistoryList"></div></aside>
<div id="conflictBanner" class="conflict hidden"><strong>Save conflict</strong><span id="conflictText"></span><button id="reloadBtn">Load saved version</button><button id="dismissConflict">Keep my draft</button></div>
<script src="/app.js"></script>
</body></html>
