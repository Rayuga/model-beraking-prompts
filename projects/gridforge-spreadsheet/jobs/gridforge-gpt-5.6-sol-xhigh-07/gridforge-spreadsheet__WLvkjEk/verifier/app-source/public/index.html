<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridForge</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header>
  <div><div class="brand">GridForge</div><h1 id="title">Loading workbook…</h1></div>
  <div class="identity"><label>Signed in as <select id="user"></select></label><span id="presenceSummary"></span></div>
</header>
<div id="presence" aria-label="People viewing workbook"></div>
<nav class="toolbar" aria-label="Spreadsheet controls">
  <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
  <button id="save">Save now</button><span id="saveState" class="saved">Saved</span><span id="revision">Revision —</span>
  <button id="fillDown">Fill ↓</button><button id="fillRight">Fill →</button>
  <button id="historyBtn">Cell history</button><button id="revisionsBtn">Revisions</button>
</nav>
<section class="findbar" aria-label="Find and replace">
  <label>Find <input id="findText" type="search"></label><button id="findNext">Find next</button>
  <label>Replace <input id="replaceText"></label><button id="replaceOne">Replace</button><button id="replaceAll">Replace all</button><span id="findStatus"></span>
</section>
<section class="formula-row">
  <label class="sr-only" for="nameBox">Name box</label><input id="nameBox" aria-label="Cell or range address" value="A1">
  <span class="fx">fx</span><label class="sr-only" for="formula">Formula or cell value</label><input id="formula" autocomplete="off" spellcheck="false" aria-label="Formula or selected cell value">
  <div id="suggestions" role="listbox"></div>
</section>
<div id="message" role="alert"></div>
<main id="gridWrap">
  <div id="grid" tabindex="0" role="grid" aria-label="Plan spreadsheet"></div>
  <div id="remoteLayer"></div>
</main>
<footer><span id="sheetTab">Plan</span><span id="selectionInfo">A1</span><span id="formulaHelp">Type = to enter a formula</span></footer>
<dialog id="sideDialog"><div class="dialogHead"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close">×</button></div><div id="dialogBody"></div></dialog>
<script src="/app.js"></script>
</body></html>
