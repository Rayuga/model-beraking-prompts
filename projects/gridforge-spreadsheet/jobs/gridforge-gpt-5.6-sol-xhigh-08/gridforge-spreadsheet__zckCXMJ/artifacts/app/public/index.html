<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridForge</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">GF</span><div><strong>GridForge</strong><h1 id="workbook-title">Loading workbook…</h1></div></div>
  <div class="identity"><label for="user-select">Editing as</label><select id="user-select" aria-label="Seeded user"></select><span id="current-user"></span></div>
</header>
<main>
  <section class="statusbar" aria-label="Workbook status">
    <div><span class="sheet-pill" id="sheet-name">Plan</span><span id="revision">Revision —</span></div>
    <div id="presence-summary">Connecting…</div>
    <div class="save-state"><span id="feedback" class="saved" role="status">Loading…</span><button id="save">Save now</button></div>
  </section>
  <section id="presence-legend" class="presence-legend" aria-label="Live selections"></section>
  <nav class="toolbar" aria-label="Spreadsheet tools">
    <div class="toolgroup"><button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button></div>
    <div class="toolgroup"><button id="fill-down">Fill Down</button><button id="fill-right">Fill Right</button></div>
    <div class="toolgroup find-tools"><label>Find <input id="find" type="search" placeholder="Text"></label><label>Replace <input id="replace" type="text" placeholder="Replacement"></label><button id="find-next">Find Next</button><button id="replace-current">Replace Current</button><button id="replace-all">Replace All</button></div>
  </nav>
  <section class="formula-row">
    <form id="name-form"><label for="name-box" class="sr-only">Name box</label><input id="name-box" value="A1" aria-label="Name box"></form>
    <span class="fx">fx</span><label for="formula" class="sr-only">Raw cell value or formula</label><input id="formula" autocomplete="off" spellcheck="false" aria-label="Raw cell value or formula"><span id="formula-error"></span>
  </section>
  <div class="workspace">
    <section class="sheet-area" aria-label="Plan spreadsheet">
      <div id="grid-scroll" tabindex="0"><div id="grid" role="grid" aria-label="Plan spreadsheet grid"></div></div>
      <div class="sheet-tab"><span>Plan</span></div>
    </section>
    <aside>
      <section class="panel"><div class="panel-heading"><h2>Cell history</h2><span id="history-address">A1</span></div><div id="last-changed" class="muted">No saved changes</div><ol id="cell-history" class="history-list"></ol></section>
      <section class="panel"><div class="panel-heading"><h2>Revision history</h2><button id="close-preview" hidden>Return live</button></div><p id="preview-note" class="muted">Preview or restore a saved revision.</p><ol id="revision-history" class="history-list"></ol></section>
    </aside>
  </div>
</main>
<script src="/app.js"></script>
</body></html>
