<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridForge</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="brand">GridForge</span><h1 id="title">Loading workbook…</h1></div><div class="session"><label>Editing as <select id="user"></select></label><span id="presence-count"></span></div></header>
<div class="statusbar"><span id="save-state" class="saved">Saved</span><span id="revision">Revision —</span><span id="message" role="alert"></span></div>
<nav class="toolbar" aria-label="Spreadsheet tools">
<button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button><button id="save">Save now</button><span class="divider"></span>
<label class="compact">Name <input id="name-box" value="A1" aria-label="Name box"></label><button id="go">Go</button>
<button id="fill-down">Fill ↓</button><button id="fill-right">Fill →</button><span class="divider"></span>
<label class="compact">Find <input id="find" aria-label="Find text"></label><button id="find-next">Find next</button><label class="compact">Replace <input id="replace" aria-label="Replacement text"></label><button id="replace-one">Replace</button><button id="replace-all">Replace all</button>
<button id="history-toggle">Revisions</button>
</nav>
<div id="presence-legend" aria-label="Active collaborators"></div>
<div class="formula-row"><span id="cell-readout">A1</span><span class="fx">fx</span><input id="formula-bar" aria-label="Formula bar" autocomplete="off"><span id="cell-meta"></span></div>
<main><section id="grid-wrap" tabindex="0" aria-label="Spreadsheet grid"><div id="grid" role="grid"></div><input id="editor" aria-label="Cell editor" autocomplete="off"><div id="suggestions"></div></section>
<aside id="side-panel" hidden><div class="panel-head"><h2>Revision history</h2><button id="close-panel" aria-label="Close">×</button></div><div id="revision-list"></div><hr><h2>Selected cell history</h2><button id="cell-history">Refresh cell history</button><div id="history-list"></div></aside></main>
<div id="conflict-banner" hidden><strong>Save conflict</strong><span id="conflict-text"></span><button id="dismiss-conflict">Dismiss</button></div>
<script src="/formulas.js"></script><script src="/app.js"></script></body></html>
