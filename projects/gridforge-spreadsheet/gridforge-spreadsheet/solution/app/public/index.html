<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridForge Spreadsheet</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 id="workbook-title">GridForge</h1>
        <div class="meta">
          <span id="sheet-label">Sheet</span>
          <span id="revision-label">Revision</span>
          <span id="save-state">Saved</span>
          <span id="selection-label">A1</span>
          <span id="cell-editor-label">No cell edits yet</span>
          <span id="presence-count">Live: connecting</span>
        </div>
      </div>
      <div class="actions">
        <label for="user-select">User</label>
        <select id="user-select" aria-label="Signed in user"></select>
        <button id="save-btn" type="button">Save</button>
        <button id="undo-btn" type="button">Undo</button>
        <button id="redo-btn" type="button">Redo</button>
      </div>
    </header>
    <section id="presence-legend" class="presence-legend" aria-label="Live selection colors"></section>
    <section class="formula-row">
      <label for="name-box">Cell</label>
      <input id="name-box" value="A1">
      <label for="formula-bar">Formula</label>
      <div class="formula-input-wrap">
        <input id="formula-bar" autocomplete="off" spellcheck="false">
        <div id="formula-suggestions" class="formula-suggestions" hidden></div>
      </div>
      <button id="apply-formula" type="button">Apply</button>
    </section>
    <section class="tools">
      <button id="fill-down-btn" type="button">Fill Down</button>
      <button id="fill-right-btn" type="button">Fill Right</button>
      <label>Find <input id="find-text" value=""></label>
      <label>Replace <input id="replace-text" value=""></label>
      <button id="find-next-btn" type="button">Find Next</button>
      <button id="replace-one-btn" type="button">Replace</button>
      <button id="replace-all-btn" type="button">Replace All</button>
    </section>
    <main class="workspace">
      <div id="grid" class="grid" tabindex="0" role="grid" aria-label="GridForge spreadsheet"></div>
      <aside class="side">
        <h2>Currently Viewing</h2>
        <div id="presence" class="presence" aria-live="polite">Connecting…</div>
        <h2>Revision History</h2>
        <div id="history"></div>
        <h2>Cell History</h2>
        <div id="cell-history" class="cell-history">Select a cell to inspect its edit history.</div>
      </aside>
    </main>
    <div id="message" role="status"></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
