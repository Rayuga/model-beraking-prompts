[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
mode = "batched"
timeout = 16800
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[[criterion]]
id = "workbook_load_custom_surface_status"
name = "workbook_load_custom_surface_status"
type = "binary"
weight = 0.5
description = """
Open the running GridForge app URL provided by the verifier harness. This criterion is all-or-nothing: if any sub-check fails, mark it failed. Verify the workbook is visible and usable immediately after load without an unknown username/password login. Require the exact workbook title "Northwind Operations Plan", sheet name "Plan", row numbers, column letters, selected-address status, raw formula/value editor, saved revision, and saved/dirty state. Select B2, C2, and D2 and require displayed values 3, 120, and 360, with raw D2 exactly =B2*C2. Inspect the live DOM and loaded scripts read-only and require the editable grid not to be a textarea, contenteditable surface, one input per cell, or a known spreadsheet/grid/calculation library including Handsontable, AG Grid, Luckysheet, x-spreadsheet, HyperFormula, or SheetJS as the calculation engine. Select B10 through the visible grid and use real key presses in this exact order, checking the visible selected address after every key: ArrowRight=C10, ArrowDown=C11, ArrowLeft=B11, ArrowUp=B10, Enter=B11, Shift+Enter=B10, Tab=C10, Shift+Tab=B10. Then enter CUSTOM-GRID-PROOF in blank F2 and commit with Enter; require F2 exact and selection F3. Enter DELETE-ME-F3 in F3 and commit. Enter KEYBOARD-G3 in G3 and commit with Shift+Tab; require G3 exact and selection F3. Press Delete once and require only F3 blank, then Undo once and require F3=DELETE-ME-F3 while F2 and G3 remain exact. The reasoning must report the observed eight-address keyboard sequence and final F2/F3/G3 values. Missing evidence, a wrong address, seed shown only after typing, direct mutation, a hidden/native cell-input grid, or any failed sub-check is a failure.
"""

[[criterion]]
id = "autosave_reload_revision_attribution"
name = "autosave_reload_revision_attribution"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use normal visible UI only for editing, saving, history, preview, restore, undo, scrolling, and reload. Select Riley Stone. Confirm F30 and G30 are blank, record the current revision R, then set F30 to AUTOSAVE-F30 without pressing Save. Require a visible Dirty or Saving state followed within 5 seconds by Saved at revision R+1. Press visible Save twice without another edit and require the revision and revision-list length to remain unchanged. Set G30 to AUTOSAVE-G30 and require one further autosaved revision. Reload and require F30=AUTOSAVE-F30 and G30=AUTOSAVE-G30. Require cell history for each to show Riley Stone, a non-empty timestamp, old blank, and the exact new value. Open revision history and require the recorded revisions with numbers and timestamps and no unchanged duplicates. Preview revision R through the visible Preview action; require its preview to show seeded B2=3 while the live grid still has both F30 and G30 values and the saved revision and dirty state remain unchanged. Restore revision R through the visible Restore action; require F30 and G30 blank, Dirty state, no immediate new revision, then press Undo exactly once and require both AUTOSAVE values to return together without deleting or renumbering history. Next, using only the grid scrollbar or mouse wheel, verify A14=ANCHOR-TOP, A40=ANCHOR-MIDDLE, and A80=ANCHOR-BOTTOM. Set B14=TOP-EDIT-14, B40=MIDDLE-EDIT-40, B80=BOTTOM-EDIT-80, C80=7, D80=8, and E80 raw formula =C80*D80; require E80=56. Let autosave finish, reload, scroll again, and require every anchor and edited value at its exact row plus raw E80 formula unchanged. Change C80 to 9 and require E80 to recalculate to 72 without reload. The reasoning must report R, the two autosave revisions, unchanged-save revision counts, preview/live values, restore/undo states, and final row-80 values. Any omitted checkpoint, direct API/DOM mutation, or workaround fails.
"""

[[criterion]]
id = "formula_bar_raw_formula_and_precedence"
name = "formula_bar_raw_formula_and_precedence"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing and must be executed with real visible keyboard and grid interactions. Do not award it from generic formula support or from different formulas. Select D2 and require grid value 360 and raw editor exactly =B2*C2. Replace it by typing exactly =B2*(C2+10), commit, reselect D2, and require raw text unchanged and displayed value 390. Select blank G2 and type only =; require visible in-progress raw = with no formula error. Click B2 through the visible grid and require raw =B2. Without typing an operator or comma, click C2 and require raw =C2. Press only the + key and inspect before typing anything else; require visible raw text exactly =C2+. If the result is =+, C2 disappears, the click navigates away, or the formula is repaired by another action, fail immediately. Type only 3*4, commit, and require raw G2 exactly =C2+3*4 and displayed G2=132. Enter the following independent formulas and require exact raw text and displayed results after reselecting each cell: G3 =(2+3)*4 -> 20; G4 =20/2+3*4 -> 22; G5 =20/(2+3)*4 -> 16; G8 =20-3*4 -> 8. The reasoning must include an ordered checkpoint table containing D2 raw/value, G2 raw after =, =B2, =C2, and the single + key, and every G3/G4/G5/G8 raw/value pair. Missing rows, different examples, inferred behavior, or any failed checkpoint is a failure.
"""

[[criterion]]
id = "formula_reference_replacement_selection"
name = "formula_reference_replacement_selection"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Use only the visible grid, active raw formula editor, and real mouse/keyboard input. Do not award it from a different cell, a different formula, source inspection, or the final computed value alone. Select blank G6 and type only =. Click B3 through the visible grid and require in-progress raw text exactly =B3. Using normal mouse/keyboard selection in the raw editor, select only the visible B3 text while preserving the leading =, then click C3 once through the visible grid. Require raw text exactly =C3. Press only + and inspect before typing anything else: visible raw text must be exactly =C3+. If + replaces C3, raw text becomes =+, the click navigates away, or the formula is repaired by another action, fail immediately. Type only 3*4, commit, require displayed G6=362, reselect G6, and require raw text exactly =C3+3*4. The reasoning must report an ordered five-row table for =B3, selected B3, =C3, the raw text immediately after the single + key, and the committed G6 raw/value. A substituted workflow, generic claim, omitted checkpoint, or any failed row is a failure.
"""

[[criterion]]
id = "formula_mid_edit_caret_operator_preservation"
name = "formula_mid_edit_caret_operator_preservation"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use the visible grid and formula editing UI only. Enter exactly =B2+10 in G7 and commit it. Reopen G7 through the normal raw formula editor or formula bar, place the caret between B2 and +10, type exactly *C2, and verify before committing or after reselecting G7 that the raw formula is exactly =B2*C2+10. Verify G7 displays 370. Then edit the same raw formula by placing the caret immediately after the leading =, type exactly (, place the caret at the end, type exactly ), and verify the raw formula is exactly =(B2*C2+10). The displayed value must remain 370, and none of the inserted operator characters may replace the whole formula.
"""

[[criterion]]
id = "formula_alternating_mouse_references"
name = "formula_alternating_mouse_references"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Use only the visible grid, active formula editor, and real mouse/keyboard input; do not type any cell address manually, repair an intermediate formula, use direct APIs, or substitute another example. Confirm I10 is blank, select it, and type only =. Click seeded B2 once and require the in-progress raw formula to be exactly =B2. Press only * and inspect immediately; require exactly =B2*. Click seeded C2 once and require exactly =B2*C2. Press only + and inspect immediately; require exactly =B2*C2+. Click seeded B3 once and require exactly =B2*C2+B3. Press only / and inspect immediately; require exactly =B2*C2+B3/. Click seeded B3 once and require exactly =B2*C2+B3/B3. Press Enter, then reselect I10 and require raw formula exactly =B2*C2+B3/B3 and displayed value 361. The reasoning must report an ordered checkpoint table for all eight raw-formula states and the final displayed value. If an operator replaces the preceding reference, a click navigates away, a reference remains selected and is overwritten, any address is typed manually, or any checkpoint is omitted, fail.
"""

[[criterion]]
id = "formula_mouse_range_reference_insertion"
name = "formula_mouse_range_reference_insertion"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Use visible grid editing and one real mouse down/drag/up reference gesture only; direct writes, DOM mutation, hidden routes, manually typing F22:F24, clicking cells individually, or repairing the formula fails. Set F22=3, F23=2, and F24=5 through normal editing. Confirm H22 blank, select it, and type exactly =SU without committing. Require a visible formula suggestion dropdown containing SUM directly below H22 rather than below the formula bar or elsewhere on the page. Click the visible SUM suggestion once with the real mouse and require in-progress raw text exactly =SUM(. While H22 remains in formula-entry mode, drag once from visible F22 through F24. Require in-progress raw text exactly =SUM(F22:F24 and require F22, F23, and F24 each visibly outlined or highlighted as formula references. Press only ) and inspect before Enter: require visible raw text exactly =SUM(F22:F24). If ) replaces F22:F24, the formula becomes =SUM(), the drag loses formula mode, or the formula is repaired by another action, fail immediately. Press Enter, require raw H22 exactly =SUM(F22:F24) and displayed H22=10. Change F24 to 8 and without reload or manual refresh require H22=13 with the same raw formula. The reasoning must report the dropdown location and raw text after choosing SUM, exact raw text and three-cell highlight state immediately after the drag, raw text immediately after the single ) key, and the committed and recalculated raw/value pairs. A different range/example, generic mouse-drag claim, missing checkpoint, or any failed sub-check is a failure.
"""

[[criterion]]
id = "multi_argument_functions_dependency_recalculation"
name = "multi_argument_functions_dependency_recalculation"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing and only the exact range-plus-scalar formulas below satisfy it. Use normal visible editing; no API writes, DOM mutation, hidden routes, or manual result replacement. Set F25=3, F26=2, F27=5, and G25=120. Enter exact raw formulas H25 =SUM(F25:F27,G25), H26 =AVG(F25:F27,G25), H27 =MIN(F25:F27,G25), H28 =MAX(F25:F27,G25), and H29 =COUNT(F25:F27,G25). Reselect every result cell and require the exact raw formula, comma, and trailing G25 argument plus displayed values H25=130, H26=32.5, H27=2, H28=120, H29=4. Change only G25 to 150. Without reload or refresh require H25=160, H26=40, H27=2, H28=150, H29=4 with every raw formula unchanged. The reasoning must contain a five-row table with address, exact raw formula, value before G25 changes, and value after it changes. Testing only single-range formulas such as SUM(D2:D4) or AVG(C2:C4), omitting any row, citing seeded formulas instead of creating these inputs, or making a generic recalculation claim is an automatic failure.
"""

[[criterion]]
id = "shift_click_and_reverse_drag_range_selection"
name = "shift_click_and_reverse_drag_range_selection"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing and must use the named mouse gestures through the visible custom grid. Do not use the name box, keyboard range extension, direct APIs, DOM mutation, or a substituted range. Confirm J35:L37 is blank. Select J35 and paste the exact three-row TSV matrix "RANGE-A<TAB>RANGE-B<TAB>RANGE-C<NEWLINE>RANGE-D<TAB>RANGE-E<TAB>RANGE-F<NEWLINE>RANGE-G<TAB>RANGE-H<TAB>RANGE-I" once using real tabs/newlines; require its nine exact values in J35:L37. Click J35 once, then hold Shift and click L37 once. Require the selected-range status to be exactly J35:L37 and require all nine cells J35:L37, including K36=RANGE-E, to be visibly selected; a single selected L37 cell fails. Click elsewhere to clear the range. Next press the mouse at L37, drag diagonally upward and left, and release at J35. Require the normalized selected-range status to again be exactly J35:L37 and all nine cells to be selected. Press Delete exactly once and require all nine cells to become blank while I35, M37, and J38 remain unchanged. Press Undo exactly once and require the entire exact RANGE-A through RANGE-I matrix to return together. The reasoning must separately report the Shift+Click status, reverse-drag status, K36 selection state, nine-cell values after Delete and Undo, and boundary-cell values. If either gesture is replaced by another selection method or any checkpoint fails, fail.
"""

[[criterion]]
id = "formula_errors_and_cycle_recovery"
name = "formula_errors_and_cycle_recovery"
type = "binary"
weight = 1.0
description = """
Treat the following as one connected check, and fail the criterion if any required part is missing. Use normal visible spreadsheet editing only; do not use direct API writes, DOM mutation, hidden routes, reload, or manual refresh. In H2 enter exactly =10/0 and verify H2 visibly shows #DIV/0!, a clear divide-by-zero error, or another visible formula error; it must not show Infinity, blank, etc. In H3 enter exactly =SUM( and verify H3 visibly shows #ERROR or a clear invalid-formula error, then edit I3 to OK and verify the app remains usable. Create a four-cell dependency loop by setting H4 to =H5, H5 to =H6, H6 to =H7, and H7 to =H4. Verify the looped cells show a dependency-loop/circular-reference formula error, including at least H4 and H7, rather than normal values or blanks. Break the loop by replacing H7 with 12. Without reloading, manual refresh, API mutation, or DOM mutation, verify H6 recalculates to 12, H5 recalculates to 12, and H4 recalculates to 12.
"""

[[criterion]]
id = "circular_reference_isolation_and_undo_recovery"
name = "circular_reference_isolation_and_undo_recovery"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing. Use normal visible cell editing and visible Undo only; do not reload, manually refresh, use APIs, mutate the DOM, or replace formulas with expected results. First set J20=5 and J21 raw formula =J20+1 and require J21=6. Replace J20 with raw formula =J21+1 to create a two-cell loop. Require both J20 and J21 to visibly show a circular/dependency-loop error, while seeded A14 still displays ANCHOR-TOP and independently entered K20=9 remains 9. Press Undo exactly once. Require J20 to return to 5, J21 to recover automatically to 6, K20 to remain 9, and neither J20 nor J21 to retain an error. Next set J23=1, J24=2, J25=3, J22 raw formula =SUM(J23:J25), and require J22=6. Replace J25 with raw formula =J22 so J22 depends on a range that includes a path back to J22. Require at least J22 and J25 to visibly show a circular/dependency-loop error while J23=1, J24=2, K20=9, and A14=ANCHOR-TOP remain unchanged. Replace J25 with 4 and, without reload or refresh, require J22=7 and J25=4 with no remaining circular error. The reasoning must provide exact before-loop, loop, and recovered values/errors for J20:J21 and J22:J25 plus the A14/K20 isolation controls. A generic statement that cycles are detected, a different cycle, missing isolation controls, or any failed checkpoint fails.
"""

[[criterion]]
id = "tsv_csv_range_paste_undo_redo_atomic"
name = "tsv_csv_range_paste_undo_redo_atomic"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing across clipboard import, copy, cut, paste, undo, and redo. Use only visible grid/name-box interactions, the real browser clipboard, and normal shortcuts; direct writes, DOM mutation, hidden routes, manually retyping transferred values, or synthetic clipboard events fail. Select J2 and put exact TSV text "TSV-A<TAB>11<TAB>12<NEWLINE>TSV-B<TAB>21<TAB>22<NEWLINE>TSV-C<TAB>31<TAB>32" on the real clipboard with actual tabs/newlines. Paste once with Ctrl/Cmd+V. Require J2=TSV-A, K2=11, L2=12, J3=TSV-B, K3=21, L3=22, J4=TSV-C, K4=31, L4=32. Undo once and require all nine prior blank values together; redo once and require all nine exact values together. Put exact CSV text "CSV-A,CSV-B<NEWLINE>CSV-C,CSV-D" on the clipboard, paste once at O2, and require O2=CSV-A, P2=CSV-B, O3=CSV-C, P3=CSV-D. Next enter J55=COPY-A, K55=COPY-B, J56=COPY-C, K56=COPY-D. Select J55:K56 through the visible name box, copy once, select M55, and paste once. Require M55=COPY-A, N55=COPY-B, M56=COPY-C, N56=COPY-D while the source remains exact. Select M55:N56, cut once, select P55, and paste once. Require M55:N56 blank; P55=COPY-A, Q55=COPY-B, P56=COPY-C, Q56=COPY-D; and J55:K56 unchanged. The reasoning must report the exact nine-cell TSV matrix, four-cell CSV matrix, copy source/destination matrix, and cut source/destination matrix. Any omitted operation or value fails the whole criterion.
"""

[[criterion]]
id = "fill_numbers_and_formula_relative_refs"
name = "fill_numbers_and_formula_relative_refs"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing across downward and sideways numeric/formula fill. Use normal visible editing, range selection, visible Fill Down/Fill Right controls or handles, and visible Undo/Redo only; direct writes, DOM mutation, hidden routes, or manually typing generated cells fail. Set M2=1 and M3=2, select M2:M7, and fill down once. Require M2:M7 exactly 1,2,3,4,5,6; Undo once must clear only generated M4:M7 together, then Redo once must restore them. Enter raw N2 =B2*C2, select N2:N4, fill down once, and require exact raw formulas N2 =B2*C2, N3 =B3*C3, N4 =B4*C4 with their correct displayed values. For sideways fill, confirm L60:O60 and K61:M61 blank, set J60=2 and K60=4, select J60:O60, and Fill Right once. Require J60:O60 exactly 2,4,6,8,10,12; Undo once must blank only L60:O60 while preserving J60/K60, then Redo must restore the sequence. Enter raw J61 =J60*10, select J61:M61, Fill Right once, and require exact raw formulas =J60*10, =K60*10, =L60*10, =M60*10 with displayed values 20,40,60,80. Undo once must clear generated K61:M61 together while J61 remains; Redo must restore all three. The reasoning must give before/after Undo/Redo tables for both directions and exact raw shifted formulas. Any missing direction, substituted values, or failed checkpoint fails.
"""

[[criterion]]
id = "find_replace_navigation_and_atomic_replace_all"
name = "find_replace_navigation_and_atomic_replace_all"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use only normal visible grid editing and the visible Find, Replace, Find Next, Replace Current, Replace All, Undo, and Redo controls; direct API writes, DOM mutation, hidden routes, browser-storage edits, or manually changing matched cells fail. Set J50=FIND-QC-ONE, J51=FIND-QC-TWO, and J52=FIND-QC-THREE through normal cell editing, then select A1. Enter FIND-QC in the visible Find field. Activate Find Next four times and require the selected cell or visible match status to visit exactly J50, J51, J52, then J50, proving wraparound with exactly three matches. Enter REPLACED-QC in the visible Replace field and activate Replace Current once. Require J50=REPLACED-QC-ONE while J51=FIND-QC-TWO and J52=FIND-QC-THREE. Activate Replace All once and require J51=REPLACED-QC-TWO and J52=REPLACED-QC-THREE, with J50 unchanged. Press Undo exactly once and require J51 and J52 to return together to their exact FIND-QC values while J50 remains REPLACED-QC-ONE. Press Redo exactly once and require J51 and J52 to return together to their exact REPLACED-QC values without changing J50.
"""

[[criterion]]
id = "name_box_jump_and_range_selection"
name = "name_box_jump_and_range_selection"
type = "binary"
weight = 1.5
description = """
Use the visible name box or cell address box, not direct API calls, hidden routes, formula-bar shortcuts, or DOM mutation. Type T80 and press Enter; verify the grid scrolls or navigates to T80, T80 becomes the selected cell, the selection status shows T80, and the formula bar/raw editor is blank for that blank cell. Type NAMEBOX-T80 through normal grid editing and commit it. Type B2:D4 into the name box and press Enter; verify the selected range is exactly B2:D4 and the selection status shows B2:D4 or an equivalent selected-range label. Press Delete once and verify only B2:D4 is cleared, not A2, E4, or T80. Press Undo once and verify B2=3, C2=120, D2 displays 360 again, and T80 still contains NAMEBOX-T80. Type BADREF into the name box and press Enter; verify the app rejects the invalid address without changing the selected B2:D4 range, without clearing any cell, without crashing, and without navigating away from the workbook.
"""

[[criterion]]
id = "two_tab_stale_save_conflict"
name = "two_tab_stale_save_conflict"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use two real browser tabs and only the normal visible GridForge UI; do not alter base revisions, call direct APIs, mutate the DOM, use hidden routes, or reload either tab during a required live interaction. Load the same current revision in tabs A and B and select Riley Stone in A and Morgan Lee in B. First, while B is clean, set R20 to CLEAN-LIVE-RILEY in A and complete a successful save. Within 5 seconds and without reload, require B to advance to the same saved revision and display R20=CLEAN-LIVE-RILEY; selecting R20 in B must identify Riley Stone as its saved editor. Next test concurrent edits to different cells. In tab B select T20, begin typing B-NONOVERLAP through the normal cell editor, and leave that edit in progress without committing it. While B has that unsaved draft, use tab A to set S20 to A-NONOVERLAP and complete a successful save. Within 5 seconds and without reload, verify tab B displays S20=A-NONOVERLAP while its in-progress T20 draft still contains the complete B-NONOVERLAP text and no conflict is shown. Commit B's T20 edit and let it save. Verify both tabs show R20=CLEAN-LIVE-RILEY, S20=A-NONOVERLAP, and T20=B-NONOVERLAP and all three values remain stored. Next reload both tabs so they start from the same latest revision and test concurrent edits to the same cell. In tab B select S21, begin typing TAB-B-LOCAL-DRAFT, and leave the edit in progress without committing. In tab A set that same S21 cell to TAB-A-WINS and save. Within 5 seconds and without reload, verify tab B preserves its complete local draft rather than replacing it with TAB-A-WINS, visibly reports a live conflict naming S21, and remains Dirty or failed rather than Saved. Commit and attempt to save tab B's conflicting draft; verify the save is rejected with a visible conflict and does not overwrite tab A. Only after that rejection, reload tab B and verify S21 contains TAB-A-WINS, not TAB-B-LOCAL-DRAFT, while R20, S20, and T20 still contain the earlier values. The reasoning must report the clean-update revision/value/attribution, dirty non-overlap values, and same-cell conflict result separately.
"""

[[criterion]]
id = "live_remote_selection_boundaries_and_legend"
name = "live_remote_selection_boundaries_and_legend"
type = "binary"
weight = 0.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use three real browser tabs or windows showing GridForge and only normal visible grid interactions; do not use reload, polling, direct API reads or writes, DOM mutation, hidden routes, injected styles, or manually copied selection state. Set views A1 and A2 to Riley Stone and view B to Morgan Lee. Within 5 seconds require the visible presence summary to show Riley Stone with exactly 2 open views and Morgan Lee with exactly 1 open view, and require all three sessions in the selection legend. Select B2 in A1, D4 in A2, and exact range C3:E4 in B using visible range selection. Without reloading, require A1's legend to map distinct colors to Riley Stone at B2, Riley Stone at D4, and Morgan Lee at C3:E4; the Riley entries must have separate colors without invented tab names. Require boundary-only remote colors on D4 and every cell in C3:E4, with cell interiors, values, and editing unobstructed. Move B from C3:E4 to F6 and within 5 seconds require the old Morgan boundaries gone, Morgan's legend at F6, and its boundary only at F6. Select G7 in both A2 and B. Require two distinguishable boundary rings on G7 and matching Riley/Morgan legend entries. Close A2. Within 5 seconds require the presence summary to show Riley Stone with exactly 1 view and Morgan Lee with exactly 1 view; remove A2's Riley legend and boundary while Morgan's G7 state remains. In B switch Morgan Lee to Priya Shah without reload and keep G7 selected. Within 5 seconds require Riley Stone with 1 view, Priya Shah with 1 view, no Morgan presence entry, Priya at G7, and no duplicate or ghost boundary. Finally move B through H8, I9, and J10 quickly. Within 5 seconds require the legend to end at Priya Shah — J10, Priya's boundary only at J10, and no stale Priya boundary on G7, H8, or I9. The local view may appear in the legend but must not be drawn remotely over itself. The reasoning must report all three exact presence-count states and the final legend/boundary state; any omitted state or substituted workflow fails.
"""

[[criterion]]
id = "stale_save_and_workbook_identity_rejections"
name = "stale_save_and_workbook_identity_rejections"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use the visible spreadsheet UI to produce and observe one successful save before sending any direct probe. Record its real URL, method, content type, editing-session or authentication mechanism, complete implementation-specific body, returned revision, and revision-list endpoint. Fail rather than guessing any request detail. Record revision R and an exact deep copy W of the workbook at R. Clone the observed request without changing fields not named here, use R and W, change only T2 to CURRENT-T2, and send it through direct same-origin fetch. Require HTTP 200 or 201, T2=CURRENT-T2, current revision R+1, and exactly one new revision. Record exact deep copies of this protected workbook response and revision list. Next send four otherwise-current independent clones: (1) use stale R and W while changing T2 to FORGED-STALE-OVERWRITE, requiring a 4xx response, never 5xx, with T2 identified as conflicting; (2) use an unknown workbook id in the URL; (3) use the real URL but a different top-level body workbookId; and (4) use the real URL and top-level id but a different nested workbook.id. Probes 2 through 4 must also return 4xx, never 5xx. Report an explicit four-row table with probe number, exact observed status and response body. After every rejected probe, re-read the real workbook and revisions and require exact deep equality with the protected copies. Any omitted probe, guessed request shape, 2xx or 5xx rejection result, changed T2, changed identity, advanced revision, added revision or missing equality check fails.
"""

[[criterion]]
id = "api_save_validation_matrix"
name = "api_save_validation_matrix"
type = "binary"
weight = 1.0
description = """
This criterion is one all-or-nothing server validation matrix. First use a visible edit to produce and observe one successful save. Record its exact URL, method, content type, session/authentication mechanism, complete implementation-specific body, current integer revision R, workbook response W, and complete revision list L. Fail rather than guessing any field or route. Send exactly nineteen independent same-origin fetch probes cloned from that request, preserving all fields not named by the probe. Revision probes: (1) missing baseRevision; (2) null; (3) R encoded as a string; (4) R+0.5; (5) -1; (6) R+1000. Workbook-shape probes: (7) missing workbook; (8) null workbook; (9) workbook array; (10) correct workbook id but missing sheets; (11) empty sheets; (12) first sheet missing cells; (13) cells array; (14) cells object containing invalid address BADREF; (15) A1 numeric rather than string; (16) A1 null rather than string. Immutable-metadata probes: (17) change only workbook title; (18) change only first sheet id; (19) change only first sheet name. Require a 4xx response, never 2xx or 5xx, for every probe. After each probe re-read the real workbook and revisions and require exact deep equality with W and L, including revision, cells, title, sheet identity, attribution, and list length. The reasoning must provide an explicit nineteen-row table with probe number/name, exact status, response body, and post-probe equality result. A missing probe, guessed shape, silent normalization, mutation, new revision, generic summary, or omitted evidence fails the entire criterion.
"""

[[criterion]]
id = "api_session_user_mismatch_rejected"
name = "api_session_user_mismatch_rejected"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing. Use visible UI to select one seeded user, set R2 to SESSION-OWNER-CHECK, and observe the exact successful save. Record URL, method, content type, complete implementation-specific body, claimed user value, and the real editing-session mechanism. Fail rather than assuming a cookie, header, field, or JavaScript global. Require the legitimate save to advance exactly one revision, create exactly one revision, and attribute R2 to the selected user. Record protected deep copies of the workbook and revision list. Send exactly four independent clones from that protected state, changing only the named item: (1) claimed user becomes a different valid seeded user while the legitimate session remains; (2) claimed user becomes a totally unknown user while the session remains; (3) remove only the observed session credential; (4) replace only that credential with an unknown session value of the same shape. Require 4xx and never 2xx or 5xx for all four. After each probe re-read workbook and revisions and require exact deep equality with the protected copies, including R2, attribution, revision, and list length. The reasoning must provide a four-row table with exact changed field/credential, status, response body, and equality result. A guessed mechanism, omitted probe, mutation, changed attribution, new revision, generic summary, or missing evidence fails.
"""

[scoring]
aggregation = "weighted_mean"
