schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/bazaarbridge-marketplace"
version = "7.0.0"
description = "Full-stack Node.js, Express, and SQLite BazaarBridge marketplace application with authenticated workflows and browser-only Luna judging"
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "marketplace", "authentication", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "turing/bazaarbridge-marketplace v7.0.0: adds derived merchant settlement arithmetic and a three-role authority boundary on top of the gated four-dimension browser reward"
arena_slice = "full-stack-node-express-sqlite-marketplace"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"

[verifier.environment]
network_mode = "public"
