# Prompt version: common-ground-ballot-v2-v2.0.0-polish
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 900
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 3.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[criterion]]
id = "responsive_workspace_navigation"
name = "responsive_workspace_navigation"
type = "binary"
weight = 1.0
description = """
At approximately 390 by 844 after sign-in, require no horizontal page overflow, clipped primary actions, or unusable overlays. Ballots, Vote, Turnout, Results, Members, and Audit must remain reachable and show distinct meaningful content. The signed-in name and role must be readable, and both sign-out controls must remain reachable, directly or through a usable account menu. Repeat a representative check on desktop.
"""

[[criterion]]
id = "accessible_keyboard_forms"
name = "accessible_keyboard_forms"
type = "binary"
weight = 1.0
description = """
Use keyboard navigation through sign-in and a representative ballot or voting form. Require visible focus, logical focus order, associated labels or accessible names, keyboard-operable choices and buttons, a closeable dialog without a focus trap failure, and navigation/main landmarks with meaningful headings.
"""

[[criterion]]
id = "persistent_action_feedback"
name = "persistent_action_feedback"
type = "binary"
weight = 1.0
description = """
Trigger one validation refusal and one successful action through visible controls. Each must provide specific in-context feedback; the refusal must remain readable until dismissed or replaced by another completed action. Current status, unavailable actions, and one-final-vote consequences must be understandable without relying on color alone.
"""

[[criterion]]
id = "ballot_result_visual_hierarchy"
name = "ballot_result_visual_hierarchy"
type = "likert"
points = 5
weight = 1.0
description = """
Across a staff ballot list, detailed turnout, and a published approval result, require a coherent hierarchy, readable labels and values, scannable status treatment, useful empty/restricted states, and a visual result treatment that still exposes exact counts and approval percentages as text rather than raw JSON or an unlabeled graphic. Use the approval result published in the functional workflow, or publish the seeded closed approval ballot as Ruth if necessary; do not assume all seed ballots are still in their initial states.
Rate 1 for missing, unreadable, raw-data-only, or heavily overlapping views; 3 for readable values with inconsistent grouping or minor crowding; and 5 when all listed views have clear grouping, readable status/count/percentage text, and no overlap. Use 2 or 4 for intermediate quality. Assess visual presentation here, not correctness of the already-graded tally calculations.
"""

[[criterion]]
id = "theme_touch_and_motion_quality"
name = "theme_touch_and_motion_quality"
type = "binary"
weight = 1.0
description = """
Use the visible theme control and require a materially useful light/dark presentation without losing content or the active workspace. At mobile size, representative controls must have comfortable touch targets. Emulate reduced motion and require the interface to remain usable without essential information depending on animation.
"""
