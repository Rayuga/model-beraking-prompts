[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "app_renders"
name = "app_renders"
type = "binary"
weight = 1.0
description = """
Open the application at http://localhost:3000 in a fresh browser and confirm
it is reachable and renders a real application surface, not a blank page,
static mock, generic error, or fatal browser error. If the application has
sign-in, confirm no protected data is visible before sign-in, an incorrect
password is rejected, and the first account under Accounts opens populated
content. Assign 1 only if every check holds; otherwise assign 0.
"""
