[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "server_backed_application"
name = "server_backed_application"
type = "binary"
weight = 1.0
description = """
Confirm the application is reached from the local server at
http://localhost:3000 and renders a real application surface rather than a
blank page, static mock, missing backend, or broken shell. External font,
script, or CDN asset requests are allowed and must not fail this gate. This
gate does not grade authentication, roles, persistence, or feature
completeness.
"""
