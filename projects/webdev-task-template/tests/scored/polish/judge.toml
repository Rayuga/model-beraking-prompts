[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "responsive_layout"
name = "responsive_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 mobile viewport, confirm the main content fits without
horizontal page overflow and every screen under Key screens remains reachable.
"""

[[criterion]]
id = "accessible_controls"
name = "accessible_controls"
type = "binary"
weight = 1.0
description = """
At desktop width, confirm a navigation landmark, a main landmark, meaningful
headings, and accessible names or associated labels for visible buttons,
inputs, and selects on the key screens.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Confirm interactive controls have clear hover or focus feedback. Confirm forms
or update controls communicate invalid actions with a visible reason while
leaving the surrounding screen coherent.
"""

[[criterion]]
id = "workspace_coherence"
name = "workspace_coherence"
type = "binary"
weight = 1.0
description = """
Open and close any create, edit, or update surface the product provides
(inline control, dialog, drawer, or page section). Confirm the surrounding
screen remains usable and is not permanently obscured or broken.
"""
