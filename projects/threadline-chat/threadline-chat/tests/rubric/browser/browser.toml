[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
mode = "batched"
timeout = 18000
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

# feature = auth_session
# sub_feature = login_and_tab_isolation
# kind = hard_gate
# depends_on = []
[[criterion]]
id = "seeded_login_and_session_isolation"
name = "seeded_login_and_session_isolation"
type = "binary"
weight = 0.5
description = """
This criterion is all-or-nothing. Open two ordinary tabs in the same browser context; do not use separate browser contexts, incognito profiles, or cookie jars. Verify both tabs initially show a usable seeded-user sign-in screen before workspace data. In tab one, select Priya Shah, replace the password field with exact text WRONG-PASSWORD-123, and submit the visible sign-in form. Require a visible rejection, no authenticated workspace, and a same-origin GET of the bootstrap/current-user API returning 401 or another non-2xx response. Sign in as Priya with the seeded password and require the authenticated screen to visibly identify the current user as exactly Priya Shah; also verify Northstar Studio, general, and launch-room are shown while leadership is absent. Without closing or isolating tab one, sign in as Maya Chen in tab two and require its authenticated screen to visibly identify the current user as exactly Maya Chen and show leadership, while tab one still visibly identifies its current user as exactly Priya Shah without a reload. Reload both tabs and verify their visible current-user identities remain exactly Priya Shah and Maya Chen respectively. Sign out only tab two and verify tab two returns to sign-in while tab one remains authenticated and still visibly identifies its current user as exactly Priya Shah.
"""

# feature = auth_session
# sub_feature = server_owned_identity
# kind = hard_gate
# depends_on = [seeded_login_and_session_isolation]
[[criterion]]
id = "server_owned_message_identity"
name = "server_owned_message_identity"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Perform every named step through an ordinary authenticated browser page; do not inspect application source, mutate the DOM or database, use a hidden route, or substitute a different endpoint or message as evidence. Sign in as Priya Shah, visibly open general, and before sending install browser-side network observation for fetch and XMLHttpRequest, or use equivalent browser network observation, so the exact request produced by the visible composer can be recorded. Through the visible composer send exact text IDENTITY-DISCOVERY-CONTROL once. Record that action's real request URL, method, content type, authentication mechanism, and complete body, then verify general contains exactly one IDENTITY-DISCOVERY-CONTROL message visibly authored by Priya Shah. If the generated request cannot be observed, fail rather than guessing an endpoint or payload.

Clone the observed request without changing its implementation-specific structure or required fields. Give the cloned request a fresh valid idempotency/client identifier if the observed request uses one, change only its message content to exact text IDENTITY-FORGERY-PROBE, and add or replace identity-bearing values wherever that observed body format permits: Maya Chen's real seeded user id discovered from the authenticated app, author/user name Maya Chen, role admin, message owner Maya's id, message id 999999, and timestamp 2000-01-01T00:00:00.000Z. Send that clone through a direct same-origin fetch using Priya's still-active authenticated session. A secure result may either reject the forgery with a non-2xx response or accept the message while ignoring all forged authoritative values. If rejected, re-read general and require exactly zero occurrences of IDENTITY-FORGERY-PROBE. If accepted, re-read general and require exactly one occurrence whose visible/stored author is Priya Shah, whose id is not 999999, whose timestamp is not 2000-01-01T00:00:00.000Z, and whose stored ownership, role, and identity do not become Maya/admin values. Finally verify IDENTITY-DISCOVERY-CONTROL still occurs exactly once. If any step, exact value, count, named interaction path, or secure outcome check is missing, fail the entire criterion.
"""

# feature = auth_session
# sub_feature = logout_revocation
# kind = hard_gate
# depends_on = [seeded_login_and_session_isolation, server_owned_message_identity]
[[criterion]]
id = "logout_revokes_captured_session"
name = "logout_revokes_captured_session"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Perform every named step; do not use source inspection, direct database access, DOM mutation, a different protected endpoint, or the post-logout current credential as a substitute for replaying the captured pre-logout send. Sign in as Priya Shah, visibly open general, and install browser-side fetch/XMLHttpRequest observation, or equivalent browser network observation, before using the visible composer to send exact text LOGOUT-BASELINE-CONTROL once. Capture the exact successful send request including its real URL, method, content type, complete implementation-specific body, and the pre-logout session credential or authentication header used by that request. Verify general contains exactly one LOGOUT-BASELINE-CONTROL message visibly authored by Priya Shah. If the request or its pre-logout authentication cannot be captured, fail rather than guessing.

Clone the captured successful request, preserve its endpoint and required body structure, replace its content with exact text LOGOUT-REPLAY-BLOCKED, and use a fresh valid idempotency/client identifier if the observed request uses one. Keep that clone and the captured pre-logout credential without sending it yet. Log out only through the visible account control and verify the page returns to the seeded-user sign-in screen with no authenticated workspace visible. Now replay the prepared clone through direct same-origin fetch while explicitly using the captured pre-logout credential. Require a non-2xx response. Sign in again as Priya through the visible sign-in form, visibly open general, and require exactly zero occurrences of LOGOUT-REPLAY-BLOCKED and exactly one occurrence of LOGOUT-BASELINE-CONTROL. If the replay succeeds, either count is wrong, logout was not performed visibly, a newly authenticated credential is used, or any named step is skipped, fail the entire criterion.
"""

# feature = channel_authorization
# sub_feature = private_channel_isolation
# kind = hard_gate
# depends_on = [server_owned_message_identity, logout_revokes_captured_session]
[[criterion]]
id = "private_channel_object_authorization"
name = "private_channel_object_authorization"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. In a Maya Chen tab, positively verify leadership is visible, can be opened, and contains the seeded staffing message. In a separate ordinary tab in the same browser context, sign in as Priya Shah and verify leadership is absent from channel navigation. From Priya's authenticated page, use direct same-origin fetch calls against the discovered leadership message-list, send-message, pins, search-with-channel-filter, and one seeded leadership-message history/reaction route. Every private-object read or write must return a non-2xx response without navigating Priya away from her accessible workspace. Re-read leadership as Maya and verify the seeded message and message count are exactly unchanged and no marker PRIVATE-FORGE-PRIYA was created.
"""

# feature = direct_messages
# sub_feature = pair_uniqueness_and_participant_authorization
# kind = hard_gate
# depends_on = [seeded_login_and_session_isolation, server_owned_message_identity]
[[criterion]]
id = "direct_message_pair_uniqueness_and_authorization"
name = "direct_message_pair_uniqueness_and_authorization"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Use two ordinary tabs in the same browser context, signed in as Priya and Maya. In Priya's visible Direct messages section, use only the visible new-conversation control and member picker to choose Maya. Require one direct conversation named Maya Chen to open with exactly Priya and Maya as members. Send exact marker DM-PAIR-PRIVATE through its visible composer, then use the new-conversation control to choose Maya again; require the same conversation and same marker to reopen, with no duplicate direct-conversation entry. In Maya's tab, verify the same conversation is present and contains exactly one DM-PAIR-PRIVATE. From Priya's authenticated page, replay the discovered direct-conversation creation request with target Maya while adding forged members, creator, owner, role, and channel-id fields; require the response to identify the same conversation with exactly Priya and Maya and no third member. In an Omar tab, use direct same-origin reads, sends, filtered search, history, and reaction requests against that conversation; every route must return non-2xx. Re-read it as Priya and verify its participant list and stored content are unchanged by Omar. Also require self-target and unknown-user creation attempts to be rejected with no channel or membership side effect.
"""

# feature = direct_messages
# sub_feature = live_two_tab_unread_and_threads
# kind = graded
# depends_on = [direct_message_pair_uniqueness_and_authorization, thread_reply_parent_channel_authorization]
[[criterion]]
id = "direct_message_live_unread_and_thread_workflow"
name = "direct_message_live_unread_and_thread_workflow"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Keep Priya and Maya signed in to two ordinary tabs in the same browser context. Have Maya stay in general while Priya opens their direct conversation and sends exact parent DM-LIVE-PARENT through the visible composer. Without reloading Maya, require her Direct messages entry for Priya to gain exactly one unread and Priya's own unread not to increase. Have Maya open that direct conversation and verify the unread clears only for Maya and DM-LIVE-PARENT appears exactly once. On that parent use the visible Reply or Start a thread control, send DM-LIVE-REPLY from Maya through the thread composer, and verify Priya receives the reply plus reply-count/latest-reply update live without reload. Add one visible reaction from Priya and verify Maya sees exactly one contribution live. Reload both tabs and verify the parent, reply, reaction, per-user read state, and one-to-one participant list persist without duplicate messages or a group member.
"""

# feature = channel_authorization
# sub_feature = immediate_membership_revocation
# kind = hard_gate
# depends_on = [private_channel_object_authorization]
[[criterion]]
id = "membership_revocation_blocks_captured_requests"
name = "membership_revocation_blocks_captured_requests"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Sign in as Maya and Omar in two ordinary tabs in the same browser context. As Maya, open leadership's visible channel-member view, locate Omar's member row, and use its visible Add control. Positively verify Omar can refresh his bootstrap, open leadership, read its seeded message, and see himself in the visible member view. From Omar's page capture a valid leadership send request with marker REVOKED-CAPTURE and a unique client id but do not send it yet. As Maya, use Omar's visible Remove control in the leadership member view. Then replay Omar's captured request using Omar's still-valid session. Require a non-2xx response; Omar's refreshed bootstrap must no longer list leadership, and leadership reads/search/reactions must be rejected. As Maya, re-read leadership and verify REVOKED-CAPTURE was not stored and no audit/message side effect was created. Restore Omar through the visible member control at the end so this self-contained check does not poison later criteria.
"""

# feature = channel_authorization
# sub_feature = message_ownership_and_moderation
# kind = hard_gate
# depends_on = [server_owned_message_identity]
[[criterion]]
id = "message_moderation_and_ownership"
name = "message_moderation_and_ownership"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Have Priya create a general-channel message MODERATION-OWNERSHIP and record its id/version. From Omar's authenticated page, replay the real edit and delete routes while supplying the correct id/version plus forged authorId=omar, ownerId=omar, role=moderator, and actor fields. Require both requests to return non-2xx and re-read the message to verify its content, version, and history are unchanged. From Jordan Lee's moderator context, locate that message in the visible timeline and delete it using the visible message menu plus confirmation. Verify the original message is removed or visibly marked deleted without exposing its original content, its content is absent from search, and its permitted history contains one deletion attributed to Jordan with the previous MODERATION-OWNERSHIP content.
"""

# feature = messages_threads
# sub_feature = send_order_and_retry
# kind = graded
# depends_on = [private_channel_object_authorization]
[[criterion]]
id = "message_multiline_order_and_idempotency"
name = "message_multiline_order_and_idempotency"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing. Sign in as Priya, open launch-room, and use the visible composer to send the exact two-line message ORDER-FIRST followed immediately by line two, then send ORDER-SECOND and ORDER-THIRD as separate messages. Verify all three leave pending state, become delivered once, preserve their full content, appear in send order, and have distinct server ids and nondecreasing server timestamps. Discover the real send request and submit ORDER-IDEMPOTENT twice with the exact same valid client id. Require both responses to identify the same stored message and verify the timeline/API contains exactly one ORDER-IDEMPOTENT. Next abort one visible composer send through browser network interception so FAILED-RETRY visibly enters failed state, remove the interception, use the visible Retry action once, and verify it becomes one delivered message rather than two.
"""

# feature = messages_threads
# sub_feature = optimistic_edit_conflict
# kind = hard_gate
# depends_on = [message_multiline_order_and_idempotency]
[[criterion]]
id = "message_edit_stale_version_and_audit"
name = "message_edit_stale_version_and_audit"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Have Priya create EDIT-V1 through the visible general composer and record its server-issued initial version V. Open that message's visible Edit control, replace its text with EDIT-V2, and submit through the visible edit UI while capturing the real edit route and version V. Require the visible and freshly fetched content to become exactly EDIT-V2 and the stored version to change once. Replay the captured version-V request with content STALE-OVERWRITE; require HTTP 409 or another clear stale-write rejection. Re-read the message and verify content remains exactly EDIT-V2 and its version did not change from the rejected write. Open the visible edit-history control and verify exactly one edit entry was added, attributed to Priya, preserving previous content EDIT-V1 and previous version V; the stale marker must appear in neither current content nor history.
"""

# feature = messages_threads
# sub_feature = delete_cleanup_and_append_only_history
# kind = hard_gate
# depends_on = [message_edit_stale_version_and_audit]
[[criterion]]
id = "message_delete_cleanup_and_history"
name = "message_delete_cleanup_and_history"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Have Priya create DELETE-CLEANUP @Omar Haddad in general. Positively verify Omar receives one mention, Omar adds one thumbs-up reaction through the visible reaction control, and Maya pins the message through its visible message menu. As Priya, delete it through its visible message menu and confirmation. Verify its original content is removed or replaced by a content-free deleted placeholder; if a placeholder remains, its reactions must be empty. Verify it disappears from general's pinned-message view and search, and Omar's mention notification is removed. Open its permitted history and verify the deletion entry remains append-only with actor Priya and previous content DELETE-CLEANUP @Omar Haddad. Reload all relevant views and re-read APIs to confirm none of the removed reaction/pin/notification effects reappear.
"""

# feature = messages_threads
# sub_feature = older_message_pagination
# kind = graded
# depends_on = [message_multiline_order_and_idempotency]
[[criterion]]
id = "timeline_pagination_preserves_position"
name = "timeline_pagination_preserves_position"
type = "binary"
weight = 0.5
description = """
This criterion is all-or-nothing. In general, establish enough uniquely numbered PAGINATION-01 through PAGINATION-35 messages through normal authenticated sends that the initial timeline cannot show all of them. Reload general, scroll the timeline to its top, and record the first visible message plus that message's viewport position. Activate the visible Load older control exactly once. Verify older messages are prepended in server order, the previously first-visible message remains visible at approximately the same viewport position rather than jumping to the bottom, no numbered marker is duplicated, and the composer/timeline remains usable. Use the visible control; directly replacing DOM or manually fetching and injecting messages fails this criterion.
"""

# feature = messages_threads
# sub_feature = thread_parent_integrity
# kind = hard_gate
# depends_on = [private_channel_object_authorization, message_multiline_order_and_idempotency]
[[criterion]]
id = "thread_reply_parent_channel_authorization"
name = "thread_reply_parent_channel_authorization"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Have Maya create one parent THREAD-GENERAL in general, a second parent THREAD-OTHER in general, and one parent THREAD-PRIVATE in leadership. As Priya, open THREAD-GENERAL through the visible thread control, send reply THREAD-ALLOWED, and verify the reply belongs to that parent and general. Capture the real reply request shape, including its idempotency/client key. Attempt as Priya to post to THREAD-PRIVATE and require a non-2xx response with no reply created. Attempt to use THREAD-ALLOWED's reply id as if it were a parent and require rejection. Finally replay THREAD-ALLOWED's already-used client key against THREAD-OTHER with marker THREAD-WRONG-PARENT; require a non-2xx response rather than receiving or relocating the earlier reply. Re-read all three threads as authorized users and verify THREAD-ALLOWED exists exactly once only under THREAD-GENERAL, while neither rejected marker exists anywhere or changed any parent's metadata.
"""

# feature = messages_threads
# sub_feature = reply_summary_consistency
# kind = graded
# depends_on = [thread_reply_parent_channel_authorization]
[[criterion]]
id = "thread_metadata_after_reply_mutations"
name = "thread_metadata_after_reply_mutations"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Create a fresh general parent THREAD-METADATA. Add reply META-PRIYA as Priya, then META-OMAR as Omar. Verify the parent shows replyCount=2, both participants exactly once, and latestReplyAt matching the later Omar reply. Edit META-PRIYA and verify count, participant set, and latest reply remain unchanged. Delete META-OMAR and verify the parent immediately changes to replyCount=1, participant Priya only, and latestReplyAt matching the remaining reply. Confirm the same exact parent metadata through a fresh API read and after page reload; deleted replies must not continue contributing.
"""

# feature = derived_user_state
# sub_feature = per_user_read_positions
# kind = graded
# depends_on = [message_multiline_order_and_idempotency]
[[criterion]]
id = "per_user_unread_read_scope"
name = "per_user_unread_read_scope"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Sign in as Priya and Omar in two ordinary tabs in the same browser context and record each channel's unread counts. While both remain away from launch-room, have Priya send UNREAD-SCOPE there. Verify Priya's own launch-room unread count does not increase, while Omar's launch-room count increases by exactly one without reload. Have Omar open or mark only general as read and verify the launch-room count is unchanged. Then open launch-room as Omar and mark through UNREAD-SCOPE read; verify only Omar's launch-room unread count clears while Priya's channel state is unaffected. Reload both tabs and verify the resulting per-user read positions and counts persist.
"""

# feature = derived_user_state
# sub_feature = mention_notification_reconciliation
# kind = hard_gate
# depends_on = [message_edit_stale_version_and_audit]
[[criterion]]
id = "mention_edit_delete_correction"
name = "mention_edit_delete_correction"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Have Priya create MENTION-CORRECT @Omar Haddad in general and verify Omar receives exactly one unread mention linking to that exact message/channel while Maya does not. Edit the same message at its current version to MENTION-CORRECT @Maya Chen. Without reloading, verify Omar's notification is removed and Maya receives exactly one notification linking to the same message; no duplicate notification may remain for either user. Delete the message at its current version and verify Maya's notification is removed. Reload both users and re-read notification/bootstrap APIs to ensure old mention effects do not return and no notification references deleted content.
"""

# feature = derived_user_state
# sub_feature = reaction_uniqueness
# kind = graded
# depends_on = [message_multiline_order_and_idempotency]
[[criterion]]
id = "reaction_idempotency_and_access"
name = "reaction_idempotency_and_access"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing. Create a fresh general message REACTION-IDEMPOTENT. As Omar, use the visible reaction control once to add thumbs-up while capturing the real request. Replay the captured request with active=true and forged user/actor fields; re-read the message and require exactly one Omar contribution and reaction count 1. Use the visible reaction pill/control once to remove Omar's reaction, then replay active=false and require count 0 with no duplicate removal side effect. As Priya, attempt the same reaction request against a seeded leadership message discovered through Maya's authorized context; require a non-2xx response. Re-read leadership as Maya and verify its reactions and history are unchanged.
"""

# feature = derived_user_state
# sub_feature = pin_authority_and_lifecycle
# kind = graded
# depends_on = [message_delete_cleanup_and_history]
[[criterion]]
id = "pin_permission_sync_and_cleanup"
name = "pin_permission_sync_and_cleanup"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing. Have Priya create PIN-LIFECYCLE in general. Attempt to pin it as ordinary member Omar through the real request and require a non-2xx response with no pin. As moderator Jordan, locate it in the visible timeline and use its visible Pin message control; verify it appears exactly once in the visible pinned-message view. Edit it as Priya through the visible edit control to PIN-LIFECYCLE-EDITED and verify the pin view reflects the edited content rather than a stale snapshot. As Jordan, use the visible Unpin message control and verify it disappears; pin it visibly once more, then delete it as Priya through the visible action and verify it immediately disappears from pins and cannot be reached through the old pinned view. Reload and re-read pins to verify no inaccessible or deleted pin returns.
"""

# feature = live_collaboration
# sub_feature = cross_session_change_delivery
# kind = graded
# depends_on = [thread_metadata_after_reply_mutations, reaction_idempotency_and_access]
[[criterion]]
id = "live_message_thread_reaction_delivery"
name = "live_message_thread_reaction_delivery"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing. Keep Priya and Omar signed in to two ordinary tabs in the same browser context, simultaneously open on general, and do not reload the receiving tab. Through Priya's visible composer send LIVE-DELIVERY; verify it appears in Omar's timeline automatically exactly once. Open its thread in both tabs, add LIVE-REPLY from Omar, and verify Priya's thread plus parent reply metadata update automatically. Add a thumbs-up reaction through Priya's visible reaction control and verify Omar sees the changed reaction count automatically. Edit LIVE-DELIVERY through Priya's visible edit control and then delete LIVE-REPLY through Omar's visible delete control; verify Omar sees the parent edit and Priya sees the reply removal/metadata correction live. Polling, direct API mutation, or direct DOM injection by the verifier does not satisfy this criterion.
"""

# feature = live_collaboration
# sub_feature = presence_typing_and_reconnect
# kind = hard_gate
# depends_on = [seeded_login_and_session_isolation]
[[criterion]]
id = "presence_typing_multiview_cleanup"
name = "presence_typing_multiview_cleanup"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing. Open two ordinary tabs signed in as Priya and one ordinary tab signed in as Omar in the same browser context, all on general. Wait until every tab visibly reports its real live connection is established; do not call the presence or typing API directly as a substitute. Verify presence represents all three individual views while any summarized user count remains logically consistent. Focus Omar's visible composer and type the exact unsent text TYPING-PROBE through normal sequential keyboard input. Within three seconds, require both Priya tabs independently to show the exact visible feedback "Omar Haddad is typing...". Stop typing and require that feedback to disappear from both Priya tabs within five seconds without reload. Close one Priya tab and verify exactly that view retires without removing the other Priya view. Switch Omar to launch-room and verify Omar leaves general presence and joins launch-room. Reconnect one remaining view and verify no duplicate presence row, typing user, or message appears after reconnection. The reasoning must quote the connection state and exact visible typing text observed in each Priya tab before and after expiry; server state or a successful POST alone is insufficient.
"""

# feature = derived_user_state
# sub_feature = authorized_search
# kind = graded
# depends_on = [thread_reply_parent_channel_authorization]
[[criterion]]
id = "search_access_deleted_and_thread_results"
name = "search_access_deleted_and_thread_results"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing. Create a general parent SEARCH-MARKER-PARENT and threaded reply SEARCH-MARKER-REPLY, a leadership message SEARCH-MARKER-PRIVATE as Maya, and a general message SEARCH-MARKER-DELETED that is then deleted. As Priya, use the visible search UI for SEARCH-MARKER. Require results to include the accessible parent and reply with correct channel/thread navigation, exclude the private leadership result, and exclude the deleted result. Activate the reply result and verify the app opens general and the correct parent thread/message rather than merely showing matching text in a dialog. A direct search filtered to leadership from Priya's session must also be rejected without leaking content.
"""

# feature = integration_audit_durability
# sub_feature = incoming_webhook_trust_boundary
# kind = hard_gate
# depends_on = [private_channel_object_authorization]
[[criterion]]
id = "webhook_secret_channel_and_idempotency"
name = "webhook_secret_channel_and_idempotency"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. The first webhook probe must be a direct same-origin POST fetch to the exact route /api/hooks/atlas-builds-secret with exact JSON body {"eventId":"WEBHOOK-EVENT-ONE","channelId":"launch-room","text":"WEBHOOK-IDEMPOTENT"}. Do not probe alternate route names, search the UI or bundle for a webhook control, or infer absence from any other path. Require HTTP 200 or 201 and quote the returned message id, channel id, content, and integration identity. Deliver that exact request a second time; require HTTP 200 or 201, the same returned message id, and exactly one stored message and one audit creation. Independently POST to exact route /api/hooks/unknown-secret, then test the valid endpoint with a missing eventId, malformed eventId, empty text, and channelId=general; quote every exact HTTP status and require each to be non-2xx. Re-read launch-room and general after every probe and verify WEBHOOK-IDEMPOTENT occurs exactly once only in launch-room and no rejected payload created any message, audit row, or other durable effect. Source inspection or unrelated 404 responses cannot establish failure; failure reasoning must include the status and response body from the exact named request.
"""

# feature = integration_audit_durability
# sub_feature = audit_and_committed_state_durability
# kind = hard_gate
# depends_on = [message_edit_stale_version_and_audit]
[[criterion]]
id = "audit_append_only_and_reload_persistence"
name = "audit_append_only_and_reload_persistence"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing. Have Priya create AUDIT-ONE in general, edit it at successive current versions to AUDIT-TWO and AUDIT-THREE, then capture the current delete request. First replay one stale earlier edit and require rejection with no new audit row. Delete the message using the current version. Fetch permitted history and require an ordered append-only record containing one creation, two edits, and one deletion, each with server timestamp and Priya as actor; whether displayed oldest-first or newest-first, timestamps and actions must consistently describe creation, the two successive edits, and deletion. The edit/delete records must preserve the correct immediately previous content and version. Reload the page and re-fetch the message/history to verify the deleted state and exact audit sequence persist, with no stale marker, removed audit row, duplicate action, or client-supplied actor/timestamp.
"""

# feature = messages_threads
# sub_feature = exact_message_deep_links
# kind = graded
# depends_on = [thread_reply_parent_channel_authorization]
[[criterion]]
id = "message_links_route_to_exact_target"
name = "message_links_route_to_exact_target"
type = "binary"
weight = 0.5
description = """
This criterion is all-or-nothing. Create a fresh general parent LINK-PARENT and a threaded reply LINK-REPLY through the visible UI. Use the visible Copy message link action on LINK-PARENT, read the resulting browser clipboard value, and open that copied URL in another authenticated ordinary tab; verify general opens and LINK-PARENT is brought into view. Then use the visible Copy message link action on LINK-REPLY and open that independently copied URL in another authenticated ordinary tab. Verify general opens, the correct LINK-PARENT thread opens automatically, and LINK-REPLY itself is present in that thread. A URL invented by the verifier, direct DOM mutation, search navigation, or merely landing somewhere in general does not satisfy either copied-link path.
"""

# feature = interface_usability
# sub_feature = mobile_core_workflow
# kind = graded
# depends_on = [seeded_login_and_session_isolation, thread_reply_parent_channel_authorization]
[[criterion]]
id = "mobile_channel_message_thread_workflow"
name = "mobile_channel_message_thread_workflow"
type = "binary"
