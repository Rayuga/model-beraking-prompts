schema_version = "1.4"
artifacts = ["/app", "/logs/verifier"]

[task]
name = "turing/common-ground-ballot"
version = "1.0.6"
description = "Private membership ballot workspace with fixed eligibility, two voting methods, revision-safe lifecycle controls, anonymous results, and durable audit history."
keywords = ["webdev", "codearena", "full-stack", "nodejs", "express", "sqlite", "ballot", "voting", "privacy", "forms", "authentication", "browser-judge", "rewardkit"]

[metadata]
difficulty = "medium"
category = "Software"
subcategory = "Forms, Auth & Onboarding"
tags = ["full-stack", "forms", "authentication", "sqlite", "private-ballots", "optimistic-concurrency", "idempotency", "accessibility"]
provenance = "Adapted from the repository's original Common Ground request and the real user task-intake conversation for this workspace; expanded into the standardized full-stack contract on 2026-09-04"
arena_slice = "full-stack-node-express-sqlite-common-ground-ballot"
arena_domain = "Consumer Product"
arena_intent = "greenfield"
arena_tech_slices = "backend/db/auth"
arena_bothbad_rate = 0.273
arena_slice_note = "The 0.273 figure is the measured backend/db/auth single slice. It is not an intersection rate for the full stack or this domain."
app_taxonomy_category = 23
app_taxonomy_app = "Survey / feedback form"
industry_vertical = "Operations"
industry_vertical_app = "Workflow approval manager"
invariant_family = "eligibility snapshots, one-person-one-ballot enforcement, anonymous selections, idempotent retries, revision-safe lifecycle changes, exact tallies, and auditable turnout"
asset_mode = "seed-and-rules"
expert_time_estimate_hours = 10
difficulty_explanation = "A compact six-workspace product combines two ballot methods, fixed eligibility, anonymous choice storage, identified turnout, exact result math, durable sessions, role boundaries, optimistic revisions, and idempotent write receipts."
solution_explanation = "The reference solution uses one Express process, normalized SQLite tables, hashed bearer sessions, transactional lifecycle and vote writes, replay receipts, revision guards, and a responsive vanilla browser client."
verification_explanation = "Render and Constraints are small hard gates. Functional browser criteria follow seeded decisions through draft, eligibility, private voting, closure and publication, with narrow same-origin request replay for server enforcement, revision, and idempotency checks."
