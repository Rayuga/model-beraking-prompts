[judge]
mode = "batched"
timeout = 7200
isolated = false
cwd = "/opt/common-ground-verifier"
temperature = 0
weight = 0.6
prompt_template = "prompt.md"
[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]
[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "authenticated_role_identity"
name = "authenticated_role_identity"
type = "binary"
weight = 0.5
description = """
Sign in separately with all four documented accounts. Each protected workspace must identify that person's name and stated role, under Riverside Residents Association. The shared gate already grades wrong-password rejection; do not score that same observation again here.
"""

[[criterion]]
id = "seeded_ballot_and_roster_records"
name = "seeded_ballot_and_roster_records"
type = "binary"
weight = 0.5
description = """
Before the functional mutations, inspect the staff records. Require exactly the supplied Annual picnic date draft, Courtyard closing time open, Shared-space improvements closed and Garden location published ballots, with their specified methods, choices and revisions. The roster starts with active Leila and paused Owen. Inspect actual protected records, not login hints. These are one seed-integrity check.
"""

[[criterion]]
id = "observer_ballot_setup_access"
name = "observer_ballot_setup_access"
type = "binary"
weight = 0.5
description = """
In a separate ordinary browser context sign in visibly as Arun Das, Observer. Open Ballots through the UI and inspect the genuine protected response that supplies it. Require populated ballot setup records, including title, wording, method, choices and lifecycle state, matching the records Ruth can currently review. Reload and navigate back to confirm the review remains usable. A forbidden response, blank/placeholder panel or permission notice in place of the records fails. This criterion owns Observer access to ballot setup only: seed correctness, writes and turnout have separate owners. If Ruth's records contain a separately graded content defect, do not fail this access criterion solely for the same content defect when Arun can review the same records.
"""

[[criterion]]
id = "observer_published_results_access"
name = "observer_published_results_access"
type = "binary"
weight = 0.5
description = """
As Arun in his own visibly authenticated Observer context, navigate to Results. Inspect the populated published Garden location result and its observed protected response, using Ruth's current published result as the positive reference. Require access to the same published outcome and option totals after reload and navigation back. A forbidden response, placeholder or missing published record fails. Grade the Observer's ability to review published results here, independently of pre-publication secrecy and mathematical correctness: the published tally criteria own the exact numbers and tie calculation. Do not double-penalize an incorrect result equally visible to both staff roles.
"""

[[criterion]]
id = "observer_members_access"
name = "observer_members_access"
type = "binary"
weight = 0.5
description = """
As Arun in his own visibly authenticated Observer context, open Members through normal navigation. Capture the genuine protected roster read and require actual member identities and active/paused states matching Ruth's current Members view, including Leila and Owen. Reload, return to Members if needed, and require that review access remains usable. A 403, placeholder, empty shell or read-only notice without the roster fails. This criterion grades permitted Observer roster reading only; membership input correctness and refusal of Observer writes are separate criteria. Read-only presentation with actual records is valid.
"""

[[criterion]]
id = "observer_audit_access"
name = "observer_audit_access"
type = "binary"
weight = 0.5
description = """
After Ruth's ordinary valid draft creation in the shared workflow has produced an audit event, inspect that actual event in Ruth's Audit view. In Arun's separate authenticated Observer context, navigate to Audit and capture its genuine protected read. Require the corresponding activity record and its presented action, actor, affected record and time to be reviewable, including after reload and navigation back. A denied route, placeholder, permanently empty panel despite Ruth seeing activity, or only a read-only notice fails. If the earlier creation produced no event, use another accepted staff action already recorded by the workflow; never treat an empty audit as proof of access. This criterion owns Observer access, not the independent business_audit_records or audit_choice_privacy requirements. Content errors equally present for Ruth and Arun belong to those criteria, not a second access penalty.
"""

[[criterion]]
id = "ordinary_session_revocation"
name = "ordinary_session_revocation"
type = "binary"
weight = 0.75
description = """
Use Phase A's session sequence with independent Ruth A and B contexts. Normal Sign out in A must revoke its server session: the original protected read and its privately retained ended credential are refused with no protected records. B remains authenticated after refresh. Follow with a fresh visible sign-in for A. Retain credentials privately; clearing a browser cookie alone proves nothing. This criterion grades ordinary sign-out only.
"""

[[criterion]]
id = "all_sessions_revocation"
name = "all_sessions_revocation"
type = "binary"
weight = 0.75
description = """
After normal sign-in establishes two independent Ruth sessions, use End all sessions in A following the shared separate-call native-dialog protocol. Both A and B must lose protected access before and after refresh; privately replay each ended credential against its observed protected read and require refusal with no records. A fresh visible sign-in afterward must succeed. This criterion grades revocation of all sessions, independently of normal sign-out.
"""

[[criterion]]
id = "draft_input_validation"
name = "draft_input_validation"
type = "binary"
weight = 0.75
description = """
Run the Phase B Exact Draft Controls independently: empty title, an actual blank submitted choice, fewer than two choices, repeated labels, approval maximum zero, and maximum four with three choices. Require prevention or visible refusal with no invalid new ballot/audit. Native prevention is valid; empty multiline separators discarded into a valid list are not invalid submissions. If needed adapt the observed request to one real blank choice. Save the offending transmitted value before alleging acceptance.
Also replace the actual required approval maximum separately with [validMaximum], object, true, null and omission, using fresh IDs and otherwise valid input. For true use two choices and maximum one so coercion would be in range. Refuse malformed required limits; ordinary form text encoding is allowed. A valid UI creation is the positive control.
"""

[[criterion]]
id = "draft_creation"
name = "draft_creation"
type = "binary"
weight = 0.75
description = """
Create Verifier room use through UI: context Reserve the shared room, Approval up to two, Morning/Afternoon/Evening. Require exactly one revision-1 Draft with that content after a protected reread and reload. Invalid inputs and audit content have separate owners.
"""

[[criterion]]
id = "draft_edit"
name = "draft_edit"
type = "binary"
weight = 0.5
description = """
Visibly edit Verifier room use to Verifier room schedule, retaining Approval up to two and the three choices. Require accepted content and one revision advance, 1 to 2, after reload while still Draft. Open and its later edit lock are separate observations.
"""

[[criterion]]
id = "ballot_open_transition"
name = "ballot_open_transition"
type = "binary"
weight = 0.5
description = """
Open Verifier room schedule through Ruth's UI. Require Open and one revision advance, 2 to 3, with its definition intact after reload. Eligibility membership and subsequent editing refusal have separate owners.
"""

[[criterion]]
id = "open_definition_lock"
name = "open_definition_lock"
type = "binary"
weight = 0.5
description = """
While Verifier is Open, use its successful edit shape as Ruth with otherwise valid content, a fresh ID and its current revision. Require refusal and unchanged wording/method/choices/status/revision. A stale, malformed or unauthorized request does not prove the Open definition lock.
"""

[[criterion]]
id = "fixed_eligibility_snapshot"
name = "fixed_eligibility_snapshot"
type = "binary"
weight = 1.5
description = """
Courtyard retains both Members despite Owen currently paused. Open Verifier while only Leila is active: its fixed snapshot contains her alone, visible to her and absent for Owen. Activate Owen; create/open Future roster probe (single, Yes/No) and require both eligible while Verifier stays Leila-only. Pause Owen again and require both snapshots unchanged after refresh.
After observing a legitimate vote shape, attempt Verifier as confirmed Owen using an in-ballot choice, fresh ID and current revision. Require non-2xx and unchanged participation/turnout/revision/audit. Current membership alone does not establish snapshot membership; Leila's independent input defects do not fail this criterion.
"""

[[criterion]]
id = "staff_write_role_boundaries"
name = "staff_write_role_boundaries"
type = "binary"
weight = 0.5
description = """
Using observed successful Ruth UI shapes for create, edit, Open, Close, Publish and membership, probe EVERY family as Arun and as each Member. Use otherwise valid current state/revision/payload and fresh IDs. Require access refusal and unchanged target/roster/participation/revision/audit. Save one authorized Ruth success per family as its positive counterpart; Phase C captures can supply these. A missing UI control, malformed input, stale version or wrong-state refusal does not establish server role enforcement.
"""

[[criterion]]
id = "session_identity_authority"
name = "session_identity_authority"
type = "binary"
weight = 0.5
description = """
From each Member's genuine session, adapt an observed valid privileged request claiming Ruth in an observed actor/user/account field, or add one such identity claim when authority is solely session-derived. Confirm the Member identity immediately before its probe. Require refusal and unchanged records without impersonation. Ordinary role refusals are separate; otherwise authorized extra fields need not be rejected.
"""

[[criterion]]
id = "ballot_target_and_revision_validation"
name = "ballot_target_and_revision_validation"
type = "binary"
weight = 0.5
description = """
As Ruth apply an observed lifecycle shape to an unknown ballot with a fresh ID; require refusal without mutation. Separately test the actual required revision in observed edit and Open shapes on valid revision-1 Drafts: 1.5, [1], object, true, null and omission, fresh ID each time. Require non-2xx and unchanged records/audit; capture a valid integer UI counterpart. Before sending, verify the actual serialized revision field has that value or is genuinely absent. If acceptance changes state/revision, visibly create a fresh Draft for later rows. Do not substitute an ignored invented field or a stale/state refusal for type validation; ordinary text form encoding is allowed.
"""

[[criterion]]
id = "membership_input_validation"
name = "membership_input_validation"
type = "binary"
weight = 0.5
description = """
Capture a real successful membership shape, restore Owen paused and use authorized Ruth/current applicable revision/fresh IDs. Independently omit the required active/paused value and replace it with object then array, preserving valid other inputs. Require non-2xx and unchanged status/revision/audit. For action-based transport adapt the actual discriminator; if the path wholly encodes status with no status/action payload, apply these malformed cases to its required revision. Do not invent an ignored status field.
Separately test required revision as [currentRevision], object, null and omission with valid requested status; require refusal without mutation and a current-revision UI positive control. A boolean type case is meaningful only where its numeric coercion matches the valid version; otherwise use the independent fresh-Draft boolean case.
Create/open Membership validation snapshot with Leila alone; require absence for Owen, unchanged after valid activation/pause and the final restart. Restore a valid paused roster through UI after any erroneous acceptance without erasing that failure. Silent no-op acceptance of malformed required input is not refusal.
"""

[[criterion]]
id = "cross_ballot_choice_rejection"
name = "cross_ballot_choice_rejection"
type = "binary"
weight = 1.0
description = """
Before eligible Leila participates on Open Verifier, use its actual voting shape with a choice ID from another ballot, otherwise valid current inputs and fresh ID. Require non-2xx, no participation and unchanged turnout after reload. A legitimate in-ballot positive submission remains possible. Confirm this record's later published totals against its captured accepted-input ledger. If an independent failed guard consumed participation, use the prompt's clean equivalent control for remaining evidence; do not charge that other acceptance here.
"""

[[criterion]]
id = "single_choice_submission_limits"
name = "single_choice_submission_limits"
type = "binary"
weight = 1.0
description = """
Before Leila participates on Open Courtyard, use the genuine vote shape/current revision to submit empty choices and both Courtyard choices separately with fresh IDs. Require refusals without participation/turnout/revision/audit change. Her subsequent visible Extend to 9 pm vote is the positive control. Owen's earlier Keep 8 pm vote supplies the observed request shape.
"""

[[criterion]]
id = "private_final_vote_confirmation"
name = "private_final_vote_confirmation"
type = "binary"
weight = 1.0
description = """
For Owen's visible Keep 8 pm Courtyard vote, Leila's Extend to 9 pm Courtyard vote and her Morning/Evening Verifier approval, require a clear one-final-submission/privacy explanation before submission and private participation confirmation afterward. Neither success response nor post-submit confirmation returns submitted choices. No receipt-widget or response-key spelling is prescribed. Input validation and tally mathematics have separate owners.
"""

[[criterion]]
id = "accepted_votes_preserve_ballot_revision"
name = "accepted_votes_preserve_ballot_revision"
type = "binary"
weight = 0.75
description = """
Use Phase B's existing successful Owen and Leila Courtyard single-choice submissions and Leila's Verifier approval submission. For each accepted vote, retain that same ballot's current revision from a genuine protected read immediately before submission, then refresh and read it again immediately afterward, before any staff edit, Close or Publish. Confirm that the vote was actually accepted and participation was recorded; require the before/after ballot revision to be identical. Both voting methods must have an observed accepted positive control. A vote that increments, decrements or resets the revision fails even if the later lifecycle actions correctly add one to that altered value. Compare the actual current revision, not merely the seed revision, a cached display or an echoed request field. This criterion owns revision stability of newly accepted votes only; vote privacy, validation, receipt replay and staff revision advances retain their separate owners. Reuse the existing workflow and role/stage snapshots. If an unrelated earlier invalid probe consumed participation, retain that failure and use an equivalent eligible UI-created control for this observation. Missing evidence of a successful vote cannot pass.
If a pre-read was not captured, preserve the instrumentation gap and use a newly UI-created equivalent eligible ballot for the same actor/method with all three real packets. This replaces only missing instrumentation, never a demonstrated revision change.
"""

[[criterion]]
id = "exact_vote_success_receipt"
name = "exact_vote_success_receipt"
type = "binary"
weight = 0.75
description = """
Retain Owen's complete original Courtyard success. While Open, after the separately tested changed-input mismatch, replay the exact original request as Owen and require its original successful status/body without additional participation/turnout/revision/audit. Replay that same original again in the one final post-restart checkpoint, when the ballot is Published. This one later observation tests persistence AND survival of lifecycle changes. Original ID/revision/body must remain unchanged. Grade receipt behavior, not tally formatting or the independently owned mismatch refusal.
"""

[[criterion]]
id = "approval_order_independent_receipt"
name = "approval_order_independent_receipt"
type = "binary"
weight = 0.75
description = """
Retain Leila's two-choice Partial turnout approval success. While Open, after the separately tested changed-set mismatch, replay both original and reversed distinct choices using the original operation ID/revision and identical other inputs. Both return the original successful status/body without business mutation. Repeat both successful variants once after the final restart when Published; no repeated mismatch sequence is required. Preserve actual array/map encoding and vary only selection order. operation_id_mismatch_safety owns different-set refusal.
"""

[[criterion]]
id = "operation_id_mismatch_safety"
name = "operation_id_mismatch_safety"
type = "binary"
weight = 1.5
description = """
Use successful Owen Courtyard vote, Leila Partial approval vote and a captured Ruth Create. For each, reuse its ID with different otherwise valid input as that same person. Require explicit operation-mismatch refusal, unchanged records and the original request still returning its original successful status/body afterward. Test the two vote mismatches once while Open; use Phase C's shared Create collision row. Repeating the same negative after every lifecycle/restart stage is unnecessary. This criterion varies inputs within the same action family; cross-action collisions belong only to user_wide_operation_namespace.
"""

[[criterion]]
id = "approval_selection_limits"
name = "approval_selection_limits"
type = "binary"
weight = 1.5
description = """
As eligible Leila on Open Verifier before participation, separately submit empty choices, a repeated option and all three distinct options where maximum is two. Require each refusal without participation/turnout/revision/audit change. Visible Morning/Evening submission supplies the positive control. Preserve repeated input, do not deduplicate it in the judge. If a failed guard consumes participation, retain its failure and establish an independent clean control for other rows. Confirmation privacy and result calculation are separate.
"""

[[criterion]]
id = "duplicate_participation_rejection"
name = "duplicate_participation_rejection"
type = "binary"
weight = 1.0
description = """
After Owen's accepted Courtyard vote while still Open, submit again with a fresh ID and current revision. Require non-2xx and unchanged participation/turnout/revision after reload. After publication require this ballot's anonymous totals match the actual accepted-input ledger: normally Keep 8 pm 1, Extend to 9 pm 1, two participants. Exact original-ID retry is a different observation; unrelated approval tallies or a stale request cannot prove this duplicate guard.
"""

[[criterion]]
id = "staff_identified_turnout"
name = "staff_identified_turnout"
type = "binary"
weight = 0.5
description = """
At Courtyard's one-participant checkpoint retain Ruth's protected/UI read identifying Owen as participated. After the required accepted votes, both Ruth and Arun must identify Leila/Owen on Courtyard (2/2) and Leila on Verifier (1/1) in their UI/protected reads. Reuse stage snapshots captured for neighboring privacy checks; this verdict owns authorized identified turnout only.
"""

[[criterion]]
id = "anonymous_choice_separation"
name = "anonymous_choice_separation"
type = "binary"
weight = 0.5
description = """
Across staff and Member roles inspect observed ballot, turnout and result UI/protected reads at Open, Closed and Published. No response or screen may associate a Member with a selected choice. Identified staff participation without choices and anonymous published aggregates are permitted. Reuse complete role/stage snapshots; Audit and post-submit confirmation privacy have separate owners.
"""

[[criterion]]
id = "member_participation_isolation"
name = "member_participation_isolation"
type = "binary"
weight = 0.5
description = """
Immediately after Owen votes on Courtyard and BEFORE Leila votes, inspect Leila's protected identity and complete UI-used ballot/turnout/activity payloads, including nested data. She sees her own nonparticipation without Owen's identified participation or submission time. After Leila votes inspect Owen's own-only status; inspect both Members again after publication and the final restart. Identified participant lists or another eligible person's participation/nonparticipation flag/timestamp leak even when hidden by CSS. Unassociated public demo names/roles and anonymous counts are allowed. Staff identified turnout remains a positive control, not an additional privacy requirement. Unpublished option-count secrecy has its own owner.
"""

[[criterion]]
id = "ballot_close_transition"
name = "ballot_close_transition"
type = "binary"
weight = 0.375
description = """
Close Courtyard through Ruth's visible UI. Require Closed, exactly one revision advance and unchanged definition/participation after protected reread and reload. Closed vote refusal and result-release timing have separate owners.
"""

[[criterion]]
id = "closed_vote_refusal"
name = "closed_vote_refusal"
type = "binary"
weight = 0.375
description = """
Reserve Future roster probe and eligible unparticipated Owen. Open his Yes voting form while Open, close as Ruth, then attempt that valid vote using the observed shape, a fresh ID and current Closed revision. Require refusal with unchanged participation/turnout/content/revision/audit. Earlier successful Courtyard voting supplies its positive request shape. If another failure consumed Future, visibly create an equivalent clean control. Duplicate participation, stale version, malformed input or Published state cannot stand in for Closed refusal.
"""

[[criterion]]
id = "unpublished_results_hidden"
name = "unpublished_results_hidden"
type = "binary"
weight = 0.75
description = """
At Open and then Closed, inspect Courtyard UI and actual protected-read bodies as Ruth, Arun, Leila and Owen. None may receive option totals or a leader until Published. Staff identified turnout is permitted. Use the shared role/stage snapshots. This owns release timing independently of participation privacy or voting refusal.
"""

[[criterion]]
id = "published_single_choice_tie"
name = "published_single_choice_tie"
type = "binary"
weight = 1.0
description = """
Inspect seeded Garden initially, after ordinary refresh and after the one final restart. Require 2 participating ballots, North lawn 1, East beds 1, and an explicit tie naming both leaders in Results UI and its protected response. Percentages are optional for this single-choice result; if shown each is 50% or equivalent. This owns exact persisted result presentation, not sessions or receipts.
"""

[[criterion]]
id = "publish_transition"
name = "publish_transition"
type = "binary"
weight = 0.5
description = """
Publish seeded Closed Shared-space improvements through Ruth's UI. Require Published and exactly one revision advance, retained after reload. The approval-tally criterion owns numbers and published_terminal_lock owns refusal of later writes.
"""

[[criterion]]
id = "published_approval_tally"
name = "published_approval_tally"
type = "binary"
weight = 1.0
description = """
After publishing Shared-space improvements, require 2 participating ballots; Street trees 2/100%, Bike racks 1/50%, Community noticeboard 1/50%. Also close/publish Partial turnout approval, whose opening snapshot has Leila/Owen but only Leila submitted Morning/Evening. Require one participating ballot with Morning 1/100%, Afternoon 0/0%, Evening 1/100%; Owen remains unparticipated. Check both UI and protected results initially and after the one final restart. Percentages use participating ballots, not eligible roster size. No explanatory sentence about totals over 100% is required. Choice privacy and structural/session survival have independent owners.
"""

[[criterion]]
id = "stale_ballot_revision_refusal"
name = "stale_ballot_revision_refusal"
type = "binary"
weight = 1.0
description = """
After Verifier's successful edit while still Draft, adapt its genuine edit shape as Ruth with a fresh ID, older integer revision and otherwise valid content. Require explicit stale conflict with useful refresh guidance and unchanged accepted content/state/revision/audit. Verify its Draft state and actual transmitted fields before interpreting the outcome. Fractional version, invented extra field, wrong actor or locked lifecycle cannot substitute for this stale-only control.
"""

[[criterion]]
id = "published_terminal_lock"
name = "published_terminal_lock"
type = "binary"
weight = 1.0
description = """
On a Published ballot use successful edit and EVERY genuine progress-action shape as Ruth, fresh IDs and current revision with valid inputs. Require explicit terminal-state refusals and unchanged definition/status/revision/snapshot/turnout/results/audit. Earlier accepted counterparts are positive controls. This owns terminal immutability, independently of stale writes and the Open edit lock.
"""

[[criterion]]
id = "business_audit_records"
name = "business_audit_records"
type = "binary"
weight = 0.75
description = """
For accepted create, edit, Open, Close, Publish and membership actions in the core workflow, compare history before/after: exactly one event with action, actual actor, affected record and readable time. Rejected and replayed operations add no event. Shared mutation captures/snapshots provide the evidence. Score event fidelity separately from privacy and business-state outcomes; a receipt-only failure in the dedicated recovery scenario does not automatically fail this core audit verdict.
"""

[[criterion]]
id = "audit_choice_privacy"
name = "audit_choice_privacy"
type = "binary"
weight = 0.75
description = """
After voting/publication inspect complete visible Audit and observed audit/activity bodies. No event links a Member to a choice or contains an actually submitted choice ID/label. Anonymous receipt activity and ordinary lifecycle action names are allowed. Grade audit disclosure separately from completeness and other read surfaces.
"""

[[criterion]]
id = "durable_reauthentication_and_seed_safety"
name = "durable_reauthentication_and_seed_safety"
type = "binary"
weight = 1.5
description = """
Save actual accepted ballot identities/content/status/revisions/participation, roster and audit from the individual-ballot workflows before the one trusted Phase D process restart. Refresh existing staff/Member sessions first, requiring continued authentication and unchanged structural records without duplicate seed data or rejected-write return. Then perform genuine fresh staff and Member sign-ins and require the same retained data. No SQLite inspection is allowed. Result criteria own exact tally/tie/percentage persistence; receipt owners grade their replay outcomes. Do not double-penalize a tally-only or receipt-only defect here. The separate round_atomic_open criterion owns round-record persistence; do not grade those same records again here.
"""

[[criterion]]
id = "staff_mutation_success_receipts"
name = "staff_mutation_success_receipts"
type = "binary"
weight = 2.0
description = """
Use Phase C's shared staff ledger: interrupted accepted Create, Edit, Open, Close, Publish and activation, plus the independently accepted inverse Pause. No separate Receipt rehearsal is required. For Create/Edit/Open/Close/activation, make the indicated newer edit/lifecycle/roster change before retrying the earlier operation; Publish and inverse Pause keep their final state. Their visible Retries (or direct captured retries when the browser recovery UI fails independently) must return each original success status/body, preserving its exact method/target/business inputs/ID/revision. Reread current records: no duplicate create, reverted content, reopening, new snapshot, roster rollback, extra participation or audit. A normal accepted action advances its applicable record revision once and creates one relevant event.
After the final restart replay all seven saved originals once and compare status/body plus unchanged current records. Existing browser retry controls supply the first comparison; do not repeat a separate pre-restart seven-request matrix. Changed-input Create mismatch belongs to operation_id_mismatch_safety; namespace and browser retention have separate owners.
"""

[[criterion]]
id = "roster_conflict_snapshot_chain"
name = "roster_conflict_snapshot_chain"
type = "binary"
weight = 2.0
description = """
In two Ruth tabs read Owen active at applicable membership revision R, keeping Leila active. In A pause then activate him; require two revision advances and one audit per accepted action. B attempts Pause at old R with fresh ID, preferably through its stale UI; if it refreshed, adapt only the observed request to R. Require explicit stale refusal/useful refresh guidance, Owen still active at the newer revision and no refusal audit.
Create/open Roster includes Owen (Yes/No): both Members eligible and visible to Owen. Refresh B, pause at current revision, then create/open Roster excludes Owen: Leila-only, absent for Owen and visible to Leila; the first snapshot still includes both. Save these snapshots and both Members' visibility before and after the final restart with Owen paused and both ballots Open. Namespace participation may subsequently use the first ballot; accepted votes do not invalidate its snapshot evidence. Grade conflict-driven snapshots here, not ordinary fixed-snapshot behavior.
"""

[[criterion]]
id = "refusal_receipt_after_state_change"
name = "refusal_receipt_after_state_change"
type = "binary"
weight = 2.0
description = """
Reuse Phase C's Refusal rehearsal and captured stale-edit recovery refusal. The authorized otherwise-valid stale Draft request for Board review B is refused while Board review A is current; after a fresh accepted edit to Board review C, its exact retry returns the original refusal status/body and leaves C/revision/audit unchanged.
On the same ballot Open, send an otherwise-valid fresh-ID premature Publish at its current revision and retain the domain refusal. Close normally; replay that unchanged Publish and require its original refusal, unchanged Closed state and no audit. Publish with a new current UI operation. After the final restart replay both original refusals again, preserving their original statuses/bodies and current C/Published state, revisions/snapshot/turnout/results/audit. Also retain the refused reviewed-save request from the draft-review race: after a later reviewed save succeeds and again after restart, its unchanged replay returns the original refusal with the current draft intact. That receipt belongs here, separately from the review UI/revision-selection behavior. No separate pre-restart Published replay or duplicate refusal fixture is needed. Unauthorized/malformed requests do not substitute; if browser Retry is defective, directly replay the observed original to score this independent server behavior.
"""

[[criterion]]
id = "user_wide_operation_namespace"
name = "user_wide_operation_namespace"
type = "binary"
weight = 2.0
description = """
Use Phase C's shared Create success and observed edit/membership shapes. As the same Ruth, reuse the Create ID across an otherwise valid current Draft edit and valid current membership update. Require explicit collision refusals without target/audit change, genuine fresh-ID UI positive counterparts, and the original Create outcome still replayable. A stale/state/role refusal does not prove namespace collision. On still-Open Roster includes Owen (or an equivalent clean UI-created fixture), both eligible Members submit legitimate choices using the same operation ID in their own sessions: both succeed. This owns cross-action and cross-person scope; same-action mismatch and ordinary receipt persistence have separate owners.
"""

[[criterion]]
id = "durable_pending_staff_work"
name = "durable_pending_staff_work"
type = "binary"
weight = 4.0
description = """
For EACH of Create, Edit, Open, Close, Publish and membership, Phase C forwards a genuine staff UI action once, captures its accepted upstream response and withholds delivery. Require identifiable visible uncertainty/pending work after reload in the same profile, with no automatic resend. Retain one through process restart and later fresh sign-in. In one held initial submission, prevent duplicate activation, then reload BEFORE its original acknowledgment/error handler; the attempt must already be retained. A mutation acknowledged successfully before a later read-refresh failure must stay confirmed, not become pending. Browser retention/initial-submit protection belongs here; exact Retry identity, multiple-entry separation, ownership and cross-tab attempts have separate owners.
"""

[[criterion]]
id = "immutable_pending_retry"
name = "immutable_pending_retry"
type = "binary"
weight = 4.0
description = """
Using the shared pending attempts, visible Retry must send original method/target/business inputs/operation ID/viewed revision. Cover accepted outcomes lost before a later target change AND a valid stale/domain refusal lost before another accepted change. Usable success or definitive business refusal resolves the reminder, gives useful feedback and refreshes current records without applying stale receipt state. Delivered unreadable success, server failure and missing acknowledgment retain uncertainty, then recover with the unchanged attempt. The existing server receipt criteria own original status/body calculation; correct outgoing identity must not fail merely because that independent server receipt is defective.
"""

[[criterion]]
id = "independent_pending_actions"
name = "independent_pending_actions"
type = "binary"
weight = 4.0
description = """
Use Phase C's Q1/Q2/Q3 sequence on separate records in one Ruth profile. Q1/Q2 must remain individually recognizable after reload while independent normal staff work stays usable. Retry Q1 while Q3 becomes independently pending; Q2/Q3 remain. Dismiss Q2 leaving Q3, then Retry Q3. Each operation affects only its own entry and sends only its own original request, never the whole queue. This tests Retry-before-Dismiss and Dismiss-before-Retry without duplicate fixtures. One global retry slot or queue-wide removal fails. Dismissal meaning and tab propagation belong to cross_tab_pending_resolution.
"""

[[criterion]]
id = "pending_actor_isolation"
name = "pending_actor_isolation"
type = "binary"
weight = 4.0
description = """
Retain Ruth's unresolved work, then visibly sign out and sign in as Arun, Leila and Owen in the SAME profile. Their authorized reads work, but they cannot see Ruth's pending details/controls or send her requests. Returning as Ruth restores her reminder with no automatic replay. Revoke Ruth's sessions from an independent context before a recovery attempt; authentication refusal must retain her original work for later genuine sign-in, without replaying it as another account. Capture the complete Retry request chain: an explicit refusal from a genuine identity/session preflight is as valid as refusal of the mutation itself. A correct client may stop before sending the write; do not require a mutation-specific 401 or a particular endpoint. A preflight may express signed-out status with 200 and an explicit absent/unauthenticated user rather than 401/403. Record that body and a credential-unchanged refusal of the already observed protected read; do not require an implementation-specific status or route. Inspect UI and outgoing traffic, not storage internals. This grades pending ownership; ordinary/global session revocation has separate criteria.
"""

[[criterion]]
id = "cross_tab_pending_resolution"
name = "cross_tab_pending_resolution"
type = "binary"
weight = 4.0
description = """
Use two Ruth tabs in the SAME profile and Phase C's shared queue. After one tab resolves an entry, the other reflects removal on its next interaction/reload; stale controls cannot reconstruct/resend it or recreate the reminder. Dismiss a separate upstream-accepted entry with no business mutation, only that reminder removed in both tabs, and clear guidance that dismissal does not undo accepted work. Hold one Retry's captured reply while the other tab dismisses if available or shows a legitimate busy state; retain a different pending action, then release the late outcome. No removed reminder returns or different entry is overwritten, and concurrent clicks cannot overlap attempts for the same entry. Also start a Retry for the remaining Q3 entry in an auxiliary same-profile tab and hold its actual upstream reply. Close that owner tab before delivery, release/clean up the held response, then refresh the surviving original tab. It must allow an explicit Retry of that unchanged Q3 attempt, with no automatic resend or permanent busy state; the accepted Retry resolves the reminder. This owns recovery of abandoned cross-tab attempt ownership. Server receipt identity, initial-submit retention and queue separation retain their own owners.
"""

[[criterion]]
id = "unforgeable_session_credentials"
name = "unforgeable_session_credentials"
type = "binary"
weight = 0.75
description = """
Observe two independent legitimate sign-ins for the same account and their actual authenticated protected-record reads. Both must work with distinct issued session credentials. Using the observed authentication transport and protected read, test a fresh unauthenticated request context with candidate credentials constructed only from public account identifiers, email, name or role; a one-character alteration of an issued credential; and an unsigned identity/role claim payload. These candidates must not grant protected access or create a usable authenticated session. Keep credential values private and record only candidate category, response status and absence/presence of protected records. A denied response or login redirect without private data is acceptable; a server error is inconclusive. Do not impose a token alphabet, encoding, length, signing algorithm or storage design. This criterion owns unpredictability and integrity of the session credential itself; body-level actor forgery belongs to session_identity_authority, wrong-password handling to the global gate, and sign-out invalidation to the revocation criteria. Normal authenticated reads before and after the probes are positive controls. Adapt only the genuinely observed credential-bearing request fields; do not guess application routes, install sessions, or change application/browser storage.
"""


[[criterion]]
id = "disjoint_draft_review"
name = "disjoint_draft_review"
type = "binary"
weight = 3.0
description = """
In two legitimate Ruth contexts open the same fresh Draft. A changes its title; B changes its context while retaining the original title. Both independently make the same valid change to the voting definition. B saves first. After A's stale save is refused, use its visible review path. Require a preview combining A's unsaved title with B's saved context and the matching voting definition without an unnecessary conflict choice, without a write just for opening the preview. Explicitly save the reviewed copy and verify that combined content in a fresh protected read and reloaded UI. This owns automatic combination of nonoverlapping fields, not the original stale-write refusal or generic persistence. Use fresh distinct values and real UI throughout.
"""

[[criterion]]
id = "conflicting_draft_review"
name = "conflicting_draft_review"
type = "binary"
weight = 3.0
description = """
On a current Draft, A and B change title, context and voting definition differently from the same viewed base; B saves first. A's refused edit must lead to a review showing the opened, attempted and latest values for each of those three fields. Voting method, approval maximum and ordered choices are one indivisible field. No conflicting choice is silently preselected, and saving is prevented until all conflicts have explicit choices. Choose A's title, B's context and A's complete voting definition; changing review selections sends no write. Explicitly save and confirm exactly that combination through current UI/protected data. Do not grade visual layout or exact labels. This owns explicit conflicting-field choices; the disjoint case and later preview race have separate owners.
"""

[[criterion]]
id = "draft_review_rechecks_revision"
name = "draft_review_rechecks_revision"
type = "binary"
weight = 3.0
description = """
Reach a valid review preview after a refused stale edit. Before A confirms it, B makes another accepted edit. A's explicit reviewed save must use a fresh operation ID and the revision A actually reviewed; require a refusal and no overwrite of B's later work. A retains its reviewed working copy and can review the newest record again, resolve any new overlap, and explicitly save with another fresh ID/current reviewed revision. Verify the resulting intended content and no automatic write on either review. This owns the review-confirmation race and re-review experience, not Phase B's ordinary stale-edit check or Phase C's separate refusal-receipt matrix. Never mark it passed solely because a direct stale API probe was refused.
"""

[[criterion]]
id = "draft_review_discard"
name = "draft_review_discard"
type = "binary"
weight = 1.5
description = """
After A's valid edit is refused because B saved a newer Draft, open its real review and use the visible discard/cancel path. Require no mutation request for discarding and unchanged latest saved content, revision and audit. Return to a usable current ballot workspace. An ordinary accepted draft edit in B is the positive control; refusing every edit cannot pass. This concerns discarding a refused draft's unsaved working copy, independently of dismissing an uncertain operation reminder.
"""

[[criterion]]
id = "draft_review_lifecycle_stop"
name = "draft_review_lifecycle_stop"
type = "binary"
weight = 1.5
description = """
A starts editing a current Draft while B opens that same ballot normally. A's refused old edit must lead to current-state guidance that the ballot is now Open and its definition is locked; the review must not offer an enabled save or send another edit. Inspect current status/content/revision unchanged by reviewing, then leave the review and use the workspace normally. An ordinary accepted draft edit is the positive control. This owns the browser review's lifecycle stop, not the server's independently graded Open edit lock.
"""

[[criterion]]
id = "late_recovery_reply_isolation"
name = "late_recovery_reply_isolation"
type = "binary"
weight = 2.0
description = """
Use two independent, genuine unresolved Ruth actions and her actual visible Retry in a dedicated profile. For the first Retry, hold an upstream successful reply; while it is held, sign out and sign in as Leila in that profile, then release it. For the second, revoke Ruth from an independent context, hold the real authentication-refusal response in the Retry chain (identity preflight or mutation; an explicit signed-out preflight body is valid), sign in as Arun in the dedicated profile, and release it. Both new accounts must retain their correct identity and usable authorized workspace, with no Ruth pending details, action-specific feedback or automatic retransmission. In the success case only Ruth's original reminder may settle silently; in the refusal case it must remain available when Ruth signs back in, with no automatic replay. Ordinary authorized ballot records are not pending-detail leakage. If authentication changes are temporarily blocked while an action is in flight, record that prevention and confirm normal switching after release; do not force impossible overlap. This grades delivery after an account change; the ordinary pending_actor_isolation scenario has no held late response.
"""

[[criterion]]
id = "round_review_and_cancel"
name = "round_review_and_cancel"
type = "binary"
weight = 3.0
description = """
As Ruth visibly select two fresh Drafts with different methods, review their actual titles/context/complete voting definitions and eligible Member names, then cancel. Current protected records and audit stay unchanged; selecting, reviewing and cancelling send no business mutation. A read implemented with POST is allowed. The preview must describe exactly the selected drafts and current active roster, not all drafts or a stale cached roster. Reopen the ordinary workflow and obtain the successful round positive control. This owns review/cancellation, not confirmation's atomic outcome or visual appearance.
"""

[[criterion]]
id = "round_atomic_open"
name = "round_atomic_open"
type = "binary"
weight = 4.0
description = """
Confirm the reviewed mixed-method pair as Ruth while a third fresh Draft is unselected. Require both selected drafts Open, exactly one revision advance each, the same reviewed active-Member snapshot, and one ordinary Open audit event per selected ballot. The unselected draft and its audit remain unchanged. Confirm through refreshed UI/protected reads and both Members' eligibility views, then verify the saved identities/revisions/snapshots/audit at the shared final restart. One completed round operation is required; a browser loop of individually committed Opens fails atomic confirmation. Do not prescribe an API route, schema, shared timestamp or response shape. This owns the accepted round's business outcome; other criteria own conflicts, transport recovery and receipt computation.
"""

[[criterion]]
id = "round_draft_conflict"
name = "round_draft_conflict"
type = "binary"
weight = 4.0
description = """
A reviews a fresh draft pair. In separate Ruth B, edit one selected draft normally. A confirms the unchanged preview: require an explicit stale refusal, neither draft opened, and no round-created snapshot, revision or audit change. Save current protected records immediately before/after the attempt. A must receive useful re-review guidance, explicitly review the latest content and then confirm with a fresh operation ID and those viewed revisions; the valid counterpart opens both. Also reuse another pair to observe B opening one selected draft before A confirms: refusal must leave the other Draft and both records/audit unchanged. Test the edited/opened target in the later serialized position when order is exposed, so a loop that partially commits earlier targets is detectable. This owns all-or-nothing draft conflict handling and re-review, independently of the original single-draft stale check.
"""

[[criterion]]
id = "round_roster_conflict"
name = "round_roster_conflict"
type = "binary"
weight = 4.0
description = """
A reviews a fresh pair while Owen is paused and Leila active. First B activates then pauses Owen again: the active names match the preview, but the paused Member's revision changed. A's old confirmation must be refused atomically, leaving both Draft with no round audit/snapshot/revision changes. A explicitly reviews again; B activates Owen and A's next old confirmation must likewise refuse everything. A reviews this newer active roster; B pauses then reactivates Owen, so that preview now has the same active names but old membership revisions and must again be refused atomically. Save all three actual refusals and record snapshots, not only UI messages. After a further explicit review, a fresh-ID confirmation opens both with both Members eligible. Later pause Owen; both opening snapshots stay intact. This owns whole-roster change detection for both paused and active Members, separately from draft conflicts and ordinary one-ballot snapshots. Preserve the three original refusal receipts for their independent owner.
"""

[[criterion]]
id = "round_input_boundaries"
name = "round_input_boundaries"
type = "binary"
weight = 2.0
description = """
Adapt a genuinely captured round confirmation on otherwise current Drafts/roster, fresh ID per row. Independently test a repeated ballot, only one distinct ballot, an unknown target and omission of one roster Member. For each of the actual required ballot revision and membership revision, test [currentRevision], object, true, 1.5, null and omission; use revision-1 fixtures for true so coercion would be in range. Require a useful non-2xx refusal and no selected/other ballot, snapshot, revision or audit mutation. Also pause both Members through valid UI, review that current roster and require the otherwise-valid round to refuse for having no active Members, with no business changes; restore Leila active through UI afterward. A genuine valid Ruth round is the positive control. This criterion owns request admissibility for the round only; stale draft/roster versions belong to the dedicated conflict owners. A 500, stale fixture or invented ignored field proves no boundary.
"""

[[criterion]]
id = "round_role_boundaries"
name = "round_role_boundaries"
type = "binary"
weight = 1.0
description = """
Using an observed genuine round confirmation, test otherwise valid current Drafts, reviewed roster and fresh operation identifiers as Arun, Leila and Owen in their own visibly authenticated contexts. Require server access refusal and unchanged ballots/snapshots/revisions/audit in every case. An accepted Ruth UI round is the positive control. Missing controls or refusals caused only by malformed, old or wrong-stage input do not establish role enforcement. This owns permission to open a round; the existing staff_write_role_boundaries criterion owns only its listed individual action families.
"""

[[criterion]]
id = "round_success_receipt"
name = "round_success_receipt"
type = "binary"
weight = 4.0
description = """
Retain the real round success. Close one selected ballot and change membership normally, then replay the original round with both target and roster collections reordered but the same identifiers/revisions (an inherently orderless transport is valid). Require its original success status/body and unchanged current states/snapshots/audit. Independently change one selected target, one reviewed ballot revision, and one reviewed membership revision under the same ID, keeping each packet otherwise well-formed: each must return an explicit input-collision refusal and preserve the original receipt. The membership-only change is required; changing a ballot revision does not prove the roster participates in receipt identity. Also reuse an observed successful Ruth Create ID for an otherwise valid current round confirmation: it must refuse the cross-action collision, and the original Create receipt must still replay unchanged. The reordered original round still returns its original outcome after these collisions and the final restart. This owns canonical set identity, namespace participation and original success computation for a multi-record receipt; the earlier namespace criterion owns only its listed individual actions. Browser reminder handling is graded separately. No normalization may turn a repeated target into a valid set; that input owner tests duplicates.
"""

[[criterion]]
id = "round_refusal_receipts"
name = "round_refusal_receipts"
type = "binary"
weight = 4.0
description = """
Retain the well-formed authorized draft-conflict refusal and all three roster-conflict refusals from the shared round workflow. After fresh explicit reviewed confirmations succeed, replay each refused operation unchanged and require the original refusal status/body, with current ballots/snapshots/revisions/audit unchanged. Repeat the same four saved originals after the one final restart. Do not substitute a malformed, unauthorized or successful request. This owns the durable original refusal result; the conflict criteria own whether the initial atomic refusal was correct. Direct observed replay is allowed when a browser reminder independently fails.
"""

[[criterion]]
id = "round_pending_recovery"
name = "round_pending_recovery"
type = "binary"
weight = 4.0
description = """
For the valid confirmation following roster conflicts, capture the actual accepted upstream round response and withhold delivery. Require one visible unresolved round identifying both selected ballots after reload, with no automatic resend or separate per-ballot Open requests. Retain it through the final process restart and genuine sign-out/sign-in. Change one selected ballot to Closed and membership before the explicit visible Retry. Retry must send the whole unchanged round identity, selection, viewed ballot revisions and reviewed roster; a usable result settles only that entry and refreshes current records without reopening or applying an old Open response over the Closed view. Its original reminder is saved before the initial send. Use the helper to observe requests; do not inspect browser storage. Server receipt body calculation belongs to round_success_receipt; grade outgoing identity, retained reminder and current UI independently. Generic single-action queue/account cases retain their existing owners and need not be repeated for this round.
"""
