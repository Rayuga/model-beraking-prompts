# Prompt version: functional-batch004-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 1200
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 4.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[criterion]]
id = "demo_roles_and_privacy"
name = "demo_roles_and_privacy"
type = "binary"
weight = 1.0
description = """
From the clean initial state, sign in as Coordinator, Observer, and both Members. Confirm role-specific scope, both Members' eligibility, member self-only participation, and no visible identity-to-choice linkage.
"""

[[criterion]]
id = "draft_open_snapshot"
name = "draft_open_snapshot"
type = "binary"
weight = 2.0
description = """
As Coordinator, create a ballot with at least two choices and open it. Confirm the eligible membership is captured for that ballot and invalid drafts cannot open.
"""

[[criterion]]
id = "single_private_vote"
name = "single_private_vote"
type = "binary"
weight = 2.0
description = """
As one eligible Member, submit a vote. Confirm participation changes, a second vote is refused, and no post-vote view or observed response links the Member to the selected choice.
"""

[[criterion]]
id = "close_and_publish"
name = "close_and_publish"
type = "binary"
weight = 2.0
description = """
As Coordinator, close the ballot after voting and confirm further votes are refused while choice totals remain hidden. Publish results and confirm the tally then becomes visible.
"""

[[criterion]]
id = "observer_and_audit_scope"
name = "observer_and_audit_scope"
type = "binary"
weight = 2.0
description = """
Confirm the Observer remains read-only and administrative lifecycle actions appear in the audit without exposing a Member's selected choice.
"""

[[criterion]]
id = "persistent_reauthentication"
name = "persistent_reauthentication"
type = "binary"
weight = 2.0
description = """
Complete one distinctive ballot or voting mutation, reload, sign in again, and confirm exactly one durable outcome remains without leaking vote identity.
"""
