# Prompt version: polish-batch004-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 600
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[criterion]]
id = "responsive_accessible_layout"
name = "responsive_accessible_layout"
type = "binary"
weight = 1.0
description = """
At about 390 by 844, confirm the page has no horizontal overflow and all 5 workspaces remain reachable. On desktop, require navigation and main landmarks, meaningful headings, and accessible names or labels for controls.
"""

[[criterion]]
id = "visual_hierarchy_and_density"
name = "visual_hierarchy_and_density"
type = "binary"
weight = 1.0
description = """
Confirm dense records remain scannable through clear hierarchy, status treatment, spacing, and readable tables, cards, timelines, or charts rather than raw undifferentiated JSON or text.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Confirm forms and state-changing controls visibly explain success, validation failure, disabled actions, and current status; dialogs or detail views open and close without trapping or obscuring the workspace.
"""
