# Prompt version: render-batch004-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "authenticated_render"
name = "authenticated_render"
type = "binary"
weight = 1.0
description = """
Sign in and confirm a substantive, usable Common Ground workspace renders without a fatal browser error or broken page, including a clear empty state when no domain records exist yet.
"""

[[criterion]]
id = "workspace_rendering"
name = "workspace_rendering"
type = "binary"
weight = 1.0
description = """
Open Ballots, Vote, Turnout, Results, Audit. Every destination must visibly activate and show its own meaningful heading and content; labels pointing to one unchanged screen do not pass.
"""
