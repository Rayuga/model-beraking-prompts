# Prompt version: common-ground-ballot-v1.0.6-constraints
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 360
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "same_origin_shell"
name = "same_origin_shell"
type = "binary"
weight = 1.0
description = """
Confirm the root document and essential script/style resources load successfully from localhost:3000 without a public CDN, remote font, or third-party runtime dependency. Ignore browser-internal URLs and verifier tooling.
"""

[[criterion]]
id = "entrypoint_refresh_usable"
name = "entrypoint_refresh_usable"
type = "binary"
weight = 1.0
description = """
Confirm `GET /api/health` succeeds, then return to the root page and refresh. Pass when the instructed local entry point remains reachable and the public UI is still usable.
"""
