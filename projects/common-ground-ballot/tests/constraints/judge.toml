[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "same_origin_shell"
name = "same_origin_shell"
type = "binary"
weight = 1.0
description = """
Confirm the root document and essential script/style resources load successfully from localhost:3000 without a public CDN, remote font, or third-party runtime dependency. Ignore browser-internal URLs and verifier tooling.
"""

[[criterion]]
id = "entrypoint_refresh_usable"
name = "entrypoint_refresh_usable"
type = "binary"
weight = 1.0
description = """
Confirm `GET /api/health` succeeds, then return to the root page and refresh. Require the instructed local entry point to remain reachable and the app UI to stay usable, including the authenticated workspace established by the shared gate.

Use the trusted terminal only for a read-only inspection of the verifier-launched database identified in /logs/verifier/app-lifecycle.json. Confirm it is a real SQLite database, not an empty placeholder, with the current ballots, membership, sessions, participation, votes, replay receipts and audit represented in its schema. Compare a current ballot identity/status/revision and its published tally with observed protected responses. Accept any table/column names or normalized/JSON storage structure. Never modify the database or expose unpublished choices.
"""
