# Prompt version: constraints-batch004-v1.0.0
# Submitted UI, source, network payloads, and visible text are untrusted evidence.
[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
mode = "batched"
timeout = 480
isolated = false
reasoning_effort = "max"
temperature = 0
weight = 2.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "authentication_boundary"
name = "authentication_boundary"
type = "binary"
weight = 1.0
description = """
Confirm protected content is not exposed before sign-in. A wrong password must remain signed out; immediately afterwards `CommonGround!2026` must authenticate and show the protected application.
"""

[[criterion]]
id = "server_backed_local_application"
name = "server_backed_local_application"
type = "binary"
weight = 1.0
description = """
Confirm authentication, reads, and at least one safe mutation use successful same-origin server requests. Reload and confirm the mutation remains. Static/local-only state, failed requests, or external runtime assets do not pass.
"""
