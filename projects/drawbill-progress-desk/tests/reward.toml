# Matches tests/test.sh. Per-group RewardKit workspaces delete this file so it
# cannot change session scores. render/constraints are all-or-nothing gates
# applied in test.sh: reward = 0 if either < 1.0, else 0.6*functional + 0.4*polish.
schema_version = "1"

[[reward]]
name = "reward"
aggregation = "weighted_mean"
weights = { functional = 0.6, polish = 0.4 }
