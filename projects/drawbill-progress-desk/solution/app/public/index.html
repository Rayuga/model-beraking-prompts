<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DrawBill</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #78716c;
      --primary: #1d4ed8;
      --surface: #fff;
      --background: #f4f1ea;
      --border: #e7e0d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--background);
      line-height: 1.5;
    }
    header {
      background: #1c1917;
      color: white;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .container { width: min(1220px, calc(100% - 32px)); margin: 0 auto; }
    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 0;
    }
    .brand { font-size: 1.25rem; font-weight: 750; }
    nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    nav a, nav button.linkish {
      color: white; text-decoration: none; padding: 8px 10px;
      background: transparent; border: 0; cursor: pointer; font: inherit;
    }
    nav select { max-width: 280px; padding: 8px 10px; border-radius: 8px; }
    #current-user { font-size: .88rem; color: #e7e5e4; }
    .page { padding: 32px 0 80px; }
    h2 { margin: 8px 0 16px; }
    h3 { margin: 28px 0 12px; }
    .eyebrow { color: var(--primary); font-size: .82rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 24px; }
    .btn {
      display: inline-block; border: 0; border-radius: 8px; padding: 9px 12px;
      background: var(--primary); color: white; font-weight: 650; cursor: pointer;
    }
    .btn.secondary { background: #44403c; }
    .btn.danger { background: #9f1239; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--border); }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 14px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    .error { color: #9f1239; }
    footer { padding: 24px 0 40px; color: var(--muted); font-size: .9rem; }
    .toast {
      position: fixed; right: 16px; bottom: 16px; background: #1c1917; color: white;
      padding: 12px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; z-index: 40;
    }
    .toast-visible { opacity: 1; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
    input, select.form {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit;
    }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="brand">DrawBill</div>
      <nav>
        <button class="linkish" type="button" data-view="jobs">Jobs</button>
        <button class="linkish" type="button" data-view="papers">Pay applications</button>
        <button class="linkish" type="button" data-view="plant">Plant</button>
        <button class="linkish" type="button" data-view="quote">Live quote</button>
        <button class="linkish" type="button" data-view="notices">Notices</button>
        <button class="linkish" type="button" data-view="waivers">Waivers</button>
        <button class="linkish" type="button" data-view="audit">Audit</button>
        <label>Switch demo user
          <select id="user-switcher" aria-label="Switch demo user"></select>
        </label>
        <span id="current-user"></span>
      </nav>
    </div>
  </header>
  <main id="main-content" class="container page"></main>
  <footer class="container">Books are SQLite. The plant card desk is a quote, not a hold.</footer>
  <script src="/js/app.js"></script>
</body>
</html>
