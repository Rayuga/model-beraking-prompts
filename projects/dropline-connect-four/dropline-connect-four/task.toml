schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "app", exclude = ["node_modules"] },
]

[task]
name = "turing/dropline-connect-four"
version = "2.0.0"
description = "Build DropLine, a local two-player four-in-a-row game with exact gravity and win rules, reversible score-aware history, keyboard play, responsive accessible controls, and durable browser match state."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["vibe-code", "webdev", "nodejs", "express", "game", "connect-four", "undo-redo", "local-storage", "accessibility"]

[metadata]
category = "Software"
subcategory = "Classic & Board Games"
tags = ["full-stack", "browser-game", "state-machine", "accessibility", "persistence"]
expert_time_estimate_hours = 8.0
difficulty_explanation = """
This work is representative of a senior frontend or full-stack engineer building
a deterministic interactive state machine. The implementation must keep game
rules, reversible terminal side effects, persisted state, keyboard focus, DOM
accessibility, and responsive motion behavior consistent across long sequences.
The supplied seed is intentionally small because the realistic data is the live
match state generated by users, including its history and recovery metadata.
"""
solution_explanation = """
The reference solution separates pure game transitions from DOM rendering. A
versioned row-major state object is updated only by accepted transitions, and
Undo/Redo reverse terminal scoring as part of the same state change. The browser
layer renders accessible cells and controls, persists each accepted mutation,
and restores state without replaying score-producing events.
"""
verification_explanation = """
The verifier uses isolated, deterministic Playwright sessions and exact visible
move sequences. It checks the rendered DOM, accessible names, focus, geometry,
browser persistence, history, scores, terminal locking, and all win directions.
No LLM judges the result. Every feature check is binary, a CTRF report records
each outcome, and the delivery reward is one only when every hard check passes.
"""

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[solution]
env = {}

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
allow_internet = false

[environment.env]
PORT = "3000"
BASE_URL = "http://localhost:3000"
APP_PUBLIC_URL = "http://localhost:3000"
APP_PUBLIC_PORT = "3000"
