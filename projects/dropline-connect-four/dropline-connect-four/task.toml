schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "app", exclude = ["node_modules"] },
]

[task]
name = "webdev/dropline-connect-four"
version = "1.1.0"
description = "Build DropLine, a local two-player four-in-a-row game with exact gravity and win rules, reversible score-aware history, keyboard play, responsive accessible controls, and durable browser match state."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["vibe-code", "webdev", "nodejs", "express", "game", "connect-four", "undo-redo", "local-storage", "accessibility"]

[metadata]
category = "web-development"
difficulty = "medium"
difficulty_explanation = """
DropLine has a familiar, compact interface but requires one coherent state
machine. Shallow implementations often place pieces and alternate colors while
missing one diagonal direction, side-effect-free full-column rejection,
terminal locking, exact winning cells, score-aware Undo/Redo, Redo branch
invalidation, alternating round starters, or idempotent reload restoration.
The rubric uses deterministic visible move sequences and gives more weight to
draw, terminal reversal, and persistence behavior than to initial appearance.
"""
task_id = "WEBDEV-DROPLINE-CONNECT-FOUR-001"
capabilities = ["frontend-ui", "game-rules", "keyboard-accessibility", "browser-persistence", "undo-redo"]

[agent]
timeout_sec = 5400.0
network_mode = "public"

[verifier]
timeout_sec = 14400.0
network_mode = "public"
environment_mode = "shared"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "medium"
REWARDKIT_TIMEOUT_SEC = "13200"

[solution]
env = {}

[environment]
build_timeout_sec = 2400.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "public"

[environment.env]
PORT = "3000"
BASE_URL = "http://localhost:3000"
APP_PUBLIC_URL = "http://localhost:3000"
APP_PUBLIC_PORT = "3000"
