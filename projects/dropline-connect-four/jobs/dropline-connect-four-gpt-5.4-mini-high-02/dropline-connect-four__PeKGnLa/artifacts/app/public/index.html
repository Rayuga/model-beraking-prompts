<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DropLine</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-labelledby="game-title">
      <header class="header">
        <div>
          <h1 id="game-title">DropLine</h1>
          <p id="game-subtitle">Four in a Row</p>
        </div>
        <div class="scores" aria-label="Match score">
          <div><span>Red wins</span><strong id="red-wins">0</strong></div>
          <div><span>Yellow wins</span><strong id="yellow-wins">0</strong></div>
          <div><span>Draws</span><strong id="draws">0</strong></div>
        </div>
      </header>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="feedback" class="feedback" aria-live="polite"></p>

      <div class="board-wrap">
        <div id="column-controls" class="column-controls" aria-label="Column controls"></div>
        <div id="board" class="board" role="grid" aria-label="DropLine board"></div>
      </div>

      <section class="panel">
        <div class="panel-block">
          <h2>History</h2>
          <ol id="history" class="history" aria-label="Move history"></ol>
        </div>
        <div class="panel-block">
          <h2>Match controls</h2>
          <div class="controls">
            <button id="undo-btn" type="button">Undo</button>
            <button id="redo-btn" type="button">Redo</button>
            <button id="next-round-btn" type="button">Next Round</button>
            <button id="reset-btn" type="button" class="danger">Reset Match</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
