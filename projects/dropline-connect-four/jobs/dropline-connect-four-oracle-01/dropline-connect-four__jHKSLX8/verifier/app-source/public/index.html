<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>DropLine</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">DL</span>
        <div>
          <h1 id="app-title">DropLine</h1>
          <p id="app-subtitle">Four in a Row</p>
        </div>
      </div>
      <div id="round-status" class="round-status" data-status="playing" aria-live="polite">
        <span class="status-token red" aria-hidden="true">R</span>
        <strong>Red's turn</strong>
      </div>
    </header>

    <main class="game-shell">
      <section class="play-area" aria-labelledby="board-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Current round</p>
            <h2 id="board-heading">Board</h2>
          </div>
          <span id="selected-column" class="selection-readout">Column 1 selected</span>
        </div>

        <div id="column-controls" class="column-controls" aria-label="Drop controls"></div>
        <div id="board" class="board" role="grid" aria-label="DropLine board" aria-rowcount="6" aria-colcount="7"></div>

        <div id="feedback" class="feedback" aria-live="assertive"></div>

        <div class="match-actions" aria-label="Match controls">
          <button id="undo-button" class="action-button" type="button" disabled>
            <span aria-hidden="true">&#8630;</span> Undo
          </button>
          <button id="redo-button" class="action-button" type="button" disabled>
            <span aria-hidden="true">&#8631;</span> Redo
          </button>
          <button id="next-round-button" class="action-button primary" type="button" disabled>
            Next Round
          </button>
          <button id="reset-button" class="action-button danger" type="button">
            Reset Match
          </button>
        </div>
      </section>

      <aside class="match-panel" aria-label="Match details">
        <section class="score-section" aria-labelledby="score-heading">
          <div class="panel-heading">
            <p class="eyebrow">Match</p>
            <h2 id="score-heading">Score</h2>
          </div>
          <div class="scoreboard">
            <div class="score red-score">
              <span class="score-token red" aria-hidden="true">R</span>
              <span>Red wins</span>
              <strong id="red-score">0</strong>
            </div>
            <div class="score yellow-score">
              <span class="score-token yellow" aria-hidden="true">Y</span>
              <span>Yellow wins</span>
              <strong id="yellow-score">0</strong>
            </div>
            <div class="score draw-score">
              <span class="score-token draw" aria-hidden="true">=</span>
              <span>Draws</span>
              <strong id="draw-score">0</strong>
            </div>
          </div>
        </section>

        <section class="history-section" aria-labelledby="history-heading">
          <div class="panel-heading history-heading-row">
            <div>
              <p class="eyebrow">This round</p>
              <h2 id="history-heading">Move history</h2>
            </div>
            <span id="move-count">0 moves</span>
          </div>
          <ol id="move-history" class="move-history"></ol>
          <p id="empty-history" class="empty-history">No moves yet</p>
        </section>
      </aside>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
