schema_version = "1.4"
artifacts = ["/app"]
[task]
name = "turing/torquebay-repair-operations"
version = "1.0.0"
description = "Full-stack Node.js, Express, React, and SQLite TorqueBay repair-shop desk with seeded staff and customer identities, no login wall, and browser-only Luna judging. The brief is split field notes plus a short policy on role workspaces, customer scope, approval separation, bay and technician controls, compatible parts, independent warranty review, intake, invoicing, and a durable audit trail. Requests may carry extra fields; the server ignores fields it does not own. Shop pages and shop data stay on this origin. Render and constraints are hard gates; after both pass, reward is 0.6 * functional + 0.2 * polish + 0.2 * visual. Visual scores presentation only. Refusals are graded by unchanged re-read rather than one status-code shape."
keywords = ["webdev", "turing", "full-stack", "nodejs", "express", "sqlite", "react", "repair-shop", "authorization", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
difficulty_explanation = """
v1.0.0 — five browser dimensions. Shop-state difficulty is unchanged:
Nora Adler opens the seeded board, identity changes only through the
visible switcher, and the eleven functional chains still grade role
workspaces, customer scope, approvals, bays, technician certification,
parts, warranty separation, intake, invoicing, audit, and APP_MANIFEST.
Render and constraints remain hard gates with no reward mass. After both
pass, reward is 0.6 * functional + 0.2 * polish + 0.2 * visual. Visual is
Likert presentation only (typography, contrast, spacing, hierarchy, craft)
and does not grade responsiveness, product behavior, or shop policy.
"""
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "turing/torquebay-repair-operations v1.0.0: BazaarBridge Harbor layout for task.toml, timeouts, verifier Docker tooling, and reward formula; visual Likert dimension included; judge/model keys omitted from judge.toml; OPENAI_API_KEY only in [verifier.env]."
arena_slice = "full-stack-node-express-sqlite-torquebay-repair-operations"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
