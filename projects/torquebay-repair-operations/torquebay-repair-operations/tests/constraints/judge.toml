[judge]
mode = "batched"
timeout = 480
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "direct_demo_access"
name = "direct_demo_access"
type = "binary"
weight = 1.0
description = """
Confirm the seeded operations desk is usable immediately as Nora Adler without credentials, registration, account creation, a role-claim form, or another setup gate, and that identity changes only through the visible seeded-user switcher.
"""

[[criterion]]
id = "self_contained_same_origin_runtime"
name = "self_contained_same_origin_runtime"
type = "binary"
weight = 1.0
description = """
Confirm shop pages and the API or data requests used for repair-shop records stay on the task origin. Browser-only business records, or a required third-party backend, do not pass. Prove it with one allowed write that includes an unpredictable token: after clearing browser storage and reloading, that token must still return. An off-origin font, stylesheet, or script used only for presentation, or an unused CDN URL, does not fail this check by itself.
"""
