[judge]
mode = "batched"
timeout = 900
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "visual_typography"
name = "visual_typography"
type = "likert"
points = 5
weight = 1.0
description = """
Assess typography on the rendered TorqueBay desk at http://localhost:3000 at
desktop width (Nora's landing board plus a repair-order list and one detail
or bay surface).
5: deliberate type system - readable fonts; distinct sizes and weights for
identity, repair-order numbers, labels, money, and body text; consistent
alignment; no awkward truncation or collisions.
4: readable with one or two minor size or alignment defects.
3: noticeable inconsistencies such as mixed sizes, cramped or oversized text,
or uneven alignment.
2: several labels are hard to read or inconsistently styled.
1: typography is broadly default, illegible, or misaligned.
0: no coherent typographic rendering exists on the reviewed surface.
"""

[[criterion]]
id = "visual_color_and_contrast"
name = "visual_color_and_contrast"
type = "likert"
points = 5
weight = 1.0
description = """
Assess colour and contrast on the rendered shop desk at desktop width,
including status, hold, money, and identity treatments on the staff board.
5: cohesive palette; text and background contrast stays legible; status,
hold, and money colours are distinguishable without relying on colour alone
for the whole story.
4: one or two minor contrast or palette imperfections.
3: noticeable low-contrast text or clashing accents on operational fields.
2: substantial legibility problems or an inconsistent palette.
1: colours are broadly default or harsh, or key shop fields are difficult to
read.
0: no readable colour treatment renders on the reviewed surface.
"""

[[criterion]]
id = "visual_spacing_and_layout"
name = "visual_spacing_and_layout"
type = "likert"
points = 5
weight = 1.0
description = """
Assess spacing and layout on the rendered shop desk at desktop width
(identity switcher, a table-heavy repair-order or bay board, and at least
one detail or form surface). Do not score viewport reflow or phone width.
5: even spacing scale, deliberate alignment and margins, and boards, tables,
and forms sitting in a stable arrangement with no overlaps or clipping.
4: minor uneven spacing or alignment.
3: several elements look crowded, drifting, or unevenly padded.
2: frequent collisions, clipping, or inconsistent gutters.
1: layout is broadly unbalanced or broken.
0: no coherent spaced layout renders on the reviewed surface.
"""

[[criterion]]
id = "visual_hierarchy_and_scanability"
name = "visual_hierarchy_and_scanability"
type = "likert"
points = 5
weight = 1.0
description = """
Assess visual hierarchy and scannability on the rendered shop desk at
desktop width.
5: clear visual order - identity and role, navigation, repair-order number,
customer, vehicle, status, money, and bay or hold state each have distinct
prominence, so the current person and the next decision can be found by
scanning.
4: hierarchy is mostly clear with minor ambiguity.
3: several sections compete, or important shop fields are visually buried.
2: identity, headings, and operational content are hard to tell apart.
1: no usable visual hierarchy is present.
0: no scannable hierarchy renders on the reviewed surface.
"""

[[criterion]]
id = "visual_overall_craft"
name = "visual_overall_craft"
type = "likert"
points = 5
weight = 1.0
description = """
Assess overall visual craft across several rendered TorqueBay surfaces
(advisor board, a repair-order or bay view, and at least one other staff or
customer surface), including empty or secondary states you encounter.
5: one coherent shop-floor design language applied consistently - deliberate
components, integrated details, no stray default styling, and a finished
look even in secondary states.
4: one or two minor polish imperfections.
3: noticeable default styling or inconsistent component treatment across
surfaces.
2: much of the interface looks unfinished or inconsistent.
1: visual craft is effectively absent.
0: no crafted interface renders on the reviewed surfaces.
"""
