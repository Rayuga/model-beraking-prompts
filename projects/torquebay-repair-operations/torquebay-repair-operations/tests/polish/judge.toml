[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "responsive_accessible_workspace"
name = "responsive_accessible_workspace"
type = "likert"
points = 5
weight = 1.0
description = """
At about 390 by 844 and on desktop, judge the same checklist at every score: both sizes stay usable without destructive horizontal overflow; the desktop experience has landmarks and headings; and the controls used to switch users, open a repair order, complete the persisted write from the gate, book a bay, assign a technician, and invoice finished work are present with accessible names.
Score 1 when either size is unusable, the persisted write path is broken, or those desk controls are absent. Score 3 when both sizes and the write path work and the desk controls are present, but overflow, landmarks, headings, or accessible names on those controls have noticeable gaps. Score 5 when both sizes stay usable without destructive overflow, landmarks and headings are present, and those controls are present with accessible names.
"""

[[criterion]]
id = "operational_visual_hierarchy"
name = "operational_visual_hierarchy"
type = "likert"
points = 5
weight = 1.0
description = """
Judge whether identity, role, repair-order number, customer, vehicle, status, money, and bay or hold state are readable at a glance on a populated staff board and a detail view, including the record created by the gate write.
Score 1 for an undifferentiated dump or a board that cannot show that new work. Score 3 when the board is readable but those operational fields are uneven, cramped, or poorly ordered. Score 5 when the desk stays scannable under real seed volume and those fields are obvious without hunting.
"""

[[criterion]]
id = "workflow_feedback_and_recovery"
name = "workflow_feedback_and_recovery"
type = "likert"
points = 5
weight = 1.0
description = """
Exercise one allowed write and one refused write. Success should persist after storage is cleared and the page is reloaded. The refusal must be a shop-policy refusal — author sign-off, approval ceiling, overlapping bay, tagged-out bay, uncertified technician, or incompatible part — not a missing-field validation. A refusal should show a visible reason and leave the workspace usable.
Score 1 when actions are silent, client-only, or break the page. Score 3 when the allowed write persists but the only refusal shown is a blank-form or missing-field 400, or a shop-policy refusal has no visible reason. Score 5 when the allowed write still returns after storage is cleared and reload, and a shop-policy refusal shows a visible reason and leaves the workspace usable.
"""
