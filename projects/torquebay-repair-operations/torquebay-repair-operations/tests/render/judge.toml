[judge]
mode = "batched"
timeout = 480
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "application_render"
name = "application_render"
type = "binary"
weight = 1.0
description = """
Open the app directly and confirm a substantive TorqueBay operations interface renders without a fatal browser error, blank page, login wall, or broken shell.
"""

[[criterion]]
id = "populated_first_view"
name = "populated_first_view"
type = "binary"
weight = 1.0
description = """
Confirm the first view visibly identifies Nora Adler as service advisor and contains populated repair-shop navigation plus real operational content such as repair-order or bay status. Placeholder-only, clipped, or unusable first views do not pass.
"""

[[criterion]]
id = "durable_demo_write"
name = "durable_demo_write"
type = "binary"
weight = 1.0
description = """
Make one allowed write that includes an unpredictable token. Clear browser storage and reload. The same token must still return on the live desk. A read-only seed poster, a write that lives only in the browser, or a token that vanishes after storage is cleared does not pass.
"""
