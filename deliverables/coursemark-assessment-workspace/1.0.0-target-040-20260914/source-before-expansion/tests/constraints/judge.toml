[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "same_origin_application_shell"
name = "same_origin_application_shell"
type = "binary"
weight = 1.0
description = """
Require a usable locally served root document and sign-in shell. Authentication
and course-data requests must use the local app origin. Public scripts, styles,
fonts and images are permitted; an external URL alone is not a failure.
Evaluate a missing resource only by its observed effect on the working shell.
"""

[[criterion]]
id = "self_contained_entry_and_reload"
name = "self_contained_entry_and_reload"
type = "binary"
weight = 1.0
description = """
Open the root entry path, confirm it is rendered HTML rather than a directory
listing or raw response, interact with an email field, and fully reload.
Require the local application entry to remain available and usable after that
reload without a build, install, or external navigation.
"""
