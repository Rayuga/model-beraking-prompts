[judge]
mode = "batched"
timeout = 900
isolated = false
temperature = 0
weight = 0.2
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "visual_typography"
name = "Typography"
type = "likert"
points = 5
weight = 1.0
description = """
Assess typography on the required sign-in, Courses, Assessments,
Attempts, Gradebook, Audit and available form/detail surfaces.
5: Readable type sizes/weights distinguish identity, workspace headings, dates, scores and supporting record text.
4: The intended quality is clear, with only one or two minor imperfections.
3: Usable presentation with several noticeable inconsistencies or distractions.
2: Frequent substantial defects obscure important content or break cohesion.
1: Pervasive defects leave little usable visual organization for this axis.
0: No reviewable presentation demonstrates this quality.
Judge only rendered appearance, not behavior, source, exact seed values or
keyboard operation. Do not require the golden solution's pixels or waive a
missing required surface. Ordinary vertical scrolling is allowed.
"""

