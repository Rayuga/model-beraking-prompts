<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridForge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- User selection screen -->
    <div id="user-select-modal" class="modal">
      <div class="modal-content">
        <h1>GridForge</h1>
        <p>Select your user:</p>
        <div id="user-buttons"></div>
      </div>
    </div>

    <!-- Main app -->
    <div id="main-app" style="display: none;">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1 id="workbook-title">Loading...</h1>
          <span id="save-status" class="save-status">Loading...</span>
        </div>
        <div class="header-right">
          <div id="user-indicator" class="user-indicator"></div>
          <button id="btn-save" class="btn" title="Save now (Ctrl+S)">Save</button>
        </div>
      </header>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-group">
          <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)">↶ Undo</button>
          <button id="btn-redo" class="btn" title="Redo (Ctrl+Y)">↷ Redo</button>
        </div>

        <div class="toolbar-group">
          <button id="btn-cut" class="btn" title="Cut (Ctrl+X)">✂ Cut</button>
          <button id="btn-copy" class="btn" title="Copy (Ctrl+C)">⎘ Copy</button>
          <button id="btn-paste" class="btn" title="Paste (Ctrl+V)">Paste</button>
        </div>

        <div class="toolbar-group">
          <button id="btn-fill-down" class="btn" title="Fill Down (Ctrl+D)">Fill ↓</button>
          <button id="btn-fill-right" class="btn" title="Fill Right (Ctrl+R)">Fill →</button>
        </div>

        <div class="toolbar-group">
          <button id="btn-find" class="btn" title="Find & Replace (Ctrl+H)">Find</button>
          <button id="btn-revisions" class="btn" title="Revision History">History</button>
        </div>
      </div>

      <!-- Formula bar and name box -->
      <div class="formula-bar">
        <div class="name-box-container">
          <input type="text" id="name-box" class="name-box" placeholder="Name Box" title="Jump to cell or select range">
        </div>
        <div class="formula-input-container">
          <label for="formula-input">fx</label>
          <input type="text" id="formula-input" class="formula-input" placeholder="Enter formula or value">
          <div id="formula-suggestions" class="formula-suggestions" style="display: none;"></div>
        </div>
      </div>

      <!-- Grid -->
      <div class="grid-container">
        <div id="grid" class="grid">
          <!-- Will be generated by JS -->
        </div>
      </div>

      <!-- Presence panel -->
      <div id="presence-panel" class="presence-panel">
        <div class="presence-header">Active Users</div>
        <div id="presence-list" class="presence-list"></div>
      </div>
    </div>

    <!-- Modals -->
    <div id="find-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Find & Replace</h2>
          <button class="close-btn" id="close-find">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="find-input">Find:</label>
            <input type="text" id="find-input" placeholder="Enter text to find">
          </div>
          <div class="form-group">
            <label for="replace-input">Replace with:</label>
            <input type="text" id="replace-input" placeholder="Enter replacement text">
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="find-match-case"> Match case
            </label>
            <label>
              <input type="checkbox" id="find-whole-cell"> Entire cell
            </label>
          </div>
          <div id="find-results" class="find-results"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-find-all" class="btn">Find All</button>
          <button id="btn-replace-next" class="btn">Replace Next</button>
          <button id="btn-replace-all" class="btn">Replace All</button>
          <button id="btn-close-find" class="btn">Close</button>
        </div>
      </div>
    </div>

    <div id="revisions-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Revision History</h2>
          <button class="close-btn" id="close-revisions">&times;</button>
        </div>
        <div class="modal-body">
          <div id="revisions-list" class="revisions-list"></div>
          <div id="revision-preview" class="revision-preview" style="display: none;">
            <h3>Preview</h3>
            <div id="preview-content"></div>
            <button id="btn-restore-revision" class="btn">Restore This Version</button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-close-revisions" class="btn">Close</button>
        </div>
      </div>
    </div>

    <div id="history-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="history-title">Cell History</h2>
          <button class="close-btn" id="close-history">&times;</button>
        </div>
        <div class="modal-body">
          <div id="history-list" class="history-list"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-close-history" class="btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/client.js"></script>
  <script src="js/formula.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
