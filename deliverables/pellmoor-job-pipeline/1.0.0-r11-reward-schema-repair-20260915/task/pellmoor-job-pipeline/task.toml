schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/pellmoor-job-pipeline"
version = "1.0.0"
description = "Atomic batch offers with reviewed revisions, capacity arbitration, versioned assessments, durable actor-scoped retries and history-derived funnels"
keywords = ["webdev", "full-stack", "typescript", "d3", "esbuild", "express", "sqlite", "recruitment", "state-machine"]

[metadata]
difficulty = "hard"
difficulty_explanation = "The task couples all-or-nothing batch offers and reviewed-revision confirmations with versioned assessments, capacity reservations, competing individual writes and derived funnels. Role-scoped writes must atomically preserve revisions, audit and durable actor-scoped retry receipts across panel changes, reopenings, logout and restart."
category = "Software"
tags = ["full-stack", "recruitment", "state-machine", "sqlite", "authentication", "optimistic-concurrency", "idempotency", "accessibility"]
provenance = "authored 2026-09-01; agency hiring paperwork, contract in a hosting note"
arena_slice = "full-stack-typescript-d3-esbuild-express-sqlite-pipeline"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
