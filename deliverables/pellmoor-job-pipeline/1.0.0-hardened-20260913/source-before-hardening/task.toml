schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/pellmoor-job-pipeline"
version = "1.0.0"
description = "Revision-safe hiring pipeline with role-scoped candidate workflows, panel scoring, durable activity, deterministic funnel analytics, and replay-safe SQLite writes"
keywords = ["webdev", "full-stack", "typescript", "d3", "esbuild", "express", "sqlite", "recruitment", "state-machine"]

[metadata]
difficulty = "hard"
difficulty_explanation = "The task couples a strict hiring stage machine with panel and scoring gates, role enforcement, per-vacancy funnel derivation, append-only activity, bearer sessions, optimistic revisions and replay-safe mutations. A valid action changes several visible and durable views while rejected actions must leave all of them unchanged."
category = "Software"
tags = ["full-stack", "recruitment", "state-machine", "sqlite", "authentication", "optimistic-concurrency", "idempotency", "accessibility"]
provenance = "authored 2026-09-01; agency hiring paperwork, contract in a hosting note"
arena_slice = "full-stack-typescript-d3-esbuild-express-sqlite-pipeline"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
