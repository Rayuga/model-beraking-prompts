<!doctype html>
<meta charset="utf-8">
<title>Pellmoor hiring</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    color-scheme:light dark;
    --bg:#f7f5f1; --ink:#1a1816; --muted:#6f675e; --line:#e0d9cd; --panel:#fff;
    --accent:#264653; --accent-ink:#fff; --bad:#a13d28; --good:#2a6b4f;
    --reached:#cfd9dd; --still:#264653;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 28px rgba(0,0,0,.07);
  }
  :root[data-theme="dark"]{
    --bg:#101316; --ink:#e8edf1; --muted:#94a0ab; --line:#252c34; --panel:#171b20;
    --accent:#5ec8b0; --accent-ink:#0c1013; --bad:#ff8f6f; --good:#5ec8b0;
    --reached:#2a333c; --still:#5ec8b0;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;font-weight:660;letter-spacing:-.01em}
  .spacer{flex:1}
  button,select,input{font:inherit;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;
    transition:border-color .12s,background .12s,transform .07s}
  button{cursor:pointer}
  button:hover{border-color:var(--ink)}
  button:active{transform:translateY(1px)}
  button:focus-visible,select:focus-visible,input:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);font-weight:620}
  .wrap{display:flex;flex-direction:column;gap:0}
  .cols{display:flex;flex-direction:column}
  @media(min-width:900px){.cols{flex-direction:row;align-items:flex-start}}
  nav#roles{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px}
  @media(min-width:900px){nav#roles{flex-direction:column;width:230px;
    border-right:1px solid var(--line);min-height:calc(100vh - 54px)}}
  nav#roles button{display:block;width:100%;text-align:left;background:transparent;
    border-color:transparent;border-radius:10px;padding:10px 12px}
  nav#roles button:hover{background:var(--panel);border-color:var(--line)}
  nav#roles button[aria-current]{background:var(--accent);color:var(--accent-ink)}
  nav#roles button[aria-current]::after{content:'Selected';display:block;font-size:11px;font-weight:700}
  nav#roles b{display:block;font-weight:620}
  nav#roles span{font-size:12.5px;opacity:.75}
  main{flex:1;padding:18px 20px 60px;min-width:0}
  h2{font-size:20px;margin:0;letter-spacing:-.015em}
  .sub{color:var(--muted);font-size:13.5px;margin:2px 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  #funnel svg{display:block;max-width:100%}
  .stage-label{font-size:12.5px;fill:var(--muted);
    text-transform:uppercase;letter-spacing:.05em}
  rect.reached{fill:var(--reached)}
  rect.still{fill:var(--still)}
  text.figure{font-size:12.5px;fill:var(--muted)}
  #board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .col.terminal{background:transparent;border-style:dashed}
  .col h3{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
  .col h3 .n{color:var(--ink);font-weight:660}
  button.cand{display:block;width:100%;text-align:left;margin-bottom:7px;
    border-radius:9px;padding:9px 10px}
  button.cand b{display:block;font-weight:600}
  .meta{font-size:12px;color:var(--muted)}
  .empty,.empty-col{color:var(--muted);font-size:13px;margin:4px 0}
  .empty-col{text-align:center;padding:8px 0}
  .vacancy-heading{display:flex;align-items:start;justify-content:space-between;gap:16px}
  #batch-open{min-height:44px;flex-shrink:0}
  #batch-dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;
    width:min(760px,calc(100% - 32px));max-height:calc(100dvh - 32px);padding:0;overflow:hidden;box-shadow:var(--shadow)}
  #batch-dialog::backdrop{background:rgba(8,16,22,.62)}
  #batch-content{display:flex;flex-direction:column;max-height:calc(100dvh - 34px);padding:24px}
  .batch-head{display:flex;flex-shrink:0;align-items:start;justify-content:space-between;gap:16px}
  .batch-body{min-height:0;overflow:auto;overscroll-behavior:contain;scroll-padding:12px}
  .batch-head .sub{margin:4px 0 0}.batch-head>div{min-width:0}
  #batch-close{min-width:44px;min-height:44px;font-size:22px;line-height:1;flex-shrink:0}
  .batch-intro{max-width:66ch;color:var(--muted);font-size:14px;margin:20px 0}
  .batch-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
  .batch-metrics>div{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  .batch-metrics span{display:block;font-size:12px;color:var(--muted)}
  .batch-metrics small{display:block;font-size:11px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
  .batch-metrics strong{display:block;font-size:28px;font-weight:650;line-height:1.3;margin-top:6px}
  .batch-status{font-size:13px;overflow-wrap:anywhere;margin:16px 0;color:var(--muted)}
  .batch-status.warning{color:var(--bad)}
  .batch-warning{border:1px solid var(--bad);border-radius:10px;padding:12px 16px;color:var(--bad);font-size:13px;margin-bottom:16px}
  .batch-warning ul{margin:6px 0 0;padding-left:20px}
  .batch-list{border-top:1px solid var(--line)}
  .batch-choice{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(100px,180px);align-items:center;
    gap:12px;padding:16px 4px;border-bottom:1px solid var(--line);min-height:70px}
  label.batch-choice{cursor:pointer}.batch-choice:has(:checked){background:var(--bg)}
  .batch-choice input{width:18px;height:18px;min-height:18px;padding:0;accent-color:var(--accent)}
  .batch-choice b,.batch-choice small{display:block;overflow-wrap:anywhere}
  .batch-choice small,.batch-state{color:var(--muted);font-size:12px}.batch-state{text-align:right}
  .batch-number{font-size:12px;color:var(--muted)}
  .batch-actions{display:flex;flex-shrink:0;justify-content:flex-end;gap:10px;
    padding:18px 0 2px;background:var(--panel);margin-top:16px;border-top:1px solid var(--line)}
  .batch-actions button{min-height:44px}
  button:disabled{cursor:default;opacity:.55}
  #panel{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);
    background:var(--panel);border-left:1px solid var(--line);
    box-shadow:var(--shadow);padding:18px;overflow:auto;z-index:5}
  #panel:empty{display:none}
  #panel header{display:flex;align-items:center;justify-content:space-between;gap:16px}
  #panel header>div{min-width:0}#panel h2{overflow-wrap:anywhere}
  #panel h3,#panel h4{margin:20px 0 8px;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted)}
  #close{border:1px solid var(--line);background:transparent;font-size:22px;line-height:1;
    padding:8px;min-width:44px;min-height:44px;flex-shrink:0}
  .moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 22px}
  .moves button{min-height:44px;padding:9px 10px;line-height:1.35;overflow-wrap:anywhere}
  ul.panel,ol.notes{list-style:none;padding:0;margin:0}
  ul.panel li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);
    padding:7px 0}
  ul.panel span{color:var(--muted);font-size:13px}
  ol.notes li{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin-bottom:8px;
    font-size:14px}
  ol.notes b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
  .addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;margin-top:12px}
  .addrow label{display:flex;min-width:0;gap:5px;flex-direction:column;font-size:12px;color:var(--muted)}
  .addrow input,.addrow select{width:100%;min-width:0;min-height:44px}
  .addrow button{min-height:44px}
  .eyebrow{margin:0;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em}
  .history{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
  .history span{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px}
  .history span[aria-current]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .panel-list,.activity{list-style:none;padding:0;margin:0}
  .panel-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
    gap:8px 12px;border-bottom:1px solid var(--line);padding:12px 0}
  .panel-list li:has(.remove-member){grid-template-columns:minmax(0,1fr) auto auto}
  .panel-list li>span{min-width:0;overflow-wrap:anywhere}.remove-member{min-height:44px}
  .panel-list span,.panel-list small{display:block}.panel-list small{color:var(--muted)}
  .activity li{overflow-wrap:anywhere;border-left:3px solid var(--line);padding:5px 0 5px 10px;margin:8px 0;font-size:13px}
  time{display:block;color:var(--muted);font-size:11px}
  #revision{font:700 12px/1 ui-monospace,monospace;color:var(--muted)}
  #progress{min-width:72px;color:var(--muted);font-size:12px}
  body[data-busy="true"]{cursor:progress}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);
    background:var(--panel);border:1px solid var(--bad);border-left:4px solid var(--bad);
    border-radius:10px;padding:10px 15px;box-shadow:var(--shadow);max-width:70ch;
    opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:9}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast[data-tone="good"]{border-color:var(--good);border-left-color:var(--good)}
  #signin{display:grid;place-items:center;min-height:100vh;padding:20px}
  #signin form{width:100%;max-width:360px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
  #signin label{display:block;margin-bottom:14px}
  #signin .lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  #signin input{width:100%}
  #signin button{width:100%;margin-top:6px}
  .hint{font-size:12px;color:var(--muted);margin-top:16px}
  @media(max-width:520px){
    header.top{padding:12px;gap:10px}header.top h1{flex:1}#whoami{order:2;flex-basis:100%}
    header.top .spacer{display:none}#progress:empty{display:none}
    .cols main{padding:14px 12px 48px}
    nav#roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;
      overflow:visible;border-bottom:1px solid var(--line)}
    nav#roles button{min-width:0;width:100%;height:100%;padding:10px;border-color:var(--line);
      background:var(--panel);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
    nav#roles button[aria-current]{background:var(--accent);border-color:var(--accent)}
    nav#roles span{display:block;margin-top:4px;font-size:11.5px;opacity:1}
    nav#roles button[aria-current]::after{margin-top:5px}
    .card{padding:12px}#board{grid-template-columns:minmax(0,1fr)}
    #panel{padding:16px}.addrow{grid-template-columns:minmax(0,1fr)}.figure{font-size:11px}
    .panel-list li:has(.remove-member){grid-template-columns:minmax(0,1fr) auto}
    .panel-list .remove-member{grid-column:1/-1;justify-self:stretch}
    button,input,select{min-height:44px}#close{min-width:44px;min-height:44px}
    .vacancy-heading{display:block}#batch-open{width:100%;margin-bottom:18px}
    #batch-dialog{width:calc(100% - 16px);max-height:calc(100dvh - 16px);border-radius:14px}
    #batch-content{max-height:calc(100dvh - 18px);padding:16px}.batch-metrics{gap:6px}.batch-metrics>div{padding:10px 8px}
    .batch-metrics span{font-size:11px;min-height:34px}.batch-metrics strong{font-size:24px}
    .batch-choice{grid-template-columns:24px minmax(0,1fr);gap:6px 10px}.batch-state{grid-column:2;text-align:left}
    .batch-actions{display:grid;grid-template-columns:minmax(0,1fr)}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<div id="signin" role="main" hidden>
  <form id="loginf">
    <h1>Pellmoor hiring</h1>
    <p class="sub">The pipeline has people's names in it, so it needs a sign-in.</p>
    <label><span class="lab">Email</span>
      <input id="email" type="email" value="hiring@pellmoor.test" autocomplete="username"></label>
    <label><span class="lab">Password</span>
      <input id="password" type="password" autocomplete="current-password"></label>
    <button class="primary">Sign in</button>
    <p class="hint">Demo sign-ins, password <code>password123</code><br>
      hiring@ · panel1@ · panel2@ · coord@pellmoor.test</p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <h1>Pellmoor hiring</h1>
    <span class="sub" id="whoami" style="margin:0"></span>
    <span class="spacer"></span>
    <span id="progress" role="status" aria-live="polite"></span>
    <button id="theme">Theme</button>
    <button id="signout">Sign out</button>
  </header>
  <div class="cols">
    <nav id="roles" aria-label="Vacancies"></nav>
    <main>
      <div class="vacancy-heading"><div><h2 id="role-title"></h2>
      <p class="sub"><span id="role-sub"></span> <span id="revision"></span></p></div>
      <button id="batch-open" class="primary" hidden>Plan batch offers</button></div>
      <form id="addcandidate" class="card addrow" hidden>
        <label><span>Candidate name</span><input id="candidate-name" minlength="2" required></label>
        <button class="primary">Add candidate</button>
      </form>
      <div class="card"><div id="funnel"></div></div>
      <div id="board"></div>
    </main>
  </div>
</div>

<aside id="panel" role="dialog" aria-modal="true" aria-label="Candidate details" aria-live="polite"></aside>
<dialog id="batch-dialog" aria-labelledby="batch-title"><div id="batch-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
