[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 0.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "same_origin_application_shell"
name = "same_origin_application_shell"
type = "binary"
weight = 1.0
description = """
Require the root entry at http://localhost:3000 to open the local Pellmoor
application rather than redirecting to a separately hosted workspace. Public
scripts, styles, fonts, images and other browser requests are allowed; an
off-origin URL alone is not a failure. A failed resource matters only if it
prevents the required local interface from working and has no working fallback.
"""

[[criterion]]
id = "self_contained_entry_and_reload"
name = "self_contained_entry_and_reload"
type = "binary"
weight = 1.0
description = """
Open the root entry path, confirm it is rendered HTML rather than a directory
listing or raw response, interact with the email field, and fully reload.
Require the local application entry to remain visible and usable without a
build, install, or external navigation.
"""
