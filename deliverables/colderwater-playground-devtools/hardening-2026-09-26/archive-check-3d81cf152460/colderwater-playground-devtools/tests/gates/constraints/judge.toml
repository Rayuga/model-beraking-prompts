[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "application_server_reachable"
name = "application_server_reachable"
type = "binary"
weight = 1.0
description = """
Using the browser, open the stated health URL http://localhost:3000/api/health and confirm a successful HTTP response. Return to the main workspace and confirm the application remains reachable and usable without authentication. Do not require a particular response body or JSON property, invent another API route, or change saved snippets. This establishes server reachability only; browser observations of this kind cannot identify SQLite or Express, and durable storage and sandbox behavior are scored in functional.
"""
