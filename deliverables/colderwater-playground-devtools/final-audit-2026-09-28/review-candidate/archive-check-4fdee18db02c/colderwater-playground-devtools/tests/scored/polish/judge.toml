[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "responsive_layout"
name = "responsive_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 viewport, confirm the editor, preview and console can each be reached and used. Stacking, tabs, drawers and intentional pane scrolling are valid. Essential controls must not be permanently clipped or hidden behind another pane; horizontal scrolling within long code or console content is acceptable.
"""

[[criterion]]
id = "labelled_controls_and_focus"
name = "labelled_controls_and_focus"
type = "binary"
weight = 1.0
description = """
At an ordinary desktop viewport, inspect the requested workspace and library controls: title and filename fields, Run, Stop, Auto-run, Clear console, theme, examples, saved-snippet loading, New, Save, Rename, Duplicate, Delete, Import and Export. Each purpose is identified by a visible label or accessible name. Match purposes rather than exact words or a separate button for each action; accessible menus and composite controls are valid. For a recognisable read control, first save your own small harmless snippet through the ordinary UI, noting its title and content. This preparation may use a pointer; an initially empty library is valid. Do not depend on another dimension's generated record or private identity.

Now use only the keyboard for this bounded navigation route: from the focused editor, leave it, reach and operate the example picker, choose a different runnable example and observe its source in the workspace, then reach the saved library and open your own snippet. Confirm its recognisable title and content appear, and return focus to the editor. Normal Tab/Shift+Tab navigation, native control keys, standard editor escape keys such as Escape followed by Tab, and application-specific escape sequences are all valid. Standard or native editor behavior does not need application help text; do not deduct for an absent shortcut hint. Do not prescribe particular bindings, labels or layout. Handle any ordinary unsaved-work warning through the keyboard as well; a normal warning is not a failure and no particular dialog design or wording is required. During this route do not use pointer actions, programmatic focus, DOM clicks or application API calls.

Using actual keyboard events, also reach the controls for every listed purpose when enabled, with visible focus on the controls used; native focus styling is valid. Open a containing menu or drawer by keyboard when needed, and accept native/composite arrow-key navigation rather than demanding that each action be a separate Tab stop. A hidden file input may use a labelled keyboard-reachable trigger. A control legitimately disabled in the observed state need not be a tab stop. Reachability does not require activating every control: do not delete, rename, duplicate, import or export work merely to inspect focus, or open a native file dialog. Keep this a non-destructive read/navigation flow after preparation: do not regrade Run/Save/Clear shortcuts, execution semantics, revision rules or persistence here.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Activate one ordinary supported action such as Run on the current runnable example or Clear console when entries exist. The interface gives visible feedback appropriate to that action, such as run status/duration, new output or a clear empty-console state. Use an available positive case; if the console is initially empty, running a short harmless log is valid setup. Judge acknowledgement and clarity, not exact execution semantics, error line numbers or persistence.
"""

[[criterion]]
id = "workspace_organisation"
name = "workspace_organisation"
type = "binary"
weight = 1.0
description = """
The editor, preview and console are recognisable from their labels or layout. The current filename and the saved-snippets library can be located without guessing at an unlabelled hidden surface. Empty library and console states are valid. Judge whether a user can understand which surface holds editable code, output or saved work; do not prescribe a pane arrangement or regrade theme switching, persistence or execution.
"""
