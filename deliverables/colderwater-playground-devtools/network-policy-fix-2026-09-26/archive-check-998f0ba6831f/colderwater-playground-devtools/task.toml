schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/colderwater-playground-devtools"
description = "TypeScript/React/Vite code playground with isolated JavaScript, HTML and CSS runs, bounded supported execution, user-source error lines and preview rollback, plus a durable SQLite snippet library with revision-safe saves, renames and deletes, independent duplicates, protected drafts, import/export and keyboard workflows."
keywords = ["webdev", "turing", "full-stack", "typescript", "react", "vite", "codemirror", "express", "sqlite", "code-playground", "sandboxed-execution", "devtools-ide", "browser-judge", "rewardkit"]

[metadata]
difficulty = "medium"
difficulty_explanation = """
Participants build the application from six focused notes and /assets/seed_data.json; no starter implementation or saved snippets are supplied. Difficulty is concentrated in supported-source execution and durable library state. Fresh isolated runs must cancel old work, preserve the last completed preview after synchronous or asynchronous failure, report user-source lines, and stop supported literal loops and callbacks within the shared five-second budget. Unsupported dynamic execution is refused; the task does not promise interruption of arbitrary browser-native time bombs.

The saved library preserves stable identities, exact title/filename/source and revisions. A stale editor cannot overwrite or delete newer work, rejected title collisions and invalid filenames are atomic, duplicates remain independent, and deleted identities cannot be recreated by stale updates. Each mutation chain uses dedicated records and meaningful positive controls. Final persistence establishes its own records before one actual restart and verifies both durability and continued revision-aware saving.

There are 32 binary functional criteria with internal weight 49.5, four straightforward binary polish criteria, and six visual criteria using the installed RewardKit 0.1.7 raw 1-5 Likert scale. Independent scores distinguish host-origin isolation, externally requested resources and unsupported execution, four error paths, rename validation from stale renames, in-app from native leave warnings, and export from import. Required validation includes case-sensitive trimmed titles, blank-title refusal, single supported source filenames and imported code staying unexecuted with auto-run off. Each new error or refusal check establishes its own working control. The shared-budget probe delays a runaway callback for four seconds before measuring termination from the original Run; the network probe uses locally fulfilled browser routes, not actual internet availability.

Render and constraints are binary gates. tests/scoring.toml keeps the functional/polish/visual shares at 0.6/0.2/0.2 and the functional floor at 0.05. Functional criteria use one continuous database, exact authored source fixtures and observed request shapes, preserving records written by prior gates. Startup can use an example or saved snippet; an empty library is not required. The frozen functional budget remains 9000 seconds; extra independent controls add real browser work, whose full judge runtime must be measured. These are rubric facts, not measured Oracle or candidate-model scores.
"""
category = "Developer Tools & IDE Clones"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "The downloaded baseline attributes the task to Jordan Ahu for the Code Arena WebDev tracker (row 57, devtools-ide) and records a staged-template conversion on 2026-09-25. The local authoring work on 2026-09-26 adopts canonical seed_data.json, clarifies supported execution and local-server operation, adds revision-conflict invariants and self-contained restart controls. A subsequent rubric repair rewrites the public request, closes stated validation and file/draft/network coverage gaps, and replaces 24 functional criteria with 32 while preserving total weight 49.5. A network-policy correction permits external browser assets for the app while retaining the separate security boundary for authored snippets. The downloaded baseline is preserved separately. No Oracle or target-model pass is claimed by this metadata."
arena_slice = "full-stack-typescript-vite-react-codemirror-express-sqlite-code-playground"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
