[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "application_reachable"
name = "application_reachable"
type = "binary"
weight = 1.0
description = """
Open http://localhost:3000 without signing in. Confirm that an editor, preview area and console render as a usable playground workspace, with real code or an editable starting state and recognisable controls. An empty saved library or console is valid. A blank page, generic error or noninteractive placeholder fails. Judge basic access only: execution correctness, storage, editor features and styling belong to the scored dimensions.
"""
