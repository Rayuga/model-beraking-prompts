schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/colderwater-playground-devtools"
description = "A local JavaScript, HTML and CSS playground with a code editor, live preview, console and saved snippet library."
keywords = ["webdev", "turing", "full-stack", "typescript", "react", "vite", "express", "sqlite", "code-playground", "devtools"]

[metadata]
difficulty = "medium"
difficulty_explanation = "The main challenges are isolating code execution, stopping unfinished runs, restoring previews after errors, and keeping saved snippets consistent when multiple editors change them."
category = "Developer Tools & IDE Clones"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "Adapted from the supplied Colderwater playground task."
arena_slice = "full-stack-typescript-vite-react-codemirror-express-sqlite-code-playground"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
