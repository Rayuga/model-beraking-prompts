[judge]
judge = "claude-code"
mode = "batched"
timeout = 9000
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[[judge.mcp_servers]]
name = "verifier"
transport = "stdio"
command = "/usr/local/bin/python3"
args = ["/tests/tools/restart_mcp.py", "$APP_RESTART_HELPER"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "initial_examples"
name = "initial_examples"
type = "binary"
weight = 0.5
description = """
1. Open a fresh page at the public workspace. It starts with useful source and automatically produced preview content and console feedback, without clicking Run. Either an application example or a previously loaded snippet is valid. A gate may already have saved a record: do not require an empty library, remove existing records or demand that particular record at startup.
2. Choose one of the app's examples and run it if selection alone does not run it. It provides editable source and working output. Then set an ordinary .js filename and replace the code with your own snippet that writes a distinctive paragraph into document.body and logs the same distinctive marker. Run it through the UI. The preview and console reflect your authored result, not the old example.
3. The app is served from the local server. External fonts, scripts, editor components and CDN assets are allowed and must not fail this criterion. Local loopback hostnames used for the isolated runner are also valid. The separate authored-snippet network boundary is checked by its own criterion; do not impose an app-wide network restriction here. Do not inspect submitted scripts/bundles or save during this criterion.
"""

[[criterion]]
id = "language_dispatch"
name = "language_dispatch"
type = "binary"
weight = 2.5
description = """
1. With auto-run off, name the file dispatch.JS and run:
document.body.innerHTML = '<p id="dispatch-mark">js-dispatch-ok</p>';
console.log('js-dispatch-log');
The preview shows js-dispatch-ok and the console shows js-dispatch-log.
2. Change only the filename and source to dispatch.html and the following complete document, then run:
<!doctype html><html><body><h1 id="dispatch-mark">html-dispatch-ok</h1><button id="dispatch-button">Try handler</button><input id="dispatch-input" aria-label="Handler input"><script>window.oldGlobal='do-not-carry'; console.log('html-once-marker'); document.getElementById('dispatch-button').addEventListener('click', () => console.log('dispatch-handler-marker')); document.getElementById('dispatch-input').addEventListener('keydown', () => console.log('dispatch-keyboard-marker')); document.getElementById('dispatch-input').addEventListener('input', () => console.log('dispatch-input-marker'));</script></body></html>
The new HTML replaces the old JS document. Wait for its successful completion, then leave that completed preview untouched for at least six seconds, beyond the initial run's five-second budget. Click its Try handler button and confirm dispatch-handler-marker appears, proving a deliberate later interaction with the current successful preview still works. After it completes, focus Handler input, leave it focused and untouched for another six seconds, then type one ordinary character without clicking again. Confirm both dispatch-keyboard-marker and dispatch-input-marker appear. Do not rerun the source between these interactions. Note the current counts of html-once-marker and all three handler-marker console entries.
3. Change to dispatch.CSS with source:
#dispatch-mark { color: rgb(255, 0, 0); }
Run it. The last successful HTML text remains and its heading is red, while html-once-marker has not been logged again. Click the retained Try handler button and type one ordinary character into the retained Handler input: no new dispatch-handler-marker, dispatch-keyboard-marker or dispatch-input-marker entry appears. CSS must neither rerun the old script nor preserve its installed event handlers. The handlers only log; no particular input value or other post-interaction DOM state is required for the CSS copy.
4. Change to dispatch.js and run:
document.body.innerHTML = '<p id="fresh-js">fresh-' + typeof window.oldGlobal + '</p>';
console.log('fresh-js-log');
The new document says fresh-undefined and contains no old heading. Never select a separate language control during these steps; the existence of an optional indicator/control is not itself a failure.
"""

[[criterion]]
id = "fresh_cancel"
name = "fresh_cancel"
type = "binary"
weight = 2.5
description = """
1. Turn auto-run off. Run a short successful .js snippet producing a stable paragraph and console marker, establishing a last-good preview.
2. Run:
window.__cancelLeak = 'A';
document.body.innerHTML = '<p id="run-A">candidate-A</p>';
console.log('cancel-A-started');
setTimeout(() => console.log('cancel-A-delayed'), 4000);
Once cancel-A-started appears, replace and run the following before that timer fires:
document.body.innerHTML = '<p id="run-B">run-B-' + typeof window.__cancelLeak + '</p>';
console.log('cancel-B-started');
Use a single browser automation action for the time-sensitive editor replacement and Run activation if needed. Confirm A was still active when B started; if setup missed the four-second window, redo this setup once rather than call an already-finished run a cancellation.
3. B's preview says run-B-undefined and cancel-B-started appears. Wait until six seconds after A started: cancel-A-delayed must never appear, and A cannot replace B's DOM or report itself as the current success. A separate notification that A was superseded is optional; prove the actual cancellation from these observations.
4. Start a separate timer run that logs stop-started, changes the preview to a candidate and schedules stop-delayed after four seconds. Use the actual Stop control promptly while it is active. A visible stopped/cancelled reason appears, B's last-good preview is restored, and stop-delayed never appears after waiting past its scheduled time. A subsequent short ordinary run still works. Do not mistake hidden old output for terminated work.
"""

[[criterion]]
id = "cw_preview_origin_isolation"
name = "cw_preview_origin_isolation"
type = "binary"
weight = 1.25
description = """
1. Run a legitimate .js snippet that writes isolation-control into its own document and logs isolation-control-log. Confirm both outputs as this criterion's working control.
2. Record the playground page's own title and its localStorage value for the otherwise-unused key cw-isolation-probe. Run:
let docRead='not-blocked', docWrite='not-blocked', storageRead='not-blocked', storageWrite='not-blocked';
try { const value=parent.document.title; } catch (error) { docRead='blocked'; }
try { parent.document.title='cw-forbidden-title'; } catch (error) { docWrite='blocked'; }
try { const value=parent.localStorage.getItem('cw-isolation-probe'); } catch (error) { storageRead='blocked'; }
try { parent.localStorage.setItem('cw-isolation-probe','changed'); } catch (error) { storageWrite='blocked'; }
document.body.innerHTML='<p>isolation-'+docRead+'-'+docWrite+'-'+storageRead+'-'+storageWrite+'</p>';
console.log('isolation-results',docRead,docWrite,storageRead,storageWrite);
All four results must be blocked. Fresh in-page reads of the playground's own title and storage show exactly their earlier values, and the app remains usable.
3. Run another ordinary own-document DOM update and log. It succeeds, proving the forbidden parent access did not break legitimate use. Unsupported execution has its own criterion. Do not add other sandbox escapes or native-blocking probes.
"""

[[criterion]]
id = "cw_runtime_files_not_publicly_exposed"
name = "cw_runtime_files_not_publicly_exposed"
type = "binary"
weight = 0.5
description = """
1. Establish this criterion's own working control: through the UI, run ordinary .js source that renders confidentiality-control-preview and logs confidentiality-control-log. Confirm both outputs. Also make a successful browser HTTP read of the workspace at its normal public URL. This check must not pass merely because the server or all HTTP reads are broken.
2. From the browser, make a separate GET starting at each of exactly /app.db, /server.js and /package.json on the application's local origin. These are bounded exposure probes derived from the stated runtime filenames, not required endpoints. Follow only observed same-origin Location redirects, at most three hops per starting path; stop before repeating a visited URL. Do not follow redirects off the local app origin. A completed redirect, including an unfollowed destination or a stopped bounded chain, is not itself private-file exposure. Record that destination as uninspected rather than asserting that it is safe. Do not add traversal, encoded-path variants, directory discovery, secret filenames, authenticated routes or source-map searches. A normal access denial or an intended public fallback is valid.
3. Classify only a bounded response prefix, up to 64 KiB per request, inside browser automation. Cancel the response reader at that limit and do not execute response text. Look for actual exposed private content, not the status code, MIME type, filename or a single echoed keyword:
- A database exposure requires the exact SQLite header in the first 16 bytes: SQLite format 3 followed by a zero byte. Do not enumerate tables, records or values.
- Raw server-source exposure requires both server-side import/require evidence and executable server initialization/listening or database-opening evidence. Ordinary browser JavaScript named server.js is valid. HTML fallback pages, source-looking words inside comments or string literals, and a lone import/filename are not sufficient. Classify the returned file type only; do not analyze its application logic or use it to predict any other criterion.
- A runtime package-manifest exposure requires a parsed non-array JSON object with BOTH a server-start command and server-only dependency declarations, such as Express or better-sqlite3. Harmless JSON metadata, a frontend package manifest, a scripts key alone or name/version alone is not evidence of a private runtime manifest.
4. Each starting path must be attempted and its observed outcome recorded. HTTP 200 with an HTML app shell, an error page or a benign public payload can be correct; a non-200 response that actually delivers recognizable private content is still exposure. Reaching the 64 KiB limit completes this bounded inspection: an unrecognized or truncated public response must not fail merely because its full type cannot be established. With no positive private-file evidence in an observed prefix, report no recognizable private content in that prefix, not that the entire response or server is proved safe. A browser fetch may expose a completed redirect as opaqueredirect: use browser network-response metadata to distinguish it from a transport failure and to follow only the permitted local chain. If a completed redirect's destination cannot be observed or followed within these limits, record the uninspected destination; that bounded coverage limit is not a failed confidentiality requirement. An actual transport failure or missing working control is incomplete evidence and cannot establish a pass. Do not turn a status/MIME guess into a verdict.
5. Run another ordinary own-document DOM update and console marker through the UI and confirm the workspace still works. Pass requires the working controls, all three completed bounded probes (a recorded completed redirect counts) and no recognizable private-file exposure in observed response prefixes. Do not fail solely for a redirect, an uninspected destination, a bounded chain limit or response size. Return only the original probe path, statuses, hop counts, byte-count/truncation metadata, coverage limits and classification or boolean results; do not print redirect destinations or query values. Do not print, quote, persist or download returned private content, or analyze application logic in any returned source. Inspect response bytes only for the narrowly allowed file-type classifications; never extract database records or secrets. The functional prompt's narrow HTTP-response classification exception applies only here. This is representative confidentiality coverage, not a proof against every possible file-serving route or a license to inspect implementation files.
"""

[[criterion]]
id = "cw_preview_network_requests_blocked"
name = "cw_preview_network_requests_blocked"
type = "binary"
weight = 0.5
description = """
1. Establish a deterministic browser-tool control, without contacting the internet. Choose a fresh nonce and two HTTPS URLs under https://cw-qc-network.invalid/: one text resource and one tiny valid SVG image. In the current browser context, install a route handler for only those probe URLs. Count every handler delivery and fulfill it locally with HTTP 200, Access-Control-Allow-Origin: *, Cache-Control: no-store and the appropriate content type. The text body contains the nonce; the SVG has a known nonzero size. Use a fresh unprotected about:blank page in that same context to fetch the text and load the image. Both must succeed with the expected text/dimensions and handler deliveries. Close that control page and record the resulting delivery count. A failed control cannot prove the playground blocks anything.
2. With auto-run off, use the playground UI to run a legitimate .js own-document update and console marker, proving ordinary execution works and establishing a last-good preview. Then run an authored snippet that attempts fetch of the EXACT text URL from leg 1, with a success log and a catch handler reporting refusal. Observe the actual outcome and the route-handler count. The preview cannot receive the external text and the handler count must not increase.
3. In a SEPARATE authored run, attempt to load an Image from the EXACT SVG URL, with onload logging success/dimensions and onerror reporting refusal; append it to the preview document. This independent run is required even if the fetch attempt was rejected before any source executed. The external image cannot load and the handler count must still not increase. Combining both operations in one source and skipping the second after a synchronous refusal does not establish both boundaries.
4. For each run, accept either an explicit unsupported/network refusal that retains the last-good preview or a caught blocked operation with clear error/refusal feedback while legitimate own-document code completes normally. Caught errors need not roll back the preview. No-delivery evidence without a visible refusal/blocked result is insufficient, as is a CORS or DNS error after the route handler delivered a resource. Do not require particular CSP text, a header policy or matching origins for the local runner.
5. A final ordinary own-document DOM update and console marker work, with no additional probe deliveries. Remove the exact browser route handler afterward, including after a failure. This checks the stated external-resource boundary through representative fetch and image requests; do not add an unbounded network-mechanism or escape catalogue, and do not inspect submitted implementation code.
"""

[[criterion]]
id = "cw_unsupported_execution_refusal"
name = "cw_unsupported_execution_refusal"
type = "binary"
weight = 1.75
description = """
1. With auto-run off, run this valid complete HTML source as scope-control.html:
<!doctype html><html><body><p>scope-control: eval Function WebAssembly Worker import</p><script>
// eval Function WebAssembly Worker import are ordinary comment words
console.log('scope-control-log', 'eval Function WebAssembly Worker import');
</script></body></html>
The paragraph and console message appear. Thus strings, comments and HTML text merely mentioning these words are accepted, and this successful render establishes this criterion's own last-good preview.
2. As separate .js runs, try each of these five bounded sources:
eval('1 + 1');
new Function('return 2')();
new WebAssembly.Module(new Uint8Array([0,97,115,109,1,0,0,0]));
new Worker('data:text/javascript,postMessage(1)');
import('data:text/javascript,export const answer = 1');
Each source is a separate probe, not five lines in one run. For every family, the app gives a clear unsupported/refused execution message, does not claim successful execution and preserves the scope-control last-good preview. The Worker and import payloads are self-contained data URLs, not external dependencies; no real remote request or generated infinite loop is needed.
3. Run a new ordinary .js DOM update and console marker to prove recovery still works. Do not test aliases, constructor bypasses, arbitrary native blocking or other unsupported-code attack catalogues. The bar is explicit refusal of the five named families without blocking legitimate text.
"""

[[criterion]]
id = "cw_execution_budget_termination"
name = "cw_execution_budget_termination"
type = "binary"
weight = 3.5
description = """
1. Run a short valid .js snippet producing timeout-control in the preview and console. Then run:
console.log('before-braced-hang');
while (true) {}
2. The run is stopped for its five-second budget with a visible time-limit reason. before-braced-hang is preserved in the console, even if it arrives together with the timeout. The preview restores timeout-control. While the run is active, the surrounding page remains responsive to a simple harmless control such as the theme toggle.
3. Run this distinct unbraced loop:
console.log('before-unbraced-hang');
while (true);
It is also stopped for the time limit, with its initial log retained and the last-good preview preserved.
4. A normal recovery snippet renders and logs timeout-recovered afterward.
Allow normal scheduling overhead, but either literal loop continuing beyond about eight seconds, freezing the playground UI, hiding the run without a stop reason, or preventing the recovery run fails. These are supported literal loops; do not substitute eval, native-library time bombs, WebAssembly or unsupported generated code.
"""

[[criterion]]
id = "cw_js_error_line_and_preview_restore"
name = "cw_js_error_line_and_preview_restore"
type = "binary"
weight = 1.0
description = """
1. With auto-run off, establish this criterion's own successful .js run that renders js-good-preview and logs js-good-log. Confirm the actual outputs.
2. Enter exactly these four lines as bad.js, with no added leading blank line:
document.body.innerHTML='<p>failed-partial-dom</p>';
const marker = 1;
const items = [1, 2, 3];
items.forEeach((n) => n);
Run it. The console identifies the not-a-function error involving forEeach at user-source line 4. The preview returns to js-good-preview, not failed-partial-dom.
3. A new valid .js run renders and logs js-error-recovered. Judge the exact entered source lines, not injected wrapper offsets. Logging the error while committing the failed candidate, clearing the prior good render or failing recovery does not pass.
"""

[[criterion]]
id = "cw_html_error_document_line_and_preview_restore"
name = "cw_html_error_document_line_and_preview_restore"
type = "binary"
weight = 1.0
description = """
1. With auto-run off, establish this criterion's own successful run that renders html-good-preview and logs html-good-log. Confirm the actual outputs; do not depend on the previous error criterion.
2. Enter exactly this nine-line bad.html document, without a leading blank line:
<!doctype html>
<html>
<body>
<h1>Failed HTML candidate</h1>
<script>
undefinedFunctionCall();
</script>
</body>
</html>
Run it. The console identifies undefinedFunctionCall and line 6 of the entered complete HTML document. The preview restores html-good-preview, not Failed HTML candidate. Counting from the injected script wrapper or the start of the script tag is incorrect.
3. A new valid run renders and logs html-error-recovered. The error, exact user-document line, preserved preview and recovery all need direct evidence.
"""

[[criterion]]
id = "cw_timer_error_line_and_preview_restore"
name = "cw_timer_error_line_and_preview_restore"
type = "binary"
weight = 1.0
description = """
1. With auto-run off, establish a successful .js run that renders timer-good-preview and logs timer-good-log. This is this criterion's own positive control and last-good render.
2. Enter exactly these two lines as delayed-error.js, with no leading blank line:
document.body.innerHTML='<p>async-failed-candidate</p>';
setTimeout(() => { throw new Error('async-error-marker'); }, 50);
Run and wait for the callback. The console names async-error-marker and user-source line 2; the preview restores timer-good-preview rather than retaining async-failed-candidate.
3. A new valid .js run renders and logs timer-error-recovered. The asynchronous error must not commit a half-failed preview or prevent recovery.
"""

[[criterion]]
id = "cw_promise_rejection_line_and_preview_restore"
name = "cw_promise_rejection_line_and_preview_restore"
type = "binary"
weight = 1.0
description = """
1. With auto-run off, establish a successful .js run that renders promise-good-preview and logs promise-good-log. This is this criterion's own positive control and last-good render.
2. Enter exactly these two lines as rejected-promise.js, with no leading blank line:
document.body.innerHTML='<p>promise-failed-candidate</p>';
Promise.reject(new Error('promise-error-marker'));
Run and wait. The console reports the unhandled rejection with promise-error-marker and user-source line 2. The preview restores promise-good-preview rather than retaining promise-failed-candidate.
3. A new valid .js run renders and logs promise-error-recovered. The rejection must not be silently reported as success, clear the last-good render or prevent recovery.
"""

[[criterion]]
id = "console_levels"
name = "console_levels"
type = "binary"
weight = 1.0
description = """
Run the following valid .js source:
console.log('level-log');
console.warn('level-warn');
console.error('level-error');
console.info('level-info');
All four entries appear in this relative order, with their exact string values and recognizably different level labels or other unambiguous level indicators. No particular colour palette is required. An explicit console.error call is a logged message, not an uncaught execution failure.
"""

[[criterion]]
id = "console_objects"
name = "console_objects"
type = "binary"
weight = 1.5
description = """
Run:
console.log({ tag: 'object-check', nested: { deep: 'nested-value' } });
console.log([11, 22, 33]);
Inspect/expand the resulting entries. The object exposes tag and nested, and expanding nested reveals deep with nested-value. The array exposes the three individual elements 11, 22 and 33. Neither may be an opaque [object Object] or an uninspectable summary. Use the app's own expand controls rather than reading the snippet's source as evidence.
"""

[[criterion]]
id = "console_controls"
name = "console_controls"
type = "binary"
weight = 1.5
description = """
1. Run a .js loop that logs row-0 through row-39 in order. Confirm all forty entries and a measured run duration, not a blank or placeholder.
2. Scroll the console up away from the bottom and record its visible position. Run console.log('after-scroll-up');. Earlier rows remain, the new row is appended, and the view does not jump to the bottom.
3. Scroll to the bottom. Run console.log('after-scroll-down');. The new row comes into view automatically.
4. Use Clear console. Prior log rows are gone. An empty-state hint is allowed. Do not demand that run durations or unrelated status labels elsewhere disappear.
"""

[[criterion]]
id = "auto_run"
name = "auto_run"
type = "binary"
weight = 2.0
description = """
1. Turn auto-run on, replace .js source with a DOM marker auto-fired and matching console log, then stop typing without clicking Run. It runs after a brief typing pause and within about two seconds. Measure the observed delay from the last edit to this automatic execution; do not assume a fixed debounce interval.
2. Establish that later edits restart the wait. Make several real editor edits to valid sources with distinct DOM/log markers, spaced comfortably closer together than the observed delay. Continue editing beyond the time when the first edit alone would have run. Record the actual edit timings. No intermediate version executes while these edits continue; after the final edit and a typing pause, only that final version runs within about two seconds. Batch the time-sensitive editing sequence in one browser action if needed. If automation missed the intended within-delay setup, repeat it once; a run after an actual idle gap is not a debounce-reset failure.
3. Turn auto-run off. Replace source with a distinct auto-off marker and log; wait two seconds. Neither marker nor log replaces the prior result automatically. Click Run and confirm this new code now executes.
4. Turn auto-run on again. In one time-sensitive browser action, make a further edit scheduling a distinct auto-queued marker and immediately turn auto-run off before its debounce expires. Wait two seconds: the queued edit must not run. If the setup visibly allowed its debounce to expire before switching off, repeat the setup once with the actions batched; do not count an already-executed run as a cancellation failure.
5. Manual Run executes that same queued edit successfully. Leave auto-run off. Do not require a particular debounce millisecond value or runs on every keystroke.
"""

[[criterion]]
id = "pane_resize"
name = "pane_resize"
type = "binary"
weight = 0.5
description = """
At a desktop viewport, note the editor, preview and console proportions. Move each relevant divider enough to visibly change both the editor/preview allocation and preview/console allocation, using dragging or the app's equivalent divider control. All three panes stay visible and usable. Perform a normal reload, accepting an unsaved-work warning if your own earlier edits require it, and confirm the changed sizes are restored. Do not prescribe vertical versus horizontal arrangements or exact pixel values.
"""

[[criterion]]
id = "editor_basics"
name = "editor_basics"
type = "binary"
weight = 1.0
description = """
1. Inspect a populated editor and its line-number gutter. It uses a monospaced face and shows real line numbers.
2. Enter representative JavaScript, complete HTML and CSS source in turn with the corresponding filenames. Keywords/values, tags or properties are visibly syntax coloured in each language, rather than every token being one flat colour. The exact palette is free.
3. In .js source enter a complete matching pair, for example const data = { value: 1 };. Place the cursor immediately beside either brace. The matching pair is visibly identified. An unmatched opening brace is not a valid setup for this test.
Do not grade indentation width, editor package, DOM implementation or a specific highlight colour.
"""

[[criterion]]
id = "editor_indent"
name = "editor_indent"
type = "binary"
weight = 1.0
description = """
Enter three lines, select all three, and press Tab:
const alpha = 1;
const beta = 2;
const gamma = 3;
Every selected line gains the same indentation and all source remains intact; the selection still covers the three lines. Press Shift+Tab with that selection: the added indentation is removed and the exact original three lines return. Any consistent indentation width or tab representation is valid.
"""

[[criterion]]
id = "save_load"
name = "save_load"
type = "binary"
weight = 1.5
description = """
1. Start a new draft and save title QC Save Alpha, filename qc-alpha.js, source console.log('alpha-body');. Record the successful UI save request and the saved identity.
2. Start another new draft and save title QC Save Beta, filename qc-beta.html, source <!doctype html><html><body><p>beta-body</p></body></html>.
3. The library contains both distinct entries. Load Alpha and Beta in turn and inspect the title, filename and exact source. Each matches its own saved data; one never borrows the other's fields.
4. Reload the browser and load both again. Their identities and exact fields survive. This is a real durable save/load check, not evidence from an unsaved editor buffer.
"""

[[criterion]]
id = "persistent_snippets"
name = "persistent_snippets"
type = "binary"
weight = 3.0
description = """
1. Create a dedicated saved snippet QC Concurrent Save, filename qc-concurrent.js, source console.log('base-version');. Capture its actual saved identity and revision from the browser's reads and successful save request. Preserve two independent editor snapshots A and B of that same revision; two tabs/contexts or a captured old request are equally valid.
2. Save A with title QC Concurrent Save Updated, filename qc-concurrent.html, source <!doctype html><html><body>first-editor-won</body></html>. Fresh lookup confirms all three changed fields and an advanced revision.
3. Attempt B's stale save to the same identity with its old revision and otherwise valid changed source console.log('stale-overwrite');. Use the actual observed request shape from the UI. It must refuse with useful conflict feedback. A fresh read shows A's title, filename, source and revision exactly unchanged.
4. Reload the latest saved record, explicitly reapply an edit to source <!doctype html><html><body>reapplied-after-reload</body></html>, and save using the current revision. This succeeds and survives a browser reload. The stale rejection must not be permanent inability to save, and it must not destroy the unsaved draft before the user chooses recovery.
"""

[[criterion]]
id = "cw_title_change_uniqueness"
name = "cw_title_change_uniqueness"
type = "binary"
weight = 1.5
description = """
1. Save two dedicated snippets: QC Rename Source (qc-rename-a.js, console.log('rename-source');) and QC Rename Sibling (qc-rename-b.js, console.log('rename-sibling');).
2. Rename Source to QC Rename Source Renamed using the normal UI. Fresh reload/read confirms only that record's title changed, with its filename/source intact and Sibling untouched. Record the real successful write format.
3. With the renamed record's CURRENT revision, attempt to rename it to the already-used title QC Rename Sibling. A clear refusal must appear. If the UI blocks sending it, also submit this same collision directly in-page using the observed write format and current revision. The server must refuse; both complete records and their revisions remain unchanged.
4. Also attempt the collision with surrounding spaces around the sibling title. Trimming cannot create two records with the same title. Confirm the same no-mutation result.
5. Using the current revision and otherwise valid data, separately try an empty title and a whitespace-only title. Each is refused without changing either record or its revision. Do not impose a title length limit that the task did not specify.
6. Start a separate new draft and save a third record titled qc rename sibling, with its own supported filename and source. It must coexist with QC Rename Sibling under a different identity: titles that differ in case are allowed. Confirm loading each retrieves its own exact fields, not the other's record.
7. A different unused title can still be saved to the original source afterward through the UI. Use QC Rename Recovered, and confirm both sibling records remain untouched. Rejection merely caused by a stale revision, guessed route or invalid unrelated field cannot establish title validation. Stale renaming is scored separately.
"""

[[criterion]]
id = "cw_stale_rename_preserves_newer_record"
name = "cw_stale_rename_preserves_newer_record"
type = "binary"
weight = 1.5
description = """
1. Create a dedicated saved snippet QC Stale Rename Base, filename qc-stale-rename.js, source console.log('stale-rename-original');. Record its identity, exact fields and current revision, preserving an independent editor snapshot or captured actual request at that revision.
2. Rename it normally through the UI to QC Stale Rename Current. Capture the real successful rename/write method, path, body and revision mechanism. Fresh lookup confirms the new title and advanced revision, with the filename and source unchanged. This is the positive control for the actual rename operation.
3. Attempt a rename of that same identity from the old snapshot/revision to a different unused valid title QC Stale Rename Rejected. Use the observed operation and otherwise valid data. It is refused with useful conflict feedback; a fresh read still has QC Stale Rename Current, the original filename/source and exactly the newer revision. This cannot be passed by a name-collision, unrelated validation error or missing route.
4. Keep any actual unsaved stale-editor draft until the user chooses recovery. Reload the latest record and rename it through the UI to QC Stale Rename Recovered using its current revision. Fresh lookup confirms that title, intact filename/source and another advanced revision. The stale refusal must not permanently prevent valid renaming. Use this criterion's own record and do not borrow the title-validation criterion's outcome.
"""

[[criterion]]
id = "cw_independent_snippet_copy"
name = "cw_independent_snippet_copy"
type = "binary"
weight = 2.5
description = """
1. Save QC Duplicate Original, filename qc-dup.js, source console.log('original-copy-source');. Duplicate it to QC Duplicate Copy through the UI.
2. Before editing, both records coexist with different stable identities, the same filename and exact source. Edit and save only Copy to console.log('copy-edited-source');. Reload and confirm Original still contains its original source while Copy contains the edit.
3. Using the observed duplicate/create request shape, attempt to create another record titled QC Duplicate Copy, while retaining otherwise valid fields and any required current source revision. It must refuse rather than overwrite Copy or create another same-titled record. Fresh reads show the two existing identities, fields and revisions unchanged.
4. Successfully create another duplicate under the new unused title QC Duplicate Extra. This proves the refusal was title collision rather than a broken duplicate action. Do not require a particular automatic suffix or title-dialog layout.
"""

[[criterion]]
id = "delete_confirm"
name = "delete_confirm"
type = "binary"
weight = 3.0
description = """
1. Save QC Delete Target (qc-delete.js, console.log('delete-original');), QC Delete Sibling (qc-sibling.js, console.log('keep-sibling');) and QC Delete Control (qc-control.js, console.log('valid-delete-control');). Record the current list and Target's identity/revision.
2. Start deleting Target, then cancel its confirmation. Reload and verify all three remain with unchanged fields. Delete Control through the normal confirmation and record that actual successful delete request; only Control disappears.
3. Preserve Target's old revision, then load Target and save new source console.log('newer-work-to-keep'); with its current revision. Fresh read confirms the newer content and revision.
4. Replay the real delete operation against Target using its old revision. The server must refuse and retain the newer Target and unchanged Sibling. The UI/response explains the conflict; merely hiding a delete button is not evidence.
5. Reload the latest Target and confirm its deletion normally using that current revision. Only Target disappears, Sibling remains exact, and a browser reload preserves this result.
6. Attempt to save the previously loaded Target back to its deleted identity using the actual update format. It must refuse instead of recreating/upserting the deleted record. The library remains the prior list minus Control and Target. Other criteria's unrelated snippets must remain untouched.
"""

[[criterion]]
id = "cw_dirty_workspace_transition_warnings"
name = "cw_dirty_workspace_transition_warnings"
type = "binary"
weight = 1.25
description = """
1. With auto-run off, save this criterion's own QC Dirty Base (qc-dirty.js, console.log('dirty-original');) and QC Dirty Destination (qc-destination.js, console.log('dirty-destination');). Load Base, then change its title, filename and source to distinctive unsaved values. The workspace identifies the loaded record and visibly marks the draft dirty. Record all three exact edited fields.
2. Test each of four replacement actions separately: load QC Dirty Destination; choose an app example; start a new draft; import a valid source file cw-dirty-import.js containing console.log('dirty-import-destination');. Before each action, independently reload Base and re-establish the recorded unsaved edits, deliberately handling any cleanup warning. Do not rely on dirty state left by the previous action.
3. Each action warns before replacing the draft. Cancel that action and confirm the title, filename and source remain exactly as recorded. Repeat it and accept: the chosen saved record, example, new draft or imported file actually becomes the workspace. A new draft is independent of the old saved identity; no particular default title, filename or template is required. For import, supply the file through the actual file input and compare its filename and exact source after accepting.
4. Reload Base from the library: its saved original title, filename and source were never changed by these discarded edits. From that clean record, change only its title to QC Dirty Title Only, try a replacement and cancel; the dirty indication and warning apply, and that exact title remains. Restore the clean saved Base, then separately change only its filename to qc-dirty-filename-only.js and repeat the cancelled replacement. That filename is retained too. Judge in-app protection here; native browser unload warnings and imported execution are separate criteria.
"""

[[criterion]]
id = "cw_native_dirty_leave_warning"
name = "cw_native_dirty_leave_warning"
type = "binary"
weight = 0.75
description = """
1. Save a dedicated QC Native Leave snippet with filename qc-native-leave.js and source console.log('native-leave-original');. With no unsaved change, perform a normal reload and confirm the workspace remains usable without a dirty-work leave warning. Do not depend on another criterion's draft.
2. Load that saved snippet, turn auto-run off and make a real keyboard edit in its source. Record the exact dirty title, filename and source. Request a normal browser reload after that user interaction.
3. The browser's native leave-page warning appears. Dismiss it to remain on the page; the exact unsaved fields are still present and dirty. A custom application dialog alone is insufficient, and browser tools must not silently auto-accept or suppress the native dialog.
4. Request reload again and accept the native warning. The actual page reloads and remains usable. Load QC Native Leave and confirm its original saved source is unchanged. Do not require exact browser-dialog wording or restoration of a discarded unsaved draft after acceptance.
"""

[[criterion]]
id = "cw_exact_source_file_export"
name = "cw_exact_source_file_export"
type = "binary"
weight = 0.5
description = """
With auto-run off, start an independent draft, put filename export-me.js and exact source console.log('export-me-body'); in the editor, then export through the app's own control. Inspect the resulting browser download: its actual filename is export-me.js and its exact text is console.log('export-me-body');. A toast or a filename label without a download is insufficient. Do not require saving to the library or performing an import to earn export credit.
"""

[[criterion]]
id = "cw_supported_source_file_import"
name = "cw_supported_source_file_import"
type = "binary"
weight = 2.0
description = """
1. Turn auto-run off. Establish a successful ordinary .js run that renders import-good-preview and logs import-good-log, then save it as this criterion's own QC Import Preview Control so the workspace is clean. Note the last-good output and console entries.
2. Import a file named import-me.JS with exactly these two lines:
document.body.innerHTML='<p>import-executed-marker</p>';
console.log('import-executed-log');
Use the app's real file input; an in-memory browser-upload file is valid. Its filename and exact editable source appear in a draft. Wait two seconds with auto-run still off: the prior preview remains and neither imported marker nor log has executed. Click ordinary Run and now confirm both imported outputs. Do not infer execution merely from the text in the editor.
3. Save that imported draft as QC Imported File and reload it successfully. Attempt to import notes.txt containing unrelated text. A useful refusal leaves the current title, filename and source exactly unchanged.
4. Record QC Imported File's actual successful save/update operation. With its CURRENT revision and otherwise valid fields, separately attempt unsupported.txt and nested/demo.js as its filename through an in-page request in the observed shape. The first has an unsupported extension; the second is a path rather than a single filename. Each server refusal leaves title, filename, source and revision unchanged on a fresh read. UI filtering alone or an unrelated stale-revision error cannot satisfy these cases. Do not invent length or platform-specific reserved-name restrictions.
5. Keep supported filename import-me.JS, change the source to console.log('import-edited-body'); and save normally. Reload and confirm the edit persisted. This proves refusal did not break valid saving and that supported extensions are case-insensitive. Dirty-import warnings and export downloads are scored separately.
"""

[[criterion]]
id = "cw_theme_switch_legibility"
name = "cw_theme_switch_legibility"
type = "binary"
weight = 0.5
description = """
With auto-run off, establish this criterion's own normal .js run that renders theme-control-preview and logs theme-control-log. Record its current title, filename, exact editor source and resulting preview/console output. Record the starting theme, which may be light or dark. Use the theme control to switch to the other appearance, then back. Both changes must actually affect the workspace chrome, editor and console, rather than only changing the toggle label. The title, filename, source and existing preview/console output remain intact through both switches. Judge switching and preservation of the working state here; visual criteria own contrast, palette and aesthetic readability. Do not require a particular initial theme, recolouring of the authored preview document, or theme persistence after reload.
"""

[[criterion]]
id = "cw_keyboard_shortcut_actions"
name = "cw_keyboard_shortcut_actions"
type = "binary"
weight = 1.0
description = """
1. Find the app's visible shortcut documentation for Run, Save and Clear console. Use its documented choices, not assumed key combinations. Start a new draft before entering this criterion's code.
2. With auto-run off, enter a .js snippet producing keyboard-marker in the preview and keyboard-log in the console. Trigger Run only through its keyboard shortcut and confirm both outputs.
3. Keep that same draft and source, set title QC Keyboard Save and filename qc-keyboard.js, then trigger Save only through its documented shortcut. The library contains that exact saved title/filename/source.
4. Trigger Clear console through its shortcut; previous rows disappear. Do not click the equivalent action buttons as a substitute for the tested shortcuts.
"""

[[criterion]]
id = "recovery_persistence_chain"
name = "recovery_persistence_chain"
type = "binary"
weight = 2.5
description = """
1. Save a dedicated snippet QC Recovery Check, filename qc-recovery.js, source:
document.body.innerHTML='<p>recovery-marker-Q7</p>';
console.log('recovery-marker-Q7-log');
Reload, load it and run. Its exact saved fields and output match.
2. Without saving over it, replace the source with:
document.body.innerHTML='<p>failed-loop-candidate</p>';
setTimeout(() => { console.log('late-callback-entered'); while (true) {} }, 4000);
Run it, confirm the candidate is active while the timer is pending and then observe late-callback-entered. The run must terminate for the shared time limit within about eight seconds of the ORIGINAL Run action, with the original recovery marker restored rather than failed-loop-candidate. The four-second wait is part of its five-second budget: a fresh five seconds beginning at callback entry would run to roughly nine seconds and fails this check. Measure elapsed time from the actual Run action; do not start the clock at the callback log.
3. Load QC Recovery Check again, accepting a discard warning for the deliberately unsaved bad draft. Its original exact fields remain intact. Run it successfully. No later output or state from the timed-out callback may replace this result.
4. Without saving over that record, run a complete .html document with a paragraph interaction-good, a Start work button and a Still waiting button. The Start work handler changes only the paragraph to interaction-candidate, logs interaction-started and schedules a six-second timer that changes the paragraph to interaction-late and logs interaction-late. The Still waiting handler only logs interaction-still-waiting. Wait for initial successful completion before clicking Start work; measure time from this real click. Confirm the changed paragraph and pending work, then about two seconds later click Still waiting and observe its log while the timer remains pending. This second deliberate interaction must not extend the first interaction's five-second budget. Within about eight seconds from Start work, observe a time-limit reason and the successful interaction-good preview restored. Keep observing until the six-second timer's scheduled time has passed, and confirm interaction-late never appears in the console or restored preview. Do not require restored handlers to remain live: rollback may restore a static snapshot. Finally load and run QC Recovery Check again and confirm its original saved source and successful marker remain intact.
Use the exact four-second delay in leg 2 and six-second delay in leg 4. A short-delay callback cannot distinguish the required budgets. The second click in leg 4 keeps the same interaction active; giving it a fresh five seconds would wrongly let the six-second callback complete, so the missing late marker and time-limit outcome matter as well as elapsed time. These are supported source callbacks. This criterion checks the shared run and interaction budgets with recovery, not unsupported dynamic execution. Its outcome does not automatically determine the separate restart criterion.
"""

[[criterion]]
id = "cw_process_restart_durability"
name = "cw_process_restart_durability"
type = "binary"
weight = 2.5
description = """
1. Establish this criterion's own durable controls. Save QC Restart Primary (qc-restart.js, console.log('restart-original');) and make an independent duplicate QC Restart Copy. Edit and save only Copy to console.log('restart-copy-edited');. Create QC Restart Deleted and delete it through confirmation. Record the current full list of stable identities/titles and the primary/copy exact fields and revisions.
2. Call the verifier MCP tool restart_app exactly once, wait for its completed restart, then open a fresh browser page at http://localhost:3000. A browser reload alone is insufficient.
3. The recorded library identities/titles remain exactly once each, with no resurrected QC Restart Deleted. Primary and Copy load with their own exact saved filenames, source and revisions. Run each and observe its matching console marker.
4. Edit Primary to console.log('restart-after-save'); and save with its loaded current revision. This succeeds; a fresh read shows the new source and advanced revision, while Copy is still exactly unchanged.
All legs must be observed. Do not depend on another criterion's reference or verdict, reset the database, enumerate hidden files, or add an authentication step.
"""
