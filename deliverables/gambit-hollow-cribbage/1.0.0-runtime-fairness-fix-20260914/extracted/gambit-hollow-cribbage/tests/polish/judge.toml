[judge]
mode = "batched"
timeout = 900
isolated = false
temperature = 0
weight = 0.2
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"


[[criterion]]
id = "keyboard_controls_and_focus"
name = "keyboard_controls_and_focus"
type = "binary"
weight = 1.0
description = """
Setup: use the visible game controls, seat switcher and scoring bench with the keyboard.
Require labels/accessible names for starting, choosing cards, discarding, cutting and counting. Tab/Shift+Tab show visible focus; Enter/Space operate cards and buttons; focus after a card action remains on a useful reachable control. No keyboard trap or unintended game mutation from moving focus. Inspect landmarks/headings where applicable; do not demand a navigation landmark when the app has no navigation.
"""

[[criterion]]
id = "responsive_controls_and_reachability"
name = "responsive_controls_and_reachability"
type = "binary"
weight = 1.0
description = """
Inspect at 1280 by 800 and 375 by 760. Through normal vertical scrolling, reach the board, active hand, crib/play controls, saved-game chooser, bench and ladder. No horizontal page overflow, clipped essential label or inaccessible action. Card controls and touch targets remain practical. Grade reachability/operability, not decorative composition.
"""

[[criterion]]
id = "illegal_move_feedback"
name = "illegal_move_feedback"
type = "binary"
weight = 1.0
description = """
Setup: start P at zero and play B:5S,A:7H,B:6H,A:TH to reach 28 with B to act. Try B:9D or inspect its disabled-state explanation.
Require a visible textual reason for the over-31 refusal, readable/announced feedback and a still-usable table. Valid B:AC afterward must work. Feedback must not depend solely on red colour or a silent disabled button. Observe actual UI outcomes; exact response codes are not prescribed.
"""

[[criterion]]
id = "pending_action_and_empty_state"
name = "pending_action_and_empty_state"
type = "binary"
weight = 1.0
description = """
Setup: open the root without selecting a saved game, then start your own zero-score game.
The no-game view has a usable, labelled control to start a game; a plain board
with a New game button is sufficient. Explanatory empty-state prose is optional. During a real pending game save, rapid repeated activation of that same control must not create duplicate accepted actions/games; show a busy/pending state or suppress repeated activation. Browser network delay may hold one observed request pending, but do not alter its payload or fabricate success. Resume/close controls and any supplied panels leave the surrounding table usable. Do not require dialogs the app does not have.
"""

[[criterion]]
id = "readable_state_and_reduced_motion"
name = "readable_state_and_reduced_motion"
type = "binary"
weight = 1.0
description = """
Setup: inspect an active zero-score P game, its show and scoring bench, then emulate reduced motion.
Names, active seat, dealer, turn, hand number, cut, count, scores and scoring commentary are available as text alongside the SVG. Bench totals and separate scoring categories remain readable and clearly separate from ranked game points. Show entries remain readable until Next hand. Nonessential motion is reduced or already absent; no information is lost. Grade semantic clarity and motion support, not visual taste or rechecking score arithmetic.
"""
