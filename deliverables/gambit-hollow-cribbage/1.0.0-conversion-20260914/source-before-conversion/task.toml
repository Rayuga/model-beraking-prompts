schema_version = "1.4"
artifacts = ["/home/build/gambit-hollow-board-games", "/logs/verifier"]

[task]
name = "turing/gambit-hollow-cribbage"
version = "1.0.0"
description = "Full-stack vanilla JavaScript, inline SVG, Express and SQLite cribbage board where scoring is the task: fifteens, pairs, runs, flush and nobs counted identically however the cards arrive, the crib belonging to the dealer, and a game that survives a reload mid-play"
keywords = ["webdev", "codearena", "full-stack", "vanilla-js", "svg", "express", "sqlite", "cribbage", "card-game", "scoring", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
category = "programming"
subcategory = "full-stack-web"
persona = "a cribbage club secretary who has been let down by every web version they have tried"
provenance = "authored for the Code Arena WebDev Fullstack leaderboard from the measured both-bad table, 2026-09-02"
arena_slice = "vanilla-svg-gambit-hollow"
active_target_model = "openrouter/openai/gpt-5.4-mini"
active_target_reasoning_effort = "high"
solution_explanation = "A cribbage board where the scoring is the whole task: fifteens, pairs, runs, flush and his nobs, counted the same way every time, with the 29-hand reachable and saved games resuming."
tags = ["full-stack", "browser", "arena", "rl-training"]

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENROUTER_API_KEY}"
OPENAI_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "openai/gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
