[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "server_backed_local_application"
name = "server_backed_local_application"
type = "binary"
weight = 2.0
description = """
Confirm the app is served at localhost:3000 and that its reads and writes use
successful same-origin server requests. A static or local-only mock, a missing
backend, or a non-local game data service does not pass.
"""

[[criterion]]
id = "drawn_as_svg_not_images"
name = "drawn_as_svg_not_images"
type = "binary"
weight = 1.0
description = """
Confirm the cards and the board are drawn as inline SVG rather than fetched
images or a canvas: inspecting a card reveals SVG shapes and text, and no image
file is requested for them.
"""
