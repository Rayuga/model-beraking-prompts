[judge]
mode = "batched"
timeout = 600
isolated = false
temperature = 0
weight = 1.0
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "board_renders"
name = "board_renders"
type = "binary"
weight = 2.0
description = """
Open the application and confirm a substantive board renders: a peg board with
two tracks, the ladder, and a control to start a game, without a fatal browser
error or broken page.
"""

[[criterion]]
id = "cards_render_as_cards"
name = "cards_render_as_cards"
type = "binary"
weight = 1.0
description = """
Start a game and confirm the hand renders as recognisable playing cards showing
rank and suit, not as text codes. Confirm the suits are distinguishable and that
hearts and diamonds are red where spades and clubs are not.
"""
