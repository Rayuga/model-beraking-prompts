schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "turing/gambit-hollow-cribbage"
version = "1.0.0"
description = "A two-seat cribbage club table with exact hand and pegging scoring, reproducible practice deals, an SVG peg board, SQLite saved games and a club ladder"
keywords = ["webdev", "turing", "full-stack", "vanilla-js", "svg", "express", "sqlite", "cribbage", "scoring"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Implement overlapping combinatorial scoring and the complete multi-hand cribbage state machine: go and thirty-one resets, turn ownership, ordered show, instant capped wins, alternating dealers and durable saved state."
category = "Software"
tags = ["full-stack", "browser-game", "state-machine", "persistence", "accessibility"]
provenance = "Original Gambit Hollow club brief, preserved and clarified for the current task template and reproducible practice."
arena_slice = "full-stack-node-express-sqlite-cribbage"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "codex"
REWARDKIT_MODEL = "gpt-5.6-luna"
REWARDKIT_REASONING_EFFORT = "max"

[verifier.environment]
network_mode = "public"
