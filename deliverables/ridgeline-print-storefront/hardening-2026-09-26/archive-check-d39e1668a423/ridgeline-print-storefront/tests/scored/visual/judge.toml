[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "visual_typography"
name = "visual_typography"
type = "likert"
points = 5
weight = 1.0
description = """
Assess typography on the shop's key screens (the print grid, a print's detail view, the basket panel, and checkout) at desktop width.
5: deliberate type system - clear, readable fonts; distinct sizes and weights
for the shop's titles, prices, stock labels and body text; consistent
alignment; no awkward truncation or collisions.
4: readable with one or two minor size or alignment defects.
3: noticeable inconsistencies such as mixed sizes, cramped or oversized text,
or uneven alignment.
2: several labels are hard to read or inconsistently styled.
1: typography is broadly default, illegible, or misaligned, or no coherent
typographic rendering exists on the reviewed surface.
"""

[[criterion]]
id = "visual_color_and_contrast"
name = "visual_color_and_contrast"
type = "likert"
points = 5
weight = 1.0
description = """
Assess colour and contrast on the print grid and checkout, in both light and dark mode.
5: cohesive palette; text and background contrast stays legible; price,
stock and trade-break states are distinguishable by more than colour alone;
both themes preserve readability.
4: one or two minor contrast or palette imperfections.
3: noticeable low-contrast text or clashing accents.
2: substantial legibility problems or an inconsistent palette.
1: colours are broadly default or harsh, a theme is difficult to read, or
no readable colour treatment renders on the reviewed surface.
"""

[[criterion]]
id = "visual_spacing_and_layout"
name = "visual_spacing_and_layout"
type = "likert"
points = 5
weight = 1.0
description = """
Assess spacing and layout on the print grid (data-dense) and the checkout delivery-address form at desktop width.
5: even spacing scale, deliberate alignment and margins, and the cards, the
basket panel and the checkout form sitting in a stable arrangement with no
overlaps or clipping.
4: minor uneven spacing or alignment.
3: several elements look crowded, drifting, or unevenly padded.
2: frequent collisions, clipping, or inconsistent gutters.
1: layout is broadly unbalanced or broken, or no coherent spaced layout
renders on the reviewed surface.
"""

[[criterion]]
id = "visual_hierarchy_and_scanability"
name = "visual_hierarchy_and_scanability"
type = "likert"
points = 5
weight = 1.0
description = """
Assess visual hierarchy and scannability on the print grid and a print's detail view at desktop width.
5: clear visual order - the shop's header, the current print's title and
photograph, its price and stock state, and the primary add-to-basket and
checkout actions each have distinct prominence, so a shopper can scan for
what is buyable and what it costs.
4: hierarchy is mostly clear with minor ambiguity.
3: several sections compete, or important content such as price or stock
state is visually buried.
2: navigation, headings and content are hard to tell apart.
1: no usable visual hierarchy is present, or no scannable hierarchy renders
on the reviewed surface.
"""

[[criterion]]
id = "visual_overall_craft"
name = "visual_overall_craft"
type = "likert"
points = 5
weight = 1.0
description = """
Assess overall visual craft across the grid, a print's detail view, the basket, checkout and an order receipt (the seeded historical order is sufficient), including empty or sold-out states you encounter.
5: one coherent design language applied consistently - deliberate
components, integrated details, no stray default styling, and a finished
look even in secondary states such as a sold-out line or an empty basket.
4: one or two minor polish imperfections.
3: noticeable default styling or inconsistent component treatment across
screens.
2: much of the interface looks unfinished or inconsistent.
1: visual craft is effectively absent, or no crafted interface renders on
the reviewed surfaces.
"""

[[criterion]]
id = "visual_responsive_consistency"
name = "visual_responsive_consistency"
type = "likert"
points = 5
weight = 1.0
description = """
Assess visual consistency across desktop and a roughly 390 by 844 mobile viewport, on the print grid and the basket or checkout.
5: the same design language holds at both sizes - photographs, prices,
spacing, the grid and the basket/checkout controls scale or reflow
deliberately without squashing, stretching, overflow beyond intentional
scroll areas, or visual breakage.
4: one or two minor responsive visual defects.
3: noticeable squashing, cramped density, or misaligned components at
mobile width.
2: several components break or overflow badly on mobile.
1: mobile rendering is visually inconsistent or mostly broken, or no
consistent responsive presentation renders on the reviewed surfaces.
"""
