[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "theme_switching"
name = "theme_switching"
type = "binary"
weight = 0.5
description = """
Use the visible theme control and confirm it produces a clear rendered change between light and dark presentation across the page — background, text and the product cards — while preserving legibility and the current view.
"""

[[criterion]]
id = "responsive_accessible_layout"
name = "responsive_accessible_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 mobile viewport, confirm the grid, the basket, and checkout each fit without horizontal page overflow and remain fully usable — filters and the basket do not require horizontal scrolling to operate. Confirm the desktop experience has a navigation or header landmark, a main landmark, a meaningful page heading, and accessible names or associated labels for the search box, the filter/sort selects, and the basket and theme controls.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Use the search, filter or sort controls and confirm the visible results respond. Add one currently available unit and confirm visible success feedback, such as the basket count or an announcement, reflects that action. Inspect focus or hover feedback on the controls used. Navigate into and out of a print detail and the basket using the app's own controls, confirming the previous view is usable again without a stranded overlay or blocked controls. Accept detail pages, drawers, and dialogs; if an actual modal is used, also check that Escape dismisses it and keyboard focus returns to a usable control. Do not demand a modal or a particular navigation label.
"""

[[criterion]]
id = "keyboard_only_purchase_journey"
name = "keyboard_only_purchase_journey"
type = "binary"
weight = 1.5
description = """
Start from an empty basket and the home page, using only keyboard input for the journey: Tab, Shift+Tab, Enter, Space, arrow keys, Escape and typing, with no pointer clicks or synthetic focus() calls. Reach search and the size, paper and sort controls by keyboard. Open a currently available print using its keyboard-operable control, choose one available unit using whatever quantity controls exist, and add it to the basket. Navigate to the basket and checkout. Fill the delivery fields the app requests, inspect the order summary before committing, and activate the final order action by keyboard. Confirm an order confirmation with a reference is reached. The summary may be on the same page as the address or on a separate review page; a print or basket may be a page, drawer, or dialog. Every control actually used must expose a visible focus indicator, and the journey must not become trapped or require a pointer. Grade keyboard usability here, not the commercial arithmetic already checked in functional.
"""
