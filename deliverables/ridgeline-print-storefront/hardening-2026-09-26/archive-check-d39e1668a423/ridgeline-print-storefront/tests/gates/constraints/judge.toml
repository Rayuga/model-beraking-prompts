[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "application_health_and_server_data"
name = "application_health_and_server_data"
type = "binary"
weight = 1.0
description = """
Use the browser to open the stated health URL, http://localhost:3000/api/health, and confirm a successful HTTP response. Do not require a particular JSON object, property name, or response body.

Then browse the populated shop and open a print or use its order lookup. Capture an application response carrying the product or order data shown on that screen. Accept data embedded in a server-rendered document or supplied by the app's own data request; discover the route from actual browser traffic rather than inventing a route. A health response by itself is insufficient product-data evidence. Reading client storage, or finding the same hardcoded seed record in two tabs, is not such evidence.

This gate establishes only a reachable application serving product data. Durable writes and correct commercial rules are tested in functional; this observation alone does not prove a particular database engine. Keep this check read-only and do not grade exact prices, order totals, stock levels, styling, or feature completeness here.
"""
