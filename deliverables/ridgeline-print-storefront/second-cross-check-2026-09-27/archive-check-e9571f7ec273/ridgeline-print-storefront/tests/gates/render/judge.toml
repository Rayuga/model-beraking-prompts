[judge]
judge = "claude-code"
mode = "batched"
timeout = 600
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "all_pass"

[[criterion]]
id = "populated_public_shop_loads"
name = "populated_public_shop_loads"
type = "binary"
weight = 1.0
description = """
Open http://localhost:3000 without signing in. Confirm a populated shop with identifiable prints and usable navigation renders, rather than a blank page, generic server error, or placeholder shell. Open a print using the shop's own control and confirm its content is reachable. Judge basic access only: exact catalogue counts, complete variant details, price arithmetic, purchasing, and visual quality belong to the scored dimensions.
"""
