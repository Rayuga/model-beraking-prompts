[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "responsive_layout"
name = "responsive_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 viewport, open the catalogue and basket. Essential text and controls remain reachable and are not obscured by overlapping panels or page-wide overflow. Stacking, scrolling and different mobile navigation are valid; intentionally scrollable content may scroll. No purchase is needed.
"""

[[criterion]]
id = "labelled_controls_and_focus"
name = "labelled_controls_and_focus"
type = "binary"
weight = 1.0
description = """
Inspect the search, size/paper/sort controls, basket and theme control. They have visible labels or accessible names that identify their purpose. Use Tab to reach at least the search and two other enabled controls and confirm focus is visibly identifiable; native focus styling is valid. This is a basic navigation check, not a keyboard-only purchase journey.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Use a title search that matches a currently listed print, then clear it; the changed results are apparent. Add one currently available unit to the basket and observe visible feedback such as an updated count, basket contents or a confirmation message. Judge whether the interface acknowledges these ordinary actions; do not regrade prices, stock enforcement or checkout persistence here. Leave that unplaced basket empty afterward.
"""

[[criterion]]
id = "theme_and_navigation"
name = "theme_and_navigation"
type = "binary"
weight = 1.0
description = """
Switch between light and dark themes and confirm the page chrome and controls actually change, rather than only the toggle label. Open a print detail and return to the catalogue, then open and leave the basket using the app controls. The previous surface remains usable without a stranded overlay or lost navigation. Judge working theme changes and return navigation here; Visual owns contrast, palette and aesthetic readability. Pages, drawers, dialogs and native browser controls are all valid.
"""
