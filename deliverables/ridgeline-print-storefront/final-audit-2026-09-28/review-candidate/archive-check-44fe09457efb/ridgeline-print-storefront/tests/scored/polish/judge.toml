[judge]
judge = "claude-code"
mode = "batched"
timeout = 900
isolated = false
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--executable-path=/usr/local/bin/chromium", "--no-sandbox"]

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "responsive_layout"
name = "responsive_layout"
type = "binary"
weight = 1.0
description = """
At a roughly 390 by 844 viewport, open the catalogue and basket. Essential text and controls remain reachable and are not obscured by overlapping panels or page-wide overflow. Stacking, scrolling and different mobile navigation are valid; intentionally scrollable content may scroll. No purchase is needed.
"""

[[criterion]]
id = "labelled_controls_and_focus"
name = "labelled_controls_and_focus"
type = "binary"
weight = 1.0
description = """
At an ordinary desktop viewport, inspect search, size/paper/sort controls, print-opening and return controls, basket, theme, available size/quantity/add controls, basket quantity/removal and checkout navigation, delivery fields, order submission, and reference lookup. Each purpose has a visible label or accessible name. Use actual keyboard events to reach these controls when enabled and confirm visible focus; native focus styling, menus and composite arrow-key navigation are valid. Pointer setup may prepare one available unplaced unit and open each surface. Do not place or cancel an order just to inspect focus; reaching the enabled submit control is sufficient. Use the known historical receipt to return to the shop without requiring cancellation there. Disabled/sold-out controls need not be focusable. This criterion owns labels, reachability and visible focus; the separate navigation outcome observes opening and leaving views. No exact words, focus order or app-documented native key is required. Leave the unplaced basket empty afterward.
"""

[[criterion]]
id = "interaction_feedback"
name = "interaction_feedback"
type = "binary"
weight = 1.0
description = """
Use a title search that matches a currently listed print, then clear it; the changed results are apparent. Add one currently available unit to the basket and observe visible feedback such as an updated count, basket contents or a confirmation message. Judge whether the interface acknowledges these ordinary actions; do not regrade prices, stock enforcement or checkout persistence here. Leave that unplaced basket empty afterward.
"""

[[criterion]]
id = "ridgeline_light_dark_switch_changes_theme"
name = "ridgeline_light_dark_switch_changes_theme"
type = "binary"
weight = 0.5
description = """
Switch between light and dark themes and confirm the page chrome and controls actually change, rather than only the toggle label. Visual owns contrast, palette and aesthetic readability. Missing keyboard navigation does not determine this verdict.
"""

[[criterion]]
id = "ridgeline_keyboard_views_have_usable_return"
name = "ridgeline_keyboard_views_have_usable_return"
type = "binary"
weight = 0.5
description = """
At an ordinary desktop viewport, start from the catalogue with cleared filters. If needed, prepare one currently available unit in an unplaced basket through the normal UI; this setup may use a pointer. Now use only keyboard actions to open a print detail, return to the catalogue, open the basket and leave it for the catalogue. Each chosen view actually opens and the previous surface remains usable without a stranded overlay or lost navigation. Pages, drawers, dialogs and native browser controls are valid; accept ordinary or app-documented keys without prescribing a layout or bindings. Do not use pointer actions, programmatic focus, DOM clicks or application API calls during this route.

Judge view changes and usable return navigation here, without repeating the labels/focus verdict. No keyboard-only purchase, price calculation or durable write is required. Leave the unplaced basket empty afterward using ordinary UI actions; pointer cleanup is allowed. Do not place or cancel an order.
Theme switching does not determine this navigation verdict.
"""
