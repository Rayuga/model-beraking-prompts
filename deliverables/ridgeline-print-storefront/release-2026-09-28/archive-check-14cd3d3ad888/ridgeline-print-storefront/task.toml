schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/ridgeline-print-storefront"
description = "Public React print-shop storefront backed by Express and SQLite, with variant-level trade pricing, weight-banded delivery, atomic stock commitment, retry-safe checkout, immutable receipts, and cancellation that restores stock exactly once."
keywords = ["webdev", "turing", "full-stack", "express", "sqlite", "react", "ecommerce", "storefront", "print-shop", "transactional-stock"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Variant-specific trade pricing and delivery bands interact with shared stock, concurrent purchases, retried requests, stored receipts and cancellation across server restarts."
category = "programming"
tags = ["full-stack", "browser", "arena", "rl-training"]
provenance = "Adapted from the supplied Ridgeline Print Storefront brief and catalogue."
arena_slice = "full-stack-react-express-sqlite-ridgeline-print-storefront"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
