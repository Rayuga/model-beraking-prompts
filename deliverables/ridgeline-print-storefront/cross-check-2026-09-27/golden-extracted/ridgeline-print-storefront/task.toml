schema_version = "1.4"
artifacts = ["/app", "/assets"]

[task]
name = "turing/ridgeline-print-storefront"
description = "Public React print-shop storefront backed by Express and SQLite, with variant-level trade pricing, weight-banded delivery, atomic stock commitment, retry-safe checkout, immutable receipts, and cancellation that restores stock exactly once."
keywords = ["webdev", "turing", "full-stack", "express", "sqlite", "react", "ecommerce", "storefront", "browser-judge", "rewardkit"]

[metadata]
difficulty = "hard"
difficulty_explanation = """
The public print shop combines thirteen independently stocked variants across eight prints.
Its canonical seed_data.json supplies prices, trade thresholds, postage bands, sheet weights,
and a dispatched historical order priced before the current catalogue. The builder must
connect a browser-persisted basket to authoritative SQLite transactions, validate delivery
addresses on the server, aggregate duplicate
variants before pricing and stock checks, preserve receipt prices, handle stale multi-line
baskets atomically, distinguish retries from genuinely new purchases, and keep cancellation
and retry state consistent across a process restart. No account or payment service is involved.

Twenty-four weighted binary Functional criteria use documented stock allocations and valid
controls before refusal probes. Their total weight is 35; nine criteria with adversarial
request or replay probes carry 23 of that weight. Catalogue discovery, ordering, basket
reload/removal and missing-reference handling have separate outcomes. The constraints gate
places one simple Kiln order; subsequent functional checks measure the live stock before
their own writes. Four binary Polish criteria and six
anchored Visual criteria evaluate usability and presentation. Dimension shares and the
functional floor come solely from tests/scoring.toml. All judge prompts use the supplied
browser tools; only the final Functional criterion calls the single-use restart tool.

The reference app and local validation target every criterion. Actual Oracle and target-model
scores must be measured on the resulting candidate; no model reward is claimed here.
"""
category = "E-commerce & Checkout Flows"
tags = ["full-stack", "browser", "arena", "rl-training", "ecommerce", "storefront"]
provenance = "Adapted from the downloaded Ridgeline Print Storefront task by Jagadeesh Jayachandran; reworked against the staged WebDev template on 2026-09-26 with an editable golden frontend, transactional checkout and cancellation, and strict behavior-based verifiers."
arena_slice = "full-stack-react-express-sqlite-ridgeline-print-storefront"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 13200.0
environment_mode = "separate"

[verifier.env]
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "z-ai/glm-5.3-flashx"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""

[verifier.environment]
network_mode = "public"
