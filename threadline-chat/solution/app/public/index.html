<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2933">
  <title>Threadline</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-screen" class="login-screen" hidden>
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">T</span>
      <div><strong>Threadline</strong><span>Northstar Studio</span></div>
    </div>
    <form id="login-form" class="login-panel">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to Northstar Studio</h1>
      <label>Email<select id="login-email" required></select></label>
      <label>Password<input id="login-password" type="password" value="northstar" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
  </section>

  <main id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <button id="mobile-nav-button" class="icon-button mobile-only" aria-label="Open channel navigation" title="Open channel navigation">&#9776;</button>
      <div class="top-brand"><span class="brand-mark small">T</span><strong>Threadline</strong></div>
      <button id="search-button" class="search-trigger"><span aria-hidden="true">&#128269;</span><span>Search messages</span></button>
      <button id="notifications-button" class="icon-button notification-button" aria-label="Open mentions" title="Mentions">
        <span aria-hidden="true">@</span><span id="notification-count" class="count-badge" hidden></span>
      </button>
      <button id="profile-button" class="profile-button" aria-haspopup="menu"><span id="profile-avatar" class="avatar"></span><span id="profile-name"></span></button>
      <div id="profile-menu" class="menu" hidden><div id="profile-role" class="menu-caption"></div><button id="logout-button">Sign out</button></div>
    </header>

    <aside id="channel-sidebar" class="sidebar">
      <div class="workspace-heading"><div><strong id="workspace-name"></strong><span>Team workspace</span></div><span class="status-dot" title="Connected"></span></div>
      <nav aria-label="Workspace navigation">
        <button id="mentions-nav" class="sidebar-link"><span>@</span> Mentions <span id="mentions-nav-count" class="nav-count" hidden></span></button>
        <button id="pins-nav" class="sidebar-link"><span aria-hidden="true">&#128204;</span> Pinned messages</button>
      </nav>
      <div class="section-heading"><span>Channels</span></div>
      <nav id="channel-list" class="channel-list" aria-label="Channels"></nav>
      <div class="sidebar-footer"><div id="connection-label">Connecting...</div></div>
    </aside>

    <section class="channel-view">
      <header class="channel-header">
        <div class="channel-title"><h1><span id="channel-privacy">#</span><span id="channel-name">general</span></h1><p id="channel-description"></p></div>
        <div class="channel-tools">
          <button id="members-button" class="presence-button" title="Channel members"><span id="presence-stack" class="presence-stack"></span><span id="presence-count">0 online</span></button>
          <button id="channel-pins-button" class="icon-button" aria-label="Pinned messages" title="Pinned messages">&#128204;</button>
        </div>
      </header>

      <div id="channel-banner" class="channel-banner" hidden></div>
      <div id="message-scroller" class="message-scroller">
        <button id="load-older-button" class="load-older" hidden>Load older messages</button>
        <div id="message-list" class="message-list" aria-live="polite"></div>
      </div>

      <div class="composer-zone">
        <div id="typing-indicator" class="typing-indicator" aria-live="polite"></div>
        <form id="message-form" class="composer">
          <textarea id="message-input" rows="2" maxlength="8000" placeholder="Message #general" aria-label="Message channel"></textarea>
          <div id="mention-suggestions" class="mention-suggestions" hidden></div>
          <div class="composer-footer"><span>Enter to send · Shift+Enter for a new line</span><button id="send-button" class="send-button" type="submit" aria-label="Send message" title="Send message">&#10148;</button></div>
        </form>
      </div>
    </section>

    <aside id="thread-panel" class="thread-panel" hidden>
      <header><div><h2>Thread</h2><span id="thread-channel"></span></div><button id="close-thread-button" class="icon-button" aria-label="Close thread" title="Close thread">&#10005;</button></header>
      <div id="thread-list" class="thread-list"></div>
      <form id="thread-form" class="thread-composer"><textarea id="thread-input" rows="3" maxlength="8000" placeholder="Reply in thread"></textarea><button class="primary-button" type="submit">Reply</button></form>
    </aside>
  </main>

  <div id="mobile-scrim" class="mobile-scrim" hidden></div>
  <div id="toast-region" class="toast-region" aria-live="assertive"></div>

  <dialog id="search-dialog" class="app-dialog wide-dialog">
    <div class="dialog-header"><div><p class="eyebrow">Workspace search</p><h2>Find messages</h2></div><button class="icon-button dialog-close" aria-label="Close">&#10005;</button></div>
    <form id="search-form" class="search-form"><input id="search-input" type="search" minlength="2" placeholder="Search all accessible channels" required><button class="primary-button">Search</button></form>
    <div id="search-results" class="result-list empty-state">Enter at least two characters.</div>
  </dialog>

  <dialog id="detail-dialog" class="app-dialog">
    <div class="dialog-header"><div><p id="detail-eyebrow" class="eyebrow"></p><h2 id="detail-title"></h2></div><button class="icon-button dialog-close" aria-label="Close">&#10005;</button></div>
    <div id="detail-content" class="detail-content"></div>
  </dialog>

  <template id="message-template">
    <article class="message">
      <div class="avatar message-avatar"></div>
      <div class="message-body">
        <div class="message-meta"><strong class="message-author"></strong><span class="integration-badge" hidden>APP</span><time></time><span class="edited-label" hidden>edited</span></div>
        <div class="message-content"></div>
        <div class="message-reactions"></div>
        <button class="thread-summary" hidden></button>
      </div>
      <div class="message-actions">
        <button data-action="react" title="Add reaction" aria-label="Add reaction">+</button>
        <button data-action="reply" title="Reply in thread" aria-label="Reply in thread">&#8617;</button>
        <button data-action="more" title="More actions" aria-label="More actions">&#8943;</button>
      </div>
      <div class="message-menu menu" hidden></div>
    </article>
  </template>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
