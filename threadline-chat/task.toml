schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "webdev/threadline-chat"
version = "1.0.0"
description = "Build Threadline, a persistent Slack-style team messaging workspace with authenticated sessions, channels, threads, mentions, unread state, reactions, pins, live presence, webhook idempotency, authorization, and append-only audit history."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["vibe-code", "webdev", "fullstack", "nodejs", "sqlite", "chat", "realtime", "authorization", "idempotency"]

[metadata]
category = "web-development"
difficulty = "hard"
difficulty_explanation = """
Threadline combines a polished messaging interface with server-owned identity,
private-channel authorization, stable message ordering, thread metadata,
per-user unread and mention state, live multi-session behavior, webhook
idempotency, stale-write protection, append-only audit, and durable SQLite
persistence. Shallow chat UIs often pass basic sending while failing these
interacting state and trust-boundary requirements.
"""
task_id = "WEBDEV-THREADLINE-CHAT-001"
capabilities = ["frontend-ui", "backend-api", "authentication", "persistence", "realtime", "authorization", "concurrency-control"]

[agent]
timeout_sec = 21600.0
network_mode = "public"

[verifier]
timeout_sec = 21600.0
network_mode = "public"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""
CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY = "1"
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "anthropic/claude-sonnet-5"
REWARDKIT_TIMEOUT_SEC = "18000"

[solution]
env = {}

[environment]
build_timeout_sec = 3600.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "public"

[environment.env]
PORT = "3000"
BASE_URL = "http://localhost:3000"
APP_PUBLIC_URL = "http://localhost:3000"
APP_PUBLIC_PORT = "3000"
