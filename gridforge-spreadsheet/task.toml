schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "webdev/gridforge-spreadsheet"
version = "1.0.0"
description = "Build GridForge, a browser-based spreadsheet engine for operations planning. The task stresses non-CRUD spreadsheet behavior: custom grid interaction, formula parsing and dependency recalculation, range paste/fill, sort/filter correctness, undo/redo granularity, persistence, and stale-save conflict enforcement."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["vibe-code", "webdev", "fullstack", "nodejs", "sqlite", "spreadsheet", "formula-engine", "custom-grid", "revision-control"]

[metadata]
category = "web-development"
difficulty = "hard"
difficulty_explanation = """
GridForge has a compact UI surface but deep semantics. Models that build a
plain CRUD table can satisfy the visual shape while missing real spreadsheet
behavior: formula parsing with precedence, range functions, dependency graph
recalculation, circular-reference errors, atomic range paste/delete undo,
fill-handle behavior, row sort/filter invariants, and persistence of both raw
formulas and displayed values.

The backend difficulty is revision integrity. The app must reject stale saves
from another tab and forged stale-save requests rather than silently overwriting
newer workbook content. The verifier weights easy visual checks cheaply and
gives the largest weights to behavior that shallow implementations usually skip.
"""
task_id = "WEBDEV-GRIDFORGE-SPREADSHEET-001"
capabilities = ["frontend-ui", "custom-input", "backend-api", "persistence", "formula-engine", "concurrency-control"]

[agent]
timeout_sec = 10800.0
network_mode = "public"

[verifier]
timeout_sec = 10800.0
network_mode = "public"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""
CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY = "1"
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "anthropic/claude-sonnet-5"
REWARDKIT_TIMEOUT_SEC = "9000"

[solution]
env = {}

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "public"

[environment.env]
PORT = "3000"
BASE_URL = "http://localhost:3000"
APP_PUBLIC_URL = "http://localhost:3000"
APP_PUBLIC_PORT = "3000"
