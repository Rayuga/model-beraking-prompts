<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridForge Spreadsheet</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 id="workbook-title">GridForge</h1>
        <div class="meta">
          <span id="sheet-label">Sheet</span>
          <span id="revision-label">Revision</span>
          <span id="save-state">Saved</span>
          <span id="selection-label">A1</span>
        </div>
      </div>
      <div class="actions">
        <button id="save-btn" type="button">Save</button>
        <button id="undo-btn" type="button">Undo</button>
        <button id="redo-btn" type="button">Redo</button>
      </div>
    </header>
    <section class="formula-row">
      <label for="name-box">Cell</label>
      <input id="name-box" readonly value="A1">
      <label for="formula-bar">Formula</label>
      <input id="formula-bar" autocomplete="off" spellcheck="false">
      <button id="apply-formula" type="button">Apply</button>
    </section>
    <section class="tools">
      <button id="fill-down-btn" type="button">Fill Down</button>
      <button id="fill-right-btn" type="button">Fill Right</button>
      <button id="clear-btn" type="button">Clear Range</button>
      <label>Sort range <input id="sort-range" value="A10:D12"></label>
      <label>by column <input id="sort-column" value="B"></label>
      <button id="sort-desc-btn" type="button">Sort Desc</button>
      <label>Filter range <input id="filter-range" value="A10:D12"></label>
      <label>text <input id="filter-text" value="South"></label>
      <button id="filter-btn" type="button">Filter</button>
      <button id="clear-filter-btn" type="button">Clear Filter</button>
    </section>
    <main class="workspace">
      <div id="grid" class="grid" tabindex="0" role="grid" aria-label="GridForge spreadsheet"></div>
      <aside class="side">
        <h2>Revision History</h2>
        <div id="history"></div>
      </aside>
    </main>
    <div id="message" role="status"></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
