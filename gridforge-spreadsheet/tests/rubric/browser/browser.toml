[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
mode = "batched"
timeout = 8400
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[[criterion]]
id = "workbook_load_custom_surface_status"
name = "workbook_load_custom_surface_status"
type = "binary"
weight = 0.5
description = """
Open the running GridForge app URL provided by the verifier harness. This criterion is all-or-nothing: if any sub-check fails, mark the criterion failed. Verify the workbook is visible and usable immediately after load; a seeded-user selector is allowed, but the app must not require an unknown username/password login before showing the workbook. Verify the page shows the workbook title "Northwind Operations Plan". Verify it shows the sheet name "Plan". Verify it exposes a spreadsheet/grid workspace. Verify row numbers are visible. Verify column letters are visible. Verify selected cell or selected range status is visible. Verify a formula bar or raw-value readout is visible. Verify the current saved revision is visible. Verify the saved/dirty state is visible.
"""

[[criterion]]
id = "custom_grid_no_spreadsheet_widget"
name = "custom_grid_no_spreadsheet_widget"
type = "binary"
weight = 2.0
description = """
Inspect the live DOM and loaded scripts, using browser evaluation if needed. This criterion is all-or-nothing: if any sub-check fails, mark it failed. Verify the main editable grid is not a textarea. Verify the main editable grid is not contenteditable. Verify the main editable grid is not implemented as an input element in every cell or as a cell-per-input form. A formula bar input outside the grid is allowed, but the grid itself must not contain one input per visible cell. Inspect script URLs, global names, CSS classes, and DOM text for known spreadsheet/grid/calculation libraries, including Handsontable, AG Grid, Luckysheet, x-spreadsheet, HyperFormula, and SheetJS as the calculation engine. Then click blank cell F2 and edit it to CUSTOM-GRID-PROOF using the normal visible app workflow. Verify F2 displays the exact marker and the workbook data changes. If editing only works by direct DOM mutation, direct API mutation, hidden routes, or a hidden/native per-cell input grid, fail.
"""

[[criterion]]
id = "autosave_reload_revision_attribution"
name = "autosave_reload_revision_attribution"
type = "binary"
weight = 0.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Select Riley Stone in the seeded-user selector. Confirm F30 is blank, then use the normal grid editing UI to set F30 to AUTOSAVE-F30. Do not press the Save button and do not use a direct API write. Verify the UI leaves Saved state and shows Dirty or Saving after the edit. Wait up to 5 seconds for the UI to show Saved. If it never shows Saved, fail. Reload the page and verify F30 displays AUTOSAVE-F30. Open revision history and verify a new revision exists after the autosaved edit. Select F30 and verify the selected-cell attribution or cell-history UI shows Riley Stone and a history entry whose old value is blank and whose new value is AUTOSAVE-F30.
"""

[[criterion]]
id = "formula_bar_raw_formula_and_precedence"
name = "formula_bar_raw_formula_and_precedence"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Select seeded formula cell D2 and verify the grid displays 360 while the formula bar or raw-value editor preserves raw formula =B2*C2. Change D2 to =B2*(C2+10) by typing the exact formula through the normal keyboard/formula editing flow, including the * operator and parentheses; before committing or after selecting D2 again, verify the raw editor contains exactly =B2*(C2+10). Verify the grid displays 390. Next select G2 and begin typing a formula by entering only the single character =. Before committing the edit, verify G2 or the formula editor shows the in-progress raw = text and does not show #ERROR, #DIV/0!, #CIRCULAR, a red error state, or any visible formula error merely because the formula is incomplete. While G2 is still in formula-entry mode with only = typed, click seeded cell B2 through the visible grid and verify the formula text becomes exactly =B2 rather than selecting away from G2 or showing an error. Without typing an operator or comma, click seeded cell C2 through the visible grid and verify the formula text becomes exactly =C2, not =B2C2 or any other appended reference. Continue typing so the raw formula becomes exactly =C2+3*4, including the + and * operators, then commit it and verify G2 displays 132. Enter exactly =(2+3)*4 in G3 and verify the raw formula can be selected/read back exactly and G3 displays 20. Enter exactly =20/2+3*4 in G4 and verify G4 displays 22. Enter exactly =20/(2+3)*4 in G5 and verify G5 displays 16. If any operator character such as *, +, /, (, or ) replaces the formula instead of being inserted into the formula being typed, fail.
"""

[[criterion]]
id = "cell_reference_dependency_recalculation"
name = "cell_reference_dependency_recalculation"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Establish this criterion's own source cells through normal grid editing: set F20=3 and G20=120. Enter =F20*G20 in H20 through normal formula editing and verify H20 displays 360. Enter =H20+10 in I20 and verify I20 displays 370. Change F20 to 4 through normal cell editing. Without reloading the page, pressing a manual refresh control, or using direct API/DOM mutation, verify H20 recalculates to 480 and I20 recalculates to 490. Select H20 and verify its raw formula is still exactly =F20*G20. Select I20 and verify its raw formula is still exactly =H20+10.
"""

[[criterion]]
id = "range_functions_dependency_recalculation"
name = "range_functions_dependency_recalculation"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use only the visible spreadsheet UI and normal mouse/keyboard interactions; do not use direct API writes, DOM mutation, hidden routes, or manually typing the finished formula when a mouse reference action is required. Establish this criterion's own inputs by setting F22=3, F23=2, F24=5, and G22=120 through normal cell editing. Select H22, begin formula entry, and type exactly =SU. Verify a visible dropdown appears directly below the H22 cell being edited, not below the formula bar and not elsewhere in the toolbar or page, and that the dropdown contains SUM. Choose SUM from that below-cell dropdown, or otherwise complete the recommended SUM option from that dropdown, so the formula editor contains exactly =SUM(. With H22 still in formula-entry mode, use mouse down/drag/up on the grid to select F22:F24 as a formula reference, and verify the in-progress formula text becomes exactly =SUM(F22:F24. While still editing, verify F22:F24 is visibly highlighted or outlined as the referenced range. Type a comma, then click G22 through the visible grid and verify the formula text becomes exactly =SUM(F22:F24,G22. Type the closing parenthesis and press Enter. Verify H22 displays 130, then select H22 and verify the raw formula is exactly =SUM(F22:F24,G22). Next enter =AVG(F22:F24) in H23, =MIN(F22:F24) in H24, =MAX(F22:F24) in H25, and =COUNT(F22:F24) in H26 through normal formula editing. Verify H23 displays 3.3333333333333335 or a clearly equivalent 3.333333333333333 value, H24 displays 2, H25 displays 5, and H26 displays 3. Change F24 from 5 to 8 through normal cell editing. Without reloading the page, pressing a manual refresh control, or using direct API/DOM mutation, verify H22 displays 133, H23 displays 4.333333333333333 or a clearly equivalent 4.333333333333333 value, H24 displays 2, H25 displays 8, and H26 displays 3.
"""

[[criterion]]
id = "formula_errors_and_cycle_recovery"
name = "formula_errors_and_cycle_recovery"
type = "binary"
weight = 2.0
description = """
Treat the following as one connected check, and fail the criterion if any required part is missing. Use normal visible spreadsheet editing only; do not use direct API writes, DOM mutation, hidden routes, reload, or manual refresh. In H2 enter exactly =10/0 and verify H2 visibly shows #DIV/0!, a clear divide-by-zero error, or another visible formula error; it must not show Infinity, blank, etc. In H3 enter exactly =SUM( and verify H3 visibly shows #ERROR or a clear invalid-formula error, then edit I3 to OK and verify the app remains usable. Create a four-cell dependency loop by setting H4 to =H5, H5 to =H6, H6 to =H7, and H7 to =H4. Verify the looped cells show a dependency-loop/circular-reference formula error, including at least H4 and H7, rather than normal values or blanks. Break the loop by replacing H7 with 12. Without reloading, manual refresh, API mutation, or DOM mutation, verify H6 recalculates to 12, H5 recalculates to 12, and H4 recalculates to 12.
"""

[[criterion]]
id = "tsv_csv_range_paste_undo_redo_atomic"
name = "tsv_csv_range_paste_undo_redo_atomic"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Select J2 through the normal grid UI. Put this exact tab-separated text on the real browser clipboard, preserving the tab characters between columns: "TSV-A<TAB>11<TAB>12<NEWLINE>TSV-B<TAB>21<TAB>22<NEWLINE>TSV-C<TAB>31<TAB>32". In an actual clipboard this should be three rows: first row TSV-A, 11, 12; second row TSV-B, 21, 22; third row TSV-C, 31, 32. Paste with Ctrl/Cmd+V only. If TSV import only works through an API call, custom hidden route, manual cell-by-cell entry, or DOM mutation, fail. Verify J2=TSV-A, K2=11, L2=12, J3=TSV-B, K3=21, L3=22, J4=TSV-C, K4=31, and L4=32. Press Undo once through the visible Undo control or Ctrl/Cmd+Z and verify J2:L4 all return to their previous blank values together. Press Redo once through the visible Redo control or Ctrl/Cmd+Y/Shift+Ctrl+Z and verify the same nine values return. Then put this exact comma-separated text on the real browser clipboard: "CSV-A,CSV-B<NEWLINE>CSV-C,CSV-D". Select O2, paste with Ctrl/Cmd+V only, and verify O2=CSV-A, P2=CSV-B, O3=CSV-C, and P3=CSV-D.
"""

[[criterion]]
id = "range_copy_cut_clear_undo_atomic"
name = "range_copy_cut_clear_undo_atomic"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Start from a grid state where J2:L4 contains the nine TSV values from the paste verifier, or create those values through normal paste if needed. Select J2:L4 using the app's normal visible range-selection interaction, not DOM/API mutation. Copy it with Ctrl/Cmd+C or a visible Copy control, select J6, paste with Ctrl/Cmd+V or a visible Paste control, and verify J6=TSV-A, K6=11, L6=12, J7=TSV-B, K7=21, L7=22, J8=TSV-C, K8=31, and L8=32. Select J6:L8, cut with Ctrl/Cmd+X or a visible Cut control, and verify J6:L8 are blank. Press Undo once and verify the same nine values return to J6:L8. Select J6:L8 again and press Delete or Backspace on the selected range, not by direct API/DOM mutation, and verify all nine cells become blank. Press Undo once and verify the same nine values return again.
"""

[[criterion]]
id = "fill_numbers_and_formula_relative_refs"
name = "fill_numbers_and_formula_relative_refs"
type = "binary"
weight = 2.0
description = """
Put 1 in M2 and 2 in M3 through normal cell editing, then select the full range M2:M7 and use the app's visible fill handle/control only to fill the blank cells in that selected range. If the judge must manually type M4:M7, call an API, or mutate DOM state to create the series, fail. Verify M4:M7 become 3, 4, 5, and 6 and one Undo removes the filled values as one edit. Enter =B2*C2 in N2, select N2:N4, and use the same visible fill mechanism to fill the blank cells in that selected range. Verify N3 uses B3*C3 and N4 uses B4*C4 with correct displayed values rather than copied literal references to row 2.
"""

[[criterion]]
id = "find_replace_navigation_atomic"
name = "find_replace_navigation_atomic"
type = "binary"
weight = 1.5
description = """
Through normal grid editing, put ALPHA target in A20, target-B in C20, and no-target in A21. Use only the app's visible find/replace controls, not browser find, direct API calls, DOM mutation, or manual cell-by-cell edits for the replacement steps. Search for target and press Find Next twice; verify the selected match advances from A20 to C20 rather than staying on the first match. Replace the current match with FOUND and verify C20 becomes FOUND while A20 still contains ALPHA target. Then use Replace All for target -> DONE and verify A20 becomes ALPHA DONE, A21 becomes no-DONE, and C20 remains FOUND. Press Undo once and verify A20, A21, and C20 return to their pre-Replace-All values together.
"""

[[criterion]]
id = "name_box_jump_and_range_selection"
name = "name_box_jump_and_range_selection"
type = "binary"
weight = 1.0
description = """
Use the visible name box or cell address box, not direct API calls or DOM mutation. Type T80 and press Enter; verify the grid scrolls or navigates to T80 and T80 becomes the selected cell. Type B2:D4 and press Enter; verify the selected range is exactly B2:D4 and the selection status shows B2:D4 or an equivalent selected-range label. Type BADREF and press Enter; verify the app rejects the invalid address without changing the selected B2:D4 range or crashing.
"""

[[criterion]]
id = "long_grid_scroll_save_reload_integrity"
name = "long_grid_scroll_save_reload_integrity"
type = "binary"
weight = 0.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use the visible custom grid and normal mouse/keyboard editing only; do not use the name box, find controls, direct API calls, DOM mutation, or hidden routes to reach or change the required cells. Verify A14 contains exactly ANCHOR-TOP. Use the grid's vertical scrollbar or mouse-wheel scrolling to reach row 40 and verify A40 contains exactly ANCHOR-MIDDLE, then continue scrolling to row 80 and verify A80 contains exactly ANCHOR-BOTTOM. Through normal cell editing, set B14 to TOP-EDIT-14, B40 to MIDDLE-EDIT-40, and B80 to BOTTOM-EDIT-80. Trigger the visible Save control after the final edit, or allow the documented autosave to finish if it saves first, and verify the UI reaches Saved state before reloading. Reload the page. Using the visible grid again, verify A14, A40, and A80 still contain their exact original anchor text and B14, B40, and B80 contain their exact respective edit markers. Verify the bottom rows, including row 80, remain reachable after reload and none of the six required values is blank, duplicated into another required cell, or shown in the wrong row.
"""

[[criterion]]
id = "undo_redo_separate_edits_and_redo_clear"
name = "undo_redo_separate_edits_and_redo_clear"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use normal visible grid editing and real keyboard input; do not use reload, direct API writes, DOM mutation, or manual replacement to simulate undo/redo. Confirm H30, H31, and H32 are blank. Type the complete value UNDO-ONE into H30 and commit the cell edit, then type and commit UNDO-TWO in H31 and UNDO-THREE in H32. Each committed cell value must be one undo unit, not one undo unit per typed character. Press Undo once using the visible Undo control or Ctrl/Cmd+Z and verify all of UNDO-THREE disappears from H32 together while H30 and H31 remain unchanged. Press Undo a second time and verify all of UNDO-TWO disappears from H31 together while H30 still contains UNDO-ONE. Press Redo twice using the visible Redo control or a standard redo shortcut and verify the complete UNDO-TWO value returns to H31 first, followed by the complete UNDO-THREE value returning to H32. Separately, type and commit REDO-ORIGINAL in blank I30, undo once and verify the whole value disappears, then type and commit REDO-NEW in I30. Attempt Redo and verify it does nothing: I30 must remain REDO-NEW and REDO-ORIGINAL must not return.
"""

[[criterion]]
id = "formulas_save_reload_as_raw_and_values"
name = "formulas_save_reload_as_raw_and_values"
type = "binary"
weight = 1.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use normal visible grid editing only; do not use direct API writes, DOM mutation, or hidden routes. Enter 10 in R10, 20 in R11, and 30 in R12. Enter the exact raw formula =SUM(R10:R12) in S10 and verify the grid displays 60. Enter the exact raw formula =S10*2 in T10 and verify the grid displays 120. Trigger the visible Save control, or allow the documented autosave to finish if it saves first, and verify the UI reaches Saved state before reloading. Reload the page. Verify S10 still displays 60 and T10 still displays 120. Select S10 and verify the formula bar or raw-value editor contains exactly =SUM(R10:R12), not the cached number 60. Select T10 and verify its raw value is exactly =S10*2, not the cached number 120. After reload, change R10 from 10 to 15 through normal cell editing and, without another reload or manual refresh, verify the restored formulas recalculate S10 to 65 and T10 to 130.
"""

[[criterion]]
id = "revision_history_preview_restore_undo"
name = "revision_history_preview_restore_undo"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use normal grid editing and the visible revision-history UI only; do not use direct API calls, DOM mutation, hidden routes, or reload to simulate preview, restore, or undo. Set N30 to REVISION-OLD and complete a successful manual save or documented autosave; record the resulting revision number. Then change N30 to REVISION-CURRENT, set O30 to CURRENT-ONLY, and complete another successful save so these states belong to two distinct saved revisions. Open revision history and verify both recorded revisions are listed with revision numbers and timestamps. Use Preview on the older recorded revision and verify its preview visibly contains REVISION-OLD while the live grid remains unchanged with N30=REVISION-CURRENT and O30=CURRENT-ONLY; previewing must not change the current revision, dirty state, or saved history. Use the visible Restore action on that older revision. Verify the live grid now has N30=REVISION-OLD and O30 blank, the UI shows Dirty rather than Saved, the current saved revision number does not advance, and no new revision is immediately created. Press Undo exactly once using the visible Undo control or standard shortcut. Verify the entire pre-restore workbook state returns together with N30=REVISION-CURRENT and O30=CURRENT-ONLY, and verify the saved revision history was not deleted or renumbered by preview, restore, or undo.
"""

[[criterion]]
id = "two_tab_stale_save_conflict"
name = "two_tab_stale_save_conflict"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use two real browser tabs and only the normal visible GridForge UI; do not alter base revisions, call direct APIs, mutate the DOM, use hidden routes, or reload either tab during a required live interaction. Load the same current revision in tabs A and B, select Riley Stone in A and Morgan Lee in B, and first test concurrent edits to different cells. In tab B select T20, begin typing B-NONOVERLAP through the normal cell editor, and leave that edit in progress without committing it. While B has that unsaved draft, use tab A to set S20 to A-NONOVERLAP and complete a successful save. Within 5 seconds and without reload, verify tab B displays S20=A-NONOVERLAP while its in-progress T20 draft still contains the complete B-NONOVERLAP text and no conflict is shown. Commit B's T20 edit and let it save. Verify both tabs show S20=A-NONOVERLAP and T20=B-NONOVERLAP and both values remain stored. Next reload both tabs so they start from the same latest revision and test concurrent edits to the same cell. In tab B select S21, begin typing TAB-B-LOCAL-DRAFT, and leave the edit in progress without committing. In tab A set that same S21 cell to TAB-A-WINS and save. Within 5 seconds and without reload, verify tab B preserves its complete local draft rather than replacing it with TAB-A-WINS, visibly reports a live conflict naming S21, and remains Dirty or failed rather than Saved. Commit and attempt to save tab B's conflicting draft; verify the save is rejected with a visible conflict and does not overwrite tab A. Only after that rejection, reload tab B and verify S21 contains TAB-A-WINS, not TAB-B-LOCAL-DRAFT, while S20 and T20 still contain the earlier non-overlapping values.
"""

[[criterion]]
id = "live_presence_and_clean_tab_updates"
name = "live_presence_and_clean_tab_updates"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use three real browser tabs showing GridForge and only visible UI interactions; do not use reload, polling or direct API reads, DOM mutation, hidden routes, or manually copy values between tabs to simulate live behavior. Set views A1 and A2 to Riley Stone and view B to Morgan Lee. Within 5 seconds, verify the visible presence UI identifies Riley Stone with exactly 2 open views and Morgan Lee with exactly 1 open view. In A1 set P30 to LIVE-RILEY and complete a save. Without reloading, verify both clean views A2 and B automatically advance to the new revision and display P30=LIVE-RILEY within 5 seconds; selecting P30 must identify Riley Stone as its saved editor. Close A2. Within 5 seconds, verify the remaining presence UI updates to Riley Stone with 1 open view and Morgan Lee with 1 open view, with no duplicate Riley entry or departed extra view. In view B set Q30 to LIVE-MORGAN and complete a save. Without reloading, verify clean view A1 automatically advances and displays Q30=LIVE-MORGAN within 5 seconds; selecting Q30 must identify Morgan Lee as its saved editor. The presence UI must remain usable and correct after both live updates.
"""

[[criterion]]
id = "live_remote_selection_boundaries_and_legend"
name = "live_remote_selection_boundaries_and_legend"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use three real browser tabs or windows showing GridForge and only normal visible grid interactions; do not use reload, polling, direct API reads or writes, DOM mutation, hidden routes, injected styles, or manually copied selection state. Set views A1 and A2 to Riley Stone and view B to Morgan Lee, and wait until all three appear in the visible presence UI. Select B2 in A1, select D4 in A2, and select the exact range C3:E4 in B using mouse drag or keyboard range selection. Without reloading, verify within 5 seconds that A1 shows a compact legend near the top with distinct colored entries mapping Riley Stone to B2, Riley Stone to D4, and Morgan Lee to C3:E4. The two Riley entries must use separate colors but must not invent visible labels such as Tab 1 or Tab 2. In A1, verify D4 and every cell in C3:E4 have visible boundary-only remote-selection colors matching their legend entries. Fail if the remote styling fills cell interiors, replaces or hides displayed values, inserts a name/address/badge over a cell, changes cell content, or makes normal cell editing unusable. Move B's selection from C3:E4 to F6 through the visible grid. Within 5 seconds, verify A1 removes every old Morgan boundary from C3:E4, changes Morgan's legend address to F6, and shows Morgan's boundary only at F6. Then select G7 in both A2 and B. Verify A1 shows two distinguishable colored boundary rings on G7 and two corresponding legend entries, one for Riley Stone and one for Morgan Lee; neither remote session may be hidden or collapsed into an unidentified marker. Close A2. Within 5 seconds, verify A1 removes A2's Riley legend entry and Riley boundary from G7 while Morgan's G7 legend entry and boundary remain. In still-open view B, change the visible user selector from Morgan Lee to Priya Shah without reloading and keep G7 selected. Within 5 seconds, verify A1 removes Morgan Lee's G7 legend entry, shows Priya Shah at G7 instead, and does not leave duplicate identities or an extra ghost boundary. Finally, in B move the selection through H8, I9, and J10 in quick succession using normal grid interactions. Within 5 seconds, verify A1's legend ends at Priya Shah — J10 and the grid shows Priya's boundary only at J10, with no stale Priya boundaries left on G7, H8, or I9. The local view's own selection may appear in the legend but must not be drawn as a remote boundary over itself.
"""

[[criterion]]
id = "forged_save_identity_and_stale_rejections"
name = "forged_save_identity_and_stale_rejections"
type = "binary"
weight = 2.0
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use direct in-page fetch calls from the app origin to test server-side enforcement; do not rely on disabled controls, UI validation, DOM mutation, or hidden routes. Discover the real workbook id, current revision, save endpoint, revision-list endpoint, visible user id, and live session id from the live app/API. Record the base revision and keep an unchanged deep copy of that base workbook. Make one legitimate save using the current base revision, current visible user id, and current live session id that changes T2 to CURRENT-T2. Verify it succeeds, advances the stored revision, and creates exactly one expected saved revision. Record this new current revision and revision list as the protected post-save state. Using the older base revision and stale base-workbook copy, attempt another save that changes the same T2 cell to FORGED-STALE-OVERWRITE. Require an HTTP 409 rejection that identifies T2 as conflicting; then re-read the real workbook and verify T2 is still exactly CURRENT-T2. Next attempt identity forgeries: save to an unknown workbook id in the URL, save to the real URL while sending a different top-level body workbookId, save to the real URL with the correct top-level workbookId but a different nested workbook.id inside the workbook payload, save with the current live session id but a different valid userId, and save with a totally unknown userId. Require a non-2xx response for every identity probe. After each rejection, re-read the real workbook. At the end, verify its id and T2 value are unchanged, its current revision is still the recorded protected revision, and its revision list is exactly unchanged from the protected post-save list. Any rejected request that mutates content, changes identity, creates a revision, or silently reports success fails this criterion.
"""

[[criterion]]
id = "api_rejects_invalid_revision_payloads"
name = "api_rejects_invalid_revision_payloads"
type = "binary"
weight = 1.5
description = """
This criterion is all-or-nothing: if any sub-check fails, mark it failed. Use direct in-page fetch calls from the app origin; do not use the visible Save control, DOM mutation, or hidden routes for these invalid-payload probes. Discover the real workbook id, current revision, save endpoint, and revision-list endpoint. Record an exact deep copy of the current workbook response and revision list. Using otherwise current data, independently attempt saves with: missing baseRevision; null baseRevision; baseRevision encoded as a string; a fractional baseRevision; a negative baseRevision; a future unknown baseRevision; missing workbook; null workbook; workbook as an array; a workbook object with the correct id but no sheets; a workbook with an empty sheets array; a sheet with missing cells; cells supplied as an array; an invalid cell address; a non-string cell value; a changed workbook title; a changed sheet id; and a changed sheet name. Every probe must return a non-2xx response. After all probes, re-read the real workbook and revisions and verify exact deep equality with the recorded state: content, workbook and sheet identities, current revision, and revision list must all be unchanged. Any partial write, new revision, silent normalization, server error in the 5xx range, or accepted malformed request fails this criterion.
"""

[scoring]
aggregation = "weighted_mean"
