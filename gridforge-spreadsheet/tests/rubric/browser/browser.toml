[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
mode = "batched"
timeout = 8400
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[[criterion]]
id = "workbook_load_custom_surface_status"
name = "workbook_load_custom_surface_status"
type = "binary"
weight = 0.5
description = """
Navigate to http://localhost:3000/. Verify GridForge loads without a login step, shows the workbook title "Northwind Operations Plan", shows the sheet name "Plan", exposes a spreadsheet/grid workspace, and shows row numbers, column letters, selected cell/range status, a formula bar or raw-value readout, current saved revision, and saved/dirty state.
"""

[[criterion]]
id = "custom_grid_no_spreadsheet_widget"
name = "custom_grid_no_spreadsheet_widget"
type = "binary"
weight = 2.0
description = """
Inspect the live DOM and loaded scripts. Verify the main editable grid is not a textarea, not a cell-per-input form, not contenteditable, and not Handsontable, AG Grid, Luckysheet, x-spreadsheet, HyperFormula, SheetJS-as-calculation-engine, or another spreadsheet/grid widget. A formula bar input outside the grid is allowed. Then edit a grid cell and verify workbook data changes through the custom surface.
"""

[[criterion]]
id = "save_reload_dirty_noop_persistence"
name = "save_reload_dirty_noop_persistence"
type = "binary"
weight = 0.5
description = """
Edit F2 to BASIC-SAVE-CHECK, save, reload, and verify F2 persists exactly once. Then edit F3 to UNSAVED-SHOULD-DISAPPEAR without saving, verify dirty state, reload, and verify F3 reverts while F2 remains. While saved and not dirty, attempt Save and verify no duplicate revision is created.
"""

[[criterion]]
id = "keyboard_selection_clipboard_ranges"
name = "keyboard_selection_clipboard_ranges"
type = "binary"
weight = 0.5
description = """
Use Arrow keys, Tab, Shift+Tab, Enter, and Shift+Enter to move through cells. Select rectangular ranges with mouse or keyboard. Copy, paste, cut, and clear ranges, including clipboard text copied from outside the app, and verify the selected workbook cells update without losing grid focus.
"""

[[criterion]]
id = "formula_bar_raw_formula_and_precedence"
name = "formula_bar_raw_formula_and_precedence"
type = "binary"
weight = 1.5
description = """
Select seeded formula cell D2 and verify the grid displays 360 while the formula bar preserves raw formula =B2*C2. Change it to =B2*(C2+10) and verify the display becomes 390 while the raw formula remains editable. Enter =2+3*4 and =(2+3)*4 in separate cells and verify they evaluate to 14 and 20.
"""

[[criterion]]
id = "cell_reference_dependency_recalculation"
name = "cell_reference_dependency_recalculation"
type = "binary"
weight = 2.0
description = """
Enter =B2*C2 in G4 and verify it evaluates from current B2 and C2. Change B2 to 4. Verify D2, G4, and any affected formulas recalculate immediately from the new B2 value without reload or manual refresh.
"""

[[criterion]]
id = "range_functions_dependency_recalculation"
name = "range_functions_dependency_recalculation"
type = "binary"
weight = 2.0
description = """
Enter formulas using SUM, AVG, MIN, MAX, and COUNT over B2:B4 in nearby cells. Verify each result is correct. Then change B4 from 5 to 8 and verify every dependent range formula recalculates correctly.
"""

[[criterion]]
id = "formula_errors_and_cycle_recovery"
name = "formula_errors_and_cycle_recovery"
type = "binary"
weight = 2.0
description = """
Enter =10/0 and verify a visible formula error rather than Infinity, blank, crash, or stale data. Enter an invalid formula such as =SUM( and verify a visible error while the app remains usable. Set H3 to =H4 and H4 to =H3, verify a visible circular-reference error, then replace H4 with 12 and verify H3 recalculates to 12.
"""

[[criterion]]
id = "tsv_range_paste_undo_redo_atomic"
name = "tsv_range_paste_undo_redo_atomic"
type = "binary"
weight = 1.5
description = """
Paste the tab-separated block "TSV-A\t11\t12\nTSV-B\t21\t22\nTSV-C\t31\t32" starting at J2. Verify it fills J2:L4 exactly. Press Undo once and verify the whole pasted range is removed together. Press Redo once and verify the whole range returns.
"""

[[criterion]]
id = "range_copy_cut_clear_undo_atomic"
name = "range_copy_cut_clear_undo_atomic"
type = "binary"
weight = 1.5
description = """
Select J2:L4, copy it, paste it starting at J6, and verify all 3 by 3 values are copied. Cut J6:L8 and verify the pasted copy is cleared. Press Undo once and verify the full cut range returns. Clear J6:L8 and verify one Undo restores the whole cleared range.
"""

[[criterion]]
id = "fill_numbers_and_formula_relative_refs"
name = "fill_numbers_and_formula_relative_refs"
type = "binary"
weight = 2.0
description = """
Put 1 in M2 and 2 in M3, select M2:M3, and use fill through M7. Verify M4:M7 become 3, 4, 5, and 6 and one Undo removes the fill extension as one edit. Enter =B2*C2 in N2, fill it through N4, and verify N3 uses B3*C3 and N4 uses B4*C4 with correct displayed values.
"""

[[criterion]]
id = "sort_preserves_rows_and_formulas"
name = "sort_preserves_rows_and_formulas"
type = "binary"
weight = 2.0
description = """
Use seeded table A9:D12. Sort rows 10:12 by Revenue descending. Verify West remains paired with 1500, 850, and its margin; North remains paired with 1200 and 700; South remains paired with 900 and 500. Formulas in sorted rows must still evaluate to the correct margin for their row.
"""

[[criterion]]
id = "filter_hides_without_deleting_rows"
name = "filter_hides_without_deleting_rows"
type = "binary"
weight = 1.0
description = """
Apply a text filter to the Region table that shows only rows containing South. Verify North and West are hidden from visible filtered rows while South remains visible. Clear the filter and verify North, South, and West all return with original row data intact.
"""

[[criterion]]
id = "long_grid_scroll_save_reload_integrity"
name = "long_grid_scroll_save_reload_integrity"
type = "binary"
weight = 0.5
description = """
Scroll or navigate to confirm ANCHOR-TOP, ANCHOR-MIDDLE, and ANCHOR-BOTTOM are present. Make one edit near each anchor, save, reload, and verify all three edits persisted without truncating, duplicating, or corrupting distant rows.
"""

[[criterion]]
id = "undo_redo_separate_edits_and_redo_clear"
name = "undo_redo_separate_edits_and_redo_clear"
type = "binary"
weight = 1.5
description = """
Make three edits in three different cells: P2=UNDO-ONE, P3=UNDO-TWO, and P4=UNDO-THREE. Press Undo twice and verify only P4 then P3 revert one step at a time. Press Redo twice and verify P3 then P4 return in order. Separately, type REDO-ORIGINAL in Q2, undo it, type REDO-NEW in Q2, and verify Redo cannot bring back REDO-ORIGINAL.
"""

[[criterion]]
id = "formulas_save_reload_as_raw_and_values"
name = "formulas_save_reload_as_raw_and_values"
type = "binary"
weight = 1.5
description = """
Enter =SUM(B2:B4) in R2 and save. Reload the page. Verify R2 displays the correct evaluated result and selecting R2 still exposes the raw formula =SUM(B2:B4), not only the computed number.
"""

[[criterion]]
id = "revision_history_preview_restore_undo"
name = "revision_history_preview_restore_undo"
type = "binary"
weight = 1.5
description = """
After at least two successful saves, open revision history. Verify it lists multiple revisions with revision numbers and timestamps. Preview an older revision without replacing the current draft. Restore an older revision as the current draft, verify the workbook becomes dirty, press Undo once, and verify the pre-restore draft returns.
"""

[[criterion]]
id = "two_tab_stale_save_conflict"
name = "two_tab_stale_save_conflict"
type = "binary"
weight = 2.0
description = """
Open GridForge in two browser pages/tabs. In tab A, edit S2 to TAB-A-WINS and save. In tab B, without reloading, edit S2 to TAB-B-STALE and try to save. Verify tab B gets a visible conflict/stale revision message and TAB-B-STALE does not overwrite TAB-A-WINS. Re-read or reload the workbook and verify TAB-A-WINS remains stored.
"""

[[criterion]]
id = "forged_save_identity_and_stale_rejections"
name = "forged_save_identity_and_stale_rejections"
type = "binary"
weight = 2.0
description = """
Use direct in-page fetch calls to test server-side save enforcement. A stale baseRevision with FORGED-STALE-OVERWRITE must be rejected and must not store that marker. A request to an unknown workbook id and a request whose URL workbook id differs from the body workbookId must also be rejected without altering the real workbook.
"""

[[criterion]]
id = "api_rejects_invalid_revision_payloads"
name = "api_rejects_invalid_revision_payloads"
type = "binary"
weight = 1.5
description = """
Use direct in-page fetch calls to attempt saves with missing baseRevision, non-integer baseRevision, or missing workbook data. Each invalid save must be rejected and must not change the stored workbook or create a new revision.
"""

[scoring]
aggregation = "weighted_mean"
