schema_version = "1.4"

artifacts = ["/app"]

[task]
name = "webdev/patchpad-editor"
version = "1.0.0"
description = "Build PatchPad, a browser-based custom text editor for long incident reports. The task stresses non-CRUD editor behavior: a from-scratch editing surface, cursor and selection semantics, undo/redo granularity, find/replace offset correctness, persistence, revision history, and stale-save conflict enforcement."
authors = [{ name = "Turing WebDev", email = "webdev@turing.com" }]
keywords = ["vibe-code", "webdev", "fullstack", "nodejs", "sqlite", "custom-editor", "text-editor", "revision-control"]

[metadata]
category = "web-development"
difficulty = "hard"
difficulty_explanation = """
PatchPad is intentionally small in product surface but deep in behavior. Models
that build a native textarea or contenteditable wrapper can satisfy the visual
shape but fail the required custom editing surface. Models that build a pretty
custom surface usually miss editor invariants: preferred-column vertical
movement, joining lines at boundaries, selection replacement, undo/redo
granularity, redo invalidation, and find/replace when replacement lengths
change offsets.

The backend difficulty is revision integrity. The app must reject stale saves
from another tab and forged stale-save requests rather than silently overwriting
newer content. The verifier weights easy visual checks cheaply and gives the
largest weights to behavior that shallow implementations usually skip.
"""
task_id = "WEBDEV-PATCHPAD-EDITOR-001"
capabilities = ["frontend-ui", "custom-input", "backend-api", "persistence", "concurrency-control"]

[agent]
timeout_sec = 10800.0
network_mode = "public"

[verifier]
timeout_sec = 10800.0
network_mode = "public"

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
ANTHROPIC_BASE_URL = "https://openrouter.ai/api"
ANTHROPIC_AUTH_TOKEN = "${OPENROUTER_API_KEY}"
ANTHROPIC_API_KEY = ""
CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY = "1"
REWARDKIT_JUDGE = "claude-code"
REWARDKIT_MODEL = "anthropic/claude-sonnet-5"
REWARDKIT_TIMEOUT_SEC = "9000"

[solution]
env = {}

[environment]
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 10240
network_mode = "public"

[environment.env]
PORT = "3000"
BASE_URL = "http://localhost:3000"
APP_PUBLIC_URL = "http://localhost:3000"
APP_PUBLIC_PORT = "3000"
