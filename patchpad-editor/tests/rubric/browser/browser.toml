[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
mode = "batched"
timeout = 8400
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[[criterion]]
id = "app_loads_seed_document"
name = "app_loads_seed_document"
type = "binary"
weight = 0.5
description = """
Navigate to http://localhost:3000/. Verify PatchPad loads without a login step, shows the seeded document title "Northwind API Incident Report", and exposes a document/editor workspace rather than a generic CRUD table.
"""

[[criterion]]
id = "custom_editor_no_native_editing_surface"
name = "custom_editor_no_native_editing_surface"
type = "binary"
weight = 2.0
description = """
Inspect the live DOM. Verify the main document editing surface is not a `<textarea>`, not an `<input>`, and not `contenteditable=true`. Also verify no Monaco, CodeMirror, ProseMirror, TipTap, Quill, Slate, or Draft.js editor root/library is being used for the editing surface. Search/replace inputs outside the editor are allowed. Then click the custom editor and type a short marker such as CUSTOM-SURFACE-PROOF; verify the marker appears in the document, proving the custom surface actually edits text.
"""

[[criterion]]
id = "line_numbers_cursor_and_status"
name = "line_numbers_cursor_and_status"
type = "binary"
weight = 0.5
description = """
Verify the editor shows seeded document text immediately after load before typing anything, including line numbers, a visible cursor or cursor-position readout, the current saved revision, and a saved/dirty state indicator. The Save action must be unavailable or a no-op while the document is already saved and not dirty. The position must update after moving or typing in the editor.
"""

[[criterion]]
id = "basic_insert_delete_save_reload"
name = "basic_insert_delete_save_reload"
type = "binary"
weight = 1.0
description = """
In the custom editor, insert the text BASIC-SAVE-CHECK near the top of the document, delete one extra character next to it with Backspace or Delete, save the document, reload the page, and verify BASIC-SAVE-CHECK remains exactly once. This must be a real persisted edit, not only a rendered overlay.
"""

[[criterion]]
id = "dirty_state_and_unsaved_reload"
name = "dirty_state_and_unsaved_reload"
type = "binary"
weight = 1.0
description = """
Type UNSAVED-SHOULD-DISAPPEAR into the editor but do not save. Verify the UI marks the document dirty. Reload the page and verify UNSAVED-SHOULD-DISAPPEAR is absent while the previously saved BASIC-SAVE-CHECK remains. Unsaved text must not become persisted merely by reload.
"""

[[criterion]]
id = "left_right_cross_line_boundaries"
name = "left_right_cross_line_boundaries"
type = "binary"
weight = 1.0
description = """
Use keyboard navigation in the editor to place the caret at the end of a line near the top. Press ArrowRight and verify the caret moves to the start of the next logical line. Then press ArrowLeft and verify it returns to the end of the previous line. This must work through the custom editor surface, not a hidden native text field.
"""

[[criterion]]
id = "up_down_preferred_column"
name = "up_down_preferred_column"
type = "binary"
weight = 1.5
description = """
Create or find three nearby lines where the first and third are long and the middle is short. Place the caret around column 24 on the first long line, press ArrowDown to the short line, then ArrowDown to the next long line. Verify the middle line clamps the caret and the third line restores the intended visual column instead of staying at the short-line column.
"""

[[criterion]]
id = "home_end_current_line_only"
name = "home_end_current_line_only"
type = "binary"
weight = 1.0
description = """
Place the caret in the middle of a generated log line. Press Home and verify the caret moves to the start of that same logical line, not the document start. Press End and verify it moves to the end of that same logical line, not the document end.
"""

[[criterion]]
id = "backspace_line_join"
name = "backspace_line_join"
type = "binary"
weight = 1.5
description = """
Create two adjacent short lines, for example JOIN-LEFT and JOIN-RIGHT. Put the caret at the start of JOIN-RIGHT and press Backspace. Verify the two lines become one line JOIN-LEFTJOIN-RIGHT, with no lost or duplicated surrounding text. Save is not required for this criterion.
"""

[[criterion]]
id = "delete_line_join"
name = "delete_line_join"
type = "binary"
weight = 1.5
description = """
Create two adjacent short lines, for example DELETE-LEFT and DELETE-RIGHT. Put the caret at the end of DELETE-LEFT and press Delete. Verify the two lines become one line DELETE-LEFTDELETE-RIGHT, with no lost or duplicated surrounding text.
"""

[[criterion]]
id = "selection_replacement"
name = "selection_replacement"
type = "binary"
weight = 1.5
description = """
Select only the word "temporary" in the seeded action item "TODO: Replace temporary dashboard link before publishing." Type permanent. Verify the line now says "TODO: Replace permanent dashboard link before publishing." and the words before and after the selection remain intact.
"""

[[criterion]]
id = "triple_click_selects_line"
name = "triple_click_selects_line"
type = "binary"
weight = 0.5
description = """
Triple-click a generated log line in the custom editor. Verify the whole logical line is selected, not just one word or a paragraph fragment. Type TRIPLE-CLICK-LINE and verify the entire selected line is replaced with that text while the previous and next lines remain intact.
"""

[[criterion]]
id = "double_click_selects_word"
name = "double_click_selects_word"
type = "binary"
weight = 0.5
description = """
Double-click a single word in the custom editor, such as checkout or latency in the seeded incident text. Verify exactly that word is selected. Type WORD-DOUBLE-CLICK and verify only the selected word is replaced, while the rest of the line remains intact.
"""

[[criterion]]
id = "shift_arrow_selection_replacement"
name = "shift_arrow_selection_replacement"
type = "binary"
weight = 1.5
description = """
Using only keyboard selection, place the caret before the word "rollback" in the seeded rollback checklist TODO, hold Shift and extend the selection over that word, then type recovery. Verify only that word is replaced and the rest of the action item remains intact.
"""

[[criterion]]
id = "keyboard_selection_autoscroll"
name = "keyboard_selection_autoscroll"
type = "binary"
weight = 1.5
description = """
Place the caret near the bottom of the visible editor viewport, then hold or repeatedly press Shift+ArrowDown enough times to extend the selection beyond the visible bottom. Verify the editor scrolls downward while the selection continues onto later lines, rather than stopping at the viewport edge or losing the selection.
"""

[[criterion]]
id = "mouse_drag_selection_autoscroll"
name = "mouse_drag_selection_autoscroll"
type = "binary"
weight = 1.5
description = """
Start a mouse drag range selection near the bottom of the visible editor viewport and drag below the editor's visible bottom edge. Verify the editor scrolls downward and the selection continues onto later lines, rather than stopping at the viewport edge or selecting only currently visible text.
"""

[[criterion]]
id = "undo_contiguous_typing_group"
name = "undo_contiguous_typing_group"
type = "binary"
weight = 1.5
description = """
Click one location in the custom editor and type the contiguous word TYPING-GROUP-CHECK without moving the caret or clicking elsewhere. Press Undo once and verify the whole word disappears together, not one character at a time. Press Redo once and verify the whole word returns together.
"""

[[criterion]]
id = "copy_cut_paste_shortcuts"
name = "copy_cut_paste_shortcuts"
type = "binary"
weight = 1.5
description = """
Use the custom editor's keyboard shortcuts rather than browser-native textarea behavior. First put EXTERNAL-CLIPBOARD-PASTE on the real browser clipboard from outside the editor, focus the custom editor, press Ctrl/Cmd+V, and verify that external clipboard text is inserted. Then select a distinctive short phrase in the document and press Ctrl/Cmd+C, move elsewhere, press Ctrl/Cmd+V, and verify the exact copied phrase is inserted. Then select that inserted phrase, press Ctrl/Cmd+X, verify it is removed, press Undo once, and verify the cut phrase returns. Also press Ctrl/Cmd+A in the editor and verify the full document is selected rather than only a search input or nothing.
"""

[[criterion]]
id = "undo_separate_locations_are_separate_steps"
name = "undo_separate_locations_are_separate_steps"
type = "binary"
weight = 1.5
description = """
Make three edits in three different locations: type LOCATION-ONE near the top, click a different line and type LOCATION-TWO, then click a third line and type LOCATION-THREE. Press Undo once and verify only LOCATION-THREE disappears while LOCATION-ONE and LOCATION-TWO remain. Press Undo again and verify only LOCATION-TWO disappears. Press Redo twice and verify LOCATION-TWO and then LOCATION-THREE return in order. This catches editors that group unrelated typing runs into one oversized undo step.
"""

[[criterion]]
id = "undo_paste_cut_replace_atomic"
name = "undo_paste_cut_replace_atomic"
type = "binary"
weight = 1.5
description = """
Verify compound edit operations are atomic in undo history. Paste the multi-line text "PASTE-A\nPASTE-B\nPASTE-C" and confirm one Undo removes the whole paste and one Redo restores it. Then select a short phrase, cut it with Ctrl/Cmd+X, and confirm one Undo restores the whole cut phrase. Finally replace one selected word with REPLACE-ATOMIC and confirm one Undo restores the original word.
"""

[[criterion]]
id = "redo_cleared_after_new_edit"
name = "redo_cleared_after_new_edit"
type = "binary"
weight = 1.5
description = """
Type REDO-CLEAR-ORIGINAL, then press Undo once so it disappears. Type REDO-CLEAR-NEW at the same location. Attempt Redo using the visible control and keyboard shortcut. Verify REDO-CLEAR-ORIGINAL does not return and REDO-CLEAR-NEW remains. A new edit after undo must clear the old redo path rather than resurrecting stale future content.
"""

[[criterion]]
id = "find_counts_and_next_wrap"
name = "find_counts_and_next_wrap"
type = "binary"
weight = 1.0
description = """
Search for TODO. Verify the UI reports multiple matches from the seeded action items. Repeatedly use Find Next until it passes the last TODO and verify it wraps back to the first TODO without losing the active match/selection.
"""

[[criterion]]
id = "replace_current_only"
name = "replace_current_only"
type = "binary"
weight = 1.5
description = """
Search for TODO and use Replace Current with FOLLOWUP. Verify exactly one active TODO changes to FOLLOWUP and the remaining TODO occurrences are still present. Replace Current must not behave like Replace All.
"""

[[criterion]]
id = "replace_all_length_changing"
name = "replace_all_length_changing"
type = "binary"
weight = 2.0
description = """
Search for ALPHA-00 and replace all matches with INCIDENT-MARKER-00, a longer string. Verify every occurrence that previously contained ALPHA-00 in the visible/API document text changed exactly once, later generated markers are not corrupted or skipped, and tail text including OMEGA-END-ANCHOR remains intact. This catches offset drift when replacement length differs from the query.
"""

[[criterion]]
id = "long_document_top_middle_bottom_integrity"
name = "long_document_top_middle_bottom_integrity"
type = "binary"
weight = 2.0
description = """
Make one edit near the top of the document, one around generated marker ALPHA-0600, and one near the tail sentinel OMEGA-END-ANCHOR. Save and reload. Verify all three edits persisted and unrelated anchors near ALPHA-0001, ALPHA-0600, ALPHA-1200, and OMEGA-END-ANCHOR are still present and not duplicated or truncated.
"""

[[criterion]]
id = "revision_history_records_versions"
name = "revision_history_records_versions"
type = "binary"
weight = 1.0
description = """
After at least two successful saves, open the revision history. Verify it lists multiple revisions with revision numbers and timestamps. Preview an older revision and verify it shows older text without replacing or corrupting the current draft. Then restore an older revision as the current draft, verify the editor becomes dirty and shows the older content, press Undo once, and verify the pre-restore draft returns. Save is not required after restore for this criterion.
"""

[[criterion]]
id = "unchanged_save_no_revision"
name = "unchanged_save_no_revision"
type = "binary"
weight = 1.0
description = """
With the document in a saved/not-dirty state, record the current revision number and revision-history count. Attempt to save without making any edit, through the visible Save control if available and also with a direct in-page fetch using the current content and current baseRevision. Verify no new revision is created, the current revision number does not increase, and the app either disables Save or reports that there are no changes to save.
"""

[[criterion]]
id = "two_tab_stale_save_ui_conflict"
name = "two_tab_stale_save_ui_conflict"
type = "binary"
weight = 2.0
description = """
Open PatchPad in two browser pages/tabs. In tab A, make and save a marker TAB-A-WINS. In tab B, without reloading, make a different edit TAB-B-STALE and try to save. Verify tab B gets a visible conflict/stale revision message and TAB-B-STALE does not overwrite TAB-A-WINS. Re-read or reload the document and verify TAB-A-WINS remains stored.
"""

[[criterion]]
id = "forged_stale_save_rejected"
name = "forged_stale_save_rejected"
type = "binary"
weight = 2.0
description = """
From the page, discover the current document id and current revision. First save a marker FORGED-CURRENT-SAVE through the normal UI or API with the current revision so the stored revision advances. Then use JavaScript evaluation to send the app's save request directly with the older stale baseRevision and content containing FORGED-STALE-OVERWRITE. The server must refuse the stale save with an error status or explicit conflict and must not store FORGED-STALE-OVERWRITE. Re-read the document from the API to confirm.
"""

[[criterion]]
id = "forged_document_id_tampering_rejected"
name = "forged_document_id_tampering_rejected"
type = "binary"
weight = 2.0
description = """
Use JavaScript evaluation from the page to forge save requests that tamper with document identity: one request to an unknown document id, and one request whose URL document id differs from the body documentId. Both must be rejected and must not alter the real seeded document. Re-read the real document and verify its content and latest revision are unchanged by these probes.
"""

[[criterion]]
id = "multi_caret_alt_click"
name = "multi_caret_alt_click"
type = "binary"
weight = 1.5
description = """
Create at least three carets using Alt+Click or Ctrl/Cmd+Click in different lines. Type MULTI. Verify MULTI is inserted at every caret location in document order and all insertions remain on the expected lines rather than drifting to adjacent lines. Press Undo once and verify all MULTI insertions disappear together. Create multiple carets immediately after existing characters, press Backspace once, and verify one character is removed at every active caret as a single edit. Press Undo once and verify all removed characters return. Create multiple carets immediately before existing characters, press Delete once, and verify one character is removed at every active caret as a single edit. Press Undo once and verify all removed characters return.
"""

[[criterion]]
id = "api_rejects_missing_or_invalid_revision"
name = "api_rejects_missing_or_invalid_revision"
type = "binary"
weight = 1.5
description = """
Use direct in-page fetch calls to attempt saves with missing baseRevision, non-integer baseRevision, or missing content. Each invalid save must be rejected and must not change the stored document or create a new revision.
"""

[scoring]
aggregation = "weighted_mean"
