[judge]
judge = "claude-code"
model = "anthropic/claude-sonnet-5"
mode = "batched"
timeout = 8400
isolated = false
prompt_template = "prompt.md"
weight = 1.0

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "playwright-mcp"
args = ["--headless", "--isolated", "--browser=chromium", "--no-sandbox"]

[[criterion]]
id = "app_loads_seed_document"
name = "app_loads_seed_document"
type = "binary"
weight = 0.5
description = """
Navigate to http://localhost:3000/. Verify PatchPad loads without a login step, shows the seeded document title "Northwind API Incident Report", and exposes a document/editor workspace rather than a generic CRUD table.
"""

[[criterion]]
id = "custom_editor_no_native_editing_surface"
name = "custom_editor_no_native_editing_surface"
type = "binary"
weight = 0.5
description = """
Inspect the live DOM. Verify the main document editing surface is not a textarea, not an input, and not contenteditable=true. Also verify no Monaco, CodeMirror, ProseMirror, TipTap, Quill, Slate, or Draft.js editor root/library is being used for the editing surface. Search/replace inputs outside the editor are allowed. Then click the custom editor and type CUSTOM-SURFACE-PROOF; verify the marker appears in the document.
"""

[[criterion]]
id = "seed_status_and_noop_save"
name = "seed_status_and_noop_save"
type = "binary"
weight = 0.5
description = """
Verify the seeded document text is visible immediately after load before typing, with line numbers, cursor or position readout, current saved revision, and saved/dirty state. While the document is saved and not dirty, attempt Save and verify no new revision is created and the app disables Save or reports no changes.
"""

[[criterion]]
id = "edit_save_reload_and_dirty_reload"
name = "edit_save_reload_and_dirty_reload"
type = "binary"
weight = 0.5
description = """
Insert BASIC-SAVE-CHECK near the top, save, reload, and verify it persists exactly once. Then type UNSAVED-SHOULD-DISAPPEAR without saving, verify dirty state, reload, and verify the unsaved marker is gone while BASIC-SAVE-CHECK remains.
"""

[[criterion]]
id = "keyboard_navigation_and_home_end"
name = "keyboard_navigation_and_home_end"
type = "binary"
weight = 0.5
description = """
Use ArrowLeft, ArrowRight, ArrowUp, ArrowDown, Home, and End in the custom editor. Verify left/right cross logical line boundaries, up/down preserve the intended visual column where possible, and Home/End move within the current logical line.
"""

[[criterion]]
id = "backspace_delete_line_join"
name = "backspace_delete_line_join"
type = "binary"
weight = 0.5
description = """
Create adjacent short lines JOIN-LEFT and JOIN-RIGHT. Verify Backspace at the start of JOIN-RIGHT joins them into JOIN-LEFTJOIN-RIGHT. Recreate adjacent lines and verify Delete at the end of JOIN-LEFT joins them the same way, without lost or duplicated text.
"""

[[criterion]]
id = "selection_word_line_keyboard_replace"
name = "selection_word_line_keyboard_replace"
type = "binary"
weight = 0.5
description = """
Verify standard selection and replacement: double-click selects one word and typing replaces only that word, triple-click selects one logical line, mouse range selection replaces only the selected text, and Shift+Arrow keyboard selection can replace one selected word without changing surrounding text.
"""

[[criterion]]
id = "selection_autoscroll_mouse_keyboard"
name = "selection_autoscroll_mouse_keyboard"
type = "binary"
weight = 0.5
description = """
In the long seeded document, extend selection beyond the visible editor using Shift+Arrow and using mouse drag past the editor edge. Verify the editor scrolls and the selected range continues through off-screen text instead of stopping at the viewport.
"""

[[criterion]]
id = "clipboard_shortcuts_external_internal"
name = "clipboard_shortcuts_external_internal"
type = "binary"
weight = 0.5
description = """
Put EXTERNAL-CLIPBOARD-PASTE on the real browser clipboard from outside the editor, focus PatchPad, press Ctrl/Cmd+V, and verify it inserts. Then select a phrase in PatchPad, use Ctrl/Cmd+C and Ctrl/Cmd+V elsewhere, verify exact copied text inserts, use Ctrl/Cmd+X to cut it, and verify one Undo restores the cut phrase. Ctrl/Cmd+A must select the full document.
"""

[[criterion]]
id = "undo_contiguous_typing_group"
name = "undo_contiguous_typing_group"
type = "binary"
weight = 2.0
description = """
Click one location in the custom editor and type the contiguous word TYPING-GROUP-CHECK without moving the caret or clicking elsewhere. Press Undo once and verify the whole word disappears together, not one character at a time. Press Redo once and verify the whole word returns together.
"""

[[criterion]]
id = "undo_separate_locations_and_redo_clear"
name = "undo_separate_locations_and_redo_clear"
type = "binary"
weight = 0.5
description = """
Make three edits in three different locations: LOCATION-ONE, LOCATION-TWO, and LOCATION-THREE. Press Undo twice and verify only the last two edits disappear one step at a time, then Redo twice restores them in order. Separately, type REDO-CLEAR-ORIGINAL, undo it, type REDO-CLEAR-NEW, and verify Redo does not resurrect REDO-CLEAR-ORIGINAL.
"""

[[criterion]]
id = "undo_paste_cut_replace_atomic"
name = "undo_paste_cut_replace_atomic"
type = "binary"
weight = 2.0
description = """
Verify compound edit operations are atomic in undo history. Paste the multi-line text "PASTE-A\nPASTE-B\nPASTE-C" and confirm one Undo removes the whole paste and one Redo restores it. Then select a short phrase, cut it with Ctrl/Cmd+X, and confirm one Undo restores the whole cut phrase. Finally replace one selected word with REPLACE-ATOMIC and confirm one Undo restores the original word.
"""

[[criterion]]
id = "find_replace_current_and_all"
name = "find_replace_current_and_all"
type = "binary"
weight = 0.5
description = """
Use find and replace controls. Search TODO and verify multiple matches and Find Next wraps back to the first match. Replace Current with FOLLOWUP and verify exactly one TODO changes. Then replace all ALPHA-00 with INCIDENT-MARKER-00 and verify every matching occurrence changes exactly once without corrupting later markers or OMEGA-END-ANCHOR.
"""

[[criterion]]
id = "long_document_integrity_save_reload"
name = "long_document_integrity_save_reload"
type = "binary"
weight = 0.5
description = """
Make one edit near the top, one around ALPHA-0600, and one near OMEGA-END-ANCHOR. Save and reload. Verify all three edits persisted and unrelated anchors near ALPHA-0001, ALPHA-0600, ALPHA-1200, and OMEGA-END-ANCHOR are still present and not duplicated or truncated.
"""

[[criterion]]
id = "revision_history_records_versions"
name = "revision_history_records_versions"
type = "binary"
weight = 1.5
description = """
After at least two successful saves, open the revision history. Verify it lists multiple revisions with revision numbers and timestamps. Preview an older revision and verify it shows older text without replacing or corrupting the current draft. Then restore an older revision as the current draft, verify the editor becomes dirty and shows the older content, press Undo once, and verify the pre-restore draft returns. Save is not required after restore for this criterion.
"""

[[criterion]]
id = "two_tab_stale_save_ui_conflict"
name = "two_tab_stale_save_ui_conflict"
type = "binary"
weight = 0.5
description = """
Open PatchPad in two browser pages/tabs. In tab A, make and save TAB-A-WINS. In tab B, without reloading, make TAB-B-STALE and try to save. Verify tab B gets a visible conflict/stale revision message and TAB-B-STALE does not overwrite TAB-A-WINS. Re-read or reload the document and verify TAB-A-WINS remains stored.
"""

[[criterion]]
id = "direct_api_save_rejections"
name = "direct_api_save_rejections"
type = "binary"
weight = 0.5
description = """
Use direct in-page fetch calls to verify server-side save enforcement. A stale baseRevision must be rejected and must not store FORGED-STALE-OVERWRITE. An unknown document id, a URL/body documentId mismatch, missing baseRevision, non-integer baseRevision, and missing content must all be rejected without changing the real document or creating a new revision.
"""

[[criterion]]
id = "multi_caret_alt_click"
name = "multi_caret_alt_click"
type = "binary"
weight = 2.0
description = """
Create at least three carets using Alt+Click or Ctrl/Cmd+Click in different lines. Type MULTI. Verify MULTI is inserted at every caret location in document order and all insertions remain on the expected lines rather than drifting to adjacent lines. Press Undo once and verify all MULTI insertions disappear together. Create multiple carets immediately after existing characters, press Backspace once, and verify one character is removed at every active caret as a single edit. Press Undo once and verify all removed characters return. Create multiple carets immediately before existing characters, press Delete once, and verify one character is removed at every active caret as a single edit. Press Undo once and verify all removed characters return.
"""

[[criterion]]
id = "visible_errors_and_discoverable_controls"
name = "visible_errors_and_discoverable_controls"
type = "binary"
weight = 0.5
description = """
Verify Save, Undo, Redo, find next, replace current, replace all, document header/list, revision history, and visible error/status areas are discoverable by intent. Invalid or rejected actions must surface visible feedback rather than failing silently.
"""

[[criterion]]
id = "server_persistence_not_browser_storage"
name = "server_persistence_not_browser_storage"
type = "binary"
weight = 0.5
description = """
After a saved edit, inspect or use the app API to verify the saved content comes from the server-backed document, not only localStorage/sessionStorage/client memory. Reloading in a fresh page must show the last saved server content.
"""

[scoring]
aggregation = "weighted_mean"
